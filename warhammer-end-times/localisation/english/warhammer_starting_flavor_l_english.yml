l_english:
 wet_starting_flavor.continue:0 "Our story is not yet written."
 wet_starting_flavor.A01.t:0 "Reikland and the End Times"
 wet_starting_flavor.A01.d:0 "Reikland is the Emperor's heartland, a rich province whose roads and river trade sustain Altdorf. Karl Franz holds Sigmar's imperial title, but the other Imperial realms begin this struggle independent of his government. Their allegiance must be earned, not assumed.\n\nSigmar united the tribes against enemies no tribe could defeat alone. Centuries of electoral bargains, civil wars and vampire invasions have tested that achievement. Reikland inherited imperial prestige and powerful institutions, but also the quarrels that repeatedly left the Empire exposed.\n\nAs the End Times approach, Archaon gathers in the north, Sylvania watches the divided provinces, and Beastmen haunt the roads between them. Reikland leads the Grand Alliance, but stands as its sole founding member; the independent realms must still choose whether to join. Reconciliation, preparations against the dead and winning partners for the coalition are tasks the Emperor can pursue together."
 wet_starting_flavor.A02.t:0 "Wissenland and the End Times"
 wet_starting_flavor.A02.d:0 "Wissenland is a proud southern Imperial province whose ruler, Emmanuelle von Liebwitz, must reconcile noble privilege with the demands of defence. Its ties to Nuln's foundries are valuable, but Nuln begins as a separate realm whose cooperation cannot be assumed.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A03.t:0 "Hochland and the End Times"
 wet_starting_flavor.A03.d:0 "Hochland is a province of deep forests, lumber roads, inns, and marksmen who know that a single patient shot can matter more than a dozen shouted orders. Hergig's court watches the Empire's troubles through branches, smoke, and the long barrel of the Hochland long rifle.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A04.t:0 "Middenland and the End Times"
 wet_starting_flavor.A04.d:0 "Middenland remembers when the north spoke with greater force in Imperial politics. Middenheim still rises like a challenge above the Drakwald, and Ulric's flame burns there with a pride no Reiklander sermon can soften.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A05.t:0 "Stirland and the End Times"
 wet_starting_flavor.A05.d:0 "Stirland is poor, damp, stubborn, and uncomfortably close to places that decent folk prefer to mention only after locking the door. Its fields are hard, its roads are watched, and its villages have learned that mist from Sylvania rarely brings anything good.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A06.t:0 "Averland and the End Times"
 wet_starting_flavor.A06.d:0 "Averland is bright with cattle wealth, black-and-yellow pride, good horses, better beer, and the uneasy knowledge that Black Fire Pass has saved the Empire more than once. Its prosperity is real, but so is the road by which ruin can enter.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A07.t:0 "Ostland and the End Times"
 wet_starting_flavor.A07.d:0 "Ostland is not comfortable, fashionable, or rich enough for softer provinces to envy. That is part of its strength.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A08.t:0 "Talabecland and the End Times"
 wet_starting_flavor.A08.d:0 "Talabecland lies at the center of the Empire, where rivers, roads, forests, and old provincial pride all meet. Its people honor Taal and Rhya with a seriousness outsiders mistake for rustic simplicity, usually shortly before a Talabeclander proves the woods were listening.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A09.t:0 "Ostermark and the End Times"
 wet_starting_flavor.A09.d:0 "Ostermark is a league of towns pretending, with admirable desperation, that mutual fear is a stable constitution. Between Kislev, Sylvania, the World's Edge Mountains, and the ruins of Mordheim, that pretense may be the only reason the east still answers to the Empire at all.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A10.t:0 "Nordland and the End Times"
 wet_starting_flavor.A10.d:0 "Nordland faces the Sea of Claws with timber, salt, claims, and a nervous awareness that water brings wealth and raiders by the same wind. The Empire is not known for seamanship, but Nordland has little choice except to learn what Altdorf neglects.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A12.t:0 "Westerland and the End Times"
 wet_starting_flavor.A12.d:0 "Westerland lives by contracts that the rest of the Empire still calls treason. Marienburg bought its freedom with coin, nerve, and foreign guarantees, and every merchant prince in the counting houses knows that independence remains a debt that must be paid daily.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten Marienburg's shipping and the political bargains behind its independence. Reikland remembers the lost province, northern raiders covet the coast and every interrupted route weakens the treasury. Westerland must make its freedom defensible before wealth becomes merely the prize an enemy expects to seize."
 wet_starting_flavor.A13.t:0 "Sylvania and the End Times"
 wet_starting_flavor.A13.d:0 "Sylvania has long been the Empire's neglected eastern shadow, a land of mistbound villages, haunted forests, and castles whose masters answer poorly to distant authority. From Castle Drakenhof, Vlad von Carstein transformed that forsaken province into the seat of a deathless dynasty. His bid for the Imperial throne began the Vampire Wars, and the campaigns of Konrad and Mannfred carried the von Carstein claim through generations of bloodshed. The living remember those wars as a warning; we remember an inheritance left unclaimed.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nSylvania begins at peace with Reikland, and Mannfred can exploit the independence and rivalries of the other Imperial realms. Yet the End Times bring dangers greater than another Vampire War: Chaos threatens his future subjects, while Nagash's ambitions could reduce a would-be emperor to a servant. Every expansion must strengthen his freedom as well as his armies."
 wet_starting_flavor.A14.t:0 "The Moot and the End Times"
 wet_starting_flavor.A14.d:0 "The Moot began, depending on who is telling the story, as Imperial generosity, political insult, legal accident, or an excellent joke that became too useful to repeal. Halflings know better than to correct every human version.\n\nImperial charters gave the Halflings of the Moot a home and a political voice that outsiders often underestimated. Generations of farming, trade and service within the Empire preserved a distinct people whose prosperity depended on larger neighbours respecting a smaller realm's rights.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A15.t:0 "Bretonnia and the End Times"
 wet_starting_flavor.A15.d:0 "Louen Leoncoeur rules Bretonnia from Couronne, but Mousillon stands apart beneath Mallobaude's rebel banner, holding Bordeleaux, Bastonne and Chalons as well as its cursed heartland. The two realms begin at peace, though the crown has not surrendered its claim. Bretonnia's knights offer dazzling courage; the people who feed their horses need that courage to mean protection.\n\nGilles le Breton and his companions forged the realm through victories sanctified by the Lady. Their descendants made chivalry the language of rule, but generations of privilege, rivalry and the shadow of cursed Mousillon left wounds beneath the heraldry.\n\nAs the End Times approach, the old privileges that bind Bretonnia together also hinder its learning, while its roads, workshops and musters need renewal. War with Mousillon, whoever begins it, will test the oaths the Crown has secured; Kairos Fateweaver's approaching breach and Kemmler's northern mountain court pose dangers of their own. Beyond these struggles lies the Everchosen, and the choice of when a united kingdom can answer with an Errantry war."
 wet_starting_flavor.A20.t:0 "Mousillon and the End Times"
 wet_starting_flavor.A20.d:0 "Mousillon stands independent beneath Mallobaude's rebel banner, an undead realm within lands still claimed by Bretonnia. Its capital is the cursed city of Mousillon, and its rule extends through Bordeleaux, Bastonne and Chalons. Louen Leoncoeur and the Black Knight begin at peace, but their rival claims remain unresolved.\n\nOnce a proud Bretonnian duchy, Mousillon became a byword for blighted fields, haunted ruins and disgraced nobility. Mallobaude gathers outcasts and forbidden allies beneath his serpent banner, turning the kingdom's abandoned corner into a challenge to the crown and the Lady.\n\nThe approaching End Times offer dangers and opportunities to a ruler who commands the dead among a Bretonnian people. The living kingdom surrounds his ambitions, while greater undead powers pursue designs of their own. Whether the Black Knight preserves his foothold or risks a struggle for the royal throne remains to be decided."
 wet_starting_flavor.A29.t:0 "Kislev and the End Times"
 wet_starting_flavor.A29.d:0 "Kislev is the northern shield of the Old World, a land of fortified cities, wide fields and fiercely independent riders. Tsarina Katarin Bokha rules through the authority of her dynasty and the power of the Ice Witches, but must still win the cooperation of her people.\n\nUngol and Gospodar traditions meet in a realm repeatedly scarred by invasion. The victory over Asavar Kul proved that the north could be resisted with allies; it did not make the frontier safe. Katarin inherited her father's throne in 2517 and the burden that came with it.\n\nAs the End Times approach, Archaon's growing power may break upon Kislev before the southern courts agree on the danger. Riders sent to warn them will be missed at home, while desperate exertion can buy time at the cost of tomorrow's strength. Katarin must choose whether ice magic, armoured cavalry or the infantry will anchor her defence; if the homeland falls, a consenting ally may shelter a government determined to return."
 wet_starting_flavor.A30.t:0 "Skaelings and the End Times"
 wet_starting_flavor.A30.d:0 "The Skaelings are feared because their longships turn distance into cruelty. One day a coast is counting fish, wool, and coin; the next it is counting ashes while northern sails vanish into mist.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A31.t:0 "Bjornlings and the End Times"
 wet_starting_flavor.A31.d:0 "The Bjornlings are a large and hard people, raised among cold lands where weakness becomes public knowledge quickly. Their warbands have the numbers to matter and the discipline to make that matter before louder tribes waste their strength on boasting.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A32.t:0 "Graelings and the End Times"
 wet_starting_flavor.A32.d:0 "The Graelings know the wild paths of Norsca better than most men know their own doorways. They hunt, raid, vanish, and return by routes that outsiders call impossible because outsiders are usually lost before the lesson begins.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A33.t:0 "Vargs and the End Times"
 wet_starting_flavor.A33.d:0 "The Vargs know the sea, the axe, and the red hunger of Khorne. Their longships are not merchants' hulls or fisher craft; they are teeth carved from timber, sent south to bite at every coast soft enough to bleed.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A34.t:0 "Aeslings and the End Times"
 wet_starting_flavor.A34.d:0 "The Aeslings are not content to raid for hunger alone. Their chiefs court the Dark Gods with sacrifice, oath, and spectacle, seeking signs in blood spray, storm light, and the silence after a village burns.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A35.t:0 "Sarls and the End Times"
 wet_starting_flavor.A35.d:0 "The Sarls are counted among the great tribes of Norsca, and size is a promise that must be renewed with blood. Many halls answer their chiefs, many ships can be called to sea, and many rivals watch for the first sign that numbers have made them soft.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A36.t:0 "Rotbloods and the End Times"
 wet_starting_flavor.A36.d:0 "The Rotbloods do not fear sickness, weakness, or the slow collapse of flesh. They call these things gifts, proof that Grandfather Nurgle has noticed them and made their bodies into sermons against mortal pride.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A41.t:0 "Estalia and the End Times"
 wet_starting_flavor.A41.d:0 "Estalia brings its homeland cities beneath a common crown, with Magritta's commerce and the western sea routes among its greatest strengths. The coast at Tobaro and the Thousand Isles extends its responsibilities as well as its reach.\n\nRival courts, voyages of discovery and the traditions of Myrmidia shaped Estalian life. Memories of invasion taught its cities the value of resistance, but also left local privileges and rival ambitions that a united realm must learn to accommodate.\n\nThe End Times threaten to turn distant disasters into danger at every harbour. Skaven pressure, piracy and instability beyond the mountains could undermine prosperity before a great army arrives. The Council may open its uprising with coordinated murders of the Estalian and Tilean rulers, leaving a surviving government to restore order before the invasion."
 wet_starting_flavor.A57.t:0 "Tilea and the End Times"
 wet_starting_flavor.A57.d:0 "Tilea is united around Miragliano, whose canals, engineers and merchants offer the foundations of a stronger realm. Lorenzo di Miragliano rules cities accustomed to bargaining hard over every tax, contract and claim of precedence.\n\nFor centuries, the Tilean cities prospered through sea trade and hired armies while competing over the memory of older Reman greatness. Their ingenuity brought wealth, but fragmented authority repeatedly let neighbours and mercenary captains dictate the terms of survival.\n\nIn the approaching End Times, Skavenblight is a far more immediate danger than any distant northern prophecy. Roads, waterways and paid soldiers must hold together under pressure from below. The Night of a Thousand Terrors can kill the ruling prince and shatter public order; surviving commanders must rally the realm before the Skaven armies arrive."
 wet_starting_flavor.A61.t:0 "Monte Castello and the End Times"
 wet_starting_flavor.A61.d:0 "Monte Castello looks down from hard roads and stone heights, close enough to Tilea to know its ambitions and close enough to the Borderlands to know how quickly ambition can become banditry. Its castles are not decoration; they are policy in masonry.\n\nTilean cities built their fortunes through trade, engineering and armies raised by contract. Their rulers inherited the memory of older Reman greatness, but rivalries between cities and captains repeatedly frustrated attempts to make that memory a lasting political union.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A63.t:0 "Nuln and the End Times"
 wet_starting_flavor.A63.d:0 "Nuln is smoke, scholarship, black powder, and courtly danger wrapped around the Reik. Its foundries and Gunnery School make the city invaluable to the Empire, which is precisely why every faction wants a hand on its artillery.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A64.t:0 "Argalis and the End Times"
 wet_starting_flavor.A64.d:0 "Argalis carries Estalian habits into a harsher country, where charters, merchant custom, and noble pride must share roads with sellswords, exiles, and sudden violence. The Borderlands respect paperwork only when it arrives with guards.\n\nEstalian society grew among rival cities and courts, drawing strength from commerce, seafaring and the military traditions of Myrmidia. Memories of invasion and religious struggle encouraged fierce local pride, but never made cooperation between rulers an easy habit.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A66.t:0 "Brovska and the End Times"
 wet_starting_flavor.A66.d:0 "Brovska sits where Wastelander habits meet frontier necessity. Its people understand bargains, tolls, marshy suspicion, and the value of keeping one more road open than rivals expect.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A67.t:0 "Akendorf and the End Times"
 wet_starting_flavor.A67.d:0 "Akendorf watches roads under the Black Mountains, where every pass is a promise to friends and an invitation to enemies. Its people know that geography does not defend itself; men must stand where the map narrows.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A68.t:0 "Masserschloss and the End Times"
 wet_starting_flavor.A68.d:0 "Masserschloss is a closed door in a frightened land. Behind its walls, Bragthorn the Necromancer gathers servants, secrets, and dead obedience, making silence do the work that proclamations would only endanger.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.A69.t:0 "Waldovia and the End Times"
 wet_starting_flavor.A69.d:0 "Waldovia lives with Sylvanian memory close enough to feel like weather. Its valleys, villages, and minor courts know the old stories of night rulers, vanished heirs, and bargains that should never have been made after sunset.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A70.t:0 "Molachia and the End Times"
 wet_starting_flavor.A70.d:0 "Molachia carries Kislevite endurance far from Kislev's heart, where cold customs, frontier suspicion, and the worship of Ursun must survive among southern roads and stranger neighbors. It is a hard inheritance in a hard place.\n\nKislevite history joins the older Ungol peoples and the Gospodars who established the tsars' realm. Invasions from the north made endurance a national duty, but differences between cities, horse clans and courts survived every shared victory.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A71.t:0 "Eagle Confederacy and the End Times"
 wet_starting_flavor.A71.d:0 "The Eagle Confederacy is built from free towns, hard bargains, local pride, and the belief that no single petty crown should be allowed to sell the frontier's future. Confederation is a promise, but promises need soldiers and tax collectors.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A72.t:0 "Khypris and the End Times"
 wet_starting_flavor.A72.d:0 "Khypris is far from Norsca's frozen coasts, but distance has not softened the men who carried northern habits south. Their halls stand near river roads and frontier markets, where a longship's old logic must learn new terrain.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A73.t:0 "Lietpoldia and the End Times"
 wet_starting_flavor.A73.d:0 "Lietpoldia is the dream of one hard crown set among marches that rarely respect crowns for long. Mercenary camps, toll roads, fortified towns, and nervous settlers all ask the same question in different accents: who can make order pay?\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A74.t:0 "Barrow Legion and the End Times"
 wet_starting_flavor.A74.d:0 "The Barrow Legion rises from graves that should have stayed quiet. Heinrich Kemmler, the Lichemaster, knows that a battlefield does not end when the living flee; it merely becomes a storehouse for future obedience.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.A75.t:0 "Scarosio and the End Times"
 wet_starting_flavor.A75.d:0 "Scarosio carries Bretonnian manners into a land where every road offers a different price for loyalty. The Lady's blessing still matters, but on the frontier a vow must be able to ride, judge, bargain, and bleed.\n\nBretonnian tradition looks back to Gilles le Breton and the vows that bound his companions to the Lady. Generations of knights carried those ideals beyond the first duchies, while peasants supplied the harvests on which every splendid charge depended.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A76.t:0 "Ordo Draconis and the End Times"
 wet_starting_flavor.A76.d:0 "The Ordo Draconis rides from the shadow of the Blood Keep, where chivalry has been drained, preserved, and given fangs. Walach Harkon commands knights who remember honor but no longer belong to mercy.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.A78.t:0 "Baersonling and the End Times"
 wet_starting_flavor.A78.d:0 "The Baersonling respect strength because strength is the only law the north enforces consistently. Their halls teach that a leader who cannot win, feed, and frighten will soon be replaced by someone with better scars.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A79.t:0 "Goromadny and the End Times"
 wet_starting_flavor.A79.d:0 "Goromadny lies beneath mountains and legends too large for ordinary rulers. Giants, harsh paths, hungry weather, and old Norscan pride shape a people used to measuring themselves against things that could crush them without noticing.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.A80.t:0 "Cult of Sigmar and the End Times"
 wet_starting_flavor.A80.d:0 "The Cult of Sigmar is faith with a hammer in its hand. It preaches unity, discipline, vigilance, and the old promise that mankind can stand against darkness if it remembers what Sigmar demanded of it.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A81.t:0 "Altdorf and the End Times"
 wet_starting_flavor.A81.d:0 "Altdorf is the Empire gathered into one city and then made to argue with itself. Imperial offices, guild halls, temples, colleges, merchants, soldiers, and river traffic all crowd the capital with interests too important to ignore.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A82.t:0 "Cult of Ulric and the End Times"
 wet_starting_flavor.A82.d:0 "The Cult of Ulric speaks in winter breath, wolf-hide, iron, and contempt for softness. Its holy city and its priests remember a world before Sigmar's empire, and they do not intend to become a footnote in another god's triumph.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A83.t:0 "Talabheim and the End Times"
 wet_starting_flavor.A83.d:0 "Talabheim sits within the vast crater called the Eye of the Forest, a city that looks protected by nature and therefore must work twice as hard not to become complacent. Walls, gates, roads, and woods all shape its fate.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A86.t:0 "Nordenmark and the End Times"
 wet_starting_flavor.A86.d:0 "Nordenmark is a northern place of salt wind, timber, coastal trade, and local privilege. Its towns and forests know that the Sea of Claws brings livelihoods and enemies with the same weather.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.A87.t:0 "Order of Blazing Sun and the End Times"
 wet_starting_flavor.A87.d:0 "The Order of the Blazing Sun serves Myrmidia beneath Imperial skies, carrying southern discipline, tactical faith, and knightly pride into a realm more used to Sigmar's hammer and Ulric's wolf.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A89.t:0 "Myrmidens and the End Times"
 wet_starting_flavor.A89.d:0 "The Myrmidens place Myrmidia's wisdom at the center of public life, treating strategy as devotion and discipline as a kind of prayer. In the south, where coin and pride often command more quickly than doctrine, that gives them a dangerous clarity.\n\nTilean cities built their fortunes through trade, engineering and armies raised by contract. Their rulers inherited the memory of older Reman greatness, but rivalries between cities and captains repeatedly frustrated attempts to make that memory a lasting political union.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A90.t:0 "Gashnagia and the End Times"
 wet_starting_flavor.A90.d:0 "Gashnagia survives beneath the strange romance of the Black Prince. Gashnag's subjects whisper that their lord is cursed, tragic, protective, monstrous, noble, or all of these at once.\n\nThe fall of ancient Strygos scattered both its people and its deathless aristocracy. Survivors carried memories of Mourkain into exile, where persecution and hunger transformed a lost kingdom into an inheritance claimed by wanderers, hidden courts and monstrous princes.\n\nThe End Times offer chances to reclaim power but also threaten the fragile places where these exiles endure. Living rulers fear them, rival vampires despise them and greater necromancers covet their obedience. A home must be secured before any dream of restoration can become more than another grave."
 wet_starting_flavor.A91.t:0 "Mortensholm and the End Times"
 wet_starting_flavor.A91.d:0 "Mortensholm is a frontier of remote homesteads, stockades, watchposts, furs, timber, iron, and stubborn people who have learned that help from greater powers often arrives after the burial work is done.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A93.t:0 "Fatindarid and the End Times"
 wet_starting_flavor.A93.d:0 "Fatindarid carries the One Faith into a harsh frontier of caravan roads, desert memory, and competing laws. Its rulers understand that belief can make order where bloodline and custom would only multiply quarrels.\n\nAraby's history was shaped by oasis kingdoms, sea trade, desert migrations and religious struggle. Merchants and conquerors linked its cities to distant shores, while competing rulers and creeds repeatedly disputed who could speak for the wider land.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.A94.t:0 "Grudgebringers and the End Times"
 wet_starting_flavor.A94.d:0 "The Grudgebringers are mercenaries, but not the disposable kind. Morgan Bernhardt's company carries a reputation built from hard contracts, darker wars, and the knowledge that some employers need reliable soldiers more than they need flattering courtiers.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nThe End Times threaten the Borderlands through raids, broken trade and wars that stronger neighbours may bring south. Local rivals remain dangerous even when distant armies are gathering. This realm must keep its settlements supplied and find dependable partners before the roads that support its independence become an enemy's invasion route."
 wet_starting_flavor.B01.t:0 "Athel Loren and the End Times"
 wet_starting_flavor.B01.d:0 "After the War of the Beard devastated the Elven colonies of the Old World, the Phoenix King ordered their people back to Ulthuan. Our ancestors refused to abandon their homes and withdrew into Athel Loren. The ancient Treeman Durthu helped bind their fate to the forest spirits: the Elves would defend the groves, and the forest would shelter them. Their descendants became the Asrai, building halls among living trees and learning to navigate paths that changed at the forest's will.\n\nAfter the War of the Beard, Elves who refused the return to Ulthuan made their home in Athel Loren. Their bargain with the forest spirits became the foundation of Asrai life, binding mortal guardians to a woodland older and less predictable than any royal court.\n\nIn the End Times, isolation offers little certainty. Beastmen, corruption and the destruction of neighbouring lands can carry danger beneath the canopy. The defenders must decide which outsiders can help preserve the forest, and which trespasses must be answered before the roots themselves are lost."
 wet_starting_flavor.B02.t:0 "Kraka Drak and the End Times"
 wet_starting_flavor.B02.d:0 "Kraka Drak stands far from the comfort of the southern Karaks, a stubborn oath of stone beneath northern skies. Its halls are Dawi, but its winds are Norscan, and every gate knows the sound of raiders, monsters, and worse things testing the mountain.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.B04.t:0 "Kraka Ravnsvake and the End Times"
 wet_starting_flavor.B04.d:0 "Kraka Ravnsvake watches cold waters where longships, traders, monsters, and worse omens pass too close to Dawi doors.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.B05.t:0 "Kraka Ornsmotek and the End Times"
 wet_starting_flavor.B05.d:0 "Kraka Ornsmotek is a hold of shrine-fires, careful miners, and runesmiths who measure each winter by what it failed to break.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.B06.t:0 "Shadow Clan and the End Times"
 wet_starting_flavor.B06.d:0 "The Shadow Clan broods around the Citadel of Lead, where mist gathers like a kept secret and old Albion rites have learned darker names.\n\nAlbion's clans inherited an island of standing stones, old sacred duties and memories guarded by the Truthsayers. Mist preserved much of that world from foreign conquest, but never ended feuds between its peoples or the struggle over its ancient places.\n\nThe End Times make those relics and sanctuaries prizes for powers beyond the island. Corrupted rites, rival clans and foreign expeditions threaten from different directions. Guarding the stones and holding the people together will require more than trusting the concealing mist."
 wet_starting_flavor.B07.t:0 "Losteriklings and the End Times"
 wet_starting_flavor.B07.d:0 "The Losteriklings cling to a storm-beaten shore where Norscan oaths meet Albion fog and neither land nor sea offers a gentle welcome.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.B08.t:0 "Truthsayers and the End Times"
 wet_starting_flavor.B08.d:0 "The Truthsayers stand nearest the Great Ogham, where the island speaks through weathered stone, sacred groves, and warnings that do not always arrive as words.\n\nAlbion's clans inherited an island of standing stones, old sacred duties and memories guarded by the Truthsayers. Mist preserved much of that world from foreign conquest, but never ended feuds between its peoples or the struggle over its ancient places.\n\nThe End Times make those relics and sanctuaries prizes for powers beyond the island. Corrupted rites, rival clans and foreign expeditions threaten from different directions. Guarding the stones and holding the people together will require more than trusting the concealing mist."
 wet_starting_flavor.B09.t:0 "Belenii and the End Times"
 wet_starting_flavor.B09.d:0 "The Belenii hold hills where watchfires vanish into mist and every family remembers which path a stranger should never take twice.\n\nAlbion's clans inherited an island of standing stones, old sacred duties and memories guarded by the Truthsayers. Mist preserved much of that world from foreign conquest, but never ended feuds between its peoples or the struggle over its ancient places.\n\nThe End Times make those relics and sanctuaries prizes for powers beyond the island. Corrupted rites, rival clans and foreign expeditions threaten from different directions. Guarding the stones and holding the people together will require more than trusting the concealing mist."
 wet_starting_flavor.B10.t:0 "Boreni and the End Times"
 wet_starting_flavor.B10.d:0 "The Boreni know the wet ground, reed-choked crossings, and half-drowned shrines that outsiders mistake for empty country until the fog begins to move.\n\nAlbion's clans inherited an island of standing stones, old sacred duties and memories guarded by the Truthsayers. Mist preserved much of that world from foreign conquest, but never ended feuds between its peoples or the struggle over its ancient places.\n\nThe End Times make those relics and sanctuaries prizes for powers beyond the island. Corrupted rites, rival clans and foreign expeditions threaten from different directions. Guarding the stones and holding the people together will require more than trusting the concealing mist."
 wet_starting_flavor.B11.t:0 "Fir Cichol and the End Times"
 wet_starting_flavor.B11.d:0 "The Fir Cichol remember when the Fimir were feared in Albion, not merely glimpsed at the edge of marshes and blamed for disappearances.\n\nThe Fimir remember an age when their kind enjoyed greater power and closer attention from Chaos. As that favour faded, surviving communities withdrew into marshes and hidden strongholds, preserving old rites while raiding the lands of more numerous peoples.\n\nThe End Times may offer renewed power, but they also bring hosts that will trample hidden sanctuaries without noticing their ancient claims. Rival warlords and the hatred of surrounding peoples remain immediate threats. Mist can conceal a realm; only strength can preserve it when concealment fails."
 wet_starting_flavor.B12.t:0 "Toulenii and the End Times"
 wet_starting_flavor.B12.d:0 "The Toulenii keep a rough dignity among rain-black fields, cattle paths, and stone circles whose meanings are argued over beside every council fire.\n\nAlbion's clans inherited an island of standing stones, old sacred duties and memories guarded by the Truthsayers. Mist preserved much of that world from foreign conquest, but never ended feuds between its peoples or the struggle over its ancient places.\n\nThe End Times make those relics and sanctuaries prizes for powers beyond the island. Corrupted rites, rival clans and foreign expeditions threaten from different directions. Guarding the stones and holding the people together will require more than trusting the concealing mist."
 wet_starting_flavor.B14.t:0 "Barak Varr and the End Times"
 wet_starting_flavor.B14.d:0 "Barak Varr is the rare Dawi hold that hears waves as often as hammers, a sea-gate where clan ledgers and cannon ports face the same horizon.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.B15.t:0 "Drakk and the End Times"
 wet_starting_flavor.B15.d:0 "Drakk follows dragon rites far from the blessed isles, where Scythan horsemen, fire-priests, and hard caravan families have made reverence portable.\n\nAraby's history was shaped by oasis kingdoms, sea trade, desert migrations and religious struggle. Merchants and conquerors linked its cities to distant shores, while competing rulers and creeds repeatedly disputed who could speak for the wider land.\n\nThe End Times threaten the routes that carry wealth across desert and sea. Undead powers, raiders and foreign ambitions place different pressures on each frontier. Keeping water, provisions and trusted trading partners secure may prove more valuable than another splendid claim to authority."
 wet_starting_flavor.B16.t:0 "Sires of Mourkain and the End Times"
 wet_starting_flavor.B16.d:0 "For centuries, we have lingered in the shadows of history, our once-glorious dominion reduced to whispers and ruin. Yet the blood of Strygos has not thinned—it endures, eternal and unyielding. Now, at last, the time of reclamation is upon us.\n\nThe fall of ancient Strygos scattered both its people and its deathless aristocracy. Survivors carried memories of Mourkain into exile, where persecution and hunger transformed a lost kingdom into an inheritance claimed by wanderers, hidden courts and monstrous princes.\n\nThe End Times offer chances to reclaim power but also threaten the fragile places where these exiles endure. Living rulers fear them, rival vampires despise them and greater necromancers covet their obedience. A home must be secured before any dream of restoration can become more than another grave."
 wet_starting_flavor.B17.t:0 "Zharr-Naggrund and the End Times"
 wet_starting_flavor.B17.d:0 "Zharr-Naggrund is the furnace-city of the Dawi-Zharr, where Astragoth Ironhand stands among the sorcerer-priests of Hashut. Its ziggurats, workshops and captive labour sustain a power feared across the Darklands.\n\nCut off from their western kin during the ancient catastrophes, the Dawi-Zharr turned to Hashut. Their civilisation grew around sorcerer-priests, captive labour and the furnaces of the Darklands, exchanging the old ancestral compact for mastery through industry and terror.\n\nArchaon's rise promises a vast market for weapons and a terrible contest over who commands their makers. The End Times could deliver captives and dominion, or destroy the roads and mines that feed the furnaces. Rival priesthoods, rebellious labourers and hostile neighbours must be contained before the foundries can dictate the terms of war."
 wet_starting_flavor.B19.t:0 "Greybeards and the End Times"
 wet_starting_flavor.B19.d:0 "The Greybeards preserve a Dwarfen foothold at Vulture Mountain in Araby. Far from the great northern holds, their clans depend on the craft, local knowledge and carefully guarded routes that have allowed a mountain people to endure beneath a desert sun.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.B20.t:0 "Gorgoth and the End Times"
 wet_starting_flavor.B20.d:0 "Gorgoth is a mouth in the Dark Lands, swallowing captives, ore, coal, and pain until the pit-forges cough out weapons worthy of Hashut.\n\nCut off from their western kin during the ancient catastrophes, the Dawi-Zharr turned to Hashut. Their civilisation grew around sorcerer-priests, captive labour and the furnaces of the Darklands, exchanging the old ancestral compact for mastery through industry and terror.\n\nThe northern muster offers customers and allies, yet the End Times threaten the roads and labour on which the furnaces depend. Greenskin revolt, rival masters and Chaos hosts can each interrupt the flow. A realm that arms conquerors must remain strong enough to resist becoming their prize."
 wet_starting_flavor.B21.t:0 "Pigbarter and the End Times"
 wet_starting_flavor.B21.d:0 "Pigbarter squats in smoke and mud where the River Ruin carries pigs, spice, iron, gossip, and bad decisions to the same stinking docks.\n\nHuman settlements in the Darklands survived where safer kingdoms saw only wastes and hostile neighbours. Caravan trade, river traffic and work in abandoned mines gave scattered communities a living; practical bargains often mattered more than distant royal claims.\n\nThe End Times threaten to close the routes that keep these settlements alive. Ogre tolls, Greenskin raids and the demands of Chaos Dwarf masters are immediate dangers even before greater armies arrive. Supplies and defensible trading partners may buy the time that wealth alone cannot."
 wet_starting_flavor.B23.t:0 "Darkhold and the End Times"
 wet_starting_flavor.B23.d:0 "Darkhold grips the edge of the Dark Lands like a hook in meat, watching roads where slaves, raiders, and envoys all arrive under suspicion.\n\nCut off from their western kin during the ancient catastrophes, the Dawi-Zharr turned to Hashut. Their civilisation grew around sorcerer-priests, captive labour and the furnaces of the Darklands, exchanging the old ancestral compact for mastery through industry and terror.\n\nThe northern muster offers customers and allies, yet the End Times threaten the roads and labour on which the furnaces depend. Greenskin revolt, rival masters and Chaos hosts can each interrupt the flow. A realm that arms conquerors must remain strong enough to resist becoming their prize."
 wet_starting_flavor.B24.t:0 "Eyebiter and the End Times"
 wet_starting_flavor.B24.d:0 "Eyebiter is an Ogre realm at the Sentinel, where Yuzerk Dwarfsquasher commands a following sustained by strength and the movement of goods through dangerous country. Caravans and neighbouring powers must reckon with a ruler who sees every passage as an opportunity to demand tribute.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.B25.t:0 "Redmaw and the End Times"
 wet_starting_flavor.B25.d:0 "Red Maw is hunger with banners, a kingdom where chiefs, butchers, bruisers, and frightened toll-payers all understand that tribute is just food with better bookkeeping.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.B26.t:0 "Horns of Hashut and the End Times"
 wet_starting_flavor.B26.d:0 "The Horns of Hashut are a warning blast from the furnace gate, half army and half sermon, carrying the Father of Darkness into lands not yet properly afraid.\n\nCut off from their western kin during the ancient catastrophes, the Dawi-Zharr turned to Hashut. Their civilisation grew around sorcerer-priests, captive labour and the furnaces of the Darklands, exchanging the old ancestral compact for mastery through industry and terror.\n\nThe northern muster offers customers and allies, yet the End Times threaten the roads and labour on which the furnaces depend. Greenskin revolt, rival masters and Chaos hosts can each interrupt the flow. A realm that arms conquerors must remain strong enough to resist becoming their prize."
 wet_starting_flavor.B27.t:0 "Vorag and the End Times"
 wet_starting_flavor.B27.d:0 "Vorag's deathless court preserves the ambitions of the Strigoi amid hostile neighbours. Vorag Bloodytooth's following binds hunger to memories of lost dominion, seeking territory where creatures driven from the courts of both living and dead can establish their own authority.\n\nThe fall of ancient Strygos scattered both its people and its deathless aristocracy. Survivors carried memories of Mourkain into exile, where persecution and hunger transformed a lost kingdom into an inheritance claimed by wanderers, hidden courts and monstrous princes.\n\nThe End Times offer chances to reclaim power but also threaten the fragile places where these exiles endure. Living rulers fear them, rival vampires despise them and greater necromancers covet their obedience. A home must be secured before any dream of restoration can become more than another grave."
 wet_starting_flavor.B28.t:0 "Thunderguts and the End Times"
 wet_starting_flavor.B28.d:0 "The Thunderguts announce themselves before the battle starts: drums, belches, iron pots, cracking bones, and the heavy certainty that subtlety is for food that can hide.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.B29.t:0 "Uzkulak and the End Times"
 wet_starting_flavor.B29.d:0 "Uzkulak watches the northern approaches to the Darklands with furnace smoke above its strongholds. Its Dawi-Zharr rulers have long treated the movement of captives, weapons and traders as a source of power, while guarding against the same violence from which they profit.\n\nCut off from their western kin during the ancient catastrophes, the Dawi-Zharr turned to Hashut. Their civilisation grew around sorcerer-priests, captive labour and the furnaces of the Darklands, exchanging the old ancestral compact for mastery through industry and terror.\n\nThe northern muster offers customers and allies, yet the End Times threaten the roads and labour on which the furnaces depend. Greenskin revolt, rival masters and Chaos hosts can each interrupt the flow. A realm that arms conquerors must remain strong enough to resist becoming their prize."
 wet_starting_flavor.B30.t:0 "The Dolgans and the End Times"
 wet_starting_flavor.B30.d:0 "The Dolgans ride long roads between steppe, forest, and frozen rumor, carrying gods in their scars and policy in the speed of their horses.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B31.t:0 "Chernozavtra and the End Times"
 wet_starting_flavor.B31.d:0 "Chernozavtra stands among fields that should feed armies, villages that should trust the bear, and roads that prove the Wheatlands are no safe granary anymore.\n\nKislevite history joins the older Ungol peoples and the Gospodars who established the tsars' realm. Invasions from the north made endurance a national duty, but differences between cities, horse clans and courts survived every shared victory.\n\nThe northern gathering storm threatens to turn familiar border warfare into a struggle for survival. Raiders can ruin harvests long before a great host arrives. Stores, defensible roads and trustworthy neighbours will matter as much as courage when the End Times reach these people."
 wet_starting_flavor.B32.t:0 "The Yin and the End Times"
 wet_starting_flavor.B32.d:0 "Yin speaks in the language of balance while sharpening knives for a god who prefers the scales weighted with skulls.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B33.t:0 "The Mung and the End Times"
 wet_starting_flavor.B33.d:0 "The Mung are an old terror of the wastes, a people whose campfires, horse-lines, and god-marked champions have frightened borderlands for generations.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B34.t:0 "The Aghols and the End Times"
 wet_starting_flavor.B34.d:0 "The Aghols follow fire across cold country, keeping camps, herds, and shrine-stakes in a restless pattern that outsiders mistake for disorder.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B35.t:0 "Sigvald's Host and the End Times"
 wet_starting_flavor.B35.d:0 "Sigvald's Host gathers at Bleakspire beneath the banner of the Magnificent, a champion whose beauty conceals absolute cruelty. His followers seek Slaanesh's favour through excess, conquest and a perfection purchased with other people's suffering.\n\nSigvald rose from northern princely privilege into the service of the Dark Prince, turning appetite and vanity into a warrior's vocation. The host that follows him depends on the spectacle of his victories and the rewards of belonging to a favoured champion.\n\nThe End Times offer a stage worthy of his ambitions, but Archaon's greater muster threatens to reduce even splendid champions to instruments. Rival hosts and the defenders of the south will not yield to admiration. Sigvald must make his followers useful enough to be courted and dangerous enough to be feared."
 wet_starting_flavor.B37.t:0 "Broken Wheel and the End Times"
 wet_starting_flavor.B37.d:0 "Broken Wheel follows omens that turn in circles until the spokes snap and the whole design lurches somewhere no sane commander expected.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.B38.t:0 "Hedonites of Kislev and the End Times"
 wet_starting_flavor.B38.d:0 "The Hedonites dress damnation in color, perfume, song, and blades so fine that victims may admire them for one foolish heartbeat.\n\nKislevite history joins the older Ungol peoples and the Gospodars who established the tsars' realm. Invasions from the north made endurance a national duty, but differences between cities, horse clans and courts survived every shared victory.\n\nThe northern gathering storm threatens to turn familiar border warfare into a struggle for survival. Raiders can ruin harvests long before a great host arrives. Stores, defensible roads and trustworthy neighbours will matter as much as courage when the End Times reach these people."
 wet_starting_flavor.B40.t:0 "Wolf Brothers and the End Times"
 wet_starting_flavor.B40.d:0 "The Wolf Brothers follow Feytor the Tainted beneath Nurgle's signs. Their restored northern homeland gives the host a place to gather, but its unity rests on shared endurance, plunder and the authority of a plague-marked champion.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B41.t:0 "Gharhans and the End Times"
 wet_starting_flavor.B41.d:0 "The Gharhans ride beneath oaths sworn over horse blood, blackened iron, and gods who listen closely when ambition is spoken aloud.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.B42.t:0 "Tahmaks and the End Times"
 wet_starting_flavor.B42.d:0 "The Tahmaks trust signs in smoke, entrails, hoofprints, and dreams, but signs become useful only when warriors are willing to enforce their interpretation.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B43.t:0 "The Kul and the End Times"
 wet_starting_flavor.B43.d:0 "The Kul carry a name heavy with old invasions, broken borders, and the memory of chieftains who measured greatness by how far the south burned.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B44.t:0 "Dervingard and the End Times"
 wet_starting_flavor.B44.d:0 "Dervingard is a hard garrison in colder country, where watch rotations, stores, prayers to Ursun, and suspicious officers matter more than courtly speeches.\n\nKislevite history joins the older Ungol peoples and the Gospodars who established the tsars' realm. Invasions from the north made endurance a national duty, but differences between cities, horse clans and courts survived every shared victory.\n\nDervingard remains a defender of its people, not another host sworn to the northern gods. The End Times threaten to surround its garrison with enemies whose ambitions grow faster than its stores. It must secure a defensible position and seek dependable partners before the larger northern war cuts off every road to help."
 wet_starting_flavor.B46.t:0 "Steppe Dolgans and the End Times"
 wet_starting_flavor.B46.d:0 "The Steppe Dolgans live where familiar stories stretch thin, carrying Dolgan habits into lands that answer with new tongues, new roads, and old gods wearing new masks.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B50.t:0 "The Yusaks and the End Times"
 wet_starting_flavor.B50.d:0 "The Yusaks know rivers as roads, borders, shrines, and traps, carrying tents and trophies along water that looks peaceful only from far away.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B51.t:0 "The Wei-Jin and the End Times"
 wet_starting_flavor.B51.d:0 "Wei-Jin is a dangerous name to carry in exile, especially when Tzeentchian whispers suggest that a stolen title can become truer than the throne it imitates.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B52.t:0 "The Kuj and the End Times"
 wet_starting_flavor.B52.d:0 "The Kuj treat trade and raiding as different ways of making outsiders support the tribe. Their camps have learned to value roads, markets and swift withdrawal, but merchants who arrive with gifts know that a bargain must remain more attractive than plunder.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B54.t:0 "Man-Chu and the End Times"
 wet_starting_flavor.B54.d:0 "The Man-Chu ride between worlds, close enough to Cathayan influence to know discipline and close enough to the northern storm to hear promises in thunder.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B55.t:0 "Raven Host and the End Times"
 wet_starting_flavor.B55.d:0 "The Raven Host gathers under feathers, riddles, and plans that molt into sharper plans before enemies finish understanding the first.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B56.t:0 "Iron Wolves and the End Times"
 wet_starting_flavor.B56.d:0 "The Iron Wolves seek strength through the discipline of a pack and the promises of Tzeentch. Camps, followers and carefully watched approaches give them a base among the eastern steppes, where rivals test whether unity can survive an unexpected reversal.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B59.t:0 "Blooded Ones and the End Times"
 wet_starting_flavor.B59.d:0 "The Blooded Ones gather around Haargroth the Blooded, seeking Khorne's notice in battle. Their northern holdings are a foundation for conquest, but a champion who cannot provide worthy enemies will soon find challengers among his own followers.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B60.t:0 "Black Legion and the End Times"
 wet_starting_flavor.B60.d:0 "The Black Legion carries a name that demands obedience from lesser warbands, rivals, oathbreakers, and anyone who mistakes black iron for mourning.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B63.t:0 "Koryo and the End Times"
 wet_starting_flavor.B63.d:0 "Koryo stands at the edge of Cathayan influence with artillery, coastal discipline, court learning, and the uneasy knowledge that order is not the same as safety.\n\nCathayan civilisation developed beneath the long authority of the Dragon Emperor, linking vast provinces through offices, armies and commerce. Its frontier endured repeated northern incursions while distance and local ambition tested the reach of imperial commands.\n\nThe End Times threaten both the northern frontier and the trade that supports eastern prosperity. Raiders, hostile fleets and disorder along the roads can undermine a realm without breaching its greatest walls. Supplies and cooperation must reach the places where imperial assurances alone cannot stand guard."
 wet_starting_flavor.B64.t:0 "Mengil's Manflayers and the End Times"
 wet_starting_flavor.B64.d:0 "Mengil's Manflayers are Druchii blades for hire, which means the contract is written in coin, fear, and the certainty that the client is never the most dangerous person in the room.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.B65.t:0 "Exiles of Caledor and the End Times"
 wet_starting_flavor.B65.d:0 "Asarnil's exiles carry Caledor's pride across hostile seas, with dragon memories, polished armor, and the bitter knowledge that distance can make nobility feel like punishment.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the Border Princes as well as the distant Elven homeland. Asarnil's exiles must protect their foothold amid shifting human loyalties and Greenskin warfare. Their dragon-proud inheritance can win fear and useful contracts, but cannot substitute for supplies or trustworthy allies."
 wet_starting_flavor.B66.t:0 "Death Scarabs and the End Times"
 wet_starting_flavor.B66.d:0 "The Death Scarabs stir beneath gold, dust, and patient stone, where every sealed chamber remembers a ruler who expected eternity to be orderly.\n\nAncient Nehekhara raised golden cities and a mortuary cult that promised its monarchs eternal splendour. Nagash's sorcery instead destroyed the living civilisation and condemned its kings to awaken in withered bodies, surrounded by the ruins of what had been promised them.\n\nThe End Times threaten another theft of that sovereignty. Necromancers covet the legions, living intruders plunder the tombs and rival dynasties remember every slight. Preserving the royal will means defending sacred ground against those who would turn an eternal kingdom into someone else's army."
 wet_starting_flavor.B71.t:0 "Laurelon and the End Times"
 wet_starting_flavor.B71.d:0 "Laurelon preserves the Eonir realm of Laurelorn, whose history and traditions differ from those of Athel Loren. Human settlements press around a forest whose people remember older boundaries and insist that timber, roads and royal charters do not extinguish their claims.\n\nThe forest Elves descend from communities that remained in the Old World when their kin withdrew across the sea. Survival required bargains with older forest powers, creating societies whose boundaries follow sacred groves and remembered oaths more closely than human maps.\n\nIn the End Times, isolation offers little certainty. Beastmen, corruption and the destruction of neighbouring lands can carry danger beneath the canopy. The defenders must decide which outsiders can help preserve the forest, and which trespasses must be answered before the roots themselves are lost."
 wet_starting_flavor.B77.t:0 "Puppets of Misrule and the End Times"
 wet_starting_flavor.B77.d:0 "Vilitch the Curseling is two fates knotted into one body, a lesson in Tzeentch's humor that leaves enemies unsure which brother is the trap and which is the bait.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B78.t:0 "Gorequeen's Slaughterhost and the End Times"
 wet_starting_flavor.B78.d:0 "Valkia the Bloody is Khorne's spear cast into the world, winged, furious, and beautiful only in the way a killing stroke can be beautiful.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B79.t:0 "Scourgeborn and the End Times"
 wet_starting_flavor.B79.d:0 "Scyla Anfingrimm is what remains when a champion receives more blessing than shape can bear, a living warning that Khorne values results over conversation.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B81.t:0 "Herald's of the Endtime and the End Times"
 wet_starting_flavor.B81.d:0 "The Heralds of the Endtime follow Vardek Crom, a champion whose martial reputation demands more than a season's plunder. Their host seeks to turn northern conquest into disciplined service to the great invasion, proving that the ruin they proclaim can be delivered.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B83.t:0 "Dragonbone and the End Times"
 wet_starting_flavor.B83.d:0 "Gutrot Spume carries the stink of drowned holds, plague-slick decks, and tentacles where honest limbs surrendered to Nurgle's generosity.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.B85.t:0 "The Fecundites and the End Times"
 wet_starting_flavor.B85.d:0 "Festus the Leechlord offers cures with a physicians hand and a grandfatherly smile, which is why the screams often begin after the patient thanks him.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B86.t:0 "Fell Legion and the End Times"
 wet_starting_flavor.B86.d:0 "The Fell Legion follows Hrothgar Blackmantle from its northern strongholds. Black iron and hard-won discipline hold the warband together, but a successor's commands must continually prove as compelling as the memory of the leader who came before.\n\nMortkin's campaigns left a formidable martial inheritance before his death in 2515. Hrothgar now bears that legacy in a north where followers measure authority through victories, spoils and the judgement of the Dark Gods.\n\nArchaon's rise threatens to draw every independent host into a greater struggle. The End Times could restore the legion's renown or consume it in another champion's wars. Its ruler must secure loyalty and choose commitments before rivals decide its place for him."
 wet_starting_flavor.B88.t:0 "Skullreapers and the End Times"
 wet_starting_flavor.B88.d:0 "The Skullreapers gather around Skarr Bloodwrath and a reputation for rage that refuses to stay buried. Their warriors seek Khorne's notice through relentless combat, but maintaining a host requires the survivors of each victory to find another reason to follow the same banner.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.B90.t:0 "Heralds of the Tempest and the End Times"
 wet_starting_flavor.B90.d:0 "Kholek Suneater is older than many nations and less patient than any of them deserve, a storm-scaled ruin whose footsteps make mountains reconsider stillness.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B91.t:0 "The Ecstatic Legions and the End Times"
 wet_starting_flavor.B91.d:0 "Azazel smiles with the confidence of one who knows virtue is often only temptation that has not yet found the right voice.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B93.t:0 "The Faithless and the End Times"
 wet_starting_flavor.B93.d:0 "Sayl the Faithless has made betrayal less a sin than a trade language, fluent enough that even allies listen carefully for the price hidden in each promise.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.B94.t:0 "Sortsvinaer and the End Times"
 wet_starting_flavor.B94.d:0 "Styrkaar seeks a war so exquisite that even terror seems arranged, every charge a performance and every wound an audience forced to applaud.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's rise promises an End Times war greater than any summer raid. It also threatens every chieftain who values an independent banner. Rival hosts, hungry gods and the armies of the south stand between this people and a share of the coming ruin."
 wet_starting_flavor.B95.t:0 "Fimdirach and the End Times"
 wet_starting_flavor.B95.d:0 "Fimdirach carries the wet shadow of the Fimir into a land of ash, chains, and furnace smoke, where mist must learn to hide among worse things.\n\nThe Fimir remember an age when their kind enjoyed greater power and closer attention from Chaos. As that favour faded, surviving communities withdrew into marshes and hidden strongholds, preserving old rites while raiding the lands of more numerous peoples.\n\nThe End Times may offer renewed power, but they also bring hosts that will trample hidden sanctuaries without noticing their ancient claims. Rival warlords and the hatred of surrounding peoples remain immediate threats. Mist can conceal a realm; only strength can preserve it when concealment fails."
 wet_starting_flavor.B96.t:0 "The Nameless and the End Times"
 wet_starting_flavor.B96.d:0 "The Nameless is a northern realm under Ahmad Snagarlson, sustained by followers whose allegiance lies with Chaos rather than the kingdoms of the south. Its obscure name offers no protection from the rivals gathering around it.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nArchaon's growing muster gives every northern ruler a choice between opportunity and submission. In the End Times, a small host can gain renown by serving a greater invasion or lose its identity within it. Ahmad must preserve his followers' strength before promising them to another banner."
 wet_starting_flavor.B97.t:0 "Maggot Host and the End Times"
 wet_starting_flavor.B97.d:0 "The Maggot Host now answers to Vargan Poxhand. Its warriors carry Nurgle's gifts beneath banners inherited from an earlier conqueror, relying on corruption and stubborn endurance to outlast enemies who still believe flesh should remain whole.\n\nTamurkhan's invasion ended with his death in 2511, leaving a memory of devastation and followers who survived the ruin of his ambitions. Vargan's succession gives those remnants a new master without making the dead conqueror live again.\n\nThe approaching End Times offer a fresh campaign of infection, but also competition from other plague champions and Archaon's demands. The host must gather supplies and willing or unwilling followers before its inherited reputation can become a force that matters in the coming war."
 wet_starting_flavor.B98.t:0 "Befouled Warriors and the End Times"
 wet_starting_flavor.B98.d:0 "The Befouled Warriors follow Othmar Glottkin, spreading Nurgle's worship through a host accustomed to the far north. Their own ruler and following give them an identity beyond the rumours gathering around other champions of the Plague God.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nThe End Times promise plague and conquest on an unprecedented scale. Archaon's muster and rival servants of Nurgle may offer cooperation, but neither guarantees this host a place of honour. Othmar must preserve his followers while deciding whose campaigns are worth their devotion."
 wet_starting_flavor.B99.t:0 "Swords of Chaos and the End Times"
 wet_starting_flavor.B99.d:0 "The Swords of Chaos gather around Archaon at Hollowpeak. He already leads the Everchosen faction, yet the north remains full of independent rulers, proud champions and rival gods' servants. A title alone cannot turn them into one army.\n\nOnce a templar of Sigmar, Archaon abandoned the faith of the Empire and pursued the terrible trials that made him the Dark Gods' champion. His hatred of the world's order became an ambition to bring that order to its final end.\n\nThe End Times are his purpose, but the road south must still be won. The gods compete, the northern hosts demand victories, and Kislev and the Empire can seek allies before the invasion reaches them. Archaon must bind his following and sustain a campaign great enough to make his promise of ruin real."
 wet_starting_flavor.G02.t:0 "Bad Axes and the End Times"
 wet_starting_flavor.G02.d:0 "The Bad Axes judge a weapon by the harm it does, not the skill of the smith who made it. Their bosses gather warriors around trophies and successful raids, preserving a tribe in which every old victory is an invitation to seek a larger one.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G03.t:0 "Blue Faces and the End Times"
 wet_starting_flavor.G03.d:0 "The Blue Faces marks itself before battle so every enemy knows exactly which mob is coming to ruin the day.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G04.t:0 "Top Knotz and the End Times"
 wet_starting_flavor.G04.d:0 "The Top Knotz squat where dead kings, desert caravans, and nervous towns all give an Orc something to hit. Nehekhara's old roads were built for armies and tribute; that just proves the dead had good ideas before they got boring.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G05.t:0 "Vulchaz and the End Times"
 wet_starting_flavor.G05.d:0 "The Vulchaz watch like carrion birds, waiting for weakness, smoke, or some richer fool to start a fight that can be profitably finished.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G06.t:0 "Freebootarz and the End Times"
 wet_starting_flavor.G06.d:0 "The Freebootarz hear waves and think of boarding planks, stolen guns, and captains who shout louder than storms.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G07.t:0 "Bonenoses and the End Times"
 wet_starting_flavor.G07.d:0 "The Bonenoses turn trophies into claims of authority, displaying the remains of defeated enemies before every gathering of the tribe. Rival bosses inherit old contests along with their warbands, and a leader must keep providing victories if those trophies are to command respect.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G09.t:0 "Stitched Skulls and the End Times"
 wet_starting_flavor.G09.d:0 "The Stitched Skulls carry banners assembled from the evidence of earlier victories. Their bosses use those grisly standards to gather scattered fighters, but every claim to lead must survive the judgement of warriors who would rather win another battle than listen to another boast.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G10.t:0 "Rusty Daggaz and the End Times"
 wet_starting_flavor.G10.d:0 "The Rusty Daggaz know a rusty blade still hurts, especially when it arrives in the dark and the other git was expecting a fair fight.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G11.t:0 "Teef Snatchaz and the End Times"
 wet_starting_flavor.G11.d:0 "The Teef Snatchaz understand wealth in the proper way: if it can be punched loose, bitten out, or stolen from a smaller git, it counts.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G13.t:0 "Da Howlaz and the End Times"
 wet_starting_flavor.G13.d:0 "Da Howlaz announce themselves with a clamour meant to break the enemy's nerve before the first charge. Their tribe grew around the confidence that a united mob can terrify a stronger opponent, provided the shouting does not become another argument among its own bosses.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G14.t:0 "Scabby Eyez and the End Times"
 wet_starting_flavor.G14.d:0 "The Scabby Eyez watch everything: rival bosses, weak walls, loose teef, and the exact moment a bigger git looks the wrong way.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G17.t:0 "Skullsmasherz and the End Times"
 wet_starting_flavor.G17.d:0 "The Skullsmasherz contest the lands around Bretonnia with raids and brute force. Their bosses favour direct answers to every dispute, but must still choose targets carefully: a failed attack on a defended castle can leave the tribe weaker than the rivals watching its camp.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G18.t:0 "Black Venoms and the End Times"
 wet_starting_flavor.G18.d:0 "The Black Venoms likes a fight better when the enemy is already sweating, stumbling, and wondering which scratch started to burn.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G19.t:0 "Iron Claws and the End Times"
 wet_starting_flavor.G19.d:0 "Iron Claws is a name that tells the tribe what to expect: grip hard, take harder, and do not let go just because something screams.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G21.t:0 "Goretusk and the End Times"
 wet_starting_flavor.G21.d:0 "Goretusk builds its reputation around the thunder of a charge and the trophies left when an enemy line breaks. Its bosses inherited a tribe that values momentum, but must still keep warriors, mounts and plunder together between the battles that make their names.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G22.t:0 "Bloody Sunz and the End Times"
 wet_starting_flavor.G22.d:0 "The Bloody Sunz paint the sky in their own heads before battle, convinced every dawn is just the world getting ready to watch them win.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G23.t:0 "Bloody Handz and the End Times"
 wet_starting_flavor.G23.d:0 "The Bloody Handz believe possession belongs to whoever can still hold a prize when the fighting ends. Their bosses turn raids into claims over camps and hunting grounds, while every neighbouring tribe waits for a chance to test the same rule against them.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G24.t:0 "Black Crag and the End Times"
 wet_starting_flavor.G24.d:0 "Black Crag is Grimgor Ironhide's realm and the heart of The Last Waaagh. The tribes gathered beneath his banner respect strength, and Grimgor intends to give them a fight large enough to silence every rival boss.\n\nThe fortress and the lands around it have long been prizes in the wars of Dwarfs and Greenskins. Grimgor's rise turned the former Red Fangs and their neighbouring tribes into a greater power, held together by victory and fear of the biggest Orc.\n\nThe End Times begin with the gathering choosing Grimgor, Skarsnik or both as its leaders. Their champions can spend 30 political power to absorb smaller independent, factionless Waaagh neighbours and their armies through diplomacy. Western ports, the tomb kingdoms, the Dark Lands and mountain roads offer separate campaigns. At maximum world tension, the host can choose final wars against the other factions."
 wet_starting_flavor.G25.t:0 "Ironback and the End Times"
 wet_starting_flavor.G25.d:0 "Ironback is a Greenskin tribe whose chiefs prize stubbornness as much as strength. Its warriors have made endurance a claim to respect among rival mobs, but every hard-won position invites another boss to test whether the name is still deserved.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G26.t:0 "Greyhag and the End Times"
 wet_starting_flavor.G26.d:0 "Greyhag lives under the black breath of the Dark Lands, where Orc shamans mutter to gods and Chaos Dwarf chains rattle in the distance. The smoke from the forges teaches a simple lesson: if someone else is building something terrible, hit them before they point it at you.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G27.t:0 "Drippin Fangs and the End Times"
 wet_starting_flavor.G27.d:0 "The Drippin Fangs know fear begins before the bite, when enemies see the wet shine on blades and start wondering what is dripping.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G28.t:0 "Stone-Fangaz and the End Times"
 wet_starting_flavor.G28.d:0 "The Stone-Fangaz are stubborn in the way rocks are stubborn, except rocks do not usually charge downhill screaming about teef.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G29.t:0 "Tusked Sunz and the End Times"
 wet_starting_flavor.G29.d:0 "The Tusked Sunz prize loud, forceful charges and banners that leave no doubt about which mob won the battle. Their bosses use those victories to gather followers, inheriting both a reputation for violence and the need to keep it supplied with fresh successes.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G30.t:0 "Moon Howlaz and the End Times"
 wet_starting_flavor.G30.d:0 "The Moon Howlaz listen for the Bad Moon in every dark sky, every shaman twitch, and every nervous noise enemies make after sunset.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G32.t:0 "Ironclad Skulls and the End Times"
 wet_starting_flavor.G32.d:0 "The Ironclad Skulls like the sound of metal on metal, especially when one of the metals is wrapped around their own heads.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G33.t:0 "Gorduz Crew and the End Times"
 wet_starting_flavor.G33.d:0 "Gorduz Backstabber knows survival under Chaos Dwarf masters requires good timing, useful cruelty, and a knife that can be blamed on someone else.\n\nHobgoblin power grew through mounted warfare, shifting bargains and a reputation for treachery that even other Greenskins remember. Some served the Chaos Dwarfs; others built independent steppe realms whose riders could threaten roads far beyond their own camps.\n\nThe End Times threaten to fill those roads with armies too large to evade forever. Chaos hosts, rival Greenskins and the settled eastern powers all have uses for Hobgoblin riders. Preserving freedom means judging which bargains buy strength and which merely postpone a master's chains."
 wet_starting_flavor.G35.t:0 "Broken Chainz and the End Times"
 wet_starting_flavor.G35.d:0 "The Broken Chainz preserve freedom through violence, treating restraint as an insult and submission as a challenge waiting to be answered. The tribe's bosses inherit that defiance, yet must find enough common purpose to keep their own followers from tearing the camp apart.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G36.t:0 "Hobgoblin Khaganate and the End Times"
 wet_starting_flavor.G36.d:0 "The Hobgoblin Khanate rides beneath the long shadow of the Hobgobla Khan, where wolf herds, camps, tribute, and ambushes all become tools of rule.\n\nHobgoblin power grew through mounted warfare, shifting bargains and a reputation for treachery that even other Greenskins remember. Some served the Chaos Dwarfs; others built independent steppe realms whose riders could threaten roads far beyond their own camps.\n\nThe End Times threaten to fill those roads with armies too large to evade forever. Chaos hosts, rival Greenskins and the settled eastern powers all have uses for Hobgoblin riders. Preserving freedom means judging which bargains buy strength and which merely postpone a master's chains."
 wet_starting_flavor.G37.t:0 "Ironskull and the End Times"
 wet_starting_flavor.G37.d:0 "Ironskull settles rival claims with the strength of its fighters and the judgement of its bosses. Its name promises a toughness that each generation must prove again, particularly when neighbouring tribes see a chance to turn an old reputation into fresh loot.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G39.t:0 "Skull Crags and the End Times"
 wet_starting_flavor.G39.d:0 "Skull Crags is a place where shouting comes back louder, which is useful for bosses, shamans, and anyone trying to make a pile of skulls sound official.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G40.t:0 "Bonerattlaz and the End Times"
 wet_starting_flavor.G40.d:0 "The Bonerattlaz rattle bones before battle because it scares enemies, excites the boyz, and gives the shamans something to blame if the first charge goes wrong.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G41.t:0 "Blue Vipers and the End Times"
 wet_starting_flavor.G41.d:0 "The Blue Vipers prefer enemies to discover the tribe only after the ambush has begun. Their warriors have made concealment and surprise a source of strength, preserving a following whose bosses must know when to strike and when to let a stronger army pass.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G42.t:0 "Arachnos and the End Times"
 wet_starting_flavor.G42.d:0 "Arachnos follows spider paths through roots, shadows, and sticky shrines where the unwary learn that forests can have too many legs.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G43.t:0 "Leaf Cutterz and the End Times"
 wet_starting_flavor.G43.d:0 "The Leaf Cutterz know every leaf can hide a blade, a trap, or a goblin waiting for the funniest possible moment.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G44.t:0 "Snake Eaterz and the End Times"
 wet_starting_flavor.G44.d:0 "The Snake Eaterz learned that some dangers stop being scary after they have been cooked, bitten, or worn as proof that the boss survived lunch.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G45.t:0 "Speakin' Treez and the End Times"
 wet_starting_flavor.G45.d:0 "The Speakin' Treez hear voices in the woods, which might be spirits, might be shamans, and might be goblins hiding badly.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G46.t:0 "Red Cloud and the End Times"
 wet_starting_flavor.G46.d:0 "The Red Cloud brings fire and destruction to the lands around its camps. Its bosses gather followers around the promise of spectacular raids, while shamans read rising smoke as proof that the gods have noticed the tribe's work.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G47.t:0 "Yellow Eye and the End Times"
 wet_starting_flavor.G47.d:0 "Yellow Eye sees things other mobs miss: weak gates, scared guards, unlucky stars, and loose loot that clearly wants rescuing.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.G48.t:0 "Broken Axe and the End Times"
 wet_starting_flavor.G48.d:0 "Broken Axe follows Puff Castle-kracka because a boss with that name has something to prove every morning. The tribe understands one kind of legitimacy: things were standing, then the boss arrived, and now they are not.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.H06.t:0 "Ulthuan and the End Times"
 wet_starting_flavor.H06.d:0 "Ulthuan's island kingdoms stand together beneath Phoenix King Finubar. Lothern's fleets and the island's ancient learning give the High Elves influence far beyond their shores, while the Great Vortex remains central to the world's defence against Chaos.\n\nThe first great wars against Chaos made the Elves guardians of a fragile magical order. The Sundering divided their people, and the War of the Beard helped end their Old World empire. Centuries of loss left a proud civilisation guarding achievements it cannot easily replace.\n\nThe End Times find Ulthuan in economic isolation. Its people must be persuaded to intervene before choosing the Empire’s Grand Alliance or the Phoenix Concord, while Naggaroth may become an enemy or a reluctant partner. Finubar’s disappearance can fracture the court, and an invading Druchii foothold can kindle civil war. Aliathra’s capture would demand a rescue, while drawing the Sword of Khaine trades the realm’s stability for strength in war. N’Kari’s waystone warnings still leave only weeks to prepare for a daemonic breach."
 wet_starting_flavor.H12.t:0 "Naggaroth and the End Times"
 wet_starting_flavor.H12.d:0 "Naggaroth's great cities answer to Malekith, the Witch King, whose black fleets and ruthless armies sustain an empire of exile and enslavement. Rival houses still scheme beneath his authority, even though the cities begin united in one realm.\n\nMalekith's struggle for the Phoenix Throne ended in the Sundering and the flight of his followers to the cold west. Their descendants built Naggaroth around an undying claim to Ulthuan, turning generations of defeat and vengeance into a national purpose.\n\nThe End Times threaten to overturn that purpose before it can be fulfilled. Malekith must settle the Cult of Pleasure's place at court and Morathi's influence while securing the western realm. Across the sea lies a permanent choice: exploit the crisis to conquer Ulthuan, or pay the political price of an accepted compact against Chaos."
 wet_starting_flavor.H19.t:0 "Arnheim and the End Times"
 wet_starting_flavor.H19.d:0 "Arnheim is a white scar on a dark coast, an Asur foothold where every stone seems to ask how long courage can stand so far from home. Naggaroth watches from the wilderness and the sea, patient as winter and twice as hungry.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten Arnheim from the northern wilderness and the sea. A Chaos offensive against Naggaroth would not make the Druchii safe neighbours, while help from Ulthuan must still cross hostile waters. The colony must preserve its harbour and fighting strength without assuming an enemy's enemy is a friend."
 wet_starting_flavor.H20.t:0 "S'sildra Tor and the End Times"
 wet_starting_flavor.H20.d:0 "S'sildra Tor stands like a threat that learned architecture. Too distant to rely on the grand cities and too proud to beg them for favor, its lords must make isolation into mystique and scarcity into discipline.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.H21.t:0 "Drackla and the End Times"
 wet_starting_flavor.H21.d:0 "Drackla begins without the comforting illusion that the great houses care whether it survives. That can be a weakness, or it can be freedom.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.H22.t:0 "Bleak Holds and the End Times"
 wet_starting_flavor.H22.d:0 "The Bleak Holds are cold even by Naggaroth's standards. They are a frontier of ice, chains, hard stone, and harder ambition, where lesser Druchii learn that exile can be refined into a weapon.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.H23.t:0 "Forgebound and the End Times"
 wet_starting_flavor.H23.d:0 "The Forgebound understand that metal remembers the hand that shapes it. In their holds, craft is not humble work but controlled violence: blades, collars, locks, armor, hinges, and tools made to decide whose will becomes law.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.H24.t:0 "Witchwood and the End Times"
 wet_starting_flavor.H24.d:0 "Witchwood is an isolated forest realm under Hextvar Fellheart, where the canopy shelters a people far from the familiar courts of the Old World. Its paths and sacred places offer protection, but also bind its defenders to ground that cannot simply be abandoned.\n\nThe forest Elves descend from communities that remained in the Old World when their kin withdrew across the sea. Survival required bargains with older forest powers, creating societies whose boundaries follow sacred groves and remembered oaths more closely than human maps.\n\nThe End Times threaten to bring northern war and spreading corruption into these hidden woods. Isolation can delay an enemy's arrival without ensuring rescue. Witchwood must preserve its paths, fighters and fragile bargains with the forest before a greater host tests the boundary."
 wet_starting_flavor.H25.t:0 "Citadel of Dusk and the End Times"
 wet_starting_flavor.H25.d:0 "The Citadel of Dusk guards hidden docks, waystones, and sanctioned routes far from Ulthuan's councils. It stands on the edge of Lustria like a lamp held above dark water, proud enough to shine and wise enough to shutter its windows.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H26.t:0 "Fortress of Dawn and the End Times"
 wet_starting_flavor.H26.d:0 "The Fortress of Dawn was named by people who understood the value of light arriving on time. Its walls watch sea lanes, reefs, strange coasts, and the thin line between imperial duty and colonial loneliness.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H27.t:0 "Tower of the Sun and the End Times"
 wet_starting_flavor.H27.d:0 "The Tower of the Sun is a beacon before it is a court. Its light tells pilots where to turn, merchants where to trust, and raiders where Asur patience ends.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H28.t:0 "Tower of the Stars and the End Times"
 wet_starting_flavor.H28.d:0 "The Tower of the Stars reads the sky because the sea lies too often. Its scholars, pilots, and sea lords chart omens, currents, storms, and the movements of powers that believe distance hides ambition from Ulthuan.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H29.t:0 "Elithis and the End Times"
 wet_starting_flavor.H29.d:0 "Elithis lies where letters arrive late, spices dry in guarded storehouses, pearls change hands under watchful eyes, and monsoon pilots know which promises survive bad weather. It is distant, but not provincial; isolated, but not small.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H30.t:0 "Calith and the End Times"
 wet_starting_flavor.H30.d:0 "Calith survives by making distance legible. Every harbor light, ledger mark, signal flag, shrine rite, and disciplined patrol says that the Asur are still capable of order where maps grow uncertain.\n\nThe High Elves once maintained colonies and sea routes across much of the world. The Sundering divided their people, while the War of the Beard and later withdrawals diminished their reach. Their surviving strongholds preserve an ancient duty to resist Chaos despite dwindling numbers.\n\nThe End Times threaten the sea lanes and magical order on which that inheritance rests. Druchii fleets, hostile shores and distant allies compete for scarce ships and soldiers. A surviving fortress is useful only if its people can keep contact with the wider world."
 wet_starting_flavor.H31.t:0 "Corsairs of Spite and the End Times"
 wet_starting_flavor.H31.d:0 "The Corsairs of Spite have made a polity out of vengeance with rigging. Their captains elect, threaten, bribe, and murder with the same practical spirit, because a corsair republic is still Druchii society, only with more salt on the knife.\n\nThe Druchii trace their exile to the Sundering, when Malekith's struggle for Ulthuan ended in a divided Elven people. Naggaroth became a realm of harsh cities, slave-taking fleets and murderous rivalries, sustained by the hope of returning as conquerors.\n\nThe approaching End Times threaten to interrupt that ancient vengeance. Northern Chaos hosts endanger the homeland while enemies and rivals contest every sea route. Power must be gathered without giving a rival the chance to inherit the fruits of victory."
 wet_starting_flavor.H32.t:0 "Nocthyrion and the End Times"
 wet_starting_flavor.H32.d:0 "The northern colony-harbors of Elithis did not fall to raiders or storm. They found the Bleeding Idol in the island's shadowed interior, a thing of unknown craft that wept into its basin and taught noble blood to hunger for noble blood.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.I01.t:0 "Goldtooth and the End Times"
 wet_starting_flavor.I01.d:0 "Goldtooth measures power in meat, coin, and the number of tribes willing to get out of Greasus' way. The caravan roads feed him, fear him, and somehow still come back with more tribute.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I02.t:0 "Sabreskin and the End Times"
 wet_starting_flavor.I02.d:0 "Sabreskin holds the passes where caravans slow down and beasts leave good pelts behind. Their chiefs wear scars like ledgers, and every hide nailed over a gate tells visitors that coin, cattle, or flesh will be taken before the road opens.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I03.t:0 "Ironskin and the End Times"
 wet_starting_flavor.I03.d:0 "Ironskin believes a belly is only as honest as the plate strapped across it. Their camps ring with hammered metal, butcher chants, and boasts from bulls who think a good gutplate should stop a spear and announce its owner before he speaks.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I04.t:0 "Bulgers and the End Times"
 wet_starting_flavor.I04.d:0 "The Bulgers are famous for wanting more even by Ogre standards. More cattle, more captives, more gnoblars, more room at the fire, more enemies foolish enough to bring lunch wrapped in armor.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I05.t:0 "Loosetooth and the End Times"
 wet_starting_flavor.I05.d:0 "Loosetooth sells protection with a grin that promises nothing for free. Missing teeth, cracked tusks, and old caravan tallies hang beside the butcher fires, each one proof that debts here are remembered until something softer pays them.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I06.t:0 "Suneaters and the End Times"
 wet_starting_flavor.I06.d:0 "The Suneaters tell rivals that even the sun is only a meal too bright to swallow quickly. Their camps prize scorched iron, red coals, fire-blackened meat, and butchers who claim the Great Maw's hunger can be heard in every flame.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I07.t:0 "Bloody Fist and the End Times"
 wet_starting_flavor.I07.d:0 "The Bloody Fist does not argue when a punch will settle accounts. Its bosses mark treaties with smashed shields, broken noses, and red handprints on toll stones, because every neighbor understands a fist better than a parchment.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I08.t:0 "Mountain Eaters and the End Times"
 wet_starting_flavor.I08.d:0 "The Mountain Eaters claim the peaks are just a meal too slow for lesser jaws. They chew slate for wagers, drag boulders into feast rings, and demand that any caravan crossing their slopes admit the mountain already belongs to them.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I09.t:0 "Sons of the Mountain and the End Times"
 wet_starting_flavor.I09.d:0 "The Sons of the Mountain speak of the peaks as kin, not scenery. Their elders point to cliffs as if naming ancestors, while butchers smear blood into cracks and swear the stone remembers every tribe that tried to pass without tribute.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I10.t:0 "Blood Guzzlers and the End Times"
 wet_starting_flavor.I10.d:0 "The Blood Guzzlers do not wait for meat to cool before celebrating. Their feasts begin beside the bodies, their bowls are red before the first song, and their butchers say the Great Maw prefers courage served warm.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I11.t:0 "Lazargh and the End Times"
 wet_starting_flavor.I11.d:0 "Lazargh sits where the road learns caution. Cathayan bales, gnoblar carts, mule trains, and nervous merchants pass beneath Ogre eyes, and every guard captain knows the cheapest toll is the one paid before the bulls get bored.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I12.t:0 "Feastmaster and the End Times"
 wet_starting_flavor.I12.d:0 "Feastmaster treats the table as a throne, altar, court, and battlefield. Chiefs who refuse a seat insult the Maw, chiefs who accept must survive the portions, and every course decides who leaves heavier, poorer, or not at all.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I13.t:0 "Manbiters and the End Times"
 wet_starting_flavor.I13.d:0 "The Manbiters like enemies who run, bargain, pray, and fit into pots without being sawn apart first. Human towns, caravan guards, and border forts know the name as a warning that walls are only spice for patient hunger.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I14.t:0 "Treehammer and the End Times"
 wet_starting_flavor.I14.d:0 "Treehammer sees forests as enemies standing too close together. Their bulls crack trunks for sport, drag whole trees back to camp as firewood trophies, and tell woodland spirits to stop hiding behind furniture.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I15.t:0 "Boulderbellies and the End Times"
 wet_starting_flavor.I15.d:0 "Boulderbellies decorate their camps with rocks too large for sensible people to move. They roll stones into enemy lines, carve feast marks into cliffs, and insist a full belly should land with the weight of a landslide.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I16.t:0 "Skraggle Guts and the End Times"
 wet_starting_flavor.I16.d:0 "Skraggle Guts comes from roads that sink under the cart and laugh at clean boots. Their camps smell of wet hides, smoked fish, sour beer, and suspicious stew, while their scouts know where a loaded wagon slows before the ambush.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I18.t:0 "Crossed Clubs and the End Times"
 wet_starting_flavor.I18.d:0 "Crossed Clubs began as a warning sign and became a banner. Two bruiser bands, two old grudges, and one enormous appetite now stand over the same cooking pit, each pretending unity was their idea first.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I19.t:0 "Fulg and the End Times"
 wet_starting_flavor.I19.d:0 "Fulg is not the loudest name in the mountains, which makes its hunger more dangerous. Small camps learn quickly, quiet butchers listen carefully, and chiefs who laugh at Fulg's pot often end inside it.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I20.t:0 "Payswords and the End Times"
 wet_starting_flavor.I20.d:0 "The Payswords have learned that a sword rented before lunch can buy dinner twice. Their camps keep account marks beside butcher hooks, and every captain knows loyalty lasts longest when the next payment is visible.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.I25.t:0 "Grand Cathay and the End Times"
 wet_starting_flavor.I25.d:0 "Grand Cathay is united under Xen Yang, the Dragon Emperor. From Wei-Jin, imperial government binds populous provinces, prosperous cities and long caravan routes, while the Great Bastion guards the northern approaches.\n\nThe Dragon Emperor's civilisation outlasted countless western dynasties through administration, cultivated order and the labour of its people. Repeated incursions and the sheer distance between its frontiers showed that even ancient authority needs roads, garrisons and competent servants.\n\nThe End Times threaten to test all of them at once. Northern hosts and hostile powers beyond the southern borders stretch Cathay's armies while trade falters. In late 2520, the Unwritten Host will seek a breach behind the Great Bastion. The court will receive warning before the daemons manifest. The throne is occupied, but frontier walls alone cannot protect the northern interior."
 wet_starting_flavor.I33.t:0 "Dead Flag Fleet and the End Times"
 wet_starting_flavor.I33.d:0 "The Dead Flag Fleet sails as a bad omen made practical. Corpse-junks creak through fog, drowned crews haul lines without breath, and captains who should have rotted years ago still read the southern currents by moonlight.\n\nNecromancy turned wrecks and drowned sailors into the foundations of maritime dominions. Undead captains outlasted mortal crews and rival fleets, raising the victims of shipwreck and battle to extend wars that should have ended with their own deaths.\n\nThe End Times promise wrecks, plunder and recruits, but rival captains and hostile shores still contest the sea. Greater powers of undeath may demand service rather than partnership. A deathless crew is useful only while its master can preserve the ships and harbours that carry it."
 wet_starting_flavor.I34.t:0 "Dimmed Sunz and the End Times"
 wet_starting_flavor.I34.d:0 "The Dimmed Sunz say the sky went dark because it wanted to watch them fight without being seen. Their bosses daub black suns on shields, shove shamans toward any omen that sounds useful, and raid with the certainty that daylight is for gits who need directions.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.I35.t:0 "Monkey Court and the End Times"
 wet_starting_flavor.I35.d:0 "The Monkey Court preserves the Monkey King's challenge to Cathay from its mountain domain. Wit, unruly followers and resentment of the dragon order give it influence that a tidy imperial register cannot fully describe.\n\nThe Monkey King once seized the Dragon Throne during an earlier imperial absence, only to be driven out when the dragons returned. Defeat left an enduring rival in the mountains, able to exploit the distance between imperial claims and local obedience.\n\nXen Yang rules Cathay again in this age; there is no empty throne waiting to be occupied. The End Times may bring outside allies or destroy the lands the Monkey King covets. He must judge whether each bargain advances his own ambitions or makes his court another conqueror's tool."
 wet_starting_flavor.I41.t:0 "Hoka and the End Times"
 wet_starting_flavor.I41.d:0 "Hoka is crowded with shrines that all insist their offering is the one dragons notice. Priests argue over incense, gems, captives, fish, feathers, heart-blood, and old stone names, while warriors wait to learn which quarrel has become law.\n\nIsolation from the great Slann centres left the Dragon Isles' Lizardmen with fractured memories of the Old Ones. Living dragons and local priesthoods became the focus of authority; Hoka now gathers neighbouring island communities into a wider realm without erasing their rival sacred claims.\n\nThe End Times may reach the islands as raiders, disrupted shipping and struggles over sacred authority. With no great Slann court to resolve their differences, Hoka's priests and chiefs must hold the realm together themselves. Defending the shores will require cooperation before another dispute over tribute consumes the warriors needed to guard them."
 wet_starting_flavor.I42.t:0 "Ho-Ko and the End Times"
 wet_starting_flavor.I42.d:0 "Ho-Ko guards a jade shrine whose polish reflects too many claimants. Dragon priests, clan elders, blood-monks, and ambitious kin all say they know what the shrine demands, which is usually obedience from everyone else.\n\nIsolation from the great Slann centres left the Dragon Isles' Lizardmen with fractured memories of the Old Ones. Living dragons and local priesthoods became the focus of authority; Ho-Ko now holds a wider island realm whose clans bring competing claims to its jade shrine.\n\nThe End Times may reach the islands as raiders, disrupted shipping and struggles over sacred authority. Ho-Ko's rival claimants must turn reverence for the jade shrine into dependable cooperation. A realm divided over offerings will have little strength left when an enemy arrives to take them all."
 wet_starting_flavor.I49.t:0 "Aki-Aka and the End Times"
 wet_starting_flavor.I49.d:0 "The Old Ones are half-buried names in Aki-Aka's volcanic isles. Their plaques lie cracked beneath step-altars, skull racks, gem masks, and blood-smoke raised for the living dragons who coil above the mountains.\n\nIsolation from the great Slann centres left the Dragon Isles' Lizardmen with fractured memories of the Old Ones. Living dragons and local priesthoods became the focus of authority; Aki-Aka now gathers a wider island realm beneath traditions that still compete for tribute and obedience.\n\nThe End Times may reach the islands as raiders, disrupted shipping and struggles over sacred authority. Aki-Aka must reconcile the demands of its dragons with the survival of the communities that feed them. Keeping the wider island realm together is the first defence against a danger the old rites may not explain."
 wet_starting_flavor.R01.t:0 "Realm of Khorne and the End Times"
 wet_starting_flavor.R01.d:0 "The Realm of Khorne is a domain of slaughter and martial fury, shaped by its god's will rather than mortal law. Daemonic hosts gather around the Brass Citadel, while a passage into the northern Wastes gives that power a road into the material world.\n\nSince the ancient collapse of the polar gates, the powers of Chaos have fought both the mortal world's defenders and one another. Their Great Game outlasts kingdoms; each victory strengthens a god while inviting the jealousy of the other three.\n\nThe End Times offer Khorne a chance to overwhelm mortal resistance through bloodshed. Archaon may carry the gods' common purpose, but this realm begins independent and divine rivalry has not ended. Its hosts must secure their passage and decide how much strength to spend on the mortal war while rival gods remain at the borders."
 wet_starting_flavor.R02.t:0 "Realm of Nurgle and the End Times"
 wet_starting_flavor.R02.d:0 "The Realm of Nurgle is a domain of decay, endurance and pestilence, shaped by its god's will rather than mortal law. Daemonic hosts gather around the Garden of Nurgle, while a passage into the northern Wastes gives that power a road into the material world.\n\nSince the ancient collapse of the polar gates, the powers of Chaos have fought both the mortal world's defenders and one another. Their Great Game outlasts kingdoms; each victory strengthens a god while inviting the jealousy of the other three.\n\nThe End Times offer Nurgle a chance to overwhelm mortal resistance through plague. Archaon may carry the gods' common purpose, but this realm begins independent and divine rivalry has not ended. Its hosts must secure their passage and decide how much strength to spend on the mortal war while rival gods remain at the borders."
 wet_starting_flavor.R03.t:0 "Realm of Tzeentch and the End Times"
 wet_starting_flavor.R03.d:0 "The Realm of Tzeentch is a domain of sorcery, change and forbidden knowledge, shaped by its god's will rather than mortal law. Daemonic hosts gather around the Impossible Fortress, while a passage into the northern Wastes gives that power a road into the material world.\n\nSince the ancient collapse of the polar gates, the powers of Chaos have fought both the mortal world's defenders and one another. Their Great Game outlasts kingdoms; each victory strengthens a god while inviting the jealousy of the other three.\n\nThe End Times offer Tzeentch a chance to overwhelm mortal resistance through sorcery. Archaon may carry the gods' common purpose, but this realm begins independent and divine rivalry has not ended. Its hosts must secure their passage and decide how much strength to spend on the mortal war while rival gods remain at the borders."
 wet_starting_flavor.R04.t:0 "Realm of Slaanesh and the End Times"
 wet_starting_flavor.R04.d:0 "The Realm of Slaanesh is a domain of excess, obsession and desire, shaped by its god's will rather than mortal law. Daemonic hosts gather around the Palace of Pleasure, while a passage into the northern Wastes gives that power a road into the material world.\n\nSince the ancient collapse of the polar gates, the powers of Chaos have fought both the mortal world's defenders and one another. Their Great Game outlasts kingdoms; each victory strengthens a god while inviting the jealousy of the other three.\n\nThe End Times offer Slaanesh a chance to overwhelm mortal resistance through temptation. Archaon may carry the gods' common purpose, but this realm begins independent and divine rivalry has not ended. Its hosts must secure their passage and decide how much strength to spend on the mortal war while rival gods remain at the borders."
 wet_starting_flavor.U01.t:0 "Clan Rictus and the End Times"
 wet_starting_flavor.U01.d:0 "Clan Rictus wears black fur like a claim to rule. Its Stormvermin shove lesser rats aside, its warlords sell discipline as terror, and its merchants count every insult from Clan Mors as a debt to be repaid in stolen tunnels.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U03.t:0 "Clan Moulder and the End Times"
 wet_starting_flavor.U03.d:0 "Clan Moulder hears destiny in the scrape of bone-saws and the wet growl of things that should not live. Hell Pit is less a city than a stomach full of cages, laboratories, and excuses for why the last batch only killed half the handlers.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U04.t:0 "Karaz-a-Karak and the End Times"
 wet_starting_flavor.U04.d:0 "Karaz-a-Karak is the throne of memory, and Thorgrim Grudgebearer carries more than a crown. The Dammaz Kron is not a book of complaints; it is a map of everything the world still owes the Dawi.\n\nThe Time of Woes shattered the Dwarfen mountain empire, but Karaz-a-Karak remained the High King's seat. Thorgrim inherited its duty to hold the surviving clans together; Karak Kadrin, Zhufbar and the newly recovered neighbouring lands now broaden that responsibility.\n\nThe mountain approaches face Skaven clans and Greenskin tribes while the End Times gather beyond them. Reikland has raised the Grand Alliance, but the High King's realm remains independent of it. Thorgrim can strengthen the forges, settle nearby grudges and choose between sealed passes and a willing coalition. Beyond these mountains, other Dwarfen rulers may accept his protection and swear fealty; neither foreign allegiance nor the survival of the holds is assured."
 wet_starting_flavor.U07.t:0 "Karak Hirn and the End Times"
 wet_starting_flavor.U07.d:0 "Karak Hirn is the Hornhold, a younger hold by Dawi memory but no less stubborn for it. Its horns carry warnings across the Black Mountains, its overroads draw merchants from Tilea and the Empire, and its smiths arm clans who know every pass can become a battlefield.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U09.t:0 "Clan Ferrik and the End Times"
 wet_starting_flavor.U09.d:0 "Clan Ferrik squats over stolen forges and calls theft industry. Dwarf slaves drag ore, Skryre envoys buy metal with suspicious smiles, and steel-masked warlords promise that iron is better than courage because it can be hammered onto cowards.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U11.t:0 "Clan Fester and the End Times"
 wet_starting_flavor.U11.d:0 "Clan Fester keeps sacred memories in pus, rot, and old stories of the Black Death. Its monks bless fever, its warriors cough like drums, and the ruins of Karak Gnol provide stones dark enough to make disease feel like inheritance.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U12.t:0 "Clan Skrapp and the End Times"
 wet_starting_flavor.U12.d:0 "Clan Skrapp can build a kingdom from refuse if given enough nails and panic. Middenheap markets, scavenged gears, bone bribes, back-tunnel informants, and clawpacks cheap enough to spend twice give its bosses a talent for ugly usefulness.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U13.t:0 "Karak Grom and the End Times"
 wet_starting_flavor.U13.d:0 "Karak Grom answers danger with horns deep enough to make stone remember. Its Vault roads carry wardens, caravans, and grudges between high gates, while oath-halls beneath the echoes keep every clan mindful that silence is rarely good news.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U14.t:0 "Karak Izor and the End Times"
 wet_starting_flavor.U14.d:0 "Karak Izor, the Copper Mountain, stands as the proudest of the western holds. Copper veins, refugee lineages, royal authority, and Vault Underway works all run through its halls, where every ingot is both trade good and promise of another cannon.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U15.t:0 "Karak Eksfilaz and the End Times"
 wet_starting_flavor.U15.d:0 "Karak Eksfilaz listens to leaves as carefully as ledgers. From Whispering Aspen Mountain, its merchants and crossbow galleries watch the western roads toward Tilea, where caravans bring profit, rumors, and trouble wearing polite boots.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U16.t:0 "Karak Kaferkammaz and the End Times"
 wet_starting_flavor.U16.d:0 "Karak Kaferkammaz rises higher than comfort and claims that height as virtue. Marble layers, ore seams, metalworkers, shrine-cutters, and high-hold hammerers carve strength from a mountain where breath is thin and pride is not.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U17.t:0 "Red Eye and the End Times"
 wet_starting_flavor.U17.d:0 "The Red Eye hides in old Dwarf stone and laughs in the dark. Night Goblins daub red signs over stolen gates, brew fungus stink in side tunnels, and raid toward the eastern Empire whenever the Bad Moon looks like it wants entertainment.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.U18.t:0 "New Lahmia and the End Times"
 wet_starting_flavor.U18.d:0 "New Lahmia is Neferata's answer to exile, memory, and every court that thought the Lahmian dream had died. Beauty opens doors, fear keeps them open, and secrets decide who enters next.\n\nThe destruction of ancient Lahmia scattered its vampire nobility, but Neferata carried its ambition into exile. From her later court she built influence through agents, secrets and relationships that could outlast the mortal dynasties they manipulated.\n\nThe End Times threaten another theft of that sovereignty. Necromancers covet the legions, living intruders plunder the tombs and rival dynasties remember every slight. Preserving the royal will means defending sacred ground against those who would turn an eternal kingdom into someone else's army."
 wet_starting_flavor.U19.t:0 "Clan Gritus and the End Times"
 wet_starting_flavor.U19.d:0 "Clan Gritus smells opportunity through jungle steam. Its warrens creep along the isthmus, weaker clans vanish into its ledgers, and Lustrian spoil routes carry gold, stone tablets, feathers, and lies back to bosses who call scavenging strategy.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U20.t:0 "Clan Mange and the End Times"
 wet_starting_flavor.U20.d:0 "Clan Mange treats loyalty as a contract written on meat and revised after payment. Mangy veterans, hireling clawpacks, contract warrens, and bone-pay ledgers keep its warriors marching for whichever patron seems least likely to survive the invoice.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U21.t:0 "Karak Norn and the End Times"
 wet_starting_flavor.U21.d:0 "Karak Norn watches the forest from stony heights where the earth gives little without argument. Hadora Ironpick's legacy, Grey Mountain mines, New Bugman's Brewery, and dour shieldwalls bind a hold that has learned to prosper without pretending the world is kind.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U22.t:0 "Karak Azul and the End Times"
 wet_starting_flavor.U22.d:0 "Karak Azul is the Iron Peak, and it intends everyone to remember why. Its plateaus hold rich veins, weaponsmiths, runesmiths, ledgers, and armories whose work can decide wars before the first insult is properly recorded.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U23.t:0 "Clan Volkn and the End Times"
 wet_starting_flavor.U23.d:0 "Clan Volkn lives where other rats cough, burn, and die. Ash warrens, hot stone tunnels, flame rites, and fire-hardened clawpacks give its bosses the confidence of creatures who think lava is only bad footing for weaker paws.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U24.t:0 "Nagashizzar and the End Times"
 wet_starting_flavor.U24.d:0 "Arkhan the Black rules Nagashizzar as regent at Cripple Peak, guarding the surviving husk of Nagash. He must secure willing deathless courts, recover seven relics and gather three living sacrificial victims before the Great Restoration can return his master. It alone begins aligned with Nagash and leads the Nagashi faction. The other deathless realms remain independent of his banner, ruled by Unaligned governments with small Nagash-aligned minorities.\n\nNagash began as a Nehekharan prince and priest before becoming the great architect of necromancy. His usurpation, Black Pyramid and wars against the living turned the promise of immortality into a curse. Defeat diminished him without erasing the knowledge or ambitions bound to his name.\n\nThe End Times offer the prospect of renewed power, not the certainty of a completed resurrection. Settra rejects servitude, vampires pursue their own designs, and Chaos threatens everything a deathless empire could rule. After resurrection, both the Nehekharan conquest and the war against the Everchosen remain possible. Taking the full Nehekharan homeland prompts Nagash to offer the living Settra a Mortarch’s title. Later Black Pyramid work requires a site that must be defended against Skaven infiltration and demolition."
 wet_starting_flavor.U25.t:0 "The Underempire and the End Times"
 wet_starting_flavor.U25.d:0 "The Underempire is ruled by the Council of Thirteen from Skavenhold in the Blighted Marshes. It leads Vermintide, but the other surviving clans remain independent and every council command must compete with fear, ambition and the instinct to betray.\n\nFrom their earliest warrens, the Skaven spread beneath the cities and mountains of other peoples. Plague, stolen craft and overwhelming numbers made them a hidden power, while repeated clan struggles frustrated every claim to lasting unity under the Horned Rat.\n\nAs the End Times approach, the Council can begin the southern uprising with the Night of a Thousand Terrors, then pursue Tilea, Estalia and the eastern mountains independently. Choose a ruling clan and a scapegoat, bargain with foreign leaders, and unite the distant warrens. Skryre's Special Projects offer Doomspheres, Stormfiends and a weapon against Morrslieb, but the final choice is whether to destroy the world or rule what survives."
 wet_starting_flavor.U28.t:0 "Clan Eshin and the End Times"
 wet_starting_flavor.U28.d:0 "Clan Eshin learned patience in distant shadows and returned with knives quieter than Skaven politics should allow. Night runners, gutter runners, contract killers, stolen plans, and masked masters make its warrens valuable to every lord who claims not to fear them.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U29.t:0 "Clan Pestilens and the End Times"
 wet_starting_flavor.U29.d:0 "Clan Pestilens follows Nurglitch VII in devotion to the Horned Rat through disease. Its scattered possessions include the fortified warrens of the southern Spine of Sotek, where plague priests confront Lizardmen and hostile neighbours at close quarters.\n\nPestilens returned from its long experience in Lustria with virulent rites and enough strength to challenge the established Skaven order. Its wars against the temple-cities made infection a weapon of conquest and a sacred inheritance passed from priest to priest.\n\nThe End Times promise unprecedented opportunities for that creed, but the clan remains independent of Skavenblight's Vermintide. Rival Skaven covet its strength while Lustrian defenders seek to cleanse its footholds. It must preserve its dispersed bases before turning local epidemics into a wider campaign."
 wet_starting_flavor.U31.t:0 "Clan Carrion and the End Times"
 wet_starting_flavor.U31.d:0 "Clan Carrion follows battles the way merchants follow fairs. Corpse heaps, bone carts, vulture signs, scavenger clawpacks, and afterbattle informants teach its bosses that the dead are quiet customers but excellent suppliers.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U32.t:0 "Clan Skab and the End Times"
 wet_starting_flavor.U32.d:0 "Clan Skab does not need elegance when it has bodies. Scab-fur clawpacks, skinflint quartermasters, scratch tunnels, and boss-claw bullying keep the warrens moving by reminding every rat that someone worse is behind him.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U34.t:0 "Clan Crooktail and the End Times"
 wet_starting_flavor.U34.d:0 "Clan Crooktail calls mutation favor because the alternative is admitting the tail should not bend that way. Warpstone-choked warrens, northern waste scars, tainted envoys, and frenzied clawpacks make its deformities both theology and threat.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U35.t:0 "Clan Skully and the End Times"
 wet_starting_flavor.U35.d:0 "Clan Skully pays in bone tokens and collects in silence. Skull-masked night runners, Eshin murder contracts, backstabber clawpacks, and vanishing tunnels let its killers appear as rumor, blade, and empty space in exactly that order.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U36.t:0 "Karak Zorn and the End Times"
 wet_starting_flavor.U36.d:0 "Karak Zorn is a name older than many grudges and lonelier than most songs admit. Southland jungle presses against ancient gates, lost veins glitter under roots, and ancestor oaths survive in halls that the northern Karaz Ankor half remembers as legend.\n\nThe Dwarfs once linked their mountain holds through the roads of the Karaz Ankor and the deep Underway. The War of the Beard and the Time of Woes broke that strength; earthquakes, Greenskins and Skaven left surviving clans guarding fragments of a greater inheritance.\n\nThe End Times threaten to finish what centuries of siege could not. Enemy tunnels and broken communications can isolate a hold before help arrives. Its people must preserve the roads, workshops and fighting strength that turn ancestral pride into a defence the next generation can inherit."
 wet_starting_flavor.U37.t:0 "Clan Angrund and the End Times"
 wet_starting_flavor.U37.d:0 "Clan Angrund fights to recover Karak Eight Peaks under Belegar Ironhammer. Its claim is already contested by Skarsnik's Crooked Moon Tribe and Queek's Legion; all three rivals begin at war with one another.\n\nThe fall of the City of Pillars scattered its Dwarfen clans and left the royal inheritance in exile. Belegar's followers carry that claim as a duty to their ancestors, seeking to turn repeated expeditions and hard-won footholds into a permanent restoration.\n\nThe End Times give the struggle a terrible urgency. Every soldier spent in the tunnels is unavailable against the greater disasters gathering beyond them, yet abandoning the claim would surrender generations of purpose. Angrund must secure a defensible foothold and defeat both rivals without exhausting the people it hopes to bring home."
 wet_starting_flavor.U38.t:0 "Crooked Moon Tribe and the End Times"
 wet_starting_flavor.U38.d:0 "The Crooked Moon Tribe follows Skarsnik through the contested tunnels of Karak Eight Peaks. Clan Angrund and Queek's Legion already fight to dislodge it, and the three powers begin in a war with no safe rear.\n\nNight Goblins occupied halls the Dwarfs lost through generations of siege and disaster. Skarsnik turned cunning, traps and knowledge of the dark into a claim that larger warriors could not simply sweep aside, while the city's other inhabitants refused to concede his mastery.\n\nThe End Times promise even greater fights beyond the mountain, but survival begins in the next tunnel. Skarsnik must outwit Belegar and Queek, keep his followers supplied and avoid losing the tribe's hard-won position to a single reckless battle."
 wet_starting_flavor.U39.t:0 "Queek's Legion and the End Times"
 wet_starting_flavor.U39.d:0 "Queek's Legion contests Karak Eight Peaks through force, discipline and the example of its Headtaker. Both Clan Angrund and the Crooked Moon Tribe are enemies from the start; a victory over one does not end the war with the other.\n\nQueek rose through Clan Mors as a champion unusually willing to meet danger himself, supported by brutal veterans and a growing collection of trophies. The struggle for the City of Pillars placed that reputation against Dwarfen claims and Goblin mastery of the tunnels.\n\nThe End Times offer a larger stage, but first the legion must secure the roads and chambers on which its position depends. Belegar, Skarsnik and rival Skaven will exploit any weakness. Glory won at an unsustainable cost could leave Queek with famous trophies and no army to guard them."
 wet_starting_flavor.U42.t:0 "Clan Mordkin and the End Times"
 wet_starting_flavor.U42.d:0 "Clan Mordkin hates the dead because they do not squeal properly. Bone-armored Stormvermin, corpse-warren tithes, Fellblade legends, and necropolis informants make its warriors stalk graves with a mixture of terror, envy, and professional interest.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U43.t:0 "Clan Grutnik and the End Times"
 wet_starting_flavor.U43.d:0 "Clan Grutnik owns enough green glow to make greed look religious. Warpstone deposits, branded miners, Skryre buyers, Moulder buyers, toxic armor, and paid diggers make its tunnels rich, unstable, and popular with exactly the wrong visitors.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U44.t:0 "Clan Verms and the End Times"
 wet_starting_flavor.U44.d:0 "Clan Verms is what happens when numbers become an argument. Breeding warrens, refuse tolls, gnawhole quartermasters, sewer-scent envoys, and clawpacks without obvious end give its bosses a beautiful answer to every tactical question: more rats.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U49.t:0 "Clan Flem and the End Times"
 wet_starting_flavor.U49.d:0 "Clan Flem has turned mucus into infrastructure. Phlegm-vats bubble under its warrens, spittle-censer priests bless choking clouds, and disgusting envoys prove that some negotiations end because the other side cannot bear to continue breathing.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.U51.t:0 "Frozen Expedition and the End Times"
 wet_starting_flavor.U51.d:0 "The Frozen Expedition went north seeking stone, ore, and answers, then found a curse patient enough to wait under ice. Pale Dawi still keep ledgers, frost-sealed grudgebooks, and blood-iron storehouses, but night has become a practical part of the watch rotation.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.V01.t:0 "Vampire Coast and the End Times"
 wet_starting_flavor.V01.d:0 "The Vampire Coast is less a country than a shoreline that refused burial. Luthor Harkon's madness, barnacled grave-ports, corpse-haunted coves, zombie press gangs, and cannon crews dragged from the surf have made Lustria's eastern waters a kingdom of wet rot and ambition.\n\nNecromancy turned wrecks and drowned sailors into the foundations of maritime dominions. Undead captains outlasted mortal crews and rival fleets, raising the victims of shipwreck and battle to extend wars that should have ended with their own deaths.\n\nThe End Times promise wrecks, plunder and recruits, but rival captains and hostile shores still contest the sea. Greater powers of undeath may demand service rather than partnership. A deathless crew is useful only while its master can preserve the ships and harbours that carry it."
 wet_starting_flavor.V02.t:0 "Amazonia and the End Times"
 wet_starting_flavor.V02.d:0 "Amazonia keeps the Old Ones in a human voice. Sisterhood warbands, river gardens, hidden shrines, sunstaff relics, and priestess councils preserve a sacred inheritance older than their settlements and stranger than any warm-blooded empire can comfortably explain.\n\nAmazon communities preserved their own sacred traditions amid the ruins and relics of the Old Ones. Their isolation kept much of that inheritance beyond the reach of foreign powers, while ties with neighbouring temple peoples never erased their separate identity.\n\nThe End Times bring treasure hunters, raiders and darker armies toward the same sanctuaries. A stolen relic can be as serious a loss as a ruined settlement. Guarding the rivers and deciding whom to trust will determine whether that ancient inheritance survives another age."
 wet_starting_flavor.V03.t:0 "Itza and the End Times"
 wet_starting_flavor.V03.d:0 "Itza is the First City, and its stones remember when the Old Ones walked where lesser races now trespass. Every ziggurat, spawning pool, causeway, and glyph is part of a design older than the ambitions of warmblood kings.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V04.t:0 "Hexoatl and the End Times"
 wet_starting_flavor.V04.d:0 "Hexoatl rests beneath the will of Lord Mazdamundi, whose patience is geological and whose anger can move mountains. The City of the Sun is not only a capital; it is a statement that the Old Ones' order still has teeth.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten the coherence of the Great Plan itself. Mazdamundi must hold the northern approaches against intruders while Skaven corruption and more distant disasters undermine the sacred world. Preserving temple communications and choosing where to commit the cohorts will determine how much of that world can still be defended."
 wet_starting_flavor.V05.t:0 "Skeggi and the End Times"
 wet_starting_flavor.V05.d:0 "Skeggi is the oldest human foothold in Lustria, which means it has survived by being too stubborn, useful, and violent to disappear. Its stilted streets, rough docks, jungle roads, Norscan jarls, and treasure-drunk explorers cling to the coast between reptile gods and hungry green darkness.\n\nGenerations of northern clans lived by harsh harvests, seafaring, raiding and the strength of their chiefs. Trade and plunder connected their halls to distant shores; the favour of the Dark Gods could raise a warrior above kings or destroy him utterly.\n\nThe End Times threaten Skeggi through hostile jungle, disrupted sea routes and the ambitions of powers far greater than its jarls. Northern kin may bring trade or demands for obedience, while Lustria's defenders tolerate no limitless trespass. The settlement must keep its ships and supplies secure before choosing which wars it can afford."
 wet_starting_flavor.V06.t:0 "Tlaxtlan and the End Times"
 wet_starting_flavor.V06.d:0 "Tlaxtlan watches the moons with a discipline outsiders would call silence. Its priests, Skinks, and Saurus read omens in cold light while lesser minds ask for simpler orders.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V07.t:0 "Xahutec and the End Times"
 wet_starting_flavor.V07.d:0 "Xahutec is the City of Echoes, and not every echo belongs to the living. Rift-sealed ruins, tainted spawning pools, old wards, daemon-hunter cohorts, and messages carried toward Itza make its stones sound with warnings left by catastrophes that never fully ended.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times bring fresh pressure upon the wards around Xahutec. In spring 2520, the temple guardians will warn that the Legions of the Broken Seal are gathering beyond the veil. A Khornate host will seek an undefended foothold in the mainland approaches. The realm must hold its jungle roads and contain the breach before the daemons reach the temple-city."
 wet_starting_flavor.V08.t:0 "Tlax and the End Times"
 wet_starting_flavor.V08.d:0 "Tlax is called the City of Ghosts because memory walks heavily there. Pearl stores, Tarantula Coast wardens, spectral battle omens, golden spire lures, and Skink envoys move through a temple-city where absence has become part of the garrison.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V09.t:0 "Chaqua and the End Times"
 wet_starting_flavor.V09.d:0 "Chaqua was the City of Gold before plague and violation turned splendor into warning. Storehouses of golden plaques, cleansing cohorts, purification rites, Sotek's remembered omen, and wary Skink diplomats now stand between sacred wealth and the filth that once defiled it.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V10.t:0 "Xlanhuapec and the End Times"
 wet_starting_flavor.V10.d:0 "Xlanhuapec, the City of Mists, preserves its temple precincts behind veils that confound intruders. Its defenders inherited both a sacred refuge and a responsibility to maintain the wards, for concealment loses its value when an enemy learns the paths beneath it.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V11.t:0 "Axlotl and the End Times"
 wet_starting_flavor.V11.d:0 "Axlotl is a city that has learned the ritual of falling and returning. Its fourth spawning legacy, reclaimed ruins, wounded pools, anti-Skaven patrols, jungle economies, and cohorts that refuse final defeat make survival feel almost like an ancient office.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V12.t:0 "Quetza and the End Times"
 wet_starting_flavor.V12.d:0 "Quetza is the Defiled City, where Clan Pestilens made disease into occupation and sacred stone learned the smell of rot. Plague wards, quarantine registers, cavern contemplatives, cautious envoys, and hardened cohorts keep watch over a temple-city that cannot afford forgetfulness.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V13.t:0 "Xhotl and the End Times"
 wet_starting_flavor.V13.d:0 "Xhotl was the City of Destiny before destiny became a battlefield. Kroq-Gar's first defense, collapsed Slann barriers, refugee spawnings, doom-plaques, and the never-ending memory of daemon war make its stones feel less ruined than interrupted.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times press close to Xhotl through the nearby Pestilens enclave and the threats gathering across southern Lustria. The defenders must keep their approaches clear and their spawning pools secure. The memory of an earlier catastrophe is useful only if it helps prevent the next army from reaching the sacred precincts."
 wet_starting_flavor.V14.t:0 "Subatuun and the End Times"
 wet_starting_flavor.V14.d:0 "Subatuun measures holiness in terraces, canals, spawning cycles, and the disciplined movement of water. River-causeway patrols, reed-marked envoys, Skink ledgers, flooded steps, and sacred agricultural rites make the city a calculation written in mud, stone, and breath.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V15.t:0 "Oxyl and the End Times"
 wet_starting_flavor.V15.d:0 "Oxyl hides so thoroughly that discovery feels like a theological error. Chameleon Skink paths, venom stores, silent plaques, unseen diplomacy, and darts from the green dark make the jungle itself seem to hold a spear behind every leaf.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times bring an immediate danger in the nearby Pestilens warrens and their approaches into southern Lustria. Oxyl's concealment must serve active defence: patrols and ambushes can protect the pools, but only if the defenders discover infection and enemy movement before silence becomes isolation."
 wet_starting_flavor.V16.t:0 "Xeti and the End Times"
 wet_starting_flavor.V16.d:0 "Xeti keeps its watch in thin air and cold mist, where white-stone ziggurats rise above jungle heat like thoughts made visible. Highland spawning pools, mountain causeway guards, cold storehouses, and envoys from the high canopies give its duty a clear and distant edge.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V17.t:0 "Spektazuma and the End Times"
 wet_starting_flavor.V17.d:0 "Spektazuma stands where scale, feather, skin, and river memory meet before the Old Ones. Oracle pools, Amazon-Skink warbands, relic gardens, hidden sister-temples, and sacred parleys give the city an inheritance shared by peoples who read different signs toward the same design.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V18.t:0 "Huatl and the End Times"
 wet_starting_flavor.V18.d:0 "Huatl is aligned to the sun because order should cast a measurable shadow. Dawn envoys, coastal watchers, sun-marked trade courts, anti-vampire patrols, and Chotec's burning cohorts keep the eastern approaches under a light the undead cannot comfortably imitate.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.V19.t:0 "Dreadfleet and the End Times"
 wet_starting_flavor.V19.d:0 "The Dreadfleet is not merely another nest of corpse-pirates. Noctilus von Carstein has made the Maelstrom into a throne room, and every drowned sailor is another oath sworn beneath black sails.\n\nNecromancy turned wrecks and drowned sailors into the foundations of maritime dominions. Undead captains outlasted mortal crews and rival fleets, raising the victims of shipwreck and battle to extend wars that should have ended with their own deaths.\n\nThe End Times promise wrecks, plunder and recruits, but rival captains and hostile shores still contest the sea. Greater powers of undeath may demand service rather than partnership. A deathless crew is useful only while its master can preserve the ships and harbours that carry it."
 wet_starting_flavor.V20.t:0 "Gyjaar Dead Fleet and the End Times"
 wet_starting_flavor.V20.d:0 "Gyjaar was never meant to host a court of the dead. Its humid wharves were built for spice bales, pearl divers, temple taxes, and pilgrim vessels hugging the coast of Ind, not for black sails and corpse-crews that answer to a captain who has forgotten the warmth of blood.\n\nNecromancy turned wrecks and drowned sailors into the foundations of maritime dominions. Undead captains outlasted mortal crews and rival fleets, raising the victims of shipwreck and battle to extend wars that should have ended with their own deaths.\n\nThe End Times promise wrecks, plunder and recruits, but rival captains and hostile shores still contest the sea. Greater powers of undeath may demand service rather than partnership. A deathless crew is useful only while its master can preserve the ships and harbours that carry it."
 wet_starting_flavor.X02.t:0 "Murthlurth and the End Times"
 wet_starting_flavor.X02.d:0 "Murthlurth remembers kingship as a thing spoken under bog moons and paid for in drowned tribute. Fen-kings, reed halls, black-water altars, swamp-causeway ambushes, and heavy-tailed Fimm make its rule feel older than the roads that try to cross it.\n\nThe Fimir remember an age when their kind enjoyed greater power and closer attention from Chaos. As that favour faded, surviving communities withdrew into marshes and hidden strongholds, preserving old rites while raiding the lands of more numerous peoples.\n\nThe End Times may offer renewed power, but they also bring hosts that will trample hidden sanctuaries without noticing their ancient claims. Rival warlords and the hatred of surrounding peoples remain immediate threats. Mist can conceal a realm; only strength can preserve it when concealment fails."
 wet_starting_flavor.X04.t:0 "Fethnaal and the End Times"
 wet_starting_flavor.X04.d:0 "Fethnaal's Fimir brood in exile, half-hidden by swamp mist and older malice. They are a people of damp stone, harsh ritual, and grudges too sour to become songs.\n\nThe Fimir remember an age when their kind enjoyed greater power and closer attention from Chaos. As that favour faded, surviving communities withdrew into marshes and hidden strongholds, preserving old rites while raiding the lands of more numerous peoples.\n\nThe End Times bring more than distant prophecies to Fethnaal. The nearby Pestilens foothold and the struggles of southern Lustria threaten the marsh routes on which its Fimir depend. The realm must preserve its hidden approaches without mistaking Skaven hostility toward other neighbours for friendship toward itself."
 wet_starting_flavor.X05.t:0 "Mirecourt and the End Times"
 wet_starting_flavor.X05.d:0 "Mirecourt calls itself a court because terror enjoys ceremony. Marsh-kings, captive tribute halls, Balefiend judgments, fen-mist envoys, tail-maul retinues, and reed-hidden shrines make law out of damp stone, silence, and the certainty that prisoners are listening.\n\nThe Fimir remember an age when their kind enjoyed greater power and closer attention from Chaos. As that favour faded, surviving communities withdrew into marshes and hidden strongholds, preserving old rites while raiding the lands of more numerous peoples.\n\nThe End Times may offer renewed power, but they also bring hosts that will trample hidden sanctuaries without noticing their ancient claims. Rival warlords and the hatred of surrounding peoples remain immediate threats. Mist can conceal a realm; only strength can preserve it when concealment fails."
 wet_starting_flavor.X07.t:0 "Drechmarazacht and the End Times"
 wet_starting_flavor.X07.d:0 "Drechmarazacht has crawled from wet graves, savage sands, and mangrove shadow with one eye fixed on the dead god's throne. Buglas is the capital because its mists hide lairs, altars, corpse pits, and the hard paths by which Fimm hosts can strike before the living understand what has risen.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.X11.t:0 "Drakgnaw and the End Times"
 wet_starting_flavor.X11.d:0 "Drakgnaw measures strength in bones large enough to humble ordinary trophies. Dragon-bone gnawing rites, bull-horned warherds, marrow offerings at the herdstone, ravaged pasture tribute, and Beastlord horn-parleys make its Bovigors hungry for proof that even great beasts can be reduced to ornaments.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times promise the destruction of the settled world, but the herds remain competitors for victims and divine favour. Enemy patrols and stronger champions threaten any isolated band. A successful Beastlord must unite the ambushes before the greatest slaughter passes the herd by."
 wet_starting_flavor.X12.t:0 "Crackskull and the End Times"
 wet_starting_flavor.X12.d:0 "Crackskull arrives with hooves, sour wine, and the wet sound of heads meeting stone. Centigor pathbreakers, reeling charge songs, drunken herd bargains, skull-cracking gallops, and libations to Chaos make speed feel less like strategy than a riot with direction.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times promise the destruction of the settled world, but the herds remain competitors for victims and divine favour. Enemy patrols and stronger champions threaten any isolated band. A successful Beastlord must unite the ambushes before the greatest slaughter passes the herd by."
 wet_starting_flavor.X13.t:0 "Gorefane and the End Times"
 wet_starting_flavor.X13.d:0 "Gorefane belongs to the small, sharp, and numerous. Ungor knife-swarms, blood fetishes, scavenged loot from camp edges, braying skulkers, cowed underlings, and cringing envoys make weakness into a posture that lasts only until the enemy falls.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times promise the destruction of the settled world, but the herds remain competitors for victims and divine favour. Enemy patrols and stronger champions threaten any isolated band. A successful Beastlord must unite the ambushes before the greatest slaughter passes the herd by."
 wet_starting_flavor.X14.t:0 "Rutshrak and the End Times"
 wet_starting_flavor.X14.d:0 "Rutshrak keeps its shrines where cliffs answer every shout. Caprigor crag-herds, goat-path toll raids, horn-rack chieftains, rockfall ambushers, and hard-hooved raiders turn ravines into temples, roads into traps, and echoes into threats.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times are already taking shape in the competition for southern Lustria. Rutshrak's expanded lowland territory borders the Pestilens foothold and the lands of hostile temple peoples. The herds must secure the approaches to their crags and keep rival threats divided before the struggle spreads across their own bloodgrounds."
 wet_starting_flavor.X15.t:0 "Urzguth and the End Times"
 wet_starting_flavor.X15.d:0 "Urzguth prowls Naggaroth where the forests are black, the snow remembers blood, and Druchii cruelty has not made the wilds obedient. Blackpine bloodgrounds, witchlight warherds, spoils from Dark Elf roads, frost endurance, and shrines in black snow make its Beastmen cold without becoming calm.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times promise the destruction of the settled world, but the herds remain competitors for victims and divine favour. Enemy patrols and stronger champions threaten any isolated band. A successful Beastlord must unite the ambushes before the greatest slaughter passes the herd by."
 wet_starting_flavor.X16.t:0 "One-Eyes and the End Times"
 wet_starting_flavor.X16.d:0 "The One-Eyes follow Khazrak because one lost eye taught him more than most chiefs learn from a lifetime of charging straight ahead. Drakwald raid patterns, warhounds, Bullgor shock herds, threats to Middenland, and the herdstone of the Blinded Beast make cunning feel like another horn.\n\nBeastmen emerged from the corruption that followed the ancient coming of Chaos. Driven into wild places, their herds preserved a hatred of walls, fields and the peoples who claimed them, gathering around herdstones whenever a champion could turn rival packs toward common prey.\n\nThe End Times promise the destruction of the settled world, but the herds remain competitors for victims and divine favour. Enemy patrols and stronger champions threaten any isolated band. A successful Beastlord must unite the ambushes before the greatest slaughter passes the herd by."
 wet_starting_flavor.X25.t:0 "Mawfang and the End Times"
 wet_starting_flavor.X25.d:0 "Mawfang guards a pass where caravans learn the difference between tolls and being eaten. The tribe broke from the Goldtooth shadow with enough bruisers, cattle hooks, and appetite to call the ridge its own.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.X26.t:0 "Firebelly Maw and the End Times"
 wet_starting_flavor.X26.d:0 "Firebelly Maw gathers around smoking iron, hot stones, and priests who insist the Great Maw likes its meals cooked with proper screaming. The Suneaters left embers here, and our butchers intend to make them a country.\n\nOgre tradition remembers the catastrophe of the Great Maw and the migrations that drove their ancestors into the mountains. Tribes grew around tyrants, feast grounds and tribute roads, while wandering mercenaries carried Ogre strength into almost every other people's wars.\n\nThe End Times offer rich contracts and vast meals, but a ruined caravan road feeds nobody. Rival tyrants and advancing armies can strip a camp's hunting grounds bare. Keeping followers fed and choosing profitable battles will matter more than any promise made by distant gods or kings."
 wet_starting_flavor.X27.t:0 "Bloodsands and the End Times"
 wet_starting_flavor.X27.d:0 "Bloodsands rises where dunes, wreckage, and red surf meet. The warband marks the coast with brass scraps and skull piles, promising Khorne that every landing, raid, and challenge will end in a proper offering.\n\nThe Hung peoples have carried their horse herds and war banners across the far north for generations. Raiding, migration and rivalry with settled realms shaped their power, while worship of the Dark Gods turned ambition into a perilous bargain.\n\nAs Archaon's hosts gather, the northern wars are becoming part of a greater reckoning. Rival champions compete for followers and divine notice; southern kingdoms prepare their walls. This realm must choose its commitments carefully if it is to profit from the End Times rather than feed them."
 wet_starting_flavor.X28.t:0 "Mireblessed Host and the End Times"
 wet_starting_flavor.X28.d:0 "The Mireblessed Host gathers in bog heat, fever mist, and rot-bloomed paths. Nurgle's gifts turn mud into defense, sickness into fellowship, and every ruined camp into a garden that smiles back.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.X29.t:0 "Wraithscarred and the End Times"
 wet_starting_flavor.X29.d:0 "Wraithland gives the Wraithscarred iron, cold, and omens that refuse to stay buried. The warband carves black oaths into stone and offers each raid to Chaos Undivided, letting the gods quarrel after the blades are cleaned.\n\nAcross the northern steppes, successive generations of riders and warlords built power through herds, conquest and oaths to the Dark Gods. Great invasions briefly united rival peoples, then left fresh grudges when victory or disaster scattered them again.\n\nThe Everchosen now seeks to make those rival hosts serve a single purpose. The End Times offer glory beyond an ordinary raid, but submission, betrayal and divine punishment are equally possible. A warlord must secure followers before claiming a place in the southern invasion."
 wet_starting_flavor.Z01.t:0 "Nehekhara and the End Times"
 wet_starting_flavor.Z01.d:0 "Nehekhara stands beneath Settra's authority, its homeland cities joined around Khemri. The king who refuses to serve sees the tombs and broken monuments as an empire that remains his by right, however many ages the living believe have passed.\n\nAncient Nehekhara raised golden cities and a mortuary cult that promised its monarchs eternal splendour. Nagash's sorcery instead destroyed the living civilisation and condemned its kings to awaken in withered bodies, surrounded by the ruins of what had been promised them.\n\nThe End Times threaten to bring Nagash's ambitions back upon the land he ruined. Foreign raiders and restless dynastic pride remain dangers, but submission to another necromancer would be the ultimate theft. Settra must make the united homeland's legions obey a common purpose while preserving the sovereignty for which they awaken."
 wet_starting_flavor.Z14.t:0 "Araby and the End Times"
 wet_starting_flavor.Z14.d:0 "Araby is united under Anmar Fakir, whose preaching of the One Faith gave conquest and reform a common cause. Its cities, oasis roads and ports offer immense wealth, provided provincial rivals and desert communities accept the authority claimed over them.\n\nEarlier Arabyan kingdoms prospered through caravan and maritime trade while following many traditions and rulers. Fakir's movement challenged those divisions and the old bargains with spirits, creating a new religious order whose authority still has to become a durable political settlement.\n\nThe End Times threaten both that settlement and the commerce that sustains it. Nehekharan armies and raiders watch the frontiers while old loyalties persist within. In spring 2521, unnatural sea winds will warn of the Perfumed Mirage, a daemon host seeking a foothold along the coast. Protecting the ports must accompany the defence of the desert roads."
 wet_starting_flavor.Z23.t:0 "Sudenburg and the End Times"
 wet_starting_flavor.Z23.d:0 "Sudenburg is an Imperial argument built in stone under an Arabyan sun. Sigmarite settlers, drilled companies, southern warehouses, chartered burghers, and officers writing home to provinces that barely understand the heat make the colony both outpost and wager.\n\nSigmar forged the Empire from quarrelling tribes, but its unity has always depended on bargains between provinces, cities and cults. Civil wars and vampire invasions have repeatedly tested that inheritance; shared allegiance has never erased local interests.\n\nNow Archaon gathers strength in the north while Beastmen and the dead threaten the Empire from within. Political disunity makes a common defence uncertain. Keeping roads open, mustering soldiers and finding dependable partners may decide whether this realm survives the approaching End Times."
 wet_starting_flavor.Z24.t:0 "Antoch and the End Times"
 wet_starting_flavor.Z24.d:0 "Antoch carries Bretonnian vows into heat, dust, and crusader stone. Outremer castles, chapel courtyards, desert lances, stern castellans, and peasants who have learned to pray beside unfamiliar roads make the realm a frontier version of chivalry rather than a comfortable copy.\n\nBretonnian tradition looks back to Gilles le Breton and the vows that bound his companions to the Lady. Generations of knights carried those ideals beyond the first duchies, while peasants supplied the harvests on which every splendid charge depended.\n\nThe End Times will test the substance of those vows. Beastmen, undead and northern raiders threaten a world already divided by rank and ambition. Defending the people behind the banners will demand supplies, allies and decisions that a glorious charge alone cannot provide."
 wet_starting_flavor.Z33.t:0 "Sandscale and the End Times"
 wet_starting_flavor.Z33.d:0 "The Sandscale are Lizardmen of hot stone, dry pools, scarab rites, and sun-baked temple walls. Their Skinks write in glyphs learned beside tomb roads, their Saurus stand where dunes crawl over old spawning places, and their priests speak to the Old Ones through Nehekharan symbols the wider temple-cities would find unsettling.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z38.t:0 "Knights of Origo and the End Times"
 wet_starting_flavor.Z38.d:0 "The Knights of Origo hold a sea-fort where Bretonnian vows meet Imperial stonework, Arabyan winds, and the loneliness of a crusade that outlived its first banners. Their chapel bells ring over harbor cannon, pilgrim knights, salt-crusted walls, and watchmen who know the coast is patient with isolated pride.\n\nBretonnian tradition looks back to Gilles le Breton and the vows that bound his companions to the Lady. Generations of knights carried those ideals beyond the first duchies, while peasants supplied the harvests on which every splendid charge depended.\n\nThe End Times will test the substance of those vows. Beastmen, undead and northern raiders threaten a world already divided by rank and ambition. Defending the people behind the banners will demand supplies, allies and decisions that a glorious charge alone cannot provide."
 wet_starting_flavor.Z42.t:0 "Crimson Legion and the End Times"
 wet_starting_flavor.Z42.d:0 "The Crimson Legion is not a city so much as a verdict that learned to march. Red standards, Tomb Guard oaths, blood-lacquered armouries, herald tablets, and soldiers who advance without breath make the warhost a royal grievance preserved in perfect military order.\n\nAncient Nehekhara raised golden cities and a mortuary cult that promised its monarchs eternal splendour. Nagash's sorcery instead destroyed the living civilisation and condemned its kings to awaken in withered bodies, surrounded by the ruins of what had been promised them.\n\nThe End Times threaten another theft of that sovereignty. Necromancers covet the legions, living intruders plunder the tombs and rival dynasties remember every slight. Preserving the royal will means defending sacred ground against those who would turn an eternal kingdom into someone else's army."
 wet_starting_flavor.Z43.t:0 "Exiles of Nehek and the End Times"
 wet_starting_flavor.Z43.d:0 "The Exiles of Nehek carry their kingdom in relic carts, lost banners, funerary masks, and vows repeated under open sky. Dumuzid Kemat rules a wandering tomb court where every camp is a reminder of a throne denied and every march is measured against the road home.\n\nAncient Nehekhara raised golden cities and a mortuary cult that promised its monarchs eternal splendour. Nagash's sorcery instead destroyed the living civilisation and condemned its kings to awaken in withered bodies, surrounded by the ruins of what had been promised them.\n\nThe End Times threaten another theft of that sovereignty. Necromancers covet the legions, living intruders plunder the tombs and rival dynasties remember every slight. Preserving the royal will means defending sacred ground against those who would turn an eternal kingdom into someone else's army."
 wet_starting_flavor.Z45.t:0 "Tlaqua and the End Times"
 wet_starting_flavor.Z45.d:0 "Tlaqua watches the Southlands from above. Terradon patrols, ravine flight paths, Skink sky-captains, signal pigments, and Old One sky rites turn cliffs and canopy into a temple perimeter no ground-bound invader can easily understand.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z46.t:0 "Zlatlan and the End Times"
 wet_starting_flavor.Z46.d:0 "Zlatlan keeps a southern watch far from Lustria's most famous temple-cities. Its priests serve the Old Ones among deserts, tomb kingdoms, jungle margins, and warm-blooded empires that misunderstand every sacred boundary they cross.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z47.t:0 "Nahuontl and the End Times"
 wet_starting_flavor.Z47.d:0 "Nahuontl hides its sanctity beneath wet leaves, root hollows, canopy shrines, and pools that answer irregularly but remain sacred. Skink councils, jungle offering gardens, glyph-runners to Zlatlan, and ambushes from green shadows keep the temple alive where outsiders see only forest.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z48.t:0 "Zameisland and the End Times"
 wet_starting_flavor.Z48.d:0 "Zameisland belongs to reefs, shell tolls, sea gardens, storm drums, and ancestor groves facing the tide. Its people are Sudron and Arabyan by the map's habit, yet their island spirits still watch the surf and warn when foreign sails approach with polite hunger.\n\nAraby's history was shaped by oasis kingdoms, sea trade, desert migrations and religious struggle. Merchants and conquerors linked its cities to distant shores, while competing rulers and creeds repeatedly disputed who could speak for the wider land.\n\nThe End Times threaten the routes that carry wealth across desert and sea. Undead powers, raiders and foreign ambitions place different pressures on each frontier. Keeping water, provisions and trusted trading partners secure may prove more valuable than another splendid claim to authority."
 wet_starting_flavor.Z49.t:0 "Parichistan and the End Times"
 wet_starting_flavor.Z49.d:0 "Parichistan gathers wealth beneath temple towers where spices, silk, lacquer, grain, copper, and sacred processions share the streets. Elephant-road wardens, monsoon ledgers, dyewood guilds, and palace guards of many banners make the realm a western gate into the crowded abundance of Ind.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z50.t:0 "Karachistan and the End Times"
 wet_starting_flavor.Z50.d:0 "Karachistan holds gates where mountains, desert roads, saffron markets, iron caravans, and cliff shrines all demand watchmen. Terrace officials, hill levies, pass diplomats, and spear lines on narrow ground make the realm a lock on roads that richer kingdoms need.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z51.t:0 "Bhalluka and the End Times"
 wet_starting_flavor.Z51.d:0 "Bhalluka marches beneath forest-bear banners carried by rajahs who prize endurance, stubborn pride, and the right to stand their ground. Hill shrines, honey woods, ironwood groves, elephant-road forts, and market states make the realm rugged without making it simple.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z52.t:0 "Delehi and the End Times"
 wet_starting_flavor.Z52.d:0 "Imperial Delehi stands at the political heartland of the Thousand Gods, where princes, scribes, priests, merchants, generals, and petitioners all seek the king's ear. The Thousand-Quilled Porcupine marks temple revenues, pilgrimage roads, monsoon registers, palace elephants, and sacred registries with a thousand duties that all point inward.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z55.t:0 "Singha and the End Times"
 wet_starting_flavor.Z55.d:0 "Singha stands like a defiant elephant on the invasion frontier, planted across the trunk road before enemies can pour into the sacred interior. Jungle rice, river markets, elephant guards, and road scouts all serve the same refusal: this way is closed unless Singha permits it.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z56.t:0 "Kurya and the End Times"
 wet_starting_flavor.Z56.d:0 "Kurya governs where rivers break into harbors, monsoon temples rise above floodwater, and spice canal storehouses perfume the wet air. River fleets, rice registers, fishermen, pilots, and envoys crossing the eastern sea make the realm a kingdom of water that cannot afford loose oars.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z57.t:0 "Bone Eaters and the End Times"
 wet_starting_flavor.Z57.d:0 "The Bone Eaters were Ogres of the northern mountains until a tyrant cracked open the tomb of an Indish corpse-king and drank the red marrow sealed inside. Since then, the tribe has kept bone-pits, red snow feasts, night-road tolls, and pale Maneater bargains under a hunger that does not end cleanly with death.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.Z58.t:0 "Lakshana and the End Times"
 wet_starting_flavor.Z58.d:0 "Lakshana is named for signs that priests insist are not coincidences. Marks on newborn calves, river stones shaped like lotus petals, the behavior of temple elephants, and the timing of monsoon clouds all become arguments in court before they become policy.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z59.t:0 "Bhojapuri and the End Times"
 wet_starting_flavor.Z59.d:0 "Bhojapuri's court keeps its brightest lamps for processions and its darkest rooms for the pale Raja's household. Tigerkin nobles walk through temple courtyards with lacquered claws, moonlit vows, and servants who know which bowls are for rice and which are not.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.Z60.t:0 "Kosala and the End Times"
 wet_starting_flavor.Z60.d:0 "Kosala stands where sacred rivers slow long enough for monks, taxmen, pilgrims, ferrymen, and soldiers to argue over whose duty is most holy. Rice levies fill the roads after harvest, bells answer from monasteries, and every ford feels older than the kingdom that guards it.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z61.t:0 "Bengal and the End Times"
 wet_starting_flavor.Z61.d:0 "Bengal lives where rivers become arguments before they become sea. Mangrove hunters, Tigerkin shrine guards, rice boats, salt traders, and fishermen who read the tide better than most scribes read ledgers all serve a realm that must rule water in motion.\n\nThe beastfolk of the eastern realms have their own courts, sacred traditions and histories alongside their human neighbours. Their place in that world was shaped by bargains over temples, roads and royal authority, rather than a single allegiance shared by every people with fur or horns.\n\nThe End Times bring danger to the same routes and sanctuaries that sustain these communities. Foreign armies and local rivals can exploit every divided court. Protecting the homeland requires judging neighbours by their actions before an older quarrel leaves the realm facing a greater enemy alone."
 wet_starting_flavor.Z62.t:0 "Twin Snakes and the End Times"
 wet_starting_flavor.Z62.d:0 "The Twin Snakes speak through paired idols, paired priests, paired daggers, and paired silences. Every audience is arranged so that no petitioner can tell which coil watches with favor and which one measures the throat.\n\nThe serpent peoples of Khuresh preserved secluded courts and blood rites far from the scrutiny of foreign empires. Rival lineages and priesthoods contested the jungle's wealth, while outsiders encountered only fragments of a history its rulers preferred to keep hidden.\n\nThe End Times threaten to open those hidden lands to powers that cannot be deceived or poisoned easily. Neighbouring kingdoms, rival serpent courts and the ambitions of Chaos press upon the same borders. Preserving supremacy requires controlling the approaches before secrecy ceases to be a defence."
 wet_starting_flavor.Z63.t:0 "Longfangs and the End Times"
 wet_starting_flavor.Z63.d:0 "The Longfangs smile with a courtly restraint that fools only visitors. Their nobles keep lacquered cups, moonlit hunting platforms, pale consorts, and old serpent genealogies that now include a thirst no ancestral tablet can explain politely.\n\nThe arts of undeath spread from ancient Nehekhara through stolen knowledge, bloodline and conquest. In this realm they took root among an existing people, preserving old ambitions while changing the masters who pursued them. Death became a means of extending authority rather than ending it.\n\nThe End Times offer new subjects and battlefields, but also the threat of servitude to a greater deathless power. Nagashizzar gathers its own ambitions while living neighbours prepare their defences. This realm must preserve its master's independence before the coming war turns every grave into a contested resource."
 wet_starting_flavor.Z65.t:0 "Jennestas and the End Times"
 wet_starting_flavor.Z65.d:0 "Jennestas glitters because warning can be beautiful. Jewels hang from serpent idols, dancers move through incense with blades hidden in sleeves, and venom-temple estates wrap their accounts in perfume until tribute feels like a privilege.\n\nThe serpent peoples of Khuresh preserved secluded courts and blood rites far from the scrutiny of foreign empires. Rival lineages and priesthoods contested the jungle's wealth, while outsiders encountered only fragments of a history its rulers preferred to keep hidden.\n\nThe End Times threaten to open those hidden lands to powers that cannot be deceived or poisoned easily. Neighbouring kingdoms, rival serpent courts and the ambitions of Chaos press upon the same borders. Preserving supremacy requires controlling the approaches before secrecy ceases to be a defence."
 wet_starting_flavor.Z66.t:0 "Clan Eskemas and the End Times"
 wet_starting_flavor.Z66.d:0 "Clan Eskemas gnaws beneath roots that drink too much red water. Its jungle warrens stink of damp warpstone, blood jars, bitten idols, and Skaven who learned from the serpent courts that worship is more useful when everyone is terrified.\n\nSkaven society spread beneath the surface through warrens, conquest and incessant competition between clans. The Council of Thirteen claimed authority in the Horned Rat's name, but clan wars repeatedly showed how quickly common ambition could collapse into betrayal.\n\nThe End Times promise the overthrow of the surface peoples, and every clan wants the greatest share. Skavenblight's Vermintide is a centre of power, not proof that all rivals obey. Enemy strongholds, unreliable partners and hungry superiors must be overcome before the spoils can be claimed."
 wet_starting_flavor.Z67.t:0 "Se'Sehen and the End Times"
 wet_starting_flavor.Z67.d:0 "Se'Sehen is easiest to notice after it has already decided what to do with you. Whisper groves, reed blinds, spirit masks, and coils waiting under leaf-shadow make its courts feel less like palaces than pauses in the jungle's breathing.\n\nThe serpent peoples of Khuresh preserved secluded courts and blood rites far from the scrutiny of foreign empires. Rival lineages and priesthoods contested the jungle's wealth, while outsiders encountered only fragments of a history its rulers preferred to keep hidden.\n\nThe End Times threaten to open those hidden lands to powers that cannot be deceived or poisoned easily. Neighbouring kingdoms, rival serpent courts and the ambitions of Chaos press upon the same borders. Preserving supremacy requires controlling the approaches before secrecy ceases to be a defence."
 wet_starting_flavor.Z68.t:0 "Hss'tafi and the End Times"
 wet_starting_flavor.Z68.d:0 "Hss'tafi worships where thorn and fang teach the same lesson. Shrine paths draw blood from careless ankles, drums pulse through wet heat, and warbands paint their scales before raids so spirits, rivals, and prey all know who is coming.\n\nThe serpent peoples of Khuresh preserved secluded courts and blood rites far from the scrutiny of foreign empires. Rival lineages and priesthoods contested the jungle's wealth, while outsiders encountered only fragments of a history its rulers preferred to keep hidden.\n\nThe End Times threaten to open those hidden lands to powers that cannot be deceived or poisoned easily. Neighbouring kingdoms, rival serpent courts and the ambitions of Chaos press upon the same borders. Preserving supremacy requires controlling the approaches before secrecy ceases to be a defence."
 wet_starting_flavor.Z69.t:0 "Blood Queen and the End Times"
 wet_starting_flavor.Z69.d:0 "The Blood Queen rules from a throne where every step upward is stained into memory. Crimson bowls, serpent diadems, oath scars, and attendants who never look surprised make her court a ceremony of submission with a pulse.\n\nThe serpent peoples of Khuresh preserved secluded courts and blood rites far from the scrutiny of foreign empires. Rival lineages and priesthoods contested the jungle's wealth, while outsiders encountered only fragments of a history its rulers preferred to keep hidden.\n\nThe End Times threaten to open those hidden lands to powers that cannot be deceived or poisoned easily. Neighbouring kingdoms, rival serpent courts and the ambitions of Chaos press upon the same borders. Preserving supremacy requires controlling the approaches before secrecy ceases to be a defence."
 wet_starting_flavor.Z70.t:0 "Bakemono and the End Times"
 wet_starting_flavor.Z70.d:0 "Bakemono lairs cling to Nipponese mountains like bad ideas with teeth. Forest Goblins steal shrine bells, paint rude faces on guardian stones, brew fungus behind cedar roots, and insist every pass belongs to whoever can ambush it most often.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.Z71.t:0 "Yomi and the End Times"
 wet_starting_flavor.Z71.d:0 "Yomi lives below places polite villages refuse to name after sunset. Corpse-mushrooms glow in damp hollows, Goblin teeth flash in bamboo shade, and the dead do not stay boring enough when the tribe's pale bosses start sniffing around them.\n\nFor ages, Greenskin tribes have risen around successful bosses, overrun the settlements of other peoples and fought over the spoils. A great Waaagh can turn scattered mobs into a continent's terror; defeat or a dead leader can scatter that power just as quickly.\n\nThe End Times promise bigger battles, but also armies capable of crushing an isolated tribe. Grimgor's rise at Black Crag draws ambitious bosses toward a greater struggle. Finding weapons, recruits and the right next fight will determine whether this tribe joins the shouting or disappears beneath it."
 wet_starting_flavor.Z72.t:0 "Bladelords and the End Times"
 wet_starting_flavor.Z72.d:0 "The Bladelords bow like samurai and dream like executioners. Their sword schools teach patience only so killing arrives cleanly, and their red shrines praise strength with a directness that even harsher daimyo pretend not to hear.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nThe End Times give the Bladelords' devotion to Khorne a larger purpose than another island feud. Rival houses remain obstacles, but the demands of the Blood God can consume a realm as readily as its enemies. The sword schools must turn zeal into lasting strength before a greater Chaos host claims the credit for their slaughter."
 wet_starting_flavor.Z73.t:0 "Dawate and the End Times"
 wet_starting_flavor.Z73.d:0 "Dawate keeps court where snow settles on shrine roofs and fish smoke curls from cold villages below the passes. Its garrisons know the mountain roads by scar and avalanche, while its priests insist that quiet is a form of discipline, not peace.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z74.t:0 "Hattiga and the End Times"
 wet_starting_flavor.Z74.d:0 "Hattiga's oldest law is older than the ink that records it. Cedar groves, spirit stones, druidic offerings, and clan courts meet under branches that seem to remember every oath, including the ones the living have found inconvenient.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z75.t:0 "Hojizu and the End Times"
 wet_starting_flavor.Z75.d:0 "Hojizu faces the sea with shrine gates, watch fires, fish markets, and harbor ledgers that smell of salt and ink. Boats arrive with tribute, rumor, pirates, monks, merchants, and quarrels that began in other ports but demand settlement here.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z76.t:0 "Odari and the End Times"
 wet_starting_flavor.Z76.d:0 "Odari keeps two seals on its documents: one for the mountains and one for the sea. Between them lie road forts, harbor clans, shrine accounts, and envoys who must remember which lord is offended by which order of bows.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z77.t:0 "Shisuma and the End Times"
 wet_starting_flavor.Z77.d:0 "Shisuma rules through quiet books and careful guards. River tolls, village rosters, shrine repairs, bridge watches, and marriage debts all find their way into registers whose plain pages decide more quarrels than a boastful sword ever could.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z78.t:0 "Takai and the End Times"
 wet_starting_flavor.Z78.d:0 "Takai's castles make the sky feel administered. Stone gates cling to ridges, warrior houses drill above cloud banks, and mountain law descends on valleys with the certainty of a winter road patrol.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
 wet_starting_flavor.Z79.t:0 "Janarjaya and the End Times"
 wet_starting_flavor.Z79.d:0 "Janarjaya crowns kings beneath rain-heavy branches. Southern Indish rites mingle with grove offerings, monsoon drums, elephant paths, and priests who know that a throne set too far from the trees may lose the spirits before it loses the people.\n\nInd's kingdoms grew around river valleys, pilgrimage routes and the worship of many gods. Princes, temples and merchant communities shared authority unevenly, while profitable trade connected their lands to Cathay, the western deserts and the eastern seas.\n\nThe End Times threaten a world already contested by rival rulers, raiders and the serpent powers of Khuresh. Broken harvests and interrupted caravans can weaken the realm before any final invasion. Its rulers must turn religious and provincial loyalties into a defence that can survive a wider war."
 wet_starting_flavor.Z81.t:0 "Cuexotl and the End Times"
 wet_starting_flavor.Z81.d:0 "Cuexotl is stitched together by causeways outsiders mistake for mud, old stone, or coincidence. Skink patrols clear drowned glyphs, Saurus cohorts wait beneath broad leaves, and every sunken plaque is treated as an order delayed rather than forgotten.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z82.t:0 "Teotiqua and the End Times"
 wet_starting_flavor.Z82.d:0 "Teotiqua rises in star-stepped silence. Skink priests climb wet stone before dawn, astronomers paint the sky's warnings onto bark and gold, and the city keeps its isolation like a ritual tool too sacred for careless hands.\n\nThe servants of the Old Ones built their temple-cities before the younger empires arose. When the polar gates collapsed, their masters vanished and Chaos devastated the world. Surviving Slann and their attendants preserved fragments of the Great Plan through ages of loss and rebuilding.\n\nThe End Times threaten those surviving fragments. Skaven infestations, raiders and Chaos endanger spawning pools and the routes between sacred sites. The defenders must preserve both their fighting cohorts and the knowledge they protect; another lost city may carry away instructions that cannot be replaced."
 wet_starting_flavor.Z83.t:0 "Bowmen of Oreon and the End Times"
 wet_starting_flavor.Z83.d:0 "The Bowmen of Oreon guard a green memory far from the deep courts of Athel Loren. Their glade is ringed by jungle heat, watch platforms, waystones carried across impossible distance, and arrows that speak before trespassers learn the language.\n\nThe forest Elves descend from communities that remained in the Old World when their kin withdrew across the sea. Survival required bargains with older forest powers, creating societies whose boundaries follow sacred groves and remembered oaths more closely than human maps.\n\nIn the End Times, isolation offers little certainty. Beastmen, corruption and the destruction of neighbouring lands can carry danger beneath the canopy. The defenders must decide which outsiders can help preserve the forest, and which trespasses must be answered before the roots themselves are lost."
 wet_starting_flavor.Z96.t:0 "Nippon and the End Times"
 wet_starting_flavor.Z96.d:0 "Nippon's imperial court maintains a claim to wider authority, but other island realms still keep their own banners and rulers. Ceremony and inherited prestige give the throne a voice beyond its direct lands, without guaranteeing obedience.\n\nNippon's warrior houses rose through generations of disputed authority, castle warfare and rival claims to rightful rule. Imperial ceremony, local loyalties and the power of armed retainers seldom aligned neatly, leaving even peaceful years marked by the memory of earlier struggles.\n\nDistance from the western wars will not protect these islands from the End Times. Pirates, mountain raiders and rival houses can destroy the strength needed against a greater threat. Securing the coast and making dependable commitments may prove harder than winning another local feud."
