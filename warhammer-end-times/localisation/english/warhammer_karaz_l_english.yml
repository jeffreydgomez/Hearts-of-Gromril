 wet_karaz.1.0:0 "The council takes note."
 wet_karaz.1.d:0 "The last seal has been pressed into the wax and the envoys have clasped hands. The agreement now rests upon the honour of those who signed it."
 wet_karaz.1.t:0 "Terms Ratified"
 wet_karaz.100.0:0 "Decline the proposal."
 wet_karaz.100.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.100.1:0 "Accept the stated terms."
 wet_karaz.100.1_effect:0 "Karaz-a-Karak requests admission to your Order faction under its current leadership. Acceptance invokes the real §Y100%§! admission rule, or Reikland’s authorised §Y25%§! coalition programme with its Everchosen-war veto."
 wet_karaz.100.d:0 "The High King’s envoys have come bearing the weight of ancient friendship. Karaz-a-Karak is prepared to stand beside the free realms, if a place can be made beneath their common banner."
 wet_karaz.100.t:0 "The High King Seeks the Grand Alliance"
 wet_karaz.101.0:0 "Decline the proposal."
 wet_karaz.101.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.101.1:0 "Accept the stated terms."
 wet_karaz.101.1_effect:0 "Accept delivery of §Y500§! infantry equipment from Karaz-a-Karak’s existing stores. The route, peaceful relations and full stock are checked at delivery."
 wet_karaz.101.d:0 "Iron-bound wagons have arrived under a Dwarfen escort. Their cargo bears the marks of skilled armourers, a welcome sight to soldiers whose own equipment has endured too many campaigns."
 wet_karaz.101.t:0 "A Convoy of Dwarfen Arms"
 wet_karaz.102.0:0 "Decline the proposal."
 wet_karaz.102.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.102.1:0 "Accept the stated terms."
 wet_karaz.102.1_effect:0 "Accept delivery of §Y500§! infantry equipment from Karaz-a-Karak’s existing stores. The route, peaceful relations and full stock are checked at delivery."
 wet_karaz.102.d:0 "Iron-bound wagons have arrived under a Dwarfen escort. Their cargo bears the marks of skilled armourers, a welcome sight to soldiers whose own equipment has endured too many campaigns."
 wet_karaz.102.t:0 "A Convoy of Dwarfen Arms"
 wet_karaz.103.0:0 "Decline the proposal."
 wet_karaz.103.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.103.1:0 "Accept the stated terms."
 wet_karaz.103.1_effect:0 "Agree to reciprocal military access. This grants passage, not ownership or foreign construction rights."
 wet_karaz.103.d:0 "Dwarfen envoys propose that our soldiers be allowed to travel one another’s roads. Old friendship may once again become something that can be seen in marching columns and guarded passes."
 wet_karaz.103.t:0 "Open the Roads Between Our Realms"
 wet_karaz.104.0:0 "Decline the proposal."
 wet_karaz.104.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.104.1:0 "Accept the stated terms."
 wet_karaz.104.1_effect:0 "Accept direct puppet status under Karaz-a-Karak. Subject economic and war obligations apply.\nRetain your ruler, borders, army and fleet. Refusal brings no war goal."
 wet_karaz.104.d:0 "A writ bearing the High King’s seal has been read before our throne. Karaz-a-Karak calls upon the scattered holds to acknowledge a common sovereign and face the coming wars together."
 wet_karaz.104.t:0 "A Writ from the High King"
 wet_karaz.105.0:0 "Decline the proposal."
 wet_karaz.105.0_effect:0 "Decline without payment or a forced commitment."
 wet_karaz.105.1:0 "Accept the stated terms."
 wet_karaz.105.1_effect:0 "Authorise one land-fort level at the selected frontier province. Karaz-a-Karak supplies §Y100§! Elite Equipment when work begins.\nThe project takes §Y60§! days, or §Y45§! after its fortress-school training. You retain ownership. Loss of lawful control, route or alliance cancels work and refunds half the equipment."
 wet_karaz.105.d:0 "The engineers have arrived with measuring chains, tools and very firm opinions about the local masonry. With our permission they will put their craft to work upon the frontier."
 wet_karaz.105.t:0 "Dwarfen Engineers at Our Frontier"
 wet_karaz.106.0:0 "Return to the council."
 wet_karaz.106.d:0 "The engineers have spread their plans across the council table. Stone, iron and labour must now be directed toward the places where our allies need them most."
 wet_karaz.106.t:0 "The Allied Works Ledger"
 wet_karaz.107.0:0 "Return to the holds."
 wet_karaz.107.d:0 "The guild masters have brought their accounts before the throne. Each promises work worthy of the ancestors, provided the High King decides where the stone and iron should go."
 wet_karaz.107.t:0 "The Holds’ Construction Ledger"
 wet_karaz.2.0:0 "The council takes note."
 wet_karaz.2.d:0 "Our envoys have returned without the answer they sought. The old roads between our realms remain open to rumour, but this particular bargain has come to nothing."
 wet_karaz.2.t:0 "Proposal Declined or Expired"
 wet_karaz.3.0:0 "The council takes note."
 wet_karaz.3.d:0 "News from the frontier has overtaken the agreement before it could be fulfilled. Our representatives are returning to their courts with more questions than answers."
 wet_karaz.3.t:0 "Changed Circumstances"
