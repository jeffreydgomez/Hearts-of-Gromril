l_english:
 WET_DIRECT_O02_karaz_builder:0 "Send Arms to an Allied Realm."
 WET_DIRECT_O03_karaz_builder:0 "Negotiate Allied Passage."
 WET_DIRECT_O04_karaz_builder:0 "Offer Frontier Fort Works."
 WET_DIRECT_P01_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [U07.GetNameDef], [U21.GetNameDef]."
 WET_DIRECT_P02_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [U13.GetNameDef], [U14.GetNameDef], [U15.GetNameDef], [U16.GetNameDef]."
 WET_DIRECT_P03_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [B14.GetNameDef]."
 WET_DIRECT_P04_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [U22.GetNameDef], [U37.GetNameDef]."
 WET_DIRECT_P05_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [B02.GetNameDef], [B04.GetNameDef], [B05.GetNameDef]."
 WET_DIRECT_P06_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [B19.GetNameDef]."
 WET_DIRECT_P07_karaz_builder:0 "Gain 25 Political Power. Send the High King’s offer of vassalage to [U36.GetNameDef]."
 WET_DIRECT_P08_karaz_builder:0 "Send Arms to a Sworn Hold."
 WET_DIRECT_S11_karaz_builder:0 "Commit the Last Reserve for 90 days."
 WET_KARAZ_A00:0 "Muster the Hold Warriors"
 WET_KARAZ_A00_desc:0 "Review the standing throngs before deciding where to improve their training. Every throng must know its strength before the High King asks it to march."
 WET_KARAZ_A01:0 "Shields That Do Not Break"
 WET_KARAZ_A01_desc:0 "Drill the shield line until every warrior knows the place beside them. The shield beside a warrior is a promise made by the clan at their shoulder."
 WET_KARAZ_A02:0 "Disciplined Volleys"
 WET_KARAZ_A02_desc:0 "Make missile troops and shield bearers practise as one formation. A steady volley depends on the discipline of the whole line."
 WET_KARAZ_A03:0 "Veterans at the Centre"
 WET_KARAZ_A03_desc:0 "Use experienced warriors to steady the ordinary regiments. The younger warriors will find courage where the veterans have already found their place."
 WET_KARAZ_A04:0 "Rangers on the High Roads"
 WET_KARAZ_A04_desc:0 "Train scouts to find safe approaches and report moving enemies. The host should never learn of a blocked road from the enemy waiting upon it."
 WET_KARAZ_A05:0 "Drill in Snow and Scree"
 WET_KARAZ_A05_desc:0 "Make mountain marches a regular part of the host’s preparation. Harsh ground will become familiar work before it becomes a battlefield."
 WET_KARAZ_A06:0 "Columns for the Underway"
 WET_KARAZ_A06_desc:0 "Train formations to keep order and supply in constricted routes. Order must survive the narrow passage as surely as it survives the open muster."
 WET_KARAZ_A07:0 "The Gunnery Schools"
 WET_KARAZ_A07_desc:0 "Teach crews to place reliable fire before demanding greater weapons. Sound instruction will spare powder and make every discharge count."
 WET_KARAZ_A08:0 "Counter-Battery Tables"
 WET_KARAZ_A08_desc:0 "Turn recorded ranges and observation into effective counter-fire. The enemy’s guns must learn that concealment offers no lasting protection."
 WET_KARAZ_A09:0 "Crews and Spare Carriages"
 WET_KARAZ_A09_desc:0 "Keep trained replacements and repairable gun carriages close to the army. A repaired carriage and a trained replacement crew can keep an old gun in the battle."
 WET_KARAZ_A10:0 "A War Council of the Holds"
 WET_KARAZ_A10_desc:0 "Bring one completed training programme into the High King’s general staff. The council will turn practical successes into methods the entire host can trust."
 WET_KARAZ_A11:0 "The High King’s Host"
 WET_KARAZ_A11_desc:0 "Bind the trained throngs into a host that can serve either national strategy. The throngs will stand ready to defend the gates or march beside the world."
 WET_KARAZ_C00:0 "The High King’s Council"
 WET_KARAZ_C00_desc:0 "Decide whether the holds face the coming storm alone or beside the world. The council must decide what obligations the mountain realm will accept in the gathering storm."
 WET_KARAZ_C01:0 "Seal the Mountain Passes"
 WET_KARAZ_C01_desc:0 "Commit the realm to an independent fortress strategy. We shall meet the coming age from behind walls raised by our own hands."
 WET_KARAZ_C01_special_tt:0 "Sealed Holds: core defence +10%, trade opinion -20.\nRefuse faction invitations. Unlock deep-defence investments."
 WET_KARAZ_C02:0 "Stand Beside the Empire"
 WET_KARAZ_C02_desc:0 "Offer Thorgrim’s support to Reikland’s Grand Alliance. The ancient friendship will endure only if both realms choose to honour it."
 WET_KARAZ_C02_requirement:0 "Order government.\nNo hostile faction commitment."
 WET_KARAZ_C02_special_tt:0 "Send a membership request.\nOpen liaison and joint-armament work. Membership requires consent and current law."
 WET_KARAZ_F00:0 "Survey the Mountain Approaches"
 WET_KARAZ_F00_desc:0 "Mark every physical frontier and the northern tunnel entrance. We must know where an enemy can come before we decide where the stone should rise."
 WET_KARAZ_F01:0 "Gatehouses of Peak Pass"
 WET_KARAZ_F01_desc:0 "Strengthen Kadrin, Peak Pass and the northern approaches. The northern passes will answer an approaching host with walls and measured fire."
 WET_KARAZ_F02:0 "Guard the Western Roads"
 WET_KARAZ_F02_desc:0 "Cover Zhufbar and the westward Silver Road. The western road carries trade and danger beneath the same sky."
 WET_KARAZ_F03:0 "Batteries at Silverspear"
 WET_KARAZ_F03_desc:0 "Cover the eastern junction and the southern approaches. The junction must remain a place where our roads meet, rather than a breach through which enemies pour."
 WET_KARAZ_F04:0 "Stores Behind the Gatehouses"
 WET_KARAZ_F04_desc:0 "Give the garrisons stocks and repair crews. A strong gate is worth little when the men behind it have exhausted their stores."
 WET_KARAZ_F05:0 "Citadels of the Three Holds"
 WET_KARAZ_F05_desc:0 "Build a second defensive line inside the great holds. Should the outworks fall, the heart of each hold will still demand a terrible price."
 WET_KARAZ_F06:0 "Listeners in the Underway"
 WET_KARAZ_F06_desc:0 "Patrol the tunnels against infiltrators and sabotage. In the deep places, a patient ear may save more lives than a hurried charge."
 WET_KARAZ_F07:0 "Gunners Behind Stone"
 WET_KARAZ_F07_desc:0 "Drill the field army to fight around prepared positions. Our gunners will learn to make the enemy cross ground chosen by Dwarfen hands."
 WET_KARAZ_F08:0 "A Defence in Depth"
 WET_KARAZ_F08_desc:0 "Connect outworks, stores and inner redoubts into a layered defence. No single broken wall shall decide the fate of the realm."
 WET_KARAZ_F10:0 "Sappers of the Underway"
 WET_KARAZ_F10_desc:0 "Teach engineers to shore up passages and defend confined approaches. The Underway rewards engineers who respect both the weight of stone and the cunning of an intruder."
 WET_KARAZ_F11:0 "Watchtowers Above Peak Pass"
 WET_KARAZ_F11_desc:0 "Cover the northeastern exit with an additional fortified lookout. A warning from the heights can give the gatehouse the hour it needs."
 WET_KARAZ_F12:0 "Redoubts of the Silver Road"
 WET_KARAZ_F12_desc:0 "Prepare both ends of the southern road for a fighting withdrawal. Each redoubt will give withdrawing warriors another place to turn and fight."
 WET_KARAZ_F13:0 "Iron Doors at Silverspear"
 WET_KARAZ_F13_desc:0 "Reinforce the junction against attacks from the eastern workings. Iron and sound masonry must hold where the eastern roads converge."
 WET_KARAZ_G00:0 "Read the Border Grudges"
 WET_KARAZ_G00_desc:0 "Select immediate threats along the frontier. The first debts to settle are those whose enemies can already be heard beyond our walls."
 WET_KARAZ_G01:0 "Drive Ferrik from Cragmere"
 WET_KARAZ_G01_desc:0 "Clear the Skaven threat directly beside Zhufbar. Zhufbar cannot prosper while the ratmen make a refuge of its neighbouring workings."
 WET_KARAZ_G01_requirement:0 "Valid hostile Cragmere frontier."
 WET_KARAZ_G01_special_tt:0 "Gain a §YConquer§! war goal against §YClan Ferrik§!, valid for §Y180 days§!."
 WET_KARAZ_G02:0 "Break Verms at Silverspear"
 WET_KARAZ_G02_desc:0 "Secure the divided junction and Mount Squghorn. The junction must no longer serve the vermin that threaten our eastern road."
 WET_KARAZ_G02_requirement:0 "Valid hostile Silverspear/Grimfang frontier."
 WET_KARAZ_G02_special_tt:0 "Gain a §YConquer§! war goal against §YClan Verms§!, valid for §Y180 days§!."
 WET_KARAZ_G03:0 "Sweep the Forest of Gloom"
 WET_KARAZ_G03_desc:0 "Remove the Black Venoms from the Silver Road approaches. Caravans deserve to pass the forest without counting every shadow as an ambush."
 WET_KARAZ_G03_requirement:0 "Valid hostile Silver Road frontier."
 WET_KARAZ_G03_special_tt:0 "Gain a §YConquer§! war goal against §YBlack Venoms§!, valid for §Y180 days§!."
 WET_KARAZ_G04:0 "Crush the Ironclad Skulls"
 WET_KARAZ_G04_desc:0 "Take the pressure off Deadrock Gap and Drakenmoor. The southern approaches will remain a wound until these raiders are driven back."
 WET_KARAZ_G04_requirement:0 "Valid hostile eastern/southern frontier."
 WET_KARAZ_G04_special_tt:0 "Gain a §YConquer§! war goal against §YIronclad Skulls§!, valid for §Y180 days§!."
 WET_KARAZ_G05:0 "Push Ironback Beyond Peak Pass"
 WET_KARAZ_G05_desc:0 "Strike the Greenskins at the northeastern exit. The northeastern exit must open onto secure ground rather than another Greenskin camp."
 WET_KARAZ_G05_requirement:0 "Valid hostile Peak Pass frontier."
 WET_KARAZ_G05_special_tt:0 "Gain a §YConquer§! war goal against §YIronback§!, valid for §Y180 days§!."
 WET_KARAZ_G06:0 "Clear the Red Eye Tunnel"
 WET_KARAZ_G06_desc:0 "Secure the surviving northern Underway connection. The northern tunnel is a road of the holds, and its keepers must answer for its safety."
 WET_KARAZ_G06_requirement:0 "Has secured the Red Eye objective, or controls the Underway approach to a hostile holder of its far entrance."
 WET_KARAZ_G06_special_tt:0 "Gain a §YConquer§! war goal against §YRed Eye§!, valid for §Y180 days§!."
 WET_KARAZ_G07:0 "Reclaim the Western Workings"
 WET_KARAZ_G07_desc:0 "Return Cragmere’s workshops to productive use after victory. Victory is incomplete until honest work can begin again beneath the recovered roofs."
 WET_KARAZ_G07_requirement:0 "Owns and fully controls §Y$STATE_286$§! and is at peace with the defeated enemy."
 WET_KARAZ_G08:0 "One Silverspear Junction"
 WET_KARAZ_G08_desc:0 "Repair the reunited junction after driving out the Skaven. A repaired road will make the reunited junction more valuable than a heap of enemy trophies."
 WET_KARAZ_G08_requirement:0 "Owns and fully controls §Y$STATE_954$§! and §Y$STATE_769$§! and is at peace with the defeated enemy."
 WET_KARAZ_G09:0 "Secure the Greenskin Marches"
 WET_KARAZ_G09_desc:0 "Consolidate one completed Greenskin border campaign. The marches must be made safe for those who will live there after the warriors depart."
 WET_KARAZ_G09_requirement:0 "Own/control all fixed objectives of at least one chosen campaign.\nPeace."
 WET_KARAZ_G09_special_tt:0 "Add 1 Military Factory in the recovered objective."
 WET_KARAZ_G10:0 "Strike a Grudge from the Book"
 WET_KARAZ_G10_desc:0 "Recognise one secured frontier without demanding every conquest. The book records what was owed, but it must also record what our people have truly secured."
 WET_KARAZ_G11:0 "Rebuild the Recovered Roads"
 WET_KARAZ_G11_desc:0 "Restore a conquered border region for the next generation. The return of regular wagons will show that this victory has become a lasting recovery."
 WET_KARAZ_G11_special_tt:0 "Add 1 Civilian Factory in a recovered objective.\nSupply Consumption: §G-5%§!."
 WET_KARAZ_G12:0 "Guides Who Know the Enemy"
 WET_KARAZ_G12_desc:0 "Question miners, scouts and returning caravans before a border campaign. Those who survived the enemy’s tricks can teach the throngs how to avoid them."
 WET_KARAZ_G13:0 "The Cragmere Mines Reopened"
 WET_KARAZ_G13_desc:0 "Recommission the workings after the western frontier is secured. Fresh ore from Cragmere will give the recovered frontier a purpose beyond remembrance."
 WET_KARAZ_G14:0 "Workshops at the Reunited Junction"
 WET_KARAZ_G14_desc:0 "Make the recovered eastern junction a useful rear area. The junction’s workshops will support a living settlement instead of another abandoned battlefield."
 WET_KARAZ_G15:0 "Watchposts on the Recovered Marches"
 WET_KARAZ_G15_desc:0 "Give a secured Greenskin border region reliable roads and garrison stores. A recovered march needs reliable stores as much as a proud banner."
 WET_KARAZ_G15_requirement:0 "Owns and fully controls the site recovered through §Y$WET_KARAZ_G09$§!."
 WET_KARAZ_G15_special_tt:0 "1 infrastructure level and 1 Granary level in the selected recovered campaign state."
 WET_KARAZ_G16:0 "Caravans Return to the Border"
 WET_KARAZ_G16_desc:0 "Repair transport links where the conquered frontier has settled. The sound of returning caravans will carry farther than our victory proclamations."
 WET_KARAZ_G16_special_tt:0 "1 infrastructure level in each of up to two recovered objective states.\nUnspent claims persist."
 WET_KARAZ_H00:0 "Hear the Clans"
 WET_KARAZ_H00_desc:0 "Bring the holds’ competing needs before the High King. The strength of the realm rests on obligations that its clans understand and accept."
 WET_KARAZ_H01:0 "The Longbeards’ Counsel"
 WET_KARAZ_H01_desc:0 "Use the elders’ memory to settle practical disputes over service and obligation. An old memory can settle a quarrel before a new grudge is written."
 WET_KARAZ_H02:0 "Charters for the Guilds"
 WET_KARAZ_H02_desc:0 "Clarify responsibilities between the crown and the great workshop guilds. Clear charters will let the guilds plan their work with confidence in the crown."
 WET_KARAZ_H02_special_tt:0 "Civilian Factory construction speed: §G+5%§!.\nAdd 1 Civilian Factory."
 WET_KARAZ_H03:0 "A Census of the Holds"
 WET_KARAZ_H03_desc:0 "Count available households and military obligations without inventing a new population. The crown must know who can serve without forgetting who must keep the hearths alive."
 WET_KARAZ_H04:0 "Families of the Fallen"
 WET_KARAZ_H04_desc:0 "Organise care for wounded warriors and the households that depend on them. No household should carry the price of its service entirely alone."
 WET_KARAZ_H05:0 "The Clan Armouries"
 WET_KARAZ_H05_desc:0 "Catalogue inherited weapons and standardise the stores supporting each clan. The clan armouries preserve both useful weapons and the duties attached to them."
 WET_KARAZ_H06:0 "Oaths of Mutual Relief"
 WET_KARAZ_H06_desc:0 "Turn one completed civil programme into reliable cooperation between holds. A hold in need should find aid from its kin before it finds ruin."
 WET_KARAZ_H07:0 "One High King’s Realm"
 WET_KARAZ_H07_desc:0 "Give the united realm institutions strong enough to support its chosen strategy. The High King’s authority will be made durable through institutions that outlast any council."
 WET_KARAZ_I00:0 "Take Stock of the Holds"
 WET_KARAZ_I00_desc:0 "Audit the workshops of the united mountain realm. A ledger that can be trusted is the foundation of every sound undertaking."
 WET_KARAZ_I01:0 "Hearths Beneath the Mountain"
 WET_KARAZ_I01_desc:0 "Expand civilian workshops at Karaz-a-Karak. The work of the hearth will sustain the warriors at the gate."
 WET_KARAZ_I02:0 "The Forges of Zhufbar"
 WET_KARAZ_I02_desc:0 "Put the western hold’s workshops on a war footing. The hammering of Zhufbar must be heard above the rumours of approaching war."
 WET_KARAZ_I03:0 "Kadrin’s Armourers"
 WET_KARAZ_I03_desc:0 "Equip the northern hold and its supporting trades. No warrior of Kadrin should stand watch with a neglected shield or a blunted axe."
 WET_KARAZ_I04:0 "Ore from Mount Gunbad"
 WET_KARAZ_I04_desc:0 "Reopen and deepen the realm’s established workings. The mountain still holds wealth for those who remember how to seek it."
 WET_KARAZ_I05:0 "Wagons on the King’s Way"
 WET_KARAZ_I05_desc:0 "Improve the internal routes feeding the northern holds. A broken wagon axle can defeat a garrison as surely as an enemy blade."
 WET_KARAZ_I06:0 "Cannon for Every Gate"
 WET_KARAZ_I06_desc:0 "Standardise cannon workshops and their ammunition supply. Every gun must have a sound barrel, a trained crew and powder ready for its summons."
 WET_KARAZ_I06_special_tt:0 "Add §G2§! §YMilitary Factories§!.\n§Y1x§! §G50%§! Research bonus for: §YArtillery§!."
 WET_KARAZ_I07:0 "The Deep Workshops"
 WET_KARAZ_I07_desc:0 "Move additional civilian capacity into the protected holds. The deepest halls can shelter a craft that the world above has forgotten."
 WET_KARAZ_I07_special_tt:0 "Add §G2§! §YCivilian Factories§!, first in Gunbad and then around the capital as space permits."
 WET_KARAZ_I08:0 "An Engineers’ Conclave"
 WET_KARAZ_I08_desc:0 "Share practical improvements among the hold guilds. A tool perfected in one hold should serve every workshop beneath the High King."
 WET_KARAZ_I09:0 "Interchangeable Gun Parts"
 WET_KARAZ_I09_desc:0 "Make damaged arms repairable with standard spare parts. The quality of a weapon must outlast the hand that first assembled it."
 WET_KARAZ_I10:0 "A New Generation of Engineers"
 WET_KARAZ_I10_desc:0 "Train engineers across the established workshop network. The next generation will inherit obligations that only patient study can prepare them to bear."
 WET_KARAZ_I11:0 "The Arsenal of the Worlds Edge"
 WET_KARAZ_I11_desc:0 "Unite civilian craft and military manufacture in one programme. Our enemies will learn what an entire mountain realm can forge when its guilds work together."
 WET_KARAZ_I11_special_tt:0 "1 civilian and Add 1 Military Factory.\nFactory Output: §G+5%§!."
 WET_KARAZ_I12:0 "Survey the Old Veins"
 WET_KARAZ_I12_desc:0 "Send mine surveyors through the oldest workings beneath the capital. Old surveys may reveal fortunes overlooked by generations of hurried kings."
 WET_KARAZ_I13:0 "Waterwheels of Zhufbar"
 WET_KARAZ_I13_desc:0 "Give the western workshops a dependable mechanical power network. The turning wheels will keep the workshops alive when strong arms must march to war."
 WET_KARAZ_I15:0 "Lift Shafts of Gunbad"
 WET_KARAZ_I15_desc:0 "Bring more ore to the surface without rebuilding the entire mine. Good lifts will bring the miners home with their ore and leave fewer families waiting at the shaft."
 WET_KARAZ_I16:0 "Powder Mills of the Holds"
 WET_KARAZ_I16_desc:0 "Expand specialist workshops feeding the cannon foundries. A cannon without powder is little better than another weight upon the gate."
 WET_KARAZ_I16_special_tt:0 "Add 1 Military Factory.\n1x 50% Research bonus for: artillery."
 WET_KARAZ_I17:0 "Waste No Sound Metal"
 WET_KARAZ_I17_desc:0 "Recover usable fittings and keep proven machinery in service. Every recovered fitting is one less debt laid upon the mines."
 WET_KARAZ_I19:0 "The Masterwork Standard"
 WET_KARAZ_I19_desc:0 "Make precision gauges and trusted tooling common to every major workshop. A masterwork begins with the smallest measurement, repeated faithfully a thousand times."
 WET_KARAZ_I19_special_tt:0 "Production Efficiency Growth: §G+5%§!.\nAdd 1 Military Factory."
 WET_KARAZ_O01:0 "Ratify the Ancient Alliance"
 WET_KARAZ_O01_desc:0 "Join the coalition under its Order leader. An oath becomes an alliance only when the other realm accepts its obligations."
 WET_KARAZ_O01_requirement:0 "Has been admitted to an Order-led faction under its diplomatic requirements."
 WET_KARAZ_O01_special_tt:0 "Ratify our membership in the Order alliance."
 WET_KARAZ_O02:0 "Dwarfen Steel for Imperial Hosts"
 WET_KARAZ_O02_desc:0 "Expand armament production for the shared war effort. Dwarfen steel will give our friends a firmer footing against the common enemy."
 WET_KARAZ_O02_special_tt:0 "Send Arms to an Allied Realm."
 WET_KARAZ_O03:0 "Open the Trade Roads"
 WET_KARAZ_O03_desc:0 "Negotiate safe access and improve the homeward trade approaches. Safe passage will bring the mountain realm’s workshops closer to the armies they support."
 WET_KARAZ_O03_special_tt:0 "Negotiate Allied Passage."
 WET_KARAZ_O04:0 "Engineers Beyond the Mountains"
 WET_KARAZ_O04_desc:0 "Offer paid assistance to allied defensive projects. Our engineers can strengthen an ally’s wall without claiming the land behind it."
 WET_KARAZ_O04_special_tt:0 "Offer Frontier Fort Works."
 WET_KARAZ_O05:0 "A Council of Allied Generals"
 WET_KARAZ_O05_desc:0 "Share plans with allies while retaining command of the Dwarfen host. Shared plans will allow each host to fight as a partner while retaining its own command."
 WET_KARAZ_O06:0 "Shield of the Grand Alliance"
 WET_KARAZ_O06_desc:0 "Make Dwarfen armies and industry a lasting pillar of the coalition. The coalition must be able to rely on both our shields and the workshops that sustain them."
 WET_KARAZ_O06_requirement:0 "Current membership in an Order-led faction with at least one other realm."
 WET_KARAZ_O08:0 "Caravans to Altdorf"
 WET_KARAZ_O08_desc:0 "Keep the Dwarfen end of the western supply road working. Regular supplies will make the road to the Empire an obligation that can be kept."
 WET_KARAZ_O09:0 "Fortress Schools for the Alliance"
 WET_KARAZ_O09_desc:0 "Train allied engineers in the methods used on Dwarfen works. Lessons learned at our own gates can spare our allies the same costly mistakes."
 WET_KARAZ_O11:0 "The Alliance’s Foundry"
 WET_KARAZ_O11_desc:0 "Expand the workshops supporting the coalition’s sustained armament needs. The foundries will work for a war whose outcome reaches far beyond our mountains."
 WET_KARAZ_O11_special_tt:0 "Add 1 Military Factory.\nProduction Efficiency Retention: §G+5%§!."
 WET_KARAZ_P00:0 "The High King’s Writ"
 WET_KARAZ_P00_desc:0 "Offer the scattered Dwarfen kings protection under Karaz-a-Karak. The scattered kings must hear what protection and obligations the High King offers."
 WET_KARAZ_P01:0 "Bind the Western Holds"
 WET_KARAZ_P01_desc:0 "Ask Karak Hirn and Karak Norn to acknowledge the High King’s overlordship. The western holds may choose a common sovereign without surrendering their own halls."
 WET_KARAZ_P01_special_tt:0 "Send the High King’s offer of vassalage to [U07.GetNameDef], [U21.GetNameDef]."
 WET_KARAZ_P02:0 "Oaths from the Vaults"
 WET_KARAZ_P02_desc:0 "Bring the four surviving Vaults kingdoms beneath a common sovereign. The Vaults will be stronger when their kings can rely on a shared obligation of defence."
 WET_KARAZ_P02_special_tt:0 "Send the High King’s offer of vassalage to [U13.GetNameDef], [U14.GetNameDef], [U15.GetNameDef], [U16.GetNameDef]."
 WET_KARAZ_P03:0 "The Sea-Gate Swears Fealty"
 WET_KARAZ_P03_desc:0 "Offer Barak Varr protection while respecting its king, ships and harbour. The sea-gate can serve a wider High Kingdom while keeping its own ships and harbour."
 WET_KARAZ_P03_special_tt:0 "Send the High King’s offer of vassalage to [B14.GetNameDef]."
 WET_KARAZ_P04:0 "The Southern Kings Kneel"
 WET_KARAZ_P04_desc:0 "Seek the fealty of Karak Azul and Belegar’s surviving realm. The southern kings must settle their present wars before they can swear a new fealty."
 WET_KARAZ_P04_special_tt:0 "Send the High King’s offer of vassalage to [U22.GetNameDef], [U37.GetNameDef]."
 WET_KARAZ_P05:0 "Summon the Northern Krakas"
 WET_KARAZ_P05_desc:0 "Offer the northern Dwarfs a place beneath the High King’s protection. Distance need not sever the obligations between the northern Krakas and their kin."
 WET_KARAZ_P05_special_tt:0 "Send the High King’s offer of vassalage to [B02.GetNameDef], [B04.GetNameDef], [B05.GetNameDef]."
 WET_KARAZ_P06:0 "The Greybeards Return to the Fold"
 WET_KARAZ_P06_desc:0 "Extend the High King’s authority to the Dwarfen realm in Araby. The Greybeards’ mountain home can stand within a High Kingdom that reaches beyond the familiar passes."
 WET_KARAZ_P06_special_tt:0 "Send the High King’s offer of vassalage to [B19.GetNameDef]."
 WET_KARAZ_P07:0 "An Oath from Karak Zorn"
 WET_KARAZ_P07_desc:0 "Invite the distant southern hold to recognise a common High King. The far southern hold must decide for itself whether the old kinship should become sworn allegiance."
 WET_KARAZ_P07_special_tt:0 "Send the High King’s offer of vassalage to [U36.GetNameDef]."
 WET_KARAZ_P08:0 "Ratify the Vassal Charters"
 WET_KARAZ_P08_desc:0 "Recognise the first Dwarfen subject and define the obligations of protection. Written obligations will make clear what the High King owes to those who have actually sworn."
 WET_KARAZ_P08_requirement:0 "At least one current direct puppet from the fourteen-realm roster."
 WET_KARAZ_P08_special_tt:0 "Send Arms to a Sworn Hold."
 WET_KARAZ_P09:0 "A High Kingdom Reborn"
 WET_KARAZ_P09_desc:0 "Proclaim a renewed High Kingdom built on real sworn realms. A renewed High Kingdom must rest upon living realms and accepted oaths, rather than titles alone."
 WET_KARAZ_P09_requirement:0 "At least three current direct puppets from at least two of the seven fixed regions."
 WET_KARAZ_S01:0 "Provision for a Long Siege"
 WET_KARAZ_S01_desc:0 "Fill the holds’ granaries before the roads become unsafe. A long defence begins with provisions laid aside while the roads are still quiet."
 WET_KARAZ_S01_special_tt:0 "20,000 Food.\n2 additional Granary levels across the three great holds."
 WET_KARAZ_S02:0 "Bar Every Mountain Gate"
 WET_KARAZ_S02_desc:0 "Build the surveyed frontier into a continuous chain of strongpoints. Each approach will be given the strength its defenders have long requested."
 WET_KARAZ_S02_special_tt:0 "Raise all fifteen frontier forts to at least level 3."
 WET_KARAZ_S03:0 "Forges Behind the Doors"
 WET_KARAZ_S03_desc:0 "Replace vulnerable outside supply with protected production. The closed gates must shelter the means to sustain the realm as well as its people."
 WET_KARAZ_S03_special_tt:0 "Add §G2§! §YCivilian Factories§! and §G2§! §YMilitary Factories§!, prioritising the underground workshops."
 WET_KARAZ_S04:0 "Each Hold Supports the Next"
 WET_KARAZ_S04_desc:0 "Keep the closed realm’s internal garrisons supplied. An isolated hold may fall, but a realm of holds can keep its watch together."
 WET_KARAZ_S05:0 "The Fivefold Gates"
 WET_KARAZ_S05_desc:0 "Complete the great barriers across the surveyed frontier. The passes will bear the full weight of our resolve in stone and iron."
 WET_KARAZ_S05_special_tt:0 "Raise all fifteen frontier forts to at least level 5. Roads/tunnels stay physically connected."
 WET_KARAZ_S06:0 "The Mountains Shall Endure"
 WET_KARAZ_S06_desc:0 "Recognise the completion of the closed realm’s defensive programme. The finished works are a promise to those who must inherit the mountain after us."
 WET_KARAZ_S06_requirement:0 "Own/control fifteen frontier provinces.\nEach fort level at least 5."
 WET_KARAZ_S07:0 "Cellars for a Closed Realm"
 WET_KARAZ_S07_desc:0 "Prepare storage before trade and foreign access become less dependable. Careful storage will turn one good season into many months of endurance."
 WET_KARAZ_S07_special_tt:0 "2 Granary levels in owned great-hold states.\n10,000 Food."
 WET_KARAZ_S08:0 "Healers Behind the Gates"
 WET_KARAZ_S08_desc:0 "Keep the fortress garrisons healthy through a long siege. The defence of the holds must preserve the warriors who are asked to bear it."
 WET_KARAZ_S10:0 "Ration Every Wagon"
 WET_KARAZ_S10_desc:0 "Reduce wastage in the closed realm’s military stores. What reaches the garrison should nourish it, rather than vanish along the road."
 WET_KARAZ_S11:0 "The Last Reserve of the Holds"
 WET_KARAZ_S11_desc:0 "Prepare one emergency mobilisation of experienced home defenders. The oldest warriors will answer once more when the gates face their darkest hour."
 WET_KARAZ_S11_requirement:0 ""
 WET_KARAZ_S11_special_tt:0 "Commit the Last Reserve for 90 days."
