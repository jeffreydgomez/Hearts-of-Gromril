 wet_karaz_redeem_construction:0 "Complete the Holds’ Construction"
 wet_karaz_redeem_construction_desc:0 "Place earned factories, roads, resources and forts only at owned, fully controlled states. Unbuilt improvements wait until space is available. Factories respect five-per-type and shared slot caps."
