 wet_karaz_request_alliance:0 "Renew the Ancient Alliance"
 wet_karaz_request_alliance_desc:0 "Ask the Order faction leader to admit Karaz-a-Karak. The first sent request is free; later sent requests cost 25 political power. A refusal or expiry has a 180-day retry period, invalidation 30 days. Joining below full tension requires Reikland’s existing mandate and a clear Everchosen-war check."
