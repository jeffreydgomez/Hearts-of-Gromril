 wet_karaz_last_reserve:0 "Commit the Last Reserve"
 wet_karaz_last_reserve_decision_desc:0 "Once in this campaign, spend 50 political power and five stability points for 90 days of +15% infantry defence during a defensive war. No focus or later war can refresh this reserve."
