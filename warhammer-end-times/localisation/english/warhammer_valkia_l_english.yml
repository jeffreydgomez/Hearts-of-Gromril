l_english:
 wet_valkia_invasion:0 "Conquest of Naggaroth"
 wet_valkia_invasion_desc:0 "Khorne demands the conquest of Naggaroth."
 wet_valkia.1.t:0 "The Bloodied Horde Gathers"
 wet_valkia.1.d:0 "Khorne calls for the skulls of Naggaroth. From Dreadcrag, Valkia summons her champions and orders the tribes to gather at the Ironfrost Glacier. The watchtowers of the Dark Elves stand between the Bloodied Horde and Naggarond. The march south is planned for January, once our other wars are ended."
 wet_valkia.1.a:0 "Gather the tribes. Sharpen the axes."
 wet_valkia.preparation_tt:0 "Gain a Conquest war goal against §Y[H12.GetNameDef]§!. The Bloodied Horde prepares to invade from §Y1 January 2521§!, waiting until she is at peace. The attack proceeds only if Valkia still rules and the two realms remain independent enemies without a pact or truce."
 wet_valkia.2.t:0 "Across the Ironfrost Glacier"
 wet_valkia.2.d:0 "The hosts are assembled. Beneath banners stiff with frozen blood, Valkia leads her warriors south across the Ironfrost Glacier. The watchtowers will be the first offerings. Beyond them waits Naggarond, and a harvest worthy of Khorne."
 wet_valkia.2.a:0 "Blood for the Blood God!"
 wet_valkia.3.t:0 "Rumours from the Ironfrost"
 wet_valkia.3.d:0 "Our scouts report northern tribes gathering beneath the banner of Valkia the Bloody. Her warbands speak openly of an assault from January, once their other wars have ended. The watchtower commanders must ready their garrisons: the Gorequeen has set her sights on Naggaroth."
 wet_valkia.3.a:0 "Put the watchtowers on alert."
 wet_valkia.4.t:0 "The Gorequeen Invades"
 wet_valkia.4.d:0 "The Bloodied Horde has crossed the frontier. Valkia the Bloody leads her warriors against our northern defences, seeking a road to Naggarond. The Witch King’s armies must meet her before the watchtowers fall."
 wet_valkia.4.a:0 "Naggaroth will endure."
