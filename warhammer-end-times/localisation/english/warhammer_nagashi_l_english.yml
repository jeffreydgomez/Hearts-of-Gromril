 wet_nagashi.115.t:0 "Aliathra Has Been Taken"
 wet_nagashi.116.0:0 "Welcome the survivor home."
 wet_nagashi.116.d:0 "Aliathra has returned from captivity. Those who feared a funeral now gather to welcome the survivor, while the tale of imprisonment spreads through the court."
 wet_nagashi.116.t:0 "Aliathra Returns"
 wet_nagashi.117.0:0 "Decline the request."
 wet_nagashi.117.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.117.1:0 "Accept the terms."
 wet_nagashi.117.1_effect:0 "Transfer §YAliathra§! to §YNagashizzar§!. Ulthuan can continue its rescue and ransom efforts against her new captor. The offer expires if she leaves our custody before acceptance."
 wet_nagashi.117.d:0 "Arkhan’s emissary has come for the Everchild. Behind his courteous words lies a dreadful purpose, and Mannfred must decide whether this precious captive will pass into the Black Hand’s keeping."
 wet_nagashi.117.t:0 "The Everchild for the Great Rite"
 wet_nagashi.118.0:0 "Take no additional precautions."
 wet_nagashi.118.1:0 "Reinforce the escort."
 wet_nagashi.118.d:0 "The sacred fires of Ulric burn before Emil Valgeir. Beyond their light, the Black Hand prepares to strike at the priest who tends them.\n\nThe abduction is ready to strike. Your response resolves the attempt immediately. Reinforcing the escort costs 50 Political Power and 1,000 Infantry Equipment, reducing the capture chance to 25%. Existing protection still applies if you rely on the present guard."
 wet_nagashi.118.t:0 "A Plot against Ar-Ulric Emil Valgeir"
 wet_nagashi.119.0:0 "Find the prison."
 wet_nagashi.119.d:0 "Ar-Ulric Emil Valgeir has vanished into the hands of the Black Hand. The guards left behind can offer only fragments of the attack, while frightened messengers search for any trace of the captors."
