l_english:
 WET_DIRECT_D02_nagashi_builder:0 "Offer a non-aggression pact to the living faction leader. Acceptance establishes the Living Compact."
 WET_DIRECT_D03_nagashi_builder:0 "Offer a non-aggression pact to the Vermintide leader. Acceptance establishes the Skaven Compact."
 WET_DIRECT_D04_nagashi_builder:0 "Offer a non-aggression pact to the Everchosen’s faction leader. Acceptance establishes the Chaos Compact."
 WET_DIRECT_D06_nagashi_builder:0 "Request Military Access from the Living Compact partner. The partner may refuse."
 WET_DIRECT_D07_nagashi_builder:0 "Offer the Living Compact partner §Y250 Infantry Equipment§! in exchange for §Y100 Elite Equipment§!. Stockpiles transfer only on acceptance."
 WET_DIRECT_D10_nagashi_builder:0 "Offer the Skaven Compact partner §Y100 Elite Equipment§! for §G1× 50%§! Industry research bonus. The partner must accept."
 WET_DIRECT_D13_nagashi_builder:0 "Offer the Chaos Compact partner §Y300 Infantry Equipment§! in exchange for §Y150 Elite Equipment§!. Stockpiles transfer only on acceptance."
 WET_DIRECT_E01_nagashi_builder:0 "Set the current Everchosen’s realm as the target of §Y$WET_NGS_E04$§!. §Y$WET_NGS_E09$§! will require its capitulation to our faction and our full control of the capital selected here."
 WET_DIRECT_E02_nagashi_builder:0 "Request Military Access from eligible peaceful realms. Each recipient may refuse."
 WET_DIRECT_E03_nagashi_builder:0 "Gain §G+15% Defense§! against Everchosen enemies for §Y180 days§!."
 WET_DIRECT_E08_nagashi_builder:0 "Offer Reikland §Y250 Elite Equipment§! for the breached Auric Bastion. Acceptance transfers our equipment and gives Reikland §G75 Political Power§!."
 WET_DIRECT_E10_nagashi_builder:0 "Add §G1§! to the final-crisis containment contributions and gain §G+10% Division Defense§! for §Y90 days§!."
 WET_DIRECT_E11_nagashi_builder:0 "Block Mannfred’s final-rite betrayal while he is denied Military Access to our realm and remains outside our faction."
 WET_DIRECT_H03_nagashi_builder:0 "Gain conquest war goals against the neighbouring Stone-Fangaz, Clan Volkn and Skull Crags realms when treaties permit."
 WET_DIRECT_M20_nagashi_builder:0 "Offer pledged courts a joint research exchange. Each acceptance grants both countries §G1× 50%§! Arcana research bonus. Requires six supporting courts."
 WET_DIRECT_M21_nagashi_builder:0 "Reconcile with a Withdrawn Court."
 WET_DIRECT_N01_nagashi_builder:0 "Once at war with a southern campaign enemy, gain §G+15%§! Attack against those enemies for §Y180 days§!. This reward is granted once."
 WET_DIRECT_N03_nagashi_builder:0 "Offer eligible defeated eastern dynasties Puppet status. An accepting realm becomes our subject."
 WET_DIRECT_N04_nagashi_builder:0 "Request Military Access from the pledged Vampire Coast. Harkon may refuse."
 WET_DIRECT_N09_nagashi_builder:0 "Unlock §Y$WET_NGS_N10$§! by consuming Usirian’s power."
 WET_DIRECT_N13_nagashi_builder:0 "Once the site is available, begin §Y360 days§! of construction. Completion activates the Black Pyramid and grants §Y$wet_skv_pyramid_power$§!. Losing the site cancels construction."
 WET_DIRECT_P03_nagashi_builder:0 "Prepare the corpse-harvesting plan required by §Y$WET_NGS_P06$§!."
 WET_DIRECT_P04_nagashi_builder:0 "Explore the Dolmen immediately once we control it or its owner grants permission and military access. Request permission if access is missing. Unlock §Y$WET_NGS_P07$§!; there is no further expedition time."
 WET_DIRECT_P10_nagashi_builder:0 "Prepare the vessel immediately using one prepared, available power source. If several sources are ready, choose one. Closes all power-source branches. Complete §Y$WET_NGS_R00$§! to perform the resurrection."
 WET_DIRECT_R03_nagashi_builder:0 "Send faction invitations to eligible pledged undead courts. Each court must accept."
 WET_DIRECT_R04_nagashi_builder:0 "Send a government-conversion offer to each independent, pledged undead court with at least §Y35% Nagashi support§!. Acceptance changes its ruling government to §YNagashi§! and preserves its ruler and territory. Courts may refuse.\nFaction membership is separate."
 WET_DIRECT_V01_nagashi_builder:0 "Request a handover from Sylvania if it already holds this prisoner. Immediately send the target its abduction response event. Its response immediately resolves the attempt and sends us the result. Success chance: §Y100%§!, reduced to §Y25%§! by protection. No Political Power or equipment cost for Nagashizzar. After an unsuccessful attempt, a retry decision costs §Y100 Political Power§! and can be used once every §Y120 days§! until the ritual is complete."
