 wet_nagashi.957.t:0 "The Everchild Escapes the Rite"
 wet_nagashi.957.d:0 "The place prepared for Aliathra stands empty. Ulthuan has recovered the Everchild, and the power promised by her blood is beyond Arkhan’s grasp once more.\n\nAliathra no longer counts among our ritual captives. If the rite is still unfinished, another abduction may be attempted through her retry decision when its cooldown has ended."
 wet_nagashi.957.a:0 "Find another offering—or bring her back."
