 wet_nagashi.100.0:0 "Decline the request."
 wet_nagashi.100.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.100.1:0 "Accept the terms."
 wet_nagashi.100.1_effect:0 "Pledge our court to the restoration of Nagash.\nGain §YCovenant of the Black Hand§!, which grants:\nDaily Nagashi Support: §G+0.10§!\nFactory Output: §G+15%§!\nConstruction Speed: §G+15%§!\nDivision Recovery Rate: §G+10%§!\nSign a non-aggression pact with §YNagashizzar§!."
 wet_nagashi.100.d:0 "Arkhan’s envoy speaks of a power gathering beneath Nagashizzar, and of the place our court might claim beside it. His gifts are enticing, though even the candles seem to shrink from the seal upon his letter."
 wet_nagashi.100.t:0 "The Covenant of the Black Hand"
 wet_nagashi.101.0:0 "The matter is closed."
 wet_nagashi.101.0_effect:0 "The offer is withdrawn."
 wet_nagashi.101.d:0 "Arkhan has withdrawn the offer to renew our covenant. Our court must find its own place in the coming struggle."
 wet_nagashi.101.t:0 "The Envoy Is Recalled"
 wet_nagashi.102.0:0 "Decline the request."
 wet_nagashi.102.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.102.1:0 "Accept the terms."
 wet_nagashi.102.1_effect:0 "Exchange one §Y50%§! arcane research bonus for each government. Each court may sign once, while six active courts sustain the network."
 wet_nagashi.102.d:0 "Between the tombs, scholars have begun exchanging scraps of forbidden learning. Arkhan proposes that our necromancers open their libraries to one another, bringing old secrets into a darker light."
 wet_nagashi.102.t:0 "Research between the Crypts"
 wet_nagashi.103.0:0 "The theft will be remembered."
 wet_nagashi.103.0_effect:0 "Arkhan’s agents have stolen a relic from our custody. Expeditions to its former location must be reconsidered."
 wet_nagashi.103.d:0 "The reliquary stands open and its guards lie cold beside it. Whoever carried off the treasure knew precisely what they sought, and the trail leads toward servants of the Black Hand."
 wet_nagashi.103.t:0 "A Relic Taken by the Black Hand"
 wet_nagashi.104.0:0 "Dismiss the envoys."
 wet_nagashi.104.d:0 "The staging request has been withdrawn."
 wet_nagashi.104.t:0 "The Envoys Return"
 wet_nagashi.105.0:0 "Rely on the existing guard."
 wet_nagashi.105.1:0 "Reinforce the escort."
 wet_nagashi.105.d:0 "Our watchers have uncovered signs of a plot against Volkmar the Grim. Strangers have been asking dangerous questions, and the Black Hand’s servants may already be closer than we fear."
 wet_nagashi.105.t:0 "A Plot against Volkmar the Grim"
 wet_nagashi.106.0:0 "Find the prison."
 wet_nagashi.106.d:0 "Volkmar the Grim has vanished into the hands of the Black Hand. The guards left behind can offer only fragments of the attack, while frightened messengers search for any trace of the captors."
 wet_nagashi.106.t:0 "Volkmar the Grim Has Been Taken"
 wet_nagashi.107.0:0 "Welcome the survivor home."
 wet_nagashi.107.d:0 "Volkmar the Grim has returned from captivity. Those who feared a funeral now gather to welcome the survivor, while the tale of imprisonment spreads through the court."
 wet_nagashi.107.t:0 "Volkmar the Grim Returns"
 wet_nagashi.108.0:0 "Decline the request."
 wet_nagashi.108.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.108.1:0 "Accept the terms."
 wet_nagashi.108.1_effect:0 "Transfer §YVolkmar§! from Sylvania’s custody to §YNagashizzar§!."
 wet_nagashi.108.d:0 "Mannfred’s dungeons hold a prize that Arkhan desires more than gold. A guarded message now asks whether the vampire will surrender his captive to the designs gathering in Nagashizzar."
 wet_nagashi.108.t:0 "Mannfred’s Living Prisoner"
 wet_nagashi.109.0:0 "Refuse the ransom."
 wet_nagashi.109.0_effect:0 "The captive’s home government offers §Y150§! Political Power for this living prisoner. The captive must remain alive and in the same prison until the offer is accepted."
 wet_nagashi.109.1:0 "Accept and release the captive."
 wet_nagashi.109.1_effect:0 "The captive’s home government offers §Y150§! Political Power for this living prisoner. The captive must remain alive and in the same prison until the offer is accepted."
 wet_nagashi.109.d:0 "A messenger has brought an offer for the release of Volkmar the Grim. The proposed ransom lies before the captors, who must weigh its value against the purpose for which their prisoner was taken."
 wet_nagashi.109.t:0 "Ransom for Volkmar the Grim"
