 wet_nagashi.958.t:0 "The Usurper Walks Again"
 wet_nagashi.958.d:0 "The braziers of Khemri burn blue. Deep beneath the desert, sealed doors tremble and the Liche Priests hear a voice they have dreaded for millennia. From Cripple Peak comes the name of the sorcerer who poisoned Nehekhara and stole its promised eternity: Nagash lives again.\n\nSettra hears the report upon his golden throne. His grip tightens on its arm, but his voice fills the hall without a tremor. “Let the usurper come. He will find a king here.”\n\nMessengers depart for the tomb cities. The ancient hatred has outlasted flesh, dynasties and death itself. Now the enemy who made this land a kingdom of graves walks the world once more."
 wet_nagashi.958.d_without_settra:0 "The braziers of Khemri burn blue. Deep beneath the desert, sealed doors tremble and the Liche Priests hear a voice they have dreaded for millennia. From Cripple Peak comes the name of the sorcerer who poisoned Nehekhara and stole its promised eternity: Nagash lives again.\n\nThe court falls silent. Its priests remember the Great Ritual, the death of the living kingdoms, and the waking of kings into bodies of dust and bone. Every tomb bears witness to his crimes.\n\nMessengers depart for the tomb cities. The ancient hatred has outlasted flesh, dynasties and death itself. Now the enemy who made this land a kingdom of graves walks the world once more."
 wet_nagashi.958.a:0 "Nehekhara remembers."
 wet_nagashi.959.t:0 "The Blood Remembers Its Master"
 wet_nagashi.959.d:0 "A goblet slips from a deathless hand. In crypt and banquet hall, the same chill passes through the blood of the undying. For an instant the hunger falls silent, and beneath it stirs something older: the shadow of the will from which their curse was born.\n\nNagash has returned. The words travel swiftly between the hidden courts, though every vampire felt their truth before the first messenger arrived. Ancient bargains and carefully guarded freedoms suddenly seem fragile.\n\nSome greet the rising power with reverence; others calculate what obedience might cost. Even the proudest feel the pull from Cripple Peak. The Great Necromancer will remember his children."
 wet_nagashi.959.a:0 "His shadow reaches even here."
 wet_nagashi.960.t:0 "The Great Necromancer Returns"
 wet_nagashi.960.d:0 "The first reports are dismissed as frightened tales: grave bells ringing without hands, corpses turning toward the east, a darkness over Cripple Peak that no dawn can scatter. Then the same name arrives from distant lands, carried by terrified messengers and whispered by those who read the winds of magic.\n\nNagash has returned. The ancient maker of undeath has taken flesh again, and the dead answer a will older than many of the kingdoms now standing against the darkness.\n\nRulers summon their counsellors. Old wards are examined and forgotten accounts brought from sealed archives. Whatever wars divide the world, every battlefield has left an army beneath its soil. Now those armies have a master."
 wet_nagashi.960.a:0 "The graves will not stay silent."
