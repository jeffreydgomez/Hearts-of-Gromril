 wet_nagashi.114.0:0 "Take no additional precautions."
 wet_nagashi.114.1:0 "Reinforce the escort."
 wet_nagashi.114.d:0 "The Everchild’s sacred blood is a prize beyond gold. Arkhan’s agents have followed the quiet paths around her attendants.\n\nThe abduction is ready to strike. Your response resolves the attempt immediately. Reinforcing the escort costs 50 Political Power and 1,000 Infantry Equipment, reducing the capture chance to 25%. Existing protection still applies if you rely on the present guard."
