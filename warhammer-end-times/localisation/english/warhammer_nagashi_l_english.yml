 wet_nagashi.942.t:0 "The Black Hand Moves: Ar-Ulric Emil Valgeir"
 wet_nagashi.942.d:0 "The sacred fires of Ulric burn before Emil Valgeir. Beyond their light, the Black Hand prepares to strike at the priest who tends them.\n\nThe target’s government has received the warning. Its response resolves this attempt immediately; there is no further expedition or equipment cost. Capture is certain unless protection reduces the chance to 25%. A report will follow as soon as the attempt is resolved."
