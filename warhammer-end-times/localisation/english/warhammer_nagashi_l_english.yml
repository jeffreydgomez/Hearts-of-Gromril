 WET_DIRECT_E11_nagashi_builder:0 "Exclude Mannfred from the final rite."
 WET_DIRECT_H03_nagashi_builder:0 "Gain conquest war goals against the neighbouring Stone-Fangaz, Clan Volkn and Skull Crags realms when treaties permit."
 WET_DIRECT_M20_nagashi_builder:0 "Offer Joint Arcane Research."
 WET_DIRECT_M21_nagashi_builder:0 "Reconcile with a Withdrawn Court."
