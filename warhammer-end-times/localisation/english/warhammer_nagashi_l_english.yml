 wet_nagashi.130.0:0 "Decline the request."
 wet_nagashi.130.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.130.1:0 "Accept the terms."
 wet_nagashi.130.1_effect:0 "Permit a sixty-day Nagashi expedition at the Dolmen site, Stoneforge Tunnels 994. The accepting country gains §Y25§! Political Power. The expedition intends to drain Valaya’s power.\nAccepting grants military access and explicit local permission, not land or faction membership."
 wet_nagashi.130.d:0 "Strangers have been seen near the ancient ways, asking questions no honest traveller should ask. Arkhan seeks passage beneath the mountains, where the ancestors’ silence is a warning rather than an invitation."
 wet_nagashi.130.t:0 "An Expedition beneath the Holds"
 wet_nagashi.131.0:0 "Decline the request."
 wet_nagashi.131.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.131.1:0 "Accept the terms."
 wet_nagashi.131.1_effect:0 "Contribute bound spirits to the restoration lattice. No living population is removed. A donor may withdraw before the project is funded."
 wet_nagashi.131.1_outcome:0 "Contributes bound souls to the resurrection of Nagash."
 wet_nagashi.131.d:0 "Arkhan’s servants bring vessels inscribed with hungry runes. They ask our court to surrender a portion of its bound souls to the great work, promising that our sacrifice will be remembered when their master rises."
 wet_nagashi.131.t:0 "The Tithe of Bound Souls"
 wet_nagashi.132.0:0 "All shall serve Nagash."
 wet_nagashi.132.d:0 "The wind dies over Nagashizzar. Then the dead kneel, the vaults thunder, and a presence older than the kingdoms of men opens its eyes once more."
 wet_nagashi.132.t:0 "Nagash Returns"
 wet_nagashi.133.0:0 "Then he refuses."
 wet_nagashi.133.0_effect:0 "Nagash has offered the conquered king a place among his Mortarchs. Settra rejects the title: his allegiance is not a prize that conquest can purchase. His refusal alone causes neither a new war nor his death."
 wet_nagashi.133.d:0 "The herald’s words echo through the court and meet a silence colder than the tomb. Settra rises from his throne: he has endured death itself, and he will not endure a master."
 wet_nagashi.133.t:0 "Settra Does Not Serve"
 wet_nagashi.134.0:0 "Record his oath."
 wet_nagashi.134.d:0 "Before the gathered dead, the ancient king takes up the mantle offered by Nagash. The court watches in stunned silence as an oath few thought possible binds two terrible powers together."
 wet_nagashi.134.t:0 "Settra Accepts the Mortarch’s Mantle"
 wet_nagashi.135.0:0 "Settra does not serve!"
 wet_nagashi.135.0_effect:0 "Nehekhara has fallen to Nagash and his direct subjects. The Great Necromancer offers the living Settra the title of Mortarch. Acceptance grants a non-aggression pact and a council title.\nIt does not automatically annex this surviving government or join a faction."
 wet_nagashi.135.1:0 "Accept the Mortarch’s mantle."
 wet_nagashi.135.1_effect:0 "Nehekhara has fallen to Nagash and his direct subjects. The Great Necromancer offers the living Settra the title of Mortarch. Acceptance grants a non-aggression pact and a council title.\nIt does not automatically annex this surviving government or join a faction."
 wet_nagashi.135.d:0 "Nagash offers the Imperishable a place among his foremost servants. It is a gift shaped like a chain, laid before a king who has never bowed his head."
 wet_nagashi.135.t:0 "Nagash’s Offer to Settra"
 wet_nagashi.136.0:0 "Decline the request."
 wet_nagashi.136.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.136.1:0 "Accept the terms."
 wet_nagashi.136.1_effect:0 "Offer the current bloc leader a non-aggression pact and separate cooperation. Neither faction merges and no war is entered."
 wet_nagashi.136.d:0 "An embassy from Nagashizzar waits beyond the palace doors. Its master offers a bargain against the storm gathering over the world; accepting would mean clasping a hand that has never known warmth."
 wet_nagashi.136.t:0 "Propose the Living Compact"
 wet_nagashi.137.0:0 "Decline the request."
 wet_nagashi.137.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.137.1:0 "Accept the terms."
 wet_nagashi.137.1_effect:0 "Offer the current bloc leader a non-aggression pact and separate cooperation. Neither faction merges and no war is entered."
 wet_nagashi.137.d:0 "Nagash’s messengers have descended into the warrens with an offer for the Council. The rats smell advantage, treachery and the grave in equal measure."
 wet_nagashi.137.t:0 "Propose the Rats Compact"
 wet_nagashi.138.0:0 "Decline the request."
 wet_nagashi.138.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.138.1:0 "Accept the terms."
 wet_nagashi.138.1_effect:0 "Offer the current bloc leader a non-aggression pact and separate cooperation. Neither faction merges and no war is entered."
 wet_nagashi.138.d:0 "A herald from Nagashizzar has crossed into the north bearing an unlikely bargain. The champions of Chaos must weigh the usefulness of the dead against the ambitions of their master."
 wet_nagashi.138.t:0 "Propose the Chaos Compact"
 wet_nagashi.139.0:0 "Decline the request."
 wet_nagashi.139.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.139.1:0 "Accept the terms."
 wet_nagashi.139.1_effect:0 "Negotiate military access without faction or war entry. The accepting country gains §Y25§! Political Power and §Y+25§! opinion of Nagashizzar."
 wet_nagashi.139.d:0 "The dead stand patiently beyond our frontier while their herald asks leave to pass. Their destination lies elsewhere, but every road they take will carry rumours before them."
 wet_nagashi.139.t:0 "Request Living Passage"
 wet_nagashi.140.0:0 "Decline the request."
 wet_nagashi.140.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.140.1:0 "Accept the terms."
 wet_nagashi.140.1_effect:0 "Negotiate military access without faction or war entry. The accepting country gains §Y25§! Political Power and §Y+25§! opinion of Nagashizzar."
 wet_nagashi.140.d:0 "A messenger from Nagashizzar has reached the northern warlords. He asks that the roads be opened to his master’s servants, whose silent columns already gather beyond the horizon."
 wet_nagashi.140.t:0 "Request Northern Passage"
 wet_nagashi.141.0:0 "Decline the request."
 wet_nagashi.141.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.141.1:0 "Accept the terms."
 wet_nagashi.141.1_effect:0 "Negotiate military access without faction or war entry. The accepting country gains §Y25§! Political Power and §Y+25§! opinion of Nagashizzar. Nagashizzar pays §Y50§! Political Power only on acceptance."
 wet_nagashi.141.d:0 "An envoy of Nagash seeks a road through our territory. We may let his servants pass, though the sight of their banners will trouble every village along the way."
 wet_nagashi.141.t:0 "Request Independent Passage"
 wet_nagashi.142.0:0 "Decline the request."
 wet_nagashi.142.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.142.1:0 "Accept the terms."
 wet_nagashi.142.1_effect:0 "Request military access from a living, pledged Vampire Coast. The accepting country gains §Y25§! Political Power. This is a separate agreement without war entry."
 wet_nagashi.142.d:0 "A ship under Nagashizzar’s colours has entered Harkon’s waters. Its envoy asks safe passage for the Black Hand’s business, leaving the lord of the coast to decide what such courtesy is worth."
 wet_nagashi.142.t:0 "Ask Harkon for Passage"
 wet_nagashi.143.0:0 "Decline the request."
 wet_nagashi.143.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.143.1:0 "Accept the terms."
 wet_nagashi.143.1_effect:0 "Exchange §Y250§! infantry equipment from Nagashizzar for §Y100§! Elite Equipment from the consenting partner. Both stockpiles are rechecked. Repeat every §Y180§! days."
 wet_nagashi.143.d:0 "Crates of weapons wait beside a caravan bound for our uneasy partners. Trade may bind the living and the dead where trust cannot."
 wet_nagashi.143.t:0 "Exchange Arms with the Living Partner"
 wet_nagashi.144.0:0 "Decline the request."
 wet_nagashi.144.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.144.1:0 "Accept the terms."
 wet_nagashi.144.1_effect:0 "Exchange §Y300§! infantry equipment from Nagashizzar for §Y150§! Elite Equipment from the consenting partner. Both stockpiles are rechecked. Repeat every §Y180§! days."
 wet_nagashi.144.d:0 "The agreed arms caravan has reached the frontier. Both escorts keep their weapons close as the servants of Chaos and Nagash prepare to exchange their cargo."
 wet_nagashi.144.t:0 "Exchange Arms with the Chaos Partner"
 wet_nagashi.145.0:0 "Decline the request."
 wet_nagashi.145.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.145.1:0 "Accept the terms."
 wet_nagashi.145.1_effect:0 "Send §Y100§! Elite Equipment from the stockpile to the consenting Vermintide partner in exchange for one §Y50%§! industry research bonus. Once only."
 wet_nagashi.145.d:0 "The Skaven have brought diagrams, muttered promises and a suspicious number of locked boxes. Their workshop secrets may serve the great work, provided something useful can be separated from the lies."
 wet_nagashi.145.t:0 "Purchase Skaven Workshop Lore"
 wet_nagashi.146.0:0 "Decline the request."
 wet_nagashi.146.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.146.1:0 "Accept the terms."
 wet_nagashi.146.1_effect:0 "Agree to a temporary non-aggression pact."
 wet_nagashi.146.d:0 "Nagash’s herald offers to set aside the quarrels between our realms. The parchment bears no warmth, but even a cold peace may be preferable to another enemy at the gates."
 wet_nagashi.146.t:0 "Propose a Separate Non-Aggression Pact"
 wet_nagashi.147.0:0 "Decline the request."
 wet_nagashi.147.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.147.1:0 "Accept the terms."
 wet_nagashi.147.1_effect:0 "For §Y50§! Political Power on acceptance, send §Y250§! infantry equipment to a government that consents. Neither access nor a non-aggression pact is automatic."
 wet_nagashi.147.d:0 "A convoy from Nagashizzar approaches under a flag of truce. Its master offers arms to those who might yet prove useful in the wars ahead."
 wet_nagashi.147.t:0 "Offer Independent Aid"
 wet_nagashi.148.0:0 "Take note of the warning."
 wet_nagashi.148.d:0 "The seals have been broken and the envoys recalled. Nagash no longer considers himself bound by the bargain that joined our interests to his."
 wet_nagashi.148.t:0 "Nagash Renounces the Bargain"
 wet_nagashi.149.0:0 "Decline the request."
 wet_nagashi.149.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.149.1:0 "Accept the terms."
 wet_nagashi.149.1_effect:0 "Invite a consenting pledged court to Nagashi. Normal faction and subject laws still apply, including the world-tension threshold. This is distinct from the original covenant."
 wet_nagashi.149.d:0 "Our pledge to the Black Hand has brought a new summons. Nagash now calls upon our court to take its place openly beneath his banner."
 wet_nagashi.149.t:0 "Invite a Pledged Court into Nagashi"
 wet_nagashi.150.0:0 "Decline the request."
 wet_nagashi.150.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.150.1:0 "Accept the terms."
 wet_nagashi.150.1_effect:0 "A pledged undead court with at least §Y35%§! Nagash support may voluntarily adopt Nagash government. Its existing ruler, religion and territory are preserved. Faction admission is separate."
 wet_nagashi.150.d:0 "The herald of Nagash demands more than friendship. He offers our rulers a place in his dominion, where their crowns may remain but their highest allegiance will be his."
 wet_nagashi.150.t:0 "Recognise Nagash’s Sovereignty"
 wet_nagashi.151.0:0 "Decline the request."
 wet_nagashi.151.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.151.1:0 "Accept the terms."
 wet_nagashi.151.1_effect:0 "Nagash asks this pledged faction member to enter the one named war against an Everchosen belligerent. Acceptance joins that war only.\nRefusal preserves the covenant and the member’s other obligations."
 wet_nagashi.151.d:0 "The commanders of the dead assemble beneath their master’s gaze. Rivalries are swallowed for the moment as the Mortarchs turn toward the wars awaiting them."
 wet_nagashi.151.t:0 "The Mortarchs Take the Field"
 wet_nagashi.152.0:0 "Decline the request."
 wet_nagashi.152.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.152.1:0 "Accept the terms."
 wet_nagashi.152.1_effect:0 "Nagash asks to join the one selected war against an enemy of our government. Accept only if the target remains hostile, the declaration remains lawful and the original war continues. Factions remain separate."
 wet_nagashi.152.d:0 "An enemy threatens interests shared by our realm and Nagashizzar. His herald proposes that our armies strike together, a bargain written in the shadow of the battlefield."
 wet_nagashi.152.t:0 "A Common War with Nagash"
 wet_nagashi.153.0:0 "Decline the request."
 wet_nagashi.153.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.153.1:0 "Accept the terms."
 wet_nagashi.153.1_effect:0 "Nagash asks to join the one selected war against an enemy of our government. Accept only if the target remains hostile, the declaration remains lawful and the original war continues. Factions remain separate."
 wet_nagashi.153.d:0 "An enemy threatens interests shared by our realm and Nagashizzar. His herald proposes that our armies strike together, a bargain written in the shadow of the battlefield."
 wet_nagashi.153.t:0 "A Common War with Nagash"
 wet_nagashi.154.0:0 "Decline the request."
 wet_nagashi.154.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.154.1:0 "Accept the terms."
 wet_nagashi.154.1_effect:0 "Request voluntary submission by an actually defeated eastern dynasty. Refusal preserves its independent position. The recipient knows that acceptance makes it a puppet of Nagashizzar."
 wet_nagashi.154.d:0 "The old kings of the east have received a summons from Nagash. They may keep their courts beneath his shadow, if they are willing to acknowledge whose will now rules the dead."
 wet_nagashi.154.t:0 "Offer Terms to an Eastern Dynasty"
 wet_nagashi.155.0:0 "Decline the request."
 wet_nagashi.155.0_effect:0 "Decline without payment or forced commitments."
 wet_nagashi.155.1:0 "Accept the terms."
 wet_nagashi.155.1_effect:0 "Deliver §Y250§! Elite Equipment to Reikland with its consent. Reikland retains the frontier and receives §Y75§! Political Power earmarked to fund its existing repair decision.\nThis does not repair inaccessible sites or create a second Bastion."
 wet_nagashi.155.d:0 "Even the servants of Nagash can see what waits beyond the northern horizon. An offer of assistance has arrived for the great barrier, though its defenders may distrust the hand that brings it."
 wet_nagashi.155.t:0 "Contribute to the Auric Bastion"
 wet_ngs_abduct_alarielle:0 "Kidnap Alarielle the Radiant"
