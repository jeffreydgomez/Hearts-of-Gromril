 WET_NGS_A02_desc:0 "A volume of the Great Necromancer’s work lies beyond his grasp. Arkhan sends trusted servants to recover its forbidden pages and return them to the chamber beneath Cripple Peak."
 WET_NGS_A02_requirements:0 "At selection: §Y3§! / §Y4§! / §Y5§! / §Y6§!–§Y8§! active courts. Current expedition keeps its selected duration."
 WET_NGS_A02_special_tt:0 "Recover exactly one Book 2 (The Tyrant’s Testament) for the shared ritual ledger. No random failure, foreign veto or later captivity gate.\nUpdate existing custody atomically. Political Power Gain +2% permanently on first recovery.\nNo repeated bonus after theft/recovery."
