 WET_DIRECT_V06_nagashi_builder:0 "Immediately send the target its abduction response event. Its response immediately resolves the attempt and sends us the result. Success chance: §Y100%§!, reduced to §Y25%§! by protection. No Political Power or equipment cost for Nagashizzar. After an unsuccessful attempt, a retry decision costs §Y100 Political Power§! and can be used once every §Y120 days§! until the ritual is complete. Kroak’s bound spirit counts as one ritual captive."
 WET_NGS_A00:0 "Dispatch the Relic Expeditions"
 WET_NGS_A00_desc:0 "Across the world, tombs and hidden vaults hold fragments of the Great Necromancer’s power. Arkhan’s agents depart with secret instructions and empty reliquaries."
 WET_NGS_A00_requirements:0 "At least §Y3§! active courts: pledged named courts or Nagashi members of our faction."
 WET_NGS_A01:0 "Book 1: Secrets Beyond the Veil"
 WET_NGS_A01_desc:0 "Recovers Book 1: Secrets Beyond the Veil.\nResearch Speed: §G+1%§!."
 WET_NGS_A01_requirements:0 "At selection: §Y3 / 4 / 5 / 6+§! active courts give §Y42 / 35 / 28 / 21§! days. Each country counts once. The selected duration is retained."
 WET_NGS_A01_special_tt:0 "Recovers §YBook 1: Secrets Beyond the Veil§!.\nResearch Speed: §G+1%§! permanently."
