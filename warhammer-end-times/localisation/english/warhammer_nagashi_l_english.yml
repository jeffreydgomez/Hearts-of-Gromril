 wet_nagashi.953.d:0 "The report concerning Lord Kroak brings no prisoner to Cripple Peak. The target’s circumstances have changed, or there is no secure capital prison in which to hold them.\n\nNo capture has been recorded. When the target and a secure prison are available, a retry decision costs 100 Political Power and can be used once every 120 days. No equipment is required."
