 wet_ngs_status_details:0 "Nagash’s return requires seven acquired relics, at least three ritual captives, one power source and a vessel at Cripple Peak. Complete the final focus to perform the rite. Every held ritual captive will be sacrificed.\n\nActive courts: [Root.GetWetNGSStatusCourts] — three open relic expeditions; six or more give maximum speed.\nA court counts either as an independent named court that accepted its covenant through an audience focus, or as another country with Nagashi as its ruling ideology in our faction. Each country counts once.\nRelics held: [Root.GetWetNGSStatusRelics]   Ritual captives held: [Root.GetWetNGSStatusCaptives]\nCripple Peak: [Root.GetWetNGSStatusSite]\nChoose ONE power source for the vessel:\nValaya: [Root.GetWetNGSStatusValaya]\nWarpstone: [Root.GetWetNGSStatusWarpstone]\nStitched Body: [Root.GetWetNGSStatusSouls]\nChoose one prepared source when The Great Restoration Project completes. The other two are not required. Selecting Warpstone consumes 12 Warpstone from Cripple Peak. Selecting the Stitched Body permanently consumes all Monsters resources in Cripple Peak.\n\nVessel: [Root.GetWetNGSStatusVessel]\nFinal invocation: [Root.GetWetNGSStatusInvocation]\n\nNext step: [Root.GetWetNGSStatusNext]"
