 wet_nagashi.120.0:0 "Welcome the survivor home."
 wet_nagashi.120.d:0 "Ar-Ulric Emil Valgeir has returned from captivity. Those who feared a funeral now gather to welcome the survivor, while the tale of imprisonment spreads through the court."
