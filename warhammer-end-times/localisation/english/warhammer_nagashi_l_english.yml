 WET_NGS_A11_requirements:0 "At selection: §Y3 / 4 / 5 / 6+§! active courts give §Y42 / 35 / 28 / 21§! days. Each country counts once. The selected duration is retained."
 WET_NGS_A11_special_tt:0 "Recovers §YAlakanash, the Staff§!.\nSpecial Project Research Speed: §G+3%§! permanently."
 WET_NGS_A12:0 "Morikhane, the Armour"
 WET_NGS_A12_desc:0 "Recovers Morikhane, the Armour.\nDivision Defense: §G+2%§!."
 WET_NGS_A12_requirements:0 "At selection: §Y3 / 4 / 5 / 6+§! active courts give §Y42 / 35 / 28 / 21§! days. Each country counts once. The selected duration is retained."
 WET_NGS_A12_special_tt:0 "Recovers §YMorikhane, the Armour§!.\nDivision Defense: §G+2%§! permanently."
 WET_NGS_A13:0 "The Severed Hand"
 WET_NGS_A13_desc:0 "Recovers The Severed Hand.\nRecruitable Population Factor: §G+2%§!."
 WET_NGS_A13_requirements:0 "At selection: §Y3 / 4 / 5 / 6+§! active courts give §Y42 / 35 / 28 / 21§! days. Each country counts once. The selected duration is retained."
 WET_NGS_A13_special_tt:0 "Recovers §YThe Severed Hand§!.\nRecruitable Population Factor: §G+2%§! permanently."
 WET_NGS_A14:0 "The Fellblade"
 WET_NGS_A14_desc:0 "Recovers The Fellblade.\nDivision Attack: §G+2%§!."
 WET_NGS_A14_requirements:0 "At selection: §Y3 / 4 / 5 / 6+§! active courts give §Y42 / 35 / 28 / 21§! days. Each country counts once. The selected duration is retained."
 WET_NGS_A14_special_tt:0 "Recovers §YThe Fellblade§!.\nDivision Attack: §G+2%§! permanently."
 WET_NGS_A15:0 "Seven Relics for the Rite"
 WET_NGS_A15_desc:0 "The reliquaries stand beneath Cripple Peak like silent witnesses. Power stirs between them, answering the presence of the withered figure at their centre."
 WET_NGS_A15_requirements:0 "At least §Y7§! distinct artifacts acquired by [U24.GetNameDef].\nNot all fourteen."
 WET_NGS_D00:0 "The World beyond Our Courts"
 WET_NGS_D00_desc:0 "The resurrection needs time while greater powers prepare for war. Assess the bargains available outside the undead courts."
 WET_NGS_D01:0 "One Great Bargain"
 WET_NGS_D01_desc:0 "Even the servants of Nagash must sometimes bargain with powers beyond their reach. Arkhan weighs the promises brought to his court against the treachery that so often follows them."
 WET_NGS_D02:0 "An Accord with the Living"
 WET_NGS_D02_desc:0 "The living dread our banners, yet they dread the coming darkness more. An accord with the Grand Alliance may turn that fear toward a common enemy."
 WET_NGS_D02_requirements:0 "A living realm’s faction leader exists and is at peace with us."
 WET_NGS_D02_special_tt:0 "Offer a non-aggression pact to the living faction leader. Acceptance establishes the Living Compact."
 WET_NGS_D03:0 "A Compact with the Vermintide"
 WET_NGS_D03_desc:0 "The Skaven bring ingenious devices and an appetite for betrayal. A bargain with the Vermintide must offer enough to tempt them without placing our fate in their claws."
 WET_NGS_D03_requirements:0 "The Vermintide’s leader exists and is at peace with us."
 WET_NGS_D03_special_tt:0 "Offer a non-aggression pact to the Vermintide leader. Acceptance establishes the Skaven Compact."
 WET_NGS_D04:0 "A Truce with the Everchosen"
 WET_NGS_D04_desc:0 "The Everchosen has enemies enough to occupy even his vast host. A truce may buy the quiet our work demands, though neither side will mistake it for friendship."
 WET_NGS_D04_requirements:0 "Has not committed to §Y$WET_NGS_E00$§!."
 WET_NGS_D04_special_tt:0 "Offer a non-aggression pact to the Everchosen’s faction leader. Acceptance establishes the Chaos Compact."
 WET_NGS_D05:0 "No Master, No Great Bargain"
 WET_NGS_D05_desc:0 "No foreign throne will dictate the work beneath Cripple Peak. We will gather our strength within our own walls and let distant powers quarrel over their promises."
 WET_NGS_D06:0 "Safe Passage for the Dead"
 WET_NGS_D06_desc:0 "A pact with the living needs routes both sides can trust. Request passage on agreed roads."
 WET_NGS_D06_requirements:0 "Living compact accepted."
 WET_NGS_D06_special_tt:0 "Request Military Access from the Living Compact partner. The partner may refuse."
 WET_NGS_D07:0 "The Price of Cooperation"
 WET_NGS_D07_desc:0 "The living can provide tools while the dead provide military knowledge. Offer an exchange neither side receives for free."
 WET_NGS_D07_special_tt:0 "Offer the Living Compact partner §Y250 Infantry Equipment§! in exchange for §Y100 Elite Equipment§!. Stockpiles transfer only on acceptance."
 WET_NGS_D08:0 "A Common War against Chaos"
 WET_NGS_D08_desc:0 "The compact can become a military coalition when both governments agree. Keep each faction’s identity intact."
 WET_NGS_D08_requirements:0 "Nagash restored.\nNo active contrary treaty."
 WET_NGS_D08_special_tt:0 "Unlock separate joint-war offers against Everchosen belligerents.\nEach country retains its own faction."
 WET_NGS_D09:0 "Keep the Rats from the Relics"
 WET_NGS_D09_desc:0 "Skaven eyes linger too long upon our reliquaries. Their envoys must understand that some treasures are beyond the reach of even the most profitable bargain."
 WET_NGS_D09_requirements:0 "Vermintide compact accepted."
 WET_NGS_D10:0 "Warpstone for the Workshops"
 WET_NGS_D10_desc:0 "The warrens hunger for materials, and our workshops hunger for new knowledge. An exchange may satisfy both, provided each side keeps a careful watch upon the other."
 WET_NGS_D10_special_tt:0 "Offer the Skaven Compact partner §Y100 Elite Equipment§! for §G1× 50%§! Industry research bonus. The partner must accept."
 WET_NGS_D11:0 "Divide the Battlefields"
 WET_NGS_D11_desc:0 "Each coalition may pursue its own objectives while fighting a shared enemy. Agree to a limited campaign."
 WET_NGS_D11_special_tt:0 "Unlock common-war offers against a named mutually hostile bloc."
 WET_NGS_D12:0 "The Southern Breathing Space"
 WET_NGS_D12_desc:0 "The northern warlord’s truce leaves time for the southern campaign. Define its limits."
 WET_NGS_D12_requirements:0 "Everchosen compact accepted."
 WET_NGS_D13:0 "A Measured Tribute"
 WET_NGS_D13_desc:0 "Material exchange can extend the compact without surrendering our sovereignty. Set a price the workshops can sustain."
 WET_NGS_D13_special_tt:0 "Offer the Chaos Compact partner §Y300 Infantry Equipment§! in exchange for §Y150 Elite Equipment§!. Stockpiles transfer only on acceptance."
 WET_NGS_D14:0 "The Gods Must Wait"
 WET_NGS_D14_desc:0 "The southern war remains ours to fight. Keep northern envoys informed while we secure Nehekhara."
 WET_NGS_D14_requirements:0 "Has chosen §Y$WET_NGS_N00$§!, has no anti-Everchosen commitment, and the agreed truce remains in force."
 WET_NGS_D15:0 "An Armed Neutrality"
 WET_NGS_D15_desc:0 "A realm without a great bargain must be ready to defend its own interests. Expand its reserves."
 WET_NGS_D16:0 "Our Own Workshops"
 WET_NGS_D16_desc:0 "Independence needs domestic productive capacity. Enlarge the arsenals."
 WET_NGS_D16_special_tt:0 "Add §G2§! §YMilitary Factories§!.\nResearch Speed: §G+5%§!."
 WET_NGS_D17:0 "Treat with Them as Equals"
 WET_NGS_D17_desc:0 "Independent power still has uses for limited agreements. Open individual negotiations without a permanent patron."
 WET_NGS_D17_special_tt:0 "Unlock 50-Political Power one-off aid/access offers.\nNo foreign faction invitation or automatic NAP."
 WET_NGS_E00:0 "The Everchosen Must Fall"
 WET_NGS_E00_desc:0 "Chaos threatens every kingdom of the dead. Concentrate the restored host against its present war leader."
 WET_NGS_E00_requirements:0 "Has no active bargain with the Everchosen. Any agreement made through §Y$WET_NGS_D04$§! must first be renounced."
 WET_NGS_E00_special_tt:0 ""
 WET_NGS_E01:0 "Identify the Living Warfront"
 WET_NGS_E01_desc:0 "The northern host leaves burned villages and broken armies in its wake. Our scouts follow that trail toward the warlord who dares threaten the dominion of death."
 WET_NGS_E01_special_tt:0 "Set the current Everchosen’s realm as the target of §Y$WET_NGS_E04$§!. §Y$WET_NGS_E09$§! will require its capitulation to our faction and our full control of the capital selected here."
 WET_NGS_E02:0 "A Road through the Empire"
 WET_NGS_E02_desc:0 "The living may permit an army of the dead to cross their lands. Offer terms that respect their sovereignty."
 WET_NGS_E02_special_tt:0 "Request Military Access from eligible peaceful realms. Each recipient may refuse."
 WET_NGS_E03:0 "The Dead Hold the Line"
 WET_NGS_E03_desc:0 "The dead can hold where living soldiers would falter. Prepare the army to face the Everchosen’s enemies."
 WET_NGS_E03_requirements:0 "An active enemy of the Everchosen exists."
 WET_NGS_E03_special_tt:0 "Gain §G+15% Defense§! against Everchosen enemies for §Y180 days§!."
 WET_NGS_E04:0 "Challenge the Everchosen"
 WET_NGS_E04_desc:0 "The Everchosen claims the world for powers that would leave nothing for Nagash to rule. Let our challenge reach his camp before the first of our legions comes into view."
 WET_NGS_E04_requirements:0 "The selected Everchosen realm still exists and can be attacked under our current treaties."
 WET_NGS_E04_special_tt:0 "Goal against the bound current Everchosen leader.\nStale leader requires explicit re-selection."
 WET_NGS_E05:0 "The Battlefields Give Back"
 WET_NGS_E05_desc:0 "The dead of our own conquered battlefields replenish the host. Organise their recovery after combat."
 WET_NGS_E05_requirements:0 "war with the Everchosen bloc."
 WET_NGS_E05_special_tt:0 "Unlock 50-Political Power muster: once per enemy state actually captured in this war, add 2% of its starting population.\n180-day shared cooldown.\nMax 5 states."
 WET_NGS_E06:0 "Break the Plague Hosts"
 WET_NGS_E06_desc:0 "Nurgle can corrupt even the deathless. Train specialists to dismantle its formations."
 WET_NGS_E07:0 "The Mortarchs Take the Field"
 WET_NGS_E07_desc:0 "The Mortarchs have spoken at length around the council table. Now their hosts must march, and their deeds must give weight to their promises."
 WET_NGS_E07_requirements:0 "At least §Y2§! pledged realms are allies participating in the war."
 WET_NGS_E08:0 "Beyond the Broken Bastion"
 WET_NGS_E08_desc:0 "The Empire’s battered defences stand across the northern roads. Envoys must find common purpose with their weary defenders before the dead pass beneath the walls."
 WET_NGS_E08_special_tt:0 "Offer Reikland §Y250 Elite Equipment§! for the breached Auric Bastion. Acceptance transfers our equipment and gives Reikland §G75 Political Power§!."
 WET_NGS_E09:0 "End the Northern Host"
 WET_NGS_E09_desc:0 "The enemy’s field armies have been defeated. Secure the seat from which its leader directs the war."
 WET_NGS_E09_requirements:0 "defeat and capital control."
 WET_NGS_E10:0 "Death against the Rift"
 WET_NGS_E10_desc:0 "Beyond the clash of armies lies a wound in the world itself. Nagash turns his attention toward the rift, unwilling to surrender creation to the gods that would consume it."
 WET_NGS_E10_requirements:0 "Complete Nagash’s contribution to the final containment."
 WET_NGS_E10_special_tt:0 "Add §G1§! to the final-crisis containment contributions and gain §G+10% Division Defense§! for §Y90 days§!."
 WET_NGS_E11:0 "Watch the Unfaithful"
 WET_NGS_E11_desc:0 "No single court should be able to sabotage the whole coalition. Establish guards around the final working."
 WET_NGS_E11_requirements:0 "Exclude Mannfred from the final rite."
 WET_NGS_E11_special_tt:0 "Block Mannfred’s final-rite betrayal while he is denied Military Access to our realm and remains outside our faction."
 WET_NGS_E12:0 "A World Still to Rule"
 WET_NGS_E12_desc:0 "The immediate northern threat is broken. Turn survival into a lasting political settlement."
 WET_NGS_E13:0 "Rebuild the Battlegrounds"
 WET_NGS_E13_desc:0 "Victory has left shattered roads and empty workshops behind our armies. The dead will raise them again, stone by stone and beam by beam."
 WET_NGS_E13_special_tt:0 "Add §G2§! §YCivilian Factories§! and §G2§! §YMilitary Factories§! in owned states damaged by the war.\nConstruction Speed: §G+10%§!."
 WET_NGS_H00:0 "The Regent of Cripple Peak"
 WET_NGS_H00_desc:0 "Arkhan tends the husk of his master and commands Nagashizzar. Put the fortress in order for the work ahead."
 WET_NGS_H01:0 "Reopen the Silent Forges"
 WET_NGS_H01_desc:0 "The old furnaces can arm a growing host. Restore their workshops."
 WET_NGS_H02:0 "The Corpse Roads"
 WET_NGS_H02_desc:0 "Travel between the mountain and coast must be reliable. Repair the roads used by Arkhan’s servants."
 WET_NGS_H03:0 "Secure the Expanded Realm"
 WET_NGS_H03_desc:0 "The conquered borderlands now answer to Nagashizzar. Establish the regency’s authority from the mountain passes to the coast."

 WET_NGS_H04:0 "Work without Rest"
 WET_NGS_H04_desc:0 "The dead can sustain shifts beyond mortal endurance. Organise the workshops around continuous labour."
 WET_NGS_H05:0 "Granaries for the Living Retinue"
 WET_NGS_H05_desc:0 "Living envoys and craftsmen still need provisions. Establish stores along their journeys."
 WET_NGS_H06:0 "Roads through the Broken Teeth"
 WET_NGS_H06_desc:0 "The Broken Teeth already guard our northern approaches. Repair the roads and drill the garrisons that hold them."

 WET_NGS_H07:0 "Wards beneath Cripple Peak"
 WET_NGS_H07_desc:0 "Skaven once contested these workings. Seal the approaches to the ritual chambers."
 WET_NGS_H07_special_tt:0 "Land forts to level 2 in Nagashizzar.\n1x 50% Research bonus for: engineer."
 WET_NGS_H08:0 "Forges of the Conquered Holds"
 WET_NGS_H08_desc:0 "Stone-Fangaz and Clan Volkn have fallen. Put their captured workshops to work supplying the restoration."
 WET_NGS_H08_special_tt:0 "Add §G1§! Military Factory, prioritizing owned, fully controlled §Y$STATE_302$§! and §Y$STATE_1020$§!."
 WET_NGS_H09:0 "Shattered Coast Shipwrights"
 WET_NGS_H09_desc:0 "A working coast gives the court a route to distant allies. Expand the yards already serving it."
 WET_NGS_H09_special_tt:0 "Add 1 Naval Dockyard in owned coastal homeland.\n20 convoys."
 WET_NGS_H10:0 "A Defensible Domain"
 WET_NGS_H10_desc:0 "Our expanded holdings need secure roads, workshops and prepared garrisons. Turn them into a lasting shield for the regency."
 WET_NGS_H10_special_tt:0 "Add 1 Civilian Factory in our controlled borderlands.\nGain +5% Army Defense."
 WET_NGS_H11:0 "The Arsenal of Nagashizzar"
 WET_NGS_H11_desc:0 "The workshops and roads can sustain the restored master’s armies. Complete their common arsenal."
 WET_NGS_H11_special_tt:0 "Add 1 Military Factory.\n1x 50% Research bonus for: infantry-equipment."
 WET_NGS_M00:0 "Arkhan Takes the Road"
 WET_NGS_M00_desc:0 "Arkhan must find rulers willing to invest in Nagash’s return. His first audiences establish a network of agents."
 WET_NGS_M01:0 "The Promise of Undeath"
 WET_NGS_M01_desc:0 "Offer power, protection and replenished hosts in exchange for assistance. Arkhan’s agents will carry that promise into the courts of the living and the dead."
 WET_NGS_M02:0 "An Audience with Sylvania"
 WET_NGS_M02_desc:0 "[A13.GetLeader]’s ambitions have never ended at Sylvania’s borders. Arkhan comes to his court with the promise of a place beside a throne greater than any held by the living."
 WET_NGS_M02_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M02_special_tt:0 "[A13.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M03:0 "An Audience with Sires of Mourkain"
 WET_NGS_M03_desc:0 "The heirs of Mourkain remember a kingdom that others would sooner forget. Arkhan offers recognition of that ancient inheritance in the world his master intends to raise."
 WET_NGS_M03_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M03_special_tt:0 "[B16.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M04:0 "An Audience with Mousillon"
 WET_NGS_M04_desc:0 "In Mousillon, a disputed crown casts a long shadow over every bargain. Arkhan offers the claimant something the chivalrous courts will not: a willing ear and the promise of powerful friends."
 WET_NGS_M04_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M04_special_tt:0 "[A20.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M05:0 "An Audience with Masserschloss"
 WET_NGS_M05_desc:0 "Behind the doors of Masserschloss lie books that would feed a hundred witch hunters’ pyres. Arkhan brings fragments of older knowledge, and asks what their keepers would give to read the rest."
 WET_NGS_M05_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M05_special_tt:0 "[A68.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M06:0 "An Audience with Vorag"
 WET_NGS_M06_desc:0 "Vorag’s court has little patience for the polished promises of distant rulers. Arkhan must speak instead of strength, vengeance and a domain that no rival will dare contest."
 WET_NGS_M06_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M06_special_tt:0 "[B27.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M07:0 "An Audience with Vampire Coast"
 WET_NGS_M07_desc:0 "Along the Vampire Coast, wrecks and drowned sailors bear witness to a different kind of dominion. Arkhan comes with promises of rich spoils and sheltered harbours for the fleets of the dead."
 WET_NGS_M07_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M07_special_tt:0 "[V01.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M08:0 "An Audience with New Lahmia"
 WET_NGS_M08_desc:0 "Few secrets pass through New Lahmia without reaching its queen. Arkhan approaches her throne with the care of one who knows that every word will be weighed long after he has departed."
 WET_NGS_M08_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M08_special_tt:0 "[U18.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M09:0 "An Audience with Barrow Legion"
 WET_NGS_M09_desc:0 "The barrows whisper to those who know how to listen. Arkhan brings the promise of deeper lore to the Barrow Legion, hoping its master will hear opportunity in the gathering silence."
 WET_NGS_M09_requirements:0 "The court and its ruler are present and at peace with Nagashizzar."
 WET_NGS_M09_special_tt:0 "[A74.GetNameDef] receives an offer of the Covenant of the Black Hand."
 WET_NGS_M10:0 "The Sylvania Delegation"
 WET_NGS_M10_desc:0 "The Sylvania court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M10_requirements:0 "[A13.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M10_special_tt:0 "While the court supports the restoration: Nagashizzar gains one 50% land-doctrine discount.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M11:0 "The Sires of Mourkain Delegation"
 WET_NGS_M11_desc:0 "The Sires of Mourkain court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M11_requirements:0 "[B16.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M11_special_tt:0 "While the court supports the restoration: Nagashizzar gains Infantry Organization: §G+5%§!.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M12:0 "The Mousillon Delegation"
 WET_NGS_M12_desc:0 "The Mousillon court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M12_requirements:0 "[A20.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M12_special_tt:0 "While the court supports the restoration: Nagashizzar gains Light Cavalry attack +5%.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M13:0 "The Masserschloss Delegation"
 WET_NGS_M13_desc:0 "The Masserschloss court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M13_requirements:0 "[A68.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M13_special_tt:0 "While the court supports the restoration: Nagashizzar gains Research Speed: §G+5%§!.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M14:0 "The Vorag Delegation"
 WET_NGS_M14_desc:0 "The Vorag court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M14_requirements:0 "[B27.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M14_special_tt:0 "While the court supports the restoration: Nagashizzar gains division recovery rate +10%.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M15:0 "The Vampire Coast Delegation"
 WET_NGS_M15_desc:0 "The Vampire Coast court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M15_requirements:0 "[V01.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M15_special_tt:0 "While the court supports the restoration: Nagashizzar gains dockyard output +10%.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M16:0 "The New Lahmia Delegation"
 WET_NGS_M16_desc:0 "The New Lahmia court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M16_requirements:0 "[U18.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M16_special_tt:0 "While the court supports the restoration: Nagashizzar gains Political Power Gain +10%.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M17:0 "The Barrow Legion Delegation"
 WET_NGS_M17_desc:0 "The Barrow Legion court has a place in the work ahead. Let its ruler send servants and knowledge to aid the restoration."
 WET_NGS_M17_requirements:0 "[A74.GetNameDef] and its ruler are present and at peace with Nagashizzar.\nOne of the following must be true:\nHas an active pledge to Nagashizzar.\nIs in our faction.\nHas a Nagashi government."
 WET_NGS_M17_special_tt:0 "While the court supports the restoration: Nagashizzar gains army experience gain +10%.\nPartner gains 25 Army Experience. One award per court."
 WET_NGS_M18:0 "Three Hands upon the Seal"
 WET_NGS_M18_desc:0 "Black seals now pass between courts that once dealt only in suspicion. With their servants at his disposal, Arkhan can send his searchers far beyond the shadow of Cripple Peak."
 WET_NGS_M18_requirements:0 "At least §Y3§! active courts: named courts pledged through the audience focuses, or countries that are both Nagashi and in our faction. Each country counts once."
 WET_NGS_M19:0 "Couriers between the Crypts"
 WET_NGS_M19_desc:0 "The courts exchange reports without gathering their armies. Protect the channels that make their cooperation useful."
 WET_NGS_M20:0 "A Council of Future Mortarchs"
 WET_NGS_M20_desc:0 "Coordinate the strongest supporting courts into a permanent council for the work ahead."
 WET_NGS_M20_requirements:0 "At least §Y6§! active courts: pledged named courts or Nagashi members of our faction."
 WET_NGS_M20_special_tt:0 "Offer pledged courts a joint research exchange. Each acceptance grants both countries §G1× 50%§! Arcana research bonus. Requires six supporting courts."
 WET_NGS_Morgiana:0 "Morgiana le Fay"
 WET_NGS_N00:0 "The Throne of Nehekhara"
 WET_NGS_N00_desc:0 "Nagash claims the lands still ruled by Nehekhara’s rival kings. Prepare conquest of their remaining territory."
 WET_NGS_N00_special_tt:0 "Gain §Y180-day conquest war goals§! against eligible hostile holders of the Nehekharan homeland, including overlords whose subjects hold target lands.\n§YNehekhara§! gains §Y$wet_ngs_nagash_returned$§! for §Y365 days§!: Organization §R−25§!, Organization Recovery §R−25%§!, Division Defense §R−25%§!."
 WET_NGS_N01:0 "From Lahmia into Nehekhara"
 WET_NGS_N01_desc:0 "Lahmia is already held by Nagashizzar. Turn this southern gateway into the starting point of our campaign against the remaining tomb kingdoms."
 WET_NGS_N01_requirements:0 "Concentrate the southern campaign for §Y180§! days."
 WET_NGS_N01_special_tt:0 "Once at war with a southern campaign enemy, gain §G+15%§! Attack against those enemies for §Y180 days§!. This reward is granted once."
 WET_NGS_N02:0 "Lahmia and Lybaras"
 WET_NGS_N02_desc:0 "The eastern cities have fallen to our armies. Organise the new corridor."
 WET_NGS_N03:0 "A Bargain with the Eastern Dynasties"
 WET_NGS_N03_desc:0 "The eastern courts may accept limited dignity under a greater sovereign. Hear the surviving rulers."
 WET_NGS_N03_special_tt:0 "Offer eligible defeated eastern dynasties Puppet status. An accepting realm becomes our subject."
 WET_NGS_N04:0 "An Armada for the Mortis"
 WET_NGS_N04_desc:0 "A fleet can divide the Tomb Kings’ defence. Prepare transports and river-mouth operations."
 WET_NGS_N04_special_tt:0 "Request Military Access from the pledged Vampire Coast. Harkon may refuse."
 WET_NGS_N05:0 "The Harbours of Zandri"
 WET_NGS_N05_desc:0 "The western fleet base can support a second front. Plan its seizure."
 WET_NGS_N05_special_tt:0 "Gain a conquest war goal against the hostile owner of §Y$STATE_844$§!."
 WET_NGS_N06:0 "Turn the Royal Shipyards"
 WET_NGS_N06_desc:0 "Captured yards can sustain the new fleet. Put their remaining workshops to use."
 WET_NGS_N06_special_tt:0 "Add §G2§! §YNaval Dockyards§! in owned coastal states in the south."
 WET_NGS_N07:0 "The Charnal Valley Road"
 WET_NGS_N07_desc:0 "The inland road leads to the heart of Nehekhara. Prepare sieges against its fortified cities."
 WET_NGS_N07_special_tt:0 "Gain conquest war goals against the hostile owners of §Y$STATE_275$§! and §Y$STATE_833$§!."
 WET_NGS_N08:0 "Before the Gates of Khemri"
 WET_NGS_N08_desc:0 "The capital is the centre of the kings’ resistance. Prepare the decisive siege."
 WET_NGS_N08_special_tt:0 "Gain §G+10%§! Max Planning and a conquest war goal against the hostile owner of §Y$STATE_852$§!."
 WET_NGS_N09:0 "Reclaim the Black Pyramid"
 WET_NGS_N09_desc:0 "The Black Pyramid rises above the sands as a monument to its creator’s defiance. Its chambers will open again to the power for which they were built."
 WET_NGS_N09_requirements:0 "Own and fully control Black Pyramid §Y$STATE_838$§!."
 WET_NGS_N09_special_tt:0 "Unlock §Y$WET_NGS_N10$§! by consuming Usirian’s power."
 WET_NGS_N10:0 "The Fall of Usirian"
 WET_NGS_N10_desc:0 "The underworld operation has succeeded. Draw its captured power into Nagash."
 WET_NGS_N10_requirements:0 "Underworld operation actually succeeded."
 WET_NGS_N11:0 "An Offer to the Imperishable"
 WET_NGS_N11_desc:0 "Settra’s pride has survived the ruin of kingdoms. Nagash offers the Imperishable a place among his servants, though no messenger expects such an offer to be received meekly."
 WET_NGS_N11_requirements:0 "Khemri controlled and an southern campaign underway.\nThe audience itself waits for conquest."
 WET_NGS_N11_special_tt:0 "Offer the living Settra a Mortarch title after Nehekhara is secured. Acceptance grants a non-aggression pact and §G50 Political Power§!; Settra may refuse."
 WET_NGS_N12:0 "The Land of the Dead"
 WET_NGS_N12_desc:0 "The banners of the dead stretch across the homeland of ancient kings. From ruined temples to royal tombs, a single shadow falls over Nehekhara."
 WET_NGS_N12_requirements:0 "All fixed homeland states secured.\nAllies alone do not count."
 WET_NGS_N12_special_tt:0 ""
 WET_NGS_N13:0 "The Pyramid Awakened"
 WET_NGS_N13_desc:0 "Death magic gathers around the pyramid like storm clouds around a mountain. Its chambers must be prepared to hold the rising tide."
 WET_NGS_N13_special_tt:0 "Once the site is available, begin §Y360 days§! of construction. Completion activates the Black Pyramid and grants §Y$wet_skv_pyramid_power$§!. Losing the site cancels construction."
 WET_NGS_N14:0 "An Empire of Tombs"
 WET_NGS_N14_desc:0 "The conquered cities need an enduring administration. Organise their dead labour and surviving institutions."
 WET_NGS_N14_special_tt:0 "Add §G3§! §YCivilian Factories§! and §G3§! §YMilitary Factories§! across our owned homeland.\nFactory Output: §G+10%§!."
 WET_NGS_N15:0 "The Sovereign of Death"
 WET_NGS_N15_desc:0 "Military conquest and underworld power now sustain the same throne. Proclaim the new order."
 WET_NGS_Nagash:0 "Nagash"
 WET_NGS_P00:0 "Choose the Power behind the Rite"
 WET_NGS_P00_desc:0 "Prepare Nagash’s return with Valaya’s power, a Warpstone athanor, or a monstrous body stitched from corpses. Several routes may be prepared, but only one will be committed."
 WET_NGS_P00_requirements:0 "At least §Y7§! acquired relics and §Y3§! distinct sacrificial victims in secure Nagashi custody."
 WET_NGS_P00_special_tt:0 ""
 WET_NGS_P01:0 "The Slumber of Valaya"
 WET_NGS_P01_desc:0 "Deep beneath the holds, a goddess sleeps beyond the sight of her faithful. Arkhan follows whispers of her resting place, contemplating a sacrilege that would echo through the ages."
 WET_NGS_P01_special_tt:0 ""
 WET_NGS_P02:0 "The Warpstone Athanor"
 WET_NGS_P02_desc:0 "Green light spills from the seams of Cripple Peak. An athanor built around its warpstone could feed the rite, if its furious power can be made to obey."
 WET_NGS_P02_special_tt:0 ""
 WET_NGS_P03:0 "Harvest the Great Carcasses"
 WET_NGS_P03_desc:0 "Arkhan’s hunters drag the carcasses of great beasts into the vaults of Cripple Peak. Their massive bones and preserved organs will provide the substance of a body worthy of the Great Necromancer."
 WET_NGS_P03_special_tt:0 "Prepare the corpse-harvesting plan required by §Y$WET_NGS_P06$§!."
 WET_NGS_P04:0 "An Expedition beneath the Holds"
 WET_NGS_P04_desc:0 "The road beneath the holds winds through darkness older than the kingdoms above. Arkhan sends his servants toward the dolmen, carrying tools for a task no Dwarf would willingly permit."
 WET_NGS_P04_special_tt:0 "Explore the Dolmen immediately once we control it or its owner grants permission and military access. Request permission if access is missing. Unlock §Y$WET_NGS_P07$§!; there is no further expedition time."
 WET_NGS_P05:0 "Lead-Lined Crucibles"
 WET_NGS_P05_desc:0 "The furnace needs containment before it can hold a soul. Prepare the vessels and safety wards."
 WET_NGS_P06:0 "Stitch the Colossus"
 WET_NGS_P06_desc:0 "Beneath the mountain, dead artisans join ribs into a towering cage and draw black sutures through slabs of monstrous flesh. Every limb must bear the weight of the will that will inhabit it."
 WET_NGS_P06_special_tt:0 "Prepare the stitched framework required by §Y$WET_NGS_P09$§!."
 WET_NGS_P07:0 "Draw from the Sleeping Goddess"
 WET_NGS_P07_desc:0 "Channel the recovered conduit into the mountain’s apparatus. The sacrilege will be remembered."
 WET_NGS_P07_requirements:0 "The Dolmen has been explored. Retain control or its owner’s permission and military access. Valaya’s power has not already been consumed."
 WET_NGS_P07_special_tt:0 "Prepare Valaya’s power. If chosen for the vessel, consume her power and incur §R−100§! opinion with Dwarfen countries. Nagashizzar gains §G+10% Division Defense§! when Nagash returns."
 WET_NGS_P08:0 "A Heart of Green Fire"
 WET_NGS_P08_desc:0 "Tune the furnace to the relics’ signature. Restrain the force before the husk is exposed to it."
 WET_NGS_P08_requirements:0 "The Warpstone Crucibles are ready."
 WET_NGS_P08_special_tt:0 "Prepare the Warpstone charge. If chosen for the vessel, permanently remove §Y12 Warpstone§! from Cripple Peak. Nagashizzar gains §G+5% Factory Output§! when Nagash returns."
 WET_NGS_P09:0 "Bind the Monstrous Flesh"
 WET_NGS_P09_desc:0 "The colossus lies still beneath its chains while Arkhan inscribes the final bindings. When the rite is committed, every monster bred in the mountain’s pens will be consumed to complete Nagash’s new flesh."
 WET_NGS_P09_special_tt:0 "Make the §YStitched Body§! route available for §Y$WET_NGS_P10$§!. Choosing it permanently removes §Rall Monsters resources in Cripple Peak§! and prepares the vessel immediately. Nagashizzar gains §G+10% Division Recovery Rate§! when Nagash returns."
 WET_NGS_P10:0 "The Great Restoration Project"
 WET_NGS_P10_desc:0 "Prepare Nagash’s vessel using one completed source of power. The vessel is ready as soon as the source is committed."
 WET_NGS_P10_requirements:0 "Own and fully control Cripple Peak. Have at least one prepared, available power source."
 WET_NGS_P10_special_tt:0 "Prepare the vessel immediately using one prepared, available power source. If several sources are ready, choose one. Closes all power-source branches. Complete §Y$WET_NGS_R00$§! to perform the resurrection."
 WET_NGS_P11:0 "A Vessel Ready for Eternity"
 WET_NGS_P11_desc:0 "The vessel is ready. Assemble the relics and ritual captives for the final invocation."
 WET_NGS_P11_requirements:0 "The prepared vessel is at our owned and fully controlled Cripple Peak."
 WET_NGS_R00:0 "Nagash Returns"
 WET_NGS_R00_desc:0 "Sacrifice every living ritual captive in our custody and restore Nagash as ruler."
 WET_NGS_R00_requirements:0 "Own and fully control Cripple Peak, with the prepared vessel, at least §Y7§! acquired relics and at least §Y3§! distinct ritual captives. Every captive we hold will be sacrificed."
 WET_NGS_R00_special_tt:0 "§YNagash§! becomes ruler. Sacrifice §Revery living ritual captive§! we hold. His ruler traits grant:\nDivision Attack: §G+25%§!\nDivision Defense: §G+25%§!\nDivision Organization: §G+20%§!\nFactory Output: §G+25%§!\nPolitical Power Gain: §G+50%§!\nDaily Compliance Gain: §G+0.10§!\nResistance Target: §G−25%§!\nRecruitable Population: §G+10%§!; Master Ideology Drift: §G+0.10§!; Same-ideology Improve Relations Opinion: §G+100%§!.\nGain manpower equal to §G20%§! of the population of our owned, fully controlled states. Gain the bonus from the source used to prepare the vessel. On resurrection, every AI-controlled Nagashi country at peace and outside a faction automatically joins Nagash’s faction."
 WET_NGS_R01:0 "Muster the Dead of Skull Crags"
 WET_NGS_R01_desc:0 "The Skull Crags are already ours. Nagash gathers their arms and drills the dead for the greater campaigns ahead."

 WET_NGS_R02:0 "Arkhan at the Right Hand"
 WET_NGS_R02_desc:0 "The faithful regent yields the crown but keeps a place at the master’s side. Establish his new duties."
 WET_NGS_R02_special_tt:0 "§YArkhan§! becomes an active adviser, granting:\nResearch Speed: §G+5%§!\nPolitical Power Gain: §G+5%§!."
 WET_NGS_R03:0 "Summon the Pledged Courts"
 WET_NGS_R03_desc:0 "The master whose name sealed so many promises has returned. His messengers summon the pledged courts to stand before the throne and answer for their oaths."
 WET_NGS_R03_special_tt:0 "Send faction invitations to eligible pledged undead courts. Each court must accept."
 WET_NGS_R04:0 "Death Has a Sovereign"
 WET_NGS_R04_desc:0 "Nagash demands that the pledged courts recognise his sovereignty. His envoys offer their rulers a place within the Nagashi political order."
 WET_NGS_R04_special_tt:0 "Send a government-conversion offer to each independent, pledged undead court with at least §Y35% Nagashi support§!. Acceptance changes its ruling government to §YNagashi§! and preserves its ruler and territory. Courts may refuse.\nFaction membership is separate."
 WET_NGS_R05:0 "Legions without End"
 WET_NGS_R05_desc:0 "The workshops must supply the armies raised by the return. Give the host an enduring military establishment."
 WET_NGS_R05_special_tt:0 "Add §G2§! §YMilitary Factories§!.\nInfantry Equipment Production Cost: §G-10%§!."
 WET_NGS_R06:0 "The Mortarchs in Council"
 WET_NGS_R06_desc:0 "Around the throne gather rulers whose ambitions are almost as old as their grudges. Nagash will give their pride a purpose in the wars to come."
 WET_NGS_R06_requirements:0 "§Y3§! current roster members in Nagashi."
 WET_NGS_R08:0 "A Realm beyond Hunger"
 WET_NGS_R08_desc:0 "Settle the risen population into useful labour. The land must be capable of sustaining further campaigns."
 WET_NGS_R08_special_tt:0 "Add §G2§! §YCivilian Factories§!.\nConstruction Speed: §G+10%§!."
 WET_NGS_R09:0 "The Wars of the Great Necromancer"
 WET_NGS_R09_desc:0 "The southern kings and the Everchosen both challenge Nagash’s designs. Prepare each campaign when the realm is ready."
 WET_NGS_V01:0 "Seize Volkmar the Grim"
 WET_NGS_V01_desc:0 "Locate Volkmar the Grim and prepare an expedition to take this living source of sacred power. The target’s defenders can oppose the attempt."
 WET_NGS_V01_requirements:0 "The target is alive and present in their home country, or already held by us. Diplomatic agreements do not prevent abduction."
 WET_NGS_V01_special_tt:0 "Request a handover from Sylvania if it already holds this prisoner. Immediately send the target its abduction response event. Its response immediately resolves the attempt and sends us the result. Success chance: §Y100%§!, reduced to §Y25%§! by protection. No Political Power or equipment cost for Nagashizzar. After an unsuccessful attempt, a retry decision costs §Y100 Political Power§! and can be used once every §Y120 days§! until the ritual is complete."
