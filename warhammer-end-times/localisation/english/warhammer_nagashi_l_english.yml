 wet_ngs_nagash_returned:0 "Nagash has returned!"
 wet_ngs_nagash_returned_desc:0 "The Great Necromancer has returned to claim the throne of Nehekhara. Ancient terrors stir among the tomb legions, disrupting the commands of their kings and the rites that bind them to battle."
 WET_DIRECT_N00_nagashi_builder:0 "Gain §Y180-day conquest war goals§! against eligible hostile holders of the Nehekharan homeland, including overlords whose subjects hold target lands.\n§YNehekhara§! gains §Y$wet_ngs_nagash_returned$§! for §Y365 days§!: Organization §R−25§!, Organization Recovery §R−25%§!, Division Defense §R−25%§!."
 wet_nagashi.956.t:0 "The Usurper’s Claim"
 wet_nagashi.956.d:0 "The herald’s demand echoes through Khemri: Nagash has returned, and Nehekhara is to acknowledge its master. Beyond the palace, tomb legions falter as the Liche Priests struggle to hold their ancient bindings.\n\nSettra rises from his throne. “That carrion sorcerer has taken enough from my people. He shall have no throne here.” He orders the war banners raised and the legions mustered. Whatever dread grips the lesser kings, the Imperishable will meet the usurper as a sovereign.\n\nFor one year, Nagash has returned! causes −25 Organization, −25% Organization Recovery and −25% Division Defense."
 wet_nagashi.956.d_without_settra:0 "Nagash’s herald brings a demand older than the tombs: Nehekhara must acknowledge the Great Necromancer as its master. The priests hear his name with dread. Across the desert, captains struggle to impose their will upon faltering legions.\n\nThe court orders the war banners raised. These kingdoms were not built to become another province of Nagash’s dominion. Yet defiance alone cannot steady the ancient bindings that hold their armies together.\n\nFor one year, Nagash has returned! causes −25 Organization, −25% Organization Recovery and −25% Division Defense."
 wet_nagashi.956.a:0 "Nehekhara will not kneel."
