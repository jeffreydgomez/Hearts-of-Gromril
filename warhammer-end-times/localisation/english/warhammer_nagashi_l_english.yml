 wet_ngs_exclude_mannfred_effect:0 "Political Power: §R-50§!.\nSpend §Y60 days§! securing the rite against §YMannfred§!. He cannot betray the rite while he is denied access or held prisoner by the Nagashi."
 wet_ngs_expel_court:0 "Expel an Exposed Conspirator"
 wet_ngs_expel_court_desc:0 "Remove the covenant and, if we lead the faction, expel this exposed court. Existing treaties still require lawful cancellation; no ruler is killed."
 wet_ngs_expel_court_effect:0 "Remove the covenant and, if we lead the faction, expel this exposed court. Existing treaties still require lawful cancellation.\nNo ruler is killed."
 wet_ngs_expel_court_requirements:0 "Remove the covenant and, if we lead the faction, expel this exposed court. Existing treaties still require lawful cancellation.\nNo ruler is killed."
 wet_ngs_foreign:0 "Captives and the Black Hand"
 wet_ngs_foreign_desc:0 "Your government may protect or recover its living captives, respond to Nagashi offers, or withdraw an uncommitted covenant. Custody changes invalidate pending operations."
