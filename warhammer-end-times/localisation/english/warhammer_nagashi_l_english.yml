 WET_DIRECT_N03_nagashi_builder:0 "Offer Terms to an Eastern Dynasty."
 WET_DIRECT_N04_nagashi_builder:0 "Ask Harkon for Passage."
 WET_DIRECT_N09_nagashi_builder:0 "Enter Usirian’s realm and claim its divine power."
 WET_DIRECT_N13_nagashi_builder:0 "Begin the 360-day restoration of the Black Pyramid when the site and supplies are ready. Preparations take 360 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_P03_nagashi_builder:0 "Request a Court’s Soul Tithe."
 WET_DIRECT_P04_nagashi_builder:0 "Request Access to the Dolmen. Descend to the dolmen when passage is secured. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_P10_nagashi_builder:0 "Fund the Great Restoration research programme. Begin restoration research when Götterdämmerung is unavailable. Preparations take 180 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_R03_nagashi_builder:0 "Invite a Pledged Court into Nagashi."
 WET_DIRECT_R04_nagashi_builder:0 "Recognise Nagash’s Sovereignty."
 WET_DIRECT_V01_nagashi_builder:0 "Request Volkmar from Sylvania. Dispatch the expedition to capture Volkmar. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_V02_nagashi_builder:0 "Dispatch the expedition to capture Morgiana. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_V03_nagashi_builder:0 "Request Aliathra from Sylvania. Dispatch the expedition to capture Aliathra. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_V04_nagashi_builder:0 "Dispatch the expedition to capture Ar-Ulric. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_V05_nagashi_builder:0 "Dispatch the expedition to capture Alarielle. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_V06_nagashi_builder:0 "Dispatch the expedition to capture Mazdamundi. Preparations take 60 days. Work begins when its access and supply requirements are met."
 WET_NGS_A00:0 "Dispatch the Relic Expeditions"
 WET_NGS_A00_desc:0 "Across the world, tombs and hidden vaults hold fragments of the Great Necromancer’s power. Arkhan’s agents depart with secret instructions and empty reliquaries."
 WET_NGS_A00_requirements:0 "§Y3§! active courts.\nNo war or territory prerequisite."
 WET_NGS_A01:0 "Secrets Beyond the Veil"
 WET_NGS_A01_desc:0 "A volume of the Great Necromancer’s work lies beyond his grasp. Arkhan sends trusted servants to recover its forbidden pages and return them to the chamber beneath Cripple Peak."
 WET_NGS_A01_requirements:0 "At selection: §Y3§! / §Y4§! / §Y5§! / §Y6§!–§Y8§! active courts. Current expedition keeps its selected duration."
 WET_NGS_A01_special_tt:0 "Recover exactly one Book 1 (Secrets Beyond the Veil) for the shared ritual ledger. No random failure, foreign veto or later captivity gate.\nUpdate existing custody atomically. Research Speed: §G+1%§! permanently on first recovery.\nNo repeated bonus after theft/recovery."
