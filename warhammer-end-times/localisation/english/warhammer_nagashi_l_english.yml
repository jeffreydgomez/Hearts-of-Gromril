 wet_nagashi.900.t:0 "Mannfred Sets His Seal"
 wet_nagashi.900.d:0 "Mannfred's answer arrives on immaculate parchment. Every courtesy has been weighed, every promise measured against a throne he has not ceased to covet. He writes of the greatness of Nagash, but leaves ample room beside that greatness for the name von Carstein.\n\nSylvania accepts the Covenant of the Black Hand. Arkhan studies the signature for a moment before setting the letter among the pledges. Ambition, properly directed, can serve as faithfully as devotion."
 wet_nagashi.900.a:0 "Let his ambition serve us."
 wet_nagashi.901.t:0 "Sylvania Will Have One Master"
 wet_nagashi.901.d:0 "The envoy returns from Sylvania with the covenant unsigned. Mannfred's reply is exquisitely courteous until its final line: he has not endured death and disgrace merely to exchange an emperor's crown for a servant's collar.\n\nMannfred von Carstein refuses the Covenant of the Black Hand. Arkhan folds the letter along its careful creases. The Count has chosen to keep his ambitions to himself."
 wet_nagashi.901.a:0 "He mistakes patience for weakness."
 wet_nagashi.902.t:0 "An Unsigned Letter from Sylvania"
 wet_nagashi.902.d:0 "The papers reserved for Mannfred lie unsigned. Whatever calculations occupy Castle Drakenhof, they have produced no covenant that our envoys can confirm.\n\nThe audience with Sylvania has ended without a completed agreement. Arkhan closes its place in the ledger; no pledge from Mannfred is recorded here."
 wet_nagashi.902.a:0 "Close this audience."
 wet_nagashi.903.t:0 "Mourkain Is Remembered"
 wet_nagashi.903.d:0 "Lukas Laurencia receives the promise of recognition as something long overdue. His answer names the inheritance of Mourkain before it names the bargain itself, lingering over a vanished kingdom as though its halls still stand around him.\n\nThe Sires of Mourkain accept the Covenant of the Black Hand. Lukas has found a place for his court in Nagash's cause, and a reason to believe that the heirs of Strygos need not remain beggars at the doors of other vampires."
 wet_nagashi.903.a:0 "There is a place for Mourkain."
 wet_nagashi.904.t:0 "The Heirs of Strygos Refuse"
 wet_nagashi.904.d:0 "Lukas Laurencia sends back the covenant with its seal unbroken. Mourkain's inheritance, his messenger insists, is a birthright to reclaim, not a favour to receive from Nagashizzar. The old humiliation has made the court jealous of every scrap of dignity it possesses.\n\nThe Sires of Mourkain refuse the Covenant of the Black Hand. Recognition was offered; Lukas has chosen to seek it on his own terms."
 wet_nagashi.904.a:0 "Then let him guard his pride."
 wet_nagashi.905.t:0 "Mourkain's Seal Is Missing"
 wet_nagashi.905.d:0 "The envoys bring no binding answer from Lukas Laurencia. The space left for Mourkain's seal remains bare, despite all that was said of ancient dignity and a place beside greater powers.\n\nThe audience with the Sires of Mourkain has ended without a completed covenant."
 wet_nagashi.905.a:0 "Leave their place unfilled."
 wet_nagashi.906.t:0 "The Black Knight Gives His Word"
 wet_nagashi.906.d:0 "Mallobaude's messenger wears no bright colours. He lays the signed covenant before Arkhan and speaks of a kingdom that has denied its own claimant, of abandoned oaths, and of the strength needed to take what chivalry will never freely yield.\n\nMousillon accepts the Covenant of the Black Hand. The Black Knight has chosen an ally beyond the reach of the Lady's blessing. His word is given with one eye still fixed upon Bretonnia's crown."
 wet_nagashi.906.a:0 "A crown can draw a useful sword."
 wet_nagashi.907.t:0 "No Second Master for Mousillon"
 wet_nagashi.907.d:0 "Mallobaude returns the covenant without his mark. He has gathered the outcasts of Bretonnia beneath his own banner, the envoy reports, and will not have that banner reduced to an ornament at another sovereign's court.\n\nMousillon refuses the Covenant of the Black Hand. The Black Knight would rather face his rivals with an uncertain future than accept a place someone else has prepared for him."
 wet_nagashi.907.a:0 "He will keep his lonely banner."
 wet_nagashi.908.t:0 "The Black Knight's Oath Is Unspoken"
 wet_nagashi.908.d:0 "No sworn answer accompanies the envoy returning from Mousillon. The covenant prepared for Mallobaude remains unsigned; the Black Knight's quarrels have yielded no binding commitment to Nagashizzar.\n\nThe audience has ended without a completed agreement."
 wet_nagashi.908.a:0 "An oath ungiven binds no one."
 wet_nagashi.909.t:0 "A Door Opens at Masserschloss"
 wet_nagashi.909.d:0 "Bragthorn's answer is crowded into the margins of the covenant. Where another ruler might demand honours, the necromancer asks after sealed volumes, lost formulae and the contents of libraries whose names respectable scholars will not speak. Beneath the questions lies his unmistakable signature.\n\nMasserschloss accepts the Covenant of the Black Hand. The promise of forbidden learning has opened a door that threats might only have barred more tightly."
 wet_nagashi.909.a:0 "Knowledge has found its price."
 wet_nagashi.910.t:0 "Masserschloss Keeps Its Secrets"
 wet_nagashi.910.d:0 "The messenger from Masserschloss brings no counterproposal. Bragthorn has returned the covenant with a single sentence scrawled across the place reserved for his signature: his work requires patrons neither living nor dead.\n\nBragthorn the Necromancer refuses the Covenant of the Black Hand. The shutters of his stronghold remain closed, and whatever he studies behind them will remain his own concern for now."
 wet_nagashi.910.a:0 "Every locked door has its hour."
 wet_nagashi.911.t:0 "Silence behind the Shutters"
 wet_nagashi.911.d:0 "No signed covenant emerges from Masserschloss. The papers sent to Bragthorn have disappeared into the silence of his court, and our envoys cannot confirm a completed agreement.\n\nArkhan has the unfinished audience struck from the day's business. The door remains closed."
 wet_nagashi.911.a:0 "Attend to those who answer."
 wet_nagashi.912.t:0 "The Ghoul King's Mark"
 wet_nagashi.912.d:0 "Vorag's answer bears little resemblance to a courtly letter. The parchment is torn, the seal crushed, and the messenger speaks with the wary precision of one who has stood too near a hungry king. Yet the meaning is plain: the domain of Bloodytooth will be respected, and his strength will serve the covenant.\n\nVorag accepts the Covenant of the Black Hand. Beneath the hunger survives a sovereign who has not forgotten what it means to be acknowledged."
 wet_nagashi.912.a:0 "Even hunger remembers a kingdom."
 wet_nagashi.913.t:0 "Bloodytooth Will Not Be Bound"
 wet_nagashi.913.d:0 "The covenant returns from Vorag in strips. His messenger has preserved enough of it to make the answer unmistakable: Bloodytooth will hold his own domain, and no promise from Nagashizzar will purchase the right to command him.\n\nThe ghoul king refuses the Covenant of the Black Hand. Arkhan has the torn parchment removed from the table before the next audience begins."
 wet_nagashi.913.a:0 "He has made himself understood."
 wet_nagashi.914.t:0 "No Mark from Bloodytooth"
 wet_nagashi.914.d:0 "The space reserved for Vorag's mark remains empty. Our envoys can confirm neither a signed covenant nor an oath binding the ghoul king to Nagashizzar.\n\nThe audience with Vorag has ended without a completed agreement. Whatever the hunger of his court may demand next, it has given us no pledge today."
 wet_nagashi.914.a:0 "Set the unfinished covenant aside."
 wet_nagashi.915.t:0 "Terms from a Drowned Throne"
 wet_nagashi.915.d:0 "Harkon's reply arrives salt-stained and covered in corrections. One passage demands a king's share of the spoils; another disputes the first in the same hand. A third declares that the whole affair was his idea from the beginning. All three, remarkably, agree to sign.\n\nThe Vampire Coast accepts the Covenant of the Black Hand. Arkhan places the damp pages well away from his other correspondence. Luthor Harkon has found the promise of spoils and sheltered harbours agreeable, at least to the voices that answered."
 wet_nagashi.915.a:0 "For once, his voices agree."
 wet_nagashi.916.t:0 "Harkon Returns the Terms"
 wet_nagashi.916.d:0 "A dead sailor deposits Harkon's answer upon the table, along with a quantity of seawater. The letter disputes the proposed bargain, its own corrections, and finally the authority of anyone who might imagine the Vampire Coast taking orders from a mountain.\n\nLuthor Harkon refuses the Covenant of the Black Hand. Amid the contradictions, that much is clear. The drowned throne will keep its own counsel."
 wet_nagashi.916.a:0 "A clear refusal, by his standards."
 wet_nagashi.917.t:0 "The Coast Sends No Covenant"
 wet_nagashi.917.d:0 "Rumours and scraps of correspondence reach Nagashizzar from the Vampire Coast, but none amounts to a confirmed covenant with Luthor Harkon. Whatever is being argued upon that drowned throne, our envoys have brought back no binding answer.\n\nThe audience has ended without a completed agreement."
 wet_nagashi.917.a:0 "Do not mistake noise for an oath."
 wet_nagashi.918.t:0 "Silk and Black Wax"
 wet_nagashi.918.d:0 "Neferata's reply is flawless. A gracious word for Arkhan, a measured acknowledgement of Nagash, and a signature placed precisely where it must be. Nothing in the letter admits uncertainty; nothing reveals how much the Queen of Mysteries already knew before the offer reached her.\n\nNew Lahmia accepts the Covenant of the Black Hand. Arkhan turns the seal once between his fingers. A promise from Neferata is valuable, and worth reading more than once."
 wet_nagashi.918.a:0 "Let every word be remembered."
 wet_nagashi.919.t:0 "The Queen's Courteous Refusal"
 wet_nagashi.919.d:0 "Neferata returns a letter so gracious that its refusal almost seems an invitation to thank her. She honours the antiquity of Nagash's claim, praises Arkhan's constancy, and concedes nothing at all. New Lahmia's future, she writes, is already in capable hands.\n\nThe Queen of Mysteries refuses the Covenant of the Black Hand. The envoy has been treated impeccably; the covenant remains unsigned."
 wet_nagashi.919.a:0 "Courtesy conceals no pledge."
 wet_nagashi.920.t:0 "An Empty Place for the Queen's Seal"
 wet_nagashi.920.d:0 "The correspondence prepared for Neferata remains incomplete. Courtesies have crossed the distance to New Lahmia, but no binding covenant can be confirmed. The Queen of Mysteries has left no seal that Arkhan may enter among the pledges.\n\nThe audience has ended without a completed agreement."
 wet_nagashi.920.a:0 "Record only what is sworn."
 wet_nagashi.921.t:0 "The Lichemaster's Signature"
 wet_nagashi.921.d:0 "Grave-dust spills from the fold of Kemmler's letter. The Lichemaster writes eagerly of old barrows and older secrets, his cramped hand growing less steady wherever the promised lore is mentioned. At the foot of the parchment, beneath a final question, he has signed.\n\nThe Barrow Legion accepts the Covenant of the Black Hand. Heinrich Kemmler has judged that there is more to unearth beside Nagash's servants than beyond their reach."
 wet_nagashi.921.a:0 "His hunger for lore will serve."
 wet_nagashi.922.t:0 "The Barrows Answer to Kemmler"
 wet_nagashi.922.d:0 "Kemmler's reply smells of damp earth. He has read the promise of shared lore and found the oath beneath it less enticing. The dead in his barrows already know their master's voice, he writes, and he has no intention of teaching them another.\n\nHeinrich Kemmler refuses the Covenant of the Black Hand. For now, the Lichemaster prefers the secrets he can steal to those offered at the price of allegiance."
 wet_nagashi.922.a:0 "The dead have heard greater voices."
 wet_nagashi.923.t:0 "The Lichemaster's Unfinished Bargain"
 wet_nagashi.923.d:0 "No completed covenant with Heinrich Kemmler reaches the table. The place reserved for the Lichemaster's signature remains bare, and our envoys cannot confirm an oath from the Barrow Legion.\n\nThe audience has ended without an agreement. Arkhan closes the correspondence; the secrets promised in return for that pledge remain unshared."
 wet_nagashi.923.a:0 "Close the book on this audience."
 wet_nagashi.930.t:0 "The Black Hand Moves: Volkmar the Grim"
 wet_nagashi.930.d:0 "The Grand Theogonist’s route has been traced. Arkhan’s agents wait beyond the reach of his temple guards.\n\nThe target’s government has received the warning. Its response resolves this attempt immediately; there is no further expedition or equipment cost. Capture is certain unless protection reduces the chance to 25%. A report will follow as soon as the attempt is resolved."
 wet_nagashi.930.a:0 "Await the report."
 wet_nagashi.931.t:0 "Volkmar the Grim in Our Custody"
 wet_nagashi.931.d:0 "Volkmar the Grim is held alive within the wards of Nagashizzar. Arkhan has entered the prisoner’s name among the living offerings for his master’s return.\n\nThis captive counts toward the resurrection while alive and securely held. The first-capture bonus is granted only once. The captive remains bound until the final ritual."
 wet_nagashi.931.a:0 "Prepare the wards."
 wet_nagashi.932.t:0 "The Black Hand Returns Empty-Handed"
 wet_nagashi.932.d:0 "The Black Hand has returned without Volkmar the Grim. The intended offering remains beyond Arkhan’s grasp, and the ritual ledgers record no new captive.\n\nA new attempt is available through a decision costing 100 Political Power, once every 120 days. No equipment is required."
 wet_nagashi.932.a:0 "The search will continue."
 wet_nagashi.933.t:0 "The Plot Cannot Be Completed"
 wet_nagashi.933.d:0 "The report concerning Volkmar the Grim brings no prisoner to Cripple Peak. The target’s circumstances have changed, or there is no secure capital prison in which to hold them.\n\nNo capture has been recorded. When the target and a secure prison are available, a retry decision costs 100 Political Power and can be used once every 120 days. No equipment is required."
 wet_nagashi.933.a:0 "Await another opportunity."
 wet_nagashi.954.t:0 "A Prisoner in Mannfred’s Keeping"
 wet_nagashi.954.d:0 "Sylvania already holds Volkmar the Grim. Arkhan’s envoy has gone directly to Mannfred to demand the living prisoner for the Great Rite.\n\nMannfred has received the handover request. His answer will be reported immediately. Acceptance transfers the existing prisoner to Nagashizzar without a second capture or any payment from us."
 wet_nagashi.954.a:0 "Await Mannfred’s answer."
 wet_nagashi.934.t:0 "The Black Hand Moves: Morgiana le Fay"
 wet_nagashi.934.d:0 "The Fay Enchantress travels behind prayers and ancient wards. The Black Hand has found a moment when those protections may be tested.\n\nThe target’s government has received the warning. Its response resolves this attempt immediately; there is no further expedition or equipment cost. Capture is certain unless protection reduces the chance to 25%. A report will follow as soon as the attempt is resolved."
 wet_nagashi.934.a:0 "Await the report."
