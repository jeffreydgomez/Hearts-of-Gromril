 wet_nagashi.949.t:0 "The Plot Cannot Be Completed"
 wet_nagashi.949.d:0 "The report concerning Alarielle the Radiant brings no prisoner to Cripple Peak. The target’s circumstances have changed, or there is no secure capital prison in which to hold them.\n\nNo capture has been recorded. When the target and a secure prison are available, a retry decision costs 100 Political Power and can be used once every 120 days. No equipment is required."
 wet_nagashi.949.a:0 "Await another opportunity."
 wet_nagashi.950.t:0 "The Black Hand Moves: Lord Kroak"
 wet_nagashi.950.d:0 "The temple guards watch every approach to their ancient master. The Black Hand has found its opening among the processions serving Lord Kroak.\n\nThe target’s government has received the warning. Its response resolves this attempt immediately; there is no further expedition or equipment cost. Capture is certain unless protection reduces the chance to 25%. A report will follow as soon as the attempt is resolved."
 wet_nagashi.950.a:0 "Await the report."
 wet_nagashi.951.t:0 "Lord Kroak in Our Custody"
 wet_nagashi.951.d:0 "Lord Kroak’s sacred wrappings rest within Arkhan’s wards. The Deliverer’s spirit strains against the bindings, an ancient power intended for Nagash’s return.\n\nHis bound spirit counts as one ritual captive. The first theft grants +5% Special Project research speed once. The final ritual consumes his spirit."
 wet_nagashi.951.a:0 "Prepare the wards."
 wet_nagashi.952.t:0 "The Black Hand Returns Empty-Handed"
 wet_nagashi.952.d:0 "The Black Hand has returned without Lord Kroak. The intended offering remains beyond Arkhan’s grasp, and the ritual ledgers record no new captive.\n\nA new attempt is available through a decision costing 100 Political Power, once every 120 days. No equipment is required."
 wet_nagashi.952.a:0 "The search will continue."
