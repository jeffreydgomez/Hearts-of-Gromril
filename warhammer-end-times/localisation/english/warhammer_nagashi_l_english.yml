 WET_NGS_V06:0 "Steal Lord Kroak"
 WET_NGS_V06_desc:0 "Death has not silenced the Deliverer. Within his sacred wrappings, Lord Kroak’s spirit still commands ancient power. The Black Hand will steal his preserved remains and bind that power to the Great Rite."
 WET_NGS_V06_requirements:0 "Lord Kroak’s remains are present in Hexoatl or already in our custody, and his spirit has not been consumed by the rite."
 WET_NGS_V06_special_tt:0 "Immediately send the target its abduction response event. Its response immediately resolves the attempt and sends us the result. Success chance: §Y100%§!, reduced to §Y25%§! by protection. No Political Power or equipment cost for Nagashizzar. After an unsuccessful attempt, a retry decision costs §Y100 Political Power§! and can be used once every §Y120 days§! until the ritual is complete. Kroak’s bound spirit counts as one ritual captive."
