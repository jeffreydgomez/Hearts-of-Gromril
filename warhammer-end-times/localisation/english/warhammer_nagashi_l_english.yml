 wet_nagashi.938.t:0 "The Black Hand Moves: Aliathra"
 wet_nagashi.938.d:0 "The Everchild’s sacred blood is a prize beyond gold. Arkhan’s agents have followed the quiet paths around her attendants.\n\nThe target’s government has received the warning. Its response resolves this attempt immediately; there is no further expedition or equipment cost. Capture is certain unless protection reduces the chance to 25%. A report will follow as soon as the attempt is resolved."
 wet_nagashi.938.a:0 "Await the report."
 wet_nagashi.939.t:0 "Aliathra in Our Custody"
 wet_nagashi.939.d:0 "Aliathra is held within the wards of Nagashizzar. Arkhan has entered the Everchild’s name among the offerings for his master’s return.\n\nShe counts as one ritual captive. Ulthuan can still recover her through its Everchild focus branch. If she is freed, Nagashizzar receives a report and she no longer counts toward the rite."
 wet_nagashi.939.a:0 "Prepare the wards."
