 WET_DIRECT_I16_naggaroth_builder:0 "Ratify the accepted island constitution. Costs 75 Political Power."
 WET_DIRECT_L04_naggaroth_builder:0 "Send named bilateral pact offers; 25 PP on acceptance, no automatic Everchosen membership."
 WET_DIRECT_L08_naggaroth_builder:0 "Perform the Martial Rite: +10% Division Attack for 90 days. Costs 50 Political Power."
 WET_DIRECT_P01_naggaroth_builder:0 "Investigate the Pleasure cults. Preparations take 60 days and cost 25 Political Power. Work begins when its access and supply requirements are met."
 WET_DIRECT_P04_naggaroth_builder:0 "Secure the Queen Mother if she remains within our jurisdiction. Preparations take 60 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
