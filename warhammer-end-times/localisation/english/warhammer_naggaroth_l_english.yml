 wet_naggaroth.110.0:0 "Decline the request."
 wet_naggaroth.110.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.110.1:0 "Accept the terms."
 wet_naggaroth.110.1_effect:0 "Recognise the current border and gain §Y25§! mutual opinion. This makes no territorial transfer and does not compel a faction or war."
 wet_naggaroth.110.d:0 "Envoys have come to discuss the frontier around Arnheim. Neither court has forgotten the past, but both may find use in a border that need not be defended every morning."
 wet_naggaroth.110.t:0 "A Border Accord with Arnheim"
 wet_naggaroth.111.0:0 "Decline the request."
 wet_naggaroth.111.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.111.1:0 "Accept the terms."
 wet_naggaroth.111.1_effect:0 "After peace, accept direct puppet status under Naggaroth. Your existing territory and ruler remain; no allied territory is transferred. The alternative is to refuse."
 wet_naggaroth.111.d:0 "The fighting has ended, and the victors’ envoys have arrived with terms. Our rulers must decide what can still be preserved beneath the shadow of defeat."
 wet_naggaroth.111.t:0 "Terms for the Defeated"
 wet_naggaroth.112.0:0 "Decline the request."
 wet_naggaroth.112.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.112.1:0 "Accept the terms."
 wet_naggaroth.112.1_effect:0 "Pay §Y25§! Political Power on acceptance for a bilateral non-aggression pact. No submission, faction membership or shared war follows."
 wet_naggaroth.112.d:0 "The invitation promises pleasure, power and freedom from the limits imposed by lesser souls. Its perfume lingers long after the messenger has gone, troubling even those who refuse to read it twice."
 wet_naggaroth.112.t:0 "A Pact with the Dark Prince"
 wet_naggaroth.113.0:0 "Decline the request."
 wet_naggaroth.113.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.113.1:0 "Accept the terms."
 wet_naggaroth.113.1_effect:0 "Begin diplomatic talks with Naggaroth. This is neither a treaty nor faction membership; either government can refuse later terms."
 wet_naggaroth.113.1_outcome:0 "Begins diplomatic talks with Naggaroth."
 wet_naggaroth.113.d:0 "The ships have carried our envoys across a sea crowded with bitter memories. At the far shore, another court must decide whether to hear them or send them home in disgrace."
 wet_naggaroth.113.t:0 "Envoys Across the Sea"
 wet_naggaroth.114.0:0 "Decline the request."
 wet_naggaroth.114.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.114.1:0 "Accept the terms."
 wet_naggaroth.114.1_effect:0 "Consent to a bilateral non-aggression pact, protection of our current faction and subjects, mutual military access and further voluntary cooperation. This imports no war or faction membership. Naggaroth must still ratify."
 wet_naggaroth.114.1_outcome:0 "Approves a pact and mutual military access with Naggaroth."
 wet_naggaroth.114.d:0 "Naggaroth proposes a compact with the Asur. The parchment cannot erase the wars between their peoples, but it may keep the next war from beginning between them."
 wet_naggaroth.114.t:0 "Terms for an Asur Compact"
 wet_naggaroth.115.0:0 "Decline the request."
 wet_naggaroth.115.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.115.1:0 "Accept the terms."
 wet_naggaroth.115.1_effect:0 "Accept the return of captives and share industrial studies. Naggaroth pays §Y75§! Political Power and loses §Y5§! stability points on acceptance; the agreement adds §Y25§! trust and one industry research bonus without changing population."
 wet_naggaroth.115.d:0 "The captives have become the subject of a new exchange between the courts. Their release could speak more plainly than the carefully guarded assurances of the envoys."
 wet_naggaroth.115.t:0 "Return the Captives"
 wet_naggaroth.116.0:0 "Decline the request."
 wet_naggaroth.116.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.116.1:0 "Accept the terms."
 wet_naggaroth.116.1_effect:0 "Accept protection under the Asur compact. Naggaroth renounces this programme’s war goals and scripted aggression against us while the compact holds. No territory or war is transferred."
 wet_naggaroth.116.1_outcome:0 "Receives protection under the Asur Compact."
 wet_naggaroth.116.d:0 "The western lords have been presented with a charter defining their place beside Naggaroth. Pride, opportunity and fear pull their councils in different directions."
 wet_naggaroth.116.t:0 "The Western Charter"
 wet_naggaroth.117.0:0 "Decline the request."
 wet_naggaroth.117.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.117.1:0 "Accept the terms."
 wet_naggaroth.117.1_effect:0 "Accept delivery of §Y500§! existing infantry equipment from Naggaroth. The sender must still possess the stock and a usable route; no equipment is created. Deliveries share a §Y90§!-day cooldown."
 wet_naggaroth.117.d:0 "A shipment of arms is ready for the ocean crossing. The weapons will reach another people’s soldiers, a practical test of a friendship still new enough to be doubted."
 wet_naggaroth.117.t:0 "Arms Across the Ocean"
 wet_naggaroth.118.0:0 "Decline the request."
 wet_naggaroth.118.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.118.1:0 "Accept the terms."
 wet_naggaroth.118.1_effect:0 "Accept delivery of §Y500§! existing infantry equipment from Naggaroth. The sender must still possess the stock and a usable route; no equipment is created. Deliveries share a §Y90§!-day cooldown."
 wet_naggaroth.118.d:0 "Ulthuan has need of soldiers, supplies and time. An offer from across the sea may help preserve the island, if its rulers will accept the hands extended toward them."
 wet_naggaroth.118.t:0 "Relief for Ulthuan"
 wet_naggaroth.119.0:0 "Decline the request."
 wet_naggaroth.119.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.119.1:0 "Accept the terms."
 wet_naggaroth.119.1_effect:0 "Accept delivery of §Y20§! existing convoys from Naggaroth. The sender must still possess the stock and a usable route; no equipment is created. Deliveries share a §Y90§!-day cooldown."
 wet_naggaroth.119.d:0 "Ulthuan has need of soldiers, supplies and time. An offer from across the sea may help preserve the island, if its rulers will accept the hands extended toward them."
 wet_naggaroth.119.t:0 "Relief for Ulthuan"
 wet_naggaroth.120.0:0 "Decline the request."
 wet_naggaroth.120.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.120.1:0 "Accept the terms."
 wet_naggaroth.120.1_effect:0 "Admit Naggaroth to the faction with normal membership obligations. This request cannot create a faction, bypass cultural membership or lower Order’s tension threshold."
 wet_naggaroth.120.d:0 "Naggaroth has asked to enter our alliance. The court must decide whether the strength of the Druchii outweighs the old fears their banners awaken."
 wet_naggaroth.120.t:0 "Naggaroth Seeks Admission"
 wet_naggaroth.121.0:0 "Decline the request."
 wet_naggaroth.121.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.121.1:0 "Accept the terms."
 wet_naggaroth.121.1_effect:0 "Recognise a joint Elven council of two sovereign crowns. Ulthuan retains its current ruler, territory and government. Neither war participation nor faction membership changes. Both governments must ratify; the alternate settlement becomes unavailable only after ratification."
 wet_naggaroth.121.1_outcome:0 "Approves a joint council of the two Elven crowns."
 wet_naggaroth.121.d:0 "The two courts have found themselves facing the same war. Their envoys now ask whether separate campaigns should give way to a common purpose."
 wet_naggaroth.121.t:0 "Two Thrones, One War"
 wet_naggaroth.122.0:0 "Decline the request."
 wet_naggaroth.122.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.122.1:0 "Accept the terms."
 wet_naggaroth.122.1_effect:0 "Recognise Malekith’s shared ceremonial kingship under a bilateral constitution. Ulthuan retains its current ruler, territory and government. Neither war participation nor faction membership changes. Both governments must ratify; the alternate settlement becomes unavailable only after ratification."
 wet_naggaroth.122.1_outcome:0 "Recognises Malekith’s shared ceremonial kingship."
 wet_naggaroth.122.d:0 "The gathered rulers are asked to recognise a king whose claim cannot rest upon conquest alone. Their answer will determine whether ceremony becomes allegiance or another bitter memory."
 wet_naggaroth.122.t:0 "A King by Consent"
