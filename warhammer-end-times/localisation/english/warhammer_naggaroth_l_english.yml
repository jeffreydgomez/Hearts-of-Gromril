 wet_nag_request_asur_terms_H06:0 "Request Terms for an Asur Compact — Ulthuan"
 wet_nag_request_asur_terms_H06_desc:0 "Consent to a bilateral non-aggression pact, protection of our current faction and subjects, mutual military access and further voluntary cooperation. This imports no war or faction membership. Naggaroth must still ratify."
