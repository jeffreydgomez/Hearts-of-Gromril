 WET_DIRECT_W15_naggaroth_builder:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_DIRECT_W16_naggaroth_builder:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_A01:0 "Stay the Corsairs"
 WET_NAG_A01_desc:0 "The Asur will judge a change of policy by the conduct of ships they can see. Restraining the corsairs is a costly first act that words across a negotiating table cannot replace."
 WET_NAG_A01_special_tt:0 "Pay 25 PP; +35 opinion with Ulthuan; revoke only this tree’s unused Asur war goals."
 WET_NAG_A02:0 "Envoys Across the Sea"
 WET_NAG_A02_desc:0 "Envoys must cross a sea burdened with centuries of hostility. Their first task is to obtain a hearing, not to announce an alliance that nobody has accepted."
 WET_NAG_A02_special_tt:0 "Open a 30-day diplomatic reply; acceptance begins talks, not faction membership."
 WET_NAG_A03:0 "No Shadow at the Council"
 WET_NAG_A03_desc:0 "No Asur council will trust promises made beneath a Slaaneshi patron’s shadow. A clean court and accepted preliminary talks will give formal security terms a chance to be heard."
 WET_NAG_A03_requirements:0 "Non-Chaos government; no cult patronage, Chaos faction or unresolved Morathi office."
 WET_NAG_A03_special_tt:0 "Enable a formal security treaty; +25 PP."
 WET_NAG_A04:0 "Ratify the Asur Compact"
 WET_NAG_A04_desc:0 "A compact must bind both governments to terms each has actually accepted. Ratification will establish protection and access while leaving faction membership and participation in war to separate decisions."
 WET_NAG_A04_requirements:0 "[H06.GetNameDef] accepted; both sides at peace with each other and legal relations still hold."
 WET_NAG_A04_special_tt:0 "On actual consent: bilateral pact, +50 mutual opinion, joint-defence negotiations. No automatic war import."
 WET_NAG_A05:0 "Return the Captives"
 WET_NAG_A05_desc:0 "The return of captives will anger those who profited from their detention. If Ulthuan accepts the exchange, that sacrifice can purchase trust and knowledge that no raid could secure."
 WET_NAG_A05_special_tt:0 "Pay 75 PP and 5 stability points; +25 trust; one 50% industry research bonus from accepted exchange. No invented population transfer."
 WET_NAG_A06:0 "Guard the Shared Seas"
 WET_NAG_A06_desc:0 "Both peoples depend upon sea routes that Chaos can threaten without taking a single throne. Coordinated escorts will make the compact useful to the fleets that must defend those routes."
 WET_NAG_A07:0 "A Charter of Western Restraint"
 WET_NAG_A07_desc:0 "Reconciliation has little value if Naggaroth continues to threaten every Asur friend in the west. Named partners may accept a charter that protects their independence without redrawing the map."
 WET_NAG_A07_special_tt:0 "Pay 50 PP; protect consenting Arnheim and Hexoatl, and later named signatories, from this tree’s war goals. No territory transfer."
 WET_NAG_A08:0 "A Council of Elven Generals"
 WET_NAG_A08_desc:0 "Elven commanders possess much to teach one another and little habit of doing so willingly. A common council will turn accepted cooperation into plans that both armies can understand."
 WET_NAG_A09:0 "Arms Across the Ocean"
 WET_NAG_A09_desc:0 "An alliance of speeches cannot replace weapons in the hands of its soldiers. Naggaroth will expand its own capacity and permit voluntary shipments drawn from stores that really exist."
 WET_NAG_A09_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_NAG_A10:0 "Hold the Northern Approaches"
 WET_NAG_A10_desc:0 "The northern approaches remain our responsibility even when a compact is signed across the sea. Defensive preparations will ensure that cooperation rests upon a kingdom able to hold its own frontier."
 WET_NAG_A11:0 "Relief for Ulthuan"
 WET_NAG_A11_desc:0 "Ulthuan’s struggle against a current Chaos enemy may require supplies before it requires another declaration. Accepted relief will cross the ocean only when the equipment and the route are available."
 WET_NAG_A11_requirements:0 "Recipient fighting a current Chaos aggressor; real stocks and transport route."
 WET_NAG_A11_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_NAG_A12:0 "Seek the Wider Alliance"
 WET_NAG_A12_desc:0 "The wider alliance has its own leader and its own obligations. Naggaroth must apply under those rules rather than treating an Elven compact as an invitation issued on another ruler’s behalf."
 WET_NAG_A12_requirements:0 "Actual leader consent and membership law; [H12.GetNameDef] remains Evil unless separately changed."
 WET_NAG_A12_special_tt:0 "Send a lawful faction-admission request; no new faction or threshold exception."
 WET_NAG_A13:0 "An Elven War Command"
 WET_NAG_A13_desc:0 "Shared membership is no substitute for fighting the same enemy. A joint command will become effective when both realms are committed to a real war against Chaos and can grant the access their armies need."
 WET_NAG_A13_requirements:0 "Both [H12.GetNameDef] and [H06.GetNameDef] actually fighting the same Chaos opponent; access granted where needed."
 WET_NAG_A14:0 "Two Thrones, One War"
 WET_NAG_A14_desc:0 "The common struggle need not decide which crown deserves to swallow the other. An accepted council of two sovereign thrones will preserve both governments while acknowledging their shared purpose."
 WET_NAG_A14_requirements:0 "Accepted sovereign-council terms; no existing incompatible shared settlement."
 WET_NAG_A14_special_tt:0 "Recognise a joint Elven council of two sovereign crowns. Ulthuan retains its current ruler, territory and government. Neither war participation nor faction membership changes. Both governments must ratify; the alternate settlement becomes unavailable only after ratification. Mutual recognition; +5 stability points; independent governments remain."
 WET_NAG_A15:0 "A King by Consent"
 WET_NAG_A15_desc:0 "A crown accepted by agreement would carry a legitimacy that conquest alone cannot provide. Ulthuan must explicitly approve the constitution before Malekith’s shared ceremonial kingship can be ratified."
 WET_NAG_A15_requirements:0 "Malekith is alive and Ulthuan has accepted the proposed settlement."
 WET_NAG_A15_special_tt:0 "Recognise Malekith’s shared ceremonial kingship under a bilateral constitution. Ulthuan retains its current ruler, territory and government. Neither war participation nor faction membership changes. Both governments must ratify; the alternate settlement becomes unavailable only after ratification. On accepted constitution: 75 PP and joint legitimacy. No annexation or automatic replacement of Finubar."
 WET_NAG_A16:0 "The Elves Will Face the Darkness"
 WET_NAG_A16_desc:0 "The compact must be measured against a defence that actually happened. Recovered homeland or sustained joint resistance will prove that the Elves have done more than promise to face the darkness together."
 WET_NAG_A16_requirements:0 "Completed real joint-defence milestone; no required continental conquest, Grand Alliance membership or Vortex catastrophe."
 WET_NAG_C00:0 "The Court Beneath the Black Spire"
 WET_NAG_C00_desc:0 "Every house at Naggarond professes loyalty, and every house keeps its own secrets. Before the Witch King turns his gaze across the sea, he must learn whose hands are moving beneath his throne."
 WET_NAG_C01:0 "Follow the Perfumed Trail"
 WET_NAG_C01_desc:0 "The same rare perfumes linger in noble halls, secluded shrines and the chambers of missing servants. Following those traces will reveal whether the pleasure circles are merely indulgent or answer to another sovereign."
 WET_NAG_C02:0 "Root Out the Cult of Pleasure"
 WET_NAG_C02_desc:0 "The Dark Prince promises freedom while binding every desire to his will. The Black Guard will tear out his worship before Naggaroth becomes another province of a stranger’s empire."
 WET_NAG_C03:0 "Welcome the Forbidden Court"
 WET_NAG_C03_desc:0 "The hidden congregations possess wealth and knowledge that the crown has never fully commanded. We shall bring their patrons into the light of the royal court and make their appetites serve our ambitions."
 WET_NAG_C03_special_tt:0 "+10 Chaos support points, taken from Evil; Cult Patronage: research speed +5%, stability -5 points."
 WET_NAG_I01:0 "Sound the Asur Coasts"
 WET_NAG_I01_desc:0 "An invasion begins with knowledge of the coast, not the first ship leaving harbour. Soundings and reconnaissance will identify where the eastern host can hope to land and remain supplied."
 WET_NAG_I02:0 "Transports for the Eastern Host"
 WET_NAG_I02_desc:0 "Warships alone cannot carry an army and all that keeps it alive. The yards will prepare transports for a crossing whose strength must come from real construction."
 WET_NAG_I02_special_tt:0 "Convoy production cost -10%; one dockyard credit. No free fleet."
 WET_NAG_I03:0 "Agents Among the Dispossessed"
 WET_NAG_I03_desc:0 "The dispossessed of Ulthuan possess grievances that may open doors closed to foreign armies. Our agents will seek willing contacts without assuming that any kingdom has already chosen rebellion."
 WET_NAG_I04:0 "Muster the Invasion Host"
 WET_NAG_I04_desc:0 "The host that crosses the sea must be drilled for a campaign fought far from familiar roads. Officers will train its leading formations for the difficult passage from crowded transports to a hostile shore."
 WET_NAG_I05:0 "Press the Phoenix Claim"
 WET_NAG_I05_desc:0 "The Phoenix claim has endured for centuries without becoming possession. A prepared fleet will now give the crown the means to press it against the island’s current defenders."
 WET_NAG_I05_requirements:0 "Owned departure port, eight combat ships, §Y40§! convoys; no pact, truce, own faction or subject."
 WET_NAG_I05_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_I06:0 "A Foothold on Ulthuan"
 WET_NAG_I06_desc:0 "A foothold exists only when troops hold a working harbour on the far shore. Once that landing is real, repair crews can help turn a precarious beachhead into a base for the host."
 WET_NAG_I06_requirements:0 "Control one of the fixed Ulthuan coastal states and its port; no automatic landing."
 WET_NAG_I06_special_tt:0 "25 Army XP; local repair speed +10% for 120 days."
 WET_NAG_I07:0 "Force the Inner Approaches"
 WET_NAG_I07_desc:0 "The inner approaches cannot be forced by momentum alone. Engineers and assault troops will prepare to break the fortified positions that stand between the landing and the heart of Ulthuan."
 WET_NAG_I08:0 "Hold the Western Harbours"
 WET_NAG_I08_desc:0 "Western harbours offer a second line of supply when the first anchorage is threatened. Their permanent improvement must wait until possession becomes lawful ownership."
 WET_NAG_I08_requirements:0 "Control §Y1064§! or §Y11§! and a usable port."
 WET_NAG_I08_special_tt:0 "One naval-base level in an owned Tiranoc/Anroc objective, or held credit until peace."
 WET_NAG_I09:0 "Reclaim the Northern Shore"
 WET_NAG_I09_desc:0 "Anlec and the Shadowmarch carry a memory older than the present campaign. Their recovery will strengthen the host without compelling it to awaken every legend buried beneath the northern shore."
 WET_NAG_I10:0 "Lothern Under the Black Banner"
 WET_NAG_I10_desc:0 "The black banner above Lothern is evidence of occupation, not universal acceptance. The crown will record the victory while its armies continue the work required to hold the island."
 WET_NAG_I11:0 "Break the Island Resistance"
 WET_NAG_I11_desc:0 "Resistance across the island cannot be broken by the fall of one city. A settlement becomes credible only when the host has secured a substantial share of Ulthuan and the opposing government can no longer ignore the result."
 WET_NAG_I11_requirements:0 "At least §Y70%§! of the §Y31§! fixed Ulthuan states controlled; opposing [H06.GetNameDef] government capitulated or agrees terms."
 WET_NAG_I11_special_tt:0 "Unlock occupation settlement and reconstruction."
 WET_NAG_I12:0 "Offer Terms to the Defeated"
 WET_NAG_I12_desc:0 "The defeated may retain a government beneath a new sovereign, but they must be offered actual terms. Any agreement must follow a real peace and preserve obligations that this campaign has no authority to erase."
 WET_NAG_I12_requirements:0 "Actual opponent/overlord consent; preserve unrelated wars."
 WET_NAG_I12_special_tt:0 "Offer a direct subject settlement; territorial rewards require real peace ownership."
 WET_NAG_I13:0 "Take the Phoenix Throne"
 WET_NAG_I13_desc:0 "Malekith may claim the Phoenix Throne only when the conquest beneath it is more than an occupation. Even then, the crown remains contested until a separate political settlement grants broader recognition."
 WET_NAG_I13_requirements:0 "Malekith active; Lothern and at least §Y70%§! of fixed island under [H12.GetNameDef]/direct-subject ownership and control; war resolved."
 WET_NAG_I14:0 "Governors Across the Sea"
 WET_NAG_I14_desc:0 "The island cannot be administered indefinitely from an army’s headquarters. Governors will establish a durable occupation government in the lands that Naggaroth actually owns."
 WET_NAG_I14_special_tt:0 "Garrison equipment requirement -10%; compliance gain +0.02 daily for 180 days on owned island states."
 WET_NAG_I15:0 "The Tribute of Ulthuan"
 WET_NAG_I15_desc:0 "Tribute is useful only when production survives the peace. Workshops on our own island holdings will support the new order without taking factories from an ally."
 WET_NAG_I15_special_tt:0 "1 civilian and 1 military factory credit on owned island states. No seizure of an ally’s factories."
 WET_NAG_I16:0 "Legitimacy Beyond Victory"
 WET_NAG_I16_desc:0 "Victory can compel obedience, but recognition requires another kind of agreement. A surviving Ulthuan government may be asked to ratify a constitution that gives political form to the contested crown."
 WET_NAG_I16_requirements:0 "Ratify the accepted island constitution. Costs §Y75§! Political Power."
 WET_NAG_I16_special_tt:0 "Ratify the accepted island constitution. Costs 75 Political Power."
 WET_NAG_I17:0 "One Crown Above Two Shores"
 WET_NAG_I17_desc:0 "The two shores can sustain one imperial system only while the conquest remains secure. Its institutions will bind supply and production together without requiring every western ambition to be fulfilled first."
 WET_NAG_I17_requirements:0 "[H12.GetNameDef]/direct subjects retain Lothern and §Y70%§! of fixed island; capital held. No continent-completion requirement."
 WET_NAG_L01:0 "Licensed Pleasure Circles"
 WET_NAG_L01_desc:0 "Unlicensed congregations conceal both their fortunes and their debts. Royal licences will bind the pleasure circles to named patrons whom the crown can tax, reward and summon."
 WET_NAG_L02:0 "The Wealth of Indulgence"
 WET_NAG_L02_desc:0 "A taste for excess sustains workshops as readily as it sustains decadent courts. The cult’s wealth will be directed toward the forges that arm our hosts, even as its influence spreads among their patrons."
 WET_NAG_L02_special_tt:0 "1 military factory credit; +5 Chaos support points, taken from Evil."
 WET_NAG_L03:0 "The Hidden Covens"
 WET_NAG_L03_desc:0 "Behind respectable doors, the hidden covens have pursued discoveries forbidden to ordinary colleges. Their knowledge can serve the crown while its protection lasts."
 WET_NAG_L04:0 "Envoys of the Dark Prince"
 WET_NAG_L04_desc:0 "Those who speak for the Dark Prince understand the value of a carefully worded promise. Our envoys will seek limited agreements without placing Naggaroth beneath another ruler’s banner."
 WET_NAG_L04_special_tt:0 "Send named bilateral pact offers; 25 PP on acceptance, no automatic Everchosen membership."
 WET_NAG_L05:0 "Morathi at the King’s Right Hand"
 WET_NAG_L05_desc:0 "Morathi will not be treated as a common petitioner at her son’s court. A formal appointment can secure her willing expertise, but the authority she receives will have a political price."
 WET_NAG_L05_special_tt:0 "Offer the existing Morathi a consenting appointment: pay 75 Political Power only on acceptance; research speed +5% and political power gain -5% while she serves. Refusal permits a paid retry."
 WET_NAG_L06:0 "The Crown Above the Cult"
 WET_NAG_L06_desc:0 "Patronage need not become surrender. The court will insist that every licensed congregation remains beneath the crown, however fervently its followers worship elsewhere."
 WET_NAG_L06_requirements:0 "Has not sworn the irrevocable oath to Chaos."
 WET_NAG_L07:0 "Open the Sixth Temple"
 WET_NAG_L07_desc:0 "Secrecy has protected the cult, but it has also limited the power it can bring into the world. An open temple would bind the realm to Slaanesh and make the consequences of that allegiance impossible to deny."
 WET_NAG_L07_special_tt:0 "Convert to Chaos with Slaaneshi faith; retain ruler and Dark Elf ancestry. Division attack +5%, stability -10 points while oath remains."
 WET_NAG_L08:0 "Rites Before Battle"
 WET_NAG_L08_desc:0 "The covens offer a rite that can drive an army beyond the limits of ordinary discipline. Its strength will be brief, and those who survive it must endure the exhaustion that follows."
 WET_NAG_L08_requirements:0 "Royal cult patronage still active; [R00.GetNameDef] not completed."
 WET_NAG_L08_special_tt:0 "Perform the Martial Rite: +10% Division Attack for 90 days. Costs 50 Political Power."
 WET_NAG_L09:0 "The Anointed Host"
 WET_NAG_L09_desc:0 "The soldiers who emerge from the rites are still soldiers who must be trained and supplied. Their experience will be studied by the officers charged with turning dangerous fervour into a useful battlefield instrument."
 WET_NAG_L10:0 "An Empire of Excess"
 WET_NAG_L10_desc:0 "The pleasures of the court are sustained by the labour of an empire. Under licensed patronage, those same networks will organise production on a scale worthy of the crown’s ambitions."
 WET_NAG_N00:0 "The Arsenals of Naggaroth"
 WET_NAG_N00_desc:0 "Ambition reaches no farther than the arsenals that equip it. The crown will survey the workshops, stores and yards needed to sustain whichever course it chooses."
 WET_NAG_N01:0 "Workshops Beneath Naggarond"
 WET_NAG_N01_desc:0 "Naggarond’s workshops serve a capital whose demands never cease. A new civilian allocation will strengthen that foundation wherever a lawful site can receive it."
 WET_NAG_N02:0 "The Forges of Hag Graef"
 WET_NAG_N02_desc:0 "Hag Graef’s forges can turn royal plans into the weapons of a standing host. Their expansion will be directed first toward the city that already knows the work."
 WET_NAG_N03:0 "The Colleges of Ghrond"
 WET_NAG_N03_desc:0 "The colleges of Ghrond preserve knowledge beyond the possession of any one sorceress. Their studies must continue whether the crown suppresses the cult, courts it or later breaks its bargain."
 WET_NAG_N04:0 "Karond Kar Shipyards"
 WET_NAG_N04_desc:0 "Karond Kar’s shipwrights understand the demands of a fleet that must fight far from home. Additional yard capacity will support that work without promising ships before they are built."
 WET_NAG_N05:0 "Standardise the Workshops"
 WET_NAG_N05_desc:0 "A weapon that cannot be repaired outside its maker’s workshop becomes a liability on campaign. Common standards will make the output of Naggaroth’s industries more dependable."
 WET_NAG_N06:0 "Stores for the Garrisons"
 WET_NAG_N06_desc:0 "Garrison service consumes equipment even when the great armies are elsewhere. Better stores and simpler production will reduce the burden of holding what the crown already governs."
 WET_NAG_N07:0 "Wards Against the Northern Dark"
 WET_NAG_N07_desc:0 "The northern dark presents dangers that ordinary walls cannot answer alone. Defensive wards and careful intelligence will strengthen the watch without surrendering the realm to the powers it studies."
 WET_NAG_N08:0 "Corsairs of the Black Coast"
 WET_NAG_N08_desc:0 "Corsair captains possess generations of experience in difficult waters. Their practical knowledge will be collected into a discipline that the wider fleet can use."
 WET_NAG_N09:0 "Supply the Black Arks"
 WET_NAG_N09_desc:0 "The Black Arks and the ships around them depend upon repair facilities and reliable stores. Better support will extend their usefulness without turning a naval tradition into a new kind of province."
 WET_NAG_N10:0 "Escorts for the Long Crossing"
 WET_NAG_N10_desc:0 "A long crossing is only as secure as the ships guarding its transports. Dedicated escorts and expanded yards will protect the movement on which both war and cooperation depend."
 WET_NAG_N10_special_tt:0 "Convoy escort efficiency +10%; 1 dockyard credit."
 WET_NAG_N11:0 "Masters of the Western Sea"
 WET_NAG_N11_desc:0 "Mastery of the western sea requires ships that can operate together under sustained pressure. Experienced officers will forge a more coherent fleet from the preparations already made."
 WET_NAG_N12:0 "Drill the Dreadspears"
 WET_NAG_N12_desc:0 "The Dreadspears must hold their ranks when the first shock of battle has passed. Repeated drill will give the infantry a discipline upon which more ambitious manoeuvres can rely."
 WET_NAG_N13:0 "Darkshards in Ordered Ranks"
 WET_NAG_N13_desc:0 "Darkshards are most effective when their volleys answer a common command. Better weapons and orderly resupply will make that discipline easier to sustain across a long campaign."
 WET_NAG_N14:0 "The Cold One Stables"
 WET_NAG_N14_desc:0 "The Cold One stables demand handlers as capable as the warriors who ride from them. Their experience will support the realm’s existing heavy cavalry without promising an unbuilt breed of formation."
 WET_NAG_N15:0 "Keepers of the War Beasts"
 WET_NAG_N15_desc:0 "War beasts require equipment, trained keepers and a willingness to learn from costly failures. The crown will invest in those practical foundations before expecting monsters to decide its wars."
 WET_NAG_N16:0 "A Council of Dread Captains"
 WET_NAG_N16_desc:0 "Dread captains accumulate knowledge that too often dies with their private ambitions. A council will preserve useful lessons and make the training of new formations less dependent upon a single commander."
 WET_NAG_N17:0 "Provision for Two Fronts"
 WET_NAG_N17_desc:0 "Naggaroth may have to defend the north while sustaining an army across the sea. Larger stores and careful provisioning will make that burden possible without pretending it is small."
 WET_NAG_N18:0 "A New Generation of Sorceresses"
 WET_NAG_N18_desc:0 "A new generation of sorceresses must be taught by institutions that can outlast their patrons. The colleges and the improved workshops together will support a wider programme of study."
 WET_NAG_N19:0 "The Arsenal of the Land of Chill"
 WET_NAG_N19_desc:0 "The arsenal must serve the whole campaign rather than a succession of rival households. Military training and dependable provisioning will give expanded production a clear purpose."
 WET_NAG_N19_special_tt:0 "1 military factory credit; factory output +5%."
 WET_NAG_P01:0 "The Black Guard Investigates"
 WET_NAG_P01_desc:0 "An accusation alone cannot distinguish a dangerous cultist from a convenient rival. The Black Guard will build cases house by house, following money and testimony to the centre of the conspiracy."
 WET_NAG_P01_special_tt:0 "Investigate the Pleasure cults. Preparations take 60 days and cost 25 Political Power. Work begins when its access and supply requirements are met."
 WET_NAG_P02:0 "Confiscate the Pleasure Estates"
 WET_NAG_P02_desc:0 "The pleasure houses have purchased influence with fortunes that should have strengthened the kingdom. Their seized estates will now finance the machinery of royal power, though their former owners will not forget the humiliation."
 WET_NAG_P03:0 "Sorcery Without Submission"
 WET_NAG_P03_desc:0 "Sorcery is a weapon of the Druchii, not a gift that must be bought with submission. The colleges shall preserve their learning while severing the rituals that invite a foreign master into our realm."
 WET_NAG_P04:0 "Summon the Queen Mother"
 WET_NAG_P04_desc:0 "Morathi’s influence reaches far beyond the walls of Ghrond. A royal summons will establish whether the Queen Mother intends to answer for that influence or force the crown to pursue lawful custody."
 WET_NAG_P04_special_tt:0 "Secure the Queen Mother if she remains within our jurisdiction. Preparations take 60 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_NAG_P05:0 "A Gilded Prison"
 WET_NAG_P05_desc:0 "A living prisoner can still offer counsel that no other sorceress remembers. Morathi will retain a gilded chamber and a carefully measured voice, with the Black Guard between her ambitions and the court."
 WET_NAG_P05_requirements:0 "Morathi alive and in actual custody."
 WET_NAG_P06:0 "Banish the Queen Mother"
 WET_NAG_P06_desc:0 "The Queen Mother’s departure must be a political fact rather than another rumour whispered through the palaces. Once the terms are secured, her offices and household influence will pass beyond the reach of Naggaroth’s government."
 WET_NAG_P06_requirements:0 "A lawful departure is arranged; no foreign employer or captor is overruled."
 WET_NAG_P06_special_tt:0 "Pay 50 PP; +25 legitimacy PP on completed departure; lose her advisory benefits."
 WET_NAG_P07:0 "The Final Sentence"
 WET_NAG_P07_desc:0 "No sentence against Morathi can be carried out while she remains beyond our custody. If the final order is given, the kingdom must bear both the loss of her knowledge and the anger of those who served her."
 WET_NAG_P07_requirements:0 "Morathi alive and in actual custody."
 WET_NAG_P07_special_tt:0 "Pay 50 PP and 10 stability points; verified death; political power gain +5%, permanently lose her expertise."
 WET_NAG_P08:0 "Break Her Web"
 WET_NAG_P08_desc:0 "Removing one patron does not dismantle the network she built. Accounts, appointments and private loyalties must be disentangled until her former servants can no longer govern in her name."
 WET_NAG_P08_requirements:0 "Morathi imprisoned, departed, executed, independently confirmed dead or legally stripped of all domestic offices."
 WET_NAG_P08_special_tt:0 "Remove 10 Chaos support points, transfer to Evil; hostile ideology drift defence +20%."
 WET_NAG_P09:0 "Khaine Is No Chaos God"
 WET_NAG_P09_desc:0 "The Lord of Murder requires no permission from the Dark Prince. The temples will proclaim that the rites of Khaine and the discipline of our soldiers belong to Naggaroth alone."
 WET_NAG_P10:0 "The Witch King Answers to None"
 WET_NAG_P10_desc:0 "The cult has offered power, foreign princes have offered protection, and neither offer was free. The Witch King will stand upon the strength of his own realm, owing obedience to no borrowed master."
 WET_NAG_P10_requirements:0 "Suppression operation completed; no active Chaos oath or Chaos faction."
 WET_NAG_P10_special_tt:0 "Suppress foreign cult subsidies; remove cult drift and any externally installed Chaos government, restoring Evil with ruler/ancestry retained; unlock credible Asur negotiations."
 WET_NAG_R00:0 "Break the Perfumed Bargain"
 WET_NAG_R00_desc:0 "A bargain made in confidence can become a chain when the world changes around it. If Naggaroth seeks a future beside Ulthuan, the crown must pay openly to break the agreement it once embraced."
 WET_NAG_R00_special_tt:0 "Pay 100 PP and 10 stability points; stop all cult programme benefits, pending pacts and active rites immediately."
 WET_NAG_R01:0 "Seize the Cult Accounts"
 WET_NAG_R01_desc:0 "The cult’s accounts reveal which fortunes were lent, stolen or concealed behind false names. Seizing them will deprive its patrons of the means to purchase a second place at court."
 WET_NAG_R01_special_tt:0 "Pay 50 PP; remove 10 Chaos support points, transfer to Evil."
 WET_NAG_R02:0 "Dismiss the Queen Mother"
 WET_NAG_R02_desc:0 "Morathi’s office was granted by the crown and can be revoked by it. The settlement of her person must follow lawful proceedings, even when her domestic influence is ended immediately."
 WET_NAG_R02_special_tt:0 "Revoke Morathi’s domestic office and bonuses; unlock lawful severance, custody or departure proceedings without seizing a foreign character."
 WET_NAG_R03:0 "Seal the Summoning Chambers"
 WET_NAG_R03_desc:0 "The summoning chambers contain obligations that cannot be erased by a proclamation. Their seals must be broken and their apparatus dismantled before the realm can abandon its oath to the Dark Prince."
 WET_NAG_R03_special_tt:0 "Pay 50 PP and 100 Elite Equipment; remove the Slaaneshi oath and convert Chaos back to Evil if necessary. Preserve ancestry."
 WET_NAG_R04:0 "A Reckoning in the Court"
 WET_NAG_R04_desc:0 "Every family that prospered under patronage will seek a place in the new settlement. The court must endure a season of costly bargaining before its factions accept the loss of their former privileges."
 WET_NAG_R04_requirements:0 "Morathi’s office and custody/departure status actually resolved."
 WET_NAG_R05:0 "No More Borrowed Masters"
 WET_NAG_R05_desc:0 "The last obligations have been exposed, paid or rejected. Naggaroth can now approach other powers as a sovereign realm rather than an instrument of the patron it has renounced."
 WET_NAG_R05_requirements:0 "No Chaos faction, oath or active cult office; paid exit preserves any existing wars."
 WET_NAG_R05_special_tt:0 "End foreign cult subsidies and drift; unlock credible Asur treaty. Cult focuses cannot restore their rewards."
 WET_NAG_S00:0 "The Storm and the Ancient Claim"
 WET_NAG_S00_desc:0 "The northern storm threatens every throne that might survive to claim victory. Malekith must decide whether it opens the road to his ancient prize or makes that prize meaningless without an Elven future."
 WET_NAG_S01:0 "Our Hour of Vengeance"
 WET_NAG_S01_desc:0 "Ulthuan’s enemies multiply, and its defenders cannot look in every direction at once. The Witch King will prepare to turn the world’s crisis into the opening his ancestors were denied."
 WET_NAG_S01_requirements:0 "Has no compact or non-aggression pact with Ulthuan and is not in its faction."
 WET_NAG_S02:0 "A Future Beyond Vengeance"
 WET_NAG_S02_desc:0 "There can be no triumph over the Asur if the world that sustains both peoples is destroyed. The crown will explore a future in which vengeance is restrained for the sake of survival."
 WET_NAG_S02_requirements:0 "A real current Ulthuan government; no active offensive war against it."
 WET_NAG_S02_special_tt:0 "+25 opinion with Ulthuan; unlock talks and the expensive cult-repudiation route. This is not an alliance yet."
 WET_NAG_W00:0 "Survey the Western Dominion"
 WET_NAG_W00_desc:0 "Maps of the western continent still mark lands that the Witch King claims but does not govern. A survey will distinguish defensible frontiers, useful ports and ambitions that demand another campaign."
 WET_NAG_W01:0 "Reinforce the Northern Watch"
 WET_NAG_W01_desc:0 "The northern watch must hold even while the great fleets sail elsewhere. Fortified posts and reliable stores will give its commanders something firmer than a promise of distant reinforcements."
 WET_NAG_W02:0 "Take the Frozen City"
 WET_NAG_W02_desc:0 "The Frozen City commands an approach that no northern ruler can afford to ignore. We will press our claim against its actual holder when the frontier and our obligations permit it."
 WET_NAG_W02_requirements:0 "Legal regional frontier; objective §Y$STATE_411$§!."
 WET_NAG_W02_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W03:0 "Restore the Frozen Watch"
 WET_NAG_W03_desc:0 "A captured city becomes a frontier stronghold only when its roads and workshops function again. The Frozen Watch will be rebuilt upon land the crown truly owns and controls."
 WET_NAG_W04:0 "A Shield Against the Wastes"
 WET_NAG_W04_desc:0 "The defence of the Land of Chill cannot depend upon a successful conquest abroad. Entrenched positions and standing reserves will strengthen the northern shield whatever the campaign brings."
 WET_NAG_W05:0 "Claims Along the Black Forest"
 WET_NAG_W05_desc:0 "The Black Forest is divided by rival courts and stubborn enclaves. Our captains will prepare a campaign whose objectives follow the real coast and the roads that connect it."
 WET_NAG_W06:0 "Break the Nightfall Holdouts"
 WET_NAG_W06_desc:0 "The Nightfall coast and the Forgebound holdings interrupt the reach of Naggaroth’s authority. Each current ruler must be confronted through a lawful claim or a negotiated submission."
 WET_NAG_W06_requirements:0 "Legal local route; fixed states §Y822§!–825."
 WET_NAG_W06_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W07:0 "The Black Forest Secured"
 WET_NAG_W07_desc:0 "Winning the coast is only the beginning of governing it. Civil workshops and a settled administration will make the Black Forest more than a succession of occupied camps."
 WET_NAG_W07_requirements:0 "All four states owned/controlled by [H12.GetNameDef] or direct subjects; peace."
 WET_NAG_W07_special_tt:0 "Add §G1§! §Y$industrial_complex$§! in our conquered frontier and reduce local Resistance Growth by §G5%§!."
 WET_NAG_W08:0 "Chart the Broken Lands"
 WET_NAG_W08_desc:0 "The Broken Lands punish captains who mistake an unfamiliar channel for an open sea. Careful charts and rehearsed embarkations will reduce the uncertainty before a landing is attempted."
 WET_NAG_W09:0 "Sweep the Western Isles"
 WET_NAG_W09_desc:0 "The western islands offer harbours to enemies who would otherwise have no foothold on our coast. A fleet must be ready before the crown presses claims that can be enforced only across the water."
 WET_NAG_W09_requirements:0 "Owned departure port, four combat ships, §Y20§! convoys; protected partners excluded."
 WET_NAG_W09_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W10:0 "Subdue the Black Flood Marches"
 WET_NAG_W10_desc:0 "The Black Flood marches are a patchwork of rival powers and difficult approaches. Our demands will follow actual access to those lands, leaving no excuse for an expedition against an unrelated enclave."
 WET_NAG_W10_requirements:0 "Has a land frontier with the target or the naval forces required by §Y$WET_NAG_W09$§!."
 WET_NAG_W10_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W11:0 "A Harbour in the Shattered Coast"
 WET_NAG_W11_desc:0 "A useful harbour must be held, repaired and supplied after the fighting ends. The shattered coast will provide an anchorage for the next campaign once its ownership is settled."
 WET_NAG_W11_requirements:0 "Own/control a listed objective port; peace with its former enemy."
 WET_NAG_W11_special_tt:0 "One naval-base level at a captured fixed-objective port; 20 Naval XP."
 WET_NAG_W12:0 "Govern the Broken Marches"
 WET_NAG_W12_desc:0 "Military commanders cannot remain the sole government of every conquered march. Appointed governors will turn selected holdings into dependable provinces without pretending that resentment disappears at a decree."
 WET_NAG_W12_special_tt:0 "Compliance gain +0.02 daily for 180 days in up to three owned objective states; 50 PP."
 WET_NAG_W13:0 "Roads into the Doom Glades"
 WET_NAG_W13_desc:0 "Roads through the Doom Glades are as important as the armies that march along them. Our scouts will identify approaches that can sustain a host beyond its first victory."
 WET_NAG_W14:0 "The Arnheim Question"
 WET_NAG_W14_desc:0 "Arnheim is an Asur realm whose survival may become part of a wider Elven agreement. The crown can seek an accord or pursue a lawful claim, but it cannot promise protection and invasion at the same time."
 WET_NAG_W14_requirements:0 "Order Arnheim [H19.GetNameDef]; no goal against Ulthuan’s protected partners after the treaty."
 WET_NAG_W14_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W15:0 "Claim Ancient Quintex"
 WET_NAG_W15_desc:0 "Ancient Quintex is divided among powers with very different ambitions. Each portion must be dealt with according to its present ruler and the obligations we have actually accepted."
 WET_NAG_W15_requirements:0 "Lawful regional route; friendly protected owners excluded."
 WET_NAG_W15_special_tt:0 "Gain conquest war goals against eligible rulers in this campaign’s objective region."
 WET_NAG_W16:0 "The Southern Powers"
 WET_NAG_W16_desc:0 "The southern courts cannot all be treated as interchangeable enemies. Druchii rulers may consent to submission, while other powers must be approached through the separate claims of the campaign."
 WET_NAG_W16_direct:0 "Send offers of submission to the western Dreadlords. Gain conquest war goals in the campaign region."
 WET_NAG_W16_requirements:0 "Actual current owner, government and treaty checks."
 WET_NAG_W16_special_tt:0 "Send offers of submission to the western Dreadlords. Gain conquest war goals in the campaign region."
 WET_NAG_W17:0 "Ports at the Southern Reach"
 WET_NAG_W17_desc:0 "The southern reach needs a port from which ships can support a lasting administration. The work will begin only where Naggaroth has secured a lawful coastal holding."
 WET_NAG_W17_requirements:0 "Own/control a Doom Glades objective port; peace with its former enemy."
 WET_NAG_W17_special_tt:0 "1 dockyard credit and one port level at one owned coastal objective."
 WET_NAG_W18:0 "Rule the Doom Glades"
 WET_NAG_W18_desc:0 "Scattered victories do not make the Doom Glades governable. A connected base of authority and dependable supplies will allow the crown to sustain its southern presence."
 WET_NAG_W18_requirements:0 "At least three fixed Doom Glades states under [H12.GetNameDef]/direct-subject rule."
 WET_NAG_W18_special_tt:0 "1 civilian factory credit; supply use -5% in the regional programme."
 WET_NAG_W19:0 "The Dreadlords’ Submission"
 WET_NAG_W19_desc:0 "A dreadlord may prefer a recognised place beneath the Witch King to the uncertainty of isolation. Submission must be accepted by the ruler concerned, with the obligations of subjecthood stated plainly."
 WET_NAG_W19_direct:0 "Send offers of submission to the western Dreadlords."
 WET_NAG_W19_special_tt:0 "Send offers of submission to the western Dreadlords."
 WET_NAG_W20:0 "Governors of the Marches"
 WET_NAG_W20_desc:0 "The western marches require governors who understand both military necessity and the burden of occupation. Their institutions will support whichever regional campaigns have actually succeeded."
 WET_NAG_W21:0 "Roads of the Western Empire"
 WET_NAG_W21_desc:0 "An empire held together by isolated ports remains vulnerable wherever the sea closes. New roads will connect distinct western holdings without conjuring supply where no route exists."
 WET_NAG_W21_special_tt:0 "Two +1 infrastructure credits in distinct owned objective states. No disconnected free hubs."
 WET_NAG_W22:0 "Hegemon of the West"
 WET_NAG_W22_desc:0 "Authority across two western regions gives the crown a weight that distant claims cannot match. The court will recognise that achievement only when it includes lands gained beyond the old frontier."
 WET_NAG_W22_requirements:0 "Two regions at least half under [H12.GetNameDef]/direct-subject rule, each with at least one gained starting-foreign state; capital held."
 WET_NAG_W23:0 "The Continent Kneels"
 WET_NAG_W23_desc:0 "The fullest western ambition leaves no independent holding within the claimed theatre. Such a crown must rest upon real sovereignty, not the borrowed territory of allies."
 WET_NAG_W23_requirements:0 "All §Y63§! passable theatre states owned/controlled by [H12.GetNameDef]/direct subjects; no unresolved wars over them."
