 wet_nag_request_arms_H06:0 "Request Arms Across the Ocean — Ulthuan"
 wet_nag_request_arms_H06_desc:0 "Accept delivery of 500 existing infantry equipment from Naggaroth. The sender must still possess the stock and a usable route; no equipment is created. Deliveries share a 90-day cooldown."
