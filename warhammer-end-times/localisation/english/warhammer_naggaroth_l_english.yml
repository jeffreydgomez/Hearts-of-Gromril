 wet_naggaroth.100.0:0 "Return to the works."
 wet_naggaroth.100.d:0 "The overseers have brought their tallies before the throne. Naggaroth’s forges and works demand labour, and the Witch King’s servants wait to learn where it will be spent."
 wet_naggaroth.100.t:0 "The Arsenals and Construction Ledger"
 wet_naggaroth.101.0:0 "Decline the request."
 wet_naggaroth.101.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.101.1:0 "Accept the terms."
 wet_naggaroth.101.1_effect:0 "Morathi may submit to supervised custody or refuse the summons. Refusal does not establish custody."
 wet_naggaroth.101.d:0 "The Witch King has summoned the Queen Mother to answer before his court. Behind the formal command lie old suspicions and a struggle for influence that neither throne nor blood can quiet."
 wet_naggaroth.101.t:0 "The Queen Mother Is Summoned"
 wet_naggaroth.102.0:0 "Decline the request."
 wet_naggaroth.102.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.102.1:0 "Accept the terms."
 wet_naggaroth.102.1_effect:0 "Arrange Morathi’s lawful departure from Naggaroth. She remains alive and politically unavailable; no foreign territory or employer is assigned."
 wet_naggaroth.102.1_outcome:0 "Morathi leaves Naggaroth’s court."
 wet_naggaroth.102.d:0 "The Queen Mother has departed, taking her household and her secrets with her. Those who remain watch the empty places at court and wonder which loyalties have gone with them."
 wet_naggaroth.102.t:0 "Departure of the Queen Mother"
 wet_naggaroth.103.0:0 "Decline the request."
 wet_naggaroth.103.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.103.1:0 "Accept the terms."
 wet_naggaroth.103.1_effect:0 "Offer Morathi a formal court office for §Y75§! Political Power on acceptance. Her research and political influence lasts only while she serves an active patronage court."
 wet_naggaroth.103.d:0 "Morathi has taken her place beside the King. Courtiers bow with the proper ceremony, concealing their relief or alarm beneath carefully composed faces."
 wet_naggaroth.103.t:0 "Morathi at the King’s Right Hand"
 wet_naggaroth.104.0:0 "Decline the request."
 wet_naggaroth.104.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.104.1:0 "Accept the terms."
 wet_naggaroth.104.1_effect:0 "Consent to release the unique Morathi from our service. This does not transfer troops or replace a current ruler."
 wet_naggaroth.104.d:0 "An envoy from Naggaroth demands Morathi’s release. The request bears the weight of the Witch King’s authority, and its answer will be remembered long after the messenger leaves."
 wet_naggaroth.104.t:0 "Release Morathi to Naggaroth"
 wet_naggaroth.105.0:0 "Return to the council."
 wet_naggaroth.105.d:0 "The great lords have assembled beneath the Black Spire. Every bow acknowledges the throne, though the eyes raised afterward reveal how much ambition survives beneath that courtesy."
 wet_naggaroth.105.t:0 "The Court Beneath the Black Spire"
 wet_naggaroth.106.0:0 "Decline the request."
 wet_naggaroth.106.0_effect:0 "Decline without payment or forced commitments."
 wet_naggaroth.106.1:0 "Accept the terms."
 wet_naggaroth.106.1_effect:0 "Become Naggaroth’s direct puppet while retaining your ruler, army and territory. Normal subject war obligations apply. Naggaroth pays §Y75§! Political Power only after direct subject status is established."
 wet_naggaroth.106.d:0 "Naggaroth’s envoy offers our Dreadlord a place beneath the Witch King’s authority. He may keep his court and command, if he accepts whose will must stand above his own."
 wet_naggaroth.106.t:0 "The Dreadlord’s Submission"
