 wet_nag_constitution_council:0 "Propose: Two Thrones, One War"
 wet_nag_constitution_council_desc:0 "Recognise a joint Elven council of two sovereign crowns. Ulthuan retains its current ruler, territory and government. Neither war participation nor faction membership changes. Both governments must ratify; the alternate settlement becomes unavailable only after ratification."
