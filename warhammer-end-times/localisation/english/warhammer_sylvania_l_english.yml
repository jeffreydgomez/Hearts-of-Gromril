 wet_syl_grave_bonds_broken_desc:0 "Consecrated earth and broken fetters deny the vampire court its obedient reserves."
 wet_syl_h07:0 "Reopen the Gardens of Morr"
 wet_syl_h07_desc:0 "Graves are given names again. Priests and grave wardens reopen the burial grounds, beyond the reach of the castle's muster rolls."
 wet_syl_h08:0 "The Watch at the Graveyard Gate"
 wet_syl_h08_desc:0 "Black-armoured guardians take silent posts at the reclaimed graveyards. They protect the resting dead and the frightened families who come to mourn."
 wet_syl_h10:0 "Helhunten's Redeemers"
 wet_syl_h10_desc:0 "The Redeemers' black and tan colours become familiar on the training fields. Their veterans teach the levies to hold against foes that neither bleed nor plead."
 wet_syl_h11:0 "Ravens over Hunger Wood"
 wet_syl_h11_desc:0 "Raven Knights ride with local guides along the forest roads. They seek surviving masters of the dead before another hidden court can gather an army."
 wet_syl_h12:0 "The Waldenhof Charter"
 wet_syl_h12_desc:0 "Town representatives and parish elders write the limits of their rulers' power. Waldenhof's civic traditions supply charters and offices to replace commands from the crypt."
 wet_syl_h13:0 "Captains of Mortal Blood"
 wet_syl_h13_desc:0 "A commission rests on service and judgment. The children of the levy may rise without surrendering their humanity to the Blood Kiss."
 wet_syl_h14:0 "Remember Count Martin"
 wet_syl_h14_desc:0 "Hel Fenn proved that Mannfred could be defeated by the living. Veterans study Count Martin's coalition and the patient preparation that ended the Vampire Wars."
 wet_syl_h17:0 "Sylvania Beneath the Sun"
 wet_syl_h17_desc:0 "Mist still hangs over the moors, and watchfires burn beside the roads. Yet the harvest belongs to those who sow it, and children may inherit a home rather than a grave."
