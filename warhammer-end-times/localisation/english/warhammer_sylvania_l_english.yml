l_english:
 WET_SYL_A00:0 "[GetSylvanianA00Name]"
 WET_SYL_A00_desc:0 "[GetSylvanianA00Description]"
 WET_SYL_A00_desc_human:0 "The watchmen of the rising must become an army answerable to the county. Their captains will gather the scattered companies beneath an order their villages can recognize."
 WET_SYL_A00_desc_vampire:0 "Every churchyard and battlefield holds servants who have not yet answered the count's summons. The necromancers must turn that scattered abundance into formations the captains can command."
 WET_SYL_A00_human:0 "Muster the Sylvanian Levy"
 WET_SYL_A00_vampire:0 "Muster the Restless Dead"
 WET_SYL_A01:0 "[GetSylvanianA01Name]"
 WET_SYL_A01_desc:0 "[GetSylvanianA01Description]"
 WET_SYL_A01_desc_human:0 "Each parish knows which households can spare a defender without losing the harvest. Local rolls will make the muster an obligation shared by the living."
 WET_SYL_A01_desc_vampire:0 "The villages keep careful memories of those buried beside their churches. The night court keeps different records, and its collectors have come to read them again."
 WET_SYL_A01_human:0 "Village Muster Rolls"
 WET_SYL_A01_vampire:0 "The Village Graveyards"
 WET_SYL_A02:0 "[GetSylvanianA02Name]"
 WET_SYL_A02_desc:0 "[GetSylvanianA02Description]"
 WET_SYL_A02_desc_human:0 "Hel Fenn recalls a victory over the vampire host as well as the lives it cost. Its remembrance will summon volunteers to defend the freedom their predecessors fought to preserve."
 WET_SYL_A02_desc_vampire:0 "Hel Fenn remembers the ruin of Mannfred's last great campaign. Beneath its troubled ground lie warriors whose service the court is prepared to demand once more."
 WET_SYL_A02_human:0 "Sons and Daughters of Hel Fenn"
 WET_SYL_A02_vampire:0 "The Ossuaries of Hel Fenn"
 WET_SYL_A03:0 "[GetSylvanianA03Name]"
 WET_SYL_A03_desc:0 "[GetSylvanianA03Description]"
 WET_SYL_A03_desc_human:0 "The county's old campaigns left traditions of service that the night court could not wholly erase. Surviving families and veterans will help gather another generation beneath their own banners."
 WET_SYL_A03_desc_vampire:0 "The county's earth conceals the remains of wars that living chroniclers barely remember. Necromancers will search their forgotten fields for another muster beneath the bat-winged banners."
 WET_SYL_A03_human:0 "A County Under Arms"
 WET_SYL_A03_vampire:0 "Muster the Forgotten Wars"
 WET_SYL_A04:0 "[GetSylvanianA04Name]"
 WET_SYL_A04_desc:0 "[GetSylvanianA04Description]"
 WET_SYL_A04_desc_human:0 "A wounded defender should not have to fear the collectors who once followed every battle. Healers and guarded shelters will give the companies a chance to recover their strength."
 WET_SYL_A04_desc_vampire:0 "A broken body need not mean the loss of its service. Skilled attendants will follow the formations and restore what can still answer their masters' will."
 WET_SYL_A04_human:0 "Shallyan Field Hospitals"
 WET_SYL_A04_vampire:0 "The Second Death Denied"
 WET_SYL_A05:0 "[GetSylvanianA05Name]"
 WET_SYL_A05_desc:0 "[GetSylvanianA05Description]"
 WET_SYL_A05_desc_human:0 "Courage carried the first watchmen into the streets, but courage alone will not hold an open battlefield. Repeated drill will teach their companies to stand and move together."
 WET_SYL_A05_desc_vampire:0 "A mass of walking corpses can obstruct a road as easily as an enemy. The captains will teach their servants the intervals and formations required of a useful battle line."
 WET_SYL_A05_human:0 "Discipline of the Living"
 WET_SYL_A05_vampire:0 "Dead Men in Ranks"
 WET_SYL_A06:0 "[GetSylvanianA06Name]"
 WET_SYL_A06_desc:0 "[GetSylvanianA06Description]"
 WET_SYL_A06_desc_human:0 "The county cannot afford to commit every able defender at once. An organized reserve will support threatened companies before a local reverse becomes a general rout."
 WET_SYL_A06_desc_vampire:0 "The living must find the courage to leave a reserve and enter a faltering battle. Our commanders need only make their orders reach the waiting dead at the proper moment."
 WET_SYL_A06_human:0 "Parish Reserve Companies"
 WET_SYL_A06_vampire:0 "The Undying Reserve"
 WET_SYL_A07:0 "[GetSylvanianA07Name]"
 WET_SYL_A07_desc:0 "[GetSylvanianA07Description]"
 WET_SYL_A07_desc_human:0 "Living soldiers need food, rest and roads that their wagons can pass. The quartermasters will make those necessities part of every plan before the army marches."
 WET_SYL_A07_desc_vampire:0 "The wagons still need clear roads, even when neither drivers nor escorts require sleep. A carefully arranged train will carry the army's burdens through the hours its enemies spend resting."
 WET_SYL_A07_human:0 "The Living Supply Train"
 WET_SYL_A07_vampire:0 "An Army Without Fatigue"
 WET_SYL_A08:0 "[GetSylvanianA08Name]"
 WET_SYL_A08_desc:0 "[GetSylvanianA08Description]"
 WET_SYL_A08_desc_human:0 "The parishes rose for a common cause without first agreeing upon a common command. Their captains must now establish an order that every company understands."
 WET_SYL_A08_desc_vampire:0 "A hundred competing commands can undo the work of a thousand obedient servants. The necromancers will bind their formations to a common order of battle."
 WET_SYL_A08_human:0 "One County, One Command"
 WET_SYL_A08_vampire:0 "Bound by One Will"
 WET_SYL_A09:0 "[GetSylvanianA09Name]"
 WET_SYL_A09_desc:0 "[GetSylvanianA09Description]"
 WET_SYL_A09_desc_human:0 "The county guard will preserve the discipline learned by those who survived the hardest fighting. Its veterans will take their place among the infantry as an example to newer companies."
 WET_SYL_A09_desc_vampire:0 "The household's oldest warriors remember duties that survived their kingdoms. Their retinues will give the infantry a steadier example than the newly raised ranks can provide."
 WET_SYL_A09_human:0 "The County Guard"
 WET_SYL_A09_vampire:0 "Grave Guard Retinues"
 WET_SYL_A10:0 "[GetSylvanianA10Name]"
 WET_SYL_A10_desc:0 "[GetSylvanianA10Description]"
 WET_SYL_A10_desc_human:0 "Sound weapons matter more to the watch than the splendour of a noble household. The armourers will restore and standardize the blades entrusted to its chosen infantry."
 WET_SYL_A10_desc_vampire:0 "Blades drawn from old barrows carry the craft of rulers whose names have faded. Restoring those weapons will place their surviving strength in the hands of our chosen infantry."
 WET_SYL_A10_human:0 "Blades of the Restoration"
 WET_SYL_A10_vampire:0 "Wight Blades"
 WET_SYL_A11:0 "[GetSylvanianA11Name]"
 WET_SYL_A11_desc:0 "[GetSylvanianA11Description]"
 WET_SYL_A11_desc_human:0 "Mounted patrols carried warnings between villages long before the council had an army. Their riders will be gathered into companies capable of striking together."
 WET_SYL_A11_desc_vampire:0 "The Blood Knights measure a captain by the force and order of his charge. Their lances will be gathered into formations capable of deciding a battle together."
 WET_SYL_A11_human:0 "Lances of the County"
 WET_SYL_A11_vampire:0 "Blood Knight Lances"
 WET_SYL_A12:0 "[GetSylvanianA12Name]"
 WET_SYL_A12_desc:0 "[GetSylvanianA12Description]"
 WET_SYL_A12_desc_human:0 "A rider sent to defend the parish roads deserves more than a borrowed coat and an old spear. The county will provide harness fit for the dangers its mounted defenders face."
 WET_SYL_A12_desc_vampire:0 "Even a deathless rider benefits from harness that turns aside a well-placed spear. The armourers will prepare protection fit for the county's most demanding mounted retainers."
 WET_SYL_A12_human:0 "Armour of the Raven"
 WET_SYL_A12_vampire:0 "Armour of Night"
 WET_SYL_A13:0 "[GetSylvanianA13Name]"
 WET_SYL_A13_desc:0 "[GetSylvanianA13Description]"
 WET_SYL_A13_desc_human:0 "The wagons that once carried hidden arms must now supply an army openly. A public train will bring equipment to the companies without leaving each captain to bargain alone."
 WET_SYL_A13_desc_vampire:0 "A black coach upon a parish road has long been a warning to shutter the windows. An organized train of wagons will make those same roads carry the arms and stores of the host."
 WET_SYL_A13_human:0 "The Wurtbad Wagon Road"
 WET_SYL_A13_vampire:0 "The Black Coach Train"
 WET_SYL_A14:0 "[GetSylvanianA14Name]"
 WET_SYL_A14_desc:0 "[GetSylvanianA14Description]"
 WET_SYL_A14_desc_human:0 "The new county has veterans whose authority was earned in the rising. Their experience will guide the guard and the officers expected to lead it into another war."
 WET_SYL_A14_desc_vampire:0 "Some of the warriors beneath our banners served crowns older than the Empire. Their patient discipline will be studied by captains whose ambitions have not yet survived a single century."
 WET_SYL_A14_human:0 "Veterans of the Liberation"
 WET_SYL_A14_vampire:0 "Champions of Long-Dead Kings"
 WET_SYL_A15:0 "Kennels of Drakenhof"
 WET_SYL_A15_desc:0 "Not every creature kept beneath Drakenhof belongs in a soldier's rank. The keepers will study how to turn the castle's hungrier dependants into useful instruments of war."
 WET_SYL_A16:0 "The Vargheists Awake"
 WET_SYL_A16_desc:0 "The prisoned creatures beneath the towers have waited too long in darkness. Their handlers will learn which chains must be broken and which commands can still be heard."
 WET_SYL_A17:0 "Terrors of the Moonless Sky"
 WET_SYL_A17_desc:0 "A moonless sky gives a flying predator more than concealment. Coordinated flights will bring terror down where a ground-bound enemy believes its rear is safe."
 WET_SYL_A18:0 "Predators of the Night"
 WET_SYL_A18_desc:0 "The largest hunters of the night can scatter formations that would withstand an ordinary charge. Their masters must learn to direct that fury before it is wasted upon lesser prey."
 WET_SYL_A19:0 "[GetSylvanianA19Name]"
 WET_SYL_A19_desc:0 "[GetSylvanianA19Description]"
 WET_SYL_A19_desc_human:0 "Morrite attendants and field healers will accompany the companies where their service is needed. The wounded must find care before fear drives them from the line."
 WET_SYL_A19_desc_vampire:0 "A necromancer who cannot see the failing line may learn of its ruin too late. Our practitioners will serve close enough to repair their work while the enemy is still fighting it."
 WET_SYL_A19_human:0 "Chaplains at the Front"
 WET_SYL_A19_vampire:0 "Necromancers at the Front"
 WET_SYL_A20:0 "[GetSylvanianA20Name]"
 WET_SYL_A20_desc:0 "[GetSylvanianA20Description]"
 WET_SYL_A20_desc_human:0 "Training cannot consume every hour needed to keep the villages fed. A common programme of drill will make better use of the time the county can spare."
 WET_SYL_A20_desc_vampire:0 "The dead can repeat a movement long after a living recruit would collapse. The captains will use that patience to make each formation obey with greater certainty."
 WET_SYL_A20_human:0 "Drill on the Village Green"
 WET_SYL_A20_vampire:0 "Rehearsals of the Dead"
 WET_SYL_A21:0 "[GetSylvanianA21Name]"
 WET_SYL_A21_desc:0 "[GetSylvanianA21Description]"
 WET_SYL_A21_desc_human:0 "The army exists to preserve the people whose labour sustains it. Stores, reserves and trained companies will give that promise substance when the next enemy arrives."
 WET_SYL_A21_desc_vampire:0 "An enduring legion needs reserves, disciplined commands and servants who can mend its broken ranks. These preparations will make the county's armies harder to destroy than any single muster before them."
 WET_SYL_A21_human:0 "The Army of the Restoration"
 WET_SYL_A21_vampire:0 "Legions That Endure"
 WET_SYL_C00:0 "Under the Shadow of Drakenhof"
 WET_SYL_C00_desc:0 "The towers of Drakenhof cast a long shadow over a county that remembers too many masters. Behind its gates, the court must decide what kind of inheritance Sylvania will leave."
 WET_SYL_C01:0 "The Living Serve the Dead"
 WET_SYL_C01_desc:0 "The fields still need living hands, even where the dead obey every command. Village craftsmen will keep the workshops supplied while the count's servants carry the heaviest burdens."
 WET_SYL_C02:0 "The Tithe of Night"
 WET_SYL_C02_desc:0 "The collectors of the night court know every parish road and every freshly opened grave. Their ledgers will bind the county's scattered obligations to Drakenhof."
 WET_SYL_C03:0 "One Sylvanian Crown"
 WET_SYL_C03_desc:0 "Petty lords have too often mistaken the mists between their castles for a border. One crown must command the county before it can demand a place beyond it."
 WET_SYL_CRIMSON_CONCORD:0 "The Crimson Concord"
 WET_SYL_Chaplain:0 "Chaplain of Siegfriedhof"
 WET_SYL_Council:0 "Council of the Living"
 WET_SYL_D00:0 "The World Beyond the Mists"
 WET_SYL_D00_desc:0 "The mists conceal Sylvania's roads without removing the world at their end. Our court must learn which distant powers can be approached before those powers arrive as enemies."
 WET_SYL_D01:0 "Envoys from Drakenhof"
 WET_SYL_D01_desc:0 "An envoy who survives the night court must still learn to speak in a living prince's hall. Drakenhof will choose servants who can carry its promises beyond the county's feared reputation."
 WET_SYL_E00:0 "[GetSylvanianE00Name]"
 WET_SYL_E00_desc:0 "[GetSylvanianE00Description]"
 WET_SYL_E00_desc_human:0 "The council's envoys will carry the county's charter to Altdorf. They seek a place in the Imperial alliance that recognizes the government the living have won for themselves."
 WET_SYL_E00_desc_vampire:0 "The envoys who approach Altdorf carry a proposal many priests would prefer never to hear. Sylvania offers its armies against common enemies while insisting upon a government of its own."
 WET_SYL_E00_effect_tt:0 "Request sovereign admission to [A01.GetNameDef]’s alliance. Acceptance renounces any Covenant of the Black Hand."
 WET_SYL_E00_human:0 "An Embassy to Altdorf"
 WET_SYL_E00_vampire:0 "An Embassy to Altdorf"
 WET_SYL_E01:0 "[GetSylvanianE01Name]"
 WET_SYL_E01_desc:0 "[GetSylvanianE01Description]"
 WET_SYL_E01_desc_human:0 "The Emperor's recognition need not place another hereditary master above the council. A clear charter will protect Sylvania's government within the common alliance."
 WET_SYL_E01_desc_vampire:0 "The Imperial bargain gives the count a place to speak where once his name brought only alarm. That recognition must be made visible to the county's own divided people."
 WET_SYL_E01_human:0 "A Charter for Human Sylvania"
 WET_SYL_E01_vampire:0 "An Undying Elector"
 WET_SYL_E02:0 "The Emperor's Writ"
 WET_SYL_E02_desc:0 "A writ bearing the Emperor's authority can travel where the count's collectors cannot. Our officers will learn to make that recognition useful in the daily government of the realm."
 WET_SYL_E03:0 "Envoys Among the Electors"
 WET_SYL_E03_desc:0 "No agreement signed in Altdorf can erase the memories of every provincial court. Patient envoys must carry the terms of the alliance to the princes expected to live beside it."
 WET_SYL_E03_effect_tt:0 "Other members of the Emperor's faction gain §G+50§! opinion of Sylvania for §Y5 years§!."
 WET_SYL_E04:0 "Imperial Armaments Contracts"
 WET_SYL_E04_desc:0 "Imperial smiths know the value of a reliable contract, whatever rumours surround its purchaser. Our foundries will acquire the tools and patterns needed to equip an allied army."
 WET_SYL_E05:0 "[GetSylvanianE05Name]"
 WET_SYL_E05_desc:0 "[GetSylvanianE05Description]"
 WET_SYL_E05_desc_human:0 "The county's soldiers have earned their freedom without mastering every duty of an army. Exchanges with Imperial specialists will strengthen the services upon which those soldiers depend."
 WET_SYL_E05_desc_vampire:0 "An army defending the Empire needs engineers, healers and supply officers as surely as it needs courage. Sylvania's specialists will study the practices that keep their living allies in the field."
 WET_SYL_E05_human:0 "Living Soldiers of the Realm"
 WET_SYL_E05_vampire:0 "Necromancy in Defence of the Realm"
 WET_SYL_E06:0 "[GetSylvanianE06Name]"
 WET_SYL_E06_desc:0 "[GetSylvanianE06Description]"
 WET_SYL_E06_desc_human:0 "The northern enemy threatens the same villages that endured the night court. Our companies will stand beside their Imperial allies to keep another terror from taking their place."
 WET_SYL_E06_desc_vampire:0 "The northern hosts expect frightened soldiers to tire and flee before the assault is spent. Sylvania's formations will give the Imperial line a reserve that endures beyond ordinary exhaustion."
 WET_SYL_E06_effect_tt:0 "Defense against current Chaos enemies: §G+10%§!."
 WET_SYL_E06_human:0 "The Living Hold the Line"
 WET_SYL_E06_vampire:0 "The Dead Hold the Line"
 WET_SYL_E07:0 "Roads to the Imperial Heartland"
 WET_SYL_E07_desc:0 "An alliance cannot march through a promise written on parchment. Bridges and maintained roads must connect the county to the stores and musters of the Imperial heartland."
 WET_SYL_E08:0 "[GetSylvanianE08Name]"
 WET_SYL_E08_desc:0 "[GetSylvanianE08Description]"
 WET_SYL_E08_desc_human:0 "Hunters and watchmen know the roads by which danger enters the eastern county. Their reports will serve a common frontier reaching beyond the villages that first sent them out."
 WET_SYL_E08_desc_vampire:0 "The Emperor's enemies do not all announce themselves beneath a raised banner. Our watchers will bring the habits of the night court to the defence of the common frontier."
 WET_SYL_E08_human:0 "The Emperor's Border Watch"
 WET_SYL_E08_vampire:0 "The Emperor's Night Watch"
 WET_SYL_E09:0 "[GetSylvanianE09Name]"
 WET_SYL_E09_desc:0 "[GetSylvanianE09Description]"
 WET_SYL_E09_desc_human:0 "Sylvania's people can share the defence of the Empire without surrendering the government they created. Lasting agreements over roads, workshops and common service will give that settlement strength."
 WET_SYL_E09_desc_vampire:0 "Living towns and deathless castles now depend upon the same roads and battle lines. The settlement must become a working order capable of surviving the fears that brought it into being."
 WET_SYL_E09_human:0 "A Living Province of the Empire"
 WET_SYL_E09_vampire:0 "An Empire of Living and Dead"
 WET_SYL_F00:0 "The Crimson Concord"
 WET_SYL_F00_desc:0 "The vampire courts have spent centuries defending their independence from one another. Sylvania will offer a concord in which common strength need not begin with submission to a distant master."
 WET_SYL_F00_effect_tt:0 "Create §YThe Crimson Concord§! with Sylvania as its leader. Renounce any Covenant of the Black Hand."
 WET_SYL_F01:0 "Bloodlines Without a Master"
 WET_SYL_F01_desc:0 "Each bloodline carries traditions that its elders consider older and worthier than any rival's. Our charter must give those jealous inheritances a reason to work together."
 WET_SYL_F02:0 "A Conclave of the Night"
 WET_SYL_F02_desc:0 "A council of empty chairs would convince neither friend nor enemy. With other courts beside us, the concord can turn its disputed promises into common practice."
 WET_SYL_F03:0 "A Sovereignty of Blood"
 WET_SYL_F03_desc:0 "The assembled courts possess the patience to outlast treaties made for a single generation. Their combined strength will defend an independence that no member could secure alone."
 WET_SYL_F04:0 "An Eternal Concord"
 WET_SYL_F04_desc:0 "The courts now speak through a common council, and their servants carry supplies between distant strongholds. Sylvania will turn that shared authority and patient preparation into an alliance built to endure."
 WET_SYL_F10:0 "Reach Blood Dragons"
 WET_SYL_F10_desc:0 "The Blood Dragons judge an embassy by the courage of those who carry it. Our heralds will approach their halls with terms worthy of a warrior court."
 WET_SYL_F11:0 "A Tournament of Crimson Lances"
 WET_SYL_F11_desc:0 "A tournament can acknowledge martial pride without spending it upon a needless feud. The crimson lances will meet beneath rules that let respect survive the contest."
 WET_SYL_F12:0 "Invite Ordo Draconis"
 WET_SYL_F12_desc:0 "The warriors of Ordo Draconis need no assurance that they can fight alone. We will offer them a cause in which their strength helps preserve the independence of every allied court."
 WET_SYL_F12_effect_tt:0 "Invite [A76.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F20:0 "Reach The Black Duke"
 WET_SYL_F20_desc:0 "Mousillon has endured the hostility of its neighbours without surrendering its own claim to rule. Our envoys will seek the Black Duke through the roads that respectable courts prefer to forget."
 WET_SYL_F21:0 "Recognise the Black Duke"
 WET_SYL_F21_desc:0 "Recognition costs little to a distant prince and much to one denied it at home. Sylvania will acknowledge the Black Duke as a ruler whose promises deserve a formal hearing."
 WET_SYL_F22:0 "Invite Mousillon"
 WET_SYL_F22_desc:0 "The concord offers Mousillon allies beyond the reach of its immediate enemies. Its court may take a place among rulers who understand the price of standing apart."
 WET_SYL_F22_effect_tt:0 "Invite [A20.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F30:0 "Reach The Heirs of Mourkain"
 WET_SYL_F30_desc:0 "The heirs of Mourkain carry the memory of a kingdom that their rivals would rather see forgotten. Our messengers will approach them without treating that inheritance as an embarrassment."
 WET_SYL_F31:0 "Honour the Ruined Kingdom"
 WET_SYL_F31_desc:0 "A ruined throne can still gather loyalties that no conqueror succeeded in burying. We will honour Mourkain through ceremonies its surviving heirs recognize as their own."
 WET_SYL_F32:0 "Invite Sires of Mourkain"
 WET_SYL_F32_desc:0 "The heirs of the ruined kingdom need not abandon their memory to share our future. The concord will offer them a recognized voice beside the other deathless courts."
 WET_SYL_F32_effect_tt:0 "Invite [B16.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F40:0 "Reach The Ghoul King"
 WET_SYL_F40_desc:0 "Vorag rules through appetites and loyalties that a polished envoy might misunderstand. Our messengers will learn the court before presuming to address its master."
 WET_SYL_F41:0 "A Feast for the Ghoul King"
 WET_SYL_F41_desc:0 "The Ghoul King will judge a gift by the needs of his followers. Suitable provisions and careful ceremony may achieve what a beautiful seal cannot."
 WET_SYL_F42:0 "Invite Vorag"
 WET_SYL_F42_desc:0 "Vorag has been courted often enough by those who expect obedience in return. Our invitation will state the obligations of the concord plainly before asking for his seal."
 WET_SYL_F42_effect_tt:0 "Invite [B27.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F50:0 "Reach The Queen of Mysteries"
 WET_SYL_F50_desc:0 "The Queen of Mysteries has watched younger courts rise and vanish. Our embassy will acknowledge that patient authority before presenting its own ambitions."
 WET_SYL_F51:0 "A Seat for the Queen of Mysteries"
 WET_SYL_F51_desc:0 "A seat offered without influence would insult the queen more than silence. The concord will make room for her counsel in matters her servants understand better than ours."
 WET_SYL_F52:0 "Invite New Lahmia"
 WET_SYL_F52_desc:0 "New Lahmia has guarded its independence through centuries of calculated bargains. Its queen may find the concord useful if membership strengthens the throne she already holds."
 WET_SYL_F52_effect_tt:0 "Invite [U18.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F60:0 "Reach The Drowned Court"
 WET_SYL_F60_desc:0 "The courts of the Vampire Coast draw their strength from waters few living captains willingly approach. Our envoys will carry their terms through those dangerous sea lanes."
 WET_SYL_F61:0 "Chart the Drowned Roads"
 WET_SYL_F61_desc:0 "The drowned roads are known through wrecks, soundings and the memories of undying crews. Their charts can teach our own quartermasters where a distant voyage may safely end."
 WET_SYL_F62:0 "Invite Vampire Coast"
 WET_SYL_F62_desc:0 "A court commanding distant shores can give the concord a reach its inland castles lack. The Vampire Coast will be invited to share in the alliance without yielding its own command."
 WET_SYL_F62_effect_tt:0 "Invite [V01.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F70:0 "Reach The Count of the Galleons"
 WET_SYL_F70_desc:0 "The count of the galleons has carried an old bloodline's ambitions far beyond its birthplace. Our messengers will follow that wandering inheritance out upon the sea."
 WET_SYL_F71:0 "Blood of the Same Line"
 WET_SYL_F71_desc:0 "Shared blood has never prevented a feud, but it can provide the language in which one ends. Drakenhof will remind the sea-going count of the history his captains carry with them."
 WET_SYL_F72:0 "Invite Dreadfleet"
 WET_SYL_F72_desc:0 "The Dreadfleet's strength need not be spent in isolation from the courts ashore. Its ruler will be offered a place in councils concerned with more than the next captured harbour."
 WET_SYL_F72_effect_tt:0 "Invite [V19.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_F80:0 "Reach The Eastern Dead"
 WET_SYL_F80_desc:0 "Beyond the familiar sea lanes, eastern dead keep courts of their own. Our heralds will seek the fleet whose banners have carried their authority into distant waters."
 WET_SYL_F81:0 "Silks from the Dead Emperor"
 WET_SYL_F81_desc:0 "The eastern holds carry fine cloth and crafted goods that our merchants seldom see. A patient exchange will give both courts something useful to preserve."
 WET_SYL_F82:0 "Invite Dead Flag Fleet"
 WET_SYL_F82_desc:0 "The Dead Flag Fleet has crossed enough seas to know the limits of a lonely port. The concord offers recognized friends at the far end of its voyages."
 WET_SYL_F82_effect_tt:0 "Invite [I33.GetNameDef] to the Crimson Concord. Acceptance grants it §YThe Crimson Compact§!: factory output, construction and recovery §G+5%§!.\nDaily Unaligned support §G+0.15§!."
 WET_SYL_H00:0 "Whispers Behind Barred Doors"
 WET_SYL_H00_desc:0 "Behind shuttered windows, village elders speak of rulers who must answer to the living. A stolen hour after curfew becomes the beginning of a different Sylvania."
 WET_SYL_H00_effect_tt:0 "Commit to the living rebellion. Close the Mannfred and Vlad succession paths and renounce any Covenant of the Black Hand."
 WET_SYL_H01:0 "Arms Beneath the Floorboards"
 WET_SYL_H01_desc:0 "Smiths hide spearheads among ploughshares. Ferrymen carry sealed bundles past the collectors of the night court."
 WET_SYL_H01_effect_tt:0 "Prepare §Y2,400 Infantry Equipment§! and §Y100 Wagons§! for the living uprising."
 WET_SYL_H02:0 "The Abbey of Aethelbert"
 WET_SYL_H02_desc:0 "A messenger seeks the Abbey of Aethelbert the Vigilant. The hunters of Siegfriedhof offer knowledge that frightened villagers cannot find in a count's library."
 WET_SYL_H02_effect_tt:0 "Prepare a free Morrite chaplain for the uprising: army recovery §G+5%§! while serving."
 WET_SYL_H03:0 "Summon Helhunten"
 WET_SYL_H03_desc:0 "The Redeemers have buried kin taken by the undead. Their witch hunter teaches village captains to recognize a vampire's servants and keep a frightened line together."
 WET_SYL_H03_effect_tt:0 "Joseph von Helhunten will join the uprising if available.\nOtherwise a local hunter-captain will take command."
 WET_SYL_H04:0 "Ring the Living Bells"
 WET_SYL_H04_desc:0 "The bells that warned villagers to bar their doors now summon them into the streets. Human watchmen seize the western roads and raise Morr's raven against the bat of Drakenhof."
 WET_SYL_H04_effect_tt:0 "Begin the living uprising. Retain control of Sylvania in Schwartzhafen with four equipped militia divisions.\nMannfred and the existing undead army hold Drakenhof. Adopt Order government, Limited Conscription and Partial Mobilization."
 WET_SYL_H05:0 "Break the Grave-Bonds"
 WET_SYL_H05_desc:0 "Hunters follow the corpse carts to the graves from which replacements are drawn. Consecrated earth and broken necromantic fetters deny Mannfred an obedient reserve."
 WET_SYL_H05_effect_tt:0 "The vampire court: Organization §R−20%§! and recovery §R−20%§! for §Y180 days§!, ending when its war with us ends."
 WET_SYL_H06:0 "Dawn over Drakenhof"
 WET_SYL_H06_desc:0 "The castle falls to men who once lowered their eyes at its gates. Its keys pass to representatives of the towns, villages and clergy."
 WET_SYL_H06_effect_tt:0 "Reunify human Sylvania and restore Drakenhof as the capital."
 WET_SYL_H07:0 "Reopen the Gardens of Morr"
 WET_SYL_H07_desc:0 "Graves are given names again. Priests and grave wardens reopen the burial grounds, beyond the reach of the castle's muster rolls."
 WET_SYL_H08:0 "The Watch at the Graveyard Gate"
 WET_SYL_H08_desc:0 "Black-armoured guardians take silent posts at the reclaimed graveyards. They protect the resting dead and the frightened families who come to mourn."
 WET_SYL_H09:0 "The Dead Shall Rest"
 WET_SYL_H09_desc:0 "Morr's law becomes the pledge of the new government: no grave is an armoury, and no corpse belongs to the state. The surviving necromancers will find a watchful county."
 WET_SYL_H09_effect_tt:0 "Defense against current undead enemies: §G+10%§!."
 WET_SYL_H10:0 "Helhunten's Redeemers"
 WET_SYL_H10_desc:0 "The Redeemers' black and tan colours become familiar on the training fields. Their veterans teach the levies to hold against foes that neither bleed nor plead."
 WET_SYL_H11:0 "Ravens over Hunger Wood"
 WET_SYL_H11_desc:0 "Raven Knights ride with local guides along the forest roads. They seek surviving masters of the dead before another hidden court can gather an army."
 WET_SYL_H12:0 "The Waldenhof Charter"
 WET_SYL_H12_desc:0 "Town representatives and parish elders write the limits of their rulers' power. Waldenhof's civic traditions supply charters and offices to replace commands from the crypt."
 WET_SYL_H13:0 "Captains of Mortal Blood"
 WET_SYL_H13_desc:0 "A commission rests on service and judgment. The children of the levy may rise without surrendering their humanity to the Blood Kiss."
 WET_SYL_H14:0 "Remember Count Martin"
 WET_SYL_H14_desc:0 "Hel Fenn proved that Mannfred could be defeated by the living. Veterans study Count Martin's coalition and the patient preparation that ended the Vampire Wars."
 WET_SYL_H15:0 "The Compact of Wurtbad"
 WET_SYL_H15_desc:0 "Stirland remembers the victory behind its claim; Sylvania remembers the neglect that followed. The council offers a guarded frontier in exchange for a charter protecting its government."
 WET_SYL_H15_effect_tt:0 "Ask Stirland to recognize our autonomous government and exchange military access and a non-aggression pact."
 WET_SYL_H16:0 "An Embassy in Daylight"
 WET_SYL_H16_desc:0 "The envoys ride openly beneath raven and hammer. They ask the Emperor to recognize a living province and receive its soldiers as allies."
 WET_SYL_H16_effect_tt:0 "Request sovereign admission to the Imperial alliance."
 WET_SYL_H17:0 "Sylvania Beneath the Sun"
 WET_SYL_H17_desc:0 "Mist still hangs over the moors, and watchfires burn beside the roads. Yet the harvest belongs to those who sow it, and children may inherit a home rather than a grave."
 WET_SYL_Helhunten:0 "Joseph von Helhunten"
 WET_SYL_HunterCaptain:0 "Captain of the Shroud"
 WET_SYL_I00:0 "[GetSylvanianI00Name]"
 WET_SYL_I00_desc:0 "[GetSylvanianI00Description]"
 WET_SYL_I00_desc_human:0 "The workshop doors are open, and their keys no longer belong to the night court. Craftsmen will return to benches whose tools can serve the people who use them."
 WET_SYL_I00_desc_vampire:0 "Shuttered workshops stand beside roads that still carry the county's wealth to its castles. Opening them again will put familiar tools back into the hands of Sylvanian craftsmen."
 WET_SYL_I00_human:0 "Open the Shuttered Workshops"
 WET_SYL_I00_vampire:0 "Wake the Silent Workshops"
 WET_SYL_I01:0 "[GetSylvanianI01Name]"
 WET_SYL_I01_desc:0 "[GetSylvanianI01Description]"
 WET_SYL_I01_desc_human:0 "The guilds of Drakenhof remember skills that survived even the count's harshest demands. Paid work and public contracts will give those skills a place in the restored county."
 WET_SYL_I01_desc_vampire:0 "The castle's bells need not mark the end of every working day. Under careful supervision, tireless servants can carry supplies while skilled artisans keep the capital's workshops alive."
 WET_SYL_I01_human:0 "The Drakenhof Guilds"
 WET_SYL_I01_vampire:0 "Drakenhof's Night Shift"
 WET_SYL_I02:0 "Schwartzhafen Foundries"
 WET_SYL_I02_desc:0 "Schwartzhafen's workshops stand close to the roads and river traffic of the western county. New furnaces there will turn arriving metal into arms fit for our own musters."
 WET_SYL_I03:0 "Grave-Iron Seams"
 WET_SYL_I03_desc:0 "The old workings contain seams abandoned when labourers and timber became scarce. The count's servants will reopen the passages and bring their iron back to daylight."
 WET_SYL_I04:0 "[GetSylvanianI04Name]"
 WET_SYL_I04_desc:0 "[GetSylvanianI04Description]"
 WET_SYL_I04_desc_human:0 "The deepest workings need supports and careful supervision before men can safely return. The county will invest in both before asking miners to descend."
 WET_SYL_I04_desc_vampire:0 "Surface workings cannot supply every ambition gathering beneath Drakenhof. The miners will follow the older shafts into deposits their predecessors lacked the strength to reach."
 WET_SYL_I04_human:0 "Miners of the Reclaimed Hills"
 WET_SYL_I04_vampire:0 "Deepen the Old Shafts"
 WET_SYL_I05:0 "Treasures of the Barrow Kings"
 WET_SYL_I05_desc:0 "The barrows preserve ornaments whose value has survived the kingdoms that buried them. Careful excavation will recover both their treasures and the craft knowledge concealed beneath the earth."
 WET_SYL_I06:0 "Gems Beneath the Chapel"
 WET_SYL_I06_desc:0 "Cracked stone beneath an abandoned chapel has revealed veins the villagers once feared to touch. Surveyors will mark the safest workings before the first new cutting begins."
 WET_SYL_I07:0 "Morrslieb Shards"
 WET_SYL_I07_desc:0 "Fragments fallen beneath Morrslieb's light lie hidden among the county's older excavations. Guarded expeditions will separate the useful shards from the soil that conceals them."
 WET_SYL_I08:0 "The Blackstone Adits"
 WET_SYL_I08_desc:0 "The blackstone workings demand patience, strong supports and servants who will obey a warning. Deepening their adits will give the court a steadier supply for its forbidden workshops."
 WET_SYL_I09:0 "[GetSylvanianI09Name]"
 WET_SYL_I09_desc:0 "[GetSylvanianI09Description]"
 WET_SYL_I09_desc_human:0 "The woods still conceal creatures that the rising did not destroy. Armed patrols will guard the cutters and the roads by which their timber reaches the towns."
 WET_SYL_I09_desc_vampire:0 "The woodcutters know which paths through the Ghoul Wood still admit a loaded wagon. Guards and labourers will keep those paths open long enough to bring sound timber home."
 WET_SYL_I09_human:0 "Wardens of the Ghoul Wood"
 WET_SYL_I09_vampire:0 "Timber of the Ghoul Wood"
 WET_SYL_I10:0 "[GetSylvanianI10Name]"
 WET_SYL_I10_desc:0 "[GetSylvanianI10Description]"
 WET_SYL_I10_desc_human:0 "The harvest now belongs to families who may keep the fruits of their labour. Repaired ditches and shared teams will help abandoned fields return to cultivation."
 WET_SYL_I10_desc_vampire:0 "A harvested field sustains the living hands upon which the county still depends. Tireless labour will clear ditches and carry loads while the villagers tend the work that requires their judgment."
 WET_SYL_I10_human:0 "Fields for the Living"
 WET_SYL_I10_vampire:0 "Dead Hands, Living Fields"
 WET_SYL_I11:0 "Roads Through the Mists"
 WET_SYL_I11_desc:0 "A cart lost in the mist can hold more than its owner can afford to replace. Marked routes and maintained surfaces will make the county's roads useful through another winter."
 WET_SYL_I12:0 "Bridge the Schwarzwasser"
 WET_SYL_I12_desc:0 "The Schwarzwasser divides workshops and villages that ought to supply one another. Sound crossings will shorten the journeys of merchants, labourers and marching troops alike."
 WET_SYL_I13:0 "[GetSylvanianI13Name]"
 WET_SYL_I13_desc:0 "[GetSylvanianI13Description]"
 WET_SYL_I13_desc_human:0 "The county guard cannot live forever upon arms hidden for the first rising. Its armourers will establish a dependable supply for those who now stand watch in the open."
 WET_SYL_I13_desc_vampire:0 "The oldest retainers deserve more than whatever rusted harness survived beside their graves. Dedicated armourers will restore equipment worthy of the household's place in battle."
 WET_SYL_I13_human:0 "Armour for the County Guard"
 WET_SYL_I13_vampire:0 "Armour for the Grave Guard"
 WET_SYL_I14:0 "[GetSylvanianI14Name]"
 WET_SYL_I14_desc:0 "[GetSylvanianI14Description]"
 WET_SYL_I14_desc_human:0 "The workshop masters can finally teach apprentices without hiding their best tools from the castle's servants. Shared standards will make their work useful beyond the needs of a single town."
 WET_SYL_I14_desc_vampire:0 "A skilled craftsman cannot be replaced by ordering a corpse to imitate his hands. The workshops will pair living judgment with the patient strength of servants who never tire."
 WET_SYL_I14_human:0 "Engineers of the Restoration"
 WET_SYL_I14_vampire:0 "Necromantic Workshops"
 WET_SYL_I15:0 "[GetSylvanianI15Name]"
 WET_SYL_I15_desc:0 "[GetSylvanianI15Description]"
 WET_SYL_I15_desc_human:0 "A well-supplied furnace should not require exhausted workers to remain beside it through every night. Organized shifts will preserve both the smiths and the output upon which the county depends."
 WET_SYL_I15_desc_vampire:0 "Furnaces lose time whenever supplies fail or an exhausted shift must abandon its work. Better arrangements between smiths and their servants will keep each firing useful for longer."
 WET_SYL_I15_human:0 "The Guilds' Great Furnaces"
 WET_SYL_I15_vampire:0 "Forges That Never Cool"
 WET_SYL_I16:0 "[GetSylvanianI16Name]"
 WET_SYL_I16_desc:0 "[GetSylvanianI16Description]"
 WET_SYL_I16_desc_human:0 "Books once kept for a lord's private ambitions will be placed under the council's scrutiny. A college of permitted studies will preserve useful knowledge and record the dangers that must remain guarded."
 WET_SYL_I16_desc_vampire:0 "Forbidden knowledge has too often depended upon the private notebooks of a single jealous master. Drakenhof will gather scholars into an institution capable of preserving their work beyond its first patrons."
 WET_SYL_I16_human:0 "The Waldenhof Collegium"
 WET_SYL_I16_vampire:0 "A University of Forbidden Arts"
 WET_SYL_I17:0 "[GetSylvanianI17Name]"
 WET_SYL_I17_desc:0 "[GetSylvanianI17Description]"
 WET_SYL_I17_desc_human:0 "The restored county now possesses workshops able to serve more than immediate survival. Its people will build the stores and tools that make freedom durable through another winter."
 WET_SYL_I17_desc_vampire:0 "The county's workshops, mines and roads now serve something larger than the needs of separate castles. Their combined output will sustain a realm whose ambitions cannot wait for another lifetime."
 WET_SYL_I17_human:0 "An Industry for the Living"
 WET_SYL_I17_vampire:0 "An Industry Beyond Death"
 WET_SYL_Isabella:0 "Isabella von Carstein"
 WET_SYL_L00:0 "The Vampire Lords"
 WET_SYL_L00_desc:0 "The blood grants strength, but it does not give every vampire the judgment to command. The court will identify those whose ambitions can be put to useful service."
 WET_SYL_L01:0 "The Blood Kiss"
 WET_SYL_L01_desc:0 "The Blood Kiss brings a chosen servant into an inheritance measured in centuries. New lords and established captains alike must learn what that inheritance demands upon a battlefield."
 WET_SYL_L02:0 "Predatory Instinct"
 WET_SYL_L02_desc:0 "A hunter learns to recognize the instant when resistance begins to fail. Our lords will bring that instinct to the direction of whole formations."
 WET_SYL_L03:0 "Stone-Cold Patience"
 WET_SYL_L03_desc:0 "An immortal can afford patience that a frightened mortal mistakes for hesitation. The court's captains will learn to make an enemy spend its strength against a prepared defence."
 WET_SYL_L04:0 "Centuries of Campaigning"
 WET_SYL_L04_desc:0 "The veterans of old campaigns remember mistakes that living officers must discover anew. Their accounts will become instruction for every commander who serves beneath our banners."
 WET_SYL_L05:0 "Masters of the Grave Train"
 WET_SYL_L05_desc:0 "An army's servants must still arrive where their masters need them. The lords will study roads, stores and marching order with the same attention they give an enemy's weaknesses."
 WET_SYL_L06:0 "Command of the Lesser Dead"
 WET_SYL_L06_desc:0 "A lesser necromancer may obey a command without understanding the battle it serves. Clear authority will let our senior captains direct many such servants as one host."
 WET_SYL_L07:0 "Disciplines of the Bloodline"
 WET_SYL_L07_desc:0 "The bloodlines preserve different answers to the same problems of war. Their most useful disciplines will be taught beyond the jealous households that first developed them."
 WET_SYL_L08:0 "The Council of the Undying"
 WET_SYL_L08_desc:0 "A council of deathless captains can compare campaigns fought across many kinds of country. Those who listen will inherit experience no single lifetime could have gathered."
 WET_SYL_L09:0 "Lords of Endless War"
 WET_SYL_L09_desc:0 "The court now possesses more than a collection of dangerous individuals. Its lords will carry a shared inheritance of command into every future war."
 WET_SYL_M00:0 "Confirm Mannfred's Rule"
 WET_SYL_M00_desc:0 "Mannfred survived where greater armies and louder claims brought his predecessors to ruin. He will make that survival the foundation of a crown no rival can dismiss."
 WET_SYL_M00_effect_tt:0 "Confirm Mannfred as ruler. His personal leadership grants Political Power Gain §G+10%§! and research speed §G+5%§!."
 WET_SYL_M01:0 "The Count's Hidden Library"
 WET_SYL_M01_desc:0 "Behind the public chambers of Drakenhof lie books whose owners vanished centuries ago. Mannfred's librarians will follow their marginal notes into knowledge that more cautious scholars abandoned."
 WET_SYL_M02:0 "Necromancy Without a Master"
 WET_SYL_M02_desc:0 "The count has studied too many masters to place his own art beneath another's judgment. His necromancers will learn to sustain their formations through discipline as well as borrowed power."
 WET_SYL_M03:0 "Envoys to the Silver Pinnacle"
 WET_SYL_M03_desc:0 "The road to the Silver Pinnacle carries more than merchants and frightened petitioners. Mannfred will send envoys whose gifts acknowledge the age and ambition of its queen."
 WET_SYL_M04:0 "A Marriage of Night and Shadow"
 WET_SYL_M04_desc:0 "A marriage between Drakenhof and the Silver Pinnacle would join two courts accustomed to ruling from the shadows. Mannfred offers Neferata a crown beside his own, bound to Sylvanian overlordship by an explicit bargain."
 WET_SYL_M04_effect_tt:0 "Propose a diplomatic marriage to Neferata. Acceptance makes New Lahmia our puppet, with Neferata remaining its ruler."
 WET_SYL_M05:0 "Her Agents, His Ambitions"
 WET_SYL_M05_desc:0 "Neferata's servants hear conversations that never reach a prince's council chamber. A shared court could turn those scattered whispers into knowledge useful to both their ambitions."
 WET_SYL_M06:0 "The Ringless Heir"
 WET_SYL_M06_desc:0 "Mannfred cannot borrow the legend that once gathered around Vlad's name. He must teach his captains to fear and follow the ruler who stands before them."
 WET_SYL_M06_effect_tt:0 "Mannfred's personal leadership gains Army Attack §G+5%§!."
 WET_SYL_M07:0 "The Carstein Gambit"
 WET_SYL_M07_desc:0 "A rival who sees every piece upon the board has already been shown too much. Mannfred will prepare his reserves and promises before revealing the campaign they serve."
 WET_SYL_N00:0 "The Covenant of the Black Hand"
 WET_SYL_N00_desc:0 "Arkhan's couriers offer a place in the work gathering around the Black Hand. Sylvania may lend its strength to that covenant without pretending its own ambitions have vanished."
 WET_SYL_N00_effect_tt:0 "Sign the Covenant of the Black Hand and establish a non-aggression pact with [U24.GetNameDef]."
 WET_SYL_N01:0 "A Seat Beside Nagash"
 WET_SYL_N01_desc:0 "A pledge of assistance does not by itself settle the place of our armies in the coming war. The court will seek a recognized seat within Nagashizzar's alliance."
 WET_SYL_N01_effect_tt:0 "Request sovereign admission to [U24.GetNameDef]’s alliance."
 WET_SYL_N02:0 "Arkhan's Correspondence"
 WET_SYL_N02_desc:0 "Arkhan's letters answer questions that generations of lesser necromancers have left unresolved. Our scholars will compare his patient instruction with the forbidden volumes of Drakenhof."
 WET_SYL_N03:0 "The Drakenhof Delegation"
 WET_SYL_N03_desc:0 "The count's delegates carry servants, records and the experience of the Vampire Wars. Their arrival will make Sylvania's contribution something more substantial than a seal upon a covenant."
 WET_SYL_N04:0 "Archives of Necromancy"
 WET_SYL_N04_desc:0 "Knowledge hoarded in separate crypts is too easily lost when its keeper falls. The allied courts will establish a correspondence between their guarded archives."
 WET_SYL_N05:0 "Lessons from Cripple Peak"
 WET_SYL_N05_desc:0 "The works beneath Cripple Peak reveal what necromancy can accomplish when many disciplines serve one design. Sylvanian scholars will study those methods without surrendering the judgment of their own court."
 WET_SYL_N06:0 "Legions for the Undying King"
 WET_SYL_N06_desc:0 "Promises to the Black Hand must eventually take their place upon a battlefield. The count's captains will prepare legions worthy of the alliance's greatest musters."
 WET_SYL_N07:0 "Honour the Returned"
 WET_SYL_N07_desc:0 "Nagash has returned, and the promises made in anticipation now face their sovereign. Sylvania will acknowledge the moment while securing the place its service has earned."
 WET_SYL_N08:0 "One War Against Chaos"
 WET_SYL_N08_desc:0 "Chaos threatens the living lands from which even the deathless draw their strength. Our commanders will turn their preparations toward the enemies who would leave nothing fit to rule."
 WET_SYL_N08_effect_tt:0 "Attack against current Chaos enemies: §G+10%§! for §Y180 days§!."
 WET_SYL_N09:0 "First Among the Mortarchs"
 WET_SYL_N09_desc:0 "An immortal court measures precedence in service, power and memories that rivals would rather forget. Sylvania will make its place among the greatest servants of death impossible to overlook."
 WET_SYL_NAGASH_ALLIANCE:0 "The Black Hand"
 WET_SYL_V00:0 "Restore the First Count"
 WET_SYL_V00_desc:0 "The oldest servants of Drakenhof still speak of the first count as though he might enter the hall at any moment. A forbidden undertaking will turn their long remembrance into a summons."
 WET_SYL_V00_effect_tt:0 "Restore Vlad von Carstein as ruler and Field Marshal (skill 5). His leadership grants Army Defense §G+5%§! and recovery §G+5%§!. Mannfred remains a commander."
 WET_SYL_V01:0 "The First Count's Promise"
 WET_SYL_V01_desc:0 "The living remember that Vlad offered protection as well as obedience, however terrible the price of his rule. His returning household must give the villages reason to distinguish a count from a passing predator."
 WET_SYL_V02:0 "The Signet of Drakenhof"
 WET_SYL_V02_desc:0 "The count's seal once made a command recognizable far beyond the castle walls. Restoring its authority will bring distant servants back beneath the same patient hand."
 WET_SYL_V02_effect_tt:0 "Vlad's personal leadership gains recovery §G+5%§!."
 WET_SYL_V03:0 "Seek Isabella's Resting Place"
 WET_SYL_V03_desc:0 "Vlad will not accept that the woman who shared his crown should remain beyond his reach. His servants will search the old accounts and guarded resting places for a path back to Isabella."
 WET_SYL_V04:0 "Beloved in Death"
 WET_SYL_V04_desc:0 "The chambers prepared for the countess have stood silent through the rule of lesser heirs. Tonight their doors will open, and Vlad will face eternity beside Isabella once more."
 WET_SYL_V04_effect_tt:0 "Restore Isabella as a skill-4 general and free adviser. While serving as adviser: Stability §G+5%§!, army recovery §G+5%§!."
 WET_SYL_V05:0 "The Count Among His Soldiers"
 WET_SYL_V05_desc:0 "Vlad does not ask his captains to endure a battlefield he will not enter himself. His presence among the ranks will give their preparations the weight of a personal command."
 WET_SYL_V06:0 "An Oath to the Living"
 WET_SYL_V06_desc:0 "A village left to wolves and wandering ghouls cannot feed even an immortal lord's ambitions. The count will bind his protection to the duties he demands from the living."
 WET_SYL_V07:0 "Lord and Lady of Drakenhof"
 WET_SYL_V07_desc:0 "Drakenhof has endured many claimants, but few who could make its household move with a common purpose. Lord and lady together will restore the confidence of its oldest retainers."
 WET_SYL_V07_effect_tt:0 "Vlad's personal leadership gains Army Organization §G+5%§!."
 WET_SYL_Vlad:0 "Vlad von Carstein"
 WET_SYL_empire_admission_effect_tt:0 "Consent to Sylvania joining our alliance as a sovereign member. Reconcile any war between Sylvania and our alliance."
 WET_SYL_marriage_effect_tt:0 "New Lahmia becomes a direct puppet of Sylvania. Neferata remains its ruler."
 WET_SYL_nagash_admission_effect_tt:0 "Consent to Sylvania joining our alliance as a sovereign member."
 WET_SYL_stirland_effect_tt:0 "Recognize autonomous human Sylvania. Establish mutual military access and a non-aggression pact. A subject Stirland must secure its overlord’s consent."
 WET_SYL_uprising_allocation_effect_tt:0 "Command human Sylvania from Schwartzhafen. Four militia divisions use 24,000 living recruits and 2,400 prepared Infantry Equipment. Mannfred retains the existing undead forces and reserves in Drakenhof."
 modifier_army_sub_unit_heavy_armor_breakthrough_factor:0 "Large Monsters Breakthrough"
