 wet_sylvania.145.0:0 "We accept these terms."
 wet_sylvania.145.1:0 "We must refuse."
 wet_sylvania.145.d:0 "Mannfred offers a dynastic bond between Drakenhof and the Silver Pinnacle. Neferata would retain her throne and servants, but her realm would acknowledge Sylvania's overlordship. The proposed marriage is a bargain between two ambitious courts."
 wet_sylvania.145.t:0 "A Marriage of Night and Shadow"
 wet_sylvania.146.0:0 "Let the county answer."
 wet_sylvania.146.d:0 "The western watch has opened the gates. From Siegfriedhof come the hunters of the Shroud, carrying the names of kin taken by the night. At Schwartzhafen, village elders and parish clergy swear to govern together until the county is free. Across the moors, Mannfred gathers his court at Drakenhof. The bells are no longer a warning to hide. They are the summons of the living."
 wet_sylvania.146.t:0 "The Bells Are Answered"
 wet_sylvania.147.0:0 "Let the doors stand open."
 wet_sylvania.147.d:0 "The keys of the castle lie on a plain wooden table. No count sits at its head. Townsmen, village elders and the clergy of Morr and Sigmar hear the names of those who did not survive the rising. Their victory has driven the vampire court from power; it has not erased the graves, the hunger or the mist. Those burdens now belong to a government answerable to the living."
 wet_sylvania.147.t:0 "The Keys of Drakenhof"
 wet_sylvania.148.0:0 "This land belongs to the living."
 wet_sylvania.148.d:0 "A family gathers beside a grave marked with a name. No collector waits to claim the body, and no bell warns them away from the churchyard. Beyond the wall, a watchman still carries a sharpened stake. Hunger Wood remains dark, and the ruins have not forgotten their masters. Yet the harvest belongs to those who sow it, and the dead may at last be mourned."
 wet_sylvania.148.t:0 "Names upon the Stones"
 wet_sylvania.149.0:0 "The court has heard the answer."
 wet_sylvania.149.d:0 "Stirland has recognized the council and its charter. The roads between our realms are open to our soldiers; the county keeps its own government and owes no fealty beyond the terms of the compact."
 wet_sylvania.149.t:0 "The Compact of Wurtbad — Accepted"
 wet_sylvania.150.0:0 "The court has heard the answer."
 wet_sylvania.150.d:0 "The envoys have returned without a compact. Sylvania may still govern itself and complete the Waldenhof Charter; recognition from Wurtbad was never the source of its authority."
 wet_sylvania.150.t:0 "The Compact of Wurtbad — Unfulfilled"
 wet_sylvania.151.0:0 "Permit the compact."
 wet_sylvania.151.1:0 "We will not recognize these terms."
 wet_sylvania.151.d:0 "Our Stirlander vassal asks leave to recognize the free council of Sylvania. The terms establish mutual access and a pact of peace without placing Sylvania beneath another crown."
 wet_sylvania.151.t:0 "The Sylvanian Charter"
 wet_sylvania.152.0:0 "Recognize the council and its charter."
 wet_sylvania.152.1:0 "The claim of our counts still stands."
 wet_sylvania.152.d:0 "The council recalls the victory of Count Martin, but also the years in which its villages stood alone. Its envoys offer open roads and a guarded frontier in exchange for recognition of their own government. The charter would bind neighbours without making either one's people the property of the other."
 wet_sylvania.152.t:0 "The Compact of Wurtbad"
