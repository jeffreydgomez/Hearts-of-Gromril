 modifier_army_sub_unit_infantry_attack_factor:0 "Realm Infantry Attack"
 modifier_army_sub_unit_infantry_attack_factor_tt:0 "$modifier_army_sub_unit_infantry_attack_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_infantry_defence_factor:0 "Realm Infantry Defense"
 modifier_army_sub_unit_infantry_defence_factor_tt:0 "$modifier_army_sub_unit_infantry_defence_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_infantry_max_org_factor:0 "Realm Infantry Organization"
 modifier_army_sub_unit_infantry_max_org_factor_tt:0 "$modifier_army_sub_unit_infantry_max_org_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_light_armor_attack_factor:0 "Heavy Cavalry Attack"
 modifier_army_sub_unit_light_armor_attack_factor_tt:0 "$modifier_army_sub_unit_light_armor_attack_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_light_armor_breakthrough_factor:0 "Heavy Cavalry Breakthrough"
 modifier_army_sub_unit_light_armor_breakthrough_factor_tt:0 "$modifier_army_sub_unit_light_armor_breakthrough_factor$: $RIGHT|+=%1$"
 modifier_army_sub_unit_medium_armor_attack_factor:0 "Small Monsters Attack"
 modifier_army_sub_unit_medium_armor_attack_factor_tt:0 "$modifier_army_sub_unit_medium_armor_attack_factor$: $RIGHT|+=%1$"
 wet_syl_a04:0 "The Second Death Denied"
 wet_syl_a04_desc:0 "Teach necromancers to restore damaged formations swiftly."
 wet_syl_a05:0 "Dead Men in Ranks"
