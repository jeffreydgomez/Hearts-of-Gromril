 wet_realm_measures:0 "Measures of the Realm"
 wet_realm_measures_desc:0 "Rally public support, mobilise the economy and draw on the realm’s traditions and faith.\n\nRace, condition, culture and faith actions share one active slot. Days remaining: [?wet_id_remaining|0]"
 wet_gather_arms_from_populace:0 "Gather Arms from the Populace"
 wet_gather_arms_from_populace_desc:0 "Collect weapons from households, hunting lodges and local armouries to replenish our military stores. Taking these arms will unsettle the populace and weaken enthusiasm for war."
 wet_gather_arms_from_populace_effect_tt:0 "Gain §G1,000§! §Y$infantry_equipment_0$§! per §Y100,000§! population in our owned states, including non-core states. The amount scales proportionally with population.\nAvailable again after §Y90 days§!."
