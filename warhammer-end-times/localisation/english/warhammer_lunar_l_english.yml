 wet_lunar_weight_of_heavens:0 "The Weight of the Heavens"
 wet_lunar_weight_of_heavens_desc:0 "Mazdamundi and the Slann have spent their strength resisting the green moon. The surviving councils bear the exhaustion for two years."
 wet_lunar_horned_rat_ascendant:0 "The Horned Rat Ascendant"
 wet_lunar_horned_rat_ascendant_desc:0 "Morrslieb has struck the world. The Underempire draws terrible strength from the fulfilment of its prophecy."
 wet_lunar_category:0 "Morrslieb — Range [?global.wet_lunar_range|0] / 7"
 wet_lunar_range:0 "Morrslieb’s range"
 wet_lunar_uses:0 "Previous lunar interventions, capped at five"
 wet_lunar_cooldown:0 "A sixty-day lunar commitment is still active"
 wet_lunar_active:0 "The struggle over Morrslieb has begun"
 wet_lunar_impact:0 "Morrslieb has struck the world"
 wet_lunar_initialized:0 "Morrslieb’s orbit has been recorded"
 wet_lunar_category_desc:0 "§Y7§! Distant orbit → 6 → 5 → 4 → 3 → 2 → 1 → §R0 Impact§!\n\nOur next intervention: §Y[?wet_lunar_next_pp|0] Political Power§! and §Y[?wet_lunar_next_civs|0] Civilian Factories§!. Currently reserved: §Y[?wet_lunar_reserved|0]§!; commitment remaining: §Y[?wet_lunar_days|0] days§!.\n\nUnderempire commitment: [?U25.wet_lunar_days|0] days remaining. Hexoatl commitment: [?V04.wet_lunar_days|0] days remaining.\n\nMovement is immediate. Each country may intervene once every sixty days. Range seven does not end the contest; range zero resolves impact immediately. There is no automatic drift."
 wet_lunar.1.t:0 "Morrslieb Descends"
 wet_lunar.1.d:0 "The Morskittar Engine has dragged the green moon into a nearer orbit. Hexoatl and the Underempire now contest its course, committing political authority and industrial labour with each intervention."
 wet_lunar.1.a:0 "The heavens have changed."
 wet_lunar.2.t:0 "The Green Moon Falls"
 wet_lunar.2.d:0 "Morrslieb has struck the world. Fragments and Warpstone scatter across the lands, while the exhausted Slann and exultant Underempire face the consequences of the struggle."
 wet_lunar.2.a:0 "The heavens have changed."
