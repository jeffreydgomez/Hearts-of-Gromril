l_english:
 wet_lunar_reservation_0:0 "The Work of Moving Morrslieb"
 wet_lunar_reservation_0_desc:0 "5 civilian factories sustain the lunar intervention for sixty days. The orbital movement occurred when the work began."
 wet_lunar_pull_0:0 "Draw Morrslieb Closer"
 wet_lunar_pull_0_desc:0 "Move Morrslieb §Yone range step immediately§!. Pay §Y50 Political Power§! and commit §Y5 Civilian Factories§! for §Y60 days§!. Another intervention becomes available after sixty days. Each paid use raises this country’s next price by 10 Political Power and one factory, capped at 100 and ten."
 wet_lunar_pull_0_tt:0 "Morrslieb moves §Y-1 range§! immediately. Reserve §Y5§! Civilian Factories for §Y60 days§!.\nNext use is available after the commitment ends."
 wet_lunar_push_0:0 "Push Morrslieb Away"
 wet_lunar_push_0_desc:0 "Move Morrslieb §Yone range step immediately§!. Pay §Y50 Political Power§! and commit §Y5 Civilian Factories§! for §Y60 days§!. Another intervention becomes available after sixty days. Each paid use raises this country’s next price by 10 Political Power and one factory, capped at 100 and ten."
