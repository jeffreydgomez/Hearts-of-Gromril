l_english:
 wet_nagash_majority.1.t:0 "The Shadow Claims the Court"
 wet_nagash_majority.1.d:0 "Supporters of Nagash now command a majority within our realm. His envoys demand that the crown acknowledge what the courts and streets already proclaim: one sovereign over death, and one allegiance beneath his shadow."
 wet_nagash_majority.1.a:0 "Our crown will not bow."
 wet_nagash_majority.1.b:0 "Recognise Nagash’s sovereignty."
 wet_nagash_majority_adopt_tt:0 "Adopt the §YNagash§! government under our current ruler."
 wet_nagash_majority_eligible:0 "Nagash support exceeds §Y50%§!, and our government does not follow Nagash."
