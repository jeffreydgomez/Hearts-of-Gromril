l_english:
 great_vortex:0 "Great Vortex"
 wet_vortex_category:0 "The Great Vortex and the Incarnates"
 wet_vortex_category_desc:0 "The Great Vortex holds back the tides of Chaos. Its destruction will drown Ulthuan and release eight Winds of Magic. Each Wind can bind to only one of three champions, once in the entire world."
 wet_vortex_destroy:0 "Destroy the Great Vortex"
 wet_vortex_destroy_desc:0 "Tear apart the ancient wards of the Isle of the Dead. Vast tracts of Ulthuan will sink beneath the sea, killing a quarter of the population in every Ulthuan state, destroying a quarter of its civilian and military factories, and permanently reducing building slots by 25%. The Vortex site retains its one-slot limit. The Winds will be free for mortal champions to claim, and Archaon will gain 20% Division Organization."
 wet_vortex_destroy_tt:0 "§REvery Ulthuan state immediately loses 25% of its current population.§!\n§RDestroy 25% of Ulthuan’s current civilian and military factories combined§!, rounded to the nearest whole factory across the island. Losses are distributed across states; dockyards are unaffected.\n§RPermanent -25% Building Slots§! in Ulthuan, except at the Vortex site, which retains its one-slot limit.\nThe Great Vortex landmark is destroyed.\nEight Incarnate claims become available worldwide, each costing §Y1,000 Political Power§! and requiring an eligible general.\nArchaon gains §YThe Winds of Chaos are Loose§!: §G+20% Division Organization§!.\nEvery country receives the news."
 wet_vortex_control_tt:0 "Controls the Great Vortex province on the Isle of the Dead."
 wet_vortex_flooded:0 "Sunken Ulthuan"
 wet_vortex_flooded_desc:0 "The collapse of the Great Vortex drowned settlements and workshops, killing a quarter of this state’s population and destroying a quarter of Ulthuan’s civilian and military factories. Submerged land permanently reduces this state’s building slots by 25%. Lost factories must be rebuilt from scratch within the remaining capacity."
 wet_vortex_sacred_site:0 "The Isle of the Dead"
 wet_vortex_sacred_site_desc:0 "The sacred Vortex site supports at most one shared building slot."
 wet_vortex_chaos_unleashed:0 "The Winds of Chaos are Loose"
 wet_vortex_chaos_unleashed_desc:0 "The Great Vortex no longer drains the world’s magic. Archaon’s hosts march beneath skies ablaze with unbound power."
 wet_vortex.1.t:0 "The Great Vortex Is Destroyed"
 wet_vortex.1.d:0 "[event_target:wet_vortex_destroyer.GetNameDefCap] has torn apart the Great Vortex. Immense stretches of Ulthuan have vanished beneath the sea. A quarter of every state’s population is dead, and 25% of the island’s civilian and military factories have been destroyed. Submerged land permanently reduces building slots by 25%, while the Vortex site retains its one-slot limit.\n\nEight Winds of Magic now seek mortal hosts. Each can be claimed by an eligible general for 1,000 Political Power, but only one champion in the world can bind each Wind. Archaon’s armies gain 20% organization as the restraints upon Chaos collapse."
 wet_vortex.1.a:0 "The world will never be the same."
 wet_vortex_cancel:0 "Abandon the claim and recover the 1,000 Political Power."
 wet_vortex_claim_tt:0 "Choose one eligible general to become this Wind’s sole Incarnate. The general receives a permanent, powerful command trait. Every country receives an announcement. If the claim is abandoned or another country claims the Wind first, the 1,000 Political Power is refunded."
 wet_vortex_incarnate:0 "Incarnate of a Wind of Magic"
 wet_vortex.10.0:0 "Bind Aqshy to Ungrim Ironfist."
 wet_vortex.10.1:0 "Bind Aqshy to Caradryan."
 wet_vortex.10.2:0 "Bind Aqshy to Imrik."
 wet_vortex_claim_aqshy:0 "Claim Aqshy, the Wind of Fire"
 wet_vortex_claim_aqshy_desc:0 "Pay 1,000 Political Power and choose a general to become the Incarnate of Fire. Eligible champions: Ungrim Ironfist, Caradryan, Imrik. The champion must be alive, recruited by our country and serving as a general or field marshal. Each Wind can be claimed once worldwide; each champion can bind only one Wind.\n\nPermanent command bonuses:\nDivision Attack: +60%\nDivision Defense: +35%\nDivision Organization: +25%\nBreakthrough: +35%"
 wet_incarnate_aqshy:0 "Incarnate of Fire"
 wet_incarnate_aqshy_desc:0 "The living vessel of Aqshy, the Wind of Fire."
 wet_incarnate_aqshy_effect_tt:0 "This general becomes the sole Incarnate of Fire, permanently gaining:\nDivision Attack: +60%\nDivision Defense: +35%\nDivision Organization: +25%\nBreakthrough: +35%"
 wet_vortex.10.t:0 "The Wind of Fire Seeks a Host"
 wet_vortex.10.d:0 "Aqshy is loose upon the world. Choose one of our eligible champions to bind it. The 1,000 Political Power has been paid; abandoning the claim refunds it. Another nation can claim the Wind while we deliberate.\n\nDivision Attack: +60%\nDivision Defense: +35%\nDivision Organization: +25%\nBreakthrough: +35%"
 wet_vortex.30.t:0 "The Incarnate of Fire"
 wet_vortex.30.d:0 "[event_target:wet_incarnate_aqshy_character.GetName] has bound Aqshy, the Wind of Fire, in the service of [event_target:wet_incarnate_aqshy_country.GetNameDef]. An immense new power has entered the wars of the End Times.\n\nThis Wind has been claimed and is no longer available to any other champion."
 wet_vortex.30.a:0 "A mortal has become something greater."
 wet_vortex_aqshy_claimed:0 "Aqshy has been claimed by an Incarnate"
 wet_vortex_aqshy_pending:0 "Choosing the Incarnate of Fire"
