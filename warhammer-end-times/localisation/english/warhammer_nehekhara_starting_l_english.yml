 wet_nehekhara_ancient_civilization:0 "Ancient Civilization"
 wet_nehekhara_ancient_civilization_desc:0 "The kingdoms of Nehekhara were ancient before the younger realms learned to raise their walls. Yet the rites and workshops of a vanished age cannot answer every demand of the present, and the deathless kings are slow to surrender the certainties of their former glory."
