 wet_archaon.207.t:0 "Service Beneath the Everchosen"
 wet_archaon.220.a:0 "Commission the champion."
 wet_archaon.220.a_effect:0 "Valkia Bloodskorn the Bloody already serves in our country and may join the field command."
 wet_archaon.220.d:0 "A new champion has entered the Everchosen’s service. Warriors gather to judge the newcomer, knowing that favour in this host must be defended as fiercely as it is won."
 wet_archaon.220.t:0 "A Champion of the Everchosen"
