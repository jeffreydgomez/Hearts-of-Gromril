 WET_ARC_REQUIRE_S06:0 "—"
 WET_ARC_REQUIRE_S23:0 "—"
 WET_ARC_REQUIRE_S25:0 "—"
 WET_ARC_REQUIRE_S35:0 "—"
 WET_ARC_REQUIRE_T10:0 "§Y10§! owned civilian/military factories and §Y100§! Political Power."
 WET_ARC_REQUIRE_T13:0 "§Y25§! owned civilian/military factories and §Y150§! Political Power."
 WET_ARC_REQUIRE_T22:0 "—"
 WET_ARC_REQUIRE_T35:0 "§Y250§! deployed aircraft/flyers.\nProgramme functioning."
 WET_ARC_S00:0 "The Dark Prince's Acclamation"
 WET_ARC_S00_desc:0 "The Dark Prince's servants understand the power of a promise that speaks to ambition. Their realm must be invited into the coalition under terms that serve the crown's greater design."
 WET_ARC_S00_special_tt:0 "Invite the patron realm to the Everchosen.\nThe invited realm must agree. Existing allies give §Y+10§! Political Power.\nUnavailable realms give §Y+25§! Political Power and may be invited later."
 WET_ARC_S01:0 "The Grand Coalition — Princes of Excess"
 WET_ARC_S01_desc:0 "The princes of excess will seek distinction even while they profess devotion. We shall offer them a coalition in which that desire can be turned toward the Everchosen's campaigns."
 WET_ARC_S02:0 "The Everchosen's Own — All Kneel to Me"
 WET_ARC_S02_desc:0 "The court must understand that its splendour reflects a single source of authority. Archaon's own household will make that principle visible to every petitioner who approaches the throne."
 WET_ARC_S03:0 "The Magnificent Prince"
 WET_ARC_S03_desc:0 "Sigvald's pride will not be satisfied by an ordinary summons. An offer worthy of his reputation may bring his service to the host, if he chooses to accept its price and obligations."
 WET_ARC_S03_special_tt:0 "Offer §YSigvald the Magnificent§! command of an army. If accepted, pay §R5% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_S04:0 "The Monster King's Oath"
 WET_ARC_S04_desc:0 "The northern monsters promise strength that the host cannot obtain from ordinary levies. A material contract can secure their support without resting the entire bargain upon a ruler who is not present to make it."
 WET_ARC_S05:0 "Archaon's Undivided Court"
 WET_ARC_S05_desc:0 "A court divided between the ambitions of its patrons cannot govern an undivided host. Archaon must make the crown the place where their competing claims are heard and finally settled."
 WET_ARC_S06:0 "The Voice That Ends Disputes"
 WET_ARC_S06_desc:0 "A grievance left to grow becomes a banner around which rivals can gather. The voice of the Everchosen must settle genuine disputes before their petitioners discover the attractions of rebellion."
 WET_ARC_S06_special_tt:0 "Clear the court grievance and gain §G3% Stability§!."
 WET_ARC_S07:0 "A Court Without a Second Crown"
 WET_ARC_S07_desc:0 "Every second centre of authority gives the host another reason to hesitate. A clear chain of command will reduce the cost of court politics and hasten the preparation of new formations."
 WET_ARC_S08:0 "Heralds Among the Northern Tribes"
 WET_ARC_S08_desc:0 "Heralds must carry the crown's authority to tribes that have not yet felt its presence. The political resources placed behind their work will support the existing means of bringing eligible neighbours into the host."
 WET_ARC_S09:0 "Oaths Before the Longships"
 WET_ARC_S09_desc:0 "The chiefs gathered beside their longships value recognition as much as distant promises of conquest. Mutual access and respect for agreed rights may draw them into cooperation without forcing an immediate surrender of their rule."
 WET_ARC_S09_special_tt:0 "Request mutual Military Access from neighboring independent Chaos realms. Acceptance adds §G5 Subject Loyalty§! and makes the recipient a tribal signatory."
 WET_ARC_S10:0 "Feast of a Thousand Chieftains"
 WET_ARC_S10_desc:0 "A feast can reveal the strength of an oath more clearly than a crowded chamber of petitioners. The chieftains shall pledge retinues to the common host and bring their grievances where the crown can judge them."
 WET_ARC_S10_special_tt:0 "Gain §G2,000 Manpower§! and §G3% Stability§!, clear the court grievance, and add §G5 Loyalty§! to each subject."
 WET_ARC_S11:0 "The Velvet Yoke"
 WET_ARC_S11_desc:0 "Submission obtained through agreement can be cheaper to sustain than submission renewed by punishment. A more patient style of rule will improve the terms upon which willing partners and existing subjects deal with the crown."
 WET_ARC_S11_special_tt:0 "Negotiated agreements receive §G50% more AI acceptance weight§!. Direct subjects gain §G5 Loyalty§!.\nHuman rulers still choose."
 WET_ARC_S12:0 "The Iron Oath"
 WET_ARC_S12_desc:0 "Some oaths must be backed by an unmistakable promise of enforcement. The Iron Oath will strengthen the war effort while making the strain of coercion visible within the realm."
 WET_ARC_S13:0 "Hostages, Honours and Marriages"
 WET_ARC_S13_desc:0 "Hostages and honours bind rulers through interests that a proclamation cannot create. We shall offer a settlement in which willing subjects gain reasons to preserve the relationship rather than merely fear its end."
 WET_ARC_S13_special_tt:0 "Offer subjects §G10 Loyalty§! and §G−5% Resistance Target§! for §Y365 days§!. Each subject must accept."
 WET_ARC_S14:0 "Punish the First Oathbreaker"
 WET_ARC_S14_desc:0 "An oathbreaker who suffers no consequence teaches every signatory the same lesson. Recorded betrayal must therefore be answered through a clear notice and a deliberate choice of retaliation."
 WET_ARC_S15:0 "The Tribes March South"
 WET_ARC_S15_desc:0 "The tribes have promised warriors, but promises alone cannot form a marching army. Training and command experience will prepare their contingents for the campaigns beyond the north."
 WET_ARC_S16:0 "No More Wars Among Brothers"
 WET_ARC_S16_desc:0 "A feud between signatories wastes strength that the crown has gathered for another purpose. We shall seek reaffirmed oaths from those at peace, while recognising that an existing war requires its own settlement."
 WET_ARC_S16_special_tt:0 "Offer mediation to peaceful neighboring tribal signatories. Each acceptance adds §G5 Loyalty§! to the signatory and grants us §G3% Stability§!."
 WET_ARC_S17:0 "An Empire of Kneeling Kings"
 WET_ARC_S17_desc:0 "A king may keep a throne and still acknowledge a greater crown. Voluntary subject agreements will give willing Chaos rulers a place within the host without pretending that their existing wars have vanished."
 WET_ARC_S17_special_tt:0 "Offer neighboring independent Chaos realms Puppet status and faction membership. An accepting realm becomes our subject, joins our faction and gains §G5 Loyalty§!."
 WET_ARC_S18:0 "Tribute in Iron and Grain"
 WET_ARC_S18_desc:0 "Tribute must reach the army in a form its quartermasters can issue. Purchase arms from willing subjects and bring their arsenals into service of the greater war."
 WET_ARC_S18_special_tt:0 "Request §Y500 Infantry Equipment§! from each eligible subject. An accepting subject transfers the equipment and gains §G50 Political Power§!."
 WET_ARC_S19:0 "Garrisons of Many Peoples"
 WET_ARC_S19_desc:0 "The conquered peoples know roads and customs that northern warriors must learn at a cost. Properly organised garrisons can use that knowledge to govern territory with less waste and resistance."
 WET_ARC_S20:0 "The Right to Keep Their Crowns"
 WET_ARC_S20_desc:0 "A ruler permitted to keep a crown must have a reason to honour the permission. Recognition of subject rights will be matched by pledged levies and a firmer personal loyalty to the Everchosen."
 WET_ARC_S20_special_tt:0 "Direct subjects gain §G10 Loyalty§!."
 WET_ARC_S21:0 "Every Crown a Borrowed Crown"
 WET_ARC_S21_desc:0 "The princes must remember that their crowns survive under the authority of another. Greater political pressure can enforce that truth, though it will also deepen resentment among those who bear it."
 WET_ARC_S21_special_tt:0 "Direct subjects lose §R10 Loyalty§! and a court grievance is recorded."
 WET_ARC_S22:0 "Councils of the Conquered"
 WET_ARC_S22_desc:0 "The conquered realms need institutions that can turn local knowledge into useful work. Development councils will permit paid investment in willing subjects and spread the construction methods that make such investment worthwhile."
 WET_ARC_S22_special_tt:0 "Offer to build §G1 Civilian Factory§! in an eligible subject state. A maximum of §Y2§! grants can be accepted."
 WET_ARC_S23:0 "The Everchosen's Inspectors"
 WET_ARC_S23_desc:0 "A ruler's assurances are not a substitute for an account of what his officials actually do. Inspectors will uncover intrigue and help the crown reduce resistance through a clearer understanding of its provinces."
 WET_ARC_S23_special_tt:0 "Clear the court grievance and gain §G−5% Resistance Target§! for §Y365 days§!."
 WET_ARC_S24:0 "Integrate the War Effort"
 WET_ARC_S24_desc:0 "Separate armies waste supplies when they prepare for different wars upon the same roads. A negotiated programme of military cooperation will make willing participants less costly to sustain in the field."
 WET_ARC_S24_special_tt:0 "Offer faction members a logistics agreement. Acceptance gives both countries §G−3% Supply Consumption§! for §Y365 days§!."
 WET_ARC_S25:0 "A Realm That Can Survive Its Victories"
 WET_ARC_S25_construction_0_tt:0 "Add §G1§! §Y$supply_node$§! in owned, fully controlled states."
 WET_ARC_S25_desc:0 "The realm must be able to feed and connect its armies after the first triumphs have passed. Depots and better logistics will give the crown an answer to the burdens created by its own success."
 WET_ARC_S25_special_tt:0 "Gain §G3% Stability§! and add §G5 Loyalty§! to each subject."
 WET_ARC_S26:0 "Envoys to the Council of Thirteen"
 WET_ARC_S26_desc:0 "The Council of Thirteen may see profit in a war that weakens its own enemies. Open negotiations with the Vermintide’s leader and find a price the ratmen will accept."
 WET_ARC_S26_special_tt:0 "Send the Vermintide leader an offer that unlocks negotiations for a non-aggression pact. The recipient may refuse."
 WET_ARC_S27:0 "Divide the World Beneath Our Feet"
 WET_ARC_S27_desc:0 "The surface and the world beneath it offer different opportunities to our prospective partners. A limited sphere agreement can establish where cooperation is useful while leaving each faction under its own command."
 WET_ARC_S27_special_tt:0 "Offer the Vermintide leader a §Y365-day non-aggression pact§!. The recipient must accept."
 WET_ARC_S28:0 "Warpstone for the War-Forges"
 WET_ARC_S28_desc:0 "Skaven mines could feed our war-forges with warpstone. Secure a steady supply before their rivals buy it or their miners consume it in reckless experiments."
 WET_ARC_S28_special_tt:0 "Ask the Vermintide pact partner to transfer §Y4 Warpstone§! from a controlled deposit to our capital for §Y365 days§!. Acceptance grants the partner §G100 Political Power§!."
 WET_ARC_S29:0 "A Common Enemy in Death"
 WET_ARC_S29_desc:0 "The servants of death threaten ambitions that neither side is willing to abandon. We shall seek Skaven assistance against the Black Pyramid while leaving the success of the assault to the operation itself."
 WET_ARC_S29_special_tt:0 "Ask the Vermintide pact partner to support the Black Pyramid assault for §Y365 days§!. Acceptance raises the operation’s success chance from §Y70%§! to §G100%§!."
 WET_ARC_S30:0 "The Rat's Knife at Our Back"
 WET_ARC_S30_desc:0 "A useful treaty can still conceal the beginnings of betrayal. Regular review will let us renew the sphere agreement by consent or accept its end without manufacturing a cause for war."
 WET_ARC_S30_special_tt:0 "Offer to renew the Vermintide non-aggression pact for §Y365 days§!. The recipient must accept."
 WET_ARC_S31:0 "An Invitation to the Last Waaagh"
 WET_ARC_S31_desc:0 "The Last Waaagh needs enemies worthy of its attention, and the Everchosen has no shortage to name. A common-enemy bargain may direct that strength without attempting to place the Greenskin faction beneath our crown."
 WET_ARC_S31_special_tt:0 "Send the current Waaagh leader an offer that unlocks eastern war-goal and equipment agreements. The recipient may refuse."
 WET_ARC_S32:0 "Point the Waaagh East"
 WET_ARC_S32_desc:0 "The eastern realms offer Grimgor a campaign that can serve more than one ambition. We shall provide an agreed opening, while recognising that the Waaagh's march must be its own decision."
 WET_ARC_S32_special_tt:0 "Ask the Waaagh leader to accept conquest war goals against the eligible eastern campaign targets."
 WET_ARC_S33:0 "Spoils Worth Fighting For"
 WET_ARC_S33_desc:0 "An agreement with the green tide must promise spoils that its warriors can understand. Equipment and payment can support coordinated planning, while any territorial settlement must wait upon conquest."
 WET_ARC_S33_special_tt:0 "Offer §Y1,000 Infantry Equipment§! to the Waaagh leader. Acceptance gives both countries §G+10% Planning Speed§! for §Y365 days§!."
 WET_ARC_S34:0 "Keep the Green Tide Moving"
 WET_ARC_S34_desc:0 "Cooperation loses its value when the armies it concerns cease to move toward a common purpose. A limited extension can preserve the agreement without pretending that Grimgor has surrendered control of his host."
 WET_ARC_S34_special_tt:0 "Offer to renew the Waaagh agreement. Acceptance gives both countries §G+10% Planning Speed§! for §Y365 days§!."
 WET_ARC_S35:0 "The Biggest Challenge"
 WET_ARC_S35_desc:0 "A dispute with the Waaagh can become another war before either side has gained from the last one. Respecting the agreed borders offers a practical settlement when the challenge is real and recorded."
 WET_ARC_S35_special_tt:0 "Clear the Waaagh border dispute and gain §G3% Stability§!."
 WET_ARC_S36:0 "Treaties Written for a Dying World"
 WET_ARC_S36_desc:0 "Treaties written for one stage of the war may become burdens in the next. A proper notice procedure will let the crown end obsolete agreements without disguising a sudden betrayal as diplomacy."
 WET_ARC_S37:0 "The Grand Bargain"
 WET_ARC_S37_desc:0 "The great bargains must eventually serve an operation that their signatories can recognise. A joint conference will seek consent to shared logistics, while a common doctrine gives our commanders the means to put that cooperation to use."
 WET_ARC_S37_special_tt:0 "Offer the current Skaven and Waaagh partners §G−3% Supply Consumption§! for both countries for §Y365 days§!. Each partner must accept."
 WET_ARC_S38:0 "No Rival Shall Inherit the World"
 WET_ARC_S38_desc:0 "No alliance relieves the Everchosen of the need to judge his own future. The crown must retain the experience and diplomatic means to reconsider agreements whose purpose has been exhausted."
 WET_ARC_T00:0 "The Changer's Acclamation"
 WET_ARC_T00_desc:0 "Tzeentch's servants see opportunity in every uncertainty and rivalry in every plan. Their realm must be brought into the coalition without surrendering the Everchosen's command of its purpose."
 WET_ARC_T00_special_tt:0 "Invite the patron realm to the Everchosen.\nThe invited realm must agree. Existing allies give §Y+10§! Political Power.\nUnavailable realms give §Y+25§! Political Power and may be invited later."
 WET_ARC_T01:0 "The Grand Coalition — Architects of Fate"
 WET_ARC_T01_desc:0 "The architects of fate possess knowledge that no ordinary council can supply. We shall seek a coalition with those whose ambitions can be directed toward the host's campaigns."
 WET_ARC_T02:0 "The Everchosen's Own — No Master of My Fate"
 WET_ARC_T02_desc:0 "Prophecy is a poor master for one who intends to command the end of an age. Archaon shall maintain his own research council and judge the advice of sorcerers against the needs of his crown."
 WET_ARC_T03:0 "The Curseling's Bargain"
 WET_ARC_T03_desc:0 "Vilitch's gifts could turn the confusion of war into an instrument of command. We shall offer him a place in the host if his present duties and ambitions permit the bargain."
 WET_ARC_T03_special_tt:0 "Offer §YVilitch Twistfate the Curseling§! command of an army. If accepted, pay §R5% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_T04:0 "The Magister's Forbidden Lore"
 WET_ARC_T04_desc:0 "Egrim's knowledge carries a value beyond the prestige of his name. A proper offer may bring that learning into the Everchosen's service without pretending that its current obligations have ceased to exist."
 WET_ARC_T04_special_tt:0 "Offer §YEgrim van Horstmann§! command of an army. If accepted, lose §R3% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_T05:0 "An Audience with the Fateweaver"
 WET_ARC_T05_desc:0 "The Fateweaver's counsel promises insight at a price that must be understood before it is paid. We shall seek an audience through Tzeentch's realm and retain another course of study if the request fails."
 WET_ARC_T05_special_tt:0 "Ask Tzeentch’s realm for a year of counsel: §Y+3%§! research at a cost of §Y5§! stability if accepted. Otherwise receive an Arcana research bonus."
 WET_ARC_T06:0 "Read the Omens for Myself"
 WET_ARC_T06_desc:0 "Archaon need not abandon the reading of omens to those who would profit from interpreting them for him. His own study can sharpen both campaign planning and the work of the crown's scholars."
 WET_ARC_T06_special_tt:0 "Archaon gains §G1 Planning§!. If he is unavailable, gain §G25 Army Experience§! instead."
 WET_ARC_T07:0 "A Will Beyond Prophecy"
 WET_ARC_T07_desc:0 "A hostile prophecy is most dangerous when it teaches its listeners to surrender their judgement. Protected communications and a clear response to court grievances will help the crown resist that influence."
 WET_ARC_T07_special_tt:0 "Clear the court grievance and gain §G5% Stability§!."
 WET_ARC_T08:0 "Gather the Sorcerer-Smiths"
 WET_ARC_T08_construction_0_tt:0 "Add §G1§! §Y$arms_factory$§! in owned, fully controlled states."
 WET_ARC_T08_desc:0 "Sorcerers and smiths too often guard their discoveries from one another. A gathering under the crown can turn their separate talents toward instruments that neither discipline could create alone."
 WET_ARC_T09:0 "Catalogues of Forbidden Knowledge"
 WET_ARC_T09_desc:0 "Forbidden knowledge is easily lost when its keeper dies or turns against the host. Catalogues and disciplined study will make those discoveries useful beyond the ambitions of any single sorcerer."
 WET_ARC_T10:0 "Laboratories of the Impossible"
 WET_ARC_T10_desc:0 "The questions before our scholars have outgrown the chambers in which they work. Dedicated laboratories will allow another field of research to proceed, if the realm can sustain the investment."
 WET_ARC_T11:0 "Artificers Without Restraint"
 WET_ARC_T11_desc:0 "Restraint has denied many artificers the opportunity to test their most promising designs. Under the crown's protection, their work can improve industry and the means by which its raw materials are obtained."
 WET_ARC_T12:0 "The Architecture of the Winds"
 WET_ARC_T12_desc:0 "The Winds may be invisible, but their effects need not remain beyond organised study. Understanding their structure will give the host a foundation for more ambitious works of sorcery."
 WET_ARC_T13:0 "A College Bound to the Crown"
 WET_ARC_T13_desc:0 "A college bound to the crown can outlast the rivalries of individual masters. Its establishment requires a substantial economy and a deliberate investment in the future of the host's knowledge."
 WET_ARC_T14:0 "The Exchange of Ninefold Secrets"
 WET_ARC_T14_desc:0 "Secrets gain a different value when exchanged with a willing partner. We shall offer research cooperation to those within the faction who judge shared knowledge more useful than solitary possession."
 WET_ARC_T14_special_tt:0 "Offer faction members a research exchange. Each acceptance grants both countries §G1× 100%§! research bonus for Arcana."
 WET_ARC_T15:0 "Instruments of the Final Hour"
 WET_ARC_T15_desc:0 "The final campaigns will demand instruments whose principles still lie beyond ordinary understanding. Our scholars must investigate those possibilities before the need for them becomes immediate."
 WET_ARC_T16:0 "The Everchosen's Arcane Arsenal"
 WET_ARC_T16_desc:0 "Discoveries scattered across workshops and libraries are not yet an arsenal. We shall bring the most useful knowledge together in a programme capable of supporting the Everchosen's wars."
 WET_ARC_T17:0 "The Hidden Hand"
 WET_ARC_T17_desc:0 "The host cannot rely entirely upon reports carried openly across its borders. A hidden service will collect the intelligence needed to understand enemies before they reveal their intentions in battle."
 WET_ARC_T17_special_tt:0 "Create an intelligence agency with La Résistance if absent.\nOtherwise gain §Y+5%§! army intelligence."
 WET_ARC_T18:0 "Nine Eyes in Every Court"
 WET_ARC_T18_desc:0 "One court may conceal what another reveals through carelessness or rivalry. A wider network of eyes will give the Everchosen more opportunities to learn what his opponents would keep secret."
 WET_ARC_T18_special_tt:0 "Gain one operative slot with La Résistance.\nOtherwise gain §Y+5%§! civilian intelligence."
 WET_ARC_T19:0 "The Cipher of Change"
 WET_ARC_T19_desc:0 "A message is a weapon only while it reaches the intended hands intact. Better ciphers and the means to read an enemy's codes will protect our plans while exposing theirs."
 WET_ARC_T20:0 "A Web Behind Enemy Lines"
 WET_ARC_T20_desc:0 "The gates of an enemy court are guarded by more than soldiers. Patient infiltration must establish the contacts and knowledge needed before the host can exploit its weaknesses."
 WET_ARC_T21:0 "Turn the Gatekeepers"
 WET_ARC_T21_desc:0 "A fortress may fall because the wrong order reaches the right man at the right hour. Our agents will prepare the sabotage that can turn a guarded approach into an opportunity for assault."
 WET_ARC_T22:0 "Steal the Artificers' Secrets"
 WET_ARC_T22_desc:0 "Enemy artificers have already spent years solving problems that confront our own workshops. An organised theft of their knowledge may spare us that labour, though failure remains a real possibility."
 WET_ARC_T22_special_tt:0 "Complete the intelligence mission: a §Y70%§! chance of an Industry research bonus.\nOtherwise gain §Y10§! Army Experience."
 WET_ARC_T23:0 "False Orders, Real Defeats"
 WET_ARC_T23_desc:0 "An army can be defeated by the orders it believes it has received. We shall prepare false instructions that waste the enemy's time and break the rhythm of its plans."
 WET_ARC_T24:0 "Burn the Counter-Conspiracy"
 WET_ARC_T24_desc:0 "Those who weave conspiracies for the crown may also weave them against it. Better counter-intelligence and the reading of concealed messages will make that betrayal harder to hide."
 WET_ARC_T25:0 "The Unseen War Council"
 WET_ARC_T25_desc:0 "Separate agents need a council capable of judging which secrets matter. A common direction will reduce waste and give the unseen war a purpose tied to the host's wider campaigns."
 WET_ARC_T26:0 "Wings Above the Wastes"
 WET_ARC_T26_construction_0_tt:0 "Add §G1§! §Y$air_base$§! levels in owned, fully controlled states."
 WET_ARC_T26_desc:0 "The air above the wastes is a battlefield that the host can no longer neglect. Aeries, trained crews and improved designs will establish the means to contest it."
 WET_ARC_T27:0 "Screaming Screens"
 WET_ARC_T27_desc:0 "Our airborne forces must be produced and replaced as deliberately as the weapons carried by the army. A sustained programme will keep the skies supplied with more than a few irreplaceable marvels."
 WET_ARC_T28:0 "Fire from the Impossible Sky"
 WET_ARC_T28_desc:0 "Enemies who prepare only for the host before them leave themselves exposed from above. New methods of aerial attack will bring destructive force to places the marching army cannot yet reach."
 WET_ARC_T29:0 "Scrying and Sky-Watch"
 WET_ARC_T29_construction_0_tt:0 "Add §G1§! §Y$radar_station$§! levels in owned, fully controlled states."
 WET_ARC_T29_desc:0 "An airborne warning is useful only if it arrives before the attack. Scrying stations and improved observation will give our commanders a clearer account of what moves above the front."
 WET_ARC_T30:0 "Hunt the Enemy's Winged Hosts"
 WET_ARC_T30_desc:0 "Enemy flyers can deny the host freedom of movement and threaten its supplies. We shall study how to find and destroy them before they can carry out their work."
 WET_ARC_T31:0 "Terror Above the Battle Line"
 WET_ARC_T31_desc:0 "The army should hear the arrival of our winged forces as a promise of support. Better coordination will turn attacks from the sky into an extension of the battle being fought below."
 WET_ARC_T32:0 "Wings Beyond the Sea"
 WET_ARC_T32_desc:0 "The sea does not end the reach of an airborne weapon. We shall prepare forces that can threaten enemy ships and support the fleet beyond sight of our shores."
 WET_ARC_T33:0 "Storms Over the Fortress Cities"
 WET_ARC_T33_desc:0 "Fortified cities cannot hide every useful target beneath stone. Our airborne forces will study attacks that disrupt their defenders and prepare the way for the host's advance."
 WET_ARC_T34:0 "A Network of Aeries"
 WET_ARC_T34_construction_0_tt:0 "Add §G2§! §Y$air_base$§! levels in owned, fully controlled states."
 WET_ARC_T34_construction_1_tt:0 "Add §G1§! §Y$radar_station$§! levels in owned, fully controlled states."
 WET_ARC_T34_desc:0 "A single aerie cannot support every campaign the crown intends to fight. A network of bases and observation stations will let our airborne forces move with the needs of the war."
 WET_ARC_T35:0 "The Sky Belongs to Change"
 WET_ARC_T35_desc:0 "Possession of many flyers is not the same as mastery of the sky. Once a substantial force is deployed, a common doctrine can make its missions more effective across the whole campaign."
