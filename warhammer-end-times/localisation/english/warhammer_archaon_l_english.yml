 WET_ARC_REQUIRE_KD17:0 "Settle §Y85%§! of the Darklands and resolve Zharr-Naggrund by control or accepted subjection."
 WET_ARC_REQUIRE_KM01:0 "Valid land contact inside the Mountains of Mourn."
 WET_ARC_REQUIRE_KM16:0 "Settle §Y85%§! of Mourn and resolve Goldtooth.\nMercenary contracts alone do not count as subjection."
 WET_ARC_REQUIRE_KN01:0 "Valid land contact inside Naggaroth."
 WET_ARC_REQUIRE_KN07:0 "Control Naggarond."
 WET_ARC_REQUIRE_KN18:0 "Settle §Y85%§! of Naggaroth, including Naggarond and its principal opponent."
 WET_ARC_REQUIRE_KO01:0 "Valid land contact inside the Old World theatre."
 WET_ARC_REQUIRE_KO04:0 "Control Kislev city and §Y75%§! of its homeland."
 WET_ARC_REQUIRE_KO16:0 "Control Altdorf and Middenheim and settle §Y60%§! of the Imperial homeland."
 WET_ARC_REQUIRE_KO26:0 "Settle §Y85%§! of the Old World theatre and resolve its principal opponents."
 WET_ARC_REQUIRE_KU01:0 "§Y20§! warships including §Y4§! cruiser-or-heavier hulls.\n§Y100§! convoys.\nControlled level-§Y2§! naval base."
 WET_ARC_REQUIRE_KU05:0 "Control an Ulthuan coastal port directly or through a direct subject."
 WET_ARC_REQUIRE_KU13:0 "Controls the approach to the §YGreat Vortex§!."
 WET_ARC_REQUIRE_KU18:0 "Control all passable Ulthuan states directly or through direct subjects.\nPrincipal defenders resolved."
 WET_ARC_REQUIRE_N19:0 "§Y25§! owned civilian/military factories."
 WET_ARC_REQUIRE_N26:0 "Has begun negotiations with the Glottkin and has not already recruited them."
