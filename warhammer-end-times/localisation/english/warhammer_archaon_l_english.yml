l_english:
 WET_ARC_AI_BEHAVIOR:0 "Archaon"
 WET_ARC_AI_DEFAULT:0 "Follow Historical AI Focuses"
 WET_ARC_AI_DEFAULT_DESC:0 "Use the End Times focus plan when Historical AI Focuses is enabled; otherwise use unrestricted focus choices. Applies only to AI-controlled Archaon."
 WET_ARC_AI_HISTORICAL:0 "Historical — The End Times"
 WET_ARC_AI_HISTORICAL_DESC:0 "Prioritise the Chaos champions, northern consolidation, Kislev and the Empire, the Glottkin and Spume, and cooperation with the Skaven. Prefer an invasion of Naggaroth over patronage of the Cult of Pleasure. Avoid Archaon-led invasions of Ulthuan and the eastern realms."
 WET_ARC_AI_SANDBOX:0 "Unrestricted Alternatives"
 WET_ARC_AI_SANDBOX_DESC:0 "Allow Archaon to choose among all available paths, even with Historical AI Focuses enabled. Human players always retain every normal choice."
 WET_ARC_C01:0 "The Coronation of the Everchosen"
 WET_ARC_C01_desc:0 "The rival champions have bowed, and the signs of the gods converge upon one crown. Archaon will take up the authority of the Everchosen and give the north a single will to follow."
 WET_ARC_C01_special_tt:0 ""
 WET_ARC_HISTORICAL_PLAN:0 "Archaon — The End Times"
 WET_ARC_HISTORICAL_PLAN_DESC:0 "Unite the Chaos hosts and drive through Kislev into the Empire, supported by the plague invasion and Skaven cooperation."
 WET_ARC_K00:0 "The Blood God's Acclamation"
 WET_ARC_K00_desc:0 "Khorne's servants judge a promise by the blood that follows it. Their realm must be called into the Everchosen's host, where its fury can be turned toward the wars to come."
 WET_ARC_K00_special_tt:0 "Invite the patron realm to the Everchosen.\nThe invited realm must agree. Existing allies give §Y+10§! Political Power.\nUnavailable realms give §Y+25§! Political Power and may be invited later."
 WET_ARC_K01:0 "The Grand Coalition — Bloodsworn Champions"
 WET_ARC_K01_desc:0 "The greatest servants of the Blood God will not be won by a comfortable place at court. We shall offer them a coalition whose campaigns promise foes worthy of their blades."
 WET_ARC_K02:0 "The Everchosen's Own — One Sword, One Will"
 WET_ARC_K02_desc:0 "No collection of rival champions can replace warriors whose first loyalty is to Archaon himself. The Swords of Chaos will form the disciplined heart around which the wider host must gather."
 WET_ARC_K03:0 "Offer Valkia the Worthiest Slaughter"
 WET_ARC_K03_desc:0 "Valkia's reputation has travelled wherever the Blood God's name is feared. We shall offer her a command worthy of that reputation, if she is willing to leave her present duties behind."
 WET_ARC_K03_special_tt:0 "Offer §YValkia Bloodskorn the Bloody§! command of an army. If accepted, pay §R5% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_K04:0 "Crom, Herald of the Apocalypse"
 WET_ARC_K04_desc:0 "Crom can carry the Everchosen's demands with an authority that ordinary heralds cannot possess. His service must be secured through a proper offer, with his existing obligations settled rather than ignored."
 WET_ARC_K04_special_tt:0 "Offer §YVardek Crom§! command of an army. If accepted, pay §R3% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_K05:0 "Wake the Suneater"
 WET_ARC_K05_desc:0 "Kholek's strength could turn the enemy's proudest defences into obstacles scarcely worth remembering. Such service has a price, and the host must be ready to bear it before the Suneater is called."
 WET_ARC_K05_special_tt:0 "Offer §YKholek Stormhorn the Suneater§! command of an army. If accepted, lose §R5% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_K06:0 "Temper the Slayer of Kings"
 WET_ARC_K06_desc:0 "The Slayer of Kings is a weapon worthy of the hand that bears it. Archaon must sharpen his own judgement of battle until every opening becomes an opportunity to strike."
 WET_ARC_K06_special_tt:0 "Archaon gains §G1 Attack§!. If he is unavailable, gain §G25 Army Experience§! instead."
 WET_ARC_K07:0 "Expand the Swords of Chaos"
 WET_ARC_K07_desc:0 "The household must possess equipment equal to the demands placed upon it. A deliberate allocation of arms will turn the Swords of Chaos from a feared retinue into a more dependable instrument of command."
 WET_ARC_K07_special_tt:0 "Equip the Swords of Chaos, increasing their Organisation bonus to §Y5%§!."
 WET_ARC_K08:0 "A Council Before the Battle"
 WET_ARC_K08_desc:0 "Rival champions can waste a campaign arguing over the honour of its first charge. A council held before battle will settle their tasks and turn competing ambitions into a common plan."
 WET_ARC_K09:0 "Muster the Northern Warbands"
 WET_ARC_K09_desc:0 "The northern warbands bring strength in numbers and confusion in almost equal measure. A proper muster will establish what each band can field and how its weapons can be improved."
 WET_ARC_K10:0 "The Eightfold Order of Battle"
 WET_ARC_K10_desc:0 "A host sworn to one crown must still learn to move as one army. We shall establish an order of battle that gives commanders clear responsibilities and leaves room for deliberate campaign planning."
 WET_ARC_K10_special_tt:0 "Gain a doctrine research bonus and §Y180§! days of §Y+10%§! Planning Speed."
 WET_ARC_K11:0 "Weapons Worthy of the Chosen"
 WET_ARC_K11_desc:0 "The Chosen should not have to discover the weakness of a weapon against an enemy's shield. Better designs and sustained production will supply arms fit for the campaigns demanded of them."
 WET_ARC_K12:0 "Breakers of Fortress Gates"
 WET_ARC_K12_desc:0 "Many southern rulers trust stone walls more than the courage of their soldiers. Engineers and siege trains will teach the host how to turn those walls into the beginning of an assault rather than its end."
 WET_ARC_K12_special_tt:0 "Gain an Engineer research bonus and §Y180§! days of §Y+10%§! Fort Damage."
 WET_ARC_K13:0 "War Roads Through the Wastes"
 WET_ARC_K13_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_K13_desc:0 "A road through the wastes is an investment in every army that follows it. We shall improve the approaches used by the host and provide the equipment needed to keep them open."
 WET_ARC_K14:0 "A Window to the Sea"
 WET_ARC_K14_desc:0 "The sea offers roads to enemies that the marching host cannot reach. We must first secure a usable coast through an campaign, giving the future fleet a shore from which to sail."
 WET_ARC_K15:0 "Harbours of the Plague Fleet"
 WET_ARC_K15_construction_0_tt:0 "Add §G1§! §Y$naval_base$§! levels in owned, fully controlled states."
 WET_ARC_K15_construction_1_tt:0 "Add §G2§! §Y$dockyard$§! in owned, fully controlled states."
 WET_ARC_K15_desc:0 "The plague fleet needs anchorages capable of sheltering more than a handful of raiders. Harbours and dockyards will give its voyages a lasting base and its damaged ships somewhere to return."
 WET_ARC_K16:0 "Shipwrights in Chains of Oath"
 WET_ARC_K16_construction_0_tt:0 "Add §G2§! §Y$dockyard$§! in owned, fully controlled states."
 WET_ARC_K16_desc:0 "Shipwrights possess a skill that threats cannot replace once it is lost. We shall bind their work to the fleet through organised yards, supplies and the knowledge needed to build stronger hulls."
 WET_ARC_K17:0 "Convoys of the Apocalypse"
 WET_ARC_K17_desc:0 "An overseas army consumes provisions even when its warriors are idle. Convoys and transport expertise will give the host a better chance of arriving supplied and remaining useful after it lands."
 WET_ARC_K18:0 "Muster the Plague Armada"
 WET_ARC_K18_desc:0 "The scattered ships of the north must become an armada with a common purpose. Expanded dockyard work and better warship designs will prepare the plague fleet for campaigns beyond its familiar waters."
 WET_ARC_K19:0 "Raiders of the Sea of Claws"
 WET_ARC_K19_desc:0 "Spume's captains disagree over whether the enemy should be strangled at sea or defeated in a great battle. The Everchosen must choose which tradition will shape the fleet's permanent doctrine."
 WET_ARC_K19_special_tt:0 "Gain an event to choose a permanent naval programme: §G+10% Convoy Raiding Efficiency§! or §G+5% Naval Organisation§!."
 WET_ARC_K20:0 "Provision the Overseas Host"
 WET_ARC_K20_desc:0 "A landing succeeds only if the army can continue to live and fight beyond the beach. We shall organise the stores and preparations needed to sustain the overseas host after its first assault."
 WET_ARC_K21:0 "Blood for Every Horizon"
 WET_ARC_K21_desc:0 "The host's enemies lie in many directions, but strength dispersed without purpose is strength wasted. Theatre staffs will prepare the concentration of forces that makes each new horizon a practical campaign."
 WET_ARC_K21_special_tt:0 "Gain §Y5%§! War Support and §Y180§! days of §Y+10%§! Maximum Planning."
 WET_ARC_K22:0 "Marshal of the Six Wars"
 WET_ARC_K22_desc:0 "The wars of the Everchosen require more than prowess upon a single battlefield. Archaon must learn to coordinate distant armies without allowing their commanders to mistake distance for independence."
 WET_ARC_K22_special_tt:0 "Archaon gains §G1 Planning§!. If he is unavailable, gain §G25 Army Experience§! instead."
 WET_ARC_KC00:0 "The Hobgoblin Steppes"
 WET_ARC_KC00_desc:0 "The Hobgoblin steppes stand before the eastern campaign as both an obstacle and an opportunity. A demand backed by real strength may secure submission before another army has to be committed."
 WET_ARC_KC00_special_tt:0 "Demand Hobgoblin submission.\nStrength influences AI acceptance. Refusal grants regional war goals."
 WET_ARC_KC01:0 "The Doom of Cathay"
 WET_ARC_KC01_desc:0 "Cathay's wealth is protected by distance, organisation and formidable frontiers. The host must establish an approach before proclaiming a campaign against the eastern realm."
 WET_ARC_KC01_special_tt:0 "Gain war goals against eligible frontier enemies and principal rulers in §YCathay§!."
 WET_ARC_KC02:0 "Breach the Great Bastion"
 WET_ARC_KC02_desc:0 "The Great Bastion is a physical obstacle with approaches that can be studied and attacked. Siege preparations and sabotage will matter only if they help the host secure a real passage through it."
 WET_ARC_KC02_special_tt:0 "After the prepared Great Bastion crossing is captured, complete the breach objective and add §G1 Infrastructure§! in an eligible owned state."
 WET_ARC_KC09:0 "Wei-Jin at Our Feet"
 WET_ARC_KC09_desc:0 "Wei-Jin is more than a prize for the first commander to reach its gates. Its control must form part of a broader hold upon Cathay if the victory is to endure."
 WET_ARC_KC10:0 "Dragons Beneath the Crown"
 WET_ARC_KC10_desc:0 "A Cathayan government already drawn toward Chaos may accept an order it cannot defeat. We shall offer submission under the crown, with military consequences reserved for refusal or incompatible rule."
 WET_ARC_KC10_special_tt:0 "Offer a Chaos Cathayan government subject status.\nRefusal or an ineligible target gives regional war goals."
 WET_ARC_KC11:0 "An End to the Celestial Mandate"
 WET_ARC_KC11_desc:0 "The Celestial Mandate claims an authority that the Everchosen cannot leave unchallenged. Ending that claim by force will demand further war and impose strains upon the host as well as its enemies."
 WET_ARC_KC11_special_tt:0 "Gain war goals against rulers unprotected by our treaties in §YCathay§!."
 WET_ARC_KC18:0 "Cathay Under the Eightfold Star"
 WET_ARC_KC18_construction_0_tt:0 "Add §G2§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_KC18_desc:0 "Cathay's conquest should preserve the skilled labour and knowledge that made its cities powerful. New workshops and the study of their methods will give the host lasting value from the eastern settlement."
 WET_ARC_KC20:0 "Offer Cathay to the Monkey Court"
 WET_ARC_KC20_desc:0 "The Monkey Court may be willing to fight for a future that other eastern rulers deny it. We shall offer an alliance and a defined share of our own conquests, leaving its answer to negotiation rather than coercion."
 WET_ARC_KC20_special_tt:0 "Invite the independent Monkey Court to our faction and promise our future Cathayan conquests. AI acceptance depends on strength. Refusal grants no war goal.\nAn ineligible court gives §Y+25§! Political Power instead."
 WET_ARC_KD01:0 "Claim the Darklands"
 WET_ARC_KD01_desc:0 "The Darklands promise furnaces, sorcery and enemies who have built their strength around both. The host must reach a genuine frontier before it can demand a share of that power."
 WET_ARC_KD01_special_tt:0 "Gain war goals against eligible frontier enemies and principal rulers in the §YDarklands§!."
 WET_ARC_KD04:0 "Terms for the Sorcerer-Prophets"
 WET_ARC_KD04_desc:0 "The Sorcerer-Prophets will understand a negotiation conducted from a position of military knowledge. Our commanders shall study their strengths before terms are laid before them."
 WET_ARC_KD05:0 "Hashut Shall Kneel"
 WET_ARC_KD05_desc:0 "Hashut's servants may prefer a place beneath the Eightfold Star to the ruin of their dominions. We shall offer subject status while making clear that refusal leaves the military question unresolved."
 WET_ARC_KD05_special_tt:0 "Offer the Sorcerer-Prophets subject status.\nRefusal grants regional war goals."
 WET_ARC_KD06:0 "Break the Sorcerer-Prophets"
 WET_ARC_KD06_desc:0 "If the Sorcerer-Prophets reject submission, their great forges must be approached as fortified objectives. Siege preparations will give the host the means to challenge walls built to protect an industrial realm."
 WET_ARC_KD06_special_tt:0 "Gain war goals against rulers unprotected by our treaties in the §YDarklands§!."
 WET_ARC_KD10:0 "Siege Engines for the Everchosen"
 WET_ARC_KD10_desc:0 "The captured traditions of the Darklands can improve more than the weapons of a single garrison. We shall turn their siege craft toward engines capable of serving the Everchosen's wider campaigns."
 WET_ARC_KD17:0 "The Darklands Subjugated"
 WET_ARC_KD17_construction_0_tt:0 "Add §G2§! §Y$arms_factory$§! in owned, fully controlled states."
 WET_ARC_KD17_desc:0 "The Darklands are valuable for what their mines and forges can continue to produce. A settled conquest will expand the host's arsenals and preserve the knowledge needed to draw more from the land."
 WET_ARC_KM01:0 "The Tyrants of the Mountains"
 WET_ARC_KM01_construction_0_tt:0 "Add §G1§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_KM01_desc:0 "The Mountains of Mourn cannot be crossed as though they were an empty road. Our scouts must identify a viable approach and the powers whose consent or defeat will be needed to pass."
 WET_ARC_KM04:0 "One Overtyrant for the Ogre Kingdoms"
 WET_ARC_KM04_desc:0 "A single settlement is easier to sustain than a hundred quarrels among mountain tyrants. Whether Goldtooth serves by agreement or the host advances by force, the remaining rulers must confront the new order."
 WET_ARC_KM04_special_tt:0 "Gain war goals against the remaining Ogre rulers. An allied Goldtooth who accepted our terms receives matching war goals."
 WET_ARC_KM05:0 "A Contract for Greasus Goldtooth"
 WET_ARC_KM05_desc:0 "Goldtooth knows the value of a profitable bargain and the cost of an unprofitable war. Tribute may secure his submission and cooperation, provided that the balance of strength makes our terms convincing."
 WET_ARC_KM05_special_tt:0 "Offer Goldtooth §Y100§! Political Power of tribute for submission and support against the other Ogres. Strength influences AI acceptance.\nRefusal gives regional war goals."
 WET_ARC_KM06:0 "No More Kings of the Mountain"
 WET_ARC_KM06_desc:0 "The tyrants of the mountains will not all be persuaded by the same purse. Those who reject the settlement must be faced through a campaign that settles their claims by force."
 WET_ARC_KM06_special_tt:0 "Gain war goals against rulers unprotected by our treaties in the §YMountains of Mourn§!."
 WET_ARC_KM16:0 "Lords of the Hungry Peaks"
 WET_ARC_KM16_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_KM16_construction_1_tt:0 "Add §G2§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_KM16_desc:0 "The hungry peaks must become a route the host can supply rather than a conquest it can only boast of. Roads and productive settlements will make the mountains useful to the next stage of the war."
 WET_ARC_KN01:0 "Eyes upon Naggaroth"
 WET_ARC_KN01_desc:0 "Naggaroth is a land of fortified harbours, bitter roads and rulers accustomed to cruelty. Our scouts must identify a real approach before the host can turn its attention to the Witch King's realm."
 WET_ARC_KN02:0 "War upon the Witch King"
 WET_ARC_KN02_desc:0 "The Witch King's subjects have long believed themselves masters of fear. We shall carry the war to their frontier and make the principal powers of Naggaroth answer the Everchosen's challenge."
 WET_ARC_KN02_special_tt:0 "Gain war goals against eligible frontier enemies and principal rulers in §YNaggaroth§!."
 WET_ARC_KN07:0 "Naggarond at Our Feet"
 WET_ARC_KN07_desc:0 "Naggarond's walls are an emblem of the power that has ruled the northwestern kingdoms. Its capture will show that the Witch King's heartland is within reach of the invading host."
 WET_ARC_KN08:0 "Kneel Before the Everchosen"
 WET_ARC_KN08_desc:0 "A Chaos-aligned Naggaroth may yet find submission preferable to destruction. Our demand must reach its government as a choice whose refusal has consequences, rather than a victory proclaimed before it is won."
 WET_ARC_KN08_special_tt:0 "Demand Naggaroth’s submission. Only a Chaos AI government can accept.\nRefusal grants regional war goals."
 WET_ARC_KN18:0 "Naggaroth Under the Eightfold Star"
 WET_ARC_KN18_construction_0_tt:0 "Add §G1§! §Y$arms_factory$§! in owned, fully controlled states."
 WET_ARC_KN18_construction_1_tt:0 "Add §G1§! §Y$dockyard$§! in owned, fully controlled states."
 WET_ARC_KN18_desc:0 "The conquest of Naggaroth must yield more than trophies carried away by departing warbands. Its workshops and shipwrights can supply the means to maintain the settlement and prepare another campaign."
 WET_ARC_KN20:0 "Patronise the Cult of Pleasure"
 WET_ARC_KN20_desc:0 "The Cult of Pleasure offers an opening that a frontal assault cannot provide. Patronage and encouragement may strengthen those within Naggaroth who already look toward the Dark Prince."
 WET_ARC_KN20_special_tt:0 "Offer one foreign cult grant to Naggaroth: transfer up to §Y15§! Evil support points to Chaos and fund one year of cult drift if its current policy permits. Suppression, repudiation or an Asur compact rejects the grant."
 WET_ARC_KN21:0 "The Cult Behind the Throne"
 WET_ARC_KN21_desc:0 "Influence must become political strength before it can shape the fate of a kingdom. We shall help the cult make its case at court, while leaving the final choice to a government capable of accepting it."
 WET_ARC_KN21_special_tt:0 "Offer a second one-time cult grant: up to §Y20§! Evil support points become Chaos support if Naggaroth permits it. A majority cult may request a government change, but neither an explicit purge nor the Crown Above the Cult may be overridden."
 WET_ARC_KO01:0 "The Doom of the Old World"
 WET_ARC_KO01_desc:0 "The Old World contains the roads, cities and armies that stand between the northern host and its greatest enemies. We shall identify the frontier from which that contest can actually begin."
 WET_ARC_KO01_special_tt:0 "Gain war goals against eligible frontier enemies and principal rulers in the §YOld World§!."
 WET_ARC_KO04:0 "Kislev Falls"
 WET_ARC_KO04_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_KO04_desc:0 "Kislev's strength has long guarded the approaches to the southern realms. Its defeat opens roads that must now be repaired and organised for the armies following the vanguard."
 WET_ARC_KO06:0 "Against the Auric Bastion"
 WET_ARC_KO06_desc:0 "If the Empire has raised its golden barrier, we must learn how to break it. Prepare the siege works and sabotage teams that will open a passage for the host."
 WET_ARC_KO06_special_tt:0 "After a prepared Auric Bastion crossing is captured, disable the Bastion and gain §G15 Army Experience§!."
 WET_ARC_KO16:0 "Break the Empire"
 WET_ARC_KO16_desc:0 "Altdorf and Middenheim embody different claims to the Empire's enduring strength. Once its heartland is broken, the Everchosen must decide what use can be made of the cities that have fallen."
 WET_ARC_KO16_special_tt:0 "Gain an event to decide the fate of §YAltdorf§!: preserve its industry or destroy it."
 WET_ARC_KO25:0 "Rule the Broken Provinces"
 WET_ARC_KO25_desc:0 "Conquered provinces can consume an army as surely as an undefeated enemy. A more deliberate administration will reduce resistance and prepare limited campaigns against the frontiers that remain unsettled."
 WET_ARC_KO26:0 "The Old World Subdued"
 WET_ARC_KO26_construction_0_tt:0 "Add §G2§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_KO26_construction_1_tt:0 "Add §G1§! §Y$supply_node$§! in owned, fully controlled states."
 WET_ARC_KO26_desc:0 "Dominion over the Old World must survive the departure of its first victorious armies. Workshops and connected depots will make the new settlement capable of sustaining the forces that guard it."
 WET_ARC_KU01:0 "Claim Ulthuan"
 WET_ARC_KU01_desc:0 "Ulthuan cannot be threatened convincingly by warriors standing upon a distant shore. The host must assemble ships, transports and a usable harbour before it can prepare a serious claim upon the island."
 WET_ARC_KU01_special_tt:0 "Gain war goals against eligible hostile rulers on §YUlthuan§!."
 WET_ARC_KU02:0 "War Against Ulthuan"
 WET_ARC_KU02_desc:0 "Our preparations are complete. Choose the enemy whose defeat will open Ulthuan to the host and begin the invasion."
 WET_ARC_KU02_special_tt:0 "Declare war on one eligible defender of §YUlthuan§!. Existing wars, allies, pacts and truces are respected."
 WET_ARC_KU05:0 "A Beachhead on Ulthuan"
 WET_ARC_KU05_desc:0 "A foothold on Ulthuan is valuable only if it can receive the next wave of the host. Restoring the captured ports will turn a successful landing into a position from which the war can continue."
 WET_ARC_KU05_special_tt:0 "Repair damaged naval bases in controlled states on §YUlthuan§!."
 WET_ARC_KU13:0 "Seize the Great Vortex"
 WET_ARC_KU13_desc:0 "The Great Vortex draws powers whose consequences extend far beyond the island that shelters it. With its approaches secured, we must choose between a dangerous unbinding and the knowledge that can be salvaged from its mysteries."
 WET_ARC_KU18:0 "All Ulthuan Beneath the Crown"
 WET_ARC_KU18_construction_0_tt:0 "Add §G2§! §Y$dockyard$§! in owned, fully controlled states."
 WET_ARC_KU18_construction_1_tt:0 "Add §G2§! §Y$naval_base$§! levels in owned, fully controlled states."
 WET_ARC_KU18_desc:0 "The island's conquest is not complete while its surviving defenders can contest our hold. A settled Ulthuan will support new dockyards and anchorages, giving the crown a firmer position upon the western seas."
 WET_ARC_N00:0 "The Plague God's Acclamation"
 WET_ARC_N00_desc:0 "Nurgle's servants endure where other armies spend themselves in a season. Their realm must join the coalition so that its persistence serves the Everchosen's purpose."
 WET_ARC_N00_special_tt:0 "Invite the patron realm to the Everchosen.\nThe invited realm must agree. Existing allies give §Y+10§! Political Power.\nUnavailable realms give §Y+25§! Political Power and may be invited later."
 WET_ARC_N01:0 "The Grand Coalition — The Father's Favoured"
 WET_ARC_N01_desc:0 "The Father's favoured champions bring powers that cannot be measured by the size of their retinues. We shall seek their service within a coalition built to sustain the long war."
 WET_ARC_N02:0 "The Everchosen's Own — Endure All Things"
 WET_ARC_N02_desc:0 "Archaon's household must remain capable of fighting after the first charge has spent its fury. Endurance and recovery will give it the strength to serve through campaigns that would break a lesser force."
 WET_ARC_N03:0 "The Leechlord's Service"
 WET_ARC_N03_desc:0 "Festus possesses knowledge whose value is matched by the unease it inspires. His service must be sought through an offer that acknowledges the duties and power he already holds."
 WET_ARC_N03_special_tt:0 "Offer §YFestus Rotweaver the Leechlord§! command of an army. If accepted, pay §R5% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_N04:0 "Spume and the Rotting Fleet"
 WET_ARC_N04_desc:0 "Gutrot Spume knows how to turn a northern fleet toward a distant shore. We shall seek his command without confusing the service of one admiral with ownership of his homeland's ships."
 WET_ARC_N04_special_tt:0 "Offer §YGutrot Spume§! command of an army. If accepted, pay §R3% Stability§!. If the recruit currently rules a country, a council takes their place. If the character is unavailable, gain a research bonus and §G15 Army Experience§! instead."
 WET_ARC_N05:0 "Armour Against the Final Winter"
 WET_ARC_N05_desc:0 "The final winter will test more than the strength of a warrior's armour. Archaon must prepare to hold the line when hardship and enemy pressure offer every reason to yield."
 WET_ARC_N05_special_tt:0 "Archaon gains §G1 Defence§!. If he is unavailable, gain §G25 Army Experience§! instead."
 WET_ARC_N06:0 "The Household That Will Not Break"
 WET_ARC_N06_desc:0 "The household should recover its order even when the wider host has begun to falter. Better discipline and a deeper study of war will make its endurance something that commanders can rely upon."
 WET_ARC_N07:0 "One Host, However Misshapen"
 WET_ARC_N07_desc:0 "The host contains warriors whose bodies and habits defy any ordinary muster roll. A system that accounts for their differences can reduce needless losses and bring reserves into battle more reliably."
 WET_ARC_N08:0 "Workshops Beneath the Plague Banners"
 WET_ARC_N08_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_N08_desc:0 "Even a host blessed with terrible resilience depends upon the work of ordinary hands. Workshops beneath the plague banners will provide the productive foundation that the long war requires."
 WET_ARC_N09:0 "Labour for the Long War"
 WET_ARC_N09_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_N09_desc:0 "A season of forced effort cannot replace an economy capable of sustained construction. We shall organise labour and improve its methods so that new works can follow the army without exhausting their makers."
 WET_ARC_N10:0 "The Great Muster-Forges"
 WET_ARC_N10_construction_0_tt:0 "Add §G2§! §Y$arms_factory$§! in owned, fully controlled states."
 WET_ARC_N10_desc:0 "The army's appetite for weapons grows with every campaign. Larger muster-forges will give the crown a greater ability to equip its warriors and replace their losses."
 WET_ARC_N11:0 "Weapons in Unending Number"
 WET_ARC_N11_construction_0_tt:0 "Add §G2§! §Y$arms_factory$§! in owned, fully controlled states."
 WET_ARC_N11_desc:0 "A conquered province is of little use if the host has spent its last serviceable weapons taking it. Expanded arsenals and better industrial methods will support a war that continues beyond its first victories."
 WET_ARC_N12:0 "Production Without Rest"
 WET_ARC_N12_desc:0 "The forges must continue their work when the easy reserves of labour and supplies have been spent. Greater production will come with demands upon the economy that the crown must be prepared to bear."
 WET_ARC_N13:0 "Forges Fed by Warpstone"
 WET_ARC_N13_construction_0_tt:0 "Add §G1§! §Y$energy_infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_N13_desc:0 "Warpstone offers the power needed to feed works that ordinary resources cannot sustain alone. We shall improve its extraction and the infrastructure through which that power reaches the forges."
 WET_ARC_N14:0 "Mines for an Endless Host"
 WET_ARC_N14_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_N14_desc:0 "The host's mines must be served as carefully as its armies. Better extraction and transport will keep their output useful even as the front moves farther from the northern workshops."
 WET_ARC_N15:0 "Granaries of the Marching World"
 WET_ARC_N15_construction_0_tt:0 "Add §G2§! §Y$fuel_silo$§! levels in owned, fully controlled states."
 WET_ARC_N15_desc:0 "A marching world must carry more than weapons in its wagons. Larger granaries and improved methods of provision will preserve the reserves that allow the host to remain in motion."
 WET_ARC_N16:0 "Roads That Survive the Rot"
 WET_ARC_N16_construction_0_tt:0 "Add §G3§! §Y$infrastructure$§! levels in owned, fully controlled states."
 WET_ARC_N16_desc:0 "Roads that fail beneath a season's traffic can undo the work of a victorious army. We shall build routes capable of surviving the demands that the pestilent march places upon them."
 WET_ARC_N17:0 "Supply Depots at the Frontier"
 WET_ARC_N17_construction_0_tt:0 "Add §G1§! §Y$supply_node$§! in owned, fully controlled states."
 WET_ARC_N17_desc:0 "The frontier needs a dependable point from which supplies can reach the advancing host. A connected depot will turn a promising road into part of a working military network."
 WET_ARC_N18:0 "Salvage Every Broken Weapon"
 WET_ARC_N18_desc:0 "A broken weapon still contains metal and labour that the host cannot afford to waste. Organised salvage and maintenance will recover more of that value for the armies still fighting."
 WET_ARC_N19:0 "An Economy for the Last War"
 WET_ARC_N19_desc:0 "The economy must learn from the strain of continuous production. With a substantial industrial base, we can improve both the pace of the forges and the efficiency they retain over time."
 WET_ARC_N20:0 "Reorganise the Rotting Host"
 WET_ARC_N20_desc:0 "The rotting host has survived enough battles to recognise the weaknesses of its own organisation. Its commanders must turn those lessons into a clearer order of battle and a more effective doctrine."
 WET_ARC_N21:0 "Engineers of the Pestilent March"
 WET_ARC_N21_desc:0 "The march is slowed by broken crossings, neglected roads and obstacles that courage cannot remove. Engineers and support troops will give the host practical answers to those difficulties."
 WET_ARC_N22:0 "The Wounded March Again"
 WET_ARC_N22_desc:0 "The wounded represent experience that cannot simply be replaced by another levy. Better care and recovery will return more of that strength to the formations that need it."
 WET_ARC_N23:0 "Monsters Behind the Shield Wall"
 WET_ARC_N23_desc:0 "Monstrous strength is most useful when it supports a battle plan rather than overturning one. We shall study how armoured and monstrous forces can work behind a disciplined line."
 WET_ARC_N24:0 "No Army Outlasts Us"
 WET_ARC_N24_desc:0 "An army that consumes less can remain dangerous after its enemy has exhausted the country around it. Supply discipline and accumulated experience will help the host endure the longest campaigns."
 WET_ARC_N25:0 "The Brothers Glott Approach"
 WET_ARC_N25_desc:0 "Reports of three brothers moving together have reached the court of the Everchosen. Their identities and abilities must be examined before the host commits itself to their service."
 WET_ARC_N26:0 "Recruit the Glottkin"
 WET_ARC_N26_desc:0 "The brothers Glott offer a single, terrible instrument of command and endurance. Their recruitment will give the host that strength while preserving the distinction between them and rulers who merely share their name."
 WET_ARC_N26_special_tt:0 "Recruit one Glottkin commander and the brothers’ support spirit (§Y+3%§! recovery, §Y-3%§! supply use).\n§Y-7§! stability, §Y+5§! war support."
 WET_ARC_N27:0 "Take the Father's Gifts Myself"
 WET_ARC_N27_desc:0 "Archaon intends to command the gifts offered to him, not be commanded by those who bear them. His own study of endurance and logistics will make the household less dependent upon a patron's champions."
 WET_ARC_N27_special_tt:0 "Archaon gains §G1 Logistics§!. If he is unavailable, gain §G25 Army Experience§! instead."
 WET_ARC_N28:0 "The Three Gifts of Nurgle"
 WET_ARC_N28_desc:0 "The Father's gifts can serve different purposes upon the same campaign. We shall prepare plague hosts for the work of supply disruption, coastal war and siege before choosing where to commit them."
 WET_ARC_N28_special_tt:0 "Unlocks the Plague Host supply, coastal and siege operations against neighboring wartime enemies."
 WET_ARC_N29:0 "Three Hosts, One Pestilent Purpose"
 WET_ARC_N29_desc:0 "Preparation is wasted if each host pursues a different ambition. A single operational purpose will direct the next plague campaign against an enemy with whom we are actually at war."
 WET_ARC_N30:0 "The Bells Toll in the South"
 WET_ARC_N30_desc:0 "News of a successful plague-host operation carries farther than the marching columns themselves. We shall use that success to strengthen the resolve and experience of the armies following south."
 WET_ARC_N31:0 "The Father Against the Great Necromancer"
 WET_ARC_N31_desc:0 "The Great Necromancer's strength rests upon works that cannot be defeated by boasting of a future victory. A paid assault on the Black Pyramid must be prepared against its defences, with whatever assistance our agreements can secure."
 WET_ARC_N32:0 "Shatter the Black Pyramid"
 WET_ARC_N32_desc:0 "The Black Pyramid's destruction must be a deed before it becomes a proclamation. Once the assault has truly succeeded, its lessons and prestige can strengthen the host for the wars that remain."
 WET_ARC_N33:0 "Fields Behind the Front"
 WET_ARC_N33_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§! in owned, fully controlled states."
 WET_ARC_N33_desc:0 "Armies eventually destroy the surplus upon which they first marched. Productive land behind the front will help replenish provisions and reduce dependence upon the next conquest."
 WET_ARC_N34:0 "Replace the Fallen, Mend the Host"
 WET_ARC_N34_desc:0 "Losses must be replaced before damaged formations become names without fighting strength. A deliberate programme of reforging will restore equipment through work and time rather than another empty order to the quartermasters."
 WET_ARC_N34_special_tt:0 "Receive §Y1,000§! Infantry Equipment from the war-forges."
 WET_ARC_N35:0 "The Unending March"
 WET_ARC_N35_desc:0 "The host must recover, resupply and move again while its enemies are still counting the cost of the last battle. A culture of endurance will make that repeated effort part of its ordinary practice."
