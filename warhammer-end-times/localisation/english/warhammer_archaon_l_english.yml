 wet_archaon.240.a:0 "The time is not right."
 wet_archaon.240.b:0 "Send our prophecies."
 wet_archaon.240.b_effect:0 "The Everchosen requests a year of arcane counsel. Our realm and ruler remain independent."
 wet_archaon.240.d:0 "Kairos speaks with two voices, neither willing to leave the other’s prophecy unanswered. The court listens as futures unfold and contradict one another beneath the Everchosen’s gaze."
 wet_archaon.240.t:0 "The Fateweaver’s Audience"
 wet_archaon.241.a:0 "Accept the three brothers."
 wet_archaon.241.a_effect:0 "Ghurk, Otto and Ethrac offer one shared command to the Everchosen. They are distinct from Othmar Glottkin, the existing ruler of the Befouled Warriors. Their command currently uses his portrait as an explicit visual stand-in."
 wet_archaon.241.d:0 "The Brothers Glott have arrived amid the stench and devotion of their followers. Their presence promises a new abundance of ruin to the host marching south."
 wet_archaon.241.t:0 "The Brothers Glott"
 wet_archaon.30.a:0 "Raid their lifelines."
 wet_archaon.30.a_effect:0 "Gutrot Spume’s sea war offers two approaches. Choose one permanent naval programme."
 wet_archaon.30.b:0 "Build a line of battle."
 wet_archaon.30.b_effect:0 "Gutrot Spume’s sea war offers two approaches. Choose one permanent naval programme."
 wet_archaon.30.d:0 "Gutrot Spume’s captains dispute how best to spread ruin across the seas. Some would stalk the enemy’s trade, while others demand a fleet strong enough to meet any challenger upon the open water."
 wet_archaon.30.t:0 "The Plague Fleet’s Doctrine"
 wet_archaon.301.a:0 "Keep our secrets."
 wet_archaon.301.b:0 "Exchange the findings."
 wet_archaon.301.b_effect:0 "The Everchosen offers a mutual Arcana research bonus. We can decline without penalty."
 wet_archaon.301.d:0 "Scholars and sorcerers have brought their guarded discoveries to the bargaining table. Each hopes to learn something useful without surrendering the secret that makes him indispensable."
 wet_archaon.301.t:0 "An Exchange of Forbidden Knowledge"
 wet_archaon.345.a:0 "Decline the proposal."
 wet_archaon.345.a_effect:0 "Offer a Chaos neighbour mutual military access and recognition of its tribal rights. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.345.b:0 "Accept the agreement."
 wet_archaon.345.b_effect:0 "Offer a Chaos neighbour mutual military access and recognition of its tribal rights. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.345.d:0 "The chieftains gather beside their longships to hear the Everchosen’s terms. Oaths sworn here will decide whether their crews sail as rival raiders or as part of a greater host."
 wet_archaon.345.t:0 "Oaths Before the Longships"
 wet_archaon.347.a:0 "Decline the proposal."
 wet_archaon.347.a_effect:0 "Offer honours: §Y+10§! subject loyalty and §Y-5%§! resistance target for one year. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.347.b:0 "Accept the agreement."
 wet_archaon.347.b_effect:0 "Offer honours: §Y+10§! subject loyalty and §Y-5%§! resistance target for one year. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.347.d:0 "Archaon’s emissaries offer honours and demand bonds that reach into the chieftains’ households. The proposed settlement would tie their fortunes to his more closely than any battlefield promise."
 wet_archaon.347.t:0 "Hostages, Honours and Marriages"
 wet_archaon.350.a:0 "Decline the proposal."
 wet_archaon.350.a_effect:0 "A peaceful tribal signatory may reaffirm its oath for §Y+3§! stability and §Y5§! loyalty. Existing wars require their own negotiated peace. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.350.b:0 "Accept the agreement."
 wet_archaon.350.b_effect:0 "A peaceful tribal signatory may reaffirm its oath for §Y+3§! stability and §Y5§! loyalty. Existing wars require their own negotiated peace. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.350.d:0 "The Everchosen calls upon his followers to end their private feuds. There will be enemies enough beyond the host, he declares, without spilling strength upon quarrels within it."
 wet_archaon.350.t:0 "No More Wars Among Brothers"
 wet_archaon.351.a:0 "Decline the proposal."
 wet_archaon.351.a_effect:0 "Offer a Chaos neighbour voluntary puppet status and faction membership.\nExisting wars are preserved. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.351.b:0 "Accept the agreement."
 wet_archaon.351.b_effect:0 "Offer a Chaos neighbour voluntary puppet status and faction membership.\nExisting wars are preserved. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.351.d:0 "The conquered rulers have been summoned to hear the shape of the new order. They may retain their thrones, but every crown must acknowledge the power gathered above it."
 wet_archaon.351.t:0 "An Empire of Kneeling Kings"
 wet_archaon.352.a:0 "Decline the proposal."
 wet_archaon.352.a_effect:0 "Buy §Y500§! infantry equipment from a willing subject. The equipment is removed from its stockpile and delivered to ours. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.352.b:0 "Accept the agreement."
 wet_archaon.352.b_effect:0 "Buy §Y500§! infantry equipment from a willing subject. The equipment is removed from its stockpile and delivered to ours. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.352.d:0 "The Everchosen’s collectors have arrived with demands for the host. Iron must feed the forges and grain the marching armies, whatever complaints rise from the courts that supply them."
 wet_archaon.352.t:0 "Tribute in Iron and Grain"
 wet_archaon.353.a:0 "Decline the proposal."
 wet_archaon.353.a_effect:0 "Fund one civilian factory in a willing subject’s controlled state with capacity. At most two grants. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.353.b:0 "Accept the agreement."
 wet_archaon.353.b_effect:0 "Fund one civilian factory in a willing subject’s controlled state with capacity. At most two grants. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.353.d:0 "Representatives of the conquered realms have assembled beneath watchful guards. They are offered a voice in the affairs of the host, though none can mistake where final authority rests."
 wet_archaon.353.t:0 "Councils of the Conquered"
 wet_archaon.355.a:0 "Decline the proposal."
 wet_archaon.355.a_effect:0 "Both participants receive §Y-3%§! supply consumption for one year. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.355.b:0 "Accept the agreement."
 wet_archaon.355.b_effect:0 "Both participants receive §Y-3%§! supply consumption for one year. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.355.d:0 "Separate levies and rival stores have slowed the host long enough. The Everchosen’s officers propose a common direction for the armies and workshops now serving his wars."
 wet_archaon.355.t:0 "Integrate the War Effort"
 wet_archaon.357.a:0 "Decline the proposal."
 wet_archaon.357.a_effect:0 "Open negotiations with the current Vermintide leader.\nThis does not change its faction. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.357.b:0 "Accept the agreement."
 wet_archaon.357.b_effect:0 "Open negotiations with the current Vermintide leader.\nThis does not change its faction. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.357.d:0 "The Everchosen’s messengers have descended into the warrens to meet the Council. Neither side expects honesty, but both can imagine advantages great enough to begin the bargaining."
 wet_archaon.357.t:0 "Envoys to the Council of Thirteen"
 wet_archaon.358.a:0 "Decline the proposal."
 wet_archaon.358.a_effect:0 "Agree a one-year sphere pact and non-aggression agreement. Vermintide stays independent. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.358.b:0 "Accept the agreement."
 wet_archaon.358.b_effect:0 "Agree a one-year sphere pact and non-aggression agreement. Vermintide stays independent. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.358.d:0 "A map of the world lies between the Everchosen’s envoys and the Council’s representatives. Above and below its surface, each sees conquests that might be won more easily while the other looks elsewhere."
 wet_archaon.358.t:0 "Divide the World Beneath Our Feet"
 wet_archaon.359.a:0 "Decline the proposal."
 wet_archaon.359.a_effect:0 "Transfer four units of Warpstone production from one willing Skaven state to our controlled capital for one year. Deposits are restored automatically. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.359.b:0 "Accept the agreement."
 wet_archaon.359.b_effect:0 "Transfer four units of Warpstone production from one willing Skaven state to our controlled capital for one year. Deposits are restored automatically. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.359.d:0 "The Skaven offer Warpstone for the Everchosen’s forges. Its sickly glow promises terrible weapons, if the smiths can master what the rats have brought them."
 wet_archaon.359.t:0 "Warpstone for the War-Forges"
 wet_archaon.360.a:0 "Decline the proposal."
 wet_archaon.360.a_effect:0 "Request Skaven assistance for the Black Pyramid assault. Acceptance improves our operation.\nIt does not destroy the Pyramid. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.360.b:0 "Accept the agreement."
 wet_archaon.360.b_effect:0 "Request Skaven assistance for the Black Pyramid assault. Acceptance improves our operation.\nIt does not destroy the Pyramid. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.360.d:0 "The servants of Chaos and the Council have found a common enemy among the dead. Their envoys discuss a joint blow, each hoping the other will pay the greater price."
 wet_archaon.360.t:0 "A Common Enemy in Death"
 wet_archaon.361.a:0 "Decline the proposal."
 wet_archaon.361.a_effect:0 "Review and renew the sphere pact for one year. Refusal grants no war goal. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.361.b:0 "Accept the agreement."
 wet_archaon.361.b_effect:0 "Review and renew the sphere pact for one year. Refusal grants no war goal. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.361.d:0 "Reports from the rear suggest that our Skaven partners have been pursuing another bargain. The Council’s assurances sound thinner now that their knives have been glimpsed so close to our own lines."
 wet_archaon.361.t:0 "The Rat’s Knife at Our Back"
 wet_archaon.362.a:0 "Decline the proposal."
 wet_archaon.362.a_effect:0 "Open a common-enemy bargain. The Last Waaagh keeps its faction and leader. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.362.b:0 "Accept the agreement."
 wet_archaon.362.b_effect:0 "Open a common-enemy bargain. The Last Waaagh keeps its faction and leader. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.362.d:0 "The Everchosen’s messengers have reached the Greenskin bosses with an offer of enemies and plunder. Whether the invitation is understood as diplomacy or a challenge may depend upon who speaks first."
 wet_archaon.362.t:0 "An Invitation to the Last Waaagh"
 wet_archaon.363.a:0 "Decline the proposal."
 wet_archaon.363.a_effect:0 "Invite an eastern campaign and offer legal regional war goals. The historical milestone is recorded only if Grimgor actually begins an eastern war. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.363.b:0 "Accept the agreement."
 wet_archaon.363.b_effect:0 "Invite an eastern campaign and offer legal regional war goals. The historical milestone is recorded only if Grimgor actually begins an eastern war. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.363.d:0 "The envoys have laid eastern maps before the Greenskin bosses. They promise rich fighting beyond those mountains, hoping to turn the gathering Waaagh toward a useful enemy."
 wet_archaon.363.t:0 "Point the Waaagh East"
 wet_archaon.364.a:0 "Decline the proposal."
 wet_archaon.364.a_effect:0 "Transfer §Y1,000§! infantry equipment for one year of coordinated planning. No land changes hands before conquest. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.364.b:0 "Accept the agreement."
 wet_archaon.364.b_effect:0 "Transfer §Y1,000§! infantry equipment for one year of coordinated planning. No land changes hands before conquest. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.364.d:0 "A share of the coming conquests has been offered to the Greenskin bosses. Their arguments now concern the size of the prize rather than whether there should be a fight."
 wet_archaon.364.t:0 "Spoils Worth Fighting For"
 wet_archaon.365.a:0 "Decline the proposal."
 wet_archaon.365.a_effect:0 "A one-time extension offers another year of coordinated planning.\nRefusal ends this offer without altering the Greenskin faction. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.365.b:0 "Accept the agreement."
 wet_archaon.365.b_effect:0 "A one-time extension offers another year of coordinated planning.\nRefusal ends this offer without altering the Greenskin faction. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.365.d:0 "The Greenskin camps grow restless wherever the march slows. The Everchosen’s envoys offer fresh targets and fresh plunder before that impatience turns upon the host itself."
 wet_archaon.365.t:0 "Keep the Green Tide Moving"
 wet_archaon.368.a:0 "Decline the proposal."
 wet_archaon.368.a_effect:0 "Invite each external partner separately to a joint offensive conference. Each consenting participant receives a year of shared logistics.\nNo factions merge. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.368.b:0 "Accept the agreement."
 wet_archaon.368.b_effect:0 "Invite each external partner separately to a joint offensive conference. Each consenting participant receives a year of shared logistics.\nNo factions merge. The recipient may refuse.\nExisting factions and third-party wars are preserved."
 wet_archaon.368.d:0 "The envoys have reached the end of their bargaining. A settlement now lies before the gathered rulers, binding ambitions that may prove as dangerous to one another as to their enemies."
 wet_archaon.368.t:0 "The Grand Bargain"
 wet_archaon.40.a:0 "Preserve the workshops."
 wet_archaon.40.a_effect:0 "The city is under our control. Decide whether to preserve its workshops or leave a lasting ruin."
 wet_archaon.40.b:0 "Make an example of the city."
 wet_archaon.40.b_effect:0 "The city is under our control. Decide whether to preserve its workshops or leave a lasting ruin."
 wet_archaon.40.d:0 "Altdorf lies before the victors, its streets scarred and its proud towers beneath hostile banners. The Everchosen must decide whether the city will serve his conquests or become a monument to their cost."
 wet_archaon.40.t:0 "The Fate of Altdorf"
 wet_archaon.41.a:0 "We must respond."
 wet_archaon.41.d:0 "A dreadful thunder rolls across the sands as the Black Pyramid breaks. Ancient powers spill from its ruin, and the servants of Nagash look upon a wound that stone alone cannot mend."
 wet_archaon.41.t:0 "The Black Pyramid Shattered"
