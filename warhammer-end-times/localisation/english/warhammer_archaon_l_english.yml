 wet_arc_unbind_vortex_desc:0 "The controller of the Great Vortex may destroy it for 250 Political Power, drowning Ulthuan and releasing the Winds of Magic."
 wet_arc_unbind_vortex_effect:0 "$wet_vortex_destroy_tt$"
 wet_arc_unbind_vortex_requirements:0 "Controls the Great Vortex. It has not already been destroyed."
