 wet_archaon.10.a:0 "We cannot honour the summons."
 wet_archaon.10.a_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.10.b:0 "Join the Everchosen."
 wet_archaon.10.b_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.10.d:0 "A summons bearing the Everchosen’s seal has reached our court. The warlord who would unite the servants of Chaos calls upon us to bring our strength beneath his banner."
 wet_archaon.10.t:0 "The Everchosen Calls"
 wet_archaon.100.a:0 "We refuse."
 wet_archaon.100.a_effect:0 "Archaon demands that Naggaroth accept Chaos and submit to his crown. Only an AI-controlled Chaos government can accept this ultimatum. Refusal gives the Everchosen grounds for war."
 wet_archaon.100.b:0 "Accept the terms."
 wet_archaon.100.b_effect:0 "Archaon demands that Naggaroth accept Chaos and submit to his crown. Only an AI-controlled Chaos government can accept this ultimatum. Refusal gives the Everchosen grounds for war."
 wet_archaon.100.d:0 "Archaon’s herald has come beneath the Eightfold Star. He offers Naggaroth a place in the host gathering around him, and leaves little doubt about the fate he intends for those who refuse."
 wet_archaon.100.t:0 "The Everchosen’s Dark Covenant"
 wet_archaon.101.a:0 "Preserve the current court."
 wet_archaon.101.b:0 "Let the Cult of Pleasure rule."
 wet_archaon.101.b_effect:0 "Slaaneshi cults have gained influence throughout Naggaroth. A Chaos government may now take power if it commands majority support. This does not make us Archaon’s subject."
 wet_archaon.101.b_outcome:0 "Allows the Cult of Pleasure to establish a Chaos government."
 wet_archaon.101.d:0 "Whispers of forbidden devotion have become too persistent to dismiss. Somewhere behind Naggaroth’s public ceremonies, another power is being courted in the dark."
 wet_archaon.101.t:0 "The Cult Behind the Throne"
 wet_archaon.11.a:0 "We cannot honour the summons."
 wet_archaon.11.a_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.11.b:0 "Join the Everchosen."
 wet_archaon.11.b_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.11.d:0 "A summons bearing the Everchosen’s seal has reached our court. The warlord who would unite the servants of Chaos calls upon us to bring our strength beneath his banner."
 wet_archaon.11.t:0 "The Everchosen Calls"
 wet_archaon.110.a:0 "We refuse."
 wet_archaon.110.a_effect:0 "The Everchosen offers tribute worth §Y100§! Political Power, recognition as Overtyrant, and support for conquering the remaining Ogre kingdoms. In return Goldtooth must become his subject. Promised territory is delivered only after it is actually conquered and settled."
 wet_archaon.110.b:0 "Accept the terms."
 wet_archaon.110.b_effect:0 "The Everchosen offers tribute worth §Y100§! Political Power, recognition as Overtyrant, and support for conquering the remaining Ogre kingdoms. In return Goldtooth must become his subject. Promised territory is delivered only after it is actually conquered and settled."
 wet_archaon.110.d:0 "The Everchosen has sent tribute and promises to the Overtyrant’s court. His envoys speak of richer conquests to come, provided Goldtooth acknowledges the champion whose armies will help win them."
 wet_archaon.110.t:0 "Gold for the Overtyrant"
 wet_archaon.12.a:0 "We cannot honour the summons."
 wet_archaon.12.a_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.12.b:0 "Join the Everchosen."
 wet_archaon.12.b_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.12.d:0 "A summons bearing the Everchosen’s seal has reached our court. The warlord who would unite the servants of Chaos calls upon us to bring our strength beneath his banner."
 wet_archaon.12.t:0 "The Everchosen Calls"
 wet_archaon.120.a:0 "We refuse."
 wet_archaon.120.a_effect:0 "The Everchosen demands passage into Cathay and submission of the Hobgoblin Khaganate. We may accept his overlordship or face his armies."
 wet_archaon.120.b:0 "Accept the terms."
 wet_archaon.120.b_effect:0 "The Everchosen demands passage into Cathay and submission of the Hobgoblin Khaganate. We may accept his overlordship or face his armies."
 wet_archaon.120.d:0 "Archaon demands the allegiance of the Khaganate and a road toward Cathay. The khan’s advisers glance from the herald to the frontier maps, measuring the distance between refusal and war."
 wet_archaon.120.t:0 "The Hobgoblin Ultimatum"
 wet_archaon.13.a:0 "We cannot honour the summons."
 wet_archaon.13.a_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.13.b:0 "Join the Everchosen."
 wet_archaon.13.b_effect:0 "Archaon has been crowned Everchosen and calls this realm to join his faction. The realm retains its sovereign ruler."
 wet_archaon.13.d:0 "A summons bearing the Everchosen’s seal has reached our court. The warlord who would unite the servants of Chaos calls upon us to bring our strength beneath his banner."
 wet_archaon.13.t:0 "The Everchosen Calls"
 wet_archaon.130.a:0 "We will keep our independence from this alliance."
 wet_archaon.130.a_effect:0 "Archaon offers a place in the Everchosen’s faction and the lands of Cathay. This is an alliance, not subjection. The promise covers only Cathayan land the Everchosen later owns and controls.\nOther allies’ land is not his to give."
 wet_archaon.130.b:0 "Accept the alliance and the promised lands."
 wet_archaon.130.b_effect:0 "Archaon offers a place in the Everchosen’s faction and the lands of Cathay. This is an alliance, not subjection. The promise covers only Cathayan land the Everchosen later owns and controls.\nOther allies’ land is not his to give."
 wet_archaon.130.d:0 "Archaon’s envoys offer the Monkey Court an alliance and a share in Cathay’s future. The bargain tempts ambition, though its shadow reaches far beyond the lands named upon the map."
 wet_archaon.130.t:0 "An Offer to the Monkey Court"
 wet_archaon.131.a:0 "A new contender for Cathay."
 wet_archaon.131.d:0 "The Monkey Court has accepted the bargain. Its banners will stand beside ours, and its rulers now look east toward the rewards they expect victory to bring."
 wet_archaon.131.t:0 "The Monkey Court Joins Us"
 wet_archaon.132.a:0 "We shall proceed without them."
 wet_archaon.132.d:0 "The Monkey Court has declined our offer. Its rulers intend to pursue their own designs, leaving the Everchosen to weigh how much patience those ambitions deserve."
 wet_archaon.132.t:0 "The Monkey Court Declines"
 wet_archaon.140.a:0 "We refuse."
 wet_archaon.140.a_effect:0 "The Everchosen offers continued rule over the forges in exchange for subject status. Refusal means conquest."
 wet_archaon.140.b:0 "Accept the terms."
 wet_archaon.140.b_effect:0 "The Everchosen offers continued rule over the forges in exchange for subject status. Refusal means conquest."
 wet_archaon.140.d:0 "The herald of the Everchosen stands before the masters of the forges. Their furnaces and crowns may endure beneath his protection, he says, but defiance will be answered in fire."
 wet_archaon.140.t:0 "The Sorcerer-Prophets’ Choice"
 wet_archaon.150.a:0 "We refuse."
 wet_archaon.150.a_effect:0 "A Chaos-aligned Cathayan court may retain its crown under the Everchosen. Other governments must resist his demand."
 wet_archaon.150.b:0 "Accept the terms."
 wet_archaon.150.b_effect:0 "A Chaos-aligned Cathayan court may retain its crown under the Everchosen. Other governments must resist his demand."
 wet_archaon.150.d:0 "Archaon offers our court a crown beneath his banner. The throne would remain, but the hand above it would belong to the Everchosen."
 wet_archaon.150.t:0 "A Crown Beneath the Eightfold Star"
 wet_archaon.198.a:0 "Let the new banners be raised."
 wet_archaon.198.d:0 "The envoys have returned bearing an oath of submission. Another ruler has bent the knee, and the Everchosen’s heralds proclaim the news through the camps."
 wet_archaon.198.t:0 "Submission Accepted"
 wet_archaon.199.a:0 "Prepare the host."
 wet_archaon.199.d:0 "Our herald has returned without the oath he demanded. The defiant court has chosen its answer, leaving the Everchosen to decide how loudly his armies should reply."
 wet_archaon.199.t:0 "The Ultimatum Refused"
 wet_archaon.200.a:0 "Their duty remains here."
 wet_archaon.200.a_effect:0 "Archaon requests the service of Valkia Bloodskorn the Bloody. Acceptance transfers this character, installs a council if they currently rule, and gives Archaon a commander."
 wet_archaon.200.b:0 "Let them join the Everchosen’s court."
 wet_archaon.200.b_effect:0 "Archaon requests the service of Valkia Bloodskorn the Bloody. Acceptance transfers this character, installs a council if they currently rule, and gives Archaon a commander."
 wet_archaon.200.d:0 "The Everchosen offers a place among the champions of his host. Beyond the honour lie battles enough to make a legend, or to end one without a grave."
 wet_archaon.200.t:0 "Service Beneath the Everchosen"
