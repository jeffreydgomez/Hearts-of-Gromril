 wet_grn_absorbable_diplomacy_tt:0 "Is an independent, factionless neighbouring Waaagh realm with strictly fewer deployed army soldiers, has not capitulated and is not at war with us."
 wet_grn_another_faction:0 "Challenge Another Faction: [FROM.GetFactionName]"
 wet_grn_another_faction_desc:0 "After a 14-day preparation, declare on this still-current foreign faction leader and gain the F06 effort for 180 days. One effort per defending faction; no unaffiliated major can be selected. A stale target cancels the preparation. Only one new faction preparation can run at a time."
