 WET_GRN_ABSORB_DIPLOMACY:0 "Absorb into the Last Waaagh"
 WET_GRN_ABSORB_DIPLOMACY_ACTION_DESC:0 "The smaller tribes recognise the biggest host. Their lands and surviving warriors will join the Last Waaagh."
 WET_GRN_ABSORB_DIPLOMACY_TITLE:0 "Absorb into the Last Waaagh"
 WET_GRN_B00:0 "Feed and Arm the Waaagh"
 WET_GRN_B00_desc:0 "A growing host needs workshops and baggage as well as bosses. Organise the work that keeps it fighting."
 WET_GRN_B01:0 "The Forges of Black Crag"
 WET_GRN_B01_desc:0 "The home forges must supply a larger army. Expand the works without emptying the other settlements."
 WET_GRN_B02:0 "More Choppas"
 WET_GRN_B02_desc:0 "Every new mob needs serviceable weapons. Standardise the simplest patterns and keep the forges supplied."
 WET_GRN_B03:0 "Armour for the Biggest Boyz"
 WET_GRN_B03_desc:0 "The best fighters need equipment that survives the next battle. Organise the smiths around their requirements."
 WET_GRN_B04:0 "Rock Lobbers and Spear Chukkas"
 WET_GRN_B04_desc:0 "The host needs weapons that can break formations before the charge. Give the workshops reliable plans to follow."
 WET_GRN_B05:0 "Squigs, Boars and Beasts"
 WET_GRN_B05_desc:0 "The host’s animals need keepers and supplies. Bring their handlers into the army’s planning."
 WET_GRN_B06:0 "The Baggage Mob"
 WET_GRN_B06_desc:0 "Captured stores are useless when left behind. Organise wagons and escorts for the marching host."
 WET_GRN_B07:0 "Gather the Camp Followers"
 WET_GRN_B07_desc:0 "A permanent host needs places where its workers can gather. Expand the home workshops around the mustering camps."
 WET_GRN_B07_special_tt:0 "Add §G1§! §Y$industrial_complex$§! in an owned, fully controlled home state when building capacity is available."
 WET_GRN_B08:0 "Keep the Wagons Moving"
 WET_GRN_B08_desc:0 "Broken wagons can halt an army faster than an enemy. Put repair crews along the march."
 WET_GRN_B09:0 "Teach the Clever Grots"
 WET_GRN_B09_desc:0 "Every captured machine offers something to learn. Give the cleverest workers time and tools to copy useful designs."
 WET_GRN_B10:0 "A Workshop for Every Trick"
 WET_GRN_B10_desc:0 "The growing collection of designs needs a permanent home. Establish a workshop that can experiment while the others produce."
 WET_GRN_B11:0 "An Arsenal for the Last Waaagh"
 WET_GRN_B11_desc:0 "Weapons and supplies must reach the same armies. Bring the workshops under one production plan."
 WET_GRN_B11_special_tt:0 "1 military factory credit; production efficiency cap +5%."
 WET_GRN_C00:0 "The Great Green Prophecy"
 WET_GRN_C00_desc:0 "The shamans speak of two champions. Carry their prophecy to the bosses gathering at Black Crag."
 WET_GRN_C01:0 "Grimgor, the Fist of Gork"
 WET_GRN_C01_desc:0 "Grimgor claims the right to lead through strength. Let the assembled bosses witness the Immortulz at work."
 WET_GRN_C02:0 "Skarsnik, the Hand of Mork"
 WET_GRN_C02_desc:0 "Skarsnik offers victories won through traps and deceit. Hear his claim alongside the Black Orc warlord’s."
 WET_GRN_C03:0 "Two Champions, One Waaagh"
 WET_GRN_C03_desc:0 "The assembled tribes must decide who gives the orders. Grimgor and Skarsnik will lead the Waaagh."
 WET_GRN_C03_requirement:0 "Required named champion(s) alive and available; choice commits on completion."
 WET_GRN_C03_special_tt:0 "Leadership passes to Grimgor and Skarsnik. Unlocks §YAbsorb into the Last Waaagh§!: spend §Y30§! Political Power to annex a weaker independent, factionless Waaagh neighbour and its troops."
 WET_GRN_C04:0 "Grimgor Is Da Boss"
 WET_GRN_C04_desc:0 "The assembled tribes must decide who gives the orders. Grimgor Ironhide will lead the Waaagh."
 WET_GRN_C04_requirement:0 "Required named champion(s) alive and available; choice commits on completion."
 WET_GRN_C04_special_tt:0 "Leadership passes to Grimgor. Unlocks §YAbsorb into the Last Waaagh§!: spend §Y30§! Political Power to annex a weaker independent, factionless Waaagh neighbour and its troops."
 WET_GRN_C05:0 "Skarsnik Is Da Boss"
 WET_GRN_C05_desc:0 "The assembled tribes must decide who gives the orders. Skarsnik will lead the Waaagh."
 WET_GRN_C05_requirement:0 "Required named champion(s) alive and available; choice commits on completion."
 WET_GRN_C05_special_tt:0 "Leadership passes to Skarsnik. Unlocks §YAbsorb into the Last Waaagh§!: spend §Y30§! Political Power to annex a weaker independent, factionless Waaagh neighbour and its troops."
 WET_GRN_E00:0 "The Last Waaagh Goes East"
 WET_GRN_E00_desc:0 "Beyond the pass lie slave empires and mountain kingdoms. Choose an eastern road for the gathering host."
 WET_GRN_E01:0 "The Dark Lands Road"
 WET_GRN_E01_desc:0 "Ash and bad ground punish an unprepared army. Establish stores before the host enters the Dark Lands."
 WET_GRN_E02:0 "Break the Slave Masters"
 WET_GRN_E02_desc:0 "The Chaos Dwarfs keep Greenskins in chains. Prepare war against their surviving realms."
 WET_GRN_E02_special_tt:0 "Gain conquest goals on current Chaos Dwarf countries in the fixed Dark Lands regions."
 WET_GRN_E03:0 "Signals in the Slave Pits"
 WET_GRN_E03_desc:0 "Captives can disrupt the forges when the Waaagh approaches. Prepare a raid against the same industrial district the army intends to attack."
 WET_GRN_E03_special_tt:0 "Unlock 50-PP, 30-day sabotage: -10% local supply impact and -10% available local factories in one bordering enemy Chaos Dwarf state for 90 days; once per state."
 WET_GRN_E04:0 "The Gates of Zharr-Naggrund"
 WET_GRN_E04_desc:0 "The great city dominates the plain. Prepare the army to break its walls."
 WET_GRN_E04_special_tt:0 "Concentrate the host for 120 days when this campaign has an eligible enemy."
 WET_GRN_E05:0 "Claim the Black Ziggurat"
 WET_GRN_E05_desc:0 "The slave masters’ greatest city has fallen. Let the host see their old authority broken."
 WET_GRN_E06:0 "Loot the Forges"
 WET_GRN_E06_desc:0 "The captured foundries can make weapons for new masters. Put the surviving works back into production."
 WET_GRN_E07:0 "The Freed Mobs"
 WET_GRN_E07_desc:0 "The opened slave pits add new followers to the host. Muster the survivors around their own veterans."
 WET_GRN_E08:0 "The Road to the Overtyrant"
 WET_GRN_E08_desc:0 "The Ogre kingdoms control the mountain roads farther east. Gather supplies before challenging their strongest ruler."
 WET_GRN_E09:0 "Challenge Greasus Goldtooth"
 WET_GRN_E09_desc:0 "Greasus claims a supremacy the Waaagh cannot ignore. Prepare war against his current realm."
 WET_GRN_E09_special_tt:0 "Gain a conquest war goal against the realm defending §Y[I01.GetNameDef]§!."
 WET_GRN_E10:0 "Bring Down the Biggest Ogre"
 WET_GRN_E10_desc:0 "The Overtyrant’s army must be beaten in the field. Organise the host for a contest against its heaviest fighters."
 WET_GRN_E10_special_tt:0 "Concentrate the host for 120 days when this campaign has an eligible enemy."
 WET_GRN_E11:0 "The Overtyrant’s Seat"
 WET_GRN_E11_desc:0 "The host holds the centre of Goldtooth’s power. Make the captured court a trophy of the eastern campaign."
 WET_GRN_E12:0 "Bigger Beasts for Bigger Battles"
 WET_GRN_E12_desc:0 "The conquered mountains offer formidable beasts. Learn to equip and maintain them for the next war."
 WET_GRN_E13:0 "The Other Mountain Tyrants"
 WET_GRN_E13_desc:0 "Goldtooth is only one of the eastern kingdoms. Map the remaining tyrants and their roads."
 WET_GRN_E13_special_tt:0 "Gain goals against hostile Ogre owners in the fixed Mountains of Mourn region; normal conquest, no Greenskin absorption."
 WET_GRN_E14:0 "The Eastern Greenskin Hosts"
 WET_GRN_E14_desc:0 "Hobgoblins and distant Orc tribes have their own warlords. Give them the same challenge as the western mobs."
 WET_GRN_E15:0 "The Ivory Road"
 WET_GRN_E15_desc:0 "The caravan route leads to richer lands still. Prepare a campaign along its existing roads."
 WET_GRN_E15_special_tt:0 "Unlock a lawful Cathayan conquest goal after controlled contact with its frontier; one 50% logistics research bonus."
 WET_GRN_E16:0 "A Wall Worth Breaking"
 WET_GRN_E16_desc:0 "The Great Bastion promises a fight the host will remember. Prepare a concentrated assault against its current defenders."
 WET_GRN_E16_special_tt:0 "Concentrate the host for 120 days when this campaign has an eligible enemy."
 WET_GRN_E17:0 "Plant the Banner on the Bastion"
 WET_GRN_E17_desc:0 "The army has reached the great wall. Hold its captured landmark long enough to proclaim the victory."
 WET_GRN_E18:0 "The Eastern Trophy Pole"
 WET_GRN_E18_desc:0 "A great eastern victory has made the champions’ name travel farther. Display the trophies before choosing another enemy."
 WET_GRN_E19:0 "The Long Road Home"
 WET_GRN_E19_desc:0 "The host cannot live on distant victories alone. Organise escorts and stores along the conquered roads."
 WET_GRN_F00:0 "The World Is Ready for the Great Waaagh"
 WET_GRN_F00_desc:0 "Every great power is preparing for the final struggle. The Waaagh will choose its enemies for itself."
 WET_GRN_F00_requirement:0 "§Y100%§! world tension AND a completed champion choice."
 WET_GRN_F00_special_tt:0 "Gain 25 Army Experience and prepare the final faction campaigns."
 WET_GRN_F01:0 "Archaon Is Not Da Best"
 WET_GRN_F01_desc:0 "The Everchosen offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F01_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F01_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +30% attack, +20% defence and +25% breakthrough against its actual belligerents."
 WET_GRN_F01_target:0 "The current leader of the named faction is selected when this focus begins."
 WET_GRN_F02:0 "Break the Grand Alliance"
 WET_GRN_F02_desc:0 "The Grand Alliance offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F02_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F02_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +25% attack, +20% defence and +30% breakthrough against its actual belligerents."
 WET_GRN_F02_target:0 "The current leader of the named faction is selected when this focus begins."
 WET_GRN_F03:0 "Smash the Vermintide"
 WET_GRN_F03_desc:0 "The Vermintide offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F03_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F03_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +25% attack, +25% defence and +20% breakthrough against its actual belligerents."
 WET_GRN_F03_target:0 "The current leader of the named faction is selected when this focus begins."
 WET_GRN_F04:0 "Even Nagash Must Fight"
 WET_GRN_F04_desc:0 "Nagashi offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F04_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F04_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +30% attack, +25% defence and +20% breakthrough against its actual belligerents."
 WET_GRN_F04_target:0 "The current leader of the named faction is selected when this focus begins."
 WET_GRN_F05:0 "Break the Phoenix Concord"
 WET_GRN_F05_desc:0 "The Phoenix Concord offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F05_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F05_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +25% attack, +20% defence and +25% breakthrough against its actual belligerents."
 WET_GRN_F05_target:0 "The current leader of the named faction is selected when this focus begins."
 WET_GRN_F06:0 "No Other Banner above Ours"
 WET_GRN_F06_desc:0 "Other Foreign Factions offers the host another great opponent. Choose its actual faction leader in the war ledger and announce the challenge."
 WET_GRN_F06_requirement:0 "§Y100%§! world tension; a selected existing foreign faction leader; lawful war; no treaty or previous effort against this faction."
 WET_GRN_F06_special_tt:0 "Declare war on the selected current foreign faction leader, or activate during an existing war. One 180-day effort per defending faction: +25% attack, +20% defence and +25% breakthrough against its actual belligerents. Unlock further 14-day faction challenges after this effort expires."
 WET_GRN_F06_target:0 "Selected faction leader: [?wet_grn_choice_F06^0.GetNameWithFlag]. The bound completion target cannot change without an explicit recovery selection."
 WET_GRN_F21:0 "Da Last Waaagh, Da Biggest Victory"
 WET_GRN_F21_desc:0 "The host has defeated a great coalition in the final struggle. Raise a trophy pole that tells every remaining rival what comes next."
 WET_GRN_F21_requirement:0 "A declared final-war faction has capitulated with its recorded capital under [G24.GetNameDef] control."
 WET_GRN_G00:0 "The Immortulz"
 WET_GRN_G00_desc:0 "Grimgor’s oldest companions set the standard. Every mob will learn to stand its ground."
 WET_GRN_G01:0 "Only the Biggest Boyz"
 WET_GRN_G01_desc:0 "The strongest fighters earn the best places. The army will train assault mobs around them."
 WET_GRN_G02:0 "Gitsnik Leads the Charge"
 WET_GRN_G02_desc:0 "The boss will strike where resistance is hardest. His captains must exploit every opening."
 WET_GRN_G03:0 "No Boss Left Standing"
 WET_GRN_G03_desc:0 "Rival champions cannot hide behind their mobs. Train the veterans for the decisive assault."
 WET_GRN_G03_special_tt:0 "Additional +10% attack against Greenskin enemies only."
 WET_GRN_G04:0 "Da Best"
 WET_GRN_G04_desc:0 "Every victory strengthens Grimgor’s claim. The army expects him to deliver another."
 WET_GRN_JointOffice:0 "Grimgor and Skarsnik"
 WET_GRN_K00:0 "The Crooked Moon Way"
 WET_GRN_K00_desc:0 "Skarsnik’s followers know when to disappear. Their enemies will never be certain which road is safe."
 WET_GRN_K01:0 "Nasty Skulkers"
 WET_GRN_K01_desc:0 "The smallest fighters can find the largest gaps. Train raiders to exploit exposed supply parties."
 WET_GRN_K02:0 "A Trap for Every Boss"
 WET_GRN_K02_desc:0 "A rival’s pride makes him predictable. Prepare the ground before inviting him to fight."
 WET_GRN_K02_special_tt:0 "Additional +10% defence against Greenskin enemies only."
 WET_GRN_K03:0 "Feed Gobbla’s Legend"
 WET_GRN_K03_desc:0 "Fear spreads faster than an army. Turn Skarsnik’s reputation into orders the mobs will remember."
 WET_GRN_K04:0 "The Cleverest Git"
 WET_GRN_K04_desc:0 "Winning cheaply leaves more fighters for the next campaign. Make cunning the measure of a successful captain."
 WET_GRN_M00:0 "A Waaagh along the World’s Edge"
 WET_GRN_M00_desc:0 "The mountains offer roads north and south from Black Crag. Prepare both approaches without committing the whole host to either."
 WET_GRN_N00:0 "The Iron Rock Challenge"
 WET_GRN_N00_desc:0 "Iron Rock’s boss stands near the northern road. Challenge the current Greenskin holder or prepare a lawful goal against another owner."
 WET_GRN_N00_special_tt:0 "Reveal §Y$STATE_534$§! challenge; instant goal against its hostile current owner."
 WET_GRN_N01:0 "March the Silver Road"
 WET_GRN_N01_desc:0 "The Silver Road leads toward the Dwarf heartland. Scout the defended approaches before the host advances."
 WET_GRN_N01_special_tt:0 "Goal against the hostile owner of §Y$STATE_1060$§!; one 50% engineer research bonus."
 WET_GRN_N02:0 "At the High King’s Gates"
 WET_GRN_N02_desc:0 "Karaz-a-Karak stands above the road. Prepare a campaign against the current defender of the hold."
 WET_GRN_N02_special_tt:0 "Instant conquest goal against the hostile owner of §Y$STATE_588$§!."
 WET_GRN_N03:0 "The High King’s Throne"
 WET_GRN_N03_desc:0 "The hold has fallen into Greenskin hands. Claim its landmark as a northern trophy."
 WET_GRN_N04:0 "The Gunbad Mines"
 WET_GRN_N04_desc:0 "The northern mines can supply the host’s weapons. Prepare to seize their current owner’s holdings."
 WET_GRN_N04_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_N05:0 "Break the Slayer Gate"
 WET_GRN_N05_desc:0 "Karak Kadrin guards the next great passage. Prepare the mobs for a determined defence."
 WET_GRN_N05_special_tt:0 "Concentrate the host for 120 days when this campaign has an eligible enemy."
 WET_GRN_N06:0 "Red Eye Mountain"
 WET_GRN_N06_desc:0 "The old mountain stronghold is a prize in its own right. Turn the host toward its current occupiers."
 WET_GRN_N06_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_N07:0 "Zhufbar’s Workshops"
 WET_GRN_N07_desc:0 "The eastern workshops promise useful machines. Prepare a separate campaign to capture them."
 WET_GRN_N07_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_N08:0 "The Northern Underway"
 WET_GRN_N08_desc:0 "The conquered passages connect the host’s northern stores. Clear the existing routes for military traffic."
 WET_GRN_N09:0 "Beyond Peak Pass"
 WET_GRN_N09_desc:0 "The northern pass opens another direction for conquest. Send scouts toward the frontier beyond it."
 WET_GRN_N09_special_tt:0 "Goal on §Y$STATE_905$§!’s hostile owner; unlock a lawful Kislev goal after controlled frontier contact."
 WET_GRN_N10:0 "The Northern Trophy Pole"
 WET_GRN_N10_desc:0 "The northern host has won a stronghold worth boasting of. Gather its captains beneath the captured banners."
 WET_GRN_S00:0 "Through Death Pass"
 WET_GRN_S00_desc:0 "The southern road begins in the Waaagh’s own lands. Organise its stores before marching farther."
 WET_GRN_S01:0 "The Eight Peaks Campaign"
 WET_GRN_S01_desc:0 "Dwarfs, Goblins and Skaven contest the great mountain complex. Prepare goals against its hostile current owners."
 WET_GRN_S01_special_tt:0 "Gain goals against hostile owners of the fixed Eight Peaks region; Greenskin challenges keep their absorption rule."
 WET_GRN_S02:0 "Pillar City Is Ours"
 WET_GRN_S02_desc:0 "The heart of Eight Peaks bears the Waaagh’s banners. Claim its actual landmark as a southern trophy."
 WET_GRN_S03:0 "The Karak Azul Workshops"
 WET_GRN_S03_desc:0 "The southern workshops can supply the expanding host. Prepare a campaign against their current holders."
 WET_GRN_S03_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_S04:0 "The Loot of Karak Azgal"
 WET_GRN_S04_desc:0 "The old hold contains many competing masters. Map the two surviving territories before claiming its treasures."
 WET_GRN_S04_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_S05:0 "Bosses of the Misty Mountains"
 WET_GRN_S05_desc:0 "Southern tribes gather around their own champions. Carry the Waaagh’s challenge into their hills."
 WET_GRN_S06:0 "The Skull Crag Road"
 WET_GRN_S06_desc:0 "The road south passes divided holdings at Skull Crag. Prepare a campaign against their current owners."
 WET_GRN_S06_special_tt:0 "Goals on hostile owners of states 957 and 958; army attrition -5%."
 WET_GRN_S07:0 "Karak Zorn at the End of the Road"
 WET_GRN_S07_desc:0 "The southern hold is divided between rival powers. Prepare to take both sides of its surviving territory."
 WET_GRN_S07_special_tt:0 "Goals against hostile owners of states 586 and 587."
 WET_GRN_S08:0 "A Banner above Karak Zorn"
 WET_GRN_S08_desc:0 "The host has reached the far southern hold. Make its conquest a trophy for every returning mob."
 WET_GRN_S09:0 "The Long Southern Underway"
 WET_GRN_S09_desc:0 "The conquered passages can keep the southern army supplied. Assign escorts to their existing entrances."
 WET_GRN_S10:0 "The Southern Trophy Pole"
 WET_GRN_S10_desc:0 "The southern army has won a great mountain prize. Let its bosses proclaim their part in the Waaagh."
 WET_GRN_T00:0 "Gork’s Fist, Mork’s Hand"
 WET_GRN_T00_desc:0 "One champion breaks the line while the other chooses the ground. Give their captains a common plan."
 WET_GRN_T01:0 "Boyz and Grots Together"
 WET_GRN_T01_desc:0 "The great mobs need scouts as much as muscle. Assign each band a useful place in the host."
 WET_GRN_T02:0 "Set the Trap, Spring the Charge"
 WET_GRN_T02_desc:0 "Skarsnik prepares the opening and Grimgor exploits it. Train the two wings to strike together."
 WET_GRN_T03:0 "The Prophecy Made Flesh"
 WET_GRN_T03_desc:0 "The shamans can point to two living champions. Their sermons will carry the Waaagh beyond its oldest followers."
 WET_GRN_T04:0 "One Waaagh, Two Legends"
 WET_GRN_T04_desc:0 "Neither champion can win every fight alone. Settle their rivalry around the next enemy."
 WET_GRN_U00:0 "Every Tribe Hears the Challenge"
 WET_GRN_U00_desc:0 "The leadership contest is settled. Carry its result to the tribes beyond Black Crag."
 WET_GRN_U01:0 "Bring the Badlands Bosses to Heel"
 WET_GRN_U01_desc:0 "The nearest rivals offer the first test of the new leadership. Prepare routes to their camps."
 WET_GRN_U02:0 "Keep Their Banners"
 WET_GRN_U02_desc:0 "Defeated mobs should remember whom they now follow. Keep their veterans together under the victorious champions."
 WET_GRN_U02_requirement:0 "At least one actual absorption."
 WET_GRN_U03:0 "A Place for Every Mob"
 WET_GRN_U03_desc:0 "A great host cannot march as one unruly crowd. Give its bosses clear mustering places."
 WET_GRN_U03_requirement:0 "The champion opening is complete."
 WET_GRN_U03_special_tt:0 "Muster the mobs and strengthen the Great Waaagh. Costs 50 Political Power."
 WET_GRN_U04:0 "No More Little Waaaghs"
 WET_GRN_U04_desc:0 "Three defeated rivals make the champions’ authority hard to dispute. Turn their competing warbands into a lasting host."
 WET_GRN_U04_requirement:0 "Three distinct absorbed countries; releases never count twice."
 WET_GRN_U05:0 "The Great Gathering"
 WET_GRN_U05_desc:0 "The conquered tribes bring their skills as well as their warriors. Give the gathering an arsenal large enough to supply them."
 WET_GRN_U05_special_tt:0 "1 military factory credit; infantry-equipment production cost -5%."
 WET_GRN_W00:0 "The Last Waaagh Goes West"
 WET_GRN_W00_desc:0 "The western roads lead toward rich ports and crowded kingdoms. Mark the routes before the mobs begin to march."
 WET_GRN_W01:0 "Across the Blood River"
 WET_GRN_W01_desc:0 "The river separates the gathering mobs from the Border Princes. Scout the crossings and organise the baggage."
 WET_GRN_W02:0 "The Gates of Barak Varr"
 WET_GRN_W02_desc:0 "A Dwarf port commands the western approach. Prepare a siege against the current holder of Barak Varr."
 WET_GRN_W02_special_tt:0 "Instant conquest goal against the hostile owner of §Y$STATE_96$§!; no automatic declaration."
 WET_GRN_W03:0 "Claim Barak Varr"
 WET_GRN_W03_desc:0 "The sea gate has fallen into Greenskin hands. Turn its capture into a trophy every tribe can see."
 WET_GRN_W04:0 "The Stunties’ Shipyards"
 WET_GRN_W04_desc:0 "The captured docks can serve their new masters. Keep the craftsmen and tools working on vessels for the Waaagh."
 WET_GRN_W05:0 "Break the Border Princes"
 WET_GRN_W05_desc:0 "The petty princes defend their own patches of land. Give the host a campaign against their current realms."
 WET_GRN_W05_special_tt:0 "Gain conquest goals on hostile current owners in the fixed Border Princes region."
 WET_GRN_W06:0 "The Princes’ Toll Roads"
 WET_GRN_W06_desc:0 "Conquered crossings can feed the next advance. Put their stores and workshops to work."
 WET_GRN_W06_requirement:0 "Own and fully control at least three fixed Border Princes states."
 WET_GRN_W06_special_tt:0 "1 civilian factory credit in an owned, fully controlled Border Princes state."
 WET_GRN_W07:0 "South toward the Dead Lands"
 WET_GRN_W07_desc:0 "The southern deserts promise a different kind of fight. Prepare the host for heat and long supply lines."
 WET_GRN_W08:0 "Wake the Tomb Kings"
 WET_GRN_W08_desc:0 "The dead kings claim lands the Waaagh could take. Prepare a challenge to Nehekhara’s current government."
 WET_GRN_W08_special_tt:0 "Instant conquest goal against Nehekhara if hostile and independent, otherwise its lawful defending overlord; no declaration."
 WET_GRN_W09:0 "Smash the Bone Legions"
 WET_GRN_W09_desc:0 "The dead do not flee when the front rank falls. Train the boyz to destroy whole formations."
 WET_GRN_W09_special_tt:0 "Concentrate the host for 120 days when this campaign has an eligible enemy."
 WET_GRN_W10:0 "Settra’s City Is Ours"
 WET_GRN_W10_desc:0 "Khemri is a prize worthy of the host’s boasts. Raise the Waaagh’s banners above its captured necropolis."
 WET_GRN_W11:0 "The Black Pyramid Trophy"
 WET_GRN_W11_desc:0 "A black monument rises beyond the desert armies. Prepare a separate expedition against its current holder."
 WET_GRN_W11_special_tt:0 "Receive the campaign’s trophy reward after securing its objective."
 WET_GRN_W12:0 "A Road through the Desert"
 WET_GRN_W12_desc:0 "The conquered desert can sustain a route west. Organise captured stores along the army’s road."
 WET_GRN_W12_special_tt:0 "Supply consumption -5%; unlock lawful goals on Araby after controlled regional contact."
 WET_GRN_W13:0 "The Rich Lands Beyond the Princes"
 WET_GRN_W13_desc:0 "Beyond the border towns lie the cities of Tilea. Prepare a campaign against their current rulers."
 WET_GRN_W13_special_tt:0 "Instant conquest goal against Tilea’s lawful defending country."
 WET_GRN_W14:0 "Loot the Merchant Workshops"
 WET_GRN_W14_desc:0 "Captured workshops contain more than loose treasure. Turn their machinery toward the Waaagh’s next campaign."
 WET_GRN_W14_special_tt:0 "1 civilian factory credit in a captured Tilean state; production efficiency growth +5%."
 WET_GRN_W15:0 "Over the Western Hills"
 WET_GRN_W15_desc:0 "The roads continue into Estalia. Send scouts to find where the next army will stand."
 WET_GRN_W15_special_tt:0 "Instant conquest goal against Estalia’s lawful defending country."
 WET_GRN_W16:0 "Rok Boats in the Western Sea"
 WET_GRN_W16_desc:0 "The host has a port and shipwrights. Organise a fleet that can carry supplies beyond the coast."
 WET_GRN_W16_requirement:0 "Own and fully control a coastal state with a working naval base."
 WET_GRN_W16_special_tt:0 "1 dockyard credit; convoy production cost -10%."
 WET_GRN_W17:0 "A Waaagh beyond the Shore"
 WET_GRN_W17_desc:0 "Distant coasts promise further battles. Teach the fleet to land and supply its own fighters."
 WET_GRN_W18:0 "The Western Trophy Pole"
 WET_GRN_W18_desc:0 "A great western victory gives the host a story to carry home. Display its trophies and announce the next campaign."
 WET_GRN_W19:0 "Keep the Western Roads Open"
 WET_GRN_W19_desc:0 "The host must keep the roads it has won. Assign escorts and repair crews to its western stores."
 WET_GRN_W19_special_tt:0 "Army attrition -5%; 1 infrastructure level in one qualifying western trophy state, capped at 5."
