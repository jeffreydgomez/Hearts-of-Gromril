 wet_grn.1.0:0 "Get the boyz ready."
 wet_grn.1.d:0 "The shouting has stopped, mostly because the loudest challengers are lying on the floor. Black Crag has its bosses, and the boyz are already arguing over who gets to march at the front."
 wet_grn.1.t:0 "The Champions of the Waaagh"
 wet_grn.10.0:0 "There is always another fight."
 wet_grn.10.d:0 "The smaller bosses have pledged their banners and the gathered mobs are cheering a new name. By nightfall their old banners will be trampled into the mud beneath a much larger host."
 wet_grn.10.t:0 "Another Host Joins the Great Waaagh"
 wet_grn.2.0:0 "The tribe still has a boss."
 wet_grn.2.d:0 "Skarsnik has packed his tricks and gone to Black Crag. Flinsnik Grot now sits where the warlord once brooded, watching the tribe for the first goblin foolish enough to laugh."
 wet_grn.2.t:0 "Skarsnik Leaves the Crooked Moon"
 wet_grn.20.0:0 "Guard the workshops."
 wet_grn.20.d:0 "Whispers have been passing between the slave pits after dark. The overseers have found hidden tools and an unfinished tunnel, and the bosses must decide how to answer the trouble."
 wet_grn.20.t:0 "A Plot in the Slave Pits"
 wet_grn.21.0:0 "Put the works back in order."
 wet_grn.21.d:0 "Smoke hangs over the workshops, but fewer weapons are coming out. Missing tools, broken furnaces and frightened workers suggest that someone has been busy while the overseers looked elsewhere."
 wet_grn.21.t:0 "The Workshops Are Disrupted"
 wet_grn.50.0:0 "Show them who is da best."
 wet_grn.50.d:0 "The bosses have picked their next enemy and the drums have taken up the news. Across the camp, arguments give way to sharpening blades and boasting about the battle to come."
 wet_grn.50.t:0 "The Great Waaagh Takes a Side"
