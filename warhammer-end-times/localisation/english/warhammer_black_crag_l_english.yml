 wet_grn_absorb_diplomacy_accept_desc:0 "The tribes have joined our host."
 wet_grn_absorb_diplomacy_desc:0 "The smaller tribes recognise the biggest host. Their lands and surviving warriors will join the Last Waaagh."
 wet_grn_absorb_diplomacy_effect_tt:0 "Annex [THIS.GetNameDef] and transfer its troops. Gain cores on its passable states, with §Y0%§! Resistance and §Y100%§! Compliance. Costs §Y30§! Political Power."
