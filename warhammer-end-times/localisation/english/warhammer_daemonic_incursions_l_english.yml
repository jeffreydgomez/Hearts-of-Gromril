 wet_incursions.31.a:0 "Stand ready."
 wet_incursions.31.d:0 "Blue fire dances above villages south of the Great Bastion. The northern walls stand firm, but the Shugengan warn that stone cannot bar a gate opened within the realm."
 wet_incursions.31.t:0 "A Breach Behind the Bastion"
