 wet_incursions.41.a:0 "Stand ready."
 wet_incursions.41.d:0 "Music drifts from empty harbours along Araby’s coast. A sweet mist brings visions that linger after waking, and the court sorcerers fear the hand of Slaanesh behind their beauty."
 wet_incursions.41.t:0 "Perfume upon the Sea Wind"
