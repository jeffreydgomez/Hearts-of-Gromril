 wet_incursions.21.a:0 "Stand ready."
 wet_incursions.21.d:0 "Ancient wards answer with discordant echoes beneath Xahutec. The temple guardians gather as something beyond the seal beats against the work of the Old Ones."
 wet_incursions.21.t:0 "The Seal of Xahutec Weakens"
