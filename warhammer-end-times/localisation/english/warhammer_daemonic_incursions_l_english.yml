 wet_incursions.1.a:0 "Stand ready."
 wet_incursions.1.d:0 "The winds of Chaos whip across Bretonnia, and blue fire troubles the sacred waters. The Damsels speak of a shadow reaching for the relics of Gilles’s companions, while prayers grow more urgent in the chapels."
 wet_incursions.1.t:0 "The Year of Woe"
 wet_incursions.11.a:0 "Stand ready."
 wet_incursions.11.d:0 "The waystones shudder in the mountains of Ulthuan. Wardens report shapes moving beyond the paths, and the mages fear that N’Kari is searching for a weakness in the veil."
 wet_incursions.11.t:0 "A Shadow over the Annulii"
 wet_incursions.12.a:0 "Defend the realm."
 wet_incursions.12.d:0 "The sky has opened above our homeland. Daemons pour through the wound while bells and horns call the defenders toward a war that has crossed into the mortal world."
 wet_incursions.12.t:0 "The Veil Is Torn"
 wet_incursions.13.a:0 "Defend the realm."
 wet_incursions.13.d:0 "The wards have held against the pressure beyond the veil. The watchkeepers dare not celebrate: the voices have quieted, but they have not gone away."
 wet_incursions.13.t:0 "The Breach Is Held Back"
