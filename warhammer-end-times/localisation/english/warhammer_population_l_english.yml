 wet_population_policy_skaven_desc:0 "We purge every race except Skaven. We also purge Chaos-faith and Undead inhabitants, even of our own race. Greenskins include Orcs, Goblins, Hobgoblins and Gnoblars.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
 wet_population_purge_active:0 "Population Purge: 2% daily"
 wet_population_purge_active_desc:0 "The state loses 2% of its remaining population per daily pulse. After 365 continuous purge days under the same occupier, its inhabitants adopt that occupier's race and ruling faith. A change of controller or an end to eligibility resets the continuous-day counter, but never restores losses."
