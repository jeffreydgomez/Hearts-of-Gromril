 wet_population_policy_beastmen:0 "Purge Other Races"
 wet_population_policy_beastmen_desc:0 "We purge every race except Beastmen. We also purge Chaos-faith and Undead inhabitants, even of our own race. Greenskins include Orcs, Goblins, Hobgoblins and Gnoblars.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
 wet_population_policy_civilized:0 "Purge the Hostile Peoples"
 wet_population_policy_civilized_desc:0 "We purge Skaven, Greenskins (including Goblins, Hobgoblins and Gnoblars), Beastmen and Fimir, plus Chaos-faith and Undead inhabitants of any race. Everyone else is spared.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
 wet_population_policy_convert:0 "Conversion without Purging"
 wet_population_policy_convert_desc:0 "We purge nobody. As a Chaos or Nagash-aligned government, or an undead nation, we immediately replace the religion of every controlled state with our ruling party's faith. Resident race and population are preserved. This overrides all ancestry-based purge rules.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
 wet_population_policy_faith:0 "Purge Chaos and Undeath"
 wet_population_policy_faith_desc:0 "We purge Chaos-faith and Undead inhabitants. Other races and religions are spared.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
 wet_population_policy_fimir:0 "Purge Other Races"
 wet_population_policy_fimir_desc:0 "We purge every race except Fimir. We also purge Chaos-faith and Undead inhabitants, even of our own race. Greenskins include Orcs, Goblins, Hobgoblins and Gnoblars.\n\nDaily loss is 2% of the remaining state population, rounded to whole inhabitants with fractional losses carried forward. There is no grace period or percentage cap. After 365 continuous purge days under the same controller, both race and religion become the occupier's. Until then, those labels remain unchanged. Changing controller or ending eligibility resets the day counter; lost inhabitants never return. No direct equipment, factory or deployed-unit losses are applied. \n\nChaos governments, Nagash-aligned governments and undead nations never purge and instead impose their faith. Ogres and Chaos Dwarves never purge. These exemptions override other targeting rules."
