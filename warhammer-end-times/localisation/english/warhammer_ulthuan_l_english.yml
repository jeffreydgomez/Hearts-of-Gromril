 WET_DIRECT_A06_ulthuan_builder:0 "Offer 500 Infantry Equipment."
 WET_DIRECT_A09_ulthuan_builder:0 "Gain 25 Navy Experience and send the two-crowns constitutional offer."
 WET_DIRECT_D04_ulthuan_builder:0 "Establish an embassy to the Grand Alliance and gain 25 Political Power."
 WET_DIRECT_D05_ulthuan_builder:0 "Offer a non-aggression pact to §Y[B01.GetNameDef]§!. Invite it into the §YPhoenix Concord§! if the faction has been formed and its membership requirements are met."
 WET_DIRECT_D06_ulthuan_builder:0 "Offer a non-aggression pact to §Y[H19.GetNameDef]§!. Invite it into the §YPhoenix Concord§! if the faction has been formed and its membership requirements are met."
 WET_DIRECT_D07_ulthuan_builder:0 "Make Amends to a Dwarfen Ally."
 WET_DIRECT_D08_ulthuan_builder:0 "Request admission from the Grand Alliance’s current leader."
 WET_DIRECT_D09_ulthuan_builder:0 "Proclaim the Phoenix Concord."
 WET_DIRECT_I08_ulthuan_builder:0 "Send a reconciliation offer to the claimant government."
 WET_DIRECT_I09_ulthuan_builder:0 "Gain +10% Attack on occupied Ulthuan cores for 90 days."
 WET_DIRECT_R01_ulthuan_builder:0 "Locate the Everchild’s prison and gain a Decryption research bonus."
 WET_DIRECT_R02_ulthuan_builder:0 "Offer the current custodian 150 Political Power for the Everchild’s release."
 WET_DIRECT_R04_ulthuan_builder:0 "Seek Passage for the Rescue Host."
 WET_DIRECT_R05_ulthuan_builder:0 "Recruit a prison informant: +15 percentage points to rescue success."
 WET_DIRECT_R06_ulthuan_builder:0 "Offer ransom and 500 Infantry Equipment for the Everchild’s release."
 WET_DIRECT_R08_ulthuan_builder:0 "Recruit guides for the expedition: +10 percentage points to rescue success."
 WET_DIRECT_R09_ulthuan_builder:0 "Dispatch Eltharion’s rescue expedition."
 WET_DIRECT_R11_ulthuan_builder:0 "Gain a limited war goal against the Everchild’s captor."
 WET_DIRECT_S05_ulthuan_builder:0 "Provide shelter and care: gain 3% Stability."
 WET_DIRECT_S14_ulthuan_builder:0 "Secure Caledor’s loyalty and reduce the strength of a later claimant revolt."
 WET_ULT_A00:0 "A Darkness Beyond Our Quarrel"
 WET_ULT_A00_desc:0 "Present Naggaroth with the common threat from Chaos. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A00_requirements:0 "[H12.GetNameDef] exists.\nPeace with [H12.GetNameDef].\nNo selected or completed [H12.GetNameDef] conquest strategy. Bypass if [H12.GetNameDef] already chose cooperation."
 WET_ULT_A00_special_tt:0 "For §Y730 days§!, encourage an undecided Naggaroth to seek cooperation against Chaos."
 WET_ULT_A01:0 "Envoys Across the Sundering"
 WET_ULT_A01_desc:0 "Offer a channel before either court commits to conquest. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A01_special_tt:0 "Send a 30-day talks offer.\nAccepted talks add 10 shared trust once."
 WET_ULT_A02:0 "A Dossier on the Northern Hordes"
 WET_ULT_A02_desc:0 "Share evidence of the threat to both homelands. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A02_special_tt:0 "Strengthen our diplomatic initiative with Naggaroth for its remaining duration if the evidence is accepted."
 WET_ULT_A03:0 "A Place for the Dispossessed"
 WET_ULT_A03_desc:0 "Prepare relief as a credible signal of common interest. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A03_special_tt:0 "Gain one civilian factory in an owned, controlled island state."
 WET_ULT_A04:0 "No Bargain with the Dark Prince"
 WET_ULT_A04_desc:0 "Make an end to Chaos patronage a condition of binding cooperation. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A04_special_tt:0 "Ask Naggaroth to suppress the cults or renounce their patronage."
 WET_ULT_A05:0 "An Exchange of Captives"
 WET_ULT_A05_desc:0 "Reinforce trust through a negotiated reciprocal gesture. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A05_requirements:0 "Accepted talks.\nPeace with [H12.GetNameDef]."
 WET_ULT_A05_special_tt:0 "On consent, add 15 shared trust once and +20 mutual opinion."
 WET_ULT_A06:0 "Aid Against the Northern Storm"
 WET_ULT_A06_desc:0 "Support a real Druchii defensive effort. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A06_requirements:0 "Accepted talks.\nSufficient equipment and a usable supply route."
 WET_ULT_A06_special_tt:0 "Offer 500 Infantry Equipment."
 WET_ULT_A07:0 "Ratify the Asur Compact"
 WET_ULT_A07_desc:0 "Turn accepted terms into mutual non-aggression and access. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A07_requirements:0 "[H12.GetNameDef] chose cooperation, has a clean court, and both governments consent."
 WET_ULT_A07_special_tt:0 "Ratify the §YAsur Compact§! with Naggaroth, establishing a non-aggression pact and mutual military access."
 WET_ULT_A08:0 "The Shores Shall Be Safe"
 WET_ULT_A08_desc:0 "Extend protection to the current partners of both courts. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A08_requirements:0 "Active Asur compact.\nEach added partner consents."
 WET_ULT_A08_special_tt:0 "Opens negotiations for the Western Restraint charter with Ulthuan and its allies."
 WET_ULT_A09:0 "Two Peoples, One Enemy"
 WET_ULT_A09_desc:0 "Coordinate strategy while preserving both governments. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A09_requirements:0 "The Asur Compact is in force."
 WET_ULT_A09_special_tt:0 "Propose a constitutional settlement recognising two Elven crowns."
 WET_ULT_A10:0 "A Seat for Naggaroth"
 WET_ULT_A10_desc:0 "Ask our faction leader to admit the partner realm. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A10_requirements:0 "Active compact.\n[H06.GetNameDef] has a faction.\nMembership and Order tension rules satisfied."
 WET_ULT_A10_special_tt:0 "Request admission to Ulthuan’s faction on behalf of Naggaroth. The faction leader must agree."
 WET_ULT_A11:0 "The Elves Face the Darkness"
 WET_ULT_A11_desc:0 "Recognise a sustained common campaign. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A11_requirements:0 "Shared [H12.GetNameDef]/[H06.GetNameDef] victory milestone: recovered starting core OR §Y180§! shared-war days with capitals held and aid delivered."
 WET_ULT_A12:0 "The Question of Naggaroth"
 WET_ULT_A12_desc:0 "Decide whether security lies in reconciliation or dismantling the Druchii threat. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A13:0 "Never Safe While They Endure"
 WET_ULT_A13_desc:0 "Commit to ending Naggaroth’s power to threaten Ulthuan. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A13_requirements:0 "Independent [H06.GetNameDef].\n[H12.GetNameDef] exists outside our faction.\nNo active Asur Compact."
 WET_ULT_A14:0 "Chart the Black Coasts"
 WET_ULT_A14_desc:0 "Survey the approaches to the Druchii homeland. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A15:0 "Arsenals for the Crossing"
 WET_ULT_A15_desc:0 "Prepare the weapons required by a real overseas campaign. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A15_special_tt:0 "Add 1 Military Factory."
 WET_ULT_A16:0 "A Fleet Beyond the Mist"
 WET_ULT_A16_desc:0 "Train transports and escorts for the western passage. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A17:0 "Mustering the Expedition"
 WET_ULT_A17_desc:0 "Prepare an army for a sustained campaign across the ocean. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A18:0 "End the Druchii Threat"
 WET_ULT_A18_desc:0 "Authorise war only when treaties and military preparations permit it. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A18_requirements:0 "At least §Y50%§! tension.\n§Y8§! combat ships, §Y40§! convoys, owned port.\nNo pact, compact, truce, shared faction or overlord."
 WET_ULT_A18_special_tt:0 "Gain a §YConquer§! war goal against independent §YNaggaroth§!, valid for §Y180 days§!."
 WET_ULT_A19:0 "The War Across the Ocean"
 WET_ULT_A19_desc:0 "Coordinate the expedition once a real war begins. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A20:0 "The Black Throne Broken"
 WET_ULT_A20_desc:0 "Recognise a genuine defeat of the hostile northern realm. The legacy of the Sundering weighs upon every promise made across the sea."
 WET_ULT_A20_requirements:0 "§Y$STATE_812$§! is held by Ulthuan or its subject. Naggaroth has capitulated, been defeated or become Ulthuan’s subject."
 WET_ULT_Aliathra:0 "Aliathra"
 WET_ULT_C00:0 "The Wealth of Ten Kingdoms"
 WET_ULT_C00_desc:0 "Survey the island economy and its unused capacity. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C01:0 "Open the Gates of Lothern"
 WET_ULT_C01_desc:0 "End the economic isolation of the Phoenix realm. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C01_special_tt:0 "Replace Isolation with Civilian Economy without a Political Power fee. Other branches remain available while isolation continues."
 WET_ULT_C02:0 "Guilds of the Inner Sea"
 WET_ULT_C02_desc:0 "Commission workshops around the sheltered trade routes. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C03:0 "The Granaries of Avelorn"
 WET_ULT_C03_desc:0 "Improve cultivation and secure the harvest. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C04:0 "Merchants Beyond the Mist"
 WET_ULT_C04_desc:0 "Rebuild the commercial reach of the Seafarer. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C05:0 "Workshops of Eataine"
 WET_ULT_C05_desc:0 "Expand the crafts supporting the capital. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C06:0 "Roads of Ellyrion"
 WET_ULT_C06_desc:0 "Move provisions and craftsmen through the interior. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C07:0 "The Lothern Exchange"
 WET_ULT_C07_desc:0 "Put overseas revenues into productive enterprise. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C08:0 "Restore the Western Towns"
 WET_ULT_C08_desc:0 "Build civilian capacity in the western kingdoms. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C09:0 "Survey the Mountain Veins"
 WET_ULT_C09_desc:0 "Improve extraction from existing mines. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C10:0 "A Commonwealth of Artisans"
 WET_ULT_C10_desc:0 "Unify standards and apprenticeships across the island. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_C11:0 "Learning in Every Kingdom"
 WET_ULT_C11_desc:0 "Fund a permanent network of scholarship. The wealth of the island must sustain its people through the gathering storm."
 WET_ULT_Council:0 "Council of the Ten Kingdoms"
 WET_ULT_D00:0 "Beyond the Shrouded Isle"
 WET_ULT_D00_desc:0 "Debate the realm’s place in the wider resistance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D01:0 "Stand with the Empire"
 WET_ULT_D01_desc:0 "Commit to seeking the Empire’s Grand Alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D01_special_tt:0 "Propose talks with the leader of the §YGrand Alliance§!."
 WET_ULT_D02:0 "Raise the Phoenix Concord"
 WET_ULT_D02_desc:0 "Commit to leading an independent Order alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D02_special_tt:0 "Commit to forming the §YPhoenix Concord§!. It can be established after agreeing its charter, at §Y100%§! World Tension."
 WET_ULT_D03:0 "The Grudges Between Us"
 WET_ULT_D03_desc:0 "Identify the Dwarfen members whose assent is needed. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D04:0 "Envoys to Altdorf"
 WET_ULT_D04_desc:0 "Prepare a lawful invitation through the Empire’s coalition programme. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D05:0 "An Embassy to the Forest"
 WET_ULT_D05_desc:0 "Invite the Wood Elves to cooperate with the new league. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D05_special_tt:0 "Offer a non-aggression pact to §Y[B01.GetNameDef]§!. Invite it into the §YPhoenix Concord§! if the faction has been formed and its membership requirements are met."
 WET_ULT_D06:0 "The Western Kindred"
 WET_ULT_D06_desc:0 "Offer Arnheim a voice in the proposed alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D06_special_tt:0 "Offer a non-aggression pact to §Y[H19.GetNameDef]§!. Invite it into the §YPhoenix Concord§! if the faction has been formed and its membership requirements are met."
 WET_ULT_D07:0 "A Reckoning for the War of the Beard"
 WET_ULT_D07_desc:0 "Offer public acknowledgement and reparations without claiming an artifact we do not possess. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D07_special_tt:0 "Make Amends to a Dwarfen Ally."
 WET_ULT_D08:0 "Seats at the War Council"
 WET_ULT_D08_desc:0 "Translate accepted diplomacy into a seat in the Grand Alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D08_requirements:0 "§Y100%§! world tension.\nAll independent Dwarfen members accepted amends.\nCurrent alliance leader consents."
 WET_ULT_D08_special_tt:0 "Request admission from the Grand Alliance’s current leader."
 WET_ULT_D09:0 "The Charter of the Concord"
 WET_ULT_D09_desc:0 "Write the terms of a sovereign defensive league. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D09_requirements:0 "Ulthuan is sovereign and fully controls its capital. The §YPhoenix Concord§! has not already been founded."
 WET_ULT_D09_special_tt:0 "Proclaim the Phoenix Concord."
 WET_ULT_D10:0 "Close the Old Grudges"
 WET_ULT_D10_desc:0 "Recognise a real settlement with the alliance’s Dwarfen members. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D10_requirements:0 "Every current independent Dwarfen member accepted.\nIf none exist, bypass without payment or reward."
 WET_ULT_D10_special_tt:0 "Stability: §G+5%§!.\n+25 mutual opinion with current signatories."
 WET_ULT_D11:0 "Common War Plans"
 WET_ULT_D11_desc:0 "Coordinate with the Empire’s alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D11_requirements:0 "Current Grand Alliance membership."
 WET_ULT_D12:0 "An Alliance of Free Crowns"
 WET_ULT_D12_desc:0 "Bring the league beyond a declaration on parchment. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D12_requirements:0 "Lead the Phoenix Concord with at least one consenting independent other member."
 WET_ULT_D13:0 "Arms Across the Sea"
 WET_ULT_D13_desc:0 "Organise material aid within our chosen alliance. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D13_special_tt:0 "Unlock transfers of 500 existing infantry equipment or 20 existing convoys.\nShared 90-day cooldown."
 WET_ULT_D14:0 "A United Front Against Chaos"
 WET_ULT_D14_desc:0 "Plan a campaign against a genuinely shared enemy. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D14_requirements:0 "Ulthuan and at least one ally fight the same Chaos enemy."
 WET_ULT_D15:0 "The Sea Bridge of the Alliance"
 WET_ULT_D15_desc:0 "Improve the home ports supporting allied operations. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D15_special_tt:0 "+1 naval-base level at one owned port.\nSupply Consumption: §G-5%§! during shared allied war."
 WET_ULT_D16:0 "News Beyond the Mists"
 WET_ULT_D16_desc:0 "Bring reliable reports of the gathering wars before the people. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D17:0 "Hear the Ten Kingdoms"
 WET_ULT_D17_desc:0 "Let the princes and guilds debate the cost of intervention. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D18:0 "Our Fate Is Bound to Theirs"
 WET_ULT_D18_desc:0 "Win a public mandate to act beyond the island. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D19:0 "A Place for the Witch King"
 WET_ULT_D19_desc:0 "Offer Naggaroth a place in the Phoenix Concord while the realms are at peace. No alliance can endure without the willing support of the realms that join it."
 WET_ULT_D19_requirements:0 "Lead the Phoenix Concord.\n[H12.GetNameDef] exists and is not at war with [H06.GetNameDef].\nActive compact."
 WET_ULT_D19_special_tt:0 "Invite Naggaroth to join the §YPhoenix Concord§! under the Asur Compact. Naggaroth must accept and have settled the influence of the cults at court."
 WET_ULT_I00:0 "The Druchii Have Come"
 WET_ULT_I00_desc:0 "Mobilise against Naggaroth’s attack."
 WET_ULT_I01:0 "Watchfires on the Western Shore"
 WET_ULT_I01_desc:0 "Prepare the most exposed landing approaches."
 WET_ULT_I02:0 "Fleet of the Inner Sea"
 WET_ULT_I02_desc:0 "Coordinate patrols around the island approaches."
 WET_ULT_I03:0 "Muster the Provincial Hosts"
 WET_ULT_I03_desc:0 "Bring local defence commands into the war effort."
 WET_ULT_I04:0 "The Landing and the Claim"
 WET_ULT_I04_desc:0 "Respond to the civil war opened by the enemy’s sustained bridgehead."
 WET_ULT_I04_requirements:0 "The claimant rebellion has begun."
 WET_ULT_I05:0 "The Gates Shall Hold"
 WET_ULT_I05_desc:0 "Reinforce the approaches still in our hands."
 WET_ULT_I06:0 "Cut the Black Ark Lifeline"
 WET_ULT_I06_desc:0 "Train the fleet to attack the invader’s supply route."
 WET_ULT_I07:0 "A Reserve Behind Lothern"
 WET_ULT_I07_desc:0 "Establish a supplied reserve for the capital."
 WET_ULT_I08:0 "Expose the Claimant’s Bargain"
 WET_ULT_I08_desc:0 "Challenge the promises tying the rebels to Malekith."
 WET_ULT_I08_requirements:0 "The claimant government exists and is at war with Ulthuan. No talks have been accepted or are awaiting a reply, and the diplomatic cooldown has expired."
 WET_ULT_I08_special_tt:0 "Send a reconciliation offer to the claimant government."
 WET_ULT_I09:0 "Strike the Beachheads"
 WET_ULT_I09_desc:0 "Prepare one concentrated counterstroke against the landing."
 WET_ULT_I09_requirements:0 "Has not already launched the counterstroke against the invasion."
 WET_ULT_I09_special_tt:0 "Gain +10% Attack on occupied Ulthuan cores for 90 days."
 WET_ULT_I10:0 "Keep the Host Together"
 WET_ULT_I10_desc:0 "Protect military cohesion while the courts divide."
 WET_ULT_I11:0 "An Offer to the Dragon Princes"
 WET_ULT_I11_desc:0 "Offer autonomy within Ulthuan in exchange for ending the rebellion."
 WET_ULT_I11_special_tt:0 "Offer to reintegrate the rebel government. If accepted:\nPolitical Power Gain: §R-5%§! for §Y180 days§!."
 WET_ULT_I12:0 "Break the Rebel Hosts"
 WET_ULT_I12_desc:0 "Prepare to defeat the claimant’s field army if negotiation fails."
 WET_ULT_I12_special_tt:0 "Division Attack against the rebels: §G+5%§! for the duration of the civil war."
 WET_ULT_I13:0 "Secure the Dragonspine"
 WET_ULT_I13_desc:0 "Recognise the resolution of the Caledorian revolt."
 WET_ULT_I13_requirements:0 "rebel reintegration or defeat."
 WET_ULT_I13_special_tt:0 "Stability: §G+8%§!.\nRepair speed +10% in recovered rebel states for 180 days."
 WET_ULT_I14:0 "Drive Them into the Sea"
 WET_ULT_I14_desc:0 "Recognise removal of the invaders from the island."
 WET_ULT_I14_requirements:0 "No hostile [H12.GetNameDef]-bloc division or controlled province remains in the §Y31§!-state homeland."
 WET_ULT_I15:0 "The Price of Kinslaying"
 WET_ULT_I15_desc:0 "Restore civil administration after the schism."
 WET_ULT_I15_special_tt:0 "Remove the civil-war cohesion penalty.\nAdd 1 level of Infrastructure in recovered Caledor."
 WET_ULT_I16:0 "Terms for the Witch King"
 WET_ULT_I16_desc:0 "Offer an negotiated end to the invasion."
 WET_ULT_I16_requirements:0 "[H12.GetNameDef] invasion war still active.\nAll homeland cores freed from its bloc."
 WET_ULT_I16_special_tt:0 "Offer peace to Naggaroth. Its government has §Y30 days§! to reply."
 WET_ULT_I17:0 "The Homeland Defended"
 WET_ULT_I17_desc:0 "Recognise a completed defence whether or not a schism occurred."
 WET_ULT_I17_requirements:0 "[H12.GetNameDef] invasion war ended.\nNo hostile [H12.GetNameDef] bloc or active claimant controls home provinces."
 WET_ULT_I18:0 "Rebuild the Western Ports"
 WET_ULT_I18_desc:0 "Repair the coast that bore the invasion."
 WET_ULT_I19:0 "Shelter the Displaced"
 WET_ULT_I19_desc:0 "Restore services without inventing new population."
 WET_ULT_I19_special_tt:0 "Add 1 Civilian Factory.\nStability: §G+5%§!."
 WET_ULT_I20:0 "The Lessons of the Sundering"
 WET_ULT_I20_desc:0 "Reform the command institutions that failed during the schism."
 WET_ULT_I21:0 "Ulthuan Endures"
 WET_ULT_I21_desc:0 "Mark the survival of the homeland."
 WET_ULT_I21_requirements:0 "Invasion resolved.\nAny civil war also resolved."
 WET_ULT_I21_special_tt:0 "Gain +5% repair speed in owned starting core states."
 WET_ULT_M00:0 "The Arsenal of Ulthuan"
 WET_ULT_M00_desc:0 "Review the equipment of the citizen hosts. The citizen hosts need dependable arms before the next war reaches their shores."
