 WET_ULT_M11:0 "The Phoenix Arsenal"
 WET_ULT_M11_desc:0 "Establish the island strategic armaments reserve. The citizen hosts need dependable arms before the next war reaches their shores."
 WET_ULT_M11_special_tt:0 "Add 1 Military Factory.\nFactory Output: §G+5%§!."
 WET_ULT_N00:0 "The Great Ocean Fleet"
 WET_ULT_N00_desc:0 "Survey the shipyards and convoy routes of the Asur. Ulthuan’s strength at sea depends on the yards and crews behind its great fleets."
 WET_ULT_N01:0 "Expand the Lothern Yards"
 WET_ULT_N01_desc:0 "Enlarge the capital shipbuilding district. Ulthuan’s strength at sea depends on the yards and crews behind its great fleets."
 WET_ULT_N02:0 "Cothique Shipwrights"
 WET_ULT_N02_desc:0 "Commission a second shipbuilding centre on the eastern coast. Ulthuan’s strength at sea depends on the yards and crews behind its great fleets."
 WET_ULT_N03:0 "The Convoy Service"
 WET_ULT_N03_desc:0 "Protect the transport fleet through production and training. Ulthuan’s strength at sea depends on the yards and crews behind its great fleets."
 WET_ULT_N04:0 "Dry Docks of Eataine"
