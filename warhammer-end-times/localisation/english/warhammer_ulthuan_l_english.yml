 wet_ulthuan.105.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.105.1:0 "Accept the terms."
 wet_ulthuan.105.1_effect:0 "Join Ulthuan’s Order alliance under normal faction obligations. This confers no territory and declares no war."
 wet_ulthuan.105.d:0 "An invitation has arrived from the Phoenix Throne. Our realm is offered a seat among those prepared to bind their fortunes to Ulthuan’s defence."
 wet_ulthuan.105.t:0 "A Seat in the Phoenix Concord"
 wet_ulthuan.106.0:0 "Decline the request."
 wet_ulthuan.106.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.106.1:0 "Accept the terms."
 wet_ulthuan.106.1_effect:0 "Accept talks about the common northern threat. No pact, faction, alignment or war is imposed. The first accepted contact adds ten trust."
 wet_ulthuan.106.1_outcome:0 "Begins talks with Ulthuan and gains 10 Trust."
 wet_ulthuan.106.d:0 "An embassy has crossed the sea that divided the Elven peoples. Every word is weighed against centuries of hatred, yet the envoys have come to ask whether another enemy now threatens them both."
 wet_ulthuan.106.t:0 "Envoys Across the Sundering"
 wet_ulthuan.107.0:0 "Decline the request."
 wet_ulthuan.107.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.107.1:0 "Accept the terms."
 wet_ulthuan.107.1_effect:0 "Accept Ulthuan’s account of the growing Chaos threat. An undecided AI court weighs cooperation more strongly.\nA committed strategy and a human choice remain unchanged."
 wet_ulthuan.107.1_outcome:0 "Encourages cooperation against Chaos."
 wet_ulthuan.107.d:0 "Reports from the north have reached the Phoenix court, bearing accounts too troubling to dismiss. Those who once counselled patience must now reckon with what the messengers have seen."
 wet_ulthuan.107.t:0 "Evidence from the North"
 wet_ulthuan.108.0:0 "Decline the request."
 wet_ulthuan.108.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.108.1:0 "Accept the terms."
 wet_ulthuan.108.1_effect:0 "Consent to a bilateral Asur Compact after the court has suppressed or repudiated Chaos patronage. This offer itself performs no purge, faction entry or declaration of war."
 wet_ulthuan.108.1_outcome:0 "Approves the Asur Compact."
 wet_ulthuan.108.d:0 "The offered bargain has been rejected before the gathered court. Whatever threats the future holds, the Phoenix Throne will not seek deliverance in the embrace of the Dark Prince."
 wet_ulthuan.108.t:0 "No Bargain with the Dark Prince"
 wet_ulthuan.109.0:0 "Decline the request."
 wet_ulthuan.109.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.109.1:0 "Accept the terms."
 wet_ulthuan.109.1_effect:0 "Accept a reciprocal gesture, adding §Y15§! trust and friendship. Population is unchanged. The counterpart’s existing exchange cannot also award the same trust."
 wet_ulthuan.109.d:0 "Messengers have agreed upon a shore where the captives may be exchanged. Soldiers watch one another across the sand while those held far from home wait to learn whether the bargain will hold."
 wet_ulthuan.109.t:0 "An Exchange of Captives"
 wet_ulthuan.110.0:0 "Decline the request."
 wet_ulthuan.110.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.110.1:0 "Accept the terms."
 wet_ulthuan.110.1_effect:0 "Ratify a joint council of two sovereign Elven crowns. Each court consents.\nDomestic rulers remain unchanged."
 wet_ulthuan.110.1_outcome:0 "Approves a joint council of the two Elven crowns."
 wet_ulthuan.110.d:0 "Old hatred has not vanished, but a common enemy now overshadows it. Across the court, voices that once demanded vengeance are beginning to ask what survival requires."
 wet_ulthuan.110.t:0 "Two Peoples, One Enemy"
 wet_ulthuan.111.0:0 "Decline the request."
 wet_ulthuan.111.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.111.1:0 "Accept the terms."
 wet_ulthuan.111.1_effect:0 "Consent to applying for admission to Ulthuan’s current alliance. Its leader must then accept a separate offer under normal joining law."
 wet_ulthuan.111.1_outcome:0 "Requests admission to Ulthuan’s alliance."
 wet_ulthuan.111.d:0 "An envoy asks that our alliance admit Naggaroth among its members. The proposal would have been unthinkable to many of our ancestors; the present war has made it a question for the living."
 wet_ulthuan.111.t:0 "Apply to the Asur Alliance"
 wet_ulthuan.112.0:0 "Decline the request."
 wet_ulthuan.112.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.112.1:0 "Accept the terms."
 wet_ulthuan.112.1_effect:0 "Join the Phoenix Concord voluntarily under normal faction obligations. The Asur Compact and clean court must still hold.\nUlthuan and Naggaroth must be at peace with one another."
 wet_ulthuan.112.d:0 "The Phoenix Throne offers Naggaroth a place within its Concord. Centuries of division stand behind the envoys, while a world growing darker waits beyond the palace doors."
 wet_ulthuan.112.t:0 "Naggaroth and the Phoenix Concord"
 wet_ulthuan.113.0:0 "Decline the request."
 wet_ulthuan.113.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.113.1:0 "Accept the terms."
 wet_ulthuan.113.1_effect:0 "Transfer §Y500§! existing infantry_equipment on consent, with a usable route and a shared §Y90§!-day cooldown."
 wet_ulthuan.113.d:0 "Ships laden with weapons and supplies have been prepared for the crossing. Their cargo may do more for the alliance than another exchange of assurances between distant courts."
 wet_ulthuan.113.t:0 "Material Aid Across the Sea"
 wet_ulthuan.114.0:0 "Decline the request."
 wet_ulthuan.114.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.114.1:0 "Accept the terms."
 wet_ulthuan.114.1_effect:0 "Transfer §Y20§! existing convoy on consent, with a usable route and a shared §Y90§!-day cooldown."
 wet_ulthuan.114.d:0 "Ships laden with weapons and supplies have been prepared for the crossing. Their cargo may do more for the alliance than another exchange of assurances between distant courts."
 wet_ulthuan.114.t:0 "Material Aid Across the Sea"
 wet_ulthuan.115.0:0 "Decline the request."
 wet_ulthuan.115.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.115.1:0 "Accept the terms."
 wet_ulthuan.115.1_effect:0 "Ulthuan offers Malekith its crown. Acceptance makes Ulthuan a direct puppet of Naggaroth and costs the island another §Y30§! stability points. Malekith keeps his northern throne.\nHis island office cannot command a second army. Both courts retain unrelated wars."
 wet_ulthuan.115.d:0 "The Phoenix Throne calls upon our realm to draw closer to Ulthuan. The envoys speak of shared heritage and shared danger, asking whether those ties can now bear the weight of an alliance."
 wet_ulthuan.115.t:0 "An Invitation to the Phoenix Throne"
 wet_ulthuan.116.0:0 "Decline the request."
 wet_ulthuan.116.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.116.1:0 "Accept the terms."
 wet_ulthuan.116.1_effect:0 "Accept a channel for reconciliation.\nThis begins talks and does not end the civil war."
 wet_ulthuan.116.d:0 "Envoys have ridden into Caledor beneath the colours of the Phoenix Throne. They seek the counsel and strength of the Dragon Princes, whose pride must be approached as carefully as their power."
 wet_ulthuan.116.t:0 "Envoys to Caledor"
 wet_ulthuan.117.0:0 "Decline the request."
 wet_ulthuan.117.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.117.1:0 "Accept the terms."
 wet_ulthuan.117.1_effect:0 "End the claimant war through reintegration into Ulthuan. The island bears a §Y180§!-day administrative penalty. Troops transfer through the native annexation effect.\nThe offer cannot erase another war."
 wet_ulthuan.117.d:0 "The court has laid an offer before Caledor’s princes. Ancient honour and present necessity must now find some ground upon which the dragon banners can gather."
 wet_ulthuan.117.t:0 "An Offer to the Dragon Princes"
 wet_ulthuan.118.0:0 "Decline the request."
 wet_ulthuan.118.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.118.1:0 "Accept the terms."
 wet_ulthuan.118.1_effect:0 "End only the bilateral invasion war. Both realms must remain independent and outside factions, with Ulthuan fully recovered.\nOther wars are preserved."
 wet_ulthuan.118.d:0 "An envoy has come with terms for the Witch King. The words are carefully chosen, for every promise carries the memory of the Sundering and every concession will be judged by both peoples."
 wet_ulthuan.118.t:0 "Terms for the Witch King"
 wet_ulthuan.119.0:0 "Decline the request."
 wet_ulthuan.119.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.119.1:0 "Accept the terms."
 wet_ulthuan.119.1_effect:0 "Release the living Aliathra and receive §Y150§! Political Power. Rewards are delivered when the captive is released.\nAnother rescue or sacrifice invalidates the offer."
 wet_ulthuan.119.d:0 "A guarded messenger brings terms for the Everchild’s release. The demand is bitter, but the chance to bring her home lies before the court at last."
 wet_ulthuan.119.t:0 "Ransom for the Everchild"
 wet_ulthuan.120.0:0 "Decline the request."
 wet_ulthuan.120.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.120.1:0 "Accept the terms."
 wet_ulthuan.120.1_effect:0 "Release the living Aliathra and receive §Y150§! Political Power and §Y500§! existing infantry equipment. Rewards are delivered when the captive is released.\nAnother rescue or sacrifice invalidates the offer."
 wet_ulthuan.120.d:0 "A guarded messenger brings terms for the Everchild’s release. The demand is bitter, but the chance to bring her home lies before the court at last."
 wet_ulthuan.120.t:0 "Ransom for the Everchild"
 wet_ulthuan.121.0:0 "Decline the request."
 wet_ulthuan.121.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.121.1:0 "Accept the terms."
 wet_ulthuan.121.1_effect:0 "Permit Ulthuan’s rescue force to stage through our holdings on a real land route to the prison. This grants military access only, without faction entry or war."
 wet_ulthuan.121.d:0 "Ulthuan’s envoys ask leave for a rescue host to cross our lands. The soldiers waiting beyond the frontier march for a captive whose fate has shaken the Phoenix court."
 wet_ulthuan.121.t:0 "Passage for the Rescue Host"
 wet_ulthuan.2.0:0 "Entrust the realm to the council."
 wet_ulthuan.2.0_effect:0 "The proposed union can no longer be concluded. The interim council must give way to a government chosen from Ulthuan itself."
 wet_ulthuan.2.1:0 "Tyrion shall defend the realm."
 wet_ulthuan.2.1_effect:0 "The proposed union can no longer be concluded. The interim council must give way to a government chosen from Ulthuan itself."
 wet_ulthuan.2.2:0 "Let the Everqueen lead us."
 wet_ulthuan.2.2_effect:0 "The proposed union can no longer be concluded. The interim council must give way to a government chosen from Ulthuan itself."
 wet_ulthuan.2.d:0 "The court waits for a voice that has fallen silent. Rumours pass from chamber to chamber as the princes begin to consider a future none wishes to name aloud."
 wet_ulthuan.2.t:0 "An Unanswered Crown"
 wet_ulthuan.20.0:0 "Bring her home."
 wet_ulthuan.20.d:0 "The alarm has come too late: the Everchild has been taken. In palace and shrine, grief gives way to urgent questions about the hands that seized her and the road they followed."
 wet_ulthuan.20.t:0 "The Everchild Taken"
 wet_ulthuan.21.0:0 "Let the realm hear the news."
 wet_ulthuan.21.d:0 "Word has reached the court that the Everchild is safe. Bells sound across the island as those who feared the worst allow themselves, at last, to breathe."
 wet_ulthuan.21.t:0 "The Everchild Is Safe"
 wet_ulthuan.22.0:0 "We will remember her."
 wet_ulthuan.22.d:0 "The court has received the news it prayed never to hear. The Everchild is dead, and no promise of vengeance can fill the silence her loss has left behind."
 wet_ulthuan.22.t:0 "The Everchild Is Dead"
 wet_ulthuan.23.0:0 "We must prepare more carefully."
 wet_ulthuan.23.d:0 "The expedition’s ships have returned, weathered by the voyage and the struggle beyond it. On the quays, waiting families search the decks while messengers hurry toward the palace."
 wet_ulthuan.23.t:0 "The Expedition Returns"
