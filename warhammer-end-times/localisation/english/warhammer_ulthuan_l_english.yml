 wet_ult_vacant_throne:0 "The Empty Phoenix Throne"
 wet_ult_vacant_throne_desc:0 "The Seafarer has vanished. Until the realm accepts a successor, every command is weighed against a missing king."
 wet_ult_widowmaker:0 "The Sword of Khaine"
 wet_ult_widowmaker_desc:0 "Widowmaker answers every battle with a demand for another. Its strength serves the host in war, while its hunger gnaws at the realm even in peace."
 wet_ulthuan.1.0:0 "Entrust the realm to the council."
 wet_ulthuan.1.0_effect:0 "Finubar has withdrawn beyond the reach of his court, and messengers return without an answer. The silence has shaken the island.\nThe princes must now entrust the realm to a government capable of facing the coming storm."
 wet_ulthuan.1.1:0 "Tyrion shall defend the realm."
 wet_ulthuan.1.1_effect:0 "Finubar has withdrawn beyond the reach of his court, and messengers return without an answer. The silence has shaken the island.\nThe princes must now entrust the realm to a government capable of facing the coming storm."
 wet_ulthuan.1.2:0 "Let the Everqueen lead us."
 wet_ulthuan.1.2_effect:0 "Finubar has withdrawn beyond the reach of his court, and messengers return without an answer. The silence has shaken the island.\nThe princes must now entrust the realm to a government capable of facing the coming storm."
 wet_ulthuan.1.3:0 "Invite Malekith, whatever the price."
 wet_ulthuan.1.3_effect:0 "Invite the Witch King. On acceptance: another §Y-30§! stability points and direct puppet status under Naggaroth. Until he replies an interim council governs."
 wet_ulthuan.1.d:0 "No message has come from the Seafarer, and the ships sent to seek him have returned without an answer. In the ports of Ulthuan, every arriving sail is watched with a hope that grows harder to sustain."
 wet_ulthuan.1.t:0 "The Seafarer Has Vanished"
 wet_ulthuan.10.0:0 "The realm must hold together."
 wet_ulthuan.10.d:0 "The ships have reached the shore, and the claimant’s banner rises above the landing ground. What began as a distant dispute must now be answered before soldiers and princes alike."
 wet_ulthuan.10.t:0 "The Landing and the Claim"
 wet_ulthuan.100.0:0 "Decline the request."
 wet_ulthuan.100.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.100.1:0 "Accept the terms."
 wet_ulthuan.100.1_effect:0 "Ulthuan acknowledges the old wrongs and offers §Y500§! existing infantry equipment. Accepting settles our objection to its joining the Empire.\nEquipment is delivered on acceptance."
 wet_ulthuan.100.d:0 "An Elven embassy has come bearing words few Dwarfs expected to hear. Ulthuan offers amends for an ancient wrong, though no gift can easily balance the weight of the Book of Grudges."
 wet_ulthuan.100.t:0 "Amends for the War of the Beard"
 wet_ulthuan.101.0:0 "Decline the request."
 wet_ulthuan.101.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.101.1:0 "Accept the terms."
 wet_ulthuan.101.1_effect:0 "Admit Ulthuan under the ordinary obligations of membership. The island has debated intervention, reached §Y100%§! world tension and satisfied every current independent Dwarfen ally. No war is declared by this offer."
 wet_ulthuan.101.d:0 "Ulthuan’s envoys have crossed the sea to seek common cause with the free realms. The Phoenix Throne sees a darkness approaching that even the strength of the island kingdoms cannot face alone."
 wet_ulthuan.101.t:0 "Ulthuan Seeks the Grand Alliance"
 wet_ulthuan.102.0:0 "Decline the request."
 wet_ulthuan.102.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.102.1:0 "Accept the terms."
 wet_ulthuan.102.1_effect:0 "Agree to a non-aggression pact and further talks with Ulthuan. Faction membership is a separate voluntary choice."
 wet_ulthuan.102.d:0 "Envoys of the Phoenix Throne have reached our court. They speak of old ties and approaching danger, asking that our rulers look beyond the quarrels that have kept their peoples apart."
 wet_ulthuan.102.t:0 "The Phoenix Embassy"
 wet_ulthuan.103.0:0 "Decline the request."
 wet_ulthuan.103.0_effect:0 "Decline without payment or forced commitments."
 wet_ulthuan.103.1:0 "Accept the terms."
 wet_ulthuan.103.1_effect:0 "Join Ulthuan’s Order alliance under normal faction obligations. This confers no territory and declares no war."
 wet_ulthuan.103.d:0 "An invitation has arrived from the Phoenix Throne. Our realm is offered a seat among those prepared to bind their fortunes to Ulthuan’s defence."
 wet_ulthuan.103.t:0 "A Seat in the Phoenix Concord"
