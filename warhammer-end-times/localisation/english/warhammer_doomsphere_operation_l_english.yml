l_english:
 wet_skv_doomsphere.1.d:0 "The Doomsphere has detonated in the selected enemy capital. The device and the committed support equipment have been expended."
 wet_skv_doomsphere.1.t:0 "The Green Sun Rises"
 wet_skv_doomsphere.2.d:0 "The team failed to detonate the Doomsphere. The device and the committed support equipment are lost; any surviving operatives must answer for the failure."
 wet_skv_doomsphere.2.t:0 "The Device Is Lost"
 wet_skv_doomsphere.3.d:0 "The enemy, the selected capital or our remaining stockpile no longer met the mission conditions. No Doomsphere was detonated or consumed at resolution."
 wet_skv_doomsphere.3.t:0 "The Detonation Is Aborted"
 wet_skv_doomsphere.4.d:0 "A Skaven team has detonated a Doomsphere in our capital. A blinding green flash has brought catastrophic devastation to the surrounding land."
 wet_skv_doomsphere.4.t:0 "A Doomsphere in the Capital"
 wet_skv_doomsphere_close:0 "The report is recorded."
 wet_skv_doomsphere_detonate:0 "Light the Green Sun"
 wet_skv_doomsphere_detonate_desc:0 "The team attempts to deliver and fire the Doomsphere, then escapes through the prepared routes. A failed attempt still expends the weapon."
 wet_skv_doomsphere_detonate_outcome:0 "The team has reached the end of the mission. The final report records whether the device detonated."
 wet_skv_doomsphere_emplace:0 "The Buried Sun"
 wet_skv_doomsphere_emplace_desc:0 "Engineers prepare the casing, shielding and firing mechanism. A Doomsphere must remain available until the final attempt."
 wet_skv_doomsphere_emplace_outcome:0 "The engineers have finished preparing the detonation attempt."
 wet_skv_doomsphere_infiltrate:0 "Beneath the Capital"
 wet_skv_doomsphere_infiltrate_desc:0 "The agents chart service passages and hidden routes into the enemy capital. Concealed teams prepare the chamber and the escape route."
 wet_skv_doomsphere_infiltrate_outcome:0 "The infiltration team has reported on its route into the capital."
 wet_skv_doomsphere_outcome_tt:0 "A valid final attempt consumes §Y1 Doomsphere§!: §G70%§! chance of a Doomsphere strike in the selected enemy capital state.\n§R30%§! chance the device is lost without detonating. The 1,000 $support_equipment$ is not returned on completion. The operation requires war and an available Doomsphere throughout. If the selected capital has moved, changed owner or lost full enemy control at resolution, no detonation occurs and no Doomsphere is consumed."
 wet_skv_operation_doomsphere:0 "Detonate a Doomsphere"
 wet_skv_operation_doomsphere_desc:0 "Smuggle a Doomsphere into an enemy capital and bury it beneath the city. Requires three operatives, a 75% intelligence network and 1,000 $support_equipment$. The mission takes 120 days before duration modifiers and carries high operative risk. A valid final attempt has a 70% chance of detonation and expends one Doomsphere even on failure. Keep one Doomsphere in stock throughout the operation. The selected state must still be the enemy capital under enemy control when the mission finishes."
