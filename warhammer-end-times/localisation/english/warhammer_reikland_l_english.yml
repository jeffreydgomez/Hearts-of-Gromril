 wet_rei_waaagh_claim_requirements:0 "Recognise the chosen state only after Reikland or Grimgor actually controls it. No territory is transferred."
 wet_rei_waaagh_objective:0 "Choose a Joint Campaign Objective"
 wet_rei_waaagh_objective_desc:0 "Select and disclose one currently enemy-owned state in a real war shared with Grimgor. Capture it together before claiming success."
