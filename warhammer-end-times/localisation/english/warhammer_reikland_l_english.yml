 wet_reikland.116.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.116.1:0 "Accept the terms."
 wet_reikland.116.1_effect:0 "Join the actual Order coalition and accept its normal defensive obligations. Reikland pays §Y75§! Political Power only on actual admission. If Reikland is not the leader, the leader must also approve; the invitation cannot override a war or faction conflict."
 wet_reikland.116.d:0 "The Emperor calls upon our realm to stand beside the free peoples against the coming darkness. His envoys bring no promise of an easy war, only the hope that unity may spare us defeat in isolation."
 wet_reikland.116.t:0 "An Invitation to the Grand Alliance"
 wet_reikland.117.0:0 "Decline or let the offer lapse."
 wet_reikland.117.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.117.1:0 "Accept the terms."
 wet_reikland.117.1_effect:0 "Join Reikland’s Order coalition for mutual defence. Reikland pays §Y50§! Political Power on acceptance. Existing Everchosen war requires §Y100%§! tension."
 wet_reikland.117.d:0 "Banners from distant courts have begun to gather around Altdorf. The Emperor’s appeal has become something larger than an exchange of letters: a cause to which the free realms may rally."
 wet_reikland.117.t:0 "Rally the Free Realms"
 wet_reikland.119.0:0 "Decline or let the offer lapse."
 wet_reikland.119.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.119.1:0 "Accept the terms."
 wet_reikland.119.1_effect:0 "Reikland requests §Y500§! infantry equipment from our stockpile to defend Altdorf. We retain our army and government."
 wet_reikland.119.d:0 "The roads to Altdorf are crowded with soldiers, refugees and wagons. An Imperial appeal asks our realm to send what it can before the city’s need becomes desperate."
 wet_reikland.119.t:0 "Aid for Altdorf"
 wet_reikland.120.0:0 "Decline or let the offer lapse."
 wet_reikland.120.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.120.1:0 "Accept the terms."
 wet_reikland.120.1_effect:0 "Accept Reikland’s proposed allegiance. Ratification costs Reikland §Y150§! Political Power and ten stability points, changes its alignment, and requires current faction compatibility. Subjects decide their own response."
 wet_reikland.120.d:0 "The Emperor’s envoys have entered the shadow of Nagashizzar. They offer a bargain born of desperation, asking whether the dead might stand beside the Empire against a still greater terror."
 wet_reikland.120.t:0 "A Bargain with Nagashizzar"
 wet_reikland.121.0:0 "Decline or let the offer lapse."
 wet_reikland.121.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.121.1:0 "Accept the terms."
 wet_reikland.121.1_effect:0 "Accept Reikland’s proposed allegiance. Ratification costs Reikland §Y150§! Political Power and ten stability points, changes its alignment, and requires current faction compatibility. Subjects decide their own response."
 wet_reikland.121.d:0 "Imperial envoys have reached Black Crag, where diplomacy must compete with the noise of the fighting pits. They offer the bosses a common enemy and spoils worth listening for."
 wet_reikland.121.t:0 "A Bargain with Black Crag"
 wet_reikland.122.0:0 "Leave this new settlement."
 wet_reikland.122.0_effect:0 "Reikland has ratified a new allegiance. We can retain our current faith under its settlement, consent to its new alignment, or leave the Imperial relationship."
 wet_reikland.122.1:0 "Remain, but retain our own government."
 wet_reikland.122.1_effect:0 "Reikland has ratified a new allegiance. We can retain our current faith under its settlement, consent to its new alignment, or leave the Imperial relationship."
 wet_reikland.122.2:0 "Consent to the new allegiance."
 wet_reikland.122.2_effect:0 "Reikland has ratified a new allegiance. We can retain our current faith under its settlement, consent to its new alignment, or leave the Imperial relationship."
 wet_reikland.122.2_outcome:0 "Adopts the Empire’s new alignment."
 wet_reikland.122.d:0 "A new proclamation has arrived from Altdorf, bearing a choice no Elector expected to face. The Emperor has taken a darker road, and every provincial court must decide whether to follow."
 wet_reikland.122.t:0 "The Empire Changes Allegiance"
 wet_reikland.123.0:0 "Decline or let the offer lapse."
 wet_reikland.123.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.123.1:0 "Accept the terms."
 wet_reikland.123.1_effect:0 "Permit Reikland to build and maintain agreed fortifications and infrastructure at the frontier sites in our territory. We retain ownership. Mutual military access supports the project; consent can be withdrawn."
 wet_reikland.123.1_outcome:0 "Permits Imperial construction on the agreed frontier."
 wet_reikland.123.d:0 "Imperial engineers have arrived with plans for the frontier. They ask leave to survey the ground and raise works that could shelter both our people and the armies marching to defend them."
 wet_reikland.123.t:0 "The Imperial Frontier Project"
 wet_reikland.124.0:0 "Decline or let the offer lapse."
 wet_reikland.124.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.124.1:0 "Accept the terms."
 wet_reikland.124.1_effect:0 "Accept a defensive Imperial guarantee against aggression. Reikland pays §Y50§! Political Power in aid, and we retain independence. This does not declare war against peaceful Sylvania."
 wet_reikland.124.d:0 "The Emperor offers his protection to the threatened princes. Behind the formal words stands a question every court understands: who will answer when Sylvania’s banners cross the border?"
 wet_reikland.124.t:0 "Shield the Electors"
 wet_reikland.125.0:0 "Decline or let the offer lapse."
 wet_reikland.125.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.125.1:0 "Accept the terms."
 wet_reikland.125.1_effect:0 "Request Imperial intervention against actual Sylvanian aggression. Reikland pays §Y50§! Political Power for preparations and gains a legal war goal; declaration and existing third-party wars remain separate."
 wet_reikland.125.d:0 "A plea for help has reached Altdorf from a realm under attack. The Emperor’s council must decide whether the defence of that prince is now the defence of the Empire itself."
 wet_reikland.125.t:0 "An Imperial Response"
 wet_reikland.126.0:0 "Decline or let the offer lapse."
 wet_reikland.126.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.126.1:0 "Accept the terms."
 wet_reikland.126.1_effect:0 "Allow Volkmar, the actual Grand Theogonist, to lead a §Y120§!-day expedition while retaining his current office. Reikland provides §Y500§! infantry equipment. The objective is Drakenhof; failure risks capture, not a forced death."
 wet_reikland.126.1_outcome:0 "Permits an Imperial crusade against Sylvania."
 wet_reikland.126.d:0 "Priests preach against the darkness gathering in Sylvania while the Emperor’s captains study the roads east. The threatened princes are being asked to welcome a host marching beneath the hammer of Sigmar."
 wet_reikland.126.t:0 "A Crusade Against Sylvania"
 wet_reikland.127.0:0 "Decline or let the offer lapse."
 wet_reikland.127.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.127.1:0 "Accept the terms."
 wet_reikland.127.1_effect:0 "Reikland offers Nuln §Y50§! Political Power for a year of technical cooperation. Nuln keeps all factories and independence."
 wet_reikland.127.d:0 "Imperial officers have come to inspect our guns and speak with the masters of the foundries. Altdorf wishes to place an order worthy of the battles its generals fear are coming."
 wet_reikland.127.t:0 "Imperial Gunnery Procurement"
 wet_reikland.2.0:0 "We must reconsider."
 wet_reikland.2.d:0 "Our envoys have returned without the agreement they sought. The court must turn its attention elsewhere, though the unanswered letter will not soon be forgotten."
 wet_reikland.2.t:0 "The Offer Has Ended"
 wet_skv_authority:0 "Council Authority"
 wet_skv_rivalry:0 "Clan Rivalry"
