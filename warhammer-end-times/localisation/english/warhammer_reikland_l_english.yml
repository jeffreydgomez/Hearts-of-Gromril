 wet_rei_withdraw_integration_desc:0 "Withdraw consent to Imperial integration. An active project will stop."
 wet_rei_withdraw_integration_effect:0 "Withdraw consent to Imperial integration. An active project will stop."
 wet_rei_withdraw_integration_requirements:0 "Withdraw consent to Imperial integration. An active project will stop."
 wet_rei_withdraw_sites:0 "Withdraw Frontier Consent"
 wet_rei_withdraw_sites_desc:0 "End permission for the Imperial frontier project. Active construction will pause; existing forts remain."
 wet_rei_withdraw_sites_effect:0 "End permission for the Imperial frontier project. Active construction will pause; existing forts remain."
