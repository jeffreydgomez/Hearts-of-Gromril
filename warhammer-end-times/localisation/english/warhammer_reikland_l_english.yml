 wet_rei_start_bastion_requirements:0 "Build the negotiated frontier from Salkalten through Ostland to Schwartzhafen. Cost §Y150§! Political Power and §Y1§!,§Y000§! Elite Equipment; §Y180§! days. A current Dwarf compact reduces Political Power by §Y50§! and time by §Y30§! days. Lost site rights pause construction; §Y30§! days without them cancels it and refunds §Y75§! Political Power."
