l_english:
 WET_REI_E00:0 "The Coming Everchosen"
 WET_REI_E00_desc:0 "The reports from the north speak of a champion gathering powers that once fought one another. If an Everchosen is coming, the Empire must convince the world before every kingdom faces him alone."
 WET_REI_E01:0 "Honour the Ancient Alliance"
 WET_REI_E01_desc:0 "Men and Dwarfs have stood together in wars whose scars remain upon the mountains. We shall remind the holds of those oaths while their gates are still open to an Imperial messenger."
 WET_REI_E01_programme_tt:0 "Open formal contact with the High King. Karaz-a-Karak chooses its own strategy; no timer closes the gates on its behalf. A deliberately sealed realm refuses coalition invitations."
 WET_REI_E02:0 "Before the Gates Close"
 WET_REI_E02_desc:0 "Dwarfen patience is long, but it is not without an end. We must turn renewed contact into an agreement before suspicion and war make every promise from the lowlands sound hollow."
 WET_REI_E02_special_tt:0 "Invite §Y[U04.GetNameDef]§! to the Order coalition. Costs §R75 Political Power§! only on admission; both the recipient and any separate faction leader must consent."
 WET_REI_E03:0 "The Oath Reforged"
 WET_REI_E03_desc:0 "An oath renewed should be visible in the work of engineers as well as the words of kings. Shared craft and practical knowledge can make our workshops and frontier stronger than either ally could manage alone."
 WET_REI_E03_requirement:0 "[U04.GetNameDef] is an actual member of the same Order coalition and its relief compact remains valid."
 WET_REI_E03_special_tt:0 "One §Y100%§! industry and one §Y100%§! engineer research bonus. The current Dwarf compact also discounts both frontier projects."
 WET_REI_E04:0 "Warn the Northern Shield"
 WET_REI_E04_desc:0 "Kislev stands between the northern wastes and the roads into our homeland. Its court must hear that the danger is understood in Altdorf, and that the Empire seeks a partner rather than a convenient shield."
 WET_REI_E04_programme_tt:0 "Open Kislev's coalition talks. If it already fights the Everchosen, the Electors refuse until §Y100%§! tension."
 WET_REI_E05:0 "Bring Kislev into the Alliance"
 WET_REI_E05_desc:0 "Warnings will not sustain Kislev if every southern promise dissolves when the snow begins to fall. We shall offer a place in the coalition, with obligations agreed before the coming war overtakes diplomacy."
 WET_REI_E05_special_tt:0 "Invite §Y[A29.GetNameDef]§! to the Order coalition. Costs §R50 Political Power§! only on admission; both the recipient and any separate faction leader must consent."
 WET_REI_E06:0 "The Northern Shield Endures"
 WET_REI_E06_desc:0 "A living northern kingdom gives the whole coalition room to prepare. Kislev's continued defence of its cities and homeland deserves the support of an Empire that understands what is being held back."
 WET_REI_E06_requirement:0 "Kislev is a coalition member, controls Kislev City and at least §Y60%§! of its baseline states."
 WET_REI_E07:0 "Reopen the Westerland Question"
 WET_REI_E07_desc:0 "Westerland's separation left more than an empty place in the Imperial ledger. We must reopen the question of Marienburg while its rulers still have the freedom to negotiate their future."
 WET_REI_E08:0 "The Return of Westerland"
 WET_REI_E08_desc:0 "Marienburg's prosperity grew upon the waters of the Reik, whatever its merchant lords may prefer to remember. The city will return to the Imperial fold beneath the Emperor's protection."
 WET_REI_E08_special_tt:0 "[A12.GetNameDef] becomes a Puppet of Reikland."
 WET_REI_E09:0 "The Reik Reunited"
 WET_REI_E09_construction_0_tt:0 "Add §G2§! §Y$dockyard$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_E09_desc:0 "The Reik should carry the wealth and provisions of a reunited realm. Renewed shipyards and merchant hulls will make the river's political settlement useful to every army and market that depends upon it."
 WET_REI_E09_requirement:0 "Marienburg and at least §Y3§! of Westerland's §Y4§! baseline states are held by Reikland or its direct subject."
 WET_REI_E10:0 "Warn the Bretonnian Crown"
 WET_REI_E10_desc:0 "Bretonnia has its own quarrels, but the northern storm will not respect the mountains between us. We shall approach its crown with a warning that speaks to the safety of both kingdoms."
 WET_REI_E10_programme_tt:0 "Prepare diplomatic contact with Bretonnia; subsequent focuses enable coalition membership and equipment aid."
 WET_REI_E11:0 "Bring Bretonnia into the Alliance"
 WET_REI_E11_desc:0 "A Bretonnian promise must reach beyond courtesy between neighbouring courts. Membership in the coalition offers a way to agree our common defence before the choice is made for us by the enemy."
 WET_REI_E11_special_tt:0 "Invite §Y[A15.GetNameDef]§! to the Order coalition. Costs §R50 Political Power§! only on admission; both the recipient and any separate faction leader must consent."
 WET_REI_E12:0 "Bretonnia Stands with Us"
 WET_REI_E12_desc:0 "Friendship is tested when one ally's need becomes another's burden. We shall establish a practical channel for Bretonnian supplies to aid the defence of Altdorf, subject to the crown's willingness and means."
 WET_REI_E12_requirement:0 "Bretonnia is an actual member of the same Order coalition and its agreement remains valid."
 WET_REI_E12_special_tt:0 "Request Bretonnian Relief."
 WET_REI_E13:0 "The Empire's Allegiance"
 WET_REI_E13_desc:0 "The Empire must decide what kind of future its restored strength is meant to protect. The old charter, the promises of death and the lure of an unending war each demand a different allegiance."
 WET_REI_E14:0 "Rally the Grand Alliance"
 WET_REI_E14_desc:0 "The Grand Alliance has a banner, but a banner alone cannot defend the world. We shall turn Reikland's founding commitment into a council of willing partners and recognised obligations."
 WET_REI_E14_requirement:0 "Order; tension at least §Y25%§!; current Order-faction membership, or a valid preliminary pledge and §Y50§! Political Power while factionless."
 WET_REI_E14_special_tt:0 "Open the §YGrand Alliance§! invitation programme. Existing Order-faction membership costs nothing; factionless Reikland instead needs a valid consenting partner and pays §R50 Political Power§! on successful formation or admission."
 WET_REI_E15:0 "The Bargain with Death"
 WET_REI_E15_desc:0 "The Great Necromancer offers a terrible answer to the frailty of mortal realms. Before such an allegiance can be sworn, the Empire must learn whether Nagash's court will accept the terms of its submission."
 WET_REI_E15_special_tt:0 "Ask §Y[U24.GetNameDef]§! to accept an Imperial allegiance proposal. Alignment and faction membership change only when the agreement is ratified."
 WET_REI_E16:0 "A Bargain with Grimgor"
 WET_REI_E16_desc:0 "Grimgor understands promises best when they point toward an enemy worth fighting. An Imperial bargain with his Waaagh would require both his consent and a settlement unlike any the old Diet imagined."
 WET_REI_E16_special_tt:0 "Ask §Y[G24.GetNameDef]§! to accept an Imperial war compact. Alignment and faction membership change only when the agreement is ratified."
 WET_REI_E17:0 "Rally the Free Realms"
 WET_REI_E17_desc:0 "The coalition's first treaties should be the beginning of its work. We shall invite other free realms to take their place beside us, while respecting the authority of the faction's recognised leader."
 WET_REI_E18:0 "A Living Empire"
 WET_REI_E18_desc:0 "A coalition worthy of the name must keep armies supplied and reserves moving when the first victories fade. An Empire that can coordinate that common effort gives its allies a reason to remain together."
 WET_REI_E18_requirement:0 "Independent Order Reikland is in an Order-led coalition with at least two other Order countries."
 WET_REI_E19:0 "Serve the Great Necromancer"
 WET_REI_E19_desc:0 "The bargain with Nagash is no longer a distant possibility. Ratification will bind the Imperial government to death's cause, while every subject must confront what that new allegiance means for its own people."
 WET_REI_E19_requirement:0 "Nagash offer accepted; [U24.GetNameDef] and Reikland can legally join; §Y150§! political power can be paid at ratification."
 WET_REI_E19_special_tt:0 "Adopt §YNagashi§! alignment and join §Y[U24.GetNameDef]§! under the accepted settlement. Each Imperial subject chooses whether to remain, convert or leave."
 WET_REI_E20:0 "The Deathless Empire"
 WET_REI_E20_construction_0_tt:0 "Add §G1§! §Y$arms_factory$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_E20_desc:0 "Death offers continuity without mercy and obedience without the comfort of an ending. The Empire's institutions must now serve that altered purpose, sustaining its armies beneath a different understanding of eternity."
 WET_REI_E20_requirement:0 "Reikland is Undead and remains in Nagash's faction under its accepted settlement."
 WET_REI_E21:0 "Join the Waaagh"
 WET_REI_E21_desc:0 "The terms have been offered, and Grimgor has heard our answer. To enter his Waaagh is to place the Empire's war effort beside the green tide without pretending that its people have become something they are not."
 WET_REI_E21_requirement:0 "Accepted Grimgor compact; §Y150§! Political Power; Reikland is factionless and [G24.GetNameDef] still leads its Greenskin faction."
 WET_REI_E21_special_tt:0 "Adopt §YWaaagh§! alignment and join §Y[G24.GetNameDef]§! under the accepted Imperial compact. Human ancestry is preserved; subjects choose their own response."
 WET_REI_E22:0 "An Empire of War"
 WET_REI_E22_desc:0 "A bargain made for war must prove itself upon a shared battlefield. The capture of an agreed enemy stronghold will show whether Imperial discipline and Grimgor's fury can serve the same campaign."
 WET_REI_E22_requirement:0 "Valid Waaagh compact and one completed joint-war objective against a mutual enemy."
 WET_REI_E23:0 "Gather the Northern Reports"
 WET_REI_E23_desc:0 "Scattered accounts of northern raids can be dismissed as another border season. We shall gather testimony, maps and reports into a case that even the most comfortable court must take seriously."
 WET_REI_E24:0 "Convince the Electors"
 WET_REI_E24_desc:0 "The Electors must understand that cooperation abroad does not require surrendering their crowns at home. With that distinction established, we can seek the first pledges from powers capable of facing the northern danger beside us."
 WET_REI_E24_special_tt:0 "Seek preliminary coalition pledges from §Y[U04.GetNameDef]§!, §Y[A29.GetNameDef]§!, §Y[A15.GetNameDef]§!, §Y[H06.GetNameDef]§! and §Y[I25.GetNameDef]§!. A pledge does not grant faction membership."
 WET_REI_E25:0 "Warn Ulthuan"
 WET_REI_E25_desc:0 "Ulthuan has watched the rise of many mortal empires and the ruin of more than one. Our messengers must convince its rulers that this warning concerns the survival of their island as well as our own shores."
 WET_REI_E25_programme_tt:0 "Open [H06.GetNameDef] coalition talks. If Ulthuan already fights the Everchosen, wait until §Y100%§! tension."
 WET_REI_E26:0 "An Accord with Ulthuan"
 WET_REI_E26_desc:0 "The Asur will not lightly bind their fate to the judgements of a human Emperor. We shall offer a deliberate accord that recognises their sovereignty and asks for their consent to a common defence."
 WET_REI_E26_special_tt:0 "Invite §Y[H06.GetNameDef]§! to the Order coalition. Costs §R50 Political Power§! only on admission; both the recipient and any separate faction leader must consent."
 WET_REI_E27:0 "The Asur Answer the Call"
 WET_REI_E27_desc:0 "Ulthuan's answer brings knowledge gathered over generations of struggle against Chaos. Cooperation with its scholars and winged hosts can help the coalition understand threats that Imperial experience alone cannot explain."
 WET_REI_E27_requirement:0 "Ulthuan [H06.GetNameDef] is an actual member of the same Order coalition."
 WET_REI_E28:0 "Carry the Warning to Cathay"
 WET_REI_E28_desc:0 "Distance may shelter Cathay from our immediate fears, but it cannot make the coming danger irrelevant. We shall carry the warning east and seek an audience before war closes the roads between our worlds."
 WET_REI_E28_programme_tt:0 "Open [I25.GetNameDef] coalition talks. Existing war with the Everchosen blocks new commitments below §Y100%§! tension."
 WET_REI_E29:0 "An Embassy to the Dragon Emperor"
 WET_REI_E29_desc:0 "An embassy to the Dragon Emperor must offer more than an urgent appeal from a distant throne. We shall present the coalition as a compact of willing powers, with room for Cathay's interests and judgement."
 WET_REI_E29_special_tt:0 "Invite §Y[I25.GetNameDef]§! to the Order coalition. Costs §R75 Political Power§! only on admission; both the recipient and any separate faction leader must consent."
 WET_REI_E30:0 "The Eastern Pledge"
 WET_REI_E30_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_E30_desc:0 "An eastern pledge can be made tangible through the movement of knowledge and trade. Imperial waystations and the lessons brought by Cathayan envoys will turn a distant friendship into practical strength at home."
 WET_REI_E30_requirement:0 "Grand Cathay [I25.GetNameDef] is an actual member of the same Order coalition."
 WET_REI_I00:0 "Restore Imperial Authority"
 WET_REI_I00_desc:0 "The Empire was built from many peoples and many loyalties. Its reunification must proceed through their courts and councils, turning scattered promises into a settlement that can endure."
 WET_REI_I01:0 "The Courts of Altdorf"
 WET_REI_I01_desc:0 "The courts around Altdorf stand close enough to hear the Emperor's summons. Their rulers must now take their places within a restored Imperial order."
 WET_REI_I01_special_tt:0 "Establish Puppet governments under Reikland in [A80.GetNameDef], [A81.GetNameDef]."
 WET_REI_I02:0 "An Accord with Ulric"
 WET_REI_I02_desc:0 "Middenheim's strength has always mattered to the fate of the Empire. An accord with the northern court will bring its proud banners beneath the Emperor's command."
 WET_REI_I02_special_tt:0 "Establish Puppet governments under Reikland in [A82.GetNameDef]."
 WET_REI_I03:0 "The Southern Estates"
 WET_REI_I03_desc:0 "The southern estates guard old privileges and prosperous roads. Their return to Imperial obedience will place both wealth and soldiers behind the throne."
 WET_REI_I03_special_tt:0 "Establish Puppet governments under Reikland in [A02.GetNameDef], [A06.GetNameDef], [A63.GetNameDef], [A14.GetNameDef]."
 WET_REI_I04:0 "The Northern Princes"
 WET_REI_I04_desc:0 "The northern princes cannot meet the coming storm alone. Their scattered strengths must be bound once more to the authority of the Emperor."
 WET_REI_I04_special_tt:0 "Establish Puppet governments under Reikland in [A04.GetNameDef], [A03.GetNameDef], [A10.GetNameDef], [A86.GetNameDef]."
 WET_REI_I05:0 "The Eastern Electors"
 WET_REI_I05_desc:0 "Along the eastern roads, every isolated court is another opportunity for the Empire's enemies. The Electors must answer a common command before those roads carry an invading host."
 WET_REI_I05_special_tt:0 "Establish Puppet governments under Reikland in [A05.GetNameDef], [A07.GetNameDef], [A08.GetNameDef], [A09.GetNameDef], [A83.GetNameDef]."
 WET_REI_I06:0 "The Electors Return"
 WET_REI_I06_desc:0 "The Diet's empty benches are filling, and Imperial couriers once again travel between willing courts. We can now replace provincial obstruction with coordinated muster rolls and a clearer account of the men available for defence."
 WET_REI_I06_requirement:0 "At least §Y8§! of the §Y16§! return objectives settled by a valid Elector compact, direct subject status or peaceful Imperial ownership."
 WET_REI_I07:0 "An Imperial Army"
 WET_REI_I07_desc:0 "Provincial levies must learn to march as parts of one army. An Imperial chain of command will turn restored allegiance into strength upon the battlefield."
 WET_REI_I08:0 "A Council of Princes"
 WET_REI_I08_desc:0 "The Emperor need not erase every provincial crown to restore common purpose. A permanent council can give the princes a voice while making their cooperation part of the Empire's daily government."
 WET_REI_I09:0 "One Imperial Crown"
 WET_REI_I09_desc:0 "An Empire cannot be governed by proclamations alone. A permanent chancery will carry the throne's decisions into the workshops and offices that sustain the realm."
 WET_REI_I10:0 "The Empire Restored"
 WET_REI_I10_construction_0_tt:0 "Add §G1§! §Y$infrastructure$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_I10_desc:0 "The provinces now possess more than a shared memory of greatness. Common musters, stronger roads and a settled government can turn the restored Empire into a power capable of defending its people."
 WET_REI_I10_requirement:0 "At least §Y12§! return objectives settled, including §Y8§! proper subjects or integrated realms; Reikland is independent."
 WET_REI_I11:0 "The Grand Theogonist"
 WET_REI_I11_desc:0 "The Grand Theogonist speaks to villages that rarely see an Imperial official. By working with the temples, we can carry relief to the marching armies and give threatened communities a reason to stand firm."
 WET_REI_I12:0 "Volkmar's Crusade"
 WET_REI_I12_desc:0 "Volkmar sees the danger in Sylvania as a test of faith as well as arms. If the vampires turn aggression upon the Empire, we shall seek his consent for a crusade with a real objective and the means to pursue it."
 WET_REI_I12_special_tt:0 "Request Volkmar’s Crusade."
 WET_REI_I13:0 "Guard the Sacred Relics"
 WET_REI_I13_desc:0 "The relics entrusted to our temples are more than ornaments for festival days. Guards, inventories and secure sanctuaries will make it harder for the servants of death to turn those treasures against the living."
 WET_REI_I13_requirement:0 ""
 WET_REI_I13_special_tt:0 "Secure the sacred relics and gain 3% Stability. Costs 50 Political Power."
 WET_REI_I14:0 "Watch the Sylvanian Border"
 WET_REI_I14_desc:0 "The roads out of Sylvania must be watched before the alarm bells sound. Fortified crossings and vigilant patrols will give the borderlands time to respond when an unfamiliar host emerges from the mist."
 WET_REI_I14_special_tt:0 "Build §G1§! fort level at each of the two agreed Sylvanian border sites when construction rights and capacity permit."
 WET_REI_I15:0 "The Dead at Our Door"
 WET_REI_I15_desc:0 "Every rumour from the Sylvanian court carries the possibility of a new threat. Our agents must distinguish useful intelligence from terror, and find a way home for those whom the vampires have taken captive."
 WET_REI_I15_special_tt:0 "Investigate the Sylvanian court. Preparations take 60 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_REI_I16:0 "Fortify the Imperial Frontiers"
 WET_REI_I16_desc:0 "The frontier cannot be secured by proclamations issued from Altdorf. We shall survey the crossings, negotiate access and decide whether the Empire's defence will rest upon sorcery or the endurance of its garrisons."
 WET_REI_I16_special_tt:0 "Negotiate Frontier Project Access."
 WET_REI_I17:0 "Raise the Auric Bastion"
 WET_REI_I17_desc:0 "A barrier of golden light could deny the enemy roads that stone walls cannot cover. Such a work demands land, supplies and disciplined cooperation among the institutions that will keep its wards alive."
 WET_REI_I17_requirement:0 ""
 WET_REI_I17_special_tt:0 "Begin construction of the Auric Bastion along the agreed frontier. Costs 150 Political Power."
 WET_REI_I18:0 "A Wall of Men and Steel"
 WET_REI_I18_construction_0_tt:0 "Add §G2§! §Y$arms_factory$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_I18_desc:0 "Walls require masons, guns require foundries, and both require soldiers who will hold their ground. We shall invest in a frontier that can be repaired and defended by the ordinary strength of the Empire."
 WET_REI_I18_special_tt:0 "Build the Conventional Frontier. Preparations take 120 days and cost 100 Political Power. Work begins when its access and supply requirements are met. Use the Dwarf compact’s reduced price and construction time when available. Preparations take 90 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_REI_I19:0 "Defend Altdorf"
 WET_REI_I19_desc:0 "Altdorf is the seat of our government and a promise to every province that the Empire still stands. We must prepare to defend it, while ensuring that the court can continue its work if the walls are breached."
 WET_REI_I19_special_tt:0 "Defend Altdorf when war reaches the Empire. Preparations take 90 days. Work begins when its access and supply requirements are met."
 WET_REI_I20:0 "An Empire That Endures"
 WET_REI_I20_construction_0_tt:0 "Add §G2§! §Y$industrial_complex$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_I20_desc:0 "Survival will be measured by the towns rebuilt and the institutions still able to serve them. Whether the capital held or had to be recovered, the Empire must emerge with the means to endure another campaign."
 WET_REI_I20_requirement:0 "Altdorf and Reikland’s six starting states are secure; a real defence, reconstruction or northern-war victory has resolved."
 WET_REI_I21:0 "Bind Priests and Colleges"
 WET_REI_I21_desc:0 "A ward raised in haste will fail if priests and wizards dispute its upkeep. The temples and Colleges must agree upon the duties, supplies and sanctioned practices needed to sustain the frontier project."
 WET_REI_I22:0 "Lawful Wards of the Colleges"
 WET_REI_I22_desc:0 "The Colleges possess enough lawful knowledge to strengthen the frontier without bargaining away its defenders. Careful study of the wards will preserve that discipline and leave our scholars better prepared for the next trial."
 WET_REI_I22_requirement:0 ""
 WET_REI_I22_special_tt:0 "Complete the Colleges’ remedial work and gain 5% Stability. Costs 50 Political Power."
 WET_REI_I23:0 "Maintain the Golden Wall"
 WET_REI_I23_desc:0 "The Golden Wall is a continuing obligation, not a monument to a finished triumph. Its stations must remain accessible and its keepers supplied if the light is to hold against the pressure gathering beyond it."
 WET_REI_I23_requirement:0 "The Auric Bastion has actually been raised and its upkeep agreement remains valid."
 WET_REI_I23_special_tt:0 "Gain §Y$wet_rei_golden_wall$§! while the real Bastion remains unbroken, accessible and maintained: §G+10% Core Defence§!."
 WET_REI_I24:0 "Provincial Garrisons"
 WET_REI_I24_desc:0 "A fortress is only as dependable as the men who know its approaches. Provincial garrisons will rehearse relief, reserve movements and counterattacks until each crossing forms part of a coherent defence."
 WET_REI_I24_special_tt:0 "Build §G2§! additional fort levels across the agreed Sylvanian border sites when construction rights and capacity permit."
 WET_REI_I25:0 "The Eastern Supply Network"
 WET_REI_I25_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_I25_desc:0 "The eastern armies cannot live upon courage when their wagons fail to arrive. A connected supply corridor will carry provisions toward the frontier and bring the wounded back through roads kept open for them."
 WET_REI_I25_special_tt:0 "Connect the eastern supply corridor over 90 days. Preparations take 90 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_REI_I26:0 "Uphold the Imperial Charter"
 WET_REI_I26_desc:0 "The Imperial Charter binds authority to obligations that outlive any single ruler. Upholding it will give the provinces confidence that the Emperor's growing strength remains a strength exercised in their name."
 WET_REI_P00:0 "Put the Empire to Work"
 WET_REI_P00_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P00_desc:0 "The Empire's workshops need orders that outlast the latest dispute among its princes. We shall begin a programme of productive work that can proceed while the larger political settlement takes shape."
 WET_REI_P01:0 "Reikland Workshops"
 WET_REI_P01_construction_0_tt:0 "Add §G2§! §Y$industrial_complex$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P01_desc:0 "Altdorf and the towns of Reikland already possess the craftsmen upon whom greater ambitions depend. New workshops will give their skills room to grow and provide a firmer base for future investment."
 WET_REI_P02:0 "Mines and Timber Contracts"
 WET_REI_P02_desc:0 "An arsenal cannot live upon promises from a merchant's ledger. Reliable contracts for timber and metal will bring more of the Empire's existing resources into productive use."
 WET_REI_P03:0 "The Reik Supply Network"
 WET_REI_P03_construction_0_tt:0 "Add §G2§! §Y$infrastructure$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P03_desc:0 "The Reik binds farms, towns and mustering grounds into a single economic artery. Better roads and supply works will carry its benefits beyond the riverbanks and toward the armies that need them."
 WET_REI_P04:0 "Imperial Arsenals"
 WET_REI_P04_construction_0_tt:0 "Add §G2§! §Y$arms_factory$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P04_desc:0 "The State Troops cannot be equipped by a collection of hurried purchases. Permanent arsenals will give the Empire a steadier source of weapons when every province begins to compete for the same stock."
 WET_REI_P05:0 "An Economy for War"
 WET_REI_P05_desc:0 "A long war demands more than a sudden increase in orders. We must organise construction and military production so that the Empire can replace losses without exhausting the economy that sustains it."
 WET_REI_P06:0 "Arm the State Troops"
 WET_REI_P06_desc:0 "Courage varies little between a well-equipped soldier and one holding a broken weapon. The difference in their chances is reason enough to improve the arms issued to our State Troops."
 WET_REI_P07:0 "Nuln Gunnery Contracts"
 WET_REI_P07_desc:0 "Nuln's foundries have made a reputation that Imperial ownership alone could never create. We shall purchase their expertise and seek cooperation without treating the city's workshops as spoils already belonging to us."
 WET_REI_P07_requirement:0 ""
 WET_REI_P07_special_tt:0 "Send Nuln an offer to fund its gunnery contract."
 WET_REI_P08:0 "Knightly Orders"
 WET_REI_P08_desc:0 "The knightly orders preserve disciplines that can still decide a battle. Their experience should inform the development of the Empire's armoured forces, joining inherited skill to new methods of war."
 WET_REI_P09:0 "The General Staff"
 WET_REI_P09_desc:0 "An army assembled from provincial contingents needs a common language of orders. A stronger General Staff will turn separate traditions into plans that can be understood and carried out across the whole front."
 WET_REI_P10:0 "Combined Arms of the Empire"
 WET_REI_P10_desc:0 "Infantry, guns and mounted forces achieve less when each fights its own battle. We shall train their commanders to combine timing and movement, making the whole army stronger than its separate arms."
 WET_REI_P11:0 "Colleges of Magic"
 WET_REI_P11_desc:0 "The Colleges contain knowledge that too often remains within the walls of its own discipline. Imperial support can bring that learning into a sustained programme of research useful to the realm."
 WET_REI_P12:0 "Imperial Research Grants"
 WET_REI_P12_desc:0 "A promising investigation should not end when its patron loses interest. Regular grants will give Imperial scholars the time and resources to pursue another line of research alongside their existing work."
 WET_REI_P13:0 "Battle Wizards and Griffon Riders"
 WET_REI_P13_desc:0 "The skies above a battlefield belong neither wholly to wizards nor to riders. Their cooperation must be studied and practised if the Empire's airborne forces are to support the armies below."
 WET_REI_P14:0 "Master Engineers"
 WET_REI_P14_construction_0_tt:0 "Add §G1§! §Y$industrial_complex$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P14_desc:0 "The best engineers solve the problem that everyone else has learned to endure. We shall give them workshops and commissions worthy of their skill, bringing practical improvements into wider Imperial use."
 WET_REI_P15:0 "An Age of Imperial Learning"
 WET_REI_P15_desc:0 "A greater industrial base can sustain more than another season of military orders. By supporting an additional field of research, the Empire can turn its growing resources into discoveries that will outlast the present crisis."
 WET_REI_P15_requirement:0 "Reikland owns and controls at least §Y18§! civilian and military factories combined."
 WET_REI_P16:0 "Secure an Imperial Harbour"
 WET_REI_P16_construction_0_tt:0 "Add §G1§! §Y$naval_base$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P16_desc:0 "The Empire's ambitions at sea must begin with a harbour that it can actually use. Surveyors will identify the facilities needed to shelter ships and support a fleet through more than a single voyage."
 WET_REI_P17:0 "Shipyards of the Reik"
 WET_REI_P17_construction_0_tt:0 "Add §G2§! §Y$dockyard$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P17_desc:0 "A fleet cannot be summoned by the stroke of an Emperor's pen. New shipyards must lay down its hulls, train its craftsmen and provide the capacity to replace what the sea or enemy takes."
 WET_REI_P18:0 "Escort the Grain Ships"
 WET_REI_P18_desc:0 "The army's bread may depend upon ships whose names never appear in a victory proclamation. More convoy hulls and experienced escorts will help those provisions reach the ports where they are needed."
 WET_REI_P19:0 "Warships of the Empire"
 WET_REI_P19_desc:0 "Imperial warships must be built for the seas they will have to command. Investment in naval research and professional seamanship will make the fleet a fighting force rather than a collection of armed hulls."
 WET_REI_P20:0 "Provision the Grand Host"
 WET_REI_P20_desc:0 "The Grand Host must eat, march and replenish its stores regardless of the season. Better provisioning will reduce the burden of each campaign and preserve reserves for the crisis that follows it."
 WET_REI_P21:0 "Survey the Guild Ledgers"
 WET_REI_P21_desc:0 "The guilds know which workshops lack orders and which masters struggle to find apprentices. A careful survey will turn these scattered accounts into a practical programme of construction."
 WET_REI_P22:0 "Chartered Guild Contracts"
 WET_REI_P22_desc:0 "The guild charters preserve skills that no Imperial office could recreate overnight. Reliable contracts will reward civilian investment and encourage masters to improve the work of their shops."
 WET_REI_P23:0 "Crown-Managed Foundries"
 WET_REI_P23_desc:0 "Private workshops cannot always meet the demands of an approaching war. Crown supervision will concentrate investment in the foundries and ensure that military orders receive sustained attention."
 WET_REI_P24:0 "Common Gauges and Fittings"
 WET_REI_P24_desc:0 "A broken fitting should not leave a weapon useless simply because its maker lives in another town. Common gauges will let our workshops share components and make repairs less dependent on a single master."
 WET_REI_P25:0 "Powder and Shot Reserves"
 WET_REI_P25_desc:0 "An arsenal is of little use if its stores are empty when the regiments assemble. We will set aside weapons and support supplies so that the first demands of mobilisation can be met at once."
 WET_REI_P26:0 "Feed the Warpstone Furnaces"
 WET_REI_P26_construction_0_tt:0 "Add §G1§! §Y$energy_infrastructure$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P26_desc:0 "The furnaces need dependable power if the new workshops are to earn their keep. Better distribution and extraction methods will make more of the Warpstone already available to the Empire."
 WET_REI_P27:0 "County Muster Depots"
 WET_REI_P27_desc:0 "The muster rolls must lead to real assembly places with officials who know the men expected there. County depots will gather reserves and turn local obligations into usable military strength."
 WET_REI_P28:0 "Drill the Citizen Regiments"
 WET_REI_P28_desc:0 "Many citizens can serve well if their instruction is clear and their drills are repeated often. A common training programme will bring new regiments into the field with less delay."
 WET_REI_P29:0 "A Professional Cadre"
 WET_REI_P29_desc:0 "An experienced officer can teach lessons that no hurried muster will discover for itself. A professional cadre will preserve those lessons and give our commanders more time to prepare their battles."
 WET_REI_P30:0 "Surgeons on the March"
 WET_REI_P30_desc:0 "Too many soldiers are lost after the fighting has ended, beyond the reach of a surgeon or a clean dressing. Organised medical services will accompany the regiments and carry their wounded back to care."
 WET_REI_P31:0 "The Quartermasters' School"
 WET_REI_P31_construction_0_tt:0 "Add §G1§! §Y$supply_node$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P31_desc:0 "A quartermaster must understand the army's route as well as the contents of its wagons. A dedicated school and connected depots will help supplies reach the troops who need them."
 WET_REI_P32:0 "A Charter for the Colleges"
 WET_REI_P32_desc:0 "The Colleges need dependable patronage as much as gifted pupils. A common charter will support teaching, regular correspondence and research that serves the wider realm."
 WET_REI_P33:0 "Battlefield Arcane Liaison"
 WET_REI_P33_construction_0_tt:0 "Add §G2§! §Y$air_base$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P33_desc:0 "A wizard or rider cannot support an army whose intentions reach them too late. Liaison officers and prepared bases will give our aerial forces a clearer place in the battle plan."
 WET_REI_P34:0 "Experimental Workshops"
 WET_REI_P34_desc:0 "The artificer's sketch must survive mud, weather and the rough handling of a campaign. Experimental workshops will test new guns and armoured equipment before the army is asked to rely upon them."
 WET_REI_P35:0 "The Imperial Signals Service"
 WET_REI_P35_desc:0 "Reports are useful only when they reach someone able to act upon them. A signals service will connect the Empire's technical institutions with the headquarters directing its armies."
 WET_REI_P36:0 "Imperial Proving Grounds"
 WET_REI_P36_desc:0 "An impressive demonstration can conceal a machine's failings as easily as reveal its strengths. The proving grounds will bring engineers and soldiers together to test new methods under demanding conditions."
 WET_REI_P37:0 "Wardens of the Reik"
 WET_REI_P37_desc:0 "The Reik carries grain, soldiers and the news on which distant garrisons depend. Trained wardens will patrol its approaches and give the future fleet a foundation of experienced crews."
 WET_REI_P38:0 "A Fleet to Guard Trade"
 WET_REI_P38_desc:0 "A fleet can defend the realm by ensuring that its merchant ships reach their destinations. Escorts and disciplined sailing arrangements will give trade protection priority in our naval programme."
 WET_REI_P39:0 "A Fleet to Contest the Seas"
 WET_REI_P39_desc:0 "An enemy fleet cannot always be avoided or drawn away from our coast. Captains trained to manoeuvre together will be better prepared to contest the open sea when battle is necessary."
 WET_REI_P40:0 "Victualling Yards"
 WET_REI_P40_construction_0_tt:0 "Add §G2§! §Y$fuel_silo$§! levels at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P40_desc:0 "A ship waiting for provisions is as helpless as an army waiting for its wagons. Victualling yards will store durable food and organise the deliveries needed for prolonged service."
 WET_REI_P41:0 "The Reik Admiralty"
 WET_REI_P41_construction_0_tt:0 "Add §G1§! §Y$dockyard$§!  at eligible owned and controlled sites. Unplaced construction allocations are retained."
 WET_REI_P41_desc:0 "Shipwrights, captains and victuallers must work to a common plan if the fleet is to remain ready. The Reik Admiralty will coordinate their duties and preserve the lessons learned at sea."
 WET_REI_R00:0 "An Empire in Fragments"
 WET_REI_R00_desc:0 "The Imperial seal still bears the twin-tailed comet, but its writ no longer commands the provinces. Before we can speak for the Empire, we must reckon with the princes, temples and cities that now stand apart."
 WET_REI_R01:0 "Summon the Imperial Diet"
 WET_REI_R01_desc:0 "The Emperor's authority must be felt beyond the walls of Altdorf. A more capable court and a better organised military household will give substance to his word."
 WET_REI_R02:0 "Renew the Imperial Compact"
 WET_REI_R02_desc:0 "The princes know that the Empire cannot survive as a collection of private quarrels. Patient counsel and familiar oaths may restore the confidence that threats have worn away."
 WET_REI_R03:0 "Issue the Imperial Summons"
 WET_REI_R03_desc:0 "The Imperial throne cannot answer every challenge with another appeal. A firmer voice and captains prepared to carry its orders will remind the princes what their oaths require."
 WET_REI_R04:0 "Recover the Emperor's Mandate"
 WET_REI_R04_desc:0 "An Emperor who cannot act is little more than a name upon a proclamation. A renewed mandate will give Altdorf the means to conduct its affairs while the larger settlement of the provinces continues."
 WET_REI_R04_special_tt:0 "Replace §Y$wet_rei_disunity$§! with §Y$wet_rei_resistance$§!, or gain §G10% Stability§! if Political Disunity is already resolved."
 WET_REI_S00:0 "The Sylvanian Threat"
 WET_REI_S00_desc:0 "Sylvania is at peace with Reikland, but peace does not make its rulers harmless. We must watch their designs upon the other Imperial realms and prepare a response before isolated princes are overcome."
 WET_REI_S01:0 "Shield the Electors"
 WET_REI_S01_desc:0 "An isolated Elector may fall before the Diet agrees that its danger concerns everyone. Offers of aid and Imperial protection can give willing realms a stronger defence without demanding their submission first."
 WET_REI_S01_special_tt:0 "Offer Imperial Protection."
 WET_REI_S02:0 "An Imperial Response"
 WET_REI_S02_desc:0 "When Sylvania turns ambition into aggression, the Empire must be able to answer a threatened realm that asks for help. Preparations for relief will follow the actual war and the beneficiary’s consent, leaving the final decision to intervene with the Emperor."
 WET_REI_S02_special_tt:0 "Prepare Relief for an Attacked Elector."
