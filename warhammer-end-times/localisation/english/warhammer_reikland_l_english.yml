 wet_reikland.1.0:0 "Record the agreement."
 wet_reikland.1.d:0 "The returning envoys carry a sealed agreement and the first hopeful news in weeks. Another court has answered our appeal, giving the Emperor something firmer than promises to build upon."
 wet_reikland.1.t:0 "The Agreement Is Accepted"
 wet_reikland.100.0:0 "Decline or let the offer lapse."
 wet_reikland.100.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.100.1:0 "Accept the terms."
 wet_reikland.100.1_effect:0 "Return as a loose Elector. Keep independence, territory, forces and industry. Access is mutual; neither side automatically enters the other’s wars. First peaceful or regionally subsidised offers are free; otherwise Reikland pays §Y25§! Political Power."
 wet_reikland.100.d:0 "The Emperor’s seal lies upon the table before our council. Altdorf asks that old quarrels be put aside and the scattered princes remember the realm their ancestors swore to defend."
 wet_reikland.100.t:0 "Return to the Imperial Compact"
 wet_reikland.101.0:0 "Decline or let the offer lapse."
 wet_reikland.101.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.101.1:0 "Accept the terms."
 wet_reikland.101.1_effect:0 "Reikland demands a return to the loose Imperial compact. Refusal may grant a subject war goal, but never starts a war automatically."
 wet_reikland.101.d:0 "The Emperor has summoned our court to answer for its distance from Altdorf. His messenger speaks with the confidence of a sovereign who expects obedience, not another season of excuses."
 wet_reikland.101.t:0 "An Imperial Summons"
 wet_reikland.102.0:0 "Decline or let the offer lapse."
 wet_reikland.102.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.102.1:0 "Accept the terms."
 wet_reikland.102.1_effect:0 "Accept Dominion status under Reikland, including ordinary subject military obligations. Reikland pays §Y50§! Political Power. Refusal preserves the loose compact."
 wet_reikland.102.d:0 "Altdorf proposes a closer bond between our court and the Imperial throne. The old privileges of the princes would give way to a stronger hand at the centre of the Empire."
 wet_reikland.102.t:0 "A Stronger Imperial Settlement"
 wet_reikland.103.0:0 "Decline or let the offer lapse."
 wet_reikland.103.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.103.1:0 "Accept the terms."
 wet_reikland.103.1_effect:0 "Consent to integration into Reikland after a §Y180§!-day project costing Reikland §Y100§! Political Power. You may withdraw consent while it is active. Interrupted integration refunds §Y50§! Political Power."
 wet_reikland.103.1_outcome:0 "Approves integration into Reikland."
 wet_reikland.103.d:0 "The Emperor asks our rulers to place their realm beneath a single Imperial crown. Centuries of provincial pride weigh against the promise of an Empire able to act as one."
 wet_reikland.103.t:0 "One Imperial Crown"
 wet_reikland.104.0:0 "Decline or let the offer lapse."
 wet_reikland.104.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.104.1:0 "Accept the terms."
 wet_reikland.104.1_effect:0 "Return as a Dominion with trading privileges. Reikland pays §Y100§! Political Power and accepts a year of construction concessions. Existing Everchosen war blocks this commitment below §Y100%§! tension."
 wet_reikland.104.d:0 "Imperial envoys have arrived in Marienburg with a proposal for renewed allegiance. The merchant lords listen carefully, measuring the protection of the Emperor against the freedom of their city."
 wet_reikland.104.t:0 "An Offer to Marienburg"
 wet_reikland.105.0:0 "Decline or let the offer lapse."
 wet_reikland.105.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.105.1:0 "Accept the terms."
 wet_reikland.105.1_effect:0 "Accept Dominion status and trading privileges for §Y100§! Political Power, or risk an Imperial subject war goal. No war starts automatically."
 wet_reikland.105.d:0 "An Imperial messenger has delivered a demand to Marienburg’s ruling council. Altdorf’s patience with the city’s independence appears to be nearing its end."
 wet_reikland.105.t:0 "An Ultimatum to Marienburg"
 wet_reikland.106.0:0 "Decline or let the offer lapse."
 wet_reikland.106.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.106.1:0 "Accept the terms."
 wet_reikland.106.1_effect:0 "The northern threat demands cooperation. Pledge support for coalition negotiations with Reikland. Its Grand Alliance begins with Reikland alone; an invitation still requires separate consent. If Reikland later needs to form or join an Order faction, this pledge can support that settlement. Reconfirm current wars before admission."
 wet_reikland.106.1_outcome:0 "Pledges support for an alliance against Chaos."
 wet_reikland.106.d:0 "Reports from the north speak of tribes gathering beneath a single terrible champion. If the rumours are true, the quarrels of the southern courts may soon seem very small indeed."
 wet_reikland.106.t:0 "The Coming Everchosen"
 wet_reikland.107.0:0 "Decline or let the offer lapse."
 wet_reikland.107.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.107.1:0 "Accept the terms."
 wet_reikland.107.1_effect:0 "Reikland requests our consent to invite Karaz-a-Karak. We retain leadership. No new Everchosen-war commitment below §Y100%§! tension."
 wet_reikland.107.d:0 "The Emperor has found another realm willing to stand against the northern threat. His envoys now ask that our alliance open its ranks to this prospective companion."
 wet_reikland.107.t:0 "Approve an Imperial Coalition Invitation"
 wet_reikland.108.0:0 "Decline or let the offer lapse."
 wet_reikland.108.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.108.1:0 "Accept the terms."
 wet_reikland.108.1_effect:0 "Join the actual Order coalition and accept its normal defensive obligations. Reikland pays §Y75§! Political Power only on actual admission. If Reikland is not the leader, the leader must also approve; the invitation cannot override a war or faction conflict."
 wet_reikland.108.d:0 "The Emperor calls upon our realm to stand beside the free peoples against the coming darkness. His envoys bring no promise of an easy war, only the hope that unity may spare us defeat in isolation."
 wet_reikland.108.t:0 "An Invitation to the Grand Alliance"
 wet_reikland.109.0:0 "Decline or let the offer lapse."
 wet_reikland.109.0_effect:0 "Decline. No payment or forced war."
 wet_reikland.109.1:0 "Accept the terms."
 wet_reikland.109.1_effect:0 "Reikland requests our consent to invite Kislev. We retain leadership. No new Everchosen-war commitment below §Y100%§! tension."
 wet_reikland.109.d:0 "The Emperor has found another realm willing to stand against the northern threat. His envoys now ask that our alliance open its ranks to this prospective companion."
 wet_reikland.109.t:0 "Approve an Imperial Coalition Invitation"
