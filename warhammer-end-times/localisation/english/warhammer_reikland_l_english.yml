 wet_rei_westerland:0 "Renew the Marienburg Offer"
 wet_rei_westerland_desc:0 "Offer Westerland Dominion status. Payment and wartime eligibility are checked when it accepts."
 wet_rei_westerland_effect:0 "Offer Westerland Dominion status. Payment and wartime eligibility are checked when it accepts."
 wet_rei_westerland_requirements:0 "Offer Westerland Dominion status. Payment and wartime eligibility are checked when it accepts."
 wet_rei_westerland_summons:0 "Press the Westerland Claim"
 wet_rei_westerland_summons_desc:0 "After choosing Imperial ultimatums and recovering the Mandate, demand Westerland’s return from a position of strength. Acceptance costs 100 PP; refusal grants a subject war goal, with declaration a separate choice."
 wet_rei_westerland_summons_effect:0 "After choosing Imperial ultimatums and recovering the Mandate, demand Westerland’s return from a position of strength. Acceptance costs §Y100§! Political Power; refusal grants a subject war goal, with declaration a separate choice."
