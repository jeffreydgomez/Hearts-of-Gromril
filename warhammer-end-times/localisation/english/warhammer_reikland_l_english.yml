 wet_rei_start_bastion:0 "Construct the Auric Bastion"
 wet_rei_start_bastion_desc:0 "Build the negotiated frontier from Salkalten through Ostland to Schwartzhafen. Cost 150 PP and 1,000 Elite Equipment; 180 days. A current Dwarf compact reduces PP by 50 and time by 30 days. Lost site rights pause construction; 30 days without them cancels it and refunds 75 PP."
