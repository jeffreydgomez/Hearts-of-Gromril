l_english:
 wet_race_daemon:0 "Daemonic Nation"
 wet_race_daemon_desc:0 "Manifestations of their patron's will take shape as daemonic legions. Supernatural ferocity drives them into battle, while mortal scholarship holds little interest for the denizens of Chaos."
 wet_race_human:0 "Human Nation"
 wet_race_human_desc:0 "Versatile institutions and practical invention allow human realms to build and mobilize quickly."
 wet_race_chaos_mortals:0 "Mortal Chaos Nation"
 wet_race_chaos_mortals_desc:0 "The northern warbands prize martial strength and divine favour above patient scholarship."
 wet_race_high_elf:0 "High Elven Nation"
 wet_race_high_elf_desc:0 "Long training and ancient knowledge sustain disciplined armies, but the Elven population replenishes slowly."
 wet_race_dark_elf:0 "Dark Elven Nation"
 wet_race_dark_elf_desc:0 "Ruthless warriors and feared fleets pursue conquest while rivalry undermines cohesion and Elven numbers recover slowly."
 wet_race_wood_elf:0 "Wood Elven Nation"
 wet_race_wood_elf_desc:0 "Patient scouts and lightly supplied defenders guard their homelands; every fallen Elf is difficult to replace."
 wet_race_forest_spirit:0 "Forest Spirit Nation"
 wet_race_forest_spirit_desc:0 "Ancient woodland beings endure hardship and defend their groves, but awaken and travel slowly."
 wet_race_dwarf:0 "Dwarven Nation"
 wet_race_dwarf_desc:0 "Disciplined shieldwalls and careful fortifications hold firm. Short strides and slow replenishment constrain distant campaigns."
 wet_race_chaos_dwarf:0 "Chaos Dwarven Nation"
 wet_race_chaos_dwarf_desc:0 "Forbidden engineering and relentless extraction sustain a small, heavily equipped population."
 wet_race_halfling:0 "Halfling Nation"
 wet_race_halfling_desc:0 "Close communities and efficient provisioning support determined homeland defenders with little appetite for frontal assaults."
 wet_race_orc:0 "Orcish Nation"
 wet_race_orc_desc:0 "Orcs gather quickly and fight ferociously, but discipline and methodical research rarely survive a good brawl."
 wet_race_goblin:0 "Goblin Nation"
 wet_race_goblin_desc:0 "Numerous and watchful, Goblins excel at finding opportunities but struggle in a fair fight."
 wet_race_hobgoblin:0 "Hobgoblin Nation"
 wet_race_hobgoblin_desc:0 "Fast raiders and scouts exploit exposed enemies; loyalty within the host remains uncertain."
 wet_race_gnoblar:0 "Gnoblar Nation"
 wet_race_gnoblar_desc:0 "Prolific labourers build with scavenged materials, but their small bodies and timid formations fare poorly in battle."
 wet_race_kobold:0 "Kobold Nation"
 wet_race_kobold_desc:0 "Small subterranean hosts favour prepared positions and darkness over open-field strength."
 wet_race_skaven:0 "Skaven Nation"
 wet_race_skaven_desc:0 "Explosive invention and rapidly multiplying warrens feed vast armies whose rank and file are undermined by fear and treachery."
 wet_race_lizardmen:0 "Lizardmen Nation"
 wet_race_lizardmen_desc:0 "Purpose-bred warriors obey an ancient order with exceptional discipline, but adapt cautiously and advance deliberately."
 wet_race_old_ones:0 "Old Ones Nation"
 wet_race_old_ones_desc:0 "Rare remnants preserve extraordinary knowledge and ordered purpose, but their numbers recover slowly."
 wet_race_ogre:0 "Ogre Nation"
 wet_race_ogre_desc:0 "Massive bodies smash enemy lines, demanding heavy provisioning and time to gather a battle-ready host."
 wet_race_yhetee:0 "Yhetee Nation"
 wet_race_yhetee_desc:0 "Swift, brutal hunters endure bitter cold but have little use for formal scholarship."
 wet_race_beastmen:0 "Beastmen Nation"
 wet_race_beastmen_desc:0 "Fast-moving herds strike hard and live from the land, scorning the institutions of civilization."
 wet_race_fimir:0 "Fimir Nation"
 wet_race_fimir_desc:0 "Secluded clans fight tenaciously in darkness, but their scattered population replenishes slowly."
 wet_race_troll:0 "Troll Nation"
 wet_race_troll_desc:0 "Trolls recover and strike with frightening strength, offset by poor coordination and scant technical understanding."
 wet_race_giant:0 "Giant Nation"
 wet_race_giant_desc:0 "Towering fighters break through enemy ranks but require enormous supplies and struggle to maintain coordinated formations."
 wet_race_snakefolk:0 "Snakefolk Nation"
 wet_race_snakefolk_desc:0 "Secretive serpentine courts favour reconnaissance and strikes from darkness; their populations are slow to replenish."
 wet_race_tigerkin:0 "Tigerkin Nation"
 wet_race_tigerkin_desc:0 "Powerful hunters strike quickly and forcefully, at a higher cost in supplies."
 wet_race_monkeyfolk:0 "Monkeyfolk Nation"
 wet_race_monkeyfolk_desc:0 "Agile scouts and swift warbands excel at movement, though their independent temperaments complicate rigid formations."
 wet_race_unclassified:0 "Uncharted Nation"
 wet_race_unclassified_desc:0 "This reserve realm has no reliable source culture. Its racial bonuses await a defined identity."
 wet_race_undead_high_elf:0 "High Elven Nation"
 wet_race_undead_high_elf_desc:0 "High Elven Nation endures in undeath. Ancient martial traditions linger among the silent ranks."
