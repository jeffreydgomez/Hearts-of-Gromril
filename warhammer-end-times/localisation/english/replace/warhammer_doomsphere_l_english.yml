 sub_ship_nuclear_engine_1_desc:0 "Warpstone cores, sealed chambers and expendable experiments advance the dangerous craft."
 sub_ship_nuclear_engine_1_short:0 "Submarine Reactor"
 the_atomic_race_complete_trigger:0 "A member of [ROOT.GetFactionName] is the first country to finish $sp_nuclear_bomb$"
 the_atomic_race_complete_trigger_fail:0 "A country that is not a member of [ROOT.GetFactionName] is the first country to finish $sp_nuclear_bomb$"
 the_atomic_race_goal_desc:0 "We need to ensure that our enemies, current or future, do not gain access to Doomsphere weapons before we do. Only by being the first we can be sure that no other power can stand against us."
 the_atomic_race_goal_name:0 "Build the First Doomsphere"
 thermonuclear_bomb:0 "Greater Doomsphere"
 thermonuclear_bombs:0 "Greater Doomspheres"
 thermonuclear_bombs_desc:0 "Standardise the staged cores and reinforced casings of Greater Doomspheres. Master artificers can now turn an exceptional experiment into a repeatable weapon of catastrophic destructive power."
 tooltip_raid_category_nuclear_raids:0 "§HNuclear raids§! \nStrikes carried out by strategic bombers or ballistic missiles carrying Doomsphere weapons."
