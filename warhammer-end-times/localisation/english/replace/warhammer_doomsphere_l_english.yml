 MODIFIER_NUCLEAR_PRODUCTION_FACTOR:0 "§H$nuclear_bomb$§! Production Rate"
 MODIFIER_THERMONUCLEAR_PRODUCTION:0 "Allows §H$thermonuclear_bomb$§!"
 MODIFIER_THERMONUCLEAR_PRODUCTION_FACTOR:0 "§H$thermonuclear_bomb$§! Production Rate"
 NORDIC_nuclear_production:0 "Doomsphere Production"
 NORDIC_nuclear_production_desc:0 "Now that we have the knowledge to split the atom, we may as well use it. But first, we need to produce the materials and infrastructure needed to produce enough to turn the tides of war in our favor."
 NORDIC_nuclear_research:0 "Doomsphere research"
 NORDIC_nuclear_research_desc:0 "Scientists cannot keep their mouths shut about the new world that is bound to land upon us when the splitting of the atom is finally weaponized. Why should we be kept from this technological miracle that could bring an end to the war in one fell swoop."
 NSB_soviet_atomic_bomb_project.1.a:0 "Another victory for peace."
 NSB_soviet_atomic_bomb_project.1.desc:0 "One of our agents tasked with infiltrating a foreign Doomsphere research program has returned to our embassy, carrying a large number of top-secret documents of various different items that the scientists are working on, from centrifuge designs to calculations of warhead dimensions. This data will no doubt be very valuable in advancing our own Doomsphere weapons program."
 NSB_soviet_atomic_bomb_project.1.t:0 "Agent returns with Doomsphere secrets"
 NSB_soviet_atomic_bomb_project.2.a:0 "Absurd! We have no connection with this person."
 NSB_soviet_atomic_bomb_project.2.desc:0 "One of our Agents tasked with infiltrating a Doomsphere weapons program was apprehended today while trying to leave a secure facility. A search of his bag produced a number of secret documents. Unfortunately, he has evidently confessed to working for us, as our ambassador was summoned for urgent consultations and confronted with the evidence."
 NSB_soviet_atomic_bomb_project.2.t:0 "Agent caught at Doomsphere Facility"
 NSB_soviet_atomic_bomb_project.3.a:0 "At least nothing was stolen."
 NSB_soviet_atomic_bomb_project.3.desc:0 "Earlier today, an employee at one of our Doomsphere research facilities was stopped in a routine inspection. A thorough search of his belongings found a hidden compartment in his bag. Inside that compartment were a number of high-classified documents related to Doomsphere technologies. \n\nThe suspect has been handed over to counter-intelligence, and has made a full confession. It appears that he was in contact with the [SOV.GetAdjective] embassy, and tasked with infiltrating our Doomsphere research program to steal blueprints and other research data."
 NSB_soviet_atomic_bomb_project.3.t:0 "Security Breach at Doomsphere Research Facility"
