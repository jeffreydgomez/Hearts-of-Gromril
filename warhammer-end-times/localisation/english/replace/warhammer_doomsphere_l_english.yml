 PER_establish_nuclear_program_desc:0 "The secrets of the atom have been poked and prodded at by [GER.GetNameDef] and [USA.GetNameDef] for quite some time. After receiving notes and research documents from our [USA.GetAdjective] friends, they have officially aided us in setting up our own Doomsphere program."
