 sp_commercial_nuclear_reactor:0 "Doomsphere Dynamo"
 sp_commercial_nuclear_reactor_concerns_reward:0 "Concerns Over Doomsphere Safety"
 sp_commercial_nuclear_reactor_concerns_reward_desc:0 "[Character.GetName] has raised concerns over the lack of filters in the cooling towers of our new reactors. [Character.GetSheHeCap] insists that filters must be added to prevent radiation escaping from the reactor during an emergency. The engineers meanwhile argue they will delay the project significantly."
 sp_commercial_nuclear_reactor_concerns_reward_option_ignore:0 "Utter folly!"
 sp_commercial_nuclear_reactor_concerns_reward_option_safety:0 "Add the filters."
 sp_commercial_nuclear_reactor_desc:0 "Contain a fraction of the Doomsphere process to provide concentrated arcane power for industry."
