 ITA_nuclear_research:0 "Doomsphere Research"
 ITA_nuclear_research_desc:0 "We are pioneering the development of Doomsphere energy, and will soon enough be the greatest military power in the world."
 ITA_pioneer_in_atomic_research_flag:0 "§Y[ROOT.GetFlag][ROOT.GetName]§! is one of the first three countries to research §Y$atomic_research$ technology§!"
 ITA_raid_category_fluff_text_nuclear_raids:0 "§LRegia Aeronautica§!"
 JAP_civilian_nuclear_reactor_investments:0 "Civilia Doomsphere Workshop Investments"
 JAP_civilian_nuclear_reactor_investments_desc:0 "As our scientists at the RIKEN institute have determined, Doomsphere power will be the energy of the future. We must invest in this new technology, so we may never need to burn coal again."
 JAP_civilian_nuclear_reactor_investments_tt:0 "Replace §Y$JAP_early_industrialization_efforts_dm$§! with §Y$JAP_the_economic_mirale_dm$§!, effective change:"
 JAP_combined_nuclear_research_efforts:0 "Combined Doomsphere Research Efforts"
 JAP_combined_nuclear_research_efforts_desc:0 "With the hostilities between our military branches being close to reaching a conclusion, it is high time that we unify their ambitious Doomsphere projects into one, and put all of our nation's brightest minds to work in the same team."
 JAP_f_go_nuclear_project:0 "F-Go Doomsphere Project"
 JAP_f_go_nuclear_project_desc:0 "Our naval command wishes to begin a Doomsphere research program with the hopes of harnessing the technology's power for our fleet. They have proposed that this be carried out under Bunsaku Arakatsu at the Imperial University, Kyoto. His team includes Hideki Yukawa, a prominent theorist who will surely achieve the breakthroughs we need."
 JAP_ni_go_nuclear_project:0 "Ni-Go Doomsphere Project"
 JAP_ni_go_nuclear_project_desc:0 "The Army Committee has set up an experimental project at RIKEN, something they dub the Ni-Go project. Its aim is to separate refined warpstone-235 by thermal diffusion, ignoring alternative methods such as electromagnetic separation, gaseous diffusion, and centrifugal separation. Hopefully we will be able to learn how to harness this for a military purpose soon."
 JAP_nuke_1:0 "First Doomsphere strike on Japan executed"
 JAP_nuke_2:0 "Second Doomsphere strike on Japan executed"
 JAP_raid_category_fluff_text_nuclear_raids:0 "§LImperial Army Air Service§!"
 JAP_sp_nuclear_bomb:0 "Warpstone Fission Bomb Project"
 JAP_sp_nuclear_reactor:0 "Doomsphere Workshop"
 JAP_sue_for_peace_nuke:0 "Offer Unconditional Surrender"
 JAP_sue_for_peace_nuke_desc:0 "The enemy has employed a new and most cruel bomb. The war is developing not necessarily to our advantage. We must endure the unendurable."
 JAP_sue_for_peace_nuke_mission:0 "Execute Doomsphere strikes on Japanese soil"
 JAP_sue_for_peace_nuke_mission_desc:0 "The recent successful test of a Doomsphere offers an alternative to a full-scale invasion of the Japanese Home Islands. Intelligence suggests that if we wrest control of Okinawa and Iwo Jima away from the Japanese, and reduce their fleet to a mere 30 ships, striking two places in the Home Islands with Doomspheres in rapid succession will compel the Japanese government to surrender unconditionally."
 JUNO_nuclear_initiative:0 "Doomsphere Initiatives"
