 scientist_trait_nuclear_specialist_desc:0 "A physicist at the forefront of Doomsphere research, deeply immersed in the study of Doomsphere fission and chain reactions."
 scientist_trait_nuclear_warfare_expert:0 "Doomsphere Warfare Expert"
 scientist_trait_nuclear_warfare_expert_desc:0 "An expert in the practical application of Doomsphere physics to weapon development, specializing in the theory behind Doomsphere design."
 ship_hull_nuclear_submarine:0 "Warpstone Submersibles"
 ship_hull_nuclear_submarine_desc:0 "Warpstone Submersibles: A Doomsphere turns forbidden power into a weapon of annihilation. Containment, not explosive force, is the true obstacle facing its makers. Warpstone cores, sealed chambers and expendable experiments advance the dangerous craft."
