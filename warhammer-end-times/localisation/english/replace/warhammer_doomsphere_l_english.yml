 sp_thermo_nuclear_bomb:0 "The Greater Doomsphere"
 sp_thermo_nuclear_bomb_desc:0 "Force several contained Warpstone reactions to feed one another. This Greater Doomsphere project demands new shielding and staged triggers; success promises a weapon far beyond the first experimental devices."
 sp_thermo_nuclear_bomb_speed_factor:0 "Thermo Doomsphere Research Speed"
 sp_thermo_nuclear_bomb_speed_factor_tt:0 "$sp_thermo_nuclear_bomb_speed_factor$: $RIGHT|+=%1$"
 sp_thermo_nuclear_bomb_tt:0 "Doomsphere Workshops start producing §YThermonuclear Bombs§!."
 sp_thermonuclear_bomb_test_reward:0 "Test Proposal"
 sp_thermonuclear_bomb_test_reward_desc:0 "In order to confirm the theory behind a Greater Doomsphere, our scientists have requested the opportunity to carry out a test detonation. This would require the allocation of an existing Doomsphere to initiate the chain reaction but would significantly accelerate the progress of the project."
 sp_thermonuclear_bomb_test_reward_option_no:0 "We can't spare the material."
 sp_thermonuclear_bomb_test_reward_option_yes:0 "Carry out a test."
