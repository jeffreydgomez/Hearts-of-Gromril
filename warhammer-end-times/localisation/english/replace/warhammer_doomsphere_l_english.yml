 sp_naval_nuclear_submarine_unique_reward_a:0 "Cost Concerns"
 sp_naval_nuclear_submarine_unique_reward_a_desc:0 "As we are working on a completely new type of submarine, there are growing concerns that the ship production costs will ultimately be too high. How should we proceed with the design?"
 sp_naval_nuclear_torpedo:0 "Warpstone Torpedo"
 sp_naval_nuclear_torpedo_desc:0 "Develop the doctrine, craftsmanship and arcane knowledge needed to strengthen our war hosts."
 sp_naval_nuclear_torpedo_preference_a:0 "Powerful Warheads"
 sp_naval_nuclear_torpedo_preference_b:0 "Safer Storages"
 sp_naval_nuclear_torpedo_unique_reward_a:0 "New Torpedo Course"
 sp_naval_nuclear_torpedo_unique_reward_a_desc:0 "With the Doomsphere torpedoes being close to hitting end target of the project, we must aim for..."
 sp_no_nukes_available_tt:0 "$sp_thermonuclear_bomb_test_reward_option_no$"
 sp_nuclear_bomb:0 "The Doomsphere"
 sp_nuclear_bomb_accident_generic_reward:0 "Accidental Fire"
 sp_nuclear_bomb_accident_generic_reward_desc:0 "A fire broke out in one of the warehouses at the facility. Initial investigation points towards it being an accident. But was it really?"
 sp_nuclear_bomb_breakthrough_plutonium_reward:0 "Breakthrough in Plutonium Production"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc:0 "Our scientists have made a significant breakthrough in Plutonium production techniques, increasing the efficiency of bomb production. This can hopefully accelerate the development timeline."
 sp_nuclear_bomb_critical_mass_generic_reward:0 "Critical Mass Experiment Goes Wrong"
 sp_nuclear_bomb_critical_mass_generic_reward_desc:0 "A critical accident occurred during experiments to determine critical mass, leading to radiation exposure and casualties among key personnel."
 sp_nuclear_bomb_desc:0 "Build the first complete Doomsphere. Rival artificers must solve the casing, trigger and containment problems together, using isolated proving grounds before trusting the device to a military expedition."
 sp_nuclear_bomb_design_choice_reward:0 "Simple or Complex Bomb Design"
 sp_nuclear_bomb_design_choice_reward_desc:0 "Our artificers have proposed two ways to unleash a Doomsphere’s power. A simple mechanism is easier to build but consumes more warpstone. A more complex implosion device promises greater efficiency at the cost of difficult manufacture."
 sp_nuclear_bomb_design_choice_reward_gun_type:0 "The gun is a safer bet."
 sp_nuclear_bomb_design_choice_reward_implosion:0 "Implosion is the superior design."
 sp_nuclear_bomb_espionage_threats_reward:0 "Espionage Threats"
 sp_nuclear_bomb_espionage_threats_reward_desc:0 "Security officers argue that there is a need to increase security at the site of [SpecialProject.GetName] project and all surrounding activities. The researchers, with [Character.GetName] in the lead, argue that freedom to move about and communicate is vital for the progress."
 sp_nuclear_bomb_espionage_threats_reward_increase_security:0 "Increase Security"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt:0 "Increased Security lowers the risk of information theft"
 sp_nuclear_bomb_espionage_threats_reward_no:0 "Don't increase security"
 sp_nuclear_bomb_information_leak_reward:0 "Information Leak"
 sp_nuclear_bomb_information_leak_reward_desc:0 "One of the workers at the [SpecialProject.GetName] has apparently been leaking information to foreign agents. Whether this was intentional or not is as of yet not known. It is likewise hard to determine the damage this has done to the project"
 sp_nuclear_bomb_information_leak_reward_tt:0 "Gains Project progress"
 sp_nuclear_bomb_speed_factor:0 "Doomsphere Project Research Speed"
 sp_nuclear_bomb_speed_factor_tt:0 "$sp_nuclear_bomb_speed_factor$: $RIGHT|+=%1$"
 sp_nuclear_bomb_test_prototype_reward:0 "Prototype Bomb"
 sp_nuclear_bomb_test_prototype_reward_desc:0 "A Prototype Bomb has been produced by [Character.GetName]'s team. Making, and evaluating, a successful test would improve our progress significantly. On the other hand, we have a Doomsphere now..."
 sp_nuclear_bomb_test_prototype_reward_keep_bomb:0 "We can put this to use against our enemies"
 sp_nuclear_bomb_test_prototype_reward_test_bomb:0 "Test it under controlled forms"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward:0 "Theoretical Breakthrough"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:0 "[Character.GetName] has managed to solve a complex theoretical problem during the work with the latest prototype. This has led to streamlining of the bomb design, which will make it less difficult to produce."
 sp_nuclear_bomb_tt:0 "Doomsphere Workshops start producing §YNuclear Bombs§!."
 sp_nuclear_design_choice_reward:0 "Reactor Design"
 sp_nuclear_design_choice_reward_desc:0 "When trying to design a reactor, we need to choose what material to use for the moderator. This will dictate the design of the entire reactor. We can use Heavy Water, or we can use Graphite, both of which have their pros and cons..."
 sp_nuclear_design_choice_reward_graphite:0 "Purified graphite is the better moderator"
 sp_nuclear_design_choice_reward_heavy_water:0 "Heavy water will be cheaper"
 sp_nuclear_engines:0 "Warpstone Engines"
 sp_nuclear_engines_desc:0 "Develop the doctrine, craftsmanship and arcane knowledge needed to strengthen our war hosts."
 sp_nuclear_engines_speed_factor:0 "Doomsphere Engines Research Speed"
 sp_nuclear_engines_speed_factor_tt:0 "$sp_nuclear_engines_speed_factor$: $RIGHT|+=%1$"
 sp_nuclear_generic_electronics_tech_reward:0 "Technological Innovation"
 sp_nuclear_generic_electronics_tech_reward_desc:0 "Significant learnings were made during the last iteration on the project. Hopefully, we will be able to put this to practical use, which should allow us to speed up research in related areas."
 sp_nuclear_generic_industry_tech_reward:0 "Technological Advancements"
 sp_nuclear_generic_industry_tech_reward_desc:0 "During the work on the project, our engineers have made several new inventions, that could very likely be adapted for use in other areas as well."
 sp_nuclear_generic_reward_option_electronics_tech_bonus_name:0 "Advanced Arcana Research."
 sp_nuclear_generic_reward_option_industry_tech_name:0 "Advanced Industrial Research"
 sp_nuclear_isotope_separation_choice_reward:0 "Isotope Separation Facilities"
 sp_nuclear_isotope_separation_choice_reward_centrifugal:0 "Centrifuges will be more efficient in the long-run."
 sp_nuclear_isotope_separation_choice_reward_desc:0 "Our artificers must separate potent warpstone from the impurities that make it unstable. Competing methods promise greater purity or faster production; the chosen process will shape the workshops we build."
 sp_nuclear_isotope_separation_choice_reward_gaseous:0 "Gaseous is a proven technique."
 sp_nuclear_major_breakthrough_reward:0 "Major Breakthrough in Doomsphere Reactions"
 sp_nuclear_major_breakthrough_reward_desc:0 "A controlled experiment with some of our limited Doomsphere material has demonstrated the feasibility of our intended design. This has propelled the project forward with renewed enthusiasm."
 sp_nuclear_major_political_interference_generic_reward:0 "Major Political Interference"
 sp_nuclear_major_political_interference_generic_reward_desc:0 "The [SpecialProject.GetName] project has come under increased scrutiny and interference from political leaders, causing delays and potentially forcing changes in project leadership. This has enraged [Character.GetName]. We need to deal with these political challenges to keep the project on track"
 sp_nuclear_major_political_interference_generic_reward_option_fire:0 "Remove [(Character?.GetName:'CAP_SCIENTIST)]"
 sp_nuclear_major_political_interference_generic_reward_option_keep:0 "Keep [(Character?.GetName:'CAP_SCIENTIST)]"
 sp_nuclear_minor_progress_generic_reward:0 "Minor Breakthrough"
 sp_nuclear_minor_progress_generic_reward_desc:0 "Our scientists made some really groundbreaking discoveries while working on the latest prototype. Their findings have advanced our knowledge and research into the field considerably."
 sp_nuclear_missile_submarine_eq_bonus_stealth:0 "Warpstone Missile Submersible - Stealth Focus"
 sp_nuclear_missile_submarine_eq_bonus_strength:0 "Warpstone Missile Submersible - Enhanced Durability"
 sp_nuclear_project_events.1.a:0 "This could prove useful"
 sp_nuclear_project_events.1.desc:0 "Although entirely coincidental, our agents in [FROM.GetNameDef] have managed to acquire information about an apparent secret project. A worker involved in development of a secret weapon, a Doomsphere, spoke about his work at a small social gathering where one of our agents were also attending."
 sp_nuclear_project_events.1.t:0 "Information Leak"
 sp_nuclear_reactor:0 "Doomsphere Workshops"
 sp_nuclear_reactor_desc:0 "A guarded complex where artificers refine warpstone and assemble Doomspheres. More workshops increase production of these terrible weapons."
 sp_nuclear_reactor_heavy_water:0 "Refined Doomsphere Workshops"
 sp_nuclear_reactor_heavy_water_desc:0 "A guarded complex where artificers refine warpstone and assemble Doomspheres. More workshops increase production of these terrible weapons."
 sp_nuclear_reactor_minor_explosion_reward:0 "Minor Explosion, No Injuries"
 sp_nuclear_reactor_minor_explosion_reward_desc:0 "While working on the latest iteration of the Doomsphere Workshop prototype, there was a small incident. A minor explosion occurred, damaging parts of the lab, but the fire that ensued could easily be put out. Once the lab is repaired, work should be able to continue as planned, with only a slight delay."
 sp_nuclear_reactor_radioactive_leak_stabilized_reward:0 "Radioactive Leak - Under Control"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:0 "Unfortunately there was a serious incident during the work with the reactor. Thanks to the rapid response by the staff, the damage has been contained and the team was able to get valuable data from the incident."
 sp_nuclear_reactor_speed_factor:0 "Doomsphere Workshop Research Speed"
 sp_nuclear_reactor_speed_factor_tt:0 "$sp_nuclear_reactor_speed_factor$: $RIGHT|+=%1$"
 sp_nuclear_reactor_tested_reward:0 "First Successful Doomsphere Workshop Test"
 sp_nuclear_reactor_tested_reward_desc:0 "Our first Doomsphere Workshop has been successfully tested, proving the feasibility of controlled Doomsphere fission. This breakthrough promises a new era of energy production, and potentially much more."
 sp_nuclear_reactor_tested_reward_public:0 "Celebrate the achievement publicly"
 sp_nuclear_reactor_tested_reward_public_tt:0 "Other countries might benefit from this"
 sp_nuclear_reactor_tested_tech_bonus:0 "Received Information on Warpstone Testing"
 sp_nuclear_scientist_xp_generic_reward:0 "New Learnings"
 sp_nuclear_scientist_xp_generic_reward_desc:0 "TODO_TA"
 sp_nuclear_submarine_eq_bonus_ic_reduction:0 "Warpstone Submersible - Cheaper Masonry and Carpentry"
 sp_nuclear_submarine_eq_bonus_quality:0 "Warpstone Submersible - Quality Focus"
 sp_nuclear_war_support_generic_reward:0 "Public Support"
 sp_nuclear_war_support_generic_reward_desc:0 "A successful test, and some related, tightly controlled, media coverage has led to the public understanding that we are getting closer to developing some kind of super weapon that can be used to defeat any and all enemies."
 sp_nuclear_warheads:0 "Warpstone Warheads"
 sp_nuclear_warheads_desc:0 "Develop the doctrine, craftsmanship and arcane knowledge needed to strengthen our war hosts."
 sp_nuclear_warheads_speed_factor:0 "Doomsphere Warheads Research Speed"
 sp_nuclear_warheads_speed_factor_tt:0 "$sp_nuclear_warheads_speed_factor$: $RIGHT|+=%1$"
