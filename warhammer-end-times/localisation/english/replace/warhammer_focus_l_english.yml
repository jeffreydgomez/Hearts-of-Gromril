l_english:
 wet_powers_beyond_mortality_tt:0 "Opens the §Y$nationalism_focus$§! and §Y$internationalism_focus$§! paths. Choosing one excludes the other."
 wet_choose_order_tt:0 "Change alignment to Order, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved."
 wet_choose_unaligned_tt:0 "Change alignment to Unaligned, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved."
 wet_choose_chaos_tt:0 "Change alignment to Chaos, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved."
 wet_choose_undead_tt:0 "Change alignment to Nagashi, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved. Gain Undead Nation: no military Food consumption and 90% less army and naval supply consumption. Joining Nagashi requires separate diplomatic agreement."
 wet_choose_waaagh_tt:0 "Change alignment to Waaagh, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved."
 wet_choose_horned_rat_tt:0 "Change alignment to Horned Rat, retaining the ruler and disabling elections. Update faction permissions; existing undead nature is preserved."
 political_effort:0 "A Realm at the Crossroads"
 political_effort_desc:0 "The old certainties are failing. Gather the court, priests and commanders to decide what our realm will become."
 collectivist_ethos:0 "Powers Beyond Mortality"
 collectivist_ethos_desc:0 "Seek strength beyond mortal limits. The Dark Gods offer dominion through Chaos; necromancy offers an empire that death cannot conquer."
 liberty_ethos:0 "The Fate of the Living"
 liberty_ethos_desc:0 "Choose an allegiance for the realm: Order, independence, the Waaagh or the Great Horned Rat."
 nationalism_focus:0 "Embrace Chaos"
 nationalism_focus_desc:0 "Offer the realm to the Ruinous Powers. This choice changes our alignment to Chaos while retaining our ruler. It closes the other alignment paths."
 internationalism_focus:0 "Swear to Nagash"
 internationalism_focus_desc:0 "Bind the realm to the Great Necromancer and everlasting rule. This choice changes our alignment to Nagashi, grants Undead Nation and closes the other alignment paths. Faction membership remains a separate diplomatic agreement."
 neutrality_focus:0 "Stand with Order"
 neutrality_focus_desc:0 "Commit the realm to the defence of civilization. This choice changes our alignment to Order while retaining our ruler. Order still requires 100% world tension to create or join a faction."
 interventionism_focus:0 "Keep Our Own Counsel"
 interventionism_focus_desc:0 "Preserve our sovereignty and pursue our own interests. This choice makes our alignment Unaligned while retaining our ruler and closes the other alignment paths."
 wet_waaagh_focus:0 "Answer the Waaagh"
 wet_waaagh_focus_desc:0 "Let strength and the call to battle unite the realm. This choice changes our alignment to Waaagh while preserving our ruler and ancestry."
 wet_horned_rat_focus:0 "Serve the Horned Rat"
 wet_horned_rat_focus_desc:0 "Swear the realm to the Great Horned Rat and his schemes. This choice changes our alignment to Horned Rat while retaining our ruler and ancestry."
 militarism:0 "Muster the Warbands"
 militarism_desc:0 "Give our champions command of disciplined warbands, ready to carry the will of the Dark Gods beyond our borders."
 military_youth:0 "Raise the Aspirants"
 military_youth_desc:0 "Train a new generation of ambitious warriors in the service of Chaos."
 paramilitarism:0 "Cults under Arms"
 paramilitarism_desc:0 "Bring scattered cults and sworn retinues into the war host."
 political_correctness:0 "The Eternal Court"
 political_correctness_desc:0 "Replace rival mortal councils with servants bound to an undying sovereign."
 indoctrination_focus:0 "The Books of Binding"
 indoctrination_focus_desc:0 "Teach the rites that bind the dead to their masters and the living to their duties."
 political_commissars:0 "Overseers of the Dead"
 political_commissars_desc:0 "Appoint necromantic overseers to impose a single will upon the deathless host."
 ideological_fanaticism:0 "Beyond Mortal Fear"
 ideological_fanaticism_desc:0 "Our warriors no longer measure victory by the cost in mortal lives. Nothing must stand before their purpose."
 deterrence:0 "Shield of the Realm"
 deterrence_desc:0 "Prepare our workshops and garrisons to resist the enemies of Order."
 volunteer_corps:0 "Merciless Retinues"
 volunteer_corps_desc:0 "Send trusted captains and ruthless followers abroad to strengthen our influence."
 foreign_expeditions:0 "Expeditions of Conquest"
 foreign_expeditions_desc:0 "Organize distant campaigns to acquire wealth and subject peoples."
 why_we_fight:0 "A Cause to Rally Behind"
 why_we_fight_desc:0 "Give every soldier a reason to endure the coming war. Alliances still obey our alignment rules and the limits on faction creation."
 technology_sharing:0 "Covenant of Lore"
 technology_sharing_desc:0 "Exchange methods of forging arms, breeding war beasts and harnessing arcane power with our wartime allies."
 nationalism:0 "Embrace Chaos"
 nationalism_desc:0 "Our realm is sworn to the Ruinous Powers, and their champions gather beneath its banners."
 internationalism:0 "Swear to Nagash"
 internationalism_desc:0 "Necromancy binds the realm to an everlasting sovereign. Death itself has become an instrument of rule."
 neutrality_idea:0 "Stand with Order"
 neutrality_idea_desc:0 "Our realm stands with the defenders of civilization against the coming darkness."
