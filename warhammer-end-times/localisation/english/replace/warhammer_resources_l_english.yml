 STAT_ARMY_FUEL_CAPACITY:0 "Food Capacity:"
 STAT_ARMY_FUEL_CAPACITY_DESC:0 "How much food this unit can store. Higher food capacity means that the unit will be able to operate at full capacity longer when it lacks the food supply."
