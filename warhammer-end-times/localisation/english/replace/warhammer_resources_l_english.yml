 STAT_COMMON_FUEL_CONSUMPTION_DESC:0 "How much food this unit uses while it is operating. Air and Sea units will consume food while on active missions or during training. Land units with food consumption will consume food in idle as well, but the combat, movement or training will further increase the consumption."
