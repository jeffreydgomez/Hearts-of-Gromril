 steel:0 "Metal"
 steel_desc:0 "Metal includes iron, copper and gromril for weapons, armour and machinery."
 steel_mines_damaged_modifier:0 "Metal Mines Damaged"
 strat_bomber_equipment_3_desc:0 "To avoid losses to enemy fighters and ground fire, our next design will fly at great altitude. It will be larger to carry both an enormous payload and more food, to increase range."
 support_ship_1_desc:0 "Support ships are non-combat vessels focused on logistical support of the battlefleet, extending operational endurance with reserve stocks of food and supplies."
 synth_oil_experiments:0 "Organized Husbandry"
 synth_oil_experiments_desc:0 "Organized farms and breeding enclosures allow husbandry complexes to provide food and monsters."
 synthetic_refinery:0 "Husbandry Complex"
 synthetic_refinery_plural:0 "Husbandry Complexes"
 tank_diesel_engine_desc:0 "An Engine running on Diesel food is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_gas_turbine_engine_desc:0 "A turbine developed from jet engines. High food consumption, but the highest speed of any engine at a given Engine Size."
 tank_gasoline_engine_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the food will be much more prone to catching fire."
