 advanced_equipment_conversion:0 "Advanced Warpstone Containment"
 advanced_equipment_conversion_desc:0 "Recover residual Warpstone from slag and stabilise the richest grades. Closed-cycle alchemical retorts and carefully warded refining halls waste less of this dangerous resource."
 advanced_oil_processing:0 "Advanced Food Preservation"
 advanced_oil_processing_desc:0 "Better mills, sealed stores and organised ration production preserve a larger share of each harvest for the army."
 advanced_rubber_processing:0 "Advanced Monster Husbandry"
 advanced_rubber_processing_desc:0 "Selective breeding and specialised training prepare creatures for the demands of the battlefield."
