 division_list_fuel_column_button_tooltip:0 "§GClick§! to sort divisions by §Hfood§!\n§GShift+Click§! to sort in reverse order"
 drop_tanks_desc:0 "Small, disposable tanks that hold extra food give our fighters some extra range when on offensive missions. Since they are dropped before combat, they don't impede combat performance."
 early_refining_desc:0 "Crude food can be refined into a number of substances and materials vital to any modern war. Staying ahead in these methods will be necessary to build a modern industry."
 energy_infrastructure:0 "Arcane Conduit Network"
 energy_infrastructure_desc:0 "Reinforced conduits reduce local factory power consumption. Their efficiency benefit scales with the state's infrastructure."
 energy_infrastructure_plural:0 "Arcane Conduit Networks"
 expanded_fuel_tank:0 "Food Drum"
 expanded_fuel_tank_desc:0 "An externally mounted food drum designed to extend the operational range of an armored vehicle."
 experimental_rockets_desc:0 "Advancing the science of rocketry by improving the range and reliability of liquid-food rockets will teach us enough about the technology to allow the construction of launch sites for more advanced models."
 fortify_strait_of_hormuz_goal_desc:0 "Fortifying the strategic bases on the Strait of Hormuz would better enable us to exert control over access to vital Persian and Iraqi food."
 fuel_refining:0 "Food Preservation"
 fuel_refining2:0 "Food Preservation II"
