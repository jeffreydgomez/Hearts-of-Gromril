 aluminium:0 "Wood"
 aluminium_desc:0 "Wood supplies timber and other forest materials for production and construction."
 amphibious_mechanized_equipment_1_desc:0 "War Barges I: Protected transport brings infantry through missile fire before they dismount to fight. The wagon is both shelter and a movable firing position. Armoured sides, firing slits and reinforced running gear trade speed for protection."
 amphibious_mechanized_equipment_desc:0 "War Barges: Protected transport brings infantry through missile fire before they dismount to fight. The wagon is both shelter and a movable firing position. Armoured sides, firing slits and reinforced running gear trade speed for protection."
 amphibious_mechanized_infantry_desc:0 "War Barges I: Protected transport brings infantry through missile fire before they dismount to fight. The wagon is both shelter and a movable firing position. Armoured sides, firing slits and reinforced running gear trade speed for protection. Research unlocks War Barges I."
 amphibious_tank_equipment_2_desc:0 "Amphibious Monsters II: Rivers should be avenues of approach, not barriers. Water-adapted beasts carry their fighting strength through mud, shallows and broken banks. Waterproof harnesses and crews trained to mount and dismount afloat support contested crossings."
 amphibious_tank_equipment_desc:0 "Tanks that were modified to allow them to move through water. They do much better in amphibious landings and river crossings than other tanks, but require more food."
