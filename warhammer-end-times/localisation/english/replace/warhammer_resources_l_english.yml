 fuel_tanks_small:0 "Extra Food Tanks"
 fuel_tanks_small_desc:0 "Devoting more internal space of the airframe for food increases the plane's range, but it also makes the plane a lot more flammable."
 gw_armored_car_equipment_desc:0 "Where previous armored cars were simple commercial models with thin metal plating, this model was designed from the ground up to carry armor and light armament."
 heavy_ship_nuclear_engine_1_desc:0 "A powerful nuclear reactor, capable of powering the heaviest of ships without need for resupplying."
 hq_logistics_desc:0 "Prioritizes and allocates the distribution of supplies and food within the army."
 improved_equipment_conversion:0 "Warpstone Refinement"
