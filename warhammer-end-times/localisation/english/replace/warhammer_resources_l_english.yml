 ship_hull_cruiser_submarine_desc:0 "Warpstone Submersibles: A submerged attacker trades the safety of open air for surprise. Every seal and pressure joint must withstand a hostile sea. Metal pressure hulls and tightly contained Warpstone engines sustain covert patrols."
 ship_seaplane_tender_1_desc:0 "Handlers select agile mounts and train riders to attack from height, break away and recover."
