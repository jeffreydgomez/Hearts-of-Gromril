 land_cruiser_chassis_desc:0 "A gargantuan chassis, heavily-armored and designed to support super-heavy weaponry and withstand immense battlefield punishment, but with high food consumption and slow speed due to its enormous size."
 large_plane_airframe_0_desc:0 "This very large airframe has plenty of space to carry bombs or food tanks. However, it is clear that its development potential is severely limited. New generations of strategic bombers are already on the horizon."
 lc_internal_fuel_tanks:0 "Internal Food Tanks"
