 plane_armor_upgrade_desc:0 "Protective barding and reinforced supply panniers help flying mounts and their riders survive enemy fire."
 raid_target_name_oil_field:0 "£resources_strip|1 §HFood Field§! in $LOCATION|H$"
 raid_type_CHI_huansheng_raid_desc:0 "Our intelligence states that though valuable targets, the Yawata metal works and the Sasebo Naval Arsenal are too difficult for our airforce to properly strike at this moment. It has therefore been decided that the most effective way to stop this war would be to raise the conscience of the Japanese people against the atrocities committed by the imperialist Japanese warmongers in China, by dropping leaflets over cities such as Nagasaki, Fukuoka, Saga and Osaka."
 raid_type_oilfield_raid:0 "Food Field Raid"
 raid_type_oilfield_raid_desc:0 "Strike the enemy’s food-producing lands and provision works to disrupt the supply of its armies."
 range_improvements_desc:0 "Range Improvements: Aerial hunters seize the sky before enemy flyers can reach the host. Speed, awareness and formation training matter as much as claws. Handlers select agile mounts and train riders to attack from height, break away and recover."
 refinery_damaged_modifier:0 "Food Husbandry Complexes Damaged"
 rocket_engine_1_desc:0 "Sealed propellant chambers, reinforced racks and disciplined firing procedures harness unstable power."
 rocket_engine_2_desc:0 "Sealed propellant chambers, reinforced racks and disciplined firing procedures harness unstable power."
 rocket_interceptor_2_desc:0 "Improved launch cradles and steadier guidance allow rocket interceptors to strike quickly and return before their propellant is exhausted."
 rocket_interceptor_3_desc:0 "Safer propellant chambers and improved landing equipment make rocket interceptors more reliable during repeated sorties."
 rocket_interceptor_desc:0 "Rocket Interceptor serve in formations equipped for their battlefield role."
 rubber:0 "Monsters"
 rubber_desc:0 "Monsters represent access to creatures and breeding grounds for military production."
 rubber_processing:0 "Monster Husbandry"
 rubber_processing_desc:0 "Monster Husbandry: Military beasts must be bred and raised before they can be sent to war. A steady supply is safer than desperate hunts for replacements. Controlled breeding yards and experienced keepers produce creatures suited to military harness."
