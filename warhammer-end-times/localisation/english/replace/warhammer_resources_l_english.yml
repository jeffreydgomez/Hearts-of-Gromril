 ITA_destroyer_1_desc:0 "Curtatone-class destroyers were the first destroyers to be built in Italy after the end of World War I and were the first destroyers to use twin gun mountings. The ships were originally ordered at the same time as the Palestro class destroyers, but were postponed due to metal shortages. They displaced just under 1,000 tons and mount four 102mm Schneider-Armstrong guns."
