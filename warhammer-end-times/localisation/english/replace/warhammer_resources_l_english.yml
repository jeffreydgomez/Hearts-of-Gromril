 modifier_production_speed_synthetic_refinery_factor:0 "§YHusbandry Complex§! construction speed"
 naval_supply_hub_desc:0 "This building allows your fleets to resupply and resupply in this base in addition to their Home Bases, potentially extending the operational range of your §YTask Forces§!.\nA Naval Supply Hub can only be constructed in a coastal province that has Naval Base of at least level 8."
 non_strategic_materials_small_desc:0 "By substituting specially-treated wood or fabric for wood wherever possible, we can drastically reduce the usage of strategic materials. However, wood and fabric don't stand up very well to modern weapons."
 oil:0 "Food"
 oil_desc:0 "Food production replenishes stored food reserves and can be traded to other countries."
 oil_extraction_company_trait:0 "Food Extraction Company"
 oil_processing:0 "Food Processing"
 oil_processing_desc:0 "Better harvesting, processing and storage methods increase the food supplied by husbandry complexes."
 pact_of_steel_opinion:0 "Pact of Metal"
 plane_armor_upgrade_desc:0 "Self-sealing food tanks and armor plates improve survivability."
 raid_target_name_oil_field:0 "£resources_strip|1 §HFood Field§! in $LOCATION|H$"
 raid_type_CHI_huansheng_raid_desc:0 "Our intelligence states that though valuable targets, the Yawata metal works and the Sasebo Naval Arsenal are too difficult for our airforce to properly strike at this moment. It has therefore been decided that the most effective way to stop this war would be to raise the conscience of the Japanese people against the atrocities committed by the imperialist Japanese warmongers in China, by dropping leaflets over cities such as Nagasaki, Fukuoka, Saga and Osaka."
 raid_type_oilfield_raid:0 "Food Field Raid"
 raid_type_oilfield_raid_desc:0 "An Airstrike aimed at knocking a major food field and its connected Husbandry Complexes out, in order to seriously disrupt enemy food production for an extended period of time."
 range_improvements_desc:0 "While it seems obvious that adding more food capacity will increase the range of an airplane, actually adding that capacity to a plane without impacting flight performance too much is far from trivial."
 refinery_damaged_modifier:0 "Food Husbandry Complexes Damaged"
 rocket_engine_1_desc:0 "Utilizing a number of very volatile food supplies and a similarly unstable oxidizer, this engine is capable of putting out a very large amount of thrust to propel a plane to high speeds, at the cost of range."
 rocket_engine_2_desc:0 "Improvements in the combustion chamber and slight alterations in the food mixture allow even higher performance, with a corresponding drop in range."
 rocket_interceptor_2_desc:0 "Still considered extremely dangerous to operate, the rocket-powered fighters are now aided by auto-pilots and towing by other aircraft to maximize the use of their extreme speed but short food window."
 rocket_interceptor_3_desc:0 "New landing techniques and safer food systems have improved rocket fighters' chance of success and survival significantly, fulfilling the once theoretical potential of these cutting-edge vehicles."
 rocket_interceptor_desc:0 "Rocket-powered interceptor aircraft based on gliders can, for short periods of time, move faster than any other plane. While volatility of the food puts the planes at risk, they can take off and react to attacks faster than any enemy will expect."
 rubber:0 "Monsters"
 rubber_desc:0 "Monsters represent access to creatures and breeding grounds for military production."
 rubber_processing:0 "Monster Husbandry"
 rubber_processing_desc:0 "Improved breeding enclosures and handling methods increase the monsters supplied by husbandry complexes."
 sabotage_aluminium:0 "Sabotage Wood Resources"
 sabotage_chromium:0 "Sabotage Warpstone Resources"
 sabotage_coal:0 "Sabotage Mount Breeding Grounds"
 sabotage_fuel_silo:0 "Sabotage Granary"
 sabotage_oil:0 "Sabotage Food Resources"
 sabotage_rubber:0 "Sabotage Monsters Resources"
 sabotage_steel:0 "Sabotage Metal Resources"
 sabotage_synthetic_refinery:0 "Sabotage Husbandry Complex"
 sabotage_tungsten:0 "Sabotage Luxuries Resources"
 secure_the_oil_supply_goal_desc:0 "If we are to fight a long war we need to secure enough food to sustain it by any means necessary."
 secure_the_oil_supply_goal_name:0 "Secure the Food Supply"
 secure_the_oil_supply_tech_bonus:0 "Secure the Food Supply Goal Bonus"
 self_sealing_fuel_tanks_small:0 "Self-Sealing Food Tanks"
 self_sealing_fuel_tanks_small_desc:0 "By adding a layer of specially-treated monsters around the food tanks, a hit to the food tank does not cripple an airplane as the tank will seal itself over time, preventing loss of food."
 ship_anechoic_tile_desc:0 "Monsters tile coating that is designed to reduce the range at which ship can be detected by both passive and active sonar."
 ship_armor_ice_carrier_deck_2:0 "Metal-Reinforced Pykrete Runway"
 ship_armor_ice_carrier_deck_2_desc:0 "Metal-Reinforced Pykrete provides sturdier construction, capable of withstanding more damage, while offering better insulation."
 ship_engine_sub_aip_1_desc:0 "First iteration of the new engine types, allowing submarine to remain operational underwater for a longer time, at the cost of vastly increased food consumption and reduced ship range."
 ship_engine_sub_aip_2_desc:0 "New version of the air-independent propulsion systems, offering better performance at the lower food consumption."
 ship_engine_sub_aip_3_desc:0 "We have reached the pinnacle of what we think can be achieved with AIP Engines. This engine offers excellent speed, while at the same time retaining food consumption at acceptable levels."
 ship_extra_fuel_tank:0 "Extra Food Tanks"
 ship_extra_fuel_tank_desc:0 "Extended food storage allows greater operational range."
 ship_hull_cruiser_submarine_desc:0 "A larger submarine hull optimized for longer range. Can be equipped with additional food tanks for even more range, or a small scout airplane."
 ship_seaplane_tender_1_desc:0 "Equipment for resupplying and recovering seaplanes, keeping them operational with less reliance on shore-based resupply."
 sp_air_intercontinental_bomber_desc:0 "A huge aircraft loaded with bombs and food, designed specifically for long-distance high-altitude flying granting it the ability to cross oceans and continents."
 sp_land_generic_reward_engine_bonus_1:0 "Food Efficiency Engines"
 sp_multi_product_supply_ships_desc:0 "With the use of the newly produced supply ships, we can ensure smoother transfer of the food, ammunition and supplies."
 sp_naval_aip_engine_preference_c:0 "Less Food-Consuming Engines"
 sp_naval_anechoic_tiles_desc:0 "This special monsters tiled coating for submarines, which contains small empty spaces between them; reduce the threats of detection by enemy sonars."
 sp_nuclear_engines_desc:0 "Engines that can run forever - without needing to resupply. This is the promise of atomic energy. A promise our engineers say that we are very close to fulfilling."
 sp_nuclear_isotope_separation_choice_reward_desc:0 "In order to supply our reactors with nuclear food, we need to decide on a process for separating the useful isotopes of uranium from the rest. There are a number of proposals for separation facilities but the two frontrunners are gaseous and centrifugal."
 sp_nuclear_reactor_desc:0 "Experiments have proven that splitting atoms through fission releases vast amounts of energy, which could be used for power generation. Or perhaps as food for bombs..."
 sp_rocket_glass_wool_choice_reward_desc:0 "During the re-entry phase of the rocket's flight, ice seems to be forming around the food tanks and interfering with the rocket's internals. Although a setback, our engineers have suggested adding glass wool around the tanks to prevent this from happening in future."
