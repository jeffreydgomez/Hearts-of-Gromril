 sp_nuclear_reactor_desc:0 "A guarded complex where artificers refine warpstone and assemble Doomspheres. More workshops increase production of these terrible weapons."
 sp_rocket_glass_wool_choice_reward_desc:0 "Extreme cold is disrupting the rocket’s propellant chambers. Our engineers propose wrapping the chambers in glass wool to insulate them during flight."
