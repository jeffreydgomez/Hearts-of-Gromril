 SOV_light_cruiser_4_desc:0 "The Sverdlov class cruisers (Project 68bis) were the last gun cruisers of the Soviet Navy and were improved versions of the preceding Chapayev class. Compared to the Chapayevs, they had the same main armament, machinery and armor protection, but had increased food capacity for greater range, improved underwater protection, an increased anti-aircraft battery, and slightly better seaworthiness. They were designed for the roles of convoy hunting and capital ship escorts. Due to the advent of the missile age, many ships were cancelled or not finished."
 STAT_ARMY_FUEL_CAPACITY:0 "Food Capacity: "
 STAT_ARMY_FUEL_CAPACITY_DESC:0 "How much food this unit can store. Higher food capacity means that the unit will be able to operate at full capacity longer when it lacks the food supply."
 STAT_ARMY_FUEL_CONSUMPTION:0 "Food Use: "
 STAT_ARMY_FUEL_CONSUMPTION_DESC:0 "How much food this unit uses daily."
 STAT_COMMON_FUEL_CONSUMPTION:0 "Food Usage: "
 STAT_COMMON_FUEL_CONSUMPTION_DESC:0 "How much food this unit uses while it is operating. Air and Sea units will consume food while on active missions or during training. Land units with food consumption will consume food in idle as well, but the combat, movement or training will further increase the consumption."
 STAT_COMMON_FUEL_CONSUMPTION_FACTOR:0 "Food Usage: "
 STAT_COMMON_FUEL_CONSUMPTION_FACTOR_DESC:0 "How much food this unit uses while it is operating. Air and Sea units will consume food while on active missions or during training. Land units with food consumption will consume food in idle as well, but the combat, movement or training will further increase the consumption."
 STAT_NAVY_RANGE_DESC:0 "A ship's range represents its onboard stores of food and foodstuffs, which limit how far it can travel from the nearest friendly Naval Base."
 TASK_FORCE_HAS_FUEL_INEFFICIENT_SHIP_FOR_MISSION:0 "£mapicon_unit_invalid_orders  The following ship classes are not food efficient for the mission $MISSION|H$"
 TASK_FORCE_UNDERWAY_REPLENISHMENT_DESC:0 "When the §HUnderway Replenishment§! for a task force is enabled, it won't need to go to port to get resupplied. Convoys will come to the task force while underway to refill their tanks.\nWhen enabled, the range of the task force is increased by $FACTOR_BONUS|%+=0$ at the cost of a number of convoys proportional to the daily maximum food consumption."
 TOPBAR_COAL_CURRENTLY_USED:0 "From §Y$COUNT$§! £resources_strip|6 Warpstone currently used"
 TOPBAR_TOTAL_COAL:0 "From §Y$COUNT$§! £resources_strip|6 Warpstone available for use"
 TRADE_AUTO_IMPORT_DESC:0 "When enabled, §Hcivilian factories§! are automatically spent to import the strategic resources you have a shortage of. Automatic Importing will start and end trades so that resources never fall into deficit. §HFood§! is imported to cover the §Hfood§! our forces consume beyond what we produce. If §HPrioritize food when food is low§! is checked and the food stockpile drops below 50%, food is imported first and any factories left in the budget also import food to refill it until it is full.\n\nAutomatic imports will prefer partners that can deliver everything we need, then §Hfaction members§!, then countries that can deliver the most, then routes that need no §Hconvoys§!. An import whose partner can no longer deliver what we pay for is shrunk or replaced when a better partner can make up the difference.\n\n§gYou are unable to manually manage imports when Automatic Importing is activated.§!"
 TRADE_AUTO_IMPORT_PRIORITIZE_FUEL:0 "Prioritize food when food is low"
 TRADE_AUTO_IMPORT_PRIORITIZE_FUEL_DESC:0 "When the §Hfood§! stockpile runs low, §Hfood§! is imported before every other resource, and any factories left in the budget import extra food until the stockpile is full.\n\nWhen unchecked, food keeps its place in the list like any other resource."
 TRADE_AUTO_IMPORT_PRIORITY_RESET_TOOLTIP:0 "Restore the default resource order, §HAccepted shortages§! and food priority."
