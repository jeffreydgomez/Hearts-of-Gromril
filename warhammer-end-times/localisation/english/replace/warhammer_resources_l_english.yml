 aluminium:0 "Wood"
 aluminium_desc:0 "Wood supplies timber and other forest materials for production and construction."
 amphibious_mechanized_equipment_1_desc:0 "Amphibious Tractors, or Amtracs, allow Marines to be landed on a beach under armored protection. However, this comes at the cost of poor food efficiency."
 amphibious_mechanized_equipment_desc:0 "Amphibious Tractors, or Amtracs, allow Marines to be landed on a beach under armored protection. However, this comes at the cost of poor food efficiency."
 amphibious_mechanized_infantry_desc:0 "Amphibious Tractors, or Amtracs, allow Marines to be landed on a beach under armored protection. However, this comes at the cost of poor food efficiency."
 amphibious_tank_equipment_2_desc:0 "A medium tank modified to move through water. The added versatility and mobility comes at the cost of reduced food efficiency."
 amphibious_tank_equipment_desc:0 "Tanks that were modified to allow them to move through water. They do much better in amphibious landings and river crossings than other tanks, but require more food."
 armor_plate_large_desc:0 "Extensive metal plating protects the engines, food tanks, and the crew compartment to allow the plane to shrug off anything but a direct hit from anti-aircraft fire, as well as making it a very tough target for fighters to shoot down."
 armor_plate_small_desc:0 "Metal plating behind the pilot seat and around the engine give the plane increased survivability against ground fire and attacks from behind."
 big_ship_deck_space_desc:0 "Open area that allows to service, resupply and resupply airplanes and prepare them for their missions. Allows to store and use non-carrier plane variants."
 carrier_ship_nuclear_engine_1_desc:0 "A powerful nuclear reactor, capable of powering colossal carriers without need them needing to resupply."
 cat_synth_oil:0 "Synthetic Food"
 cat_synth_rubber:0 "Synthetic Monsters"
 chromium:0 "Warpstone"
 chromium_desc:0 "Warpstone powers industry and supplies arcane machinery. Available domestic deposits and imports generate industrial power, allowing civilian factories, military factories and dockyards to reach their powered output."
 coal:0 "Horses"
 coal_desc:0 "Horses represent horses and other military mounts raised on pasture and in breeding grounds. Available for trade and future mounted-unit equipment recipes."
 control_baku_oil_fields_goal_desc:0 "Securing the Baku food region would give access to extensive petroleum reserves vital to military operations."
 control_baku_oil_fields_goal_name:0 "Control Baku Food Fields"
 control_curacao_oil_goal_desc:0 "Curaçao’s husbandry complexes are integral to the processing of Venezuelan food. Control over them would provide the alliance with reliable access to refined petroleum products."
 control_curacao_oil_goal_name:0 "Control Curaçao Food"
 control_guyanan_bauxite_goal_desc:0 "Command over Guyana’s bauxite deposits would expand the alliance’s wood output, essential for aircraft manufacturing."
 control_indonesian_riches_goal_desc:0 "Indonesia’s diverse natural wealth, including food, monsters, and minerals, are invaluable to support our industrial base and ensure the alliance's resource independence."
 control_iraqi_oil_goal_desc:0 "Iraq’s food production capacity could be instrumental in satisfying our military's food needs."
 control_iraqi_oil_goal_name:0 "Control Iraqi Food"
 control_lappland_metals_goal_desc:0 "Access to Lappland’s mineral wealth would strengthen the alliance’s supply of iron and luxuries, sustaining our arms manufacturing industry."
 control_malayan_riches_goal_desc:0 "Control of Malaya’s luxuries and monsters resources would greatly bolster the alliance’s material base, ensuring key inputs for manufacturing and military logistics."
 control_mexican_oil_goal_desc:0 "Securing Mexican food reserves would ensure sufficient food supplies for industrial and military demands."
 control_mexican_oil_goal_name:0 "Control Mexican Food"
 control_persian_oil_goal_desc:0 "Control over Persia’s food fields and refining capacity would ensure a continuous flow of food for operational needs."
 control_persian_oil_goal_name:0 "Control Persian Food"
 control_ploiesti_oil_fields_goal_desc:0 "As the only food-fields in Europe, control of the Ploiesti food fields are invaluable in ensuring the alliance has the food required for continued military operations."
 control_ploiesti_oil_fields_goal_name:0 "Control Ploiesti Food Fields"
 control_strait_of_hormuz_goal_desc:0 "The strategic bases on the Strait of Hormuz would make it possible to exert control over access to vital Persian and Iraqi food."
 control_trinidad_goal_desc:0 "Trinidad's key location makes it imperative for the control of Caribbean food supplies and lets it serve as a strategic jumping-off-point on South America’s northern coast."
 control_venezuelan_oil_goal_name:0 "Control Venezuelan Food"
