l_english:
 WET_LOADING_QUOTE_0:0 "Settra does not serve. Settra rules!\n— Settra the Imperishable"
 WET_LOADING_QUOTE_1:0 "THE UNDERWORLD IS MINE. NEHEKHARA IS MINE.\n— Nagash"
 WET_LOADING_QUOTE_2:0 "Skaven society is a tyranny moderated by assassination.\n— Bagrian"
 WET_LOADING_QUOTE_3:0 "I'm gonna stomp 'em to dust. I'm gonna grind their bones.\n— Grimgor Ironhide"
 WET_LOADING_QUOTE_4:0 "What is a knight without his steed? But what is a steed without the knight?\n— Louen Leoncoeur"
 WET_LOADING_QUOTE_5:0 "Give them hope in these dark times. Do not betray their faith.\n— Karl Franz"
 WET_LOADING_QUOTE_6:0 "Fear me mortals, for I am the Anointed, the favoured Son of Chaos, the Scourge of the World.\n— Archaon"
 WET_LOADING_QUOTE_7:0 "The planets are aligned. The Time of Destruction approaches. Retrieve that which was taken.\n— Mazdamundi"
 WET_LOADING_QUOTE_8:0 "That which is wrong with the world, that we cannot fix with the blades of our axes, we shall surely avenge.\n— Thorgrim Ulleksson"
 WET_LOADING_QUOTE_9:0 "We are the chosen of Asuryan, beloved of the gods and heirs to the world.\n— Aenarion the Defender"
 WET_LOADING_QUOTE_10:0 "Burn! Burn with the fires of Change! Scream your hymns to Tzeentch!\n— Tal'gatha the Fallen"
 WET_LOADING_QUOTE_11:0 "Run. You cannot hide from doom.\n— Skulltaker"
 WET_LOADING_QUOTE_12:0 "Not that I have anything against senseless violence, manling, but why exactly are you strangling that old man?\n— Gotrek Gurnisson"
 WET_LOADING_QUOTE_13:0 "Surrender and serve me in life, or die and slave for me in death.\n— Vlad von Carstein"
 WET_LOADING_QUOTE_14:0 "The strength of Kislev lies in you all.\n— Tzarina Katarin"
 WET_LOADING_QUOTE_15:0 "The bear and I are one. The bear and Kislev are one.\n— Boris Ursus"
 WET_LOADING_QUOTE_16:0 "If a foe takes a single step upon such sacred soil, they shall not take another.\n— Skarloc, Mist Walker of Athel Loren"
 WET_LOADING_QUOTE_17:0 "Accept your medals, but know this... the true heroes lie still in the marshes of that accursed place.\n— Martin von Krystallbach"
 WET_LOADING_QUOTE_18:0 "Walls can't dodge!\n— Uwe Diamondscar"
 WET_LOADING_QUOTE_19:0 "Kill-Kill!\n— Queek Head-Taker"
