 improved_railway_company:0 "Efficient Roadworks Guild"
 infrastructure_destruction_desc:0 "Training our pilots in the best ways to attack infrastructure, like major roads and bridges, makes for more effective Tactical bombing."
 lc_hull_mounted_railway_gun:0 "Hull-Mounted Siege Cannon"
 lc_hull_mounted_railway_gun_desc:0 "Hull-Mounted Siege Cannon is a fitted component rather than a complete formation. Braced timber frames, measured charges and repeatable ranging drills improve sustained fire. It could take the form of Empire mortars, Dwarf grudge throwers or Goblin rock lobbers."
 lc_super_heavy_railway_gun:0 "Super-Heavy Siege Cannon"
 lc_super_heavy_railway_gun_desc:0 "Super-Heavy Siege Cannon is a fitted component rather than a complete formation. Braced timber frames, measured charges and repeatable ranging drills improve sustained fire. It could take the form of Empire mortars, Dwarf grudge throwers or Goblin rock lobbers."
 modifier_production_speed_rail_way_factor:0 "§YMajor Road§! construction speed"
