 SUPPLY_FLOW_DELAYED_DESC:0 "§HSupply Remaining§! indicates how much supply is provided to this province, and is made up of state supply and hubs within range. Hub range is affected by weather, ground conditions, infrastructure, major road level, and motorization. \n\n§HDivisions§! will consume provincial supply based on their supply weight. If their §HStored Supply§! is above the supply ratio provided in their location, they will consume from their internal store until stored supply is at the same level as the local supply.\n\nHold §GCtrl§! to show flow sources."
 SUPPLY_FLOW_SHOW_RANGE:0 "§HSupply Hubs§! distribute supply to nearby provinces. Their range and efficiency is dependent on weather, ground conditions, infrastructure, major road level, and motorization.\n\nTo increase the range and supply provided by a §HSupply Hub§!, consider using the §HUpgrade Major Roads§! command, changing the §HMotorization Level§! or upgrade the §HInfrastructure Level§!.\n\nHold §GShift§! to show range.\n§GShift-Click§! to toggle motorization\n§GCtrl-Click§! to toggle allied supply"
 SUPPLY_NODE_BUILD_RAIL:0 "§HBuild Major Roads§!\nBuild Major Road from this Supply Hub.\n§GHold Shift§! while clicking on this button to automatically use the optimal path."
 SUPPLY_NODE_PRIORITY:0 "§HCaravan Priority§!\nSet Supply Hub priority for allocating Supply Caravans\n§GClick§! to cycle through priorities"
 SUPPLY_NODE_UPGRADE_TO_CAPITAL:0 "§HUpgrade Bottlenecks§!\nQueue upgrades to Major Road and Port bottlenecks on the path from Capital Hub. This will increase the available potential supply in all provinces affected by this node."
