 railway_gun_equipment_desc:0 "Grand Siege Cannon: Siege crews bring concentrated destruction to a chosen point. A well-served battery can silence a strongpoint before infantry reaches the walls. Braced timber frames, measured charges and repeatable ranging drills improve sustained fire. Examples include Empire mortars, Dwarf grudge throwers or Goblin rock lobbers."
