 supply_node_desc:0 "A Supply Hub gathers provisions from major roads and ports, then distributes them to nearby armies."
 train_equipment:0 "Supply Caravans"
 train_equipment_1:0 "Supply Caravans I"
 train_equipment_1_desc:0 "Supply Caravans I: Merchant wagons and pack animals requisitioned to carry military provisions over major roads. They carry supplies efficiently but remain vulnerable to enemy attacks."
 train_equipment_2:0 "Supply Caravans II"
 train_equipment_2_desc:0 "Supply Caravans II: Standardized carts and simple harnesses allow cheaper wartime production. These caravans are easier to replace but remain vulnerable to enemy attacks."
 train_equipment_3:0 "Supply Caravans III"
 train_equipment_3_desc:0 "Supply Caravans III: Reinforced wagons and armed escorts protect provisions against attacks. They carry the same cargo as other caravans but cost more to equip."
 train_equipment_desc:0 "Wagons, pack animals and their crews carry provisions from the supply capital to hubs connected by major roads."
