 modifier_repair_speed_rail_way_factor:0 "Major Road Repair Speed"
 raid_type_GER_eben_emael_raid_desc:0 "A storm detachment of paratroopers and glider troops will attack the strategically placed fortress from above, as well as capturing key bridges, roads, and major roads in the area to pave the way for the main attacking force."
 raid_type_INS_militia_increase_activity_raid_desc:0 "We will send Militias to the state, where they will make contact with local revolutionaries and establish guerilla cells. If the operation goes smoothly, we will attempt to infiltrate the region and seize control from the Dutch.\n\n§WThe target state must be in range of a Republican-owned §YBunker§!, §YMajor Road§!, or §YNaval Base§!. These buildings can be used as starting points.§!\n\n§YEffects:§!\n§RAssigned division is expended§!\n§YSuccess:§!\n       §WBecomes owner and controller of the state\n       Increases escalation by §R1§!§!.\n§YLimited Success:§!\n       §W Adds §Yone tier§! of militia activity, increasing success chance for future attempts.§!\n§YFailure:§!\n       §WNo effects§!."
 rail_way:0 "Major Roads"
 rail_way_desc:0 "Major roads link supply hubs to the capital, carrying provisions, weapons and reinforcements by wagon and pack animal. Upgrading a road increases the supply it can carry."
 rail_way_plural:0 "Major Roads"
 railroad_enthusiast:0 "Road Network Advocate"
 railway_company:0 "Roadworks Guild"
 railway_gun_desc:0 "$railway_gun_equipment_1$: Siege crews bring concentrated destruction to a chosen point. A well-served battery can silence a strongpoint before infantry reaches the walls. Braced timber frames, measured charges and repeatable ranging drills improve sustained fire. Examples include Empire mortars, Dwarf grudge throwers or Goblin rock lobbers. Research unlocks Grand Siege Cannon I."
 railway_gun_equipment:0 "Grand Siege Cannon"
