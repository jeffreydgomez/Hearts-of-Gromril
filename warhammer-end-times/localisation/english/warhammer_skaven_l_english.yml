 wet_skaven.173.t:0 "Sabotage a World-ending Project — Failure"
 wet_skaven.174.0:0 "Find another opportunity."
 wet_skaven.174.d:0 "The trail to the enemy’s great project has gone cold. With their chance slipping away, the agents have withdrawn from the guarded works before the enemy could close upon them."
 wet_skaven.174.t:0 "Sabotage a World-ending Project — Aborted"
 wet_skaven.175.0:0 "Trust our existing precautions."
 wet_skaven.175.1:0 "Fund the counterintelligence search."
 wet_skaven.175.1_effect:0 "Agents have found signs of preparations against our current government or a strategic site. Funding a thirty-day security effort can reduce the chance of success, but it must finish before the attackers act."
 wet_skaven.175.d:0 "Tracks vanish into drains and witnesses disagree about what they saw. Someone has been moving beneath the ordinary life of our realm, leaving enough evidence to make complacency dangerous."
 wet_skaven.175.t:0 "Signs of a Skaven Operation"
 wet_skaven.176.0:0 "Fit the ranged wargear."
 wet_skaven.176.0_effect:0 "The breeders can prepare only one standard package for the first warpacks. The choice must be carried through the prototype trials before production begins."
 wet_skaven.176.0_outcome:0 "Stormfiend prototypes use ranged weapons."
 wet_skaven.176.1:0 "Prepare the grinder packs."
 wet_skaven.176.1_effect:0 "The breeders can prepare only one standard package for the first warpacks. The choice must be carried through the prototype trials before production begins."
 wet_skaven.176.1_outcome:0 "Stormfiend prototypes use close-assault weapons."
 wet_skaven.176.d:0 "The engineers have dragged their latest weapons into the pens, where Moulder’s creations strain against their chains. If the fittings hold, the beasts may carry a terrifying new arsenal into battle."
 wet_skaven.176.t:0 "Weapons for the Stormfiends"
 wet_skaven.177.0:0 "Let the rivals exhaust each other."
 wet_skaven.177.0_effect:0 "Ikit’s calculations have appeared in another workshop. The Council can buy back the disputed work or let the engineers settle the account in their own destructive fashion."
 wet_skaven.177.1:0 "Purchase the disputed calculations."
 wet_skaven.177.1_effect:0 "Ikit’s calculations have appeared in another workshop. The Council can buy back the disputed work or let the engineers settle the account in their own destructive fashion."
 wet_skaven.177.d:0 "The stolen papers have reached the workshops, stained and incomplete but still legible. Skryre’s engineers are already arguing over which of them deserves credit for understanding them first."
 wet_skaven.177.t:0 "The Stolen Calculations"
 wet_skaven.178.0:0 "Proceed without another grant."
 wet_skaven.178.0_effect:0 "The final calculations show just how much a failed prototype could destroy. A funded safety programme will reduce the next loss.\nThe impatient engineers demand permission to proceed regardless."
 wet_skaven.178.1:0 "Fund the safeguards."
 wet_skaven.178.d:0 "The chamber shakes as rival engineers explain what their device can do. Each promises a greater blast than the last, while the Council begins to wonder where the demonstration will take place."
 wet_skaven.178.t:0 "The Argument over the Blast"
 wet_skaven.179.0:0 "Keep the commission vacant."
 wet_skaven.179.0_effect:0 "A lost director cannot be restored by decree. The Council must choose one of its surviving engineers or technical delegates, preserving the research already earned."
 wet_skaven.179.1:0 "Appoint Ikit."
 wet_skaven.179.2:0 "Appoint Zingetail."
 wet_skaven.179.3:0 "Appoint SeerEngineer."
 wet_skaven.179.d:0 "The engine has acquired a new master. Assistants hurry to replace the seals upon its plans before the previous director’s rivals decide that the change was not thorough enough."
 wet_skaven.179.t:0 "A New Director for the Engine"
 wet_skaven.180.0:0 "Refuse their price."
 wet_skaven.180.1:0 "Pay for the covenant."
 wet_skaven.180.1_effect:0 "The servants of the Horned Rat offer recognition to the Council’s apocalyptic design. Their favour demands tribute and will sharpen the jealousy of every mortal councillor."
 wet_skaven.180.d:0 "Messengers from the Council offer a bargain to be kept from the ears of lesser rulers. The promise of assistance is considerable; so is the danger of trusting those who speak from the shadows."
 wet_skaven.180.t:0 "A Covenant with the Shadow Council"
 wet_skaven.181.0:0 "Decline the request."
 wet_skaven.181.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.181.1:0 "Accept the terms."
 wet_skaven.181.1_effect:0 "Accept §Y500§! infantry equipment from the Council to prepare evacuation routes before the lunar catastrophe. Our forces and territory remain under our command."
 wet_skaven.181.d:0 "The threatened warrens have sent an urgent appeal for stores. Even the Council’s most suspicious members can see the danger in allowing those tunnels to fall."
 wet_skaven.181.t:0 "Supplies for the Threatened Warrens"
 wet_skaven.182.0:0 "Decline the request."
 wet_skaven.182.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.182.1:0 "Accept the terms."
 wet_skaven.182.1_effect:0 "Gain §Y75§! Political Power in return for §Y300§! infantry equipment and military access for the Council. This is a consenting trade compact, not subjection."
 wet_skaven.182.d:0 "The Council offers protection in return for tribute. Its envoy calls the arrangement generous, though the armed rats behind him seem less interested in the choice of words."
 wet_skaven.182.t:0 "A Tribute Compact with the Council"
 wet_skaven.183.0:0 "Prepare local evacuation routes."
 wet_skaven.183.0_effect:0 "The Council has announced a ninety-day firing window for its lunar engine. Our agents can attempt sabotage, and our government must decide how much to spend protecting people beneath the threatened sky."
 wet_skaven.183.0_outcome:0 "Prepares evacuation routes against the Morrslieb strike."
 wet_skaven.183.1:0 "Fund wards and shelters."
 wet_skaven.183.d:0 "The great engine has been turned toward Morrslieb. In the warrens, triumph and terror mingle as the Council prepares to challenge something that hangs above every kingdom in the world."
 wet_skaven.183.t:0 "The Skaven Aim at Morrslieb"
 wet_skaven.184.0:0 "Prohibit firing under our treaty."
 wet_skaven.184.0_effect:0 "The Council’s planned discharge may devastate lands far beyond its own. As a pact signatory, we may prohibit the launch while the pact remains in force, or permit this terrible gamble."
 wet_skaven.184.0_outcome:0 "Forbids firing the lunar weapon while our pact holds."
 wet_skaven.184.1:0 "Permit the discharge."
 wet_skaven.184.1_effect:0 "The Council’s planned discharge may devastate lands far beyond its own. As a pact signatory, we may prohibit the launch while the pact remains in force, or permit this terrible gamble."
 wet_skaven.184.1_outcome:0 "Permits the lunar weapon to be fired."
 wet_skaven.184.d:0 "Reports from our Skaven partners describe a weapon aimed at Morrslieb itself. What they call a triumph of invention may become a disaster no treaty can contain."
 wet_skaven.184.t:0 "Our Partner Threatens the Moon"
 wet_skaven.185.0:0 "Count the living and rebuild."
 wet_skaven.185.d:0 "The night sky tears open in a blaze of sickly light. Morrslieb breaks apart above a world that has scarcely begun to understand what has been unleashed."
 wet_skaven.185.t:0 "Morrslieb Shattered"
 wet_skaven.186.0:0 "Remain with the world we made."
 wet_skaven.186.0_effect:0 "The recorded final catastrophe has consumed the old world. The prepared warrens stand at the edge of a divine refuge, and the Council must decide whether to claim that terminal escape."
 wet_skaven.186.1:0 "Claim the Horned Rat’s refuge."
 wet_skaven.186.1_effect:0 "The recorded final catastrophe has consumed the old world. The prepared warrens stand at the edge of a divine refuge, and the Council must decide whether to claim that terminal escape."
 wet_skaven.186.1_outcome:0 "Leads the surviving warrens into the Horned Rat’s refuge."
 wet_skaven.186.d:0 "The warrens tremble beneath the ruin above. In their deepest chambers, the faithful turn to the Horned Rat and the last refuge promised by their god."
 wet_skaven.186.t:0 "The Horned Rat’s Last Refuge"
