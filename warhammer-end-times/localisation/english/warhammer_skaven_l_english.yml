 wet_skaven.100.0:0 "We will weather their accusations."
 wet_skaven.100.1:0 "Fund the rites and bind their oaths."
 wet_skaven.100.1_effect:0 "The seers demand a public reckoning. A sacrifice of the Council’s wealth can purchase a renewed oath, but refusal will expose the chamber’s divisions."
 wet_skaven.100.d:0 "The bells have fallen silent, and the Council waits beneath the gaze of its god. Every lord has an explanation ready, though none is eager to be the first to speak."
 wet_skaven.100.t:0 "The Horned Rat’s Judgment"
 wet_skaven.101.0:0 "The Council must settle this."
 wet_skaven.101.d:0 "Skryre’s masters have shut their doors and sent demands to the Council. Without their furnaces and engines, even the loudest warlord may soon find his threats difficult to carry out."
 wet_skaven.101.t:0 "The Workshops Threaten to Close"
 wet_skaven.102.0:0 "Restore order through the surviving council."
 wet_skaven.102.1:0 "Call an emergency muster."
 wet_skaven.102.d:0 "Screams rise through the warrens as blades settle arguments too dangerous for the Council chamber. By dawn, the survivors will know which names they should no longer speak."
 wet_skaven.102.t:0 "The Night of a Thousand Terrors"
 wet_skaven.103.0:0 "Restore order through the surviving council."
 wet_skaven.103.1:0 "Call an emergency muster."
 wet_skaven.103.d:0 "Screams rise through the warrens as blades settle arguments too dangerous for the Council chamber. By dawn, the survivors will know which names they should no longer speak."
 wet_skaven.103.t:0 "The Night of a Thousand Terrors"
 wet_skaven.104.0:0 "The Old World has been warned."
 wet_skaven.104.d:0 "Rumours of killers beneath the streets have become reports of blood and vanished guards. The southern courts are beginning to fear an enemy they can neither see nor easily name."
 wet_skaven.104.t:0 "Terror in the Southern Kingdoms"
 wet_skaven.105.0:0 "Let the Uprising begin."
 wet_skaven.105.d:0 "The Thirteen Bells sound above the gathered clans. Beneath their tolling, rival lords proclaim a common purpose while counting the enemies standing at their shoulders."
 wet_skaven.105.t:0 "The Thirteen Bells Have Sounded"
 wet_skaven.106.0:0 "Decline the request."
 wet_skaven.106.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.106.1:0 "Accept the terms."
 wet_skaven.106.1_effect:0 "Accept the Council’s service contract. The clan retains its ruler, territory and forces. The Council gains §G+2% Stability§! on acceptance."
 wet_skaven.106.d:0 "Eshin’s representative has arrived without being seen entering the chamber. The services of his clan are offered in a soft voice, with a price that leaves little room for misunderstanding."
 wet_skaven.106.t:0 "A Contract with Clan Eshin"
 wet_skaven.107.0:0 "Decline the request."
 wet_skaven.107.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.107.1:0 "Accept the terms."
 wet_skaven.107.1_effect:0 "Accept the Council’s service contract for §Y500§! Elite Equipment. The clan retains its ruler, territory and forces. The Council gains §G+2% Stability§! on acceptance."
 wet_skaven.107.d:0 "Moulder’s brokers have brought their terms, and something restless beneath a heavy cage-cover. Their masters promise strength of a kind that ordinary breeding could never provide."
 wet_skaven.107.t:0 "A Contract with Clan Moulder"
 wet_skaven.108.0:0 "Decline the request."
 wet_skaven.108.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.108.1:0 "Accept the terms."
 wet_skaven.108.1_effect:0 "Accept the Council’s service contract for §Y200§! Elite Equipment. The clan retains its ruler, territory and forces. The Council gains §G+2% Stability§! on acceptance."
 wet_skaven.108.d:0 "The envoys of Pestilens have come coughing praises to the Horned Rat. They offer the service of their plague-brethren to the Council, provided their devotion receives its proper reward."
 wet_skaven.108.t:0 "A Contract with Clan Pestilens"
 wet_skaven.109.0:0 "Refuse these applications."
 wet_skaven.109.0_effect:0 "Independent Skaven realms have accepted the Council’s charter. As the current faction leader, we may admit the consenting applicants or refuse.\nThe Council gains its first-invitation bonus where earned."
 wet_skaven.109.1:0 "Admit eligible consenting clans."
 wet_skaven.109.1_effect:0 "Independent Skaven realms have accepted the Council’s charter. As the current faction leader, we may admit the consenting applicants or refuse.\nThe Council gains its first-invitation bonus where earned."
 wet_skaven.109.d:0 "Several clans have answered the Council’s call and now seek a place beneath the common banner. Their arrival promises greater strength, and a fresh supply of rivals to watch."
 wet_skaven.109.t:0 "The Council Requests New Members"
 wet_skaven.110.0:0 "Decline the request."
 wet_skaven.110.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.110.1:0 "Accept the terms."
 wet_skaven.110.1_effect:0 "Accept membership of the Vermintide. Admission preserves our government and territory.\nParticipation in wars remains separate. The incumbent faction leader retains the final invitation."
 wet_skaven.110.d:0 "The Council’s messengers demand that our clan join the gathering Vermintide. There will be plunder for those who stand with it, they insist, and little safety for those left alone."
 wet_skaven.110.t:0 "Join the Worldwide Vermintide"
 wet_skaven.111.0:0 "Decline the request."
 wet_skaven.111.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.111.1:0 "Accept the terms."
 wet_skaven.111.1_effect:0 "Accept §Y500§! infantry equipment and §Y100§! Elite Equipment from the Council’s stores. This shipment does not oblige you to join the Vermintide."
 wet_skaven.111.d:0 "Crates bearing the Council’s marks have reached the warren. The weapons inside may keep our warriors alive long enough to discover what their benefactors expect in return."
 wet_skaven.111.t:0 "Council Supplies for the Warren"
 wet_skaven.112.0:0 "Decline the request."
 wet_skaven.112.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.112.1:0 "Accept the terms."
 wet_skaven.112.1_effect:0 "Permit Council supply coordination and military access. The host retains its land and buildings."
 wet_skaven.112.d:0 "The Council proposes a depot to serve the warrens of both clans. Its overseers promise careful accounts, a claim that has already prompted several demands for additional guards."
 wet_skaven.112.t:0 "A Shared Skaven Depot"
 wet_skaven.113.0:0 "Decline the request."
 wet_skaven.113.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.113.1:0 "Accept the terms."
 wet_skaven.113.1_effect:0 "Accept a Council-mediated settlement. Neither side transfers territory or abandons a third-party war. Council Rivalry falls by §Y15§!."
 wet_skaven.113.d:0 "Two clans have brought their quarrel before the Council, each with witnesses who remember a different truth. A settlement may be cheaper than the fighting, if either side can be persuaded to accept one."
 wet_skaven.113.t:0 "Settle a Clan Dispute"
 wet_skaven.114.0:0 "Decline the request."
 wet_skaven.114.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.114.1:0 "Accept the terms."
 wet_skaven.114.1_effect:0 "The Council offers a non-aggression pact. We retain our faction and choose access, supplies and any common war separately. Accepting binds both governments to mutual restraint."
 wet_skaven.114.d:0 "A Skaven envoy has emerged with an offer from the Council. He speaks quickly of mutual advantage, watching every door while our advisers consider how much of his promise to believe."
 wet_skaven.114.t:0 "The Council Proposes a Bargain"
 wet_skaven.115.0:0 "Decline the request."
 wet_skaven.115.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.115.1:0 "Accept the terms."
 wet_skaven.115.1_effect:0 "Grant the Council military access and intelligence cooperation. This is a separate choice and creates no alliance or war entry."
 wet_skaven.115.d:0 "The Council asks that its soldiers be allowed through our territory. The envoy assures us that the march will be orderly, though his escort has already begun examining the cellar doors."
 wet_skaven.115.t:0 "Rat Envoys Request Passage"
 wet_skaven.116.0:0 "Decline the request."
 wet_skaven.116.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.116.1:0 "Accept the terms."
 wet_skaven.116.1_effect:0 "Exchange §Y500§! of our infantry equipment for §Y100§! of the Council’s Elite Equipment. Both stockpiles are checked on acceptance, and neither party supplies equipment it does not possess."
 wet_skaven.116.d:0 "The Skaven merchants have brought weapons to exchange and guards to count them twice. Both sides hope to leave with the better bargain, preferably before anything in the crates begins to smoke."
 wet_skaven.116.t:0 "An Exchange of Arms"
 wet_skaven.117.0:0 "Decline the request."
 wet_skaven.117.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.117.1:0 "Accept the terms."
 wet_skaven.117.1_effect:0 "The Council asks our consent to enter the selected existing war. Acceptance costs it §Y50§! Political Power only after a lawful declaration.\nIt remains in Vermintide and need not join unrelated wars."
 wet_skaven.117.d:0 "The Council offers to strike at an enemy already engaged with our armies. A second front might ease our burden, though no Skaven promise should be mistaken for affection."
 wet_skaven.117.t:0 "A Skaven Front in Our War"
