 wet_skaven.126.0:0 "Prepare for treachery."
 wet_skaven.126.d:0 "The Council’s representative has departed with his seals and excuses. Whatever common interest once held our agreement together has given way to a more tempting scheme."
 wet_skaven.126.t:0 "The Council Renounces Our Bargain"
 wet_skaven.127.0:0 "Decline the request."
 wet_skaven.127.0_effect:0 "Decline without payment or forced commitments."
 wet_skaven.127.1:0 "Accept the terms."
 wet_skaven.127.1_effect:0 "Accept §Y500§! infantry equipment and §Y200§! Elite Equipment from the Council’s stores and recognise a cooperation agreement. Queek’s government and army remain independent."
 wet_skaven.127.d:0 "The struggle for Eight Peaks has drawn the Council’s attention. Its messengers offer arms for the fighting, hoping that assistance today will purchase influence when the tunnels are won."
 wet_skaven.127.t:0 "The Council Offers Aid at Eight Peaks"
 wet_skaven.128.0:0 "Enter the result in the Black Ledger."
 wet_skaven.128.d:0 "The Emperor has fallen to the hidden blades."
 wet_skaven.128.t:0 "Assassinate Karl Franz — Success"
 wet_skaven.129.0:0 "There will be a reckoning."
 wet_skaven.129.d:0 "The agents sent against Karl Franz have failed to deliver their prize. Scattered survivors bring contradictory tales from the Emperor’s guarded household, each blaming someone who did not return."
 wet_skaven.129.t:0 "Assassinate Karl Franz — Failure"
 wet_skaven.130.0:0 "Find another opportunity."
 wet_skaven.130.d:0 "The trail to Karl Franz has gone cold. With their chance slipping away, the agents have withdrawn from the Emperor’s guarded household before the enemy could close upon them."
 wet_skaven.130.t:0 "Assassinate Karl Franz — Aborted"
