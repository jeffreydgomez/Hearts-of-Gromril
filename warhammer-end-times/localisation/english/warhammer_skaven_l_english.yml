 WET_DIRECT_E07_skaven_builder:0 "Begin city repairs: +15% Repair Speed for 90 days. Costs 50 Political Power."
 WET_DIRECT_E08_skaven_builder:0 "Offer a Tribute Compact."
 WET_DIRECT_F03_skaven_builder:0 "Send invitations to Clan Moulder/Clan Mange; actual faction membership only on acceptance."
 WET_DIRECT_F07_skaven_builder:0 "Offer Supplies to a Skaven Realm."
 WET_DIRECT_F08_skaven_builder:0 "Negotiate an Allied Depot."
 WET_DIRECT_F09_skaven_builder:0 "Negotiate a Clan Settlement."
 WET_DIRECT_O04_skaven_builder:0 "Prepare escape routes for the Council’s agents."
 WET_DIRECT_O08_skaven_builder:0 "Survey the Black Pyramid’s foundations. Preparations take 45 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_DIRECT_O10_skaven_builder:0 "Conceal the Council’s hand in its operations. Costs 75 Political Power."
 WET_DIRECT_T03_skaven_builder:0 "Fund the Skryre Engineering Office. Costs 75 Political Power."
 WET_DIRECT_T05_skaven_builder:0 "Fund the Doomsphere research programme. Costs 100 Political Power."
 WET_DIRECT_T06_skaven_builder:0 "Shield the test warrens. Costs 100 Political Power."
 WET_DIRECT_T08_skaven_builder:0 "Complete a controlled Doomsphere test. Costs 50 Political Power."
 WET_DIRECT_T12_skaven_builder:0 "Fund the Stormfiend research programme. Costs 100 Political Power."
 WET_DIRECT_T22_skaven_builder:0 "Fund the Morskittar Engine research programme. Costs 200 Political Power."
 WET_DIRECT_W11_skaven_builder:0 "Recognise the recovery of Eight Peaks after securing a foothold."
 WET_DIRECT_W17_skaven_builder:0 "Scout the High King’s court. Preparations take 45 days. Work begins when its access and supply requirements are met."
 WET_SKV_C00:0 "Convene the Thirteen"
 WET_SKV_C00_desc:0 "Establish an agenda the Council can enforce. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C01:0 "Quiet the Hungry Warrens"
 WET_SKV_C01_desc:0 "Settle the shortages driving street violence. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C01_special_tt:0 "Begin relief for the hungry warrens. Preparations take 60 days and cost 50 Political Power. Work begins when its access and supply requirements are met."
 WET_SKV_C02:0 "Count the Clans’ Tribute"
 WET_SKV_C02_desc:0 "Record what every council bloc actually contributes. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C02_special_tt:0 "Authority +10."
 WET_SKV_C03:0 "The Black Ledger"
 WET_SKV_C03_desc:0 "Document the councillors’ debts and treacheries. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C03_special_tt:0 "Gain 25 Political Power and 5 Council Authority."
 WET_SKV_C04:0 "A Truce in the Streets"
 WET_SKV_C04_desc:0 "Make a temporary peace between competing warrens. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C05:0 "Who Speaks for Skavendom?"
 WET_SKV_C05_desc:0 "Put the governing doctrine before the Council. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C06:0 "Restore the Grey Seers"
 WET_SKV_C06_desc:0 "Make priestly arbitration the centre of Council rule. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C06_special_tt:0 "Authority +15; +10% PP gain; favoured bloc Grey Seers."
 WET_SKV_C07:0 "A Directorate of Skryre"
 WET_SKV_C07_desc:0 "Give engineers control over the national programme. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C07_special_tt:0 "Factory output +5%; project grants cost 25 PP less; favour Skryre."
 WET_SKV_C08:0 "Clan Mors Commands"
 WET_SKV_C08_desc:0 "Govern through negotiated clan obligations. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C08_special_tt:0 "Planning speed +10%; army organisation +5%; favour Mors."
 WET_SKV_C09:0 "The Council’s Binding Agenda"
 WET_SKV_C09_desc:0 "Turn the selected settlement into working procedures. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C09_special_tt:0 "Authority +10; the governing clan becomes the favoured bloc."
 WET_SKV_C10:0 "Purchase Eshin’s Silence"
 WET_SKV_C10_desc:0 "Obtain a retainer from the real Nightlord’s organisation. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C10_special_tt:0 "Offer Eshin §Y75 Political Power§! for specialist services. If they refuse, local specialists can be hired at a higher cost."
 WET_SKV_C11:0 "Contracts with Hell Pit"
 WET_SKV_C11_desc:0 "Negotiate access to Moulder’s expertise without seizing its realm. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C11_special_tt:0 "Send Moulder a service offer costing 75 PP and 500 real Elite Equipment on acceptance; gain 15 Moulder favour."
 WET_SKV_C12:0 "A Place for the Plague Priests"
 WET_SKV_C12_desc:0 "Give Pestilens a contractual stake in Council ventures. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C12_special_tt:0 "Send Pestilens a service offer costing 75 PP and 200 real Elite Equipment on acceptance; gain 15 Pestilens favour."
 WET_SKV_C13:0 "Scapegoat Clan Skryre"
 WET_SKV_C13_desc:0 "Blame a named clan for the Council’s failures and sacrifice its expertise to restore order. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C13_special_tt:0 "+25 stability points; Skryre favour -30; -15% research speed and -10% factory output for 365 days."
 WET_SKV_C14:0 "Scapegoat Clan Moulder"
 WET_SKV_C14_desc:0 "Blame a named clan for the Council’s failures and sacrifice its expertise to restore order. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C14_special_tt:0 "+25 stability points; Moulder favour -30; -15% army recovery rate and +10% monster equipment cost for 365 days."
 WET_SKV_C15:0 "Pronounce the Council’s Verdict"
 WET_SKV_C15_desc:0 "Publish the outcome of a real protection or betrayal resolution. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C15_requirements:0 "One clan-specific scapegoat focus completed; its §Y365§!-day penalty is not refreshed."
 WET_SKV_C16:0 "Arbitrate the Clan Feuds"
 WET_SKV_C16_desc:0 "Trade concessions for an end to damaging disputes. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C16_special_tt:0 "Open 75-PP mediation: -20 rivalry, 180-day cooldown."
 WET_SKV_C17:0 "Divide the Spoils"
 WET_SKV_C17_desc:0 "Pay promised shares before success produces another civil war. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C17_special_tt:0 "Unlock delivery of recorded spoils: 250 infantry and 100 Elite Equipment per claim; +10 Authority and first delivery +50 PP."
 WET_SKV_C18:0 "Hunt the Embezzlers"
 WET_SKV_C18_desc:0 "Recover supplies diverted from Council contracts. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C18_special_tt:0 "Hunt the embezzlers. Preparations take 90 days. Work begins when its access and supply requirements are met."
 WET_SKV_C19:0 "The Horned Rat’s Judgment"
 WET_SKV_C19_desc:0 "Confront a religious challenge to the settlement. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C19_special_tt:0 "Optional legitimacy crisis; gain +10 authority by paying 100 PP or lose 10 stability."
 WET_SKV_C20:0 "A Council That Can Govern"
 WET_SKV_C20_desc:0 "Institutionalise reliable contracts and political succession. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C20_requirements:0 "Authority >=§Y60§!; rivalry <=§Y60§!; no unpaid promised shares."
 WET_SKV_C21:0 "No Clan Above the Council"
 WET_SKV_C21_desc:0 "Prevent patronage from becoming an uncontrolled private empire. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C21_special_tt:0 "Authority cap +20; existing paid recovery and mediation decisions remain available."
 WET_SKV_C22:0 "Moulder Takes the Chair"
 WET_SKV_C22_desc:0 "Entrust the Council to the master fleshcrafters. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C22_special_tt:0 "Army recovery rate +10%; monster equipment cost -5%; favour Moulder."
 WET_SKV_C23:0 "Pestilens Ascendant"
 WET_SKV_C23_desc:0 "Put the plague priesthood at the head of Council business. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C23_special_tt:0 "Division attrition -10%; monthly population growth +10%; favour Pestilens."
 WET_SKV_C24:0 "Eshin Rules from the Shadows"
 WET_SKV_C24_desc:0 "Give Eshin the deciding voice behind the chamber doors. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C24_special_tt:0 "Encryption +10%; decryption +10%; operation fees -25 PP; favour Eshin."
 WET_SKV_C25:0 "The Iron Fist of Rictus"
 WET_SKV_C25_desc:0 "Let the armoured legions impose order on the Council. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C25_special_tt:0 "Army defence +5%; training time -5%; favour Rictus."
 WET_SKV_C26:0 "Scapegoat Clan Pestilens"
 WET_SKV_C26_desc:0 "Blame the plague priests and purge their influence from the Council. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C26_special_tt:0 "+25 stability points; Pestilens favour -30; +15% division attrition for 365 days."
 WET_SKV_C27:0 "Scapegoat Clan Eshin"
 WET_SKV_C27_desc:0 "Publicly expose the secret clan as the author of every recent betrayal. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C27_special_tt:0 "+25 stability points; Eshin favour -30; -20% decryption and -10 percentage points operation success for 365 days."
 WET_SKV_C28:0 "Scapegoat Clan Mors"
 WET_SKV_C28_desc:0 "Make the commanders of Mors answer for the Council’s failures. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C28_special_tt:0 "+25 stability points; Mors favour -30; -15% planning speed and -10% army organisation for 365 days."
 WET_SKV_C29:0 "Scapegoat Clan Rictus"
 WET_SKV_C29_desc:0 "Dismiss Rictus officers and sacrifice their war-making influence. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C29_special_tt:0 "+25 stability points; Rictus favour -30; -10% army defence and +15% training time for 365 days."
 WET_SKV_C30:0 "Scapegoat the Grey Seers"
 WET_SKV_C30_desc:0 "Silence the priestly accusers by making them the accused. Every bargain in the chamber leaves another clan counting what it has lost."
 WET_SKV_C30_special_tt:0 "+25 stability points; Grey Seer favour -30; -15% political power gain and -10% war support for 365 days."
 WET_SKV_D00:0 "A Seat at Another War Table"
 WET_SKV_D00_desc:0 "Consider three mutually exclusive foreign alignments. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D01:0 "Bargain with Nagash"
 WET_SKV_D01_desc:0 "Choose an Undead partnership against common enemies. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D01_requirements:0 "The Nagashi faction leader exists and is at peace with us."
 WET_SKV_D01_special_tt:0 "Send the current Nagash faction leader an accept/refuse event. Accepted pact costs 75 PP; AI normally accepts at 85:15 weight."
 WET_SKV_D02:0 "Bargain with the Everchosen"
 WET_SKV_D02_desc:0 "Choose the historical cooperation with Archaon’s coalition. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D02_requirements:0 "The Everchosen’s faction leader exists and is at peace with us."
 WET_SKV_D02_special_tt:0 "Send the current Chaos faction leader an accept/refuse event. Accepted pact costs 75 PP; AI normally accepts at 85:15 weight."
 WET_SKV_D03:0 "Bargain with the Empire"
 WET_SKV_D03_desc:0 "Offer the human alliance a dangerous but useful partner. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D03_requirements:0 "The Empire’s faction leader exists and is at peace with us."
 WET_SKV_D03_special_tt:0 "Send the current Empire faction leader an accept/refuse event. Accepted pact costs 75 PP; AI normally accepts at 85:15 weight."
 WET_SKV_D04:0 "An Embassy among the Dead"
 WET_SKV_D04_desc:0 "Negotiate access and intelligence with a consenting Nagash. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D04_special_tt:0 "Request Nagash Access. Offer an Arms Exchange — Nagash."
 WET_SKV_D05:0 "The Mortarchs’ Enemies"
 WET_SKV_D05_desc:0 "Agree on targets that serve both sides of the pact. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D05_special_tt:0 "Unlock Nagash-alignment operations against hostile Order and Chaos targets."
 WET_SKV_D06:0 "The Emperor in Our Sights"
 WET_SKV_D06_desc:0 "Prepare a named Eshin contract against Karl Franz. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D06_special_tt:0 "Authorize OP-KF through O03, if Karl Franz lives and Reikland is a lawful hostile target."
 WET_SKV_D07:0 "March Beside the Dead"
 WET_SKV_D07_desc:0 "Offer entry into one specific war alongside Nagash. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D07_special_tt:0 "Optional join-war decision: current enemy, consent, lawful declaration and bloc-strength checks."
 WET_SKV_D08:0 "Terms Even Nagash Must Honour"
 WET_SKV_D08_desc:0 "Protect Skaven autonomy within the military bargain. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D08_requirements:0 "At least one completed real exchange with an active consenting Nagash pact partner."
 WET_SKV_D08_special_tt:0 "50 PP and +25 partner opinion after a real arms exchange with the active Nagash pact partner."
 WET_SKV_D09:0 "Thanquol’s Embassy"
 WET_SKV_D09_desc:0 "Send a lawful envoy to the Everchosen’s current court. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D09_special_tt:0 "Request Chaos Access. Offer an Arms Exchange — Chaos."
 WET_SKV_D10:0 "Knives for the Northern War"
 WET_SKV_D10_desc:0 "Supply covert operations against the Empire and other enemies. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D10_special_tt:0 "Authorize OP-KF via O03 and gate/supply sabotage against actual shared enemies."
 WET_SKV_D11:0 "Deny the Great Necromancer"
 WET_SKV_D11_desc:0 "Prepare to destroy Nagash’s accumulated power source. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D11_special_tt:0 "Subsidise the first OP-BP launch by 50 PP after O09; actual Pyramid project must exist."
 WET_SKV_D12:0 "March with the Everchosen"
 WET_SKV_D12_desc:0 "Offer a Skaven front in one of Chaos’s current wars. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D12_special_tt:0 "Optional join-war decision; no forced faction merger or automatic war entry."
 WET_SKV_D13:0 "Our Price for the Apocalypse"
 WET_SKV_D13_desc:0 "Demand payment and recognition for delivered assistance. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D13_requirements:0 "Complete a real arms exchange with the active Chaos pact signatory."
 WET_SKV_D13_special_tt:0 "50 PP and +25 partner opinion after a real arms exchange with the active Chaos pact partner."
 WET_SKV_D14:0 "Rat Envoys at the Imperial Palace"
 WET_SKV_D14_desc:0 "Establish a pact whose terms both governments can enforce. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D14_special_tt:0 "Request Empire Access. Offer an Arms Exchange — Empire."
 WET_SKV_D15:0 "Secrets of the Northern Hosts"
 WET_SKV_D15_desc:0 "Offer sabotage against Chaos rather than promises of obedience. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D15_special_tt:0 "Authorize Everchosen supply raids and assassination contracts against lesser hostile champions."
 WET_SKV_D16:0 "The Enemy of Life Itself"
 WET_SKV_D16_desc:0 "Offer an operation against an actual hostile Nagash. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D16_special_tt:0 "Subsidise the first Black Pyramid expedition by 50 PP after O09; an actual hostile, unprotected registered project must exist."
 WET_SKV_D17:0 "March Beside the Man-Things"
 WET_SKV_D17_desc:0 "Offer participation in one genuine Imperial defensive war. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D17_special_tt:0 "Optional join-war decision with Imperial consent; retain Vermintide and normal faction rules."
 WET_SKV_D18:0 "A Treaty Written in Teeth"
 WET_SKV_D18_desc:0 "Turn useful cooperation into a lasting armed accommodation. A foreign oath is useful only while both sides believe it serves their purpose."
 WET_SKV_D18_requirements:0 "At least one completed real exchange with an active consenting Empire pact partner."
 WET_SKV_D18_special_tt:0 "50 PP and +25 partner opinion after a real arms exchange with the active Empire pact partner."
 WET_SKV_E00:0 "What Shall We Inherit?"
 WET_SKV_E00_desc:0 "Debate whether Skaven supremacy requires a surviving world. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E01:0 "The Horned Rat’s Apocalypse"
 WET_SKV_E01_desc:0 "Commit to world-breaking intervention and divine favour. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E01_special_tt:0 "Set apocalypse commitment; permit Morskittar Engine project destructive launch once all other gates are met."
 WET_SKV_E02:0 "A World Worth Ruling"
 WET_SKV_E02_desc:0 "Commit to a lasting surface and subterranean empire. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E02_special_tt:0 "Set surface-rule commitment; permanently bar Morrslieb destruction and allow Morskittar Engine project decommissioning."
 WET_SKV_E03:0 "A Covenant with the Shadow Council"
 WET_SKV_E03_desc:0 "Seek Verminlord support for the apocalyptic programme. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E03_special_tt:0 "Open 100-PP covenant; +10 authority on acceptance, +15 rivalry from mortal councillors."
 WET_SKV_E04:0 "The Price of the Falling Moon"
 WET_SKV_E04_desc:0 "Expose the cost to Pestilens and other overseas holdings. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E04_special_tt:0 "Open consenting evacuation aid: send 500 real infantry equipment to a reachable Skaven realm and prepare its lunar evacuation routes."
 WET_SKV_E05:0 "Authorize the Final Discharge"
 WET_SKV_E05_desc:0 "Grant a completed and secure lunar weapon permission to fire. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E05_requirements:0 "Has completed §Y$WET_SKV_T24$§!. The Morskittar Engine is complete and secure, we have committed to the apocalypse, and no treaty prohibits firing."
 WET_SKV_E05_special_tt:0 "Unlocks the final Morskittar Engine firing decision after completion of §Y$WET_SKV_T24$§! and the project’s research, while the firing site remains under our control."
 WET_SKV_E06:0 "Preserve the Favoured"
 WET_SKV_E06_desc:0 "Prepare shelters and a possible divine escape from a dying world. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E06_special_tt:0 "Prepare shelters and evacuation stores in the deep warrens. Preparations take 180 days and cost 150 Political Power. Work begins when its access and supply requirements are met."
 WET_SKV_E07:0 "Govern the Stolen Cities"
 WET_SKV_E07_desc:0 "Build an administration for conquered surface holdings. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E07_requirements:0 "Begin city repairs: §Y+15%§! Repair Speed for §Y90§! days. Costs §Y50§! Political Power."
 WET_SKV_E07_special_tt:0 "Begin city repairs: +15% Repair Speed for 90 days. Costs 50 Political Power."
 WET_SKV_E08:0 "Tribute from Above and Below"
 WET_SKV_E08_desc:0 "Replace destructive competition with enforceable tribute. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E08_special_tt:0 "Offer a Tribute Compact."
 WET_SKV_E09:0 "No Master beyond the Council"
 WET_SKV_E09_desc:0 "Prepare to resist any ally who threatens the surviving world. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E09_special_tt:0 "Open costly treaty renunciation and anti-apocalypse operations; no immediate betrayal attack."
 WET_SKV_E10:0 "An Empire beneath the Sky"
 WET_SKV_E10_desc:0 "Consolidate actual holdings into a durable Skaven state. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E10_requirements:0 "Own and fully control the fixed southern objective states and current capital."
 WET_SKV_E11:0 "The Age of the Rat"
 WET_SKV_E11_desc:0 "Recognise the campaign outcome actually achieved. The choice will decide what remains for the ratmen to inherit."
 WET_SKV_E11_requirements:0 "Secure surface dominion, or survive a shattered/stopped lunar weapon with at least three owned states, or receive the shared final-crisis escape outcome."
 WET_SKV_F00:0 "Count Every Warren"
 WET_SKV_F00_desc:0 "Identify all existing Skaven realms and their leaders. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F01:0 "The Vermintide Charter"
 WET_SKV_F01_desc:0 "Define membership of Skavenblight’s existing faction. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F01_special_tt:0 "Open consensual invitations; no second faction or formation fee while Vermintide exists."
 WET_SKV_F02:0 "Envoys to the Great Clans"
 WET_SKV_F02_desc:0 "Prepare offers without confusing Council seats and sovereign realms. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F02_special_tt:0 "First accepted invitation costs 25 PP less; retain actual leader consent."
 WET_SKV_F03:0 "The Northern Warrens"
 WET_SKV_F03_desc:0 "Approach Moulder and Mange in the northern mountains. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F03_special_tt:0 "Send invitations to Clan Moulder/Clan Mange; actual faction membership only on acceptance."
 WET_SKV_F04:0 "Eshin and the Eastern Clans"
 WET_SKV_F04_desc:0 "Reach Eshin, Crooktail, Grutnik and Eskemas overseas and in the east. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F04_special_tt:0 "Unlock Clan Eshin/Clan Crooktail/Clan Grutnik/Clan Eskemas invitations; route checks govern aid, not diplomatic contact."
 WET_SKV_F05:0 "Pestilens and the Southern Clans"
 WET_SKV_F05_desc:0 "Seek the southern clans’ participation in the global uprising. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F05_special_tt:0 "Unlock Clan Pestilens/Clan Carrion/Clan Skully/Clan Mordkin invitations; preserve Pestilens’ Lustrian enclave and forces."
 WET_SKV_F06:0 "Clans of the Mountain Roads"
 WET_SKV_F06_desc:0 "Approach the remaining western and mountain Skaven realms. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F06_special_tt:0 "Unlock Clan Rictus/Clan Krizzor/Clan Ferrik/Clan Fester/Clan Skrapp/Clan Gritus/Clan Volkn/Clan Skab/Queek's Legion/Clan Verms/Clan Flem invitations."
 WET_SKV_F07:0 "Subsidies for the Reluctant"
 WET_SKV_F07_desc:0 "Offer material reasons to accept Council coordination. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F07_special_tt:0 "Offer Supplies to a Skaven Realm."
 WET_SKV_F08:0 "The Common Supply Ledger"
 WET_SKV_F08_desc:0 "Support members through the routes they actually share. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F08_special_tt:0 "Negotiate an Allied Depot."
 WET_SKV_F09:0 "Arbitrate the Border Feuds"
 WET_SKV_F09_desc:0 "Prevent disputes within the Vermintide from consuming its armies. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F09_special_tt:0 "Negotiate a Clan Settlement."
 WET_SKV_F10:0 "A Seat for Every Clan"
 WET_SKV_F10_desc:0 "Guarantee small members a share of Council business. Distant warrens will answer only when their own rulers see a reason to cooperate."
 WET_SKV_F10_requirements:0 "Three other independent current Vermintide members."
