 wet_skaven.159.d:0 "Tracks vanish into drains and witnesses disagree about what they saw. Someone has been moving beneath the ordinary life of our realm, leaving enough evidence to make complacency dangerous."
 wet_skaven.159.t:0 "Signs of a Skaven Operation"
 wet_skaven.160.0:0 "Enter the result in the Black Ledger."
 wet_skaven.160.d:0 "The stolen papers have reached the warrens, ready for the Council’s scholars to examine. The survivors hurry back to claim their reward before a rival can steal the credit."
 wet_skaven.160.t:0 "Steal the Enemy’s Secrets — Success"
 wet_skaven.161.0:0 "There will be a reckoning."
 wet_skaven.161.d:0 "The agents sent against the enemy’s secrets have failed to deliver their prize. Scattered survivors bring contradictory tales from the archives and guarded workshops, each blaming someone who did not return."
 wet_skaven.161.t:0 "Steal the Enemy’s Secrets — Failure"
 wet_skaven.162.0:0 "Find another opportunity."
 wet_skaven.162.d:0 "The trail to the enemy’s secrets has gone cold. With their chance slipping away, the agents have withdrawn from the archives and guarded workshops before the enemy could close upon them."
 wet_skaven.162.t:0 "Steal the Enemy’s Secrets — Aborted"
