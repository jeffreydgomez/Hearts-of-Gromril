 wet_skv_fire_moon_outcome_tt:0 "Shatters Morrslieb. Lustrian states lose §R2§! Infrastructure levels and §R1§! Civilian Factory level, with §R−25%§! Resources and §R−15%§! Building Slots for §Y365 days§!. Their owners lose §R25%§! Stability. Evacuation reduces the Stability loss to §R15%§!; wards reduce it to §R10%§! and limit damage to §R1§! Infrastructure level."
