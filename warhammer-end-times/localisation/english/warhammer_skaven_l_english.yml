 WET_DIRECT_D04_skaven_builder:0 "Request Military Access from the Nagashi pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_DIRECT_D09_skaven_builder:0 "Request Military Access from the Chaos pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_DIRECT_D14_skaven_builder:0 "Request Military Access from the Imperial pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_DIRECT_E06_skaven_builder:0 "Once the capital is controlled and supplies are available, spend §Y500 Infantry Equipment§! on a §Y180-day§! shelter project. Completion grants §G+10% Division Recovery Rate§! for §Y365 days§!."
 WET_DIRECT_E07_skaven_builder:0 "Begin city repairs: +15% Repair Speed for 90 days."
 WET_DIRECT_E08_skaven_builder:0 "Request §Y300 Infantry Equipment§! and Military Access from eligible peaceful realms. An accepting realm transfers the equipment and gains §G75 Political Power§!."
 WET_DIRECT_F03_skaven_builder:0 "Send invitations to Clan Moulder/Clan Mange."
 WET_DIRECT_F07_skaven_builder:0 "Offer eligible Skaven realms §Y500 Infantry Equipment§! and §Y100 Elite Equipment§! from our stockpile. Transfer occurs only on acceptance."
 WET_DIRECT_F08_skaven_builder:0 "Request military access and supply cooperation from a member of the §YVermintide§!."
 WET_DIRECT_F09_skaven_builder:0 "Offer faction members a settlement. Each acceptance reduces our Clan Rivalry by §G15§! and improves the recipient’s opinion."
 WET_DIRECT_O04_skaven_builder:0 "Spend §Y100 Elite Equipment§! to permanently add §G10 percentage points§! to covert-operation success, subject to the existing success-chance cap."
 WET_DIRECT_O08_skaven_builder:0 "Start §Y45 days§! of reconnaissance of the active Black Pyramid. Completion grants a §Y365-day§! dossier for its current construction, adding §G15 percentage points§! to the demolition operation’s success chance."
 WET_DIRECT_O10_skaven_builder:0 "For §Y180 days§!, ordinary covert operations delay their defender warning by §Y15 days§!. The Black Pyramid operation uses its own warning schedule."
 WET_DIRECT_T03_skaven_builder:0 "Fund the Skryre Engineering Office."
 WET_DIRECT_T05_skaven_builder:0 "Commit §Y500 Elite Equipment§! to unlock the §YDoomsphere§! Special Project. If Clan Skryre leads the Council, also gain §G25 Political Power§!."
 WET_DIRECT_T06_skaven_builder:0 "Halve the equipment and research-progress losses from the next prototype mishap."
 WET_DIRECT_T08_skaven_builder:0 "Complete the Doomsphere test required to unlock §Y$WET_SKV_T09$§!."
 WET_DIRECT_T12_skaven_builder:0 "Commit §Y400 Elite Equipment§! to unlock the §YStormfiend§! Special Project. If Clan Skryre leads the Council, also gain §G25 Political Power§!."
 WET_DIRECT_T22_skaven_builder:0 "Commit §Y1,000 Elite Equipment§! to unlock the §YMorskittar Engine§! Special Project. Clan Skryre leadership grants §G25 Political Power§!; Zingetail’s directorship grants §G20 Political Power§! and returns §G100 Elite Equipment§!."
 WET_DIRECT_W11_skaven_builder:0 "Recognise the recovery of Eight Peaks after securing a foothold."
 WET_DIRECT_W17_skaven_builder:0 "Start §Y45 days§! of reconnaissance against the living High King. Completion grants a dossier valid for §Y365 days§! at his current capital, adding §G15 percentage points§! to applicable covert-operation success."
 WET_SKV_C00:0 "Convene the Thirteen"
 WET_SKV_C00_desc:0 "Establish an agenda the Council can enforce."
 WET_SKV_C01:0 "Quiet the Hungry Warrens"
 WET_SKV_C01_desc:0 "Settle the shortages driving street violence."
 WET_SKV_C01_special_tt:0 "Start a §Y60-day§! relief programme that uses §Y2 Civilian Factories§! while active and grants §G5% Stability§! on completion."
 WET_SKV_C02:0 "Count the Clans’ Tribute"
 WET_SKV_C02_desc:0 "Record what every council bloc actually contributes."
 WET_SKV_C02_special_tt:0 "Political Power: §G+25§!."
 WET_SKV_C03:0 "The Black Ledger"
 WET_SKV_C03_desc:0 "Document the councillors’ debts and treacheries."
 WET_SKV_C03_special_tt:0 "Stability: §G+2%§!."
 WET_SKV_C04:0 "A Truce in the Streets"
 WET_SKV_C04_desc:0 "Make a temporary peace between competing warrens."
 WET_SKV_C05:0 "Who Speaks for Skavendom?"
 WET_SKV_C05_desc:0 "Put the governing doctrine before the Council."
 WET_SKV_C06:0 "Restore the Grey Seers"
 WET_SKV_C06_desc:0 "Make priestly arbitration the centre of Council rule."
 WET_SKV_C06_special_tt:0 "§YGrey Seers§! leads the Council."
 WET_SKV_C07:0 "A Directorate of Skryre"
 WET_SKV_C07_desc:0 "Give engineers control over the national programme."
 WET_SKV_C07_special_tt:0 "§YClan Skryre§! leads the Council.\nGain §G25 Political Power§! with each eligible Special Project grant."
 WET_SKV_C08:0 "Clan Mors Commands"
 WET_SKV_C08_desc:0 "Govern through negotiated clan obligations."
 WET_SKV_C08_special_tt:0 "§YClan Mors§! leads the Council."
 WET_SKV_C09:0 "The Council’s Binding Agenda"
 WET_SKV_C09_desc:0 "Turn the selected settlement into working procedures."
 WET_SKV_C09_special_tt:0 "Stability: §G+3%§!."
 WET_SKV_C10:0 "Purchase Eshin’s Silence"
 WET_SKV_C10_desc:0 "Obtain a retainer from the Nightlord’s organisation."
 WET_SKV_C10_special_tt:0 "Offer §YClan Eshin§! a service contract for §Y75 Political Power§!. Acceptance gives the Council §G+2% Stability§!."
 WET_SKV_C11:0 "Contracts with Hell Pit"
 WET_SKV_C11_desc:0 "Negotiate access to Moulder’s expertise without seizing its realm."
 WET_SKV_C11_special_tt:0 "Offer §YClan Moulder§! a service contract for §Y75 Political Power§! and §Y500 Elite Equipment§!. Acceptance gives the Council §G+2% Stability§!."
 WET_SKV_C12:0 "A Place for the Plague Priests"
 WET_SKV_C12_desc:0 "Give Pestilens a contractual stake in Council ventures."
 WET_SKV_C12_special_tt:0 "Offer §YClan Pestilens§! a service contract for §Y75 Political Power§! and §Y200 Elite Equipment§!. Acceptance gives the Council §G+2% Stability§!."
 WET_SKV_C13:0 "Scapegoat Clan Skryre"
 WET_SKV_C13_desc:0 "Blame a named clan for the Council’s failures and sacrifice its expertise to restore order."
 WET_SKV_C13_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C14:0 "Scapegoat Clan Moulder"
 WET_SKV_C14_desc:0 "Blame a named clan for the Council’s failures and sacrifice its expertise to restore order."
 WET_SKV_C14_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C15:0 "Pronounce the Council’s Verdict"
 WET_SKV_C15_desc:0 "Publish the outcome of a settled protection agreement or proven betrayal."
 WET_SKV_C15_requirements:0 "Has completed a focus blaming one of the Council’s clans."
 WET_SKV_C16:0 "Arbitrate the Clan Feuds"
 WET_SKV_C16_desc:0 "Trade concessions for an end to damaging disputes."
 WET_SKV_C16_special_tt:0 "Enables mediation between the clans for §Y75 Political Power§!, reducing Clan Rivalry by §G20§!. Available once every §Y180 days§!."
 WET_SKV_C17:0 "Divide the Spoils"
 WET_SKV_C17_desc:0 "Pay promised shares before success produces another civil war."
 WET_SKV_C17_special_tt:0 "Deliver §Y250 Infantry Equipment§! and §Y100 Elite Equipment§! per outstanding claim. Gain §G10 Political Power§! per delivery, plus §G50§! for the first delivery."
 WET_SKV_C18:0 "Hunt the Embezzlers"
 WET_SKV_C18_desc:0 "Recover supplies diverted from Council contracts."
 WET_SKV_C18_special_tt:0 "Start a §Y90-day§! audit. Completion returns §G25%§! of the recorded diverted Elite Equipment and clears the recorded loss."
 WET_SKV_C19:0 "The Horned Rat’s Judgment"
 WET_SKV_C19_desc:0 "Confront a religious challenge to the settlement."
 WET_SKV_C19_special_tt:0 "Accept the rites for §G+5% Stability§!, or refuse and lose §R10% Stability§!."
 WET_SKV_C20:0 "A Council That Can Govern"
 WET_SKV_C20_desc:0 "Institutionalise reliable contracts and political succession."
 WET_SKV_C20_requirements:0 "Clan Rivalry is at most §Y60§!. All promised shares of the spoils have been delivered."
 WET_SKV_C21:0 "No Clan Above the Council"
 WET_SKV_C21_desc:0 "Prevent patronage from becoming an uncontrolled private empire."
 WET_SKV_C21_special_tt:0 "Stability: §G+5%§!."
 WET_SKV_C22:0 "Moulder Takes the Chair"
 WET_SKV_C22_desc:0 "Entrust the Council to the master fleshcrafters."
 WET_SKV_C22_special_tt:0 "§YClan Moulder§! leads the Council."
 WET_SKV_C23:0 "Pestilens Ascendant"
 WET_SKV_C23_desc:0 "Put the plague priesthood at the head of Council business."
 WET_SKV_C23_special_tt:0 "§YClan Pestilens§! leads the Council."
 WET_SKV_C24:0 "Eshin Rules from the Shadows"
 WET_SKV_C24_desc:0 "Give Eshin the deciding voice behind the chamber doors."
 WET_SKV_C24_special_tt:0 "§YClan Eshin§! leads the Council.\nCovert operations cost §G25§! less Political Power."
 WET_SKV_C25:0 "The Iron Fist of Rictus"
