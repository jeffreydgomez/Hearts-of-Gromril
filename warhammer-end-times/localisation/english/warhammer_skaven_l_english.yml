 wet_skv_fire_moon:0 "Authorize the Final Discharge"
 wet_skv_fire_moon_desc:0 "Commit 150 PP and 500 Elite Equipment to a public ninety-day firing countdown. Treaty vetoes, sabotage, decommissioning or loss of the controlled Skavenhold facility abort firing. A successful launch devastates Lustrian infrastructure and stability; it does not annex countries or remove the map."
