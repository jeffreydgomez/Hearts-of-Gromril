 WET_SKV_F07_desc:0 "Offer material reasons to accept Council coordination."
 WET_SKV_F07_special_tt:0 "Offer eligible Skaven realms §Y500 Infantry Equipment§! and §Y100 Elite Equipment§! from our stockpile. Transfer occurs only on acceptance."
 WET_SKV_F08:0 "The Common Supply Ledger"
 WET_SKV_F08_desc:0 "Support members through the routes they actually share."
 WET_SKV_F08_special_tt:0 "Request military access and supply cooperation from a member of the §YVermintide§!."
 WET_SKV_F09:0 "Arbitrate the Border Feuds"
 WET_SKV_F09_desc:0 "Prevent disputes within the Vermintide from consuming its armies."
 WET_SKV_F09_special_tt:0 "Offer faction members a settlement. Each acceptance reduces our Clan Rivalry by §G15§! and improves the recipient’s opinion."
