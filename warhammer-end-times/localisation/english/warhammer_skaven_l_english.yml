 WET_SKV_C25_special_tt:0 "§YClan Rictus§! leads the Council."
 WET_SKV_C26:0 "Scapegoat Clan Pestilens"
 WET_SKV_C26_desc:0 "Blame the plague priests and purge their influence from the Council."
 WET_SKV_C26_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C27:0 "Scapegoat Clan Eshin"
 WET_SKV_C27_desc:0 "Publicly expose the secret clan as the author of every recent betrayal."
 WET_SKV_C27_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C28:0 "Scapegoat Clan Mors"
 WET_SKV_C28_desc:0 "Make the commanders of Mors answer for the Council’s failures."
 WET_SKV_C28_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C29:0 "Scapegoat Clan Rictus"
 WET_SKV_C29_desc:0 "Dismiss Rictus officers and sacrifice their war-making influence."
 WET_SKV_C29_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_C30:0 "Scapegoat the Grey Seers"
 WET_SKV_C30_desc:0 "Silence the priestly accusers by making them the accused."
 WET_SKV_C30_special_tt:0 "Clan Rivalry: §R+15§!."
 WET_SKV_D00:0 "A Seat at Another War Table"
 WET_SKV_D00_desc:0 "Consider three mutually exclusive foreign alignments."
 WET_SKV_D01:0 "Bargain with Nagash"
 WET_SKV_D01_desc:0 "Choose an Undead partnership against common enemies."
 WET_SKV_D01_requirements:0 "The Nagashi faction leader exists and is at peace with us."
 WET_SKV_D01_special_tt:0 "Offer a non-aggression pact to the leader of the §YNagashi§! faction."
 WET_SKV_D02:0 "Bargain with the Everchosen"
 WET_SKV_D02_desc:0 "Choose the historical cooperation with Archaon’s coalition."
 WET_SKV_D02_requirements:0 "The Everchosen’s faction leader exists and is at peace with us."
 WET_SKV_D02_special_tt:0 "Offer a non-aggression pact to the leader of the §YEverchosen’s faction§!."
 WET_SKV_D03:0 "Bargain with the Empire"
 WET_SKV_D03_desc:0 "Offer the human alliance a dangerous but useful partner."
 WET_SKV_D03_requirements:0 "The Empire’s faction leader exists and is at peace with us."
 WET_SKV_D03_special_tt:0 "Offer a non-aggression pact to the leader of the §YEmpire’s faction§!."
 WET_SKV_D04:0 "An Embassy among the Dead"
 WET_SKV_D04_desc:0 "Negotiate access and intelligence with a consenting Nagash."
 WET_SKV_D04_special_tt:0 "Request Military Access from the Nagashi pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_SKV_D05:0 "The Mortarchs’ Enemies"
 WET_SKV_D05_desc:0 "Agree on targets that serve both sides of the pact."
 WET_SKV_D05_special_tt:0 "Unlock Nagash-alignment operations against hostile Order and Chaos targets."
 WET_SKV_D06:0 "The Emperor in Our Sights"
 WET_SKV_D06_desc:0 "Prepare a named Eshin contract against Karl Franz."
 WET_SKV_D06_special_tt:0 "Authorises an assassination attempt against §YKarl Franz§! through §Y$WET_SKV_O03$§!, while he is alive and Reikland is an enemy unprotected by our treaties."
 WET_SKV_D07:0 "March Beside the Dead"
 WET_SKV_D07_desc:0 "Offer entry into one specific war alongside Nagash."
 WET_SKV_D07_special_tt:0 "Enables decisions to request participation in a war alongside our Nagashi partner. The partner must agree."
 WET_SKV_D08:0 "Terms Even Nagash Must Honour"
 WET_SKV_D08_desc:0 "Protect Skaven autonomy within the military bargain."
 WET_SKV_D08_requirements:0 "At least one completed exchange with an active consenting Nagash pact partner."
 WET_SKV_D08_special_tt:0 "Gain +25 opinion with the active Nagash pact partner after the arms exchange."
 WET_SKV_D09:0 "Thanquol’s Embassy"
 WET_SKV_D09_desc:0 "Send a lawful envoy to the Everchosen’s current court."
 WET_SKV_D09_special_tt:0 "Request Military Access from the Chaos pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_SKV_D10:0 "Knives for the Northern War"
 WET_SKV_D10_desc:0 "Supply covert operations against the Empire and other enemies."
 WET_SKV_D10_special_tt:0 "Authorises §Y$WET_SKV_O03$§! and fortress and supply sabotage against our shared enemies."
 WET_SKV_D11:0 "Deny the Great Necromancer"
 WET_SKV_D11_desc:0 "Prepare to destroy Nagash’s accumulated power source."
 WET_SKV_D11_special_tt:0 "Reduce the Political Power cost of our first §YBlack Pyramid§! expedition by §G50§! after completing §Y$WET_SKV_O09$§!. Requires an enemy Black Pyramid project."
 WET_SKV_D12:0 "March with the Everchosen"
 WET_SKV_D12_desc:0 "Offer a Skaven front in one of Chaos’s current wars."
 WET_SKV_D12_special_tt:0 "Enables decisions to request participation in a war alongside the Everchosen. The partner must agree."
 WET_SKV_D13:0 "Our Price for the Apocalypse"
 WET_SKV_D13_desc:0 "Demand payment and recognition for delivered assistance."
 WET_SKV_D13_requirements:0 "Complete a arms exchange with the active Chaos pact signatory."
 WET_SKV_D13_special_tt:0 "Gain +25 opinion with the active Chaos pact partner after the arms exchange."
 WET_SKV_D14:0 "Rat Envoys at the Imperial Palace"
 WET_SKV_D14_desc:0 "Establish a pact whose terms both governments can enforce."
 WET_SKV_D14_special_tt:0 "Request Military Access from the Imperial pact partner and offer §Y100 Elite Equipment§! in exchange for §Y500 Infantry Equipment§!. Both agreements require acceptance."
 WET_SKV_D15:0 "Secrets of the Northern Hosts"
 WET_SKV_D15_desc:0 "Offer sabotage against Chaos rather than promises of obedience."
 WET_SKV_D15_special_tt:0 "Authorize Everchosen supply raids and assassination contracts against lesser hostile champions."
 WET_SKV_D16:0 "The Enemy of Life Itself"
 WET_SKV_D16_desc:0 "Offer an operation against an hostile Nagash."
 WET_SKV_D16_special_tt:0 "Reduce the Political Power cost of our first §YBlack Pyramid§! expedition by §G50§! after completing §Y$WET_SKV_O09$§!. Requires an enemy project unprotected by our treaties."
 WET_SKV_D17:0 "March Beside the Man-Things"
 WET_SKV_D17_desc:0 "Offer participation in one genuine Imperial defensive war."
 WET_SKV_D17_special_tt:0 "Enables decisions to request participation in a war alongside the Empire. The partner must agree."
 WET_SKV_D18:0 "A Treaty Written in Teeth"
 WET_SKV_D18_desc:0 "Turn useful cooperation into a lasting armed accommodation."
 WET_SKV_D18_requirements:0 "At least one completed exchange with an active consenting Empire pact partner."
 WET_SKV_D18_special_tt:0 "Gain +25 opinion with the active Empire pact partner after the arms exchange."
 WET_SKV_E00:0 "What Shall We Inherit?"
 WET_SKV_E00_desc:0 "Debate whether Skaven supremacy requires a surviving world."
 WET_SKV_E01:0 "The Horned Rat’s Apocalypse"
 WET_SKV_E01_desc:0 "Commit to world-breaking intervention and divine favour."
 WET_SKV_E01_special_tt:0 "Commit to the Horned Rat’s apocalypse. Allows the Morskittar Engine to be fired once its research and launch preparations are complete."
 WET_SKV_E02:0 "A World Worth Ruling"
 WET_SKV_E02_desc:0 "Commit to a lasting surface and subterranean empire."
 WET_SKV_E02_special_tt:0 "Commit to ruling the surviving world. Permanently prohibits the destruction of Morrslieb and allows the Morskittar Engine to be decommissioned."
 WET_SKV_E03:0 "A Covenant with the Shadow Council"
 WET_SKV_E03_desc:0 "Seek Verminlord support for the apocalyptic programme."
 WET_SKV_E03_special_tt:0 "War Support: §G+5%§!.\nClan Rivalry: §R+15§!."
 WET_SKV_E04:0 "The Price of the Falling Moon"
 WET_SKV_E04_desc:0 "Expose the cost to Pestilens and other overseas holdings."
 WET_SKV_E04_special_tt:0 "Open consenting evacuation aid: send 500 infantry equipment to a reachable Skaven realm and prepare its lunar evacuation routes."
 WET_SKV_E05:0 "Authorize the Final Discharge"
 WET_SKV_E05_desc:0 "Grant a completed and secure lunar weapon permission to fire."
 WET_SKV_E05_requirements:0 "Has completed §Y$WET_SKV_T24$§!. The Morskittar Engine is complete and secure, we have committed to the apocalypse, and no treaty prohibits firing."
 WET_SKV_E05_special_tt:0 "Unlocks the final Morskittar Engine firing decision after completion of §Y$WET_SKV_T24$§! and the project’s research, while the firing site remains under our control."
 WET_SKV_E06:0 "Preserve the Favoured"
 WET_SKV_E06_desc:0 "Prepare shelters and a possible divine escape from a dying world."
 WET_SKV_E06_special_tt:0 "Once the capital is controlled and supplies are available, spend §Y500 Infantry Equipment§! on a §Y180-day§! shelter project. Completion grants §G+10% Division Recovery Rate§! for §Y365 days§!."
 WET_SKV_E07:0 "Govern the Stolen Cities"
 WET_SKV_E07_desc:0 "Build an administration for conquered surface holdings."
 WET_SKV_E07_requirements:0 "Begin city repairs: §Y+15%§! Repair Speed for §Y90§! days."
 WET_SKV_E07_special_tt:0 "Begin city repairs: +15% Repair Speed for 90 days."
 WET_SKV_E08:0 "Tribute from Above and Below"
 WET_SKV_E08_desc:0 "Replace destructive competition with enforceable tribute."
 WET_SKV_E08_special_tt:0 "Request §Y300 Infantry Equipment§! and Military Access from eligible peaceful realms. An accepting realm transfers the equipment and gains §G75 Political Power§!."
 WET_SKV_E09:0 "No Master beyond the Council"
 WET_SKV_E09_desc:0 "Prepare to resist any ally who threatens the surviving world."
 WET_SKV_E09_special_tt:0 "Open costly treaty renunciation and anti-apocalypse operations.\nNo immediate betrayal attack."
 WET_SKV_E10:0 "An Empire beneath the Sky"
 WET_SKV_E10_desc:0 "Consolidate holdings into a durable Skaven state."
 WET_SKV_E10_requirements:0 "Own and fully control the fixed southern objective states and current capital."
 WET_SKV_E11:0 "The Age of the Rat"
 WET_SKV_E11_desc:0 "Recognise the campaign outcome actually achieved."
 WET_SKV_E11_requirements:0 "Secure surface dominion, or survive a shattered/stopped lunar weapon with at least three owned states, or receive the shared final-crisis escape outcome."
 WET_SKV_F00:0 "Count Every Warren"
 WET_SKV_F00_desc:0 "Identify all existing Skaven realms and their leaders."
 WET_SKV_F01:0 "The Vermintide Charter"
 WET_SKV_F01_desc:0 "Define membership of Skavenblight’s existing faction."
 WET_SKV_F01_special_tt:0 "Begin inviting independent Skaven realms into the §YVermintide§!. Each realm must accept its invitation."
 WET_SKV_F02:0 "Envoys to the Great Clans"
 WET_SKV_F02_desc:0 "Prepare offers without confusing Council seats and sovereign realms."
 WET_SKV_F02_special_tt:0 "Gain §G25 Political Power§! on the first accepted faction invitation. The faction leader must approve admission."
 WET_SKV_F03:0 "The Northern Warrens"
 WET_SKV_F03_desc:0 "Approach Moulder and Mange in the northern mountains."
 WET_SKV_F03_special_tt:0 "Send faction invitations to §YClan Moulder§! and §YClan Mange§!."
 WET_SKV_F04:0 "Eshin and the Eastern Clans"
 WET_SKV_F04_desc:0 "Reach Eshin, Crooktail, Grutnik and Eskemas overseas and in the east."
 WET_SKV_F04_special_tt:0 "Enables faction invitations to §YClan Eshin§!, §YClan Crooktail§!, §YClan Grutnik§! and §YClan Eskemas§!."
 WET_SKV_F05:0 "Pestilens and the Southern Clans"
 WET_SKV_F05_desc:0 "Seek the southern clans’ participation in the global uprising."
 WET_SKV_F05_special_tt:0 "Enables faction invitations to §YClan Pestilens§!, §YClan Carrion§!, §YClan Skully§! and §YClan Mordkin§!."
 WET_SKV_F06:0 "Clans of the Mountain Roads"
 WET_SKV_F06_desc:0 "Approach the remaining western and mountain Skaven realms."
 WET_SKV_F06_special_tt:0 "Unlock Clan Rictus/Clan Krizzor/Clan Ferrik/Clan Fester/Clan Skrapp/Clan Gritus/Clan Volkn/Clan Skab/Queek's Legion/Clan Verms/Clan Flem invitations."
