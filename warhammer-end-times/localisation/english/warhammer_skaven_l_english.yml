 WET_SKV_F11_desc:0 "Coordinate willing members in shared wars."
 WET_SKV_F11_requirements:0 "At least one consenting member participating in a shared war."
 WET_SKV_F12:0 "No Burrow Left Behind"
 WET_SKV_F12_desc:0 "Address Skaven still outside the faction or under foreign domination."
 WET_SKV_F12_special_tt:0 "Enables faction invitations to independent Skaven realms released during the campaign."
