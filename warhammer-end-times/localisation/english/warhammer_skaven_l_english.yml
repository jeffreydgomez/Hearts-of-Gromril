 WET_SKV_F13_desc:0 "Recognise genuine unity of all existing Skaven states."
 WET_SKV_F13_requirements:0 "All existing Skaven countries, including released countries, are current Vermintide members.\nFaction exists under its leader."
 WET_SKV_F13_special_tt:0 "War Support: §G+3%§!."
 WET_SKV_Fleshcrafter:0 "Council Fleshcrafter"
 WET_SKV_I00:0 "Feed and Arm the Warrens"
 WET_SKV_I00_desc:0 "Audit provisions and production in Skavenblight’s existing heartland."
 WET_SKV_I01:0 "Drain the Blighted Workshops"
 WET_SKV_I01_desc:0 "New workshops rise above the marshes, their furnaces fed by the labour of the warrens below."
 WET_SKV_I02:0 "Warpstone for the Forges"
 WET_SKV_I02_desc:0 "Improve extraction and power efficiency from deposits."
 WET_SKV_I03:0 "Arm the Clanrats"
 WET_SKV_I03_desc:0 "Standardise mass-produced weapons and replacement stocks."
 WET_SKV_I04:0 "The Iranna Foundries"
 WET_SKV_I04_desc:0 "Expand a second industrial centre behind the marshes."
 WET_SKV_I05:0 "The Marsh Convoys"
 WET_SKV_I05_desc:0 "Coastal workshops turn timber and iron into the vessels that carry the Council’s armies and supplies."
 WET_SKV_I06:0 "Wagons for the Vermintide"
 WET_SKV_I06_desc:0 "Improve the field transport serving growing armies."
 WET_SKV_I07:0 "Granaries of the Under-Empire"
 WET_SKV_I07_desc:0 "Store provisions for long campaigns and research sites."
 WET_SKV_I08:0 "The Industrial Council"
 WET_SKV_I08_desc:0 "Coordinate workshops without giving one clan every contract."
 WET_SKV_I08_special_tt:0 "Add 1 Civilian Factory and 1 Military Factory.\nUnbuilt factories will be added when space is available."
 WET_SKV_I09:0 "A Reserve for Every Front"
 WET_SKV_I09_desc:0 "Keep armies equipped when overseas aid becomes unreliable."
 WET_SKV_Ikit:0 "Ikit Claw"
 WET_SKV_O00:0 "The Council’s Hidden Claw"
 WET_SKV_O00_desc:0 "Build an operation service independent of foreign allegiance."
 WET_SKV_O01:0 "Agents beneath Every Street"
 WET_SKV_O01_desc:0 "Agents spread the Council’s call through the streets and warrens. The tolling bells turn whispered promises into support for the coming war."
 WET_SKV_O01_special_tt:0 "War Support: §G+10%§!."
 WET_SKV_O02:0 "Know the Enemy’s Habits"
 WET_SKV_O02_desc:0 "Gather a dossier on a named living target and current location."
 WET_SKV_O02_special_tt:0 "Enables reconnaissance operations costing §Y50 Political Power§! and taking §Y45 days§!. Each dossier covers its target’s current whereabouts and must be renewed if those circumstances change."
 WET_SKV_O03:0 "The Deathmaster’s Contract"
 WET_SKV_O03_desc:0 "Authorise staged assassination operations."
 WET_SKV_O03_special_tt:0 "Unlock OP-KF/OP-TH/OP-LO/OP-CH permissions.\nAlignment and target-specific gates still apply."
 WET_SKV_O04:0 "An Escape Route for Every Knife"
 WET_SKV_O04_desc:0 "Prepare extraction before the attack is attempted."
 WET_SKV_O04_requirements:0 "Prepare escape routes for the Council’s agents."
 WET_SKV_O04_special_tt:0 "Spend §Y100 Elite Equipment§! to permanently add §G10 percentage points§! to covert-operation success, subject to the existing success-chance cap."
 WET_SKV_O05:0 "Steal the Enemy’s Secrets"
 WET_SKV_O05_desc:0 "Organise industrial infiltration and equipment theft."
 WET_SKV_O05_special_tt:0 "Unlock Foundry Theft: 75 Political Power, 60 days.\nBounded technology bonus on successful extraction."
 WET_SKV_O06:0 "Sabotage the Foundries"
 WET_SKV_O06_desc:0 "Attack an enemy’s production infrastructure."
 WET_SKV_O06_special_tt:0 "Unlock foundry sabotage: 100 Political Power, 200 Elite Equipment and 60 days.\nSuccess damages two military factory levels at the recorded capital."
 WET_SKV_O07:0 "The Weapons beneath the Gates"
 WET_SKV_O07_desc:0 "Prepare expensive siege sabotage at named strongholds."
 WET_SKV_O07_special_tt:0 "Unlock breach operations: 100 Political Power/300 Elite Equipment, 60 days, 30-day local bonus."
 WET_SKV_O08:0 "Survey the Necromancer’s Foundations"
 WET_SKV_O08_desc:0 "Prepare a dossier on Nagash’s moving or rebuilt power source."
 WET_SKV_O08_special_tt:0 "Start §Y45 days§! of reconnaissance of the active Black Pyramid. Completion grants a §Y365-day§! dossier for its current construction, adding §G15 percentage points§! to the demolition operation’s success chance."
 WET_SKV_O09:0 "Bring Down the Black Pyramid"
 WET_SKV_O09_desc:0 "Authorize the Council’s major operation against Nagash."
 WET_SKV_O09_special_tt:0 "Unlock OP-BP demolition: 200 Political Power/1000 Elite Equipment/180 days.\nProject location required."
 WET_SKV_O10:0 "Turn the Hunters Aside"
 WET_SKV_O10_desc:0 "Protect the expedition and investigate hostile countermeasures."
 WET_SKV_O10_requirements:0 "Conceal the Council’s hand in its operations."
 WET_SKV_O10_special_tt:0 "For §Y180 days§!, ordinary covert operations delay their defender warning by §Y15 days§!. The Black Pyramid operation uses its own warning schedule."
 WET_SKV_O11:0 "Routes beneath the War"
 WET_SKV_O11_desc:0 "Supply our agents through the tunnels and roads that connect their targets to the warrens. A well-prepared escape can be worth more than the sharpest blade."
 WET_SKV_O11_special_tt:0 "Increase concurrent major operation capacity from one to two.\nEach contract has its own target and cooldown."
 WET_SKV_O12:0 "Masters of the Unseen War"
 WET_SKV_O12_desc:0 "Make successful operations strengthen the Council’s institutions."
 WET_SKV_O12_requirements:0 "Two distinct successful named operations.\nRepeat attempts do not count twice."
 WET_SKV_O12_special_tt:0 "Covert operations cost §G10%§! less Political Power."
 WET_SKV_SeerEngineer:0 "Grey Seer Engineering Delegate"
 WET_SKV_T00:0 "Impossible Things Made Real"
 WET_SKV_T00_desc:0 "Give rival workshops a funded national programme."
 WET_SKV_T00_special_tt:0 "Available as Scientists:\n§Y$WET_SKV_Ikit$§! — Nuclear and Land Warfare\n§Y$WET_SKV_Zingetail$§! — Nuclear and Land Warfare\n§Y$WET_SKV_SeerEngineer$§! — Nuclear Warfare\n§Y$WET_SKV_Fleshcrafter$§! — Land Warfare."
 WET_SKV_T01:0 "The Great Workshops"
 WET_SKV_T01_desc:0 "Reserve research space for the Skaven’s largest inventions."
 WET_SKV_T02:0 "Warpstone Containment"
 WET_SKV_T02_desc:0 "Study containment before attempting an explosive breakthrough."
 WET_SKV_T03:0 "The Fleshcraft Commission"
 WET_SKV_T03_desc:0 "Prepare an agreement between engineers and beast-makers."
 WET_SKV_T03_requirements:0 "The Skryre Engineering Office has not already been funded."
 WET_SKV_T03_special_tt:0 "Establish the §YSkryre Engineering Office§!, providing the engineering expertise required for the §YStormfiend§! Special Project.\nOffer §YClan Moulder§! a service contract."
 WET_SKV_T04:0 "Measure the Dark Moon"
 WET_SKV_T04_desc:0 "Establish the astronomical and magical problem."
 WET_SKV_T05:0 "Commission the Doomsphere"
 WET_SKV_T05_desc:0 "Authorise a distinct nuclear special project."
 WET_SKV_T05_requirements:0 "Fund the Doomsphere research programme."
 WET_SKV_T05_special_tt:0 "Commit §Y500 Elite Equipment§! to unlock the §YDoomsphere§! Special Project. If Clan Skryre leads the Council, also gain §G25 Political Power§!."
 WET_SKV_T06:0 "Shield the Test Warrens"
 WET_SKV_T06_desc:0 "Invest in safeguards before repeated prototypes."
 WET_SKV_T06_requirements:0 "Shield the test warrens."
 WET_SKV_T06_special_tt:0 "Halve the equipment and research-progress losses from the next prototype mishap."
 WET_SKV_T07:0 "A Heart of Unstable Power"
 WET_SKV_T07_desc:0 "Support reactor and containment research."
 WET_SKV_T08:0 "The First Controlled Detonation"
 WET_SKV_T08_desc:0 "Evaluate a completed Doomsphere prototype."
 WET_SKV_T08_requirements:0 "Doomsphere project research completed.\nFacility still owned and controlled."
 WET_SKV_T08_special_tt:0 "Complete the Doomsphere test required to unlock §Y$WET_SKV_T09$§!."
 WET_SKV_T09:0 "An Arsenal of Doomspheres"
 WET_SKV_T09_desc:0 "Provide production and delivery doctrine for nuclear arms."
 WET_SKV_T09_requirements:0 "Has successfully tested a Doomsphere."
 WET_SKV_T09_special_tt:0 "Enables §YDoomsphere§! production. Requires a reactor and the necessary delivery technology."
 WET_SKV_T10:0 "A Bargain with Moulder"
 WET_SKV_T10_desc:0 "Pay for fleshcraft expertise through a valid contract."
 WET_SKV_T10_special_tt:0 "An accepted Moulder service contract grants the Council §G+2% Stability§!."
 WET_SKV_T11:0 "Weapons for Thinking Beasts"
 WET_SKV_T11_desc:0 "Connect Skryre armaments to Moulder’s improved creatures."
 WET_SKV_T12:0 "Commission the Stormfiends"
 WET_SKV_T12_desc:0 "Authorise a distinct land special project."
 WET_SKV_T12_requirements:0 "Fund the Stormfiend research programme."
 WET_SKV_T12_special_tt:0 "Commit §Y400 Elite Equipment§! to unlock the §YStormfiend§! Special Project. If Clan Skryre leads the Council, also gain §G25 Political Power§!."
 WET_SKV_T13:0 "Trials in the Sealed Pens"
 WET_SKV_T13_desc:0 "Choose a weapons package during the prototype programme."
 WET_SKV_T13_special_tt:0 "Choose between ranged firepower and close assault weapons for the Stormfiend prototypes."
 WET_SKV_T14:0 "Breed the Warpacks"
 WET_SKV_T14_desc:0 "Convert proven research into producible formations."
 WET_SKV_T14_requirements:0 "Stormfiend project research completed.\nValid prototype weapons choice."
 WET_SKV_T14_special_tt:0 "Unlock the chosen §YStormfiend§! equipment variant and a division template containing §Y4 Stormfiend battalions§!."
 WET_SKV_T15:0 "Stolen Calculations"
 WET_SKV_T15_desc:0 "Investigate sabotage between the lunar research teams."
 WET_SKV_T15_special_tt:0 "Begin the lunar investigation.\nClan Rivalry: §R+10§!.\nAn event will determine how the stolen plans are recovered."
 WET_SKV_T16:0 "A Hearing Before the Council"
 WET_SKV_T16_desc:0 "Settle the dispute over control of the Warpmoon Project."
 WET_SKV_T16_requirements:0 "The lunar weapon dossier has been prepared."
 WET_SKV_T17:0 "Restore Ikit’s Commission"
 WET_SKV_T17_desc:0 "Appoint Ikit to direct engineering and reclaim his standing."
 WET_SKV_T18:0 "Entrust Zingetail"
 WET_SKV_T18_desc:0 "Give the historical engineer responsibility for the final cannon."
 WET_SKV_T18_special_tt:0 "Zingetail directs the Morskittar Engine: gain §G20 Political Power§! and recover §G10%§! of its initial equipment funding when the project is funded.\nClan Rivalry: §R+15§!."
 WET_SKV_T19:0 "A Seer Oversees the Engineers"
 WET_SKV_T19_desc:0 "Put a Grey Seer director above the engineering team."
 WET_SKV_T20:0 "One Design, One Master"
 WET_SKV_T20_desc:0 "Accept the chosen director and resolve competing authority."
 WET_SKV_T20_special_tt:0 "Clear the lunar-project dispute. If the appointed director dies, a replacement can be commissioned for §Y100 Political Power§! over §Y60 days§!."
 WET_SKV_T21:0 "Raise the Morskittar Complex"
 WET_SKV_T21_desc:0 "Reserve a secure site for the colossal device."
 WET_SKV_T22:0 "Commission the Morskittar Engine"
 WET_SKV_T22_desc:0 "Authorise a distinct lunar-destruction special project."
 WET_SKV_T22_requirements:0 "Fund the Morskittar Engine research programme."
 WET_SKV_T22_special_tt:0 "Commit §Y1,000 Elite Equipment§! to unlock the §YMorskittar Engine§! Special Project. Clan Skryre leadership grants §G25 Political Power§!; Zingetail’s directorship grants §G20 Political Power§! and returns §G100 Elite Equipment§!."
 WET_SKV_T23:0 "The Argument over the Blast"
 WET_SKV_T23_desc:0 "Confront collateral risks and concealed clan calculations."
 WET_SKV_T23_special_tt:0 "Open the prototype crisis: adopt safeguards or accept +15 Rivalry and greater mishap risk."
 WET_SKV_T24:0 "The Final Firing Solution"
 WET_SKV_T24_desc:0 "Certify the completed project for a separate launch decision."
 WET_SKV_T24_requirements:0 "Morskittar Engine project research completed.\nSecure project facility and current director."
 WET_SKV_T24_special_tt:0 ""
 WET_SKV_T25:0 "The Science of Ruin"
 WET_SKV_T25_desc:0 "Build a permanent research institution from one proven programme."
 WET_SKV_T25_requirements:0 "At least one completed Doomsphere project test, Stormfiend project prototype or Morskittar Engine project research.\nOnly one research-slot reward."
 WET_SKV_Thanquol:0 "Grey Seer Thanquol"
 WET_SKV_W00:0 "Prepare the Night of 1000 Sorrows"
 WET_SKV_W00_desc:0 "Informants beneath the southern streets count guards, map arsenals and learn which doors open after dark. When the Council gives its command, the armies and the hidden knives will be ready."
 WET_SKV_W02:0 "East Along the Mountains"
 WET_SKV_W02_desc:0 "Survey the existing eastern mountain approaches."
 WET_SKV_W03:0 "Bring Down Tilea"
 WET_SKV_W03_desc:0 "Claim the human cities surrounding Skavenblight."
 WET_SKV_W03_special_tt:0 "Gain Conquer war goals against hostile rulers holding our objectives in §YTilea§!."
 WET_SKV_W04:0 "Overrun Estalia"
 WET_SKV_W04_desc:0 "Extend the Uprising west into the Estalian kingdoms."
 WET_SKV_W04_special_tt:0 "Gain Conquer war goals against hostile rulers holding our objectives in §YEstalia§!."
 WET_SKV_W05:0 "The Fall of Miragliano"
 WET_SKV_W05_desc:0 "Recognise an victory over Tilea’s capital."
 WET_SKV_W06:0 "The Fall of Magritta"
 WET_SKV_W06_desc:0 "Recognise an victory over Estalia’s capital."
 WET_SKV_W07:0 "The Southern Realms Broken"
 WET_SKV_W07_desc:0 "Secure both southern campaigns and their connecting routes."
 WET_SKV_W07_requirements:0 "Own and fully control all fixed Tilean and Estalian objective states, excluding [U25.GetNameDef] starting states."
 WET_SKV_W08:0 "The Workshops of the South"
 WET_SKV_W08_desc:0 "Bring conquered industry into the Council’s economy."
 WET_SKV_W09:0 "Through the Vaults"
 WET_SKV_W09_desc:0 "Prepare eastward operations along land and tunnel routes."
 WET_SKV_W09_special_tt:0 "Goals against current hostile eastern objective holders.\n+24 hours supply grace for 180 days."
 WET_SKV_W10:0 "Secure the Eastern Footholds"
 WET_SKV_W10_desc:0 "Establish a supplied advance through the mountain campaign region."
 WET_SKV_W10_requirements:0 "Control two non-starting eastern objectives connected to Skavenhold by a passable [U25.GetNameDef]-controlled land route."
 WET_SKV_W11:0 "Support the City of Pillars"
 WET_SKV_W11_desc:0 "Deal with the current winner or surviving claimants of Eight Peaks."
 WET_SKV_W11_special_tt:0 "Request Queek’s cooperation.\nOnce we own and fully control a state in §YEight Peaks§!, recognise its recovery towards the requirements of §Y$WET_SKV_W13$§!."
 WET_SKV_W12:0 "Break the Border Princes"
 WET_SKV_W12_desc:0 "Extend the eastern offensive into the southern principalities."
 WET_SKV_W12_special_tt:0 "Goals on hostile holders of fixed Border Princes objectives.\nAllies excluded."
 WET_SKV_W13:0 "The Eastern Roads Secured"
 WET_SKV_W13_desc:0 "Consolidate a genuine eastern route and regional campaign."
 WET_SKV_W13_requirements:0 "Control two eastern objectives with a passable [U25.GetNameDef]-controlled route.\nAccepted Eight Peaks cooperation or an owned foothold."
 WET_SKV_W14:0 "Open the Southern Roads"
 WET_SKV_W14_desc:0 "Exploit the southern victory on separate western and eastern fronts."
 WET_SKV_W15:0 "The High King’s Last Hold"
 WET_SKV_W15_desc:0 "Commit the Council’s main effort to Karaz-a-Karak."
 WET_SKV_W15_special_tt:0 "Goal on hostile holder of §Y$STATE_588$§!.\nUnlock siege dossier and Dwarf operations."
 WET_SKV_W16:0 "The Kingdom Beyond the Grey Mountains"
 WET_SKV_W16_desc:0 "Commit the Council’s main effort to Bretonnia."
 WET_SKV_W16_special_tt:0 "Goals on hostile holders of fixed Bretonnian homeland objectives.\nExclude treaty partners."
 WET_SKV_W17:0 "Unbar the Everpeak"
 WET_SKV_W17_desc:0 "Prepare Eshin infiltration and Skryre siege support."
 WET_SKV_W17_special_tt:0 "Start §Y45 days§! of reconnaissance against the living High King. Completion grants a dossier valid for §Y365 days§! at his current capital, adding §G15 percentage points§! to applicable covert-operation success."
 WET_SKV_W18:0 "Silence the Great Book"
 WET_SKV_W18_desc:0 "Recognise conquest of the High King’s capital."
 WET_SKV_W19:0 "Under the Knightly Roads"
 WET_SKV_W19_desc:0 "Prepare attacks on Bretonnia’s supply and command network."
 WET_SKV_W19_special_tt:0 "Unlock Sever the Knightly Muster and Royal Hunt operations."
 WET_SKV_W20:0 "The Bells of Couronne"
 WET_SKV_W20_desc:0 "Recognise the fall of Couronne through conquest."
 WET_SKV_W21:0 "The Council’s Continental Dominion"
 WET_SKV_W21_desc:0 "Administer the holdings earned by the selected campaign."
 WET_SKV_W21_requirements:0 "Karaz-a-Karak, Bretonnia OR Border Princes campaign outcome remains secured."
 WET_SKV_W22:0 "The Borderlands Overrun"
 WET_SKV_W22_desc:0 "Recognise an conquest of the southern principalities."
 WET_SKV_W22_requirements:0 "Own and fully control two fixed Border Princes objective states."
 WET_SKV_W23:0 "Tolls beneath Every Pass"
 WET_SKV_W23_desc:0 "Organise the conquered passes as a permanent frontier."
 WET_SKV_W23_special_tt:0 "Add 1 Military Factory.\nSupply Consumption: §G-5%§! in the controlled Border Princes."
