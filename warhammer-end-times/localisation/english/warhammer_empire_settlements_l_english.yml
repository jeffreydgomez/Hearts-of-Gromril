l_english:
 wet_rei_empire_settlements:0 "The Restored Empire"
 wet_rei_empire_settlements_desc:0 "Settle the place of our fellow Imperial realms within the restored Empire."
 wet_rei_imperial_partnership:0 "Imperial Partnership"
 wet_rei_imperial_partnership_desc:0 "The realm retains its own crown and troops within the Empire. Its military benefits last while it remains in Reikland’s faction."
 wet_rei_partner_authority:0 "Authority of the Imperial Partners"
 wet_rei_partner_authority_desc:0 "Political Power gain increases by 5% for each settled Imperial partner that remains in our faction."
 wet_rei_settlement_unlock_tt:0 "Unlocks §Y25 Political Power§! decisions to integrate or recognize each §YAI-controlled Imperial homeland member§! of our faction as a partner."
 wet_rei_settlement_choice_tt:0 "Choose full integration or an Imperial partnership."
 wet_rei_settlement_absorb_tt:0 "Absorb this realm, core all its owned states, and receive its armed forces and equipment stockpile."
 wet_rei_settlement_partner_tt:0 "They gain §G10§! Stability and §G10§! War Support, plus §G20%§! Division Organization, Organization Recovery and Defense while in our faction. We gain §G3§! Stability and §G5%§! Political Power gain for each retained partner."
 wet_rei_settlement_absorb:0 "Unite the realm under the Imperial crown."
 wet_rei_settlement_partner:0 "We are partners."
 wet_rei_settlement_cancel:0 "The settlement can no longer proceed. Return our investment."
 wet_rei_settlement_pending:0 "An Imperial settlement is awaiting Reikland’s decision"
 wet_rei_settlement_resolved:0 "This realm’s Imperial settlement has been concluded"
 wet_rei_imperial_partner:0 "Recognized as a partner in the restored Empire"
 wet_rei_settle_A02:0 "Settle the place of [A02.GetNameDef]"
 wet_rei_settle_A02_desc:0 "Decide whether [A02.GetNameDef] should join a unified Imperial state or remain a partner with its own government and army."
 wet_empire_settlement.1.t:0 "The Place of [A02.GetNameDef]"
 wet_empire_settlement.1.d:0 "The restoration of the Empire has brought [A02.GetNameDef] to a constitutional crossroads. We may unite its lands and forces with our own, or recognize its government as an Imperial partner. A partnership strengthens their army and lends our government authority for as long as they remain in our faction."
