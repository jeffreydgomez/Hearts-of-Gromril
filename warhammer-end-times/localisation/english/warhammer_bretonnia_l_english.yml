 wet_brt_everchosen_defeated_focus_requirement_tt:0 "The Everchosen’s realm has been defeated."
 wet_brt_everchosen_goal:0 "Prepare the Errentry war Declaration"
 wet_brt_everchosen_goal_desc:0 "Prepare a 180-day war goal against the current independent Everchosen. The separate declaration remains deliberate and rechecks the host, route and diplomatic rules."
 wet_brt_everchosen_goal_effect:0 "Prepare a §Y180§!-day war goal against the current independent Everchosen. The separate declaration remains deliberate and rechecks the host, route and diplomatic rules."
