 wet_brt_everchosen_war_focus_requirement_tt:0 "At war with the Everchosen or a member of the Everchosen’s faction."
 wet_brt_fay_protected:0 "Fay Protected"
 wet_brt_fay_protected_desc:0 "The Fay Enchantress is sheltered by the Crown’s preparations. Her counsel sustains the loyal host."
 wet_brt_friendship:0 "An Accepted Asur Understanding"
 wet_brt_guard_staff:0 "Secure the Staff’s Sanctuary"
 wet_brt_guard_staff_desc:0 "Spend thirty days securing the one recorded Staff at its actual controlled site. If custody is disputed, recover that same item; changes of site, controller or generation cancel the operation."
 wet_brt_guard_staff_effect:0 "Spend thirty days securing the one recorded Staff at its actual controlled site. If custody is disputed, recover that same item; changes of site, controller or generation cancel the operation."
 wet_brt_guard_staff_requirements:0 "Spend thirty days securing the one recorded Staff at its actual controlled site. If custody is disputed, recover that same item; changes of site, controller or generation cancel the operation."
 wet_brt_hunt_kemmler:0 "Bring Kemmler to Judgment"
 wet_brt_hunt_kemmler_desc:0 "Spend 75 PP and 30 days investigating the captured necromancer. Actual custody must last throughout; the fee is consumed if the location or living prisoner is lost. One attempt per custody generation."
 wet_brt_hunt_kemmler_effect:0 "Spend §Y75§! Political Power and §Y30§! days investigating the captured necromancer. Actual custody must last throughout; the fee is consumed if the location or living prisoner is lost. One attempt per custody generation."
 wet_brt_hunt_kemmler_requirements:0 "Spend §Y75§! Political Power and §Y30§! days investigating the captured necromancer. Actual custody must last throughout; the fee is consumed if the location or living prisoner is lost. One attempt per custody generation."
 wet_brt_incursion_focus_requirement_tt:0 "Kairos’s daemonic host has arrived and we are at war with it."
 wet_brt_k04:0 "Learn the Wight King’s Methods"
 wet_brt_k04_desc:0 "Krell’s legend should not become an excuse for panic. Teach the host to recognise and resist the methods of his guard."
 wet_brt_k05:0 "Ward the Burial Grounds"
 wet_brt_k05_desc:0 "Graves behind the line can become a second front. Give the local guardians the means to watch and defend them."
 wet_brt_k08:0 "Break the Barrow Host"
 wet_brt_k08_desc:0 "The host must destroy the force behind the raids. Plans alone cannot claim the necromancer’s stronghold."
 wet_brt_muster:0 "Muster"
 wet_brt_muster_desc:0 "The Grail bells summon the kingdom to face the breach. Smiths and captains hurry their work while the danger lasts."
 wet_brt_o08:0 "Stand in the Grand Alliance"
 wet_brt_o08_desc:0 "A pledge becomes real only when both sides accept it. Confirm the realm’s lawful place among its allies."
 wet_brt_o14:0 "A Vow Beyond the Kingdom"
 wet_brt_o14_desc:0 "The kingdom’s survival is bound to the fate of its neighbours. Renew the vow to fight while an ally can still hold the line."
 wet_brt_preparation_focus_requirement_tt:0 "The Mousillon rebellion has not begun, and Mousillon remains independent and outside our faction."
 wet_brt_prison_access_K10:0 "Request Access to the Necromantic Prisoners"
