l_english:
 WET_BRT_BlackRegency:0 "Black Court Regency"
 WET_BRT_C00:0 "The Crown Under Siege"
 WET_BRT_C00_desc:0 "The quarrel with the Black Knight has become a war. Every duke must now answer with deeds."
 WET_BRT_C00_requirements:0 "The first actual [A15.GetNameDef]–[A20.GetNameDef] war began, regardless of aggressor; crown crisis occurred."
 WET_BRT_C01:0 "Call the Loyal Dukes"
 WET_BRT_C01_desc:0 "The king still has subjects willing to stand beside him. Give them a common command before fear divides them."
 WET_BRT_C01_special_tt:0 "Reduce the remaining disorder timer by 30 days, once; no reversal of lost territory."
 WET_BRT_C02:0 "The Green Knight Returns"
 WET_BRT_C02_desc:0 "An ancient champion answers the kingdom’s peril. His challenge will stake the hope of the crown on a single combat."
 WET_BRT_C02_requirements:0 "Civil war active; unique living Green Knight and living incumbent Mousillon leader."
 WET_BRT_C02_special_tt:0 "Commit to the Green Knight route; enable C04."
 WET_BRT_C03:0 "The Lady Blesses the King"
 WET_BRT_C03_desc:0 "The Lady’s favour can strengthen the king who still stands. The realm will rally around its living sovereign."
 WET_BRT_C03_requirements:0 "Civil war active; current Bretonnian king alive and in office."
 WET_BRT_C03_special_tt:0 "Commit to the incumbent ruler; division defence +5% and organisation +5% while the civil war lasts."
 WET_BRT_C04:0 "Challenge the Black Knight"
 WET_BRT_C04_desc:0 "The challenge has been issued before both hosts. The champion’s fate will be felt far beyond the place of combat."
 WET_BRT_C04_requirements:0 "Both saved participants still alive, available and leading their sides in this war."
 WET_BRT_C04_special_tt:0 "Exactly 50%: Green Knight dies; 50%: Mousillon ruler dies. Losing side: -30% attack, -30% defence, -25% organisation for 180 days or war end; -15 war-support points once."
 WET_BRT_C05:0 "Consecrate the Royal Banner"
 WET_BRT_C05_desc:0 "The host needs a visible pledge that the king remains with it. Carry the consecrated banner where the line is hardest pressed."
 WET_BRT_C06:0 "Steady the Shaken Ranks"
 WET_BRT_C06_desc:0 "War tests the faith of even the steadfast. Officers must turn grief or renewed courage into disciplined service."
 WET_BRT_C06_special_tt:0 "If Bretonnia has Broken Legend, reduce its combat penalties from 30/30/25% to 20/20/15% for its remaining duration; otherwise +5% recovery for 90 days."
 WET_BRT_C07:0 "Muster the Remaining Host"
 WET_BRT_C07_desc:0 "The crown must know what strength it still commands. Reorganise the surviving formations without pretending the lost men have returned."
 WET_BRT_C08:0 "Keep the Road to Couronne"
 WET_BRT_C08_desc:0 "The royal seat must remain connected to its defenders. The host will prepare to hold the road or fight its way back."
 WET_BRT_C09:0 "Arm the Parish Levies"
 WET_BRT_C09_desc:0 "The villages have more at stake than their lords’ quarrel. Supply their levies through the workshops that still answer the king."
 WET_BRT_C09_special_tt:0 "Infantry equipment production cost -10% for 180 days; does not create free troops."
 WET_BRT_C10:0 "Break the Rebel Hosts"
 WET_BRT_C10_desc:0 "The crown’s armies are ready to fight for more than survival. Concentrate them against the rebel strength that keeps the war alive."
 WET_BRT_C10_special_tt:0 "Division attack +10% against Mousillon for 90 days, once."
 WET_BRT_C11:0 "Restore the Ducal Peace"
 WET_BRT_C11_desc:0 "The fighting has ended in a settlement the crown can uphold. Royal justice must now replace the commands of war."
 WET_BRT_C11_requirements:0 "Royalist victory or accepted lawful peace; capital secure, no live claimant war."
 WET_BRT_C11_special_tt:0 "End only this civil-war crisis; open restoration. No unfinished combat focus required."
 WET_BRT_C12:0 "Crown Gilles le Breton"
 WET_BRT_C12_desc:0 "The returning champion has revealed the king beneath the legend. Let the restored realm decide its crown in the light of that revelation."
 WET_BRT_C12_requirements:0 "Green Knight survived the duel and revelation; royalist victory; Gilles alive."
 WET_BRT_C12_special_tt:0 "Make the existing unique Green Knight/Gilles the king; preserve living Louen as a unique High Paladin, subject to role legality."
 WET_BRT_C13:0 "Confirm the Reigning King"
 WET_BRT_C13_desc:0 "The realm still has a crown to which it can swear. Renew its authority without inventing a fallen champion’s return."
 WET_BRT_C13_requirements:0 "Lady chosen, Green Knight dead/unavailable, duel cancelled or unresolved at peace, or no champion chosen."
 WET_BRT_C13_special_tt:0 "Keep the living current king; stability +5 points. Existing marshal Geraud d’Aquitaine serves as regent if no incumbent survives."
 WET_BRT_C14:0 "Heal the Divided Realm"
 WET_BRT_C14_desc:0 "A defeated enemy does not mend every feud. Restore courts and local obligations without demanding another war."
 WET_BRT_C14_special_tt:0 "Stability +5 points; civilian construction +10% for 180 days."
 WET_BRT_C15:0 "Restore Mousillon’s Towns"
 WET_BRT_C15_desc:0 "The cursed duchy must become a place people can live again. Begin with the towns the crown actually controls."
 WET_BRT_C16:0 "The King’s Justice Returns"
 WET_BRT_C16_desc:0 "The peace must outlast the armies that imposed it. Reopen the ordinary institutions through which subjects can seek redress."
 WET_BRT_C17:0 "A Kingdom Whole Again"
 WET_BRT_C17_desc:0 "The crown has survived the rebellion and begun to repair its wounds. It can choose its next duty with a united voice."
 WET_BRT_D00:0 "Omens in the Sacred Waters"
 WET_BRT_D00_desc:0 "The sacred waters reflect a sky the peasants cannot see. The court will listen before the warning becomes a wound."
 WET_BRT_D01:0 "Count the Companions’ Relics"
 WET_BRT_D01_desc:0 "The tombs of the Companions are scattered across the realm. Their keepers must be able to warn one another."
 WET_BRT_D02:0 "A Watch on the Unnatural"
 WET_BRT_D02_desc:0 "A sudden breach leaves little time for deliberation. Train riders to carry reports directly to the royal command."
 WET_BRT_D03:0 "Sound the Grail Bells"
 WET_BRT_D03_desc:0 "The warnings can no longer be dismissed. Summon the defenders while there is still time to choose their ground."
 WET_BRT_D03_requirements:0 "[R07.GetNameDef] warning has actually fired."
 WET_BRT_D03_special_tt:0 "Sound the emergency muster and rally the host. Costs 100 Political Power."
 WET_BRT_D04:0 "Contain the Breach"
 WET_BRT_D04_desc:0 "The daemons have found their way into the kingdom. The host must contain their foothold before pursuing distant victories."
 WET_BRT_D04_special_tt:0 "Division defence +10% against R07 for 120 days."
 WET_BRT_D05:0 "Shield the Pilgrim Roads"
 WET_BRT_D05_desc:0 "Fear can empty the roads before the enemy arrives. Patrol the routes that carry supplies and the wounded."
 WET_BRT_D05_special_tt:0 "Army attrition -10% for 120 days during the invasion."
 WET_BRT_D06:0 "Bring the Grail Host Together"
 WET_BRT_D06_desc:0 "Scattered courage cannot close a widening breach. Gather the realm’s veteran formations under one plan."
 WET_BRT_D06_special_tt:0 "25 Army XP; +10% planning for 120 days during the invasion."
 WET_BRT_D07:0 "Break the Daemonic Foothold"
 WET_BRT_D07_desc:0 "The daemons still need ground from which to fight. Concentrate the host against their foothold in Bretonnia."
 WET_BRT_D07_special_tt:0 "One-use 90-day +10% division attack against R07; no instant victory."
 WET_BRT_D08:0 "The Incursion Has Ended"
 WET_BRT_D08_desc:0 "The kingdom must know that the immediate breach is closed. A report of silence is not enough while the enemy still holds our land."
 WET_BRT_D08_requirements:0 "Incursion resolved: it spawned, [R07.GetNameDef] war ended, and every occupied Bretonnian site was liberated."
 WET_BRT_D09:0 "Repair the Desecrated Shrines"
 WET_BRT_D09_desc:0 "Desecration leaves fear behind after the fighting ends. Restore the shrines where lawful access permits the work."
 WET_BRT_D10:0 "Bring the Displaced Home"
 WET_BRT_D10_desc:0 "The living must recover the homes the host defended. Help displaced households return to secure districts."
 WET_BRT_D10_special_tt:0 "Civilian construction +10% for 180 days; no invented population award."
 WET_BRT_D11:0 "Lessons of the Year of Woe"
 WET_BRT_D11_desc:0 "The price of ignorance has been paid in blood. Preserve the lessons so the next warning finds a better-prepared realm."
 WET_BRT_D12:0 "A Watch That Does Not Sleep"
 WET_BRT_D12_desc:0 "The end of one invasion is no promise of lasting safety. Keep the warning network alive after the emergency passes."
 WET_BRT_D13:0 "The Relics Endure"
 WET_BRT_D13_desc:0 "The kingdom has survived an enemy from beyond its shores. Its defenders can now look beyond the places they have saved."
 WET_BRT_E00:0 "Survey the Royal Domains"
 WET_BRT_E00_desc:0 "The strength of the host begins with the work of the realm. Count the roads, fields and workshops before demanding more from them."
 WET_BRT_E01:0 "Market Charters"
 WET_BRT_E01_desc:0 "Secure markets bring craftsmen and farmers together. Royal charters will give their investments a predictable home."
 WET_BRT_E02:0 "Roads Between the Duchies"
 WET_BRT_E02_desc:0 "The harvest is useless where no cart can carry it. Repair the roads linking the royal heartland."
 WET_BRT_E03:0 "The Royal Arms Contracts"
 WET_BRT_E03_desc:0 "A grand muster needs more than promises of service. The crown will commission arms before the levy assembles."
 WET_BRT_E04:0 "Bordeleaux Shipyards"
 WET_BRT_E04_desc:0 "Bordeleaux links the kingdom to the western sea. Its yards need space for the work ahead."
 WET_BRT_E05:0 "The Cloth Towns"
 WET_BRT_E05_desc:0 "Cloth binds village labour to urban trade. Support the workshops that turn that trade into lasting prosperity."
 WET_BRT_E06:0 "Granaries of the South"
 WET_BRT_E06_desc:0 "A bad harvest should not empty the army’s wagons. Store a portion of abundance where the next campaign can reach it."
 WET_BRT_E07:0 "Forges of Bastonne"
 WET_BRT_E07_desc:0 "The realm’s armourers cannot meet royal orders alone. Additional forges will turn those orders into equipment."
 WET_BRT_E08:0 "The L’Anguille Yards"
 WET_BRT_E08_desc:0 "One port cannot bear the whole burden of war at sea. Expand the northern yards as a second centre."
 WET_BRT_E09:0 "Stewards of the Treasury"
 WET_BRT_E09_desc:0 "Feudal dues lose much on the road to the treasury. Accountable stewards will put more of that revenue to work."
 WET_BRT_E10:0 "Managed Forests"
 WET_BRT_E10_desc:0 "Timber supports ships, engines and homes alike. Better stewardship will improve the yield of existing woodland."
 WET_BRT_E11:0 "Artisans of War"
 WET_BRT_E11_desc:0 "Specialist tools are needed behind every regiment. Give skilled artisans the workshops to make them."
 WET_BRT_E12:0 "Merchant Convoy Contracts"
 WET_BRT_E12_desc:0 "Merchants and admirals rely on the same sea roads. Standard contracts will make replacement transports easier to build."
 WET_BRT_E13:0 "Fairs of the United Kingdom"
 WET_BRT_E13_desc:0 "The duchies prosper when trade crosses their boundaries. Royal fairs will connect their crafts and markets."
 WET_BRT_E14:0 "Quarries and Ore Surveys"
 WET_BRT_E14_desc:0 "The masons and smiths need dependable supplies. Survey existing workings and improve extraction before opening new projects."
 WET_BRT_E15:0 "Royal Manufactories"
 WET_BRT_E15_desc:0 "Repeated wartime orders justify permanent workshops. The crown will keep skilled workers together between campaigns."
 WET_BRT_E15_special_tt:0 "1 military factory credit; factory output +5%."
 WET_BRT_E16:0 "Repair Berths and Escort Schools"
 WET_BRT_E16_desc:0 "Ships must return to service as well as leave the yards. Repair crews and escorts will train for the same campaigns."
 WET_BRT_E17:0 "A Network of Baggage Roads"
 WET_BRT_E17_desc:0 "The realm’s stores must reach the armies that need them. Coordinate wagon routes with the existing supply network."
 WET_BRT_E18:0 "The Great Royal Arsenal"
 WET_BRT_E18_desc:0 "A reserve of production can sustain a long campaign. Expand the arsenal without drawing the whole kingdom into one vulnerable city."
 WET_BRT_E18_special_tt:0 "1 military factory credit; production efficiency cap +5%."
 WET_BRT_E19:0 "A Kingdom That Can Sustain War"
 WET_BRT_E19_desc:0 "Lasting strength rests on trade and production together. The crown will coordinate them without exhausting the harvest."
 WET_BRT_Gilles:0 "Gilles le Breton"
 WET_BRT_GreenKnight:0 "The Green Knight"
 WET_BRT_K00:0 "The Shadow in the Grey Mountains"
 WET_BRT_K00_desc:0 "Kemmler’s dead gather beyond the settled valleys. The crown must decide whether to carry war to him or prepare to meet his return."
 WET_BRT_K00_special_tt:0 "Request Access to the Fallen Stronghold. Search the fallen Barrow Court when its halls are accessible. Preparations take 7 days. Work begins when its access and supply requirements are met."
 WET_BRT_K01:0 "Strike Before the Dead March"
 WET_BRT_K01_desc:0 "The necromancer’s present weakness may not last. Prepare a campaign against his actual mountain stronghold."
 WET_BRT_K01_requirements:0 "[A74.GetNameDef] exists, independent, lawful enemy, peaceful with [A15.GetNameDef]; viable route."
 WET_BRT_K01_special_tt:0 "180-day conquest goal against hostile A74."
 WET_BRT_K02:0 "Keep Watch on the Mountain Passes"
 WET_BRT_K02_desc:0 "The crown may choose to hold its strength at home. A prepared frontier can make the necromancer pay for his return."
 WET_BRT_K02_special_tt:0 "Division defence +5% against Barrow Legion while defending from its aggression; reactive entry remains available after attack."
 WET_BRT_K03:0 "Muster the Border Lords"
 WET_BRT_K03_desc:0 "The mountain lords know the paths the dead must take. Bring their knowledge into the royal command."
 WET_BRT_K04:0 "Learn the Wight King’s Methods"
 WET_BRT_K04_desc:0 "Krell’s legend should not become an excuse for panic. Teach the host to recognise and resist the methods of his guard."
 WET_BRT_K05:0 "Ward the Burial Grounds"
 WET_BRT_K05_desc:0 "Graves behind the line can become a second front. Give the local guardians the means to watch and defend them."
 WET_BRT_K06:0 "Guard La Maisontaal"
 WET_BRT_K06_desc:0 "The monastery shelters things a necromancer covets. Its guardians need a plan before an enemy appears at the walls."
 WET_BRT_K06_special_tt:0 "Secure the Staff’s sanctuary. Preparations take 30 days. Work begins when its access and supply requirements are met."
 WET_BRT_K07:0 "Answer the Necromancer’s Return"
 WET_BRT_K07_desc:0 "The warning has become an attack. Meet the returning host with the preparations the kingdom actually made."
 WET_BRT_K07_requirements:0 "[A74.GetNameDef] actually attacked [A15.GetNameDef]; no forced resurrection of an annexed [A74.GetNameDef]."
 WET_BRT_K07_special_tt:0 "Division attack and defence +10% against Barrow Legion for 90 days; one activation."
 WET_BRT_K08:0 "Break the Barrow Host"
 WET_BRT_K08_desc:0 "The host must destroy the force behind the raids. Plans alone cannot claim the necromancer’s stronghold."
 WET_BRT_K08_requirements:0 "Actual war against [A74.GetNameDef]."
 WET_BRT_K09:0 "Seal the Mountain Stronghold"
 WET_BRT_K09_desc:0 "Kemmler’s power in the mountains has been broken. Secure the place from which his surviving servants might rebuild."
 WET_BRT_K09_requirements:0 "[A74.GetNameDef] threat defeated; Greycliff Pass §Y$STATE_896$§! held by [A15.GetNameDef] or consenting nonhostile partner."
 WET_BRT_K10:0 "Hunt the Necromancer"
 WET_BRT_K10_desc:0 "A fallen stronghold is not proof that its master died there. Pursue evidence before declaring the hunt complete."
 WET_BRT_K10_special_tt:0 "Request Access to the Necromantic Prisoners. Bring the captured Kemmler to judgment. Preparations take 30 days and cost 75 Political Power. Work begins when its access and supply requirements are met."
 WET_BRT_K11:0 "Deny Krell a New Master"
 WET_BRT_K11_desc:0 "A wight may survive the defeat of the army that carried him. His remains must be found before they can be secured."
 WET_BRT_K11_special_tt:0 "Request Access to the Necromantic Prisoners."
 WET_BRT_K12:0 "Keep the Staff from the Dead"
 WET_BRT_K12_desc:0 "A relic is safe only while its custodians remain safe. Record who actually holds the staff and plan from that truth."
 WET_BRT_K12_requirements:0 "Successful relic operation and safe current Staff custody; if lost, recover the recorded item."
 WET_BRT_K13:0 "The Southern Watch Endures"
 WET_BRT_K13_desc:0 "The kingdom cannot hunt every shadow forever. Leave a prepared watch while the main host answers larger dangers."
 WET_BRT_Krell:0 "Krell"
 WET_BRT_O00:0 "Beyond the Wars of Dukes"
 WET_BRT_O00_desc:0 "The kingdom’s quarrels are part of a greater danger. Listen to the lands already facing the Everchosen."
 WET_BRT_O01:0 "Envoys to the Empire"
 WET_BRT_O01_desc:0 "The Empire’s struggle will shape Bretonnia’s future. Send envoys who can offer practical cooperation."
 WET_BRT_O01_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_BRT_O02:0 "Hear Kislev’s Warning"
 WET_BRT_O02_desc:0 "The northern kingdom has faced the storm first. Its warnings can prepare the host even when its borders have fallen."
 WET_BRT_O02_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_BRT_O03:0 "The Dwarfen Road"
 WET_BRT_O03_desc:0 "A road east needs partners who can keep it open. Negotiate passage without claiming the holds through which it runs."
 WET_BRT_O03_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_BRT_O04:0 "Prepare an Expeditionary Host"
 WET_BRT_O04_desc:0 "Distant service must not empty every castle at home. Organise a host from the soldiers and equipment the realm can spare."
 WET_BRT_O05:0 "Couriers of the Grand Alliance"
 WET_BRT_O05_desc:0 "Common danger demands dependable communication. Let the royal court seek a place in the alliance that actually exists."
 WET_BRT_O05_special_tt:0 "Request a Seat in the Grand Alliance. Request an Allied Relief Base."
 WET_BRT_O06:0 "Secure the Kingdom Behind Us"
 WET_BRT_O06_desc:0 "A host cannot march east while its own crown is falling. Confirm that the immediate crises have truly ended."
 WET_BRT_O06_special_tt:0 "Open outward commitment without requiring completion of the research, economy, preparation or restoration branches."
 WET_BRT_O07:0 "Proclaim the Errentry war"
 WET_BRT_O07_desc:0 "The realm will take its courage beyond its borders. Let this Errentry war answer the threat to every kingdom."
 WET_BRT_O07_requirements:0 "Commit the host to the Errantry War. Costs §Y100§! Political Power."
 WET_BRT_O07_special_tt:0 "Commit the host to the Errantry War. Costs 100 Political Power."
 WET_BRT_O08:0 "Stand in the Grand Alliance"
 WET_BRT_O08_desc:0 "A pledge becomes real only when both sides accept it. Confirm the realm’s lawful place among its allies."
 WET_BRT_O08_requirements:0 "Actual consenting alliance membership; no focus-created membership."
 WET_BRT_O09:0 "Ride to the Empire’s Relief"
 WET_BRT_O09_desc:0 "The road to the threatened cities must be open in fact. Commit the existing host along an agreed and supplied route."
 WET_BRT_O09_requirements:0 "Legal war entry, accepting host, actual access and connected supply route."
 WET_BRT_O09_special_tt:0 "Prepare the Errantry War against the current Everchosen."
 WET_BRT_O10:0 "The High Paladin Leads"
 WET_BRT_O10_desc:0 "A living champion can give the host a common purpose. Let the leader who remains available take the field."
 WET_BRT_O10_special_tt:0 "Living Louen becomes unique field commander if eligible; otherwise existing eligible royal commander gains 25 Army XP programme. No forced death."
 WET_BRT_O11:0 "Defend the Imperial Cities"
 WET_BRT_O11_desc:0 "The host has come to protect cities and their people. Its mission must follow the places still under threat."
 WET_BRT_O11_special_tt:0 "Choose actual defended city: Altdorf first if still threatened, otherwise a consenting ally’s current threatened capital; +10% defence locally for 120 days."
 WET_BRT_O12:0 "Break the Everchosen’s Vanguard"
 WET_BRT_O12_desc:0 "The enemy’s advance is sustained by armies that can be beaten. Strike the real vanguard rather than chasing an absent name."
 WET_BRT_O13:0 "Gather the Surviving Banners"
 WET_BRT_O13_desc:0 "Every surviving banner carries experience the alliance needs. Reorganise the real remnants without conjuring a replacement host."
 WET_BRT_O14:0 "A Vow Beyond the Kingdom"
 WET_BRT_O14_desc:0 "The kingdom’s survival is bound to the fate of its neighbours. Renew the vow to fight while an ally can still hold the line."
 WET_BRT_O15:0 "Until the Last Banner Falls"
 WET_BRT_O15_desc:0 "No prophecy can decide the outcome of a battle not yet fought. The host will honour the living by continuing their defence."
 WET_BRT_P00:0 "The Shadow of Mousillon"
 WET_BRT_P00_desc:0 "The Black Knight’s realm stands apart from the crown. Peace gives us time to prepare for the quarrel that remains."
 WET_BRT_P01:0 "Watch the Black Knight"
 WET_BRT_P01_desc:0 "Mousillon’s court gathers dangerous company. Royal agents will distinguish rumour from the forces moving against us."
 WET_BRT_P02:0 "Inspect the Feudal Muster"
 WET_BRT_P02_desc:0 "Every duke promises service. Inspect the men and equipment behind those promises."
 WET_BRT_P03:0 "A Council for the Coming Crisis"
 WET_BRT_P03_desc:0 "The crown needs a plan before loyalties are tested. The council will prepare lawful commands for the first days of rebellion."
 WET_BRT_P03_special_tt:0 "Initial civil-war stability loss falls from 20 to 15 points."
 WET_BRT_P04:0 "Demand the Rebel’s Submission"
 WET_BRT_P04_desc:0 "The king may choose to settle the challenge before it grows. Prepare a public demand backed by a real campaign plan."
 WET_BRT_P04_special_tt:0 "Demand Mousillon’s Submission."
 WET_BRT_P05:0 "Bind Artois to the Crown"
 WET_BRT_P05_desc:0 "The lords of Artois must choose where their duty lies. Renew their obligations while the king can still bargain from peace."
 WET_BRT_P05_special_tt:0 "Keep eligible Artois §Y$STATE_45$§! loyal when the civil war begins."
 WET_BRT_P06:0 "Renew the Oaths of Lyonesse"
 WET_BRT_P06_desc:0 "Old rivalries can become new rebellions. Resolve the grievances that make Lyonesse vulnerable to the Black Knight."
 WET_BRT_P06_special_tt:0 "Keep eligible Lyonesse §Y$STATE_744$§! loyal at civil-war onset."
 WET_BRT_P07:0 "Secure Carcassonne’s Allegiance"
 WET_BRT_P07_desc:0 "The southern lords expect their burdens to be heard. Bind their border service to the crown’s protection."
 WET_BRT_P07_special_tt:0 "Keep eligible Carcassone §Y$STATE_170$§! loyal at civil-war onset."
 WET_BRT_P08:0 "Appoint Loyal Captains"
 WET_BRT_P08_desc:0 "An oath must reach the men who give orders in the field. Confirm captains whose loyalty survives their lord’s uncertainty."
 WET_BRT_P08_special_tt:0 "Reduces the civil-war penalty to Maximum Organization from §R−20%§! to §R−10%§!."
 WET_BRT_P09:0 "Audit the Royal Armouries"
 WET_BRT_P09_desc:0 "Some armouries hold lists where weapons should be. Inspect their stores before calling the levies."
 WET_BRT_P09_special_tt:0 "Civil-war factory-output penalty falls from -20% to -10%."
 WET_BRT_P10:0 "Contracts with the Master Smiths"
 WET_BRT_P10_desc:0 "A crisis cannot wait for every duke to place a separate order. Royal contracts will keep the forges ready."
 WET_BRT_P11:0 "Reserve Mounts for the Host"
 WET_BRT_P11_desc:0 "Knights cannot replace lost mounts by proclamation. Invest in the breeders and keepers who sustain a campaign."
 WET_BRT_P12:0 "Engines Against the Dead"
 WET_BRT_P12_desc:0 "The dead will not break at the sight of a knight’s banner. Prepare engines that can break their formations."
 WET_BRT_P13:0 "The Royal War Council"
 WET_BRT_P13_desc:0 "Ducal armies must be able to fight as one host. Establish a staff that can make their plans agree."
 WET_BRT_P14:0 "A Plan for Every Duchy"
 WET_BRT_P14_desc:0 "Rebellion can scatter orders and armies alike. Prepare regional plans before the messengers stop arriving."
 WET_BRT_P14_special_tt:0 "Civil-war division attack/defence penalties fall from -15% to -5%."
 WET_BRT_P15:0 "The King’s Couriers"
 WET_BRT_P15_desc:0 "A clear command may arrive too late to matter. Maintain trusted riders along the kingdom’s principal roads."
 WET_BRT_P15_special_tt:0 "Civil-war war-support loss falls from 15 to 5 points."
 WET_BRT_P16:0 "Exercise the Ducal Levies"
 WET_BRT_P16_desc:0 "The levies must practise the plans they are expected to follow. Great musters will test their coordination while the kingdom is still at peace."
 WET_BRT_P17:0 "Guard the Grail Shrines"
 WET_BRT_P17_desc:0 "Sacred sites are also vulnerable gathering places. Their guardians must be ready for more than pilgrims."
 WET_BRT_P17_special_tt:0 "Defensive preparation: army recovery +5% during the first 180 days of the civil war."
 WET_BRT_P18:0 "Protect the Fay Enchantress"
 WET_BRT_P18_desc:0 "The crown cannot treat the Lady’s servants as beyond danger. Organise escorts and secure places of refuge."
 WET_BRT_P18_special_tt:0 "Protects the Fay Enchantress during the coming rebellion. When the rebellion begins, gain §G+10%§! Division Recovery Rate for §Y180 days§!."
 WET_BRT_P19:0 "Expose the Necromantic Courts"
 WET_BRT_P19_desc:0 "The Black Knight’s allies work behind respectable names. The crown will map their networks before striking them."
 WET_BRT_P19_special_tt:0 "Enemy operative capture chance +10%; without the agency DLC, one 50% recon research bonus instead. Neither alters duel odds."
 WET_BRT_P20:0 "Depots for a Long Campaign"
 WET_BRT_P20_desc:0 "Victory may take more than a season. Distribute stores so that one defeat cannot empty the host’s reserve."
 WET_BRT_P20_special_tt:0 "1 military factory credit; army supply consumption -5%."
 WET_BRT_P21:0 "The Duchies Stand Ready"
 WET_BRT_P21_desc:0 "The levies have their orders and their captains. Hold one final muster before the Black Knight tests them."
 WET_BRT_P22:0 "The Crown Rearmed"
 WET_BRT_P22_desc:0 "The armouries and the watch now serve the same plan. Turn the kingdom’s preparations into a force ready to move."
 WET_BRT_P23:0 "Meet Rebellion Fully Prepared"
 WET_BRT_P23_desc:0 "Rarely has the realm answered a crisis with every pledge fulfilled. Let the Black Knight find a kingdom already under arms."
 WET_BRT_P23_special_tt:0 "Remove the opening Disordered Kingdom package entirely if completed before onset; loyalty protections remain. No cancellation of the war."
 WET_BRT_RoyalRegency:0 "Royal Regency"
 WET_BRT_T00:0 "The Weight of Tradition"
 WET_BRT_T00_desc:0 "The kingdom honours old victories. Its workshops must also learn from new defeats."
 WET_BRT_T01:0 "Take Stock of Our Learning"
 WET_BRT_T01_desc:0 "Ducal libraries guard knowledge behind custom. A royal catalogue will show what the realm actually knows."
 WET_BRT_T02:0 "Patrons of the Practical Arts"
 WET_BRT_T02_desc:0 "Useful inventions need patrons as much as poets do. The crown will sponsor craftsmen with answers to ordinary problems."
 WET_BRT_T03:0 "Permit Useful Innovation"
 WET_BRT_T03_desc:0 "Custom should serve the kingdom. The king will protect craftsmen whose work offends habit alone."
 WET_BRT_T04:0 "Schools for Royal Clerks"
 WET_BRT_T04_desc:0 "A realm cannot improve what it cannot record. Train clerks to keep consistent accounts across the duchies."
 WET_BRT_T05:0 "The Guilds Petition the Crown"
 WET_BRT_T05_desc:0 "The guilds ask for dependable charters. Their obligations will include training the next generation of craftsmen."
 WET_BRT_T06:0 "Translate Foreign Manuals"
 WET_BRT_T06_desc:0 "Foreign craft need not demand foreign allegiance. Translators will make useful methods available to Bretonnian masters."
 WET_BRT_T07:0 "A Royal Patent Office"
 WET_BRT_T07_desc:0 "The crown will distinguish useful invention from empty promises. A lasting institution can protect improvements beyond one patron’s lifetime."
 WET_BRT_T08:0 "Measure the Smiths’ Work"
 WET_BRT_T08_desc:0 "A spearhead should fit the shaft sent to receive it. Common measures will reduce waste between workshops."
 WET_BRT_T09:0 "Lessons from Imperial Engineers"
 WET_BRT_T09_desc:0 "Imperial techniques offer much to study. Our own workshops can test those lessons without surrendering their craft."
 WET_BRT_T09_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_BRT_T10:0 "The Mathematics of Siegecraft"
 WET_BRT_T10_desc:0 "Walls and engines answer to more than courage. The royal engineers will teach the calculation behind their work."
 WET_BRT_T11:0 "Damsels and Natural Philosophy"
 WET_BRT_T11_desc:0 "The Damsels see dangers that ordinary instruments miss. Their counsel can sit beside careful observation."
 WET_BRT_T12:0 "Learning Without Dishonour"
 WET_BRT_T12_desc:0 "Chivalry need not forbid curiosity. Royal protection will end the remaining penalties imposed on practical scholarship."
 WET_BRT_T13:0 "Masterwork Harness"
 WET_BRT_T13_desc:0 "Good armour joins skill with repeatable craft. Master armourers will teach the workshops that equip the host."
 WET_BRT_T14:0 "The Shipwrights’ Academy"
 WET_BRT_T14_desc:0 "The fleet depends on accumulated experience. A permanent school will preserve the lessons of every voyage."
 WET_BRT_T15:0 "Parravon’s Flight Studies"
 WET_BRT_T15_desc:0 "The sky is another battlefield to understand. Riders and keepers will share their knowledge of winged creatures."
 WET_BRT_T16:0 "Chivalry in a Changing World"
 WET_BRT_T16_desc:0 "The realm can keep its vows while changing its methods. Tradition will guide learning instead of holding it back."
 WET_BRT_T17:0 "The Royal Academy of Couronne"
 WET_BRT_T17_desc:0 "Scholarship needs a home that survives its founders. Couronne will gather the kingdom’s practical learning into one academy."
 WET_DIRECT_D03_bretonnia_builder:0 "Sound the emergency muster and rally the host. Costs 100 Political Power."
 WET_DIRECT_K00_bretonnia_builder:0 "Request Access to the Fallen Stronghold. Search the fallen Barrow Court when its halls are accessible. Preparations take 7 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_K01_bretonnia_builder:0 "180-day conquest goal against hostile A74."
 WET_DIRECT_K06_bretonnia_builder:0 "Secure the Staff’s sanctuary. Preparations take 30 days. Work begins when its access and supply requirements are met."
 WET_DIRECT_K10_bretonnia_builder:0 "Request Access to the Necromantic Prisoners. Bring the captured Kemmler to judgment. Preparations take 30 days and cost 75 Political Power. Work begins when its access and supply requirements are met."
 WET_DIRECT_K11_bretonnia_builder:0 "Request Access to the Necromantic Prisoners."
 WET_DIRECT_O01_bretonnia_builder:0 "Send the diplomatic offers described by this focus."
 WET_DIRECT_O02_bretonnia_builder:0 "Send the diplomatic offers described by this focus."
 WET_DIRECT_O03_bretonnia_builder:0 "Send the diplomatic offers described by this focus."
 WET_DIRECT_O05_bretonnia_builder:0 "Request a Seat in the Grand Alliance. Request an Allied Relief Base."
 WET_DIRECT_O07_bretonnia_builder:0 "Commit the host to the Errantry War. Costs 100 Political Power."
 WET_DIRECT_O09_bretonnia_builder:0 "Prepare the Errantry War against the current Everchosen."
 WET_DIRECT_P04_bretonnia_builder:0 "Demand Mousillon’s Submission."
 WET_DIRECT_T09_bretonnia_builder:0 "Send the diplomatic offers described by this focus."
 wet_arc_loyalty:0 "Loyalty"
 wet_bretonnia.100.0:0 "Rally the loyal duchies."
 wet_bretonnia.100.0_effect:0 "Mousillon and the Crown are at war. The oaths and preparations already secured will determine which duchies stay loyal and how quickly the royal host recovers."
 wet_bretonnia.100.0_outcome:0 "Rallies loyal dukedoms to the Crown."
 wet_bretonnia.100.d:0 "The quarrel over Bretonnia’s crown has passed beyond the reach of heralds. Rival banners rise over the duchies as knights prepare to settle by the sword what the courts could not settle by oath."
 wet_bretonnia.100.t:0 "The Claimant War"
 wet_bretonnia.101.0:0 "We must still hold together."
 wet_bretonnia.101.d:0 "The news spreads in disbelieving whispers: the Green Knight has fallen. Those who once looked for his banner in the darkest hour must now face the battle without it."
 wet_bretonnia.101.t:0 "The Green Knight Falls"
 wet_bretonnia.102.0:0 "The war is not yet won."
 wet_bretonnia.102.d:0 "The rebel ruler has fallen, leaving his followers to argue over a cause suddenly deprived of its champion. Across the camps, victory cries mingle with fear of what will follow."
 wet_bretonnia.102.t:0 "The Rebel Ruler Falls"
 wet_bretonnia.103.0:0 "Decline the request."
 wet_bretonnia.103.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.103.1:0 "Accept the terms."
 wet_bretonnia.103.1_effect:0 "Confirm the end of the claimant war and recognise the reigning government. Neither side transfers land, equipment or its ruler."
 wet_bretonnia.103.1_outcome:0 "Recognises the reigning Bretonnian government."
 wet_bretonnia.103.d:0 "The Crown asks the dukes to set their seals upon a common peace. Too many Bretonnian swords have been turned against fellow subjects while darker enemies waited beyond the borders."
 wet_bretonnia.103.t:0 "Recognise the Ducal Peace"
 wet_bretonnia.104.0:0 "Decline the request."
 wet_bretonnia.104.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.104.1:0 "Accept the terms."
 wet_bretonnia.104.1_effect:0 "Permit Bretonnian inspectors to examine the actual necromantic prisoners or remains in our custody and conduct the agreed judgment or sealing. Custody, access and the physical prison must remain valid throughout."
 wet_bretonnia.104.d:0 "Bretonnian envoys have arrived seeking news of prisoners held within our realm. They ask leave to inspect the captives, their courteous words sharpened by concern for those who have disappeared."
 wet_bretonnia.104.t:0 "Bretonnian Inspectors Seek the Prisoners"
 wet_bretonnia.105.0:0 "Refuse the ultimatum."
 wet_bretonnia.105.0_effect:0 "Bretonnia offers recognition beneath the Crown or a renewed claim by force. Accepting preserves our ruler, army and existing wars; both countries must be outside factions. Reply within thirty days; silence refuses."
 wet_bretonnia.105.1:0 "Accept the Crown’s protection."
 wet_bretonnia.105.1_effect:0 "Bretonnia offers recognition beneath the Crown or a renewed claim by force. Accepting preserves our ruler, army and existing wars; both countries must be outside factions. Reply within thirty days; silence refuses."
 wet_bretonnia.105.d:0 "The Crown’s herald has delivered its demand before our court. Bretonnia’s ruler expects the fealty of the duchies, and patience with defiance is wearing thin."
 wet_bretonnia.105.t:0 "The Crown Demands Submission"
 wet_bretonnia.106.0:0 "Decline the request."
 wet_bretonnia.106.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.106.1:0 "Accept the terms."
 wet_bretonnia.106.1_effect:0 "Grant Bretonnia military access and permission to plan relief from our current government. This does not join a faction or enter a war."
 wet_bretonnia.106.d:0 "Royal envoys ask that the roads be opened to Bretonnian troops. Their captains promise an orderly march, though villagers will judge that promise when the horses arrive."
 wet_bretonnia.106.t:0 "Royal Envoys Seek Passage"
 wet_bretonnia.107.0:0 "Decline the request."
 wet_bretonnia.107.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.107.1:0 "Accept the terms."
 wet_bretonnia.107.1_effect:0 "Agree to a non-aggression pact with Bretonnia. Membership and military commitments remain separate decisions."
 wet_bretonnia.107.d:0 "Bretonnia proposes a peace between our borders while greater dangers gather elsewhere. Both courts may gain more by sheathing their swords than by testing one another’s defences."
 wet_bretonnia.107.t:0 "A Pact of Mutual Restraint"
 wet_bretonnia.108.0:0 "Decline the request."
 wet_bretonnia.108.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.108.1:0 "Accept the terms."
 wet_bretonnia.108.1_effect:0 "Grant Bretonnia military access and permission to plan relief from our current government. This does not join a faction or enter a war."
 wet_bretonnia.108.d:0 "Royal envoys ask that the roads be opened to Bretonnian troops. Their captains promise an orderly march, though villagers will judge that promise when the horses arrive."
 wet_bretonnia.108.t:0 "Royal Envoys Seek Passage"
 wet_bretonnia.109.0:0 "Decline the request."
 wet_bretonnia.109.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.109.1:0 "Accept the terms."
 wet_bretonnia.109.1_effect:0 "Agree to a non-aggression pact with Bretonnia. Membership and military commitments remain separate decisions."
 wet_bretonnia.109.d:0 "Bretonnia proposes a peace between our borders while greater dangers gather elsewhere. Both courts may gain more by sheathing their swords than by testing one another’s defences."
 wet_bretonnia.109.t:0 "A Pact of Mutual Restraint"
 wet_bretonnia.110.0:0 "Decline the request."
 wet_bretonnia.110.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.110.1:0 "Accept the terms."
 wet_bretonnia.110.1_effect:0 "Deliver one additional §Y50%§! industry research bonus to Bretonnia for §Y50§! Political Power, paid only if this exchange is accepted."
 wet_bretonnia.110.d:0 "Bretonnian envoys propose an exchange of learning with Imperial craftsmen and scholars. The proud traditions of both realms may yet find room for something useful from the other."
 wet_bretonnia.110.t:0 "Imperial Technical Exchange"
 wet_bretonnia.111.0:0 "Decline the request."
 wet_bretonnia.111.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.111.1:0 "Accept the terms."
 wet_bretonnia.111.1_effect:0 "Accept §Y250§! infantry equipment from Bretonnia’s existing stores. The stocks and transport route are rechecked on acceptance; all shipments share a ninety-day cooldown."
 wet_bretonnia.111.d:0 "A royal convoy waits at the frontier with weapons for our soldiers. Its escort carries the Crown’s assurance that friendship should be measured in deeds as well as words."
 wet_bretonnia.111.t:0 "Royal Arms for Our Friends"
 wet_bretonnia.112.0:0 "Decline the request."
 wet_bretonnia.112.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.112.1:0 "Accept the terms."
 wet_bretonnia.112.1_effect:0 "Accept §Y250§! infantry equipment from Bretonnia’s existing stores. The stocks and transport route are rechecked on acceptance; all shipments share a ninety-day cooldown."
 wet_bretonnia.112.d:0 "A royal convoy waits at the frontier with weapons for our soldiers. Its escort carries the Crown’s assurance that friendship should be measured in deeds as well as words."
 wet_bretonnia.112.t:0 "Royal Arms for Our Friends"
 wet_bretonnia.113.0:0 "Decline the request."
 wet_bretonnia.113.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.113.1:0 "Accept the terms."
 wet_bretonnia.113.1_effect:0 "Admit Bretonnia with the current leader’s consent at §Y100%§! tension, or under Reikland’s existing §Y25%§! coalition mandate and Everchosen-war veto. No new faction or threshold exception is created."
 wet_bretonnia.113.d:0 "Bretonnia’s heralds have come to seek a place among the allied realms. Their vows speak of honour, but the northern reports make clear how much more than honour is at stake."
 wet_bretonnia.113.t:0 "Bretonnia Seeks the Grand Alliance"
 wet_bretonnia.114.0:0 "Decline the request."
 wet_bretonnia.114.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.114.1:0 "Accept the terms."
 wet_bretonnia.114.1_effect:0 "Grant access and consent to relief operations from your current government. No troops, wars or ownership are transferred."
 wet_bretonnia.114.1_outcome:0 "Permits a Bretonnian relief force to operate from our territory."
 wet_bretonnia.114.d:0 "Bretonnian captains ask leave to establish a relief force within our borders. Their banners may bring reassurance to the frontier, if we are willing to receive them."
 wet_bretonnia.114.t:0 "Host a Bretonnian Relief Force"
 wet_bretonnia.115.0:0 "Decline the request."
 wet_bretonnia.115.0_effect:0 "Decline without payment or forced commitments."
 wet_bretonnia.115.1:0 "Accept the terms."
 wet_bretonnia.115.1_effect:0 "Permit Bretonnian inspection and passage to the captured Grey Mountain stronghold. No territory, forces or relics are transferred."
 wet_bretonnia.115.1_outcome:0 "Permits Bretonnian security operations in our territory."
 wet_bretonnia.115.d:0 "Bretonnia asks leave to act against the dangers gathering near our realm. Its commanders promise protection, but our court must decide how much freedom to grant a foreign army."
 wet_bretonnia.115.t:0 "Consent to Bretonnian Security Operations"
 wet_brt_C06:0 "Steady the Shaken Ranks"
 wet_brt_C06_desc:0 "War tests the faith of even the steadfast. Officers must turn grief or renewed courage into disciplined service."
 wet_brt_C09:0 "Arm the Parish Levies"
 wet_brt_C09_desc:0 "The villages have more at stake than their lords’ quarrel. Supply their levies through the workshops that still answer the king."
 wet_brt_C10:0 "Break the Rebel Hosts"
 wet_brt_C10_desc:0 "The crown’s armies are ready to fight for more than survival. Concentrate them against the rebel strength that keeps the war alive."
 wet_brt_C14:0 "Heal the Divided Realm"
 wet_brt_C14_desc:0 "A defeated enemy does not mend every feud. Restore courts and local obligations without demanding another war."
 wet_brt_D04:0 "Contain the Breach"
 wet_brt_D04_desc:0 "The daemons have found their way into the kingdom. The host must contain their foothold before pursuing distant victories."
 wet_brt_D05:0 "Shield the Pilgrim Roads"
 wet_brt_D05_desc:0 "Fear can empty the roads before the enemy arrives. Patrol the routes that carry supplies and the wounded."
 wet_brt_D06:0 "Bring the Grail Host Together"
 wet_brt_D06_desc:0 "Scattered courage cannot close a widening breach. Gather the realm’s veteran formations under one plan."
 wet_brt_D07:0 "Break the Daemonic Foothold"
 wet_brt_D07_desc:0 "The daemons still need ground from which to fight. Concentrate the host against their foothold in Bretonnia."
 wet_brt_D10:0 "Bring the Displaced Home"
 wet_brt_D10_desc:0 "The living must recover the homes the host defended. Help displaced households return to secure districts."
 wet_brt_K07:0 "Answer the Necromancer’s Return"
 wet_brt_K07_desc:0 "The warning has become an attack. Meet the returning host with the preparations the kingdom actually made."
 wet_brt_alliance:0 "Request a Seat in the Grand Alliance"
 wet_brt_alliance_desc:0 "Apply to the actual current Order alliance leader under ordinary joining law or Reikland’s already earned coalition transaction."
 wet_brt_alliance_effect:0 "Apply to the actual current Order alliance leader under ordinary joining law or Reikland’s already earned coalition transaction."
 wet_brt_alliance_requirements:0 "Apply to the actual current Order alliance leader under ordinary joining law or Reikland’s already earned coalition transaction."
 wet_brt_barrow_watch:0 "Watch on the Grey Mountains"
 wet_brt_barrow_watch_desc:0 "Watch on the Grey Mountains"
 wet_brt_blessed_defence:0 "The Blessed Royal Banner"
 wet_brt_blessed_defence_desc:0 "The royal banner carries the blessing of the Lady. The host gathers beneath it against the claimant."
 wet_brt_blessed_king:0 "The Lady’s Blessing"
 wet_brt_blessed_king_desc:0 "The Lady has entrusted her favour to the reigning king. His people look to that living sovereign as the war divides the realm."
 wet_brt_broken:0 "Broken Legend"
 wet_brt_broken_desc:0 "The death of a champion has shaken the host. Its captains must hold the army together while a living government takes command."
 wet_brt_broken_rallied:0 "Broken Legend"
 wet_brt_broken_rallied_desc:0 "The captains have steadied the host, though the loss still weighs on every banner. The surviving government must finish the war."
 wet_brt_c05:0 "Consecrate the Royal Banner"
 wet_brt_c05_desc:0 "The host needs a visible pledge that the king remains with it. Carry the consecrated banner where the line is hardest pressed."
 wet_brt_c07:0 "Muster the Remaining Host"
 wet_brt_c07_desc:0 "The crown must know what strength it still commands. Reorganise the surviving formations without pretending the lost men have returned."
 wet_brt_campaigns:0 "The Defence of Bretonnia"
 wet_brt_campaigns_desc:0 "Follow the current requirements before committing the realm’s people and resources. Negotiated commitments require the other government’s consent."
 wet_brt_cancelled_duel_rally:0 "Rally Behind the Living Crown"
 wet_brt_cancelled_duel_rally_desc:0 "A cancelled challenge leaves the kingdom with its living government. Gain 25 Army XP once; this does not award the Lady’s exclusive focus."
 wet_brt_cancelled_duel_rally_requirements:0 "A cancelled challenge leaves the kingdom with its living government. Gain §Y25§! Army XP once; this does not award the Lady’s exclusive focus."
 wet_brt_city_defence:0 "Bretonnian Relief of the City"
 wet_brt_city_relief:0 "Defend an Allied Capital"
 wet_brt_city_relief_desc:0 "Commit existing Bretonnian forces to the current threatened capital of a consenting ally for 120 days. Defence applies locally to Bretonnian troops; no ownership is transferred. Altdorf is the preferred eligible city."
 wet_brt_city_relief_effect:0 "Commit existing Bretonnian forces to the current threatened capital of a consenting ally for §Y120§! days. Defence applies locally to Bretonnian troops; no ownership is transferred. Altdorf is the preferred eligible city."
 wet_brt_city_relief_requirements:0 "Commit existing Bretonnian forces to the current threatened capital of a consenting ally for §Y120§! days. Defence applies locally to Bretonnian troops; no ownership is transferred. Altdorf is the preferred eligible city."
 wet_brt_civil_war_focus_requirement_tt:0 "The Mousillon rebellion has begun and we are at war with Mousillon."
 wet_brt_commitment_focus_requirement_tt:0 "The Mousillon conflict is settled, Kairos’s host has been driven out, and no Barrow Legion troops occupy our homeland."
 wet_brt_construction:0 "The Royal Works Ledger"
 wet_brt_construction_desc:0 "Follow the current requirements before committing the realm’s people and resources. Negotiated commitments require the other government’s consent."
 wet_brt_construction_effect:0 "Complete earned works at owned, fully controlled sites, within each type cap and actual shared slots. Blocked allocations persist."
 wet_brt_construction_outcome_tt:0 "Completes pending construction at the designated sites. Unbuilt allocations remain available."
 wet_brt_construction_requirements:0 "Complete earned works at owned, fully controlled sites, within each type cap and actual shared slots. Blocked allocations persist."
 wet_brt_counter_subversion:0 "The Necromantic Dossier"
 wet_brt_counter_subversion_desc:0 "The Crown’s agents have traced the hidden necromantic courts. Their watch closes paths by which hostile agents once passed unseen."
 wet_brt_d02:0 "A Watch on the Unnatural"
 wet_brt_d02_desc:0 "A sudden breach leaves little time for deliberation. Train riders to carry reports directly to the royal command."
 wet_brt_declare_a20:0 "Declare War — Mousillon"
 wet_brt_declare_a20_desc:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least 1.25 times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_declare_a20_effect:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least §Y1.25§! times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_declare_a20_requirements:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least §Y1.25§! times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_declare_a74:0 "Declare War — Barrow Legion"
 wet_brt_declare_a74_desc:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least 1.25 times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_declare_a74_effect:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least §Y1.25§! times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_declare_a74_requirements:0 "Deliberately declare the prepared war under current diplomatic rules. The AI additionally requires at least §Y1.25§! times the defending bloc’s deployed manpower. Either side beginning the Mousillon war triggers the same crisis."
 wet_brt_diplomacy:0 "Royal Embassies"
 wet_brt_diplomacy_desc:0 "Follow the current requirements before committing the realm’s people and resources. Negotiated commitments require the other government’s consent."
 wet_brt_dismantle_krell:0 "Dismantle the Captured Wight King"
 wet_brt_dismantle_krell_desc:0 "The captured Wight King must be physically held at the fallen court for fourteen days before his body can become sealed remains. Losing the prison cancels the work."
 wet_brt_dismantle_krell_effect:0 "The captured Wight King must be physically held at the fallen court for fourteen days before his body can become sealed remains. Losing the prison cancels the work."
 wet_brt_dismantle_krell_outcome_tt:0 "Dismantles Krell’s body, leaving his remains ready to be sealed."
 wet_brt_dismantle_krell_requirements:0 "The captured Wight King must be physically held at the fallen court for fourteen days before his body can become sealed remains. Losing the prison cancels the work."
 wet_brt_disorder:0 "Disordered Kingdom"
 wet_brt_disorder_desc:0 "The royal host struggles to make sense of divided loyalties and broken musters."
 wet_brt_doctrine_bonus:0 "Lessons of Bretonnia"
 wet_brt_e12:0 "Merchant Convoy Contracts"
 wet_brt_e12_desc:0 "Merchants and admirals rely on the same sea roads. Standard contracts will make replacement transports easier to build."
 wet_brt_emergency_muster:0 "Sound the Emergency Muster"
 wet_brt_emergency_muster_desc:0 "Spend 100 PP once for 120 days of faster training and increased output during the warning or invasion. This effort cannot overlap the Errentry war effort."
 wet_brt_emergency_muster_effect:0 "Spend §Y100§! Political Power once for §Y120§! days of faster training and increased output during the warning or invasion. This effort cannot overlap the Errentry war effort."
 wet_brt_emergency_muster_requirements:0 "Spend §Y100§! Political Power once for §Y120§! days of faster training and increased output during the warning or invasion. This effort cannot overlap the Errentry war effort."
 wet_brt_errentry_effort:0 "Commit to the Errentry war"
 wet_brt_errentry_effort_desc:0 "Spend 100 PP once for 120 days of +10% attack and breakthrough against current Everchosen belligerents. This cannot overlap the Kairos emergency muster."
