 wet_id_060_repayment_desc:0 "A temporary effect of Float the Campaign Bond. See the listed modifiers for its exact effect."
 wet_id_001:0 "Raise a New Herdstone — [FROM.GetName]"
 wet_id_001_desc:0 "Raise a New Herdstone.\n\nSelected state, for your country: local organisation recovery +15%; enemy attrition +15 percentage points."
 wet_id_002:0 "Sound the Furnace Bell"
 wet_id_002_desc:0 "Sound the Furnace Bell.\n\nNational: military factory output +15%."
 wet_id_003:0 "Swear the Warband Oaths"
 wet_id_003_desc:0 "Swear the Warband Oaths.\n\nImmediately gain 15 Army Experience. National: war support +15 percentage points."
 wet_id_004:0 "Thicken the Veil"
 wet_id_004_desc:0 "Thicken the Veil.\n\nNational: army organisation recovery +15%."
 wet_id_005:0 "Call the Captains to Account"
 wet_id_005_desc:0 "Call the Captains to Account.\n\nImmediately gain 200 Infantry Arms II, 25 Elite Equipment I. National: war support +15 percentage points."
 wet_id_006:0 "Enter a Debt in the Ledger — [FROM.GetName]"
 wet_id_006_desc:0 "Enter a Debt in the Ledger.\n\nNational: defence on core territory +15%. Regaining ownership and full control of the chosen state awards 50 Political Power once and ends the mission; each state can pay only once per campaign."
 wet_id_007:0 "Call the Long Mist"
 wet_id_007_desc:0 "Call the Long Mist.\n\nNational: army defence +15%; agency counterintelligence +1 points."
 wet_id_008:0 "Gather the Small Hands — [FROM.GetName]"
 wet_id_008_desc:0 "Gather the Small Hands.\n\nSelected state, for your country: local land-fort construction speed +15%. Immediately repair up to one damaged building level in EACH owned, fully controlled state. Healthy states do nothing; this grants no new building level. Priority: infrastructure, civilian factory, military factory, supply hub, railway, dockyard, air base, naval base, land fort, coastal fort, anti-air, radar, Food storage, then other building types alphabetically."
 wet_id_009:0 "Let the Roots Remember — [FROM.GetName]"
 wet_id_009_desc:0 "Let the Roots Remember.\n\nSelected state, for your country: local organisation recovery +15%; resistance target −15 percentage points."
 wet_id_010_infrastructure:0 "Pay the Stone-Haulers — Roadworks — [FROM.GetName]"
 wet_id_010_infrastructure_desc:0 "Pay the Stone-Haulers.\n\nSelected state, for your country: local infrastructure construction speed +25%."
 wet_id_010_fort:0 "Pay the Stone-Haulers — Fortworks — [FROM.GetName]"
 wet_id_010_fort_desc:0 "Pay the Stone-Haulers.\n\nSelected state, for your country: local land-fort construction speed +25%."
 wet_id_011:0 "Declare a Scrap Holiday"
 wet_id_011_desc:0 "Declare a Scrap Holiday.\n\nNational: equipment capture +15 percentage points. Immediately repair up to one damaged building level in EACH owned, fully controlled state. Healthy states do nothing; this grants no new building level. Priority: infrastructure, civilian factory, military factory, supply hub, railway, dockyard, air base, naval base, land fort, coastal fort, anti-air, radar, Food storage, then other building types alphabetically."
 wet_id_012:0 "Promise the Moon on a Stick"
