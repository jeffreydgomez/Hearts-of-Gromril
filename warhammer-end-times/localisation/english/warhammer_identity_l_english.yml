 wet_id_014:0 "Recall the Citizen Companies"
 wet_id_014_desc:0 "Recall the Citizen Companies.\n\nImmediately gain 2,500 manpower. National: Realm Infantry organisation +15%."
 wet_id_015:0 "Sell the Second Map — [FROM.GetName]"
 wet_id_015_desc:0 "Sell the Second Map.\n\nAfter buyer consent, the buyer pays you 75 Political Power and immediately gains 15 Army Intel and 15 Civilian Intel on the selected enemy. Intel then decays normally. Your net Political Power gain is 50 after the initial fee."
 wet_id_016:0 "Convene the Emergency Guilds"
 wet_id_016_desc:0 "Convene the Emergency Guilds.\n\nNational: civilian factory construction speed +15%. Immediately repair up to one damaged building level in EACH owned, fully controlled state. Healthy states do nothing; this grants no new building level. Priority: infrastructure, civilian factory, military factory, supply hub, railway, dockyard, air base, naval base, land fort, coastal fort, anti-air, radar, Food storage, then other building types alphabetically."
 wet_id_017:0 "Reconcile the Sacred Plaques"
