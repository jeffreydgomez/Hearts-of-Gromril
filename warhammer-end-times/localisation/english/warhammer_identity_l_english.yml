 wet_id_choose_trade_subject:0 "Sell Intelligence on [FROM.GetNameDef]"
 wet_id_choose_trade_subject_desc:0 "Choose the subject of the map offered to the buyer. The buyer must be fighting this country and you must have at least 30% network strength here."
 wet_id_trade_send_tt:0 "Send the selected buyer a 14-day offer. They may pay 75 Political Power for +15 Army Intel and +15 Civilian Intel on this target. Refusal or expiry refunds our 25 Political Power fee."
 wet_id_015_exposed:0 "Identity diplomacy"
 wet_identity.15.t:0 "A Second Map for Sale"
 wet_identity.15.d:0 "A broker from [wet_identity_seller.GetNameDef] offers intelligence on [wet_identity_subject.GetNameDef]. The map costs 75 Political Power and immediately provides 15 Army Intel and 15 Civilian Intel. We have fourteen days to accept; the information then decays normally."
 wet_identity.15.accept:0 "Pay for the intelligence."
 wet_identity.15.decline:0 "Decline the offer."
 wet_id_trade_accept_tt:0 "Pay 75 Political Power. Gain 15 Army Intel and 15 Civilian Intel on the proposed enemy.\nThe seller receives the payment. This does not create an alliance or require us to join another war."
