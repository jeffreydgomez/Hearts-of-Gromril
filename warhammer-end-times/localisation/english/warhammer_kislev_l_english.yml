 wet_kislev.100.0:0 "Return to the campaign."
 wet_kislev.100.d:0 "Surveyors have returned from the northern works with mud on their boots and frost in their beards. Their reports show where Kislev’s scarce labour can do the most good."
 wet_kislev.100.t:0 "The Northern Construction Ledger"
 wet_kislev.101.0:0 "Decline the request."
 wet_kislev.101.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.101.1:0 "Accept the terms."
 wet_kislev.101.1_effect:0 "Allow both countries to move existing troops through each other’s territory. No faction membership, troop transfer or war follows."
 wet_kislev.101.d:0 "Kislev’s envoys ask that our armies be allowed to pass freely between the two realms. Against the dangers gathering in the north, a road barred to a friend may prove a costly precaution."
 wet_kislev.101.t:0 "Mutual Military Access"
 wet_kislev.102.0:0 "Decline the request."
 wet_kislev.102.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.102.1:0 "Accept the terms."
 wet_kislev.102.1_effect:0 "Transfer §Y500§! infantry equipment from the donor’s actual stockpile to Kislev. The first successful agreement with this donor is free."
 wet_kislev.102.d:0 "An appeal from Kislev describes troops holding the northern roads with worn weapons and dwindling stores. Their quartermasters ask whether our arsenals can spare something for the struggle."
 wet_kislev.102.t:0 "Northern Arms Aid"
 wet_kislev.103.0:0 "Decline the request."
 wet_kislev.103.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.103.1:0 "Accept the terms."
 wet_kislev.103.1_effect:0 "Open talks over material assistance to the northern frontier. This is a preliminary compact, without alliance membership."
 wet_kislev.103.d:0 "Kislev’s representatives have come to Altdorf seeking closer cooperation. They bring lessons learned on a harsh frontier, and an urgent desire to learn what the Empire can offer in return."
 wet_kislev.103.t:0 "Cooperation at Altdorf"
 wet_kislev.104.0:0 "Decline the request."
 wet_kislev.104.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.104.1:0 "Accept the terms."
 wet_kislev.104.1_effect:0 "Ask [U04.GetNameDef] for §Y250§! infantry + §Y100§! Elite Equipment from its stocks; recipient may refuse."
 wet_kislev.104.d:0 "Kislev has appealed to the holds for engineers and supplies. The northern defences would be stronger with Dwarfen craft behind them, if the High King is willing to lend his aid."
 wet_kislev.104.t:0 "Dwarfen Engineers and Supplies"
 wet_kislev.105.0:0 "Decline the request."
 wet_kislev.105.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.105.1:0 "Accept the terms."
 wet_kislev.105.1_effect:0 "Ask [A15.GetNameDef] for §Y250§! Cavalry Horses + §Y5§!,§Y000§! Food from its stocks; recipient may refuse."
 wet_kislev.105.d:0 "Kislevite riders have arrived seeking mounts fit for a long northern campaign. Our stables could help replenish their exhausted squadrons, and perhaps strengthen the friendship between our courts."
 wet_kislev.105.t:0 "Bretonnian Remounts"
 wet_kislev.106.0:0 "Decline the request."
 wet_kislev.106.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.106.1:0 "Accept the terms."
 wet_kislev.106.1_effect:0 "Unlock one §Y25§!-Political Power request per §Y90§! days: up to §Y500§! infantry equipment from a willing donor's actual stocks."
 wet_kislev.106.d:0 "Kislev’s struggle has outlasted the first wagons sent north. Its envoys now ask for a steadier flow of help, enough to carry the defenders through another hard season."
 wet_kislev.106.t:0 "Sustained Northern Aid"
 wet_kislev.107.0:0 "Decline the request."
 wet_kislev.107.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.107.1:0 "Accept the terms."
 wet_kislev.107.1_effect:0 "Offer Kislev mutual access and a place for its displaced government. Actual government-in-exile status still requires a legal continuing war and an eligible host; this agreement does not admit Kislev to our faction."
 wet_kislev.107.1_outcome:0 "Offers refuge to Kislev."
 wet_kislev.107.d:0 "Kislev’s envoys ask where their people might turn if the northern defences fail. Offering shelter would bind our realm to a nation whose courage has not made it immune to disaster."
 wet_kislev.107.t:0 "A Place of Refuge"
 wet_kislev.108.0:0 "Decline the request."
 wet_kislev.108.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.108.1:0 "Accept the terms."
 wet_kislev.108.1_effect:0 "Recognise the Kislevite government already hosted by our country. Its administration will continue the common struggle; we may refuse this additional cooperation."
 wet_kislev.108.1_outcome:0 "Recognises Kislev’s government in exile."
 wet_kislev.108.d:0 "Representatives of Kislev have arrived far from their occupied homeland. They ask us to recognise their government and help preserve a cause that defeat has driven beyond its own borders."
 wet_kislev.108.t:0 "Recognise Kislev’s Exile Government"
 wet_kislev.109.0:0 "Decline the request."
 wet_kislev.109.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.109.1:0 "Accept the terms."
 wet_kislev.109.1_effect:0 "Ask Reikland to issue its normal coalition invitation. Kislev must then accept; if Reikland does not lead, the incumbent leader must also consent. Existing Everchosen wars block new admission below §Y100%§! tension."
 wet_kislev.109.1_outcome:0 "Requests an Imperial invitation to the Grand Alliance."
 wet_kislev.109.d:0 "The Emperor calls upon our realm to stand beside the free peoples against the coming darkness. His envoys bring no promise of an easy war, only the hope that unity may spare us defeat in isolation."
 wet_kislev.109.t:0 "An Invitation to the Grand Alliance"
 wet_kislev.110.0:0 "Decline the request."
 wet_kislev.110.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.110.1:0 "Accept the terms."
 wet_kislev.110.1_effect:0 "Accept Kislev’s application to our existing Order alliance at full world tension. Normal defensive obligations follow admission; no declaration is issued by this request."
 wet_kislev.110.d:0 "Kislev calls upon our realm to stand with its allies. The northern court offers a place among those determined to meet the coming darkness together."
 wet_kislev.110.t:0 "Join Our Order Alliance"
 wet_kislev.111.0:0 "Decline the request."
 wet_kislev.111.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.111.1:0 "Accept the terms."
 wet_kislev.111.1_effect:0 "Pay §Y25§! Political Power on acceptance for §Y20§! Army Experience and one §Y50%§! land-doctrine discount. Both armies retain their units."
 wet_kislev.111.d:0 "Kislev proposes an exchange of officers between our armies. Soldiers who have learned to fight beneath different skies may have much to teach one another."
 wet_kislev.111.t:0 "An Exchange of Officers"
 wet_kislev.112.0:0 "Decline the request."
 wet_kislev.112.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.112.1:0 "Accept the terms."
 wet_kislev.112.1_effect:0 "Transfer §Y10§! existing convoys from the donor’s actual stockpile. A valid port route or real exile host is required."
 wet_kislev.112.d:0 "Kislev’s envoys have turned to the harbours for help. Ships carrying supplies north may prove as necessary as the soldiers waiting to receive them."
 wet_kislev.112.t:0 "Convoys for the North"
 wet_kislev.113.0:0 "We have heard the warning."
 wet_kislev.113.0_effect:0 "Record the delivered warning; no alliance or declaration is imposed."
 wet_kislev.113.d:0 "A column of Kislevite riders has reached our frontier. Their officers offer service beside our own soldiers, bringing the hard-won experience of the northern marches."
 wet_kislev.113.t:0 "Riders from Kislev"
 wet_kislev.114.0:0 "Decline the request."
 wet_kislev.114.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.114.1:0 "Accept the terms."
 wet_kislev.114.1_effect:0 "Accept the warning’s call to readiness and gain §Y3§! war-support points. No declaration or faction membership is imposed."
 wet_kislev.114.d:0 "Kislev’s messengers speak plainly of the danger gathering beyond their borders. They ask our court to make its resolve known before the enemy mistakes silence for indifference."
 wet_kislev.114.t:0 "Southern Resolve"
 wet_kislev.115.0:0 "Decline the request."
 wet_kislev.115.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.115.1:0 "Accept the terms."
 wet_kislev.115.1_effect:0 "§Y30§! Political Power; offer the consenting host §Y+5§! war-support points; no duplicate warning tension."
 wet_kislev.115.d:0 "The warning from Kislev must travel farther than one court. Its envoys ask us to carry the news onward, before disbelief gives the northern darkness another season to gather."
 wet_kislev.115.t:0 "Carry the Warning On"
 wet_kislev.116.0:0 "Decline the request."
 wet_kislev.116.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.116.1:0 "Accept the terms."
 wet_kislev.116.1_effect:0 "Open a §Y25§!-Political Power relief request for §Y2§!,§Y000§! Food from the host; accepted aid grants §Y+5%§! recovery for §Y90§! days."
 wet_kislev.116.d:0 "Families driven from Kislev crowd the roads and shelter where they can. An appeal has reached our court for bread and stores to see them through the days ahead."
 wet_kislev.116.t:0 "Bread for the Dispossessed"
 wet_kislev.117.0:0 "Decline the request."
 wet_kislev.117.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.117.1:0 "Accept the terms."
 wet_kislev.117.1_effect:0 "Offer joint staff work: on host acceptance, §Y+10%§! planning speed for §Y180§! days and §Y20§! Army XP."
 wet_kislev.117.d:0 "Kislev’s commanders ask for a voice at the allied war council. Their homeland has paid dearly for knowledge that the southern generals can ill afford to ignore."
 wet_kislev.117.t:0 "A Place at the War Council"
 wet_kislev.118.0:0 "Decline the request."
 wet_kislev.118.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.118.1:0 "Accept the terms."
 wet_kislev.118.1_effect:0 "On host consent, pay §Y25§! Political Power + §Y100§! infantry equipment for §Y-10%§! division training time for §Y180§! days."
 wet_kislev.118.d:0 "Kislev seeks permission to gather its scattered soldiers beneath our protection. Around those depots, exiles may once again become an army with a road home before it."
 wet_kislev.118.t:0 "Kislevite Recruiting Depots"
 wet_kislev.119.0:0 "Decline the request."
 wet_kislev.119.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.119.1:0 "Accept the terms."
 wet_kislev.119.1_effect:0 "Ask the host for §Y500§! infantry equipment and §Y50§! Elite Equipment from its actual stocks; refusal is allowed."
 wet_kislev.119.d:0 "The survivors have returned with torn standards and little more than the weapons they carried. Kislev’s officers ask our arsenals to help make them ready for another campaign."
 wet_kislev.119.t:0 "Re-equip the Survivors"
 wet_kislev.120.0:0 "Decline the request."
 wet_kislev.120.0_effect:0 "Decline without payment or forced commitments."
 wet_kislev.120.1:0 "Accept the terms."
 wet_kislev.120.1_effect:0 "§Y+15%§! planning speed for §Y180§! days; offer the host a joint liberation plan with refusal allowed."
 wet_kislev.120.1_outcome:0 "Approves a joint plan to liberate Kislev."
 wet_kislev.120.d:0 "Maps of the occupied homeland lie open beneath the commanders’ hands. For the first time in many months, the road back to Kislev looks like more than a memory."
 wet_kislev.120.t:0 "The Road Home"
