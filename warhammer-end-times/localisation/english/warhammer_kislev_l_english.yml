l_english:
 WET_DIRECT_D06_kislev_builder:0 "Gain +15% Core Defence and +25% Entrenchment Speed for 120 days. Costs 50 Political Power."
 WET_DIRECT_D11_kislev_builder:0 "Protect the Dukhlys approaches with +10% Local Defence for 180 days. Costs 25 Political Power."
 WET_DIRECT_E05_kislev_builder:0 "Gain +20% Core Attack and Defence for 120 days. Costs 50 Political Power."
 WET_DIRECT_E11_kislev_builder:0 "Gain 25 Army Experience and +15% Planning Speed for 120 days. Costs 50 Political Power."
 WET_DIRECT_E12_kislev_builder:0 "Gain 25 Political Power and establish contacts in the occupied homeland."
 WET_DIRECT_E13_kislev_builder:0 "Occupied homeland states gain +10% Resistance Target for 120 days."
 WET_DIRECT_E14_kislev_builder:0 "Gain 25 Army Experience and a Logistics research bonus."
 WET_DIRECT_E15_kislev_builder:0 "Gain +10% Attack on homeland cores for 60 days. Costs 75 Political Power."
 WET_DIRECT_H04_kislev_builder:0 "Identify the current northern enemy. Prepare a war goal against the bordering northern enemy. Costs 75 Political Power."
 WET_DIRECT_L00_kislev_builder:0 "Improve relations with Reikland and send military-access offers to Reikland, Bretonnia and Karaz-a-Karak."
 WET_DIRECT_L06_kislev_builder:0 "Send the diplomatic offers described by this focus."
 WET_DIRECT_M12_kislev_builder:0 "Invoke Frostward: +8% Core Defence and +10% Recovery for 21 days. Costs 75 Political Power."
 WET_DIRECT_M14_kislev_builder:0 "Begin Great Winter: +20% Core Defence and +25% Recovery for 90 days. Costs 75 Political Power."
 WET_DIRECT_M24_kislev_builder:0 "Begin the Last Great Charge for 90 days. Costs 50 Political Power."
 WET_DIRECT_M34_kislev_builder:0 "Begin the Last Stand: +25% Infantry Defence and +15% Infantry Organisation for 90 days. Costs 50 Political Power."
 WET_DIRECT_P05_kislev_builder:0 "Begin Night Shifts: +20% Factory Output and +25% Repair Speed for 180 days. Costs 50 Political Power."
 WET_DIRECT_S02_kislev_builder:0 "Begin Long Defence: +20% Core Defence, +15% Organisation and −15% Supply Consumption for 180 days. Costs 50 Political Power."
 WET_DIRECT_W04_kislev_builder:0 "Deliver the second warning: gain 15 World Tension. Supply Consumption: +5% for 60 days."
 WET_KIS_D00:0 "The Three Cities"
 WET_KIS_D00_desc:0 "Plan a connected northern defence. The survival of the great cities depends on their ability to sustain one another."
 WET_KIS_D01:0 "Kislev Must Stand"
 WET_KIS_D01_desc:0 "Prepare the capital's defensive works. The capital’s defenders must find prepared works where they would otherwise find open approaches."
 WET_KIS_D02:0 "Keep Erengrad Open"
 WET_KIS_D02_desc:0 "Keep the western port working under pressure. Erengrad’s harbour is a road to the wider world that the kingdom cannot afford to lose lightly."
 WET_KIS_D03:0 "Watch Over the Cursed City"
 WET_KIS_D03_desc:0 "Strengthen the city on the exposed northern road. The city’s terrible reputation offers no substitute for walls, engineers and a vigilant garrison."
 WET_KIS_D04:0 "Link the Fortress Depots"
 WET_KIS_D04_desc:0 "Join the city defences into a supply system. A fortress without provisions will fall even when its walls remain intact."
 WET_KIS_D05:0 "Stone for Our Children"
 WET_KIS_D05_desc:0 "Build permanent fortification expertise. The works raised today should still shelter Kislevite families after the war has passed."
 WET_KIS_D06:0 "A Wall of Living Men"
 WET_KIS_D06_desc:0 "Prepare a brief, all-consuming siege defence. For one decisive siege, every available hand will serve the defensive line."
 WET_KIS_D06_requirement:0 ""
 WET_KIS_D06_special_tt:0 "Gain +15% Core Defence and +25% Entrenchment Speed for 120 days. Costs 50 Political Power."
 WET_KIS_D07:0 "Winter Roads"
 WET_KIS_D07_desc:0 "Keep the capital and eastern depots connected. A road kept open through the snow can save the supplies and wounded of an entire army."
 WET_KIS_D08:0 "The Northern Redoubt"
 WET_KIS_D08_desc:0 "Recognise a functioning three-city defensive system. The three cities must form a working defensive system before the council can call the north secure."
 WET_KIS_D08_requirement:0 "Control all three city states; city construction claims redeemed."
 WET_KIS_D09:0 "Paths Through the Snow"
 WET_KIS_D09_desc:0 "Mark withdrawal routes before armies need them. An orderly retreat begins with knowing which roads will still carry the host."
 WET_KIS_D10:0 "The Bolgasgrad Watchposts"
 WET_KIS_D10_desc:0 "Anchor the outer road with a defended relay station. The outlying watchposts must warn the depots and give the road guards somewhere to rally."
 WET_KIS_D11:0 "The Dukhlys Screens"
 WET_KIS_D11_desc:0 "Use forest approaches to protect the roads behind the host. The wooded approaches offer defenders a chance to disrupt the invader’s advance."
 WET_KIS_D11_requirement:0 ""
 WET_KIS_D11_special_tt:0 "Protect the Dukhlys approaches with +10% Local Defence for 180 days. Costs 25 Political Power."
 WET_KIS_D12:0 "Citizens of the Redoubt"
 WET_KIS_D12_desc:0 "Give the fortress towns trained reserves and repair crews. Trained citizens and organised repair crews can keep damaged defences serving the host."
 WET_KIS_E00:0 "A Court Without a Capital"
 WET_KIS_E00_desc:0 "Keep the government functioning in foreign quarters. The court must give displaced Kislevites a functioning government rather than a memory of one."
 WET_KIS_E00_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E01:0 "Keep the Seals of State"
 WET_KIS_E01_desc:0 "Preserve lawful administration and the national treasury. Records and lawful authority will be needed when the kingdom can govern its homeland again."
 WET_KIS_E01_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E02:0 "Bread for the Dispossessed"
 WET_KIS_E02_desc:0 "Negotiate relief for displaced Kislevites. Relief must be negotiated from a host that has people and armies of its own to sustain."
 WET_KIS_E02_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E02_special_tt:0 "Open a 25-PP relief request for 2,000 Food from the host; accepted aid grants +5% recovery for 90 days."
 WET_KIS_E03:0 "A Place at the War Council"
 WET_KIS_E03_desc:0 "Win a meaningful voice in the host's campaign planning. Experience from the northern war deserves a place in the plans made around the allied table."
 WET_KIS_E03_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E03_special_tt:0 "Offer joint staff work: on host acceptance, +10% planning speed for 180 days and 20 Army XP."
 WET_KIS_E04:0 "A Nation, Not an Auxiliary"
 WET_KIS_E04_desc:0 "Preserve a durable army with its own national command. An army with its own enduring command can remain the servant of a nation in exile."
 WET_KIS_E04_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E05:0 "Our Last Service"
 WET_KIS_E05_desc:0 "Prepare a stronger but brief liberation effort. The exiles will prepare to spend their remaining strength on one brief opportunity to liberate the homeland."
 WET_KIS_E05_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E05_special_tt:0 "Gain +20% Core Attack and Defence for 120 days. Costs 50 Political Power."
 WET_KIS_E06:0 "The Colours Survive"
 WET_KIS_E06_desc:0 "Gather surviving cadres and the records needed to rebuild. Veteran cadres and regimental records give the army a foundation from which it can rebuild."
 WET_KIS_E06_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E07:0 "Kislevite Recruiting Depots"
 WET_KIS_E07_desc:0 "Negotiate a place to train new formations with real resources. Training grounds abroad must be agreed with the host and supported by actual recruits and equipment."
 WET_KIS_E07_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E07_special_tt:0 "On host consent, pay 25 PP + 100 infantry equipment for -10% division training time for 180 days."
 WET_KIS_E08:0 "Re-equip the Survivors"
 WET_KIS_E08_desc:0 "Seek a bounded shipment of weapons for the exiled army. Survivors can return to the field only when someone is willing and able to supply their weapons."
 WET_KIS_E08_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E08_special_tt:0 "Ask the host for 500 infantry equipment and 50 Elite Equipment from its actual stocks; refusal is allowed."
 WET_KIS_E09:0 "Lessons of the Lost Frontier"
 WET_KIS_E09_desc:0 "Carry hard-won experience into the chosen specialisation. The lessons of defeat must strengthen the military arm the kingdom chose to cultivate."
 WET_KIS_E09_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E09_special_tt:0 "Permanent -5% division attrition; one 50% support / Heavy Cavalry / infantry research bonus matching the chosen arm."
 WET_KIS_E10:0 "Free Companies of Kislev"
 WET_KIS_E10_desc:0 "Turn trained, surviving formations into an effective field army. A field army must be made from real formations before it can become the instrument of return."
 WET_KIS_E10_requirement:0 "Exile active: actual government in exile with a consenting valid host. At least §Y2§! real Kislev divisions exist."
 WET_KIS_E11:0 "A Spearhead for the Return"
 WET_KIS_E11_desc:0 "Prepare the conventional military road home. A liberation offensive requires a supplied approach and patient cooperation with the host."
 WET_KIS_E11_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E11_special_tt:0 "Gain 25 Army Experience and +15% Planning Speed for 120 days. Costs 50 Political Power."
 WET_KIS_E12:0 "Names Carried South"
 WET_KIS_E12_desc:0 "Re-establish contact with communities under occupation. A trusted name carried out of the homeland may become the beginning of a working network."
 WET_KIS_E12_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E12_special_tt:0 "Establish contacts in the occupied homeland."
 WET_KIS_E13:0 "The Hidden Roads Home"
 WET_KIS_E13_desc:0 "Support local resistance without inventing an army. Local resistance can make occupation more costly while the exiles prepare their return."
 WET_KIS_E13_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E13_special_tt:0 "Occupied homeland states gain +10% Resistance Target for 120 days."
 WET_KIS_E14:0 "Friends Behind the Lines"
 WET_KIS_E14_desc:0 "Prepare routes and rendezvous points for an eventual return. Those who know the hidden roads can guide an army toward its friends and away from ambush."
 WET_KIS_E14_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E15:0 "Open the Gates from Within"
 WET_KIS_E15_desc:0 "Prepare local help for an allied liberation offensive. Contacts inside occupied Kislev can help an approaching army turn a prepared opportunity into a breach."
 WET_KIS_E15_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_E15_special_tt:0 "Gain +10% Attack on homeland cores for 60 days. Costs 75 Political Power."
 WET_KIS_H00:0 "Kislev Still Stands"
 WET_KIS_H00_desc:0 "Recognise survival through the first major assault. The kingdom’s survival is an achievement to recognise, never an outcome the council may simply announce."
 WET_KIS_H00_requirement:0 "At least §Y180§! war days or an invasion defeated; hold capital and at least §Y6§! of §Y9§! baseline states."
 WET_KIS_H01:0 "Reclaim the Oblasts"
 WET_KIS_H01_desc:0 "Prepare the return to occupied home territory. Every recovered village brings the host closer to a frontier it can defend again."
 WET_KIS_H02:0 "Reopen the Markets"
 WET_KIS_H02_desc:0 "Restore civilian life behind a secure front. A secure rear must offer ordinary people more than another levy and another requisition."
 WET_KIS_H02_requirement:0 "Control capital and at least §Y6§! baseline states."
 WET_KIS_H02_special_tt:0 "One civilian factory claim in an owned controlled home state; +20% repair speed for 180 days."
 WET_KIS_H03:0 "A Living Northern Kingdom"
 WET_KIS_H03_desc:0 "Recognise a sovereign, restored homeland. A restored homeland must be able to support its own future after the immediate invader is gone."
 WET_KIS_H03_requirement:0 "Own and control all §Y9§! baseline states; no war with Everchosen belligerents."
 WET_KIS_H04:0 "Beyond the Marches"
 WET_KIS_H04_desc:0 "Prepare a limited counteroffensive against the invader. A measured counteroffensive should punish the actual invader without committing the kingdom to a limitless conquest."
 WET_KIS_H04_special_tt:0 "Identify the current northern enemy. Prepare a war goal against the bordering northern enemy. Costs 75 Political Power."
 WET_KIS_L00:0 "Open the Southern Road"
 WET_KIS_L00_desc:0 "Reopen practical contact with the southern courts. Practical contact with the southern courts begins with roads, envoys and the right to travel."
 WET_KIS_L00_special_tt:0 "Improve relations with Reikland and send military-access offers to Reikland, Bretonnia and Karaz-a-Karak."
 WET_KIS_L01:0 "An Audience in Altdorf"
 WET_KIS_L01_desc:0 "Ask Reikland to take the northern danger seriously. The danger to Kislev must be understood as a danger approaching the Empire as well."
 WET_KIS_L01_special_tt:0 "Send a preliminary cooperation request; acceptance opens 500-equipment aid talks, not faction membership."
 WET_KIS_L02:0 "Honour the Dwarfen Oaths"
 WET_KIS_L02_desc:0 "Seek engineers and supplies from Karaz-a-Karak. Old obligations can support new cooperation, but the Dwarfs must decide what they can spare."
 WET_KIS_L02_special_tt:0 "Ask Karaz-a-Karak for 250 infantry + 100 Elite Equipment from its stocks; recipient may refuse."
 WET_KIS_L03:0 "Appeal to Bretonnia"
 WET_KIS_L03_desc:0 "Ask Bretonnia to sustain the mounted frontier. The western court may help sustain our mounted frontier without surrendering command of its own host."
 WET_KIS_L03_special_tt:0 "Ask Bretonnia for 250 Cavalry Horses + 5,000 Food from its stocks; recipient may refuse."
 WET_KIS_L04:0 "An Allied Place of Refuge"
 WET_KIS_L04_desc:0 "Arrange a destination before the homeland is lost. A refuge agreed before disaster may preserve a government when the northern roads finally close."
 WET_KIS_L04_special_tt:0 "Open host offers to Reikland, Bretonnia or Karaz-a-Karak; host must accept access and a legal continuation plan."
 WET_KIS_L05:0 "Ask for the Alliance"
 WET_KIS_L05_desc:0 "Seek admission to the consenting Order coalition. Our place in a common alliance must be accepted by those whose obligations it would change."
 WET_KIS_L05_requirement:0 "§Y25%§! via Reikland programme, otherwise §Y100%§!; if fighting Everchosen, always §Y100§!%."
 WET_KIS_L05_special_tt:0 "Open a legal invitation request; no automatic membership or declaration."
 WET_KIS_L06:0 "Supplies Before Soldiers"
 WET_KIS_L06_desc:0 "Organise sustained aid without promising foreign armies. A reliable shipment of weapons can matter sooner than a promise of foreign armies."
 WET_KIS_L06_special_tt:0 "Send the diplomatic offers described by this focus."
 WET_KIS_L07:0 "Stand Beside the South"
 WET_KIS_L07_desc:0 "Coordinate an actual shared defensive war. A shared enemy gives allied staffs a reason to turn their agreements into practical planning."
 WET_KIS_L07_requirement:0 "Actual Order-coalition membership and a shared Everchosen enemy."
 WET_KIS_L08:0 "An Exchange of Officers"
 WET_KIS_L08_desc:0 "Learn from a willing partner in the common war. Officers who study together can bring useful experience home without giving away their armies."
 WET_KIS_L08_special_tt:0 "Offer an exchange to Reikland or Karaz-a-Karak: pay 25 PP on acceptance for 20 Army XP and one 50% doctrine discount."
 WET_KIS_L09:0 "Convoys for the North"
 WET_KIS_L09_desc:0 "Arrange a real coastal supply or evacuation service. Ships already afloat can carry northern supplies only when their owners agree to release them."
 WET_KIS_L09_special_tt:0 "Ask one willing coastal Order partner for up to 10 convoys from its stockpile; no ships are created."
 WET_KIS_M00:0 "Muster the Tsarina's Host"
 WET_KIS_M00_desc:0 "Decide where Kislev will concentrate its best training. The kingdom cannot perfect every military art at once, but it can choose where its finest instructors belong."
 WET_KIS_M10:0 "The Ice Court at War"
 WET_KIS_M10_desc:0 "Make ice magic the army's principal support arm. The court’s sorcery must become dependable support for soldiers who cannot afford a failed rite."
 WET_KIS_M11:0 "Apprentices of Winter"
 WET_KIS_M11_desc:0 "Train warders and disciplined battlefield attendants. Patient instruction turns raw talent into protection that a marching army can trust."
 WET_KIS_M12:0 "Wards Along the Marches"
 WET_KIS_M12_desc:0 "Prepare defensive rites for controlled homeland positions. The warders will husband their strength for the ground on which the host intends to stand."
 WET_KIS_M12_requirement:0 ""
 WET_KIS_M12_special_tt:0 "Invoke Frostward: +8% Core Defence and +10% Recovery for 21 days. Costs 75 Political Power."
 WET_KIS_M13:0 "The Land Remembers"
 WET_KIS_M13_desc:0 "Bind modest protective wards into enduring practice. A modest ward maintained through many winters may defend more lives than a single spectacular rite."
 WET_KIS_M14:0 "A Winter Without End"
 WET_KIS_M14_desc:0 "Spend the court's reserves on one great winter rite. The Ice Court will prepare to spend its accumulated strength when the kingdom’s need is greatest."
 WET_KIS_M14_requirement:0 ""
 WET_KIS_M14_special_tt:0 "Begin Great Winter: +20% Core Defence and +25% Recovery for 90 days. Costs 75 Political Power."
 WET_KIS_M15:0 "Eyes in the Blizzard"
 WET_KIS_M15_desc:0 "Make ice-court reconnaissance part of ordinary campaign practice. Scouts and warders working together can read dangers that either would miss alone."
 WET_KIS_M20:0 "Raise the Bear Host"
 WET_KIS_M20_desc:0 "Concentrate elite mounted resources in a shock host. The bear host will receive the resources needed to become the army’s decisive mounted arm."
 WET_KIS_M21:0 "Keepers of the Great Bears"
 WET_KIS_M21_desc:0 "Develop handlers, remount discipline and winter quarters. The charge depends upon the quiet work of those who train and care for its great mounts."
 WET_KIS_M22:0 "Strike at the Flanks"
 WET_KIS_M22_desc:0 "Train the host to counterattack exposed formations. The enemy’s advance must expose a weakness before the mounted reserve commits itself."
 WET_KIS_M23:0 "Bloodlines for the Future"
 WET_KIS_M23_desc:0 "Preserve breeding stock and veteran mounted cadres. Veteran riders and carefully preserved breeding stock are an inheritance the next generation will need."
 WET_KIS_M24:0 "The Last Great Charge"
 WET_KIS_M24_desc:0 "Risk the entire shock reserve in one decisive campaign. When the reserve is unleashed, its charge must purchase an opportunity the rest of the host can use."
 WET_KIS_M24_requirement:0 ""
 WET_KIS_M24_special_tt:0 "Begin the Last Great Charge for 90 days. Costs 50 Political Power."
 WET_KIS_M25:0 "Harness and Barding"
 WET_KIS_M25_desc:0 "Protect trained mounts and their experienced riders. A surviving mount and rider can carry their experience into the next battle."
 WET_KIS_M30:0 "Trust in the Infantry"
 WET_KIS_M30_desc:0 "Put reliable foot soldiers at the centre of the host. Well-drilled foot soldiers will form the line on which every other arm depends."
 WET_KIS_M31:0 "A Musket for Every Household"
 WET_KIS_M31_desc:0 "Standardise local training and equipment maintenance. Local instruction and common standards turn scattered levies into soldiers who can maintain their own arms."
 WET_KIS_M32:0 "Streltsi and Shieldwalls"
 WET_KIS_M32_desc:0 "Combine disciplined fire with prepared defensive lines. Disciplined fire and steady ranks must support one another when the enemy reaches the line."
 WET_KIS_M33:0 "A Standing Army of Kislev"
 WET_KIS_M33_desc:0 "Retain experienced regiments for future campaigns. The regiments must become institutions that retain their experience when the emergency passes."
 WET_KIS_M34:0 "Not One Step South"
 WET_KIS_M34_desc:0 "Concentrate the foot regiments in a desperate stand. The infantry will prepare one concentrated effort to deny the invader the ground it expects to take."
 WET_KIS_M34_requirement:0 ""
 WET_KIS_M34_special_tt:0 "Begin the Last Stand: +25% Infantry Defence and +15% Infantry Organisation for 90 days. Costs 50 Political Power."
 WET_KIS_M35:0 "Regimental Guns"
 WET_KIS_M35_desc:0 "Give the infantry reliable close artillery support. Gunners who train beside the foot regiments can bring their fire to bear when it matters most."
 WET_KIS_M40:0 "One Host, One Purpose"
 WET_KIS_M40_desc:0 "Make the chosen specialists cooperate with the rest. The chosen specialists must serve the whole army without dissolving the strengths of its other arms."
 WET_KIS_P00:0 "Count Every Hammer"
 WET_KIS_P00_desc:0 "Survey the workshops and emergency stores. A kingdom with few workshops must know exactly what each one can contribute."
 WET_KIS_P01:0 "The Erengrad Workshops"
 WET_KIS_P01_desc:0 "Expand skilled civilian work near the port. Erengrad’s craftsmen can supply more of the civilian work that keeps the frontier functioning."
 WET_KIS_P02:0 "Arms for the Winter"
 WET_KIS_P02_desc:0 "Expand the capital's arms workshops. The capital’s workshops must turn scarce tools and skilled labour toward the host’s weapons."
 WET_KIS_P03:0 "Repair Before Expansion"
 WET_KIS_P03_desc:0 "Organise repair crews and spare parts. A repaired workshop can serve the kingdom sooner than an ambitious new foundation."
 WET_KIS_P04:0 "Work for the Next Generation"
 WET_KIS_P04_desc:0 "Invest in skills and sustainable output. Skilled hands and stable methods are the basis of an industry that can endure."
 WET_KIS_P05:0 "Work Until Dawn"
 WET_KIS_P05_desc:0 "Prepare one exhausting emergency production drive. The workshops will prepare to spend their strength in a single exhausting production effort."
 WET_KIS_P05_requirement:0 ""
 WET_KIS_P05_special_tt:0 "Begin Night Shifts: +20% Factory Output and +25% Repair Speed for 180 days. Costs 50 Political Power."
 WET_KIS_P06:0 "Train the Artificers"
 WET_KIS_P06_desc:0 "Create a lasting technical school behind the front. The artificers’ knowledge must be taught and preserved beyond the walls of any one workshop."
 WET_KIS_P07:0 "Reserve Grain and Shot"
 WET_KIS_P07_desc:0 "Set aside modest stores for the first hard months. A small reserve laid aside now may keep a formation supplied when the roads fail."
 WET_KIS_P08:0 "Stores Beneath the Snow"
 WET_KIS_P08_desc:0 "Protect emergency provisions from weather and raids. Dispersed and protected stores will be harder for weather and raiders to ruin together."
 WET_KIS_P08_special_tt:0 "One Granary level in a legal controlled home state; 5,000 Food once. Retain a capped construction claim."
 WET_KIS_P09:0 "Travelling Armourers"
 WET_KIS_P09_desc:0 "Send repair crews with the retreating columns. Repair crews that can march with the columns will keep more equipment in service."
 WET_KIS_P10:0 "Keep the Mills Turning"
 WET_KIS_P10_desc:0 "Preserve skilled production through disrupted supply. The loss of a supplier must not also destroy the skill and organisation of the workshops it served."
 WET_KIS_S00:0 "Council at the Ice Palace"
 WET_KIS_S00_desc:0 "Choose what victory will mean for Kislev. The council must decide whether its first duty is to preserve the kingdom or spend its strength delaying disaster."
 WET_KIS_S01:0 "Save Kislev"
 WET_KIS_S01_desc:0 "Build a defence that can outlive this invasion. The institutions and armies we build must be able to serve a future beyond this invasion."
 WET_KIS_S02:0 "Buy the World Some Time"
 WET_KIS_S02_desc:0 "Prepare one overwhelming emergency effort. If Kislev cannot stop the storm, it can make the storm arrive late."
 WET_KIS_S02_requirement:0 ""
 WET_KIS_S02_special_tt:0 "Begin Long Defence: +20% Core Defence, +15% Organisation and −15% Supply Consumption for 180 days. Costs 50 Political Power."
 WET_KIS_S03:0 "Institutions That Endure"
 WET_KIS_S03_desc:0 "Make military administration survive the crisis. Orders, provisions and trained administrators must survive the loss of any one commander or city."
 WET_KIS_S04:0 "Spend Our Tomorrows"
 WET_KIS_S04_desc:0 "Commit every remaining reserve to the long defence. The reserves intended for another winter will be spent holding this one."
 WET_KIS_S04_special_tt:0 "Upgrade Long Defence to +30% core defence / +25% organisation; retain its original expiry and -15% supply use."
 WET_KIS_S05:0 "Oaths Kept in Winter"
 WET_KIS_S05_desc:0 "Bind the host to the chosen national purpose. Whatever course the council chose, the host must believe that its sacrifices serve a common purpose."
 WET_KIS_S06:0 "Councils Beneath Every Banner"
 WET_KIS_S06_desc:0 "Give city officers and the horse clans a shared voice. The frontier towns and horse clans must have a voice in the burdens they are asked to bear."
 WET_KIS_S07:0 "Leave No Village Uncounted"
 WET_KIS_S07_desc:0 "Organise relief and accurate recruitment rolls. Reliable rolls and organised relief protect both the people who remain and those called into service."
 WET_KIS_W00:0 "The Watchfires Burn"
 WET_KIS_W00_desc:0 "Take the northern reports seriously. The watchfires offer a narrow chance to prepare before the frontier becomes a battlefield."
 WET_KIS_W01:0 "Ride South Without Rest"
 WET_KIS_W01_desc:0 "Send the first riders to the southern courts. Every rider sent south carries a warning that another soldier must pay to keep alive."
 WET_KIS_W01_requirement:0 "Verified hostile frontier activity."
 WET_KIS_W01_special_tt:0 "Deliver warning I: +10 tension points attributed to the Everchosen; cavalry organisation -5% for 60 days."
 WET_KIS_W02:0 "Keep the Saddles Filled"
 WET_KIS_W02_desc:0 "Keep experienced riders with the frontier army. The frontier needs experienced horsemen more urgently than distant courts need another report."
 WET_KIS_W03:0 "Read the Signs in the Snow"
 WET_KIS_W03_desc:0 "Assemble evidence of the gathering invasion. Scattered tracks and frightened witnesses must become an account that no southern court can dismiss."
 WET_KIS_W04:0 "Let Them See the Enemy"
 WET_KIS_W04_desc:0 "Escort witnesses and captured evidence south. Let the allies hear those who have faced the enemy and judge the danger for themselves."
 WET_KIS_W04_requirement:0 "Verified Everchosen expansion or war preparations."
 WET_KIS_W04_special_tt:0 "Deliver the second warning: gain 15 World Tension. Supply Consumption: +5% for 60 days."
 WET_KIS_W05:0 "Bread, Powder and Winter Stores"
 WET_KIS_W05_desc:0 "Send the wagons to depots and fortress stores. A wagon reaching a northern depot may keep a regiment alive through the next march."
 WET_KIS_W06:0 "War on the Northern Road"
 WET_KIS_W06_desc:0 "Coordinate the emergency before the front breaks. The northern roads must serve the fighting line and the columns behind it while there is still time."
 WET_KIS_W06_requirement:0 "War with the Everchosen leader or its faction belligerents."
 WET_KIS_W07:0 "The Last Riders"
 WET_KIS_W07_desc:0 "Get the final warning through the battle lines. These riders may leave their homeland for the last time so that the south cannot claim it never knew."
 WET_KIS_W07_requirement:0 "A viable messenger route or departed couriers."
 WET_KIS_W07_special_tt:0 "Deliver warning III: +20 tension points; withdrawal speed bonus unavailable for 30 days."
 WET_KIS_W08:0 "Save the Host"
 WET_KIS_W08_desc:0 "Commit the rear guard to an orderly withdrawal. A living host can defend another line, and perhaps one day return to the line it has lost."
 WET_KIS_W08_special_tt:0 "One free withdrawal activation; retreat movement +20% and army supply use -20% for 30 days."
 WET_KIS_W09:0 "Keep the Signal Fires Lit"
 WET_KIS_W09_desc:0 "Keep scattered armies and couriers connected. A signal seen across the snow tells an isolated company that it has not been abandoned."
 WET_KIS_W10:0 "They Heard Us"
 WET_KIS_W10_desc:0 "Turn a delivered warning into southern resolve. Our sacrifices have reached foreign ears; their governments must now decide what those warnings demand."
 WET_KIS_W10_requirement:0 "At least one warning actually delivered."
 WET_KIS_W10_special_tt:0 "Offer +3% War Support to up to three consenting warned Order realms."
 WET_KIS_W11:0 "Every Mile Contested"
 WET_KIS_W11_desc:0 "Teach every retreating formation to buy time. The enemy must spend blood and daylight on every road that carries it toward the south."
 WET_KIS_W12:0 "The Beacon Keepers"
 WET_KIS_W12_desc:0 "Make warning stations useful to every surviving formation. Those who tend the beacons must also know where scattered formations can find their comrades."
 WET_KIS_W13:0 "Witnesses Beyond the Empire"
 WET_KIS_W13_desc:0 "Carry the established evidence to Bretonnia and the Dwarfs. Our testimony must travel beyond the first friendly court to those whose help can still matter."
 WET_KIS_W13_special_tt:0 "Deliver the warning to Bretonnia and Karaz-a-Karak when a lawful route exists: +25 opinion for 365 days and a request for 500 existing infantry equipment from each. Donors may refuse; each first shipment is paid only once."
 WET_KIS_X00:0 "Keep the Nation Together"
 WET_KIS_X00_desc:0 "Plan continuity before defeat becomes irreversible. The institutions of the kingdom must be able to continue even if its seat of government cannot be held."
 WET_KIS_X00_requirement:0 "At war and lost at least §Y3§! baseline states, or capitulated with a legal continuation."
 WET_KIS_X01:0 "Across the Border"
 WET_KIS_X01_desc:0 "Activate a route into an accepting host country. Surviving formations must reach an accepting host by roads and harbours that actually remain open."
 WET_KIS_X01_requirement:0 "Accepting host, legal access and a usable land or naval escape route."
 WET_KIS_X01_special_tt:0 "Unlock 50-PP withdrawal: +20% retreat movement / -20% supply use for 30 days; move existing units normally."
 WET_KIS_X02:0 "A Nation in the Saddle"
 WET_KIS_X02_desc:0 "Reconstitute Kislev as an actual government in exile. A foreign address does not end the obligations of a Kislevite government to its people."
 WET_KIS_X02_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_X03:0 "Carry the Warning On"
 WET_KIS_X03_desc:0 "Make the southern war remember the northern sacrifice. The northern warning must continue to shape the war even after its messengers have become exiles."
 WET_KIS_X03_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_X03_special_tt:0 "Offer the consenting host +5% War Support."
 WET_KIS_X04:0 "Service in the Southern War"
 WET_KIS_X04_desc:0 "Let surviving formations earn the road home. Service beside allied armies will give the surviving regiments experience they can carry home."
 WET_KIS_X04_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_X05:0 "The Road Home"
 WET_KIS_X05_desc:0 "Arrange a real joint liberation campaign. The return must be planned with a willing host and supported by real preparations."
 WET_KIS_X05_requirement:0 "Exile active: actual government in exile with a consenting valid host."
 WET_KIS_X05_special_tt:0 "+15% planning speed for 180 days; offer the host a joint liberation plan with refusal allowed."
 WET_KIS_X06:0 "The Bear Returns"
 WET_KIS_X06_desc:0 "Recognise the army's actual return to Kislev. The government can speak of return only when Kislevite soil and the capital are truly in its hands."
 WET_KIS_X06_requirement:0 "Kislev was genuinely in exile; now own and control Kislev City and at least §Y3§! baseline states."
 WET_KIS_X06_special_tt:0 "Gain 5% Stability and reopen lawful homeland construction claims."
 WET_KIS_X07:0 "Rebuild What Remains"
 WET_KIS_X07_desc:0 "Restore enough of the homeland to govern it again. Recovery begins with the roads and workshops that allow ordinary government to function again."
 WET_KIS_X07_special_tt:0 "+20% repair speed for 365 days; two infrastructure levels across held home states, capped."
