 wet_kis_activate_long_defence:0 "Activate: Long Defence"
 wet_kis_activate_long_defence_desc:0 "Arm Long Defence: +20% core defence, +15% organisation and -15% supply use for 180 days; activate in war for 50 PP. One use; followed by 60 days of -10% recovery. No other major combat effort may overlap."
 wet_kis_activate_long_defence_effect:0 "Arm Long Defence: §Y+20%§! core defence, §Y+15%§! organisation and §Y-15%§! supply use for §Y180§! days; activate in war for §Y50§! Political Power. One use; followed by §Y60§! days of §Y-10%§! recovery. No other major combat effort may overlap."
