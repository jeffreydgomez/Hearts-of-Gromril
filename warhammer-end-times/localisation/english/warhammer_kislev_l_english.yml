 wet_kis_activate_last_stand_effect:0 "Arm Last Stand: §Y+25%§! infantry defence / §Y+15%§! organisation for §Y90§! days; activation §Y50§! Political Power + §Y300§! infantry equipment. One use; followed by §Y60§! days of §Y-10%§! recovery. No other major combat effort may overlap."
