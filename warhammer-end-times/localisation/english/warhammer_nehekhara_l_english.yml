l_english:
 WET_NEH_A00:0 "Review the Eternal Legions"
 WET_NEH_A00_desc:0 "Bring the captains of the restored legions before the royal court."
 WET_NEH_A01:0 "Drill the Skeleton Cohorts"
 WET_NEH_A01_desc:0 "Restore disciplined formations to the ranks of the dead."
 WET_NEH_A02:0 "The Tomb Guard's Standard"
 WET_NEH_A02_desc:0 "Make the steadfastness of the royal guard an example to every cohort."
 WET_NEH_A03:0 "Renew the Legion Arsenals"
 WET_NEH_A03_desc:0 "Replace worn weapons with the patterns of the renewed arsenals."
 WET_NEH_A04:0 "The Chariot Schools"
 WET_NEH_A04_desc:0 "Restore the chariot schools of the old kings."
 WET_NEH_A05:0 "Maneuvers on the Open Sands"
 WET_NEH_A05_desc:0 "Teach the army to coordinate its movements across the desert."
 WET_NEH_A06:0 "The Hammer of the King"
 WET_NEH_A06_desc:0 "Use massed chariot assaults to break the enemy's line."
 WET_NEH_A07:0 "Wake the Stone Guardians"
 WET_NEH_A07_desc:0 "Bring the workshops of the great constructs into the army's planning."
 WET_NEH_A08:0 "Restore the Sacred Engines"
 WET_NEH_A08_desc:0 "Train the attendants who keep the sacred war engines in service."
 WET_NEH_A09:0 "The Construct Battle Line"
 WET_NEH_A09_desc:0 "Coordinate the stone guardians with the advancing cohorts."
 WET_NEH_A10:0 "The Royal General Staff"
 WET_NEH_A10_desc:0 "Give the captains a common language of campaign planning."
 WET_NEH_A11:0 "Siegecraft of the Old Kings"
 WET_NEH_A11_desc:0 "Recover the siege methods once used against the cities of the living."
 WET_NEH_A12:0 "An Unbroken Battle Rhythm"
 WET_NEH_A12_desc:0 "Keep fresh cohorts moving into the battle line as others reform."
 WET_NEH_A13:0 "The King of Kings' Host"
 WET_NEH_A13_desc:0 "Make the legion captains answer to a single campaign command."
 WET_NEH_B00:0 "Survey the Northern Marches"
 WET_NEH_B00_desc:0 "Survey the northern approaches beneath the Barrier Idols."
 WET_NEH_B01:0 "Fortify the Western Idols"
 WET_NEH_B01_desc:0 "Raise a permanent line against the raiders of Vulchaz."
 WET_NEH_B02:0 "Fortify the Eastern Idols"
 WET_NEH_B02_desc:0 "Close the eastern approaches from Blightwater."
 WET_NEH_B03:0 "Supply the Northern Garrison"
 WET_NEH_B03_desc:0 "Maintain roads and depots behind the northern defensive line."
 WET_NEH_B04:0 "Wardens of the Barrier"
 WET_NEH_B04_desc:0 "Establish permanent commands for the northern garrisons."
 WET_NEH_B05:0 "The Watchtowers Renewed"
 WET_NEH_B05_desc:0 "Strengthen the original line without extending it into foreign lands."
 WET_NEH_B06:0 "Assert the Northern Claims"
 WET_NEH_B06_desc:0 "Reassert the crown's claim over the neighboring Badlands."
 WET_NEH_B07:0 "Chart the Badlands Approaches"
 WET_NEH_B07_desc:0 "Prepare routes through the broken country beyond the frontier."
 WET_NEH_B08:0 "Prepare the Northern Campaign"
 WET_NEH_B08_desc:0 "Concentrate the frontier army for a limited northern campaign."
 WET_NEH_B09:0 "A Secure Northern Frontier"
 WET_NEH_B09_desc:0 "Make the northern marches a lasting shield for the empire."
 WET_NEH_C00:0 "The Priests and the Crown"
 WET_NEH_C00_desc:0 "Summon the custodians of the dead to settle their place in the empire."
 WET_NEH_C01:0 "The Crown Commands the Cult"
 WET_NEH_C01_desc:0 "Bind the priesthood to the commands of the royal court."
 WET_NEH_C02:0 "A Compact of Crown and Temple"
 WET_NEH_C02_desc:0 "Divide authority between temporal rule and sacred obligation."
 WET_NEH_C03:0 "The High Priests Ascendant"
 WET_NEH_C03_desc:0 "Entrust the priesthood with a commanding voice in the empire."
 WET_NEH_C04:0 "Royal Inspectors of the Tombs"
 WET_NEH_C04_desc:0 "Place the muster of the tomb legions under royal inspection."
 WET_NEH_C05:0 "Temple Service to the Throne"
 WET_NEH_C05_desc:0 "Turn temple workshops toward the crown's military demands."
 WET_NEH_C06:0 "The King's Word Is Law"
 WET_NEH_C06_desc:0 "Make royal command reach every deathless captain without dispute."
 WET_NEH_C07:0 "Joint Colleges of Restoration"
 WET_NEH_C07_desc:0 "Let royal craftsmen and priests restore the ancient constructs together."
 WET_NEH_C08:0 "Arbiters of the Sacred Trust"
 WET_NEH_C08_desc:0 "Give disputed obligations a recognized place of judgment."
 WET_NEH_C09:0 "Custodians of the Common Works"
 WET_NEH_C09_desc:0 "Join the temples and crown in maintaining the roads of the realm."
 WET_NEH_C10:0 "Endow the Great Temples"
 WET_NEH_C10_desc:0 "Restore the great sanctuaries as centers of instruction and binding."
 WET_NEH_C11:0 "The Priesthood's Silent Legions"
 WET_NEH_C11_desc:0 "Teach the legions to answer the priesthood's unified rites."
 WET_NEH_C12:0 "The Great Mortuary Convocation"
 WET_NEH_C12_desc:0 "Gather the cult to choose which work deserves its next endowment."
 WET_NEH_C13:0 "An Enduring Settlement"
 WET_NEH_C13_desc:0 "Set down the obligations of king and priest in a lasting charter."
 WET_NEH_COVENANT:0 "The Sand and Sea Covenant"
 WET_NEH_Council:0 "The Mortuary Council"
 WET_NEH_D00:0 "Look West Across the Sands"
 WET_NEH_D00_desc:0 "Settle the empire's approach to its western neighbor."
 WET_NEH_D01:0 "The Crown Claims Araby"
 WET_NEH_D01_desc:0 "Assert the ancient crown's claim to dominion in the west."
 WET_NEH_D02:0 "Offer the Covenant of Sand and Sea"
 WET_NEH_D02_desc:0 "Offer the western realm a place beside the eternal crown."
 WET_NEH_D03:0 "Muster for the Western War"
 WET_NEH_D03_desc:0 "Concentrate the desert legions against the western armies."
 WET_NEH_D04:0 "Caravans for the Campaign"
 WET_NEH_D04_desc:0 "Give the advancing army a temporary mobile support train."
 WET_NEH_D05:0 "The Western Arsenal Levy"
 WET_NEH_D05_desc:0 "Order an exceptional production effort for the western campaign."
 WET_NEH_D06:0 "Break the Western Line"
 WET_NEH_D06_desc:0 "Commit the chariot reserves at the decisive point."
 WET_NEH_D07:0 "Secure the Conquered Ports"
 WET_NEH_D07_desc:0 "Bring the captured coastal yards into the royal naval system."
 WET_NEH_D08:0 "Respect Between Sovereigns"
 WET_NEH_D08_desc:0 "Establish the conventions of an alliance between equals."
 WET_NEH_D09:0 "The Exchange of Scholars"
 WET_NEH_D09_desc:0 "Let the learned courts exchange useful techniques."
 WET_NEH_D10:0 "The Caravan Charter"
 WET_NEH_D10_desc:0 "Secure the movement of merchants and supplies between the realms."
 WET_NEH_D11:0 "The Sand and Sea Research Council"
 WET_NEH_D11_desc:0 "Give scholarly cooperation a permanent home in the alliance."
 WET_NEH_D12:0 "Joint Harbour Contracts"
 WET_NEH_D12_desc:0 "Build the maritime foundations of the new partnership."
 WET_NEH_D13:0 "A Prosperous Western Accord"
 WET_NEH_D13_desc:0 "Make cooperation yield a lasting material benefit for both realms."
 WET_NEH_F00:0 "Summon the Fleet Captains"
 WET_NEH_F00_desc:0 "Bring the scattered royal captains into one council."
 WET_NEH_F01:0 "The Coastal Patrols"
 WET_NEH_F01_desc:0 "Organize reliable patrols along the empire's shores."
 WET_NEH_F02:0 "Convoy Guardians"
 WET_NEH_F02_desc:0 "Protect the transports that sustain commerce and distant armies."
 WET_NEH_F03:0 "The Great Warships"
 WET_NEH_F03_desc:0 "Revive the tradition of the royal battle fleet."
 WET_NEH_F04:0 "Disciplined Broadsides"
 WET_NEH_F04_desc:0 "Teach crews and captains to strike in concert."
 WET_NEH_F05:0 "The Admiralty of Zandri"
 WET_NEH_F05_desc:0 "Give the empire's fleets a permanent admiralty."
 WET_NEH_F06:0 "Shipwrights of the Eternal Crown"
 WET_NEH_F06_desc:0 "Standardize the craft of the royal shipwrights."
 WET_NEH_F07:0 "The Repair Anchorages"
 WET_NEH_F07_desc:0 "Prepare sheltered anchorages to return damaged ships to service."
 WET_NEH_F08:0 "A Fleet Beyond the Horizon"
 WET_NEH_F08_desc:0 "Prepare the royal fleet for longer voyages."
 WET_NEH_F09:0 "Masters of the Southern Seas"
 WET_NEH_F09_desc:0 "Give the restored fleet the institutions to endure."
 WET_NEH_I00:0 "Count the Silent Workshops"
 WET_NEH_I00_desc:0 "Survey the workshops that can serve the reunited realm."
 WET_NEH_I01:0 "Reopen Khemri's Craft Courts"
 WET_NEH_I01_desc:0 "Bring the craft courts beneath the royal walls back into use."
 WET_NEH_I02:0 "The Bronze Forges of Quatar"
 WET_NEH_I02_desc:0 "Restore the forges that equip the eastern legions."
 WET_NEH_I03:0 "Numas Manufactories"
 WET_NEH_I03_desc:0 "Expand the workshops beside the upper river roads."
 WET_NEH_I04:0 "The Arsenal of Mahrak"
 WET_NEH_I04_desc:0 "Refit the eastern arsenals for sustained campaigns."
 WET_NEH_I05:0 "Quarries of the Barrier Idols"
 WET_NEH_I05_desc:0 "Put the ancient quarry workings back under measured production."
 WET_NEH_I06:0 "Restoration Crews"
 WET_NEH_I06_desc:0 "Train dedicated teams to repair war damage."
 WET_NEH_I07:0 "Craftsmen of Ka-Sabar"
 WET_NEH_I07_desc:0 "Extend royal manufacture to the southern routes."
 WET_NEH_I08:0 "Lybaras Armament Courts"
 WET_NEH_I08_desc:0 "Equip the southeastern armies close to their garrisons."
 WET_NEH_I09:0 "Reserve Workshops"
 WET_NEH_I09_desc:0 "Provide spare production away from the great capitals."
 WET_NEH_I10:0 "The Empire's Forge Charter"
 WET_NEH_I10_desc:0 "Give distant workshops a shared system of production schedules."
 WET_NEH_I11:0 "Efficient Royal Works"
 WET_NEH_I11_desc:0 "Apply the lessons of the rebuilding programme to every new workshop."
 WET_NEH_I12:0 "The Great Arsenal Network"
 WET_NEH_I12_desc:0 "Distribute military production across the breadth of the empire."
 WET_NEH_I13:0 "Industry Without Slumber"
 WET_NEH_I13_desc:0 "Keep the renewed workshops working to a common standard."
 WET_NEH_M00:0 "The World Has Changed"
 WET_NEH_M00_desc:0 "Order a reckoning of the knowledge lost during the long sleep."
 WET_NEH_M01:0 "Unseal the Workshops"
 WET_NEH_M01_desc:0 "Recover the tools sealed with the master craftsmen."
 WET_NEH_M02:0 "Read Beyond the Funerary Texts"
 WET_NEH_M02_desc:0 "Permit scholars to study the discoveries of younger realms."
 WET_NEH_M03:0 "Teach the Deathless Artisans"
 WET_NEH_M03_desc:0 "Teach the silent workshops methods suited to the present age."
 WET_NEH_M04:0 "Reconcile the Ancient Canons"
 WET_NEH_M04_desc:0 "Test inherited wisdom against repeatable observation."
 WET_NEH_M05:0 "An Empire Reawakened"
 WET_NEH_M05_desc:0 "Keep the grandeur of antiquity while casting off its paralysis."
 WET_NEH_M06:0 "Surveyors of the Royal Archives"
 WET_NEH_M06_desc:0 "Catalogue the mathematical knowledge buried in the royal archives."
 WET_NEH_M07:0 "Lessons of Foreign Artificers"
 WET_NEH_M07_desc:0 "Translate foreign instruments into the language of the court."
 WET_NEH_M08:0 "The Khemri Academy"
 WET_NEH_M08_desc:0 "Give the empire a permanent college of practical learning."
 WET_NEH_M09:0 "The Restored Library of Numas"
 WET_NEH_M09_desc:0 "Bring scattered scholarly copies together in one ordered collection."
 WET_NEH_M10:0 "Standard Measures of the Crown"
 WET_NEH_M10_desc:0 "Make the royal cubit govern every workshop."
 WET_NEH_M11:0 "Interchangeable Bronze Fittings"
 WET_NEH_M11_desc:0 "Allow one workshop to repair another workshop's mechanisms."
 WET_NEH_M12:0 "A School of Applied Rites"
 WET_NEH_M12_desc:0 "Apply old enchantments to new engineering problems."
 WET_NEH_M13:0 "Knowledge in Every Necropolis"
 WET_NEH_M13_desc:0 "Distribute copies of useful discoveries through the necropolises."
 WET_NEH_M14:0 "Masters of Two Ages"
 WET_NEH_M14_desc:0 "Combine the precision of the old masters with renewed methods."
 WET_NEH_M15:0 "A Living Tradition of Learning"
 WET_NEH_M15_desc:0 "Make revision of accepted knowledge a duty of the royal scholars."
 WET_NEH_N00:0 "The Enemy Beneath the Sand"
 WET_NEH_N00_desc:0 "Expose the hidden loyalties that stir when the court speaks of war against Nagash."
 WET_NEH_N01:0 "Defy the Usurper's Realm"
 WET_NEH_N01_desc:0 "Order the destruction of the realm that prepares the usurper's return."
 WET_NEH_N02:0 "Seal the Compromised Tombs"
 WET_NEH_N02_desc:0 "Close the suspect tomb colleges, accepting the loss of their learning."
 WET_NEH_N03:0 "Turn Informants in the Temples"
 WET_NEH_N03_desc:0 "Use informants to watch the hidden faithful without closing the schools."
 WET_NEH_N04:0 "Wards Against the Great Necromancer"
 WET_NEH_N04_desc:0 "Prepare the legions to resist hostile rites from the north."
 WET_NEH_N05:0 "March on Nagashizzar"
 WET_NEH_N05_desc:0 "Commit the royal host to the destruction of the usurper's stronghold."
 WET_NEH_N06:0 "Cleanse the Inner Sanctuaries"
 WET_NEH_N06_desc:0 "Recover the trustworthy rites preserved in the suspect colleges."
 WET_NEH_N07:0 "The Hidden Congregations Broken"
 WET_NEH_N07_desc:0 "End the organized influence of the hidden congregations."
 WET_NEH_N08:0 "Cast Down the Usurper's Seat"
 WET_NEH_N08_desc:0 "Mark the fall of the usurper's seat with a gathering of the royal host."
 WET_NEH_N09:0 "Nehekhara Will Not Kneel"
 WET_NEH_N09_desc:0 "Proclaim the independence of the eternal crown before every temple."
 WET_NEH_R00:0 "Survey the Imperial Routes"
 WET_NEH_R00_desc:0 "Trace the routes that can bind the scattered necropolises together."
 WET_NEH_R01:0 "The Khemri to Zandri Line"
 WET_NEH_R01_desc:0 "Link the royal capital to the western coast."
 WET_NEH_R02:0 "Rails Along the Ash River"
 WET_NEH_R02_desc:0 "Carry the royal supply trains toward Quatar."
 WET_NEH_R03:0 "The Road to Numas"
 WET_NEH_R03_desc:0 "Join Numas to the capital's transport network."
 WET_NEH_R04:0 "The Southern Imperial Line"
 WET_NEH_R04_desc:0 "Connect the southern workshops to the heart of the empire."
 WET_NEH_R05:0 "The Lybaras Connection"
 WET_NEH_R05_desc:0 "Extend the Ash River line to the eastern shipyards."
 WET_NEH_R06:0 "Royal Rail Dispatchers"
 WET_NEH_R06_desc:0 "Give the new lines a common dispatch service."
 WET_NEH_R07:0 "Zandri Shipyards"
 WET_NEH_R07_desc:0 "Rebuild the slipways of the western fleet."
 WET_NEH_R08:0 "Lybaras Shipyards"
 WET_NEH_R08_desc:0 "Restore a second center of royal shipbuilding in the east."
 WET_NEH_R09:0 "Harbours of the Two Seas"
 WET_NEH_R09_desc:0 "Provide the expanded yards with secure fleet anchorages."
 WET_NEH_R10:0 "Imperial Freight Trains"
 WET_NEH_R10_desc:0 "Assign dedicated supply trains to the royal network."
 WET_NEH_R11:0 "The Great Coastal Works"
 WET_NEH_R11_desc:0 "Extend the shipbuilding programme to the central ports."
 WET_NEH_S00:0 "Heed the Whisper of Nagash"
 WET_NEH_S00_desc:0 "Listen to the priests who call the eternal crown a prison for the dead."
 WET_NEH_S01:0 "Open the Hidden Congregations"
 WET_NEH_S01_desc:0 "Bring the hidden faithful into contact with the mortuary colleges."
 WET_NEH_S02:0 "Priests of the Undying King"
 WET_NEH_S02_desc:0 "Prepare the rites by which the priesthood will claim the realm."
 WET_NEH_S03:0 "Shatter the Crown of Khemri"
 WET_NEH_S03_desc:0 "Raise the temples against the King of Kings."
 WET_NEH_S04:0 "The Sovereign Covenant"
 WET_NEH_S04_desc:0 "Bind the new court to Nagash without surrendering the realm's independence."
 WET_NEH_S05:0 "The War for the Black Crown"
 WET_NEH_S05_desc:0 "Gather the faithful legions against the royalist host."
 WET_NEH_S06:0 "One Realm Beneath the Black Crown"
 WET_NEH_S06_desc:0 "Reunite the tomb kingdoms beneath the victorious council."
 WET_NEH_S07:0 "Envoys of the Deathless Alliance"
 WET_NEH_S07_desc:0 "Send the council's priests to study with the deathless alliance."
