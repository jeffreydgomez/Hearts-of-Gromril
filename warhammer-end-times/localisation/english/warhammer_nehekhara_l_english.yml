 wet_nehekhara.1.0:0 "The court has heard."
 wet_nehekhara.1.d:0 "[Z14.GetNameDef] has accepted our envoys. The agreement recognizes the government of Nehekhara and binds the two realms as independent allies."
 wet_nehekhara.1.t:0 "The Covenant of Sand and Sea — Accepted"
 wet_nehekhara.2.0:0 "The court has heard."
 wet_nehekhara.2.d:0 "Our envoys have returned from [Z14.GetNameDef] without an agreement. Nehekhara retains its independence and must decide its own course."
 wet_nehekhara.2.t:0 "The Covenant of Sand and Sea — Refused"
 wet_nehekhara.3.0:0 "The court has heard."
 wet_nehekhara.3.d:0 "The envoys could not conclude the agreement before their authority expired. The court may renew the proposal when circumstances permit."
 wet_nehekhara.3.t:0 "The Covenant of Sand and Sea — Unfulfilled"
 wet_nehekhara.4.0:0 "Accept the sovereign alliance."
 wet_nehekhara.4.1:0 "Refuse the offer."
 wet_nehekhara.4.d:0 "The envoys of Nehekhara offer an alliance between sovereign realms. The western coast and the ancient river kingdoms would share counsel, workshops and the protection of their fleets. Neither crown would become the subject of the other."
 wet_nehekhara.4.t:0 "The Covenant of Sand and Sea"
 wet_nehekhara.5.0:0 "The court has heard."
 wet_nehekhara.5.d:0 "[U24.GetNameDef] has accepted our envoys. The agreement recognizes the government of Nehekhara and binds the two realms as independent allies."
 wet_nehekhara.5.t:0 "The Sovereign Covenant of Nehekhara — Accepted"
 wet_nehekhara.6.0:0 "The court has heard."
 wet_nehekhara.6.d:0 "Our envoys have returned from [U24.GetNameDef] without an agreement. Nehekhara retains its independence and must decide its own course."
 wet_nehekhara.6.t:0 "The Sovereign Covenant of Nehekhara — Refused"
 wet_nehekhara.7.0:0 "The court has heard."
 wet_nehekhara.7.d:0 "The envoys could not conclude the agreement before their authority expired. The court may renew the proposal when circumstances permit."
 wet_nehekhara.7.t:0 "The Sovereign Covenant of Nehekhara — Unfulfilled"
 wet_nehekhara.8.0:0 "Accept the sovereign alliance."
 wet_nehekhara.8.1:0 "Refuse the offer."
 wet_nehekhara.8.d:0 "The Mortuary Council offers allegiance to the deathless alliance, but reserves the rule of Nehekhara to its own court. If our realms are fighting, the envoys ask that those hostilities end before the new alliance is sealed. The council still faces the royalist armies within its homeland."
 wet_nehekhara.8.t:0 "The Sovereign Covenant of Nehekhara"
 wet_nehekhara.9.0:0 "The council will hold the realm."
 wet_nehekhara.9.d:0 "The temples have proclaimed a new council at Numas. From Khemri, Settra calls the faithful legions to his banner and swears that Nehekhara will never serve Nagash. The burial roads carry the standards of two rival courts, each claiming the right to command the dead."
 wet_nehekhara.9.t:0 "The Crown Splits"
